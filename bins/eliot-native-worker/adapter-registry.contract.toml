  "cargo check --locked -p eliot-native-worker-core -p eliot-native-worker -p eliot-agent-claude -p eliot-agent-codex -p eliot-agent-opencode -p eliot-agent-acp --all-targets",
  "cargo test --locked -p eliot-native-worker-core -p eliot-native-worker -p eliot-agent-claude -p eliot-agent-codex -p eliot-agent-opencode -p eliot-agent-acp --all-targets",
  "cargo clippy --locked -p eliot-native-worker-core -p eliot-native-worker -p eliot-agent-claude -p eliot-agent-codex -p eliot-agent-opencode -p eliot-agent-acp --all-targets -- -D warnings",
  "cargo tree --locked -p eliot-native-worker --edges normal",
  "git diff --check",
]
edge_proof = "Run one admitted attempt per ready provider plus unknown/duplicate/stale selection, cancellation, timeout, crash, credential revocation, result-delivery loss, drain/cutover and rollback under one real native-worker generation."
