[package]
name = "eliot-watchdog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Production watchdog composition root"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-watchdog"
path = "src/main.rs"

[dependencies]
eliot-contracts.workspace = true
eliot-host-state.workspace = true
eliot-installation.workspace = true
eliot-ors.workspace = true
eliot-platform-windows.workspace = true
eliot-watchdog-core.workspace = true
eliot-runtime.workspace = true
eliot-runtime-contracts.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Services", "Win32_Storage_FileSystem"] }

[dev-dependencies]
eliot-runtime-contracts.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
