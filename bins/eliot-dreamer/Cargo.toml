[package]
name = "eliot-dreamer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded, supervised ELIOT Dreamer service"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-dreamer"
path = "src/main.rs"

[dependencies]
eliot-cli.workspace = true
eliot-contracts.workspace = true
eliot-dreamer-bundle = { path = "../../crates/smart/eliot-dreamer-bundle", version = "0.1.0" }
eliot-dreamer-contracts = { path = "../../crates/smart/eliot-dreamer-contracts", version = "0.1.0" }
eliot-dreamer-curation = { path = "../../crates/smart/eliot-dreamer-curation", version = "0.1.0" }
eliot-dreamer-cycle = { path = "../../crates/smart/eliot-dreamer-cycle", version = "0.1.0" }
eliot-dreamer-candidate-validation = { path = "../../crates/smart/eliot-dreamer-candidate-validation", version = "0.1.0" }
eliot-dreamer-claim-grounding = { path = "../../crates/smart/eliot-dreamer-claim-grounding", version = "0.1.0" }
eliot-dreamer-probe-plan = { path = "../../crates/smart/eliot-dreamer-probe-plan", version = "0.1.0" }
eliot-dreamer-orientation = { path = "../../crates/smart/eliot-dreamer-orientation", version = "0.1.0" }
eliot-dreamer-rival-model = { path = "../../crates/smart/eliot-dreamer-rival-model", version = "0.1.0" }
eliot-platform.workspace = true
eliot-process.workspace = true
eliot-process-executor.workspace = true
eliot-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
eliot-context-contracts = { path = "../../crates/smart/eliot-context-contracts", version = "0.1.0" }
