[package]
name = "eliot-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ELIOT Host lifecycle and durable operational-state entrypoint"

[[bin]]
name = "eliot-host"
path = "src/main.rs"

[dependencies]
eliot-contracts.workspace = true
eliot-host-control-endpoint.workspace = true
eliot-host-service.workspace = true
eliot-kernel-core.workspace = true
eliot-installation.workspace = true
eliot-ipc.workspace = true
eliot-kernel-service.workspace = true
eliot-host-state.workspace = true
eliot-observation-contracts.workspace = true
eliot-ors.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-process.workspace = true
eliot-protocol.workspace = true
eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Services"] }

[dev-dependencies]
eliot-host-state = { workspace = true, features = ["test-support"] }
eliot-installation = { workspace = true, features = ["test-support"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
