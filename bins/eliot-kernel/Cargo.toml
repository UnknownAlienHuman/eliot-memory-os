[package]
name = "eliot-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ELIOT Kernel composition root and lifecycle entrypoint"

[lib]
path = "src/lib.rs"

[features]
default = []
# compat alias: real feature lives in eliot-r13-harness; keep parsing
r13-os-harness = []

[[bin]]
name = "eliot-kernel"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
# Workspace edge (issue #974 N2, requested by the issue-959 report):
# immutable content-addressed artifact identity, raw evidence handles,
# omission references and lineage manifests live in eliot-artifact, which is
# an already-admitted workspace member.
#
# This edge is PREPARATION and is currently UNCONSUMED: no module under
# bins/eliot-kernel/src names `eliot_artifact`. #974's "Must not modify" section
# forbids Rust source edits in this issue, so the edge is declared ahead of the
# restore path that will consume it. An unused dependency is not a resolution of
# that path; do not read this line as evidence that artifact identity is already
# resolved here.
eliot-artifact.workspace = true
eliot-authority.workspace = true
eliot-backup = { path = "../../crates/storage/eliot-backup", version = "0.1.0" }
eliot-contracts.workspace = true
eliot-installation.workspace = true
eliot-kernel-core.workspace = true
eliot-kernel-service.workspace = true
eliot-ipc.workspace = true
# Path edge (issue #1842, I16.3/I16.9): eliot-observability is a workspace
# member but has no [workspace.dependencies] entry, so a path+version edge
# keeps root Cargo.toml and workspace membership byte-identical, exactly as
# bins/eliotd declares it. No version upgrade: versions match the member
# manifest.
eliot-observability = { path = "../../crates/instrument/eliot-observability", version = "0.1.0" }
# Workspace edge (issue #1841, I16.2/I16.5): the bounded-label OpenMetrics
# registry, exporter and execution-path recorders live in
# eliot-observability-runtime, which HAS a [workspace.dependencies] entry, so
# this is a plain workspace edge. scripts/audit-architecture-boundaries.py
# permits it: the crate is in no forbidden_exact/forbidden_prefix set of the
# eliot-kernel runtime root (issue #15), and its closure (eliot-contracts,
# eliot-platform-windows, serde, serde_json, thiserror, tracing,
# tracing-subscriber) adds no forbidden reach.
#
# Issue #1836 (W1): the same edge, and the reason this composition root
# installs the shared observability runtime from `main` before any live work
# starts.
eliot-observability-runtime.workspace = true
eliot-ors.workspace = true
eliot-process-executor.workspace = true
eliot-protocol.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-runtime.workspace = true
eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
eliot-security-contracts.workspace = true
eliot-store-api.workspace = true
eliot-testd-core.workspace = true
eliot-user-broker-core.workspace = true
eliot-workscope.workspace = true
eliot-process.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
eliot-instrument-api.workspace = true
eliot-ipc = { workspace = true, features = ["test-support"] }
eliot-kernel-service = { workspace = true, features = ["test-support"] }
eliot-ors = { workspace = true, features = ["test-support"] }
eliot-platform-windows = { workspace = true, features = ["test-support"] }
eliot-runtime-status.workspace = true
eliot-installation.workspace = true
redb.workspace = true
# S-CONC-ACCEPT (issue #994, test-only): Store reference + real adapter edges.
# Path edge: eliot-store-memory is a workspace member but has no
# [workspace.dependencies] entry, so a path+version edge keeps root
# Cargo.toml and workspace membership byte-identical. No version upgrade:
# versions match the member manifests exactly.
eliot-store-memory = { path = "../../crates/storage/eliot-store-memory", version = "0.1.0" }
eliot-store-surreal-adapter.workspace = true
secrecy.workspace = true

[lints]
workspace = true
