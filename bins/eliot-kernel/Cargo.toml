[package]
name = "eliot-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ELIOT Kernel composition root and lifecycle entrypoint"

[lib]
path = "src/lib.rs"

[features]
default = []
# compat alias: real feature lives in eliot-r13-harness; keep parsing
r13-os-harness = []

[[bin]]
name = "eliot-kernel"
path = "src/main.rs"

[dependencies]
eliot-contracts.workspace = true
eliot-kernel-core.workspace = true
eliot-kernel-service.workspace = true
eliot-ipc.workspace = true
eliot-ors.workspace = true
eliot-process-executor.workspace = true
eliot-protocol.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-runtime.workspace = true
eliot-runtime-contracts.workspace = true
eliot-store-api.workspace = true
eliot-process.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
eliot-ipc = { workspace = true, features = ["test-support"] }
eliot-ors = { workspace = true, features = ["test-support"] }
eliot-platform-windows = { workspace = true, features = ["test-support"] }
eliot-runtime-status.workspace = true
eliot-installation.workspace = true
redb.workspace = true
# S-CONC-ACCEPT (issue #994, test-only): Store reference + real adapter edges.
# Path edge: eliot-store-memory is a workspace member but has no
# [workspace.dependencies] entry, so a path+version edge keeps root
# Cargo.toml and workspace membership byte-identical. No version upgrade:
# versions match the member manifests exactly.
eliot-store-memory = { path = "../../crates/storage/eliot-store-memory", version = "0.1.0" }
eliot-store-surreal-adapter.workspace = true
secrecy.workspace = true

[lints]
workspace = true
