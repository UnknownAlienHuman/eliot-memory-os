# S-CONC-ACCEPT finite profile for issue #994 (frozen workload binding).
# Corpus: bins/eliot-kernel/tests/data/store_concurrency_cases.json
# Numbers here own the denominator; tests assert these exact values.
# Hand-parseable flat sections only: no new dependency may read this file.

[sconc994]
