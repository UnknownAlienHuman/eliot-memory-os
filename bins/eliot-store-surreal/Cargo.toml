[package]
name = "eliot-store-surreal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ELIOT canonical SurrealDB store service"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-store-surreal"
path = "src/main.rs"

[dependencies]
# Issue #1871: the closed store bridge is the only admitted production owner of
# the Surreal vendor edge (`config/architecture-boundaries.toml` `[store_vendor]
# allowed_packages`), so it is the only root that can reach the adapter's
# single-transaction `capture_ecxf_source`. It is the first admitted caller of
# `eliot_backup::export_ecxf_package`, the single `ECXF/1` export entry, and it
# is not in this root's `forbidden_exact` list.
eliot-backup = { path = "../../crates/storage/eliot-backup", version = "0.1.0" }
eliot-contracts.workspace = true
eliot-kernel-service.workspace = true
eliot-ipc.workspace = true
eliot-installation.workspace = true
# Issue #1836 (W1): the shared observability runtime this composition root
# installs from `main` before any live work starts.
eliot-observability-runtime.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-protocol.workspace = true
eliot-runtime-contracts.workspace = true
eliot-store-api.workspace = true
eliot-store-surreal-adapter.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
eliot-runtime-contracts.workspace = true

[lints]
workspace = true
