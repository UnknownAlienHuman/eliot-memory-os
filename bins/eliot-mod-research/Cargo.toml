[package]
name = "eliot-mod-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kernel-gated ELIOT Researcher provider process; fails closed when the Kernel front door is unreachable or a reply does not verify"

[package.metadata.eliot]
# Issue #24 research-provider capability declaration.
#
# `functional_cell` names the cell this package's own source implements. It is
# the same spelling the Kernel's authenticated research dispatch presents as
# `ResearchProviderDispatch::module_id`, which `ProviderAdmission` seals as its
# `CapabilityCellId` and which the launched `ImageId` is compared against
# (`execution.rs`). Declaring it here is what turns that identity from free text
# into a catalogued capability cell: `scripts/gen_capability_cell_registry.py`
# projects it into a generated `CapabilityCellRecord`, and
# `eliot_mod_research::capability_cell::bind_declared_cell` refuses any
# admission whose sealed cell id the generated registry does not declare with a
# current validated proof surface. Without this declaration the record cannot
# exist and the proof surface is unbound.
#
# `lifecycle_owner` / `work_id` name the work unit that owns this runtime root,
# taken from the repository's own owner tables rather than invented:
# `bins/AGENTS.md` records "eliot-mod-research | governed provider acquisition;
# candidate-only output, #24", `workstreams/core-daemons/AGENTS.md` records
# "#24 | governed Researcher provider process bridge", and this unit's own
# assignment record `workstreams/core-daemons/assignments/
# 024-research-provider-runtime.toml` carries `issue = 24`. No architecture item
# id names the research plane, so the owner is spelled as the issue work unit
# rather than as a made-up `A-nn` item.
#
# The three markers below are carried verbatim from that same assignment record
# (lines 4-6), so the manifest states the research provider's real support
# level instead of implying a stronger one.
work_id = "issue-24"
functional_cell = "mod-research-provider"
lifecycle_owner = "issue-24"
implementation_support = "GOVERNED_PROVIDER_BRIDGE_SOURCE_CURRENT_UNVERIFIED"
evidence_execution_status = "SOURCE_AUDIT_EXECUTED_EDGE_PROOF_NOT_EXECUTED"
proof_ceiling = "RESEARCH_PROVIDER_EDGE_CANDIDATE"
# Mirrors the `crates/modules/eliot-native-worker-core` precedent: the package's
# own test target is the honest proof surface for this source. This is a
# command, not an ownership claim. `scripts/code_navigation.py capsules` derives
# the matching `ModuleTestCapsule::independent_proof_entrypoint` from this exact
# field, and the registry generator refuses to emit a record whose test capsule
# disagrees with it.
proof_entrypoint = "cargo test -p eliot-mod-research --all-targets --all-features"
independent_proof_profile = "eliot-mod-research"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-mod-research"
path = "src/main.rs"

[dependencies]
eliot-contracts.workspace = true
# The authenticated Kernel front-door transport. `eliot-mod-research` reaches
# it through `eliot-ipc` + `eliot-protocol` + `eliot-platform-windows` rather
# than through `eliot-cli`: the CLI crate's `eliot-bootstrap` edge reaches the
# `eliot-agent-` closure, which this runtime root forbids. These three are the
# narrowest owner crates the transport itself is built from.
eliot-ipc.workspace = true
# The Kernel-owned research-provider wire contract
# (`eliot_kernel_service::protocol::research_provider`). This crate consumes
# the owner types and defines no dispatch semantics.
eliot-kernel-service.workspace = true
# `ClockObservation` is the platform-neutral clock record the shared dispatch
# validation context is built from; `eliot-doctor` and `eliot-testd` take the
# same edge for the same reason.
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-process.workspace = true
eliot-process-executor.workspace = true
eliot-protocol.workspace = true
# `RequestBinding` is the C0-02 request/fence binding the EBP request identity
# is assembled from.
eliot-receipts.workspace = true
eliot-research-exchange.workspace = true
eliot-research-exchange-api.workspace = true
eliot-researcher.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# A real reactor is required to drive the authenticated front-door transport;
# the shared process executor future itself is polled with a noop waker and
# needs no reactor (see `execution::block_on`).
tokio.workspace = true

[lints]
workspace = true
