[package]
name = "eliot-mod-research"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Kernel-gated ELIOT Researcher provider process; standalone binary fails closed until admitted"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-mod-research"
path = "src/main.rs"

[dependencies]
eliot-contracts.workspace = true
eliot-research-exchange.workspace = true
eliot-research-exchange-api.workspace = true
eliot-researcher.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
thiserror = "2.0.18"
