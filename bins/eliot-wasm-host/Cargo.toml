[package]
name = "eliot-wasm-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Thin profile-selected ELIOT WASM component-host composition"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-wasm-host"
path = "src/main.rs"

[features]
default = ["eliot-profile-d2-operational"]
eliot-profile-d2-operational = []
eliot-profile-full-composition = []

[dependencies]
eliot-runtime = { path = "../../crates/kernel/eliot-runtime", version = "0.1.0" }
eliot-wasm-runtime = { path = "../../crates/modules/eliot-wasm-runtime", version = "0.1.0" }
