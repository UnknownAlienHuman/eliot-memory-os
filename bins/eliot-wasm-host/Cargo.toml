[package]
name = "eliot-wasm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin profile-selected ELIOT WASM component-host composition"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-wasm-host"
