[package]
name = "eliot-wasm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin profile-selected ELIOT WASM component-host composition"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-wasm-host"
path = "src/main.rs"

[features]
default = ["eliot-profile-d2-operational"]
eliot-profile-d2-operational = []
eliot-profile-full-composition = []

[dependencies]
eliot-process-executor.workspace = true
eliot-process.workspace = true
eliot-runtime.workspace = true
eliot-wasm-runtime.workspace = true
eliot-governor.workspace = true
eliot-context-contracts = { path = "../../crates/smart/eliot-context-contracts", version = "0.1.0" }
eliot-context-assembly = { path = "../../crates/smart/eliot-context-assembly", version = "0.1.0" }
eliot-improvement = { path = "../../crates/meta/eliot-improvement", version = "0.1.0" }
eliot-context-compiler-wasm = { path = "../../crates/smart/eliot-context-compiler-wasm", version = "0.1.0" }
wasmtime.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
wat.workspace = true
# Joined admitted-execution proof only: real Governor admission, real P03
# executor lane, and the owner contract crates they thread. Never used by
# the production composition below.
eliot-contracts.workspace = true
eliot-governor.workspace = true
eliot-observation-contracts.workspace = true
eliot-platform.workspace = true
eliot-process.workspace = true
eliot-process-executor.workspace = true
eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
eliot-security-contracts.workspace = true
