[package]
name = "eliot-doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded, on-demand ELIOT diagnostic and repair worker"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eliot-doctor"
