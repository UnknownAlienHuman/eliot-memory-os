]

[what_to_do]
steps = [
  "Version the protected launch schema as a stable BrokerLaunchBinding without per-operation RequestIdentity fields.",
  "Add one shared provider-neutral operation identity builder or Kernel issuer for REGISTER, HEARTBEAT_RENEWAL, AUTHORIZE_LAUNCH and FENCE_LOGOFF.",
  "Change KernelClient/KernelAuthorityPort to supply an explicit identity per transaction rather than mutable client-global ambient state.",
  "Persist and reconcile each exact operation identity through existing BrokerSnapshot and Kernel ORS owners.",
  "Migrate the old protected object explicitly without reviving its historical request authority.",
  "Preserve launch authorization to ProcessIntent/ProcessRequest lineage without collapsing those identities.",
]

[how_to_do]
steps = [
  "Define BrokerLaunchBinding v2 with installation, SID, interactive session, broker artifact/generation, launch nonce/challenge and stable policy/root references only.",
  "Remove request_id, idempotency_key, cancellation_id, absolute operation deadline and payload identity from the stable protected launch object.",
  "For every Kernel call, derive or obtain a RequestIdentity bound to operation kind, canonical payload digest, stable binding digest, current registration/epoch/fence, fresh deadline and exact retry rule.",
  "Use a new operation identity for each heartbeat revision; exact retry of one revision reuses only that revision identity.",
  "Use distinct identities for caller LaunchRequest, Kernel authorize-launch, LaunchGrant and P-03 ProcessIntent/ProcessRequest/effect while retaining explicit parent lineage.",
  "Give fence/logoff its own protected-control operation identity and reconcile unknown outcome before retry.",
  "Reject cross-operation request/cancellation/idempotency reuse and changed canonical bytes under one identity.",
  "Import v1 only through an explicit compatibility migrator: preserve old digest as evidence, extract independently valid stable fields, write v2 atomically, and create a new registration operation.",
  "Align Authority Epoch migration with #64 rather than copying scalar fields into another broker-local type.",
]

[acceptance]
criteria = [
  "Register, two heartbeat revisions, two launch authorizations and fence carry distinct request and cancellation identities.",
  "Exact retry of one operation returns the same result; changed operation kind or payload under one idempotency identity conflicts before effect.",
  "Expiry of one operation does not invalidate the stable installation/SID/session/artifact binding or future correctly admitted operations.",
  "Broker restart creates a new registration operation and cannot revive a historical RequestIdentity.",
  "Heartbeat and fence races resolve against exact registration/epoch predecessors; stale heartbeat cannot reopen a fenced registration.",
  "Unknown authorize-launch, process or fence outcome is reconciled by its own exact operation identity without blind retry.",
  "Launch config v1 is never silently interpreted as v2 and old operation fields are not copied into new authority.",
  "Kernel rejects cross-operation request_id, cancellation_id and idempotency reuse.",
  "SID/session/artifact/nonce and protected-file identity validation remain fail-closed.",
  "No raw credential, task, route, budget, approval, canonical or Finish ownership is introduced.",
]

