observations = [
  "BrokerLaunchConfig retains one complete RequestIdentity as protected launch configuration.",
  "BrokerComposition::self_register installs that identity once through KernelClient::set_request_identity.",
  "register, every heartbeat, authorize-launch and fence/logoff all call transact_json through the same mutable client identity.",
  "launch performs heartbeat and authorize-launch sequentially without installing distinct operation identities.",
  "the static absolute deadline eventually expires while the installation/SID/session/artifact binding may remain valid.",
  "KernelAuthorityPort receives only operation name and payload, so request/idempotency/deadline/cancellation identity is ambient client state.",
]
discriminator = "Register once, issue two heartbeat revisions, authorize two distinct launches and fence. Current code reuses the protected launch RequestIdentity across every operation kind and payload."

[causal_property]
statement = "The protected launch object authenticates one stable broker caller/generation, while each register, heartbeat revision, launch authorization and fence/logoff transition owns a fresh exact request, idempotency, deadline and cancellation identity with explicit lineage."

