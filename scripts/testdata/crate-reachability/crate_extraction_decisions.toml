rationale = "Own module.toml consumers=[eliot-dreamer-curation], admitted via #966; consumer is crates/smart/eliot-dreamer-curation (root member, Governor candidate disposition); issue #1720 controller wiring map (2026-09-16 comment: per-crate declared-consumer table). Edge unwired as of registry revision: no Cargo edge and no production source-construction site exists today (measured: reverse edges 0, production source_consumers 0). This row is the wiring promise, not the wire."
