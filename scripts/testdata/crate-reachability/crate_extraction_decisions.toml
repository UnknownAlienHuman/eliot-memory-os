# CrateExtractionDecision registry.
#
# This is the EXPLICIT, POLICY record the reachability inventory checks. Dispositions
# are never inferred from source statistics, name similarity or LOC. A package absent
# from this file is reported by
# `scripts/crate_reachability_inventory.py` as an `UNCLASSIFIED` admission defect,
# which is the correct, honest outcome for a package nobody has dispositioned.
#
# Adding a package here is a reviewed policy act, not a mechanical fix. Do not add an
# entry to silence the report: an unclassified package is a true finding until a human
# records a real disposition with a real owner.
#
# TWO DISJOINT CLASSIFICATION LAYERS LIVE IN THIS FILE, because the Architecture
# fixes two different vocabularies for two different denominators. Both are read and
# enforced by `scripts/crate_reachability_inventory.py`; neither is inferred.
#
# 1. `decision` - issue #1720. The classification of a package that IS a root workspace
#    member yet is unreachable from every binary or service consumer. Allowed
#    `disposition` values (exactly four):
#      Connect          - wire to its first intended binary/runtime bundle through the
#                         owning composition crate, preserving C0->C4 dependency direction.
#      ContractOnly     - library-only by intent; a real public consumer is established
#                         through a service or contract boundary.
#      MigrationFacade  - retained only as a time-bounded facade. REQUIRES `owner`,
#                         `expires`, `successor` and `removal_condition`; the tool rejects
#                         a facade whose expiry is missing, unparsable or already past.
#      OptionalContour  - optional/laboratory dependency island moved to a federated
#                         workspace contour, excluded from the root daily path while
#                         retaining an explicit invocation/proof entrypoint.
#    `source_ref` points at the record that justifies the disposition. A disposition
#    without a traceable source reference is a defect in itself.
#
# 2. `admission_decision` - issue #1721. The I2.23 "Canonical extraction decision"
#    record for a package admitted out of the root `exclude` list by an admission wave.
#    I2.23 fixes the record's thirteen field names verbatim, and I2.21 fixes the
#    outcome vocabulary, which collapses onto exactly six `disposition` values:
#      keep | split | merge | extract_contract | isolate_dependency | experiment
#    The tool compares every field of every record against the crate the record names,
#    so a record cannot be satisfied by existing:
#      - the package must be a real root-workspace member whose `module.toml`
#        `[agent_task].workspace_admission` names admission wave #966, #967 or #968,
#        and every such member must have a record (the denominator is derived from the
#        tree, never from this file);
#      - `proposed_package_boundary` must name a contour that exists on disk and a
#        package that is a member of that contour's `[workspace].members`;
#      - `public_contract_and_independent_test_entrypoint` must be a `path::symbol`
#        inside the named package, and that symbol must exist in that file;
#      - `first_real_consumer_or_time_bounded_migration_facade` must either name a
#        `path::symbol` outside the package whose owning manifest really declares a
#        Cargo dependency on it, or carry an ISO-8601 expiry that is not already past
#        together with a consumer string the crate's own `module.toml` declares;
#      - `affected_functional_cells_and_lifecycle_owners` and
#        `source_maintenance_owner_and_vendor_type_boundary` must name the crate's real
#        `functional_cell`, `lifecycle_owner` and `[agent_task].integration_owner`.
#    A `[[donor]] disposition` in a `module.toml` is a DONOR disposition in a donor
#    vocabulary and is never read as an admission disposition.

# MEASURED 2026-09-28 (issue #1721 W27, `scripts/crate_reachability_inventory.py`
# over origin/main@524010ae). The root manifest `exclude` array is EMPTY:
# `scripts/verify-excluded-dispositions-1811.py` reports root_exclude_count = 0
# against workspace_member_count = 188, and `scripts/verify-standalone-crates.py
# --list` prints no `exclude:` row. No package recorded below is pending removal
# from `exclude`, so this registry lifts nothing: a future owner's only motion
# on that array is ADDING an entry, which the #1811 gate rejects without a
# standalone disposition row.
#
# The denominator below is therefore the tree-derived admission set, never the
# content of an `exclude` array. Measured `module.toml`
# `[agent_task].workspace_admission` values: #966 -> 6 packages, #967 -> 5,
# #968 -> 3, total 14. Issue #1721's "13 currently excluded crates" is those 14
# minus eliot-self-quality, the #967 member the root manifest records as a
# former standalone nonmember that joined `members` directly and was never in
# `exclude`. The five other waves the issue names admit different packages:
# #829 -> 6 contract crates, #836 -> 5, #965 -> 6, #969 -> 5, #830 -> none.
schema = "eliot.crate-extraction-decision.v1"
# `revision` is `<owner evaluation date>.<bump>`, and that date is the clock every
# `expires` in this file is compared against by
# `scripts/crate_reachability_inventory.py::revision_date`. It is the owner's own
# reviewed record, not the wall clock, so "unexpired" is a decision somebody made
# and re-bumped at a known commit rather than a function of when the tool ran. A
# revision with no ISO-8601 date is malformed data and fails closed.
revision = "2026-09-29.1"

# Honest residual, recorded rather than hidden: `decision` is STILL EMPTY. No
# decision row has ever been recorded here - the array has been empty since this
# `decision` holds one reviewed row per production-admitted, binary-unreachable
# workspace package (issue #1720, 2026-09-29 review): 15 Connect (bundle + consumer
# both real packages; rationale states the edge is still unwired), 3 ContractOnly
# (real public consumer, library-only by intent), 15 MigrationFacade (owner,
# expiry 2027-03-31, successor, machine-checkable removal condition). Every value
# a row promises is content-checked by check_admission_decisions / _record_defects
# against the tree and the owner clock (revision), so a row naming a crate,
# contour or entrypoint that is not there is a defect on that row, not coverage.
# Rows that rest on a reading the docs do not fully determine carry an explicit
# ASSUMPTION in their rationale. The I2.23 admission decisions for the
# wave-admitted packages are recorded below, in the record shape and vocabulary
# I2.23 fixes for them.
#
# MEASURED 2026-09-29: 33 production-admitted, binary-unreachable workspace
# packages, 33 rows above, 0 UNCLASSIFIED. Of the 9 `extract_contract` #1721
# records below, 5 declare the real package eliot-dreamer-curation and 4 declare
# prose consumers; the #1720 rows above give all 9 (and the other 24) a
# four-verb disposition of their own.
