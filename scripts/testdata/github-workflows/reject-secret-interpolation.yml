name: Manual Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # N_step9 negative fixture: unquoted secret interpolation a run could
      # observe, so check_fail_closed_privilege must refuse it with GWF-021.
      # (Quoted prose is stripped before matching, so the reference is
      # deliberately unquoted: only real code is judged.)
      - name: Print token
        run: echo ${{ secrets.MY_TOKEN }}
