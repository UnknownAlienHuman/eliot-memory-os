name: Manual Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      # N_step9 negative fixture: the checkout step persists credentials, so
      # check_fail_closed_privilege must refuse it with GWF-021.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
