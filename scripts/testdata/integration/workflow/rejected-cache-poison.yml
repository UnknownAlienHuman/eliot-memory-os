name: Manual Integration Workflow Fixture cache poison (must be rejected)
# WORK_UNIT_CASE: 915/15 negative fixture. Cache paths must be restricted to
# registry/git/target state; caching repository code with a lock-unbound key
# must fail validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-manual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            src/
            .
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-unpinned
