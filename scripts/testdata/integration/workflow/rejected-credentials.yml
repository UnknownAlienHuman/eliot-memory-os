name: Manual Integration Workflow Fixture credentials (must be rejected)
# WORK_UNIT_CASE: 915/7 negative fixture. Checkouts must not persist
# credentials and no secret may flow to child steps; this fixture persists
# credentials by default and leaks a secret into run:.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-manual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Leak secret to child
        shell: pwsh
        run: echo "${{ secrets.MY_TOKEN }}"
