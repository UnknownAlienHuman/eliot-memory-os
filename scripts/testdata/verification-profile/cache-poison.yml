name: Fixture cache poison (must be rejected)
# WORK_UNIT_CASE: 750/22 negative fixture. Cache paths must be restricted to
# registry/git/target state; caching repository code and a lock-unbound key
# must fail validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            src/
            .
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-unpinned
