# ------------------------------------------------- CrateExtractionDecision ---
# I2.23 `CrateExtractionDecision` shape, all twelve fields.

[extraction_decision]
affected_functional_cells_and_lifecycle_owners = "None. The package declares no cell and owns no lifecycle. Its behaviour is owned by smart.cue.contracts (A-10), smart.cue.normalizer (A-11), smart.cue.binding (A-12), smart.cue.index (A-13), smart.cue.activation (A-14a) and smart.context.reactive_delivery_plan (A-19r / #612, B-RCTX/Host)."
current_source_dependency_and_change_closure = "src/lib.rs (751 lines) and src/legacy_adapter.rs (741 lines). Depends on eliot-cue-{contracts,normalizer,binding,index,activation}, eliot-contracts, eliot-evidence, eliot-observation, blake3, schemars, serde, serde_json, thiserror. Change closure is the package plus the generated serde registry, the cue-kind migration denominator and six owner donor anchors."
proposed_package_boundary = "None new. The boundary is already split across the five cue cells; the remaining body is a v1 replay/compatibility surface and a delivery handoff, not a capability."
public_contract_and_independent_test_entrypoint = "tests/legacy_facade.rs (30-case facade matrix) and tests/integrity.rs. Both are in-package fixtures over frozen v1 bytes and are explicitly not consumers."
first_real_consumer_or_time_bounded_migration_facade = "Time-bounded migration facade with no first real consumer. Measured reverse-dependency set is empty; the identified consumer set is therefore empty and the facade has no compatibility duty left to perform."
source_maintenance_owner_and_vendor_type_boundary = "No vendor types. All identities, fences and handles come from eliot-contracts. Frozen v1 row bytes cross the boundary as `Vec<u8>` and are never aliased into an owner decoder."
dependency_security_license_and_build_isolation = "No new dependency, no optional or vendor edge. License and advisory posture is inherited from the workspace. Removing the package removes one workspace member and one blake3/serde consumer."
expected_agent_workset_context_and_reverse_fanout_delta = "Removing the package removes ~1492 source lines and the two in-package fixtures from the cue workset. Reverse fan-out is currently zero, so the fan-out delta is zero; the measured delta is workset size, not fan-in."
expected_compile_test_integration_and_release_cost_delta = "Removes one workspace member, one `Cargo.lock` entry, two build targets (lib + two integration test binaries) and twelve shipped-serde-boundary rows. No integration or release cost is added."
migration_reexport_rollback_removal_and_expiry = "Eight rows are already migrated (type-identity re-export or one-to-one delegation, byte-identical); the thirty `delete` rows require no migration because nothing consumes them. Expiry is the removal of the last `metadata_references_to_close_before_any_delete` entry. Rollback is a revert of the deletion commit; no data or state is involved."
counter_risks_merge_or_rejoin_condition = "Rejoin is not proposed. Counter-risk: deleting the frozen v1 decoder would destroy the only machine-readable record of the #706 spelling denominator, so the denominator and the serde registry rows must be retired together or the migration becomes unprovable."
evidence_status_and_review_owner = "Evidence is current Cargo metadata and current `git grep` call sites at a318023b, not a runtime observation. Review owner is the #1143 integration owner; I19 legacy owners are retained until a replacement is proved, so removal is deferred past OSP1."
disposition = "split"

[rejected_overgeneralization]
text = "Destructive canonical-path lowercasing, candidate bindings bypassing Governor admission, session delivery state in the pure evaluator, or graph-edge minimums for exact firing."
source = "crates/smart/cognitive-donor-map.toml [[donor]] crates/smart/eliot-cues"
additions_from_this_ledger = [
  "A second delivery-completion surface: `request_legacy_delivery` may name the #612 handoff but must never fabricate a receipt or completion.",
  "A second row-identity computation: `legacy_row_id_v2` computes nothing; every v2 identity input comes from a fresh owner observation through `cue_row_id`.",
