schema_version = 3
module_id = "smart.cue.contracts"
crate = "eliot-cue-contracts"
status = "ADMITTED"
wave = "cognitive-micromodules-wave-01"
agent_order = 10
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C1"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.cue.contracts"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Exact world/task cues can be represented once and consumed consistently by capture and reactive delivery."
causal_property = "cue contract representation"
old_failure_or_missing_capability = "the legacy cue crate mixes contract, normalization, projection state and evaluation"
discriminator = "writer and reader fixtures compile against one contract without importing runtime/storage types"
primary_responsibility = "Own the minimal provider-neutral cue, binding, snapshot, activation and invalidation schemas."
owned_mutable_state = []
allowed_effects = []
inputs = ["Architecture cue vocabulary", "foundation identities/fences/lifecycle labels"]
outputs = ["ObservedCue/NormalizedCue", "CueBindingCandidate", "CueSnapshot/Activation contracts"]
depends_on = ["eliot-contracts", "eliot-evidence", "eliot-receipts", "eliot-security-contracts"]
providers = ["foundation contracts"]
consumers = ["cue normalizer", "cue binding", "cue index", "cue activation", "context candidates"]
non_goals = ["normalization", "index construction", "activation", "canonical write"]
invariants = ["canonical and comparison identities are distinct", "every target is a handle", "projection state is rebuildable"]
failure_behavior = "Reject incompatible schema explicitly; no untyped string fallback."
proof_surface = ["schema roundtrip", "matching-mode validity", "lifecycle/invalidation compatibility", "consumer compile fixtures"]
proof_ceiling = "Module proof only; real provider/consumer edge and Product Pulse remain separate"
product_pulse = "D3B_REACTIVE_CONTEXT_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-cues/src/lib.rs"
disposition = "extract shared shapes"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.6-I12.7"
disposition = "authoritative contract"

[agent_task]
objective = "Create the stable cue contract hub."
write_scope = ["crates/smart/eliot-cue-contracts/**"]
deliverables = ["public contract/core implementation", "property/adversarial fixtures", "affected edge fixtures"]
acceptance = ["one declared responsibility only", "bounded deterministic behavior", "visible local degradation"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop and return ContractChallenge when the work needs another owner, unbounded traversal, model call or hidden state."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "admitted via #829 (T8-A0) root workspace membership"

[acceptance]
source_issue = 804
source_unit = "A-10"
test_matrix_cases = 50
min_source_lines = 700
min_public_items = 28
min_tests = 50
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = [
  "ObservedCue", "NormalizedCue", "CanonicalCueIdentity", "ComparisonKey",
  "MatchMode", "NormalizationProfile", "NormalizationOutcome",
  "CueBindingCandidate", "CueSnapshot", "SnapshotMember", "RebuildIdentity",
  "ActivationRequest", "ActivationBounds", "ActivationResult",
  "DirectActivation", "DerivedActivation", "Completeness", "BoundKind",
  "CueContractError",
]
# One stable test name per numbered case in issue #804, in the same order.
required_tests = [
  "cue_kind_covers_the_declared_vocabulary",
  "cue_kind_is_defined_once_without_eliot_types_dependency",
  "observed_cue_supports_every_current_kind",
  "unknown_schema_field_variant_mode_and_status_are_rejected",
  "missing_empty_and_unknown_source_identity_are_distinct",
  "canonical_identity_differs_from_comparison_key",
  "identical_text_in_different_cue_kinds_remains_distinct",
  "exact_mode_rejects_fuzzy_embedding_substring_and_semantic_matching",
  "normalization_outcomes_cover_lossless_authorized_loss_ambiguous_and_unsupported",
  "lossy_or_ambiguous_normalization_cannot_prove_exact_match",
  "valid_binding_candidate_preserves_immutable_target",
  "binding_rejects_target_source_scope_fence_and_revision_mismatch",
  "binding_candidate_cannot_carry_canonical_action_or_status_mutation",
  "complete_snapshot_is_rebuildable_from_exact_inputs",
  "snapshot_denominator_arithmetic_reconciles",
  "snapshot_digest_is_stable_under_set_like_input_order",
  "profile_source_or_fence_change_invalidates_snapshot_identity",
  "snapshot_states_keep_complete_partial_unavailable_stale_and_unknown_distinct",
  "invalidation_causes_require_exact_owner_evidence",
  "invalidation_preserves_prior_history_and_predecessor",
  "relation_edge_requires_registry_direction_revision_digest_and_evidence",
  "broken_reordered_and_disconnected_paths_are_rejected",
  "depth_zero_direct_only_profile_request_and_result_are_valid",
  "direct_activation_valid_with_zero_edges",
  "direct_and_derived_are_not_interchangeable",
  "one_hop_and_bounded_multi_hop_candidates_preserve_shape",
  "every_independent_activation_bound_enforces_boundary_and_one_over",
  "zero_unknown_and_invalid_limits_are_not_unlimited",
  "duplicate_target_preserves_bounded_multiple_path_evidence",
  "cycles_duplicates_paths_and_members_do_not_inflate_arithmetic",
  "direct_complete_and_derived_partial_are_representable_together",
  "complete_partial_truncated_blocked_unavailable_stale_and_unknown_are_distinct",
  "truncation_preserves_frontier_omission_and_continuation",
  "complete_result_cannot_carry_frontier",
  "known_empty_differs_from_unavailable",
  "retrieval_stage_lineage_is_exact",
  "activation_candidate_cannot_claim_delivery_visibility_use_adherence_or_outcome",
  "activation_candidate_cannot_mutate_support_accessibility_influence_or_lifecycle",
  "privacy_authority_effect_and_proof_escalation_is_rejected",
  "canonical_round_trip_and_digest_are_deterministic",
  "semantic_path_and_transformation_order_are_preserved",
  "legacy_payload_is_rejected_by_current_decoder",
  "every_variable_field_enforces_its_declared_bound",
  "sensitive_diagnostics_are_redacted",
  "malformed_input_never_panics",
  "derived_paths_are_contiguous_bounded_and_start_from_direct_seeds",
  "complete_denominator_member_and_frontier_arithmetic_reconciles",
  "every_identity_bearing_mutation_changes_digest_or_is_rejected",
  "consumer_fixture_compiles_standalone",
  "source_api_contains_no_algorithm_io_store_provider_model_mutation_authority_effect_or_finish",
]
# A-10 is the Level-0 cue-vocabulary owner (`depends_on = []`). F-CUE later
# reconciles the shipped legacy copy; the gate pins the owner vocabulary here.
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
required_patterns = ['#\\[non_exhaustive\\]', 'deny_unknown_fields']

# I2.10 classification of this functional capability cell. Every value below is
# an explicit declaration of THIS cell, recorded per I2.10:124 ("The decision
# and rejected alternatives are recorded in the Module Catalog") and I0.12:18
# (the contour decision is generated from the Module contract and manifest).
# No value is derived from a crate, bundle, source-layer or runtime-layer name
# (I2.10:3), and an undetermined field is recorded as undetermined with its
# reason instead of being defaulted (I2.10:3, I2.20:63).
[i2_10]
# Functional capability cell: smart.cue.contracts
cell = "smart.cue.contracts"
# I2.10:12 and W4 admit the development classifications only for cells
# that are never required by the production runtime. This cell declares a
# production runtime bundle, an admitted product consumption path and no
# generator, fuzzer, benchmark, simulation or migration-tool purpose, so
# it is production-required and carries neither development_only nor
# development_tool. I2.10:3 forbids inferring this from a layer name.
production_required = true
# I2.10:45-48 defines `stateless` as no state surviving request or
# process. This cell declares
#   owned_mutable_state = []
#   allowed_effects      = []
# so no state and no effect survive the call and `stateless` is the only
# admitted class; host_state_externalized, rebuildable,
# checkpointed_operational and external_canonical_adapter each require
# owned or externally-anchored state this cell does not declare. Read
# from the declared state and effect sets, not from the pre-existing
# top-level `state_class` string or any crate/bundle/layer name.
state_class = "STATELESS"
# I2.10:62-63 states that canonical storage, semantic admission and
# mechanical fencing remain one path with separated responsibilities, and
# that no hot-replaceable module declares canonical_semantic. This cell
# declares no canonical write, persistence or authority role in its
# declared non-goals, so it claims none. A hot-replaceable cell that
# claimed it would be refused with
# CellManifestError::HotReplaceableCanonicalSemantic.
canonical_semantic = "NOT_CLAIMED"
# I2.10:9 and I14.19:21-28 admit the wasm_component contour for pure
# bounded logic with a narrow capability surface; I0.12:8-9 makes it
# the default first contour for a prototype and I2.10:108-109 selects
# it for pure and bounded host calls. The least-privilege reason below
# records why.
execution_contour = "WASM_COMPONENT"
least_privilege_reason = "I2.10:108 selects the least privileged contour that can express the capability and I0.12:8-9 / I14.19:3 make the capability-limited component contour the default for pure bounded logic. This cell declares one pure bounded responsibility (\"Own the minimal provider-neutral cue, binding, snapshot, activation and invalidation schemas.\") with allowed_effects = [] and owned_mutable_state = [], and its declared non-goal \"normalization\" together with the rest of its declared non-goals excludes OS, tool, credential and unbounded async I/O work, so the sandboxed component contour is the least privileged contour that can express the capability (I14.19:21-28, 43)."
promotion_path = "This contour is the documented default first contour for a pure bounded capability (I0.12:8-9, I14.19:3), so no promotion is owed and promotion to native is not a required maturity stage (I14.19:123). The cell follows the generational chain contract/conformance -> replay -> effect-free shadow -> bounded canary -> ORS cutover and new epoch -> drain / forward rollback (I0.12:30-37) with rollback as routing to the prior compatible generation (I14.19:114-117). A later change of contour is a governed promotion, never an invisible build optimization (I2.10:124): isolated native process only on a measured material benefit with the same contract, differential, fault, shadow and rollback proofs (I14.19:121-123); static native only with a stable interface, trusted supply chain, hot-path profiling and a normal binary release/rollback (I14.19:121); in-process dynamic unloading is never an intermediate step (I14.19:125)."

# Contours considered and rejected, with the reason each does
# not express this capability (I2.10:124). The chosen contour is
# never among them.
rejected_alternatives = [
  { contour = "native_process", reason = "I2.10:10 admits a native process for OS, Cargo, Git, LSP, browser, native-library, credential or long-CPU work behind a separate process/Job Object. This cell declares no such work and its declared non-goal \"normalization\" forbids it, so a separate process would add IPC latency and a duplicated state owner for no capability (I2.10:86)." },
  { contour = "static_native", reason = "I2.10:20-21 and I0.12:14-15 admit a static native release only for a trusted control path or a measured stable hot path, and I14.19:121 requires hot-path profiling, a stable interface, a trusted supply chain and a normal binary release. No measurement is recorded for this cell and static native is not a default reward for maturity." },
  { contour = "development_only", reason = "I2.10:12 admits development_only for generators, fuzzers, benchmarks, simulations and migration/test utilities that are never required by the production runtime. This cell declares a production runtime bundle and an admitted product consumption path, so it is production-required and the development_only contour is refused for it by CellManifestError::DevelopmentClassifiedProductionRequired." },
]

# Fields the documentation does not determine for this cell. They
# stay undeclared on purpose: manifest generation refuses an
# absent classification with CellManifestError::MissingField
# instead of accepting a synthesized value (I2.10:3, I2.20:63).
undetermined = [
  { field = "runtime_class", reason = "I2.10:29-41 enumerates eleven runtime roles of runtime modules. I14.19:62 states that the semantic core lives outside Wasmtime and has no runtime dependency, and I2.20:22 recognises a stateless cross-owner contracts/primitives island as a distinct cell kind; the vocabulary states no class for a contour-independent semantic core, for a WASM component guest, or for a contract island, and I2.10:3 forbids synthesizing one." },
  { field = "replacement_class", reason = "I2.10:69-84 names the cutover of a sandboxed component generation, a native process generation, a daemon generation, the external Host/SCM cutover, or an offline release with an explicit owner/reason/recovery. This cell declares no cutover contract for its runtime, I0.12:18-25 requires an explicit capability/isolation reason for a non-default contour that the documentation does not record, and the class must not be read off the hosting bundle name (I2.10:3)." },
  { field = "iteration_lane", reason = "I2.20:50-63 requires a ProofLatencyProfile carrying the measured p50/p95/p99/max, the exact machine/toolchain/build fingerprint and an expected_lane. No such profile is recorded for this cell, and I2.20:63 states that missing proof-latency evidence disables automatic assignment to the interactive lane without naming a substitute lane, so every lane value here would be invented." }
]
