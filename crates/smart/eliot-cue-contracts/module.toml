schema_version = 2
module_id = "smart.cue.contracts"
crate = "eliot-cue-contracts"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 2
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C0"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.cue.contracts"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Own the vendor-neutral public types shared by cue normalization, projection publication, and activation."
owned_mutable_state = []
allowed_effects = []
inputs = ["canonical contract vocabulary"]
outputs = ["CueKey and CueKind", "CueSnapshot contract", "ActivationTrace contract", "typed cue errors"]
depends_on = []
consumers = ["eliot-cue-normalizer", "eliot-cue-index", "eliot-cue-activation", "eliot-context-candidates"]
non_goals = ["normalization algorithms", "index construction", "matching or spreading activation", "canonical state"]
invariants = ["canonical identity and comparison key are separate", "scope and State Fence are mandatory", "snapshot rows contain handles rather than memory payload", "contract types contain no vendor/storage SDK types"]
failure_behavior = "Schema incompatibility is explicit; unknown variants are rejected or preserved only under the negotiated compatibility rule."
proof_surface = ["schema roundtrip", "unknown-field policy", "contract digest stability", "consumer compile fixtures"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-cues/src/lib.rs"
disposition = "extract_and_rewrite"
scope = "CueKind, CueKey, snapshot and trace shapes"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.6-I12.7"
disposition = "authoritative_contract"
scope = "shared normalization identity and Cue Index contract"

[agent_task]
objective = "Extract the minimal stable cue contract hub and remove algorithm/state ownership from it."
write_scope = ["crates/smart/eliot-cue-contracts/**"]
deliverables = ["contract types and errors", "serde/schemars surface", "compatibility fixtures"]
acceptance = ["no algorithmic behavior beyond validation", "no destructive path normalization in the contract", "all consumers can depend on one contract revision"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if a proposed type encodes one implementation algorithm or mutable owner."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof, affected edge proof, current-main rebase and integration-owner review"
