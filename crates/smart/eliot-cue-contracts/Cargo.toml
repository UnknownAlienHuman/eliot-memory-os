[package]
name = "eliot-cue-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Own the minimal provider-neutral cue, binding, snapshot, activation and invalidation schemas."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.cue.contracts"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 10

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
schemars = { version = "1.2.1", features = ["derive", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[lints]
workspace = true

# Standalone workspace root retained until all 50 A-10 cases pass. The later
# serialized integration owner #829 removes this table and admits the package.
[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
