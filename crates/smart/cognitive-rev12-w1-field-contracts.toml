[[dependency]]
provider = "smart.dreamer.self-query.v1"
consumer = "smart.context.provider-contribution.v1"
reason = "The W8 SelfModel Context provider consumes ArchitectureBrief and ImplementationBrief without redefining them or certifying current support."

[resolved_design_conflicts]
position_vs_model = "Current Epistemic Position is resolved from admitted owner evidence; model synthesis remains labeled candidate material."
causality = "Temporal order, similarity, dependency and causal candidate are separate; causality requires mechanism and falsifier."
relation_use_cases = "Orientation and Curation use typed entrypoints over one relation semantic core."
probe = "ProbePlan is discriminative and bounded but never executable."
self_query = "ArchitectureBrief and ImplementationBrief have one owner; target/current/operational/experiential states remain separate."

