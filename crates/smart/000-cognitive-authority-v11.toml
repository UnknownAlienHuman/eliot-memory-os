[invariants]
items = [
  "No cognitive cell owns canonical truth, support, authority, task completion, scheduler state, provider acquisition, external effects or production promotion.",
  "Every decision-boundary hot-path cell is bounded, deterministic, model-free, storage-scan-free and blocking-I/O-free.",
  "Every model-produced output remains candidate-only with exact lineage, visible uncertainty, invalidation and a source-derived authority ceiling.",
  "Existence, epistemic support, accessibility and permitted influence remain independent dimensions.",
  "Observed chronology is not causality; causal hypotheses require mechanism, evidence, rivals and falsifier.",
  "Task-local learning may adapt only reversible bounded overlays; cross-task promotion remains externally governed and proof-gated.",
  "Planning emits candidates only; it cannot create jobs, leases, work items, runtime execution state or reservations.",
  "DreamCycle is one bounded sample and one finite plan; it cannot schedule or call itself."
]

[agent_contract]
rules = [
  "Read this authority, both topology files, exactly one cell record and the cell's named normative anchors.",
  "Edit only the declared worker source and test files; package Cargo.toml and src/lib.rs belong to the integration owner.",
  "Do not implement missing external owner contracts inside Smart; return a ContractChallenge instead.",
  "A package-local green result does not establish Edge, Product Pulse, runtime or product support.",
  "Unknown subtype, missing denominator, stale fence, absent owner projection or unavailable authority path fails closed."
]

[superseded_for_assignment]
paths = [
  "crates/smart/cognitive-design-authority-v11.toml",
  "crates/smart/cognitive-crate-decisions.toml",
  "historical standalone module.toml/api.toml pairs",
  "crates/smart/eliot-dreamer-candidate-validation",
  "crates/smart/eliot-dreamer-memory-repair"
]

[admission_gate]
required = [
  "all 61 cell records pass static closed-world validation",
  "physical package seams are approved by their integration owners",
  "worker write scopes are non-overlapping",
  "root Cargo.toml and Cargo.lock remain unchanged until implementation admission",
  "implemented package obtains package proof",
  "every affected provider-consumer edge obtains Edge Proof",
  "the named Product Pulse passes on an exact Product Identity"
]
