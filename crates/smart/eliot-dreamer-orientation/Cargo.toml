[package]
name = "eliot-dreamer-orientation"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Convert a validated Orientation draft and optional authority-separated self briefs into a DreamPacket with evidence, rivals, hidden relations, gaps and probes."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.dreamer.orientation"
source_layer = "C1"
runtime_layer = "R6"
runtime_bundle = "eliot-dreamer"
agent_order = 9

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-dreamer-contracts = { path = "../eliot-dreamer-contracts" }
eliot-dreamer-candidate-validation = { path = "../eliot-dreamer-candidate-validation" }
eliot-dreamer-architecture-brief = { path = "../eliot-dreamer-architecture-brief" }
eliot-dreamer-implementation-brief = { path = "../eliot-dreamer-implementation-brief" }
