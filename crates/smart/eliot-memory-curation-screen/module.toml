delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.memory.curation_screen"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Cheap obvious findings are screened without model cost while protected evidence cannot be discarded by utility heuristics."
causal_property = "deterministic read-only curation screening"
old_failure_or_missing_capability = "legacy curation mixes duplicate domain enums and candidate action vocabulary with screen logic"
discriminator = "bounded partial-denominator fixtures never claim complete corpus coverage or mutate lifecycle"
primary_responsibility = "Identify bounded deterministic curation findings and protected records before optional model curation."
owned_mutable_state = []
allowed_effects = []
inputs = ["fenced canonical memory projection", "versioned screen profile"]
outputs = ["CurationScreenResult", "protected handles", "coverage/cursor manifest"]
depends_on = []
providers = ["canonical memory projection"]
consumers = ["curation facade", "maintenance planner"]
non_goals = ["canonical mutation", "semantic equivalence without verifier", "utility-based deletion", "model synthesis"]
invariants = ["verified/current/minority/counterexample/audit protected", "writer utility not authority", "denominator explicit"]
failure_behavior = "Return partial/inconclusive screen with exact coverage; preserve every record."
proof_surface = ["protected records", "wrong scope/duplicate/unsafe instruction", "partial denominator", "utility non-authority"]
proof_ceiling = "Module proof only; real provider/consumer edge and Product Pulse remain separate"
product_pulse = "D3A_CURATION_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-memory-curation/src/lib.rs"
disposition = "retain pure screen"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.6-I9.8/I12.21"
disposition = "authoritative contract"

[agent_task]
objective = "Salvage the deterministic screen behind current shared contracts."
write_scope = ["crates/smart/eliot-memory-curation-screen/**"]
deliverables = ["public contract/core implementation", "property/adversarial fixtures", "affected edge fixtures"]
acceptance = ["one declared responsibility only", "bounded deterministic behavior", "visible local degradation"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop and return ContractChallenge when the work needs another owner, unbounded traversal, model call or hidden state."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected edge proof, current-main rebase and integration-owner review"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# These are the floors every cell shares. The owning work unit tightens them
# with `required_exports` and `required_tests` taken from its own brief, so a
# reviewer decides on one exit code instead of reading prose criteria.
[acceptance]
min_source_lines = 200
min_public_items = 6
min_tests = 5
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
