schema_version = 2
module_id = "smart.memory.curation_screen"
crate = "eliot-memory-curation-screen"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 15
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.memory.curation_screen"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Identify bounded deterministic curation findings and protected records before optional model curation, without changing lifecycle, support, or influence."
owned_mutable_state = []
allowed_effects = []
inputs = ["fenced canonical memory projection", "versioned deterministic screen profile"]
outputs = ["CurationScreenResult", "protected handles", "coverage/cursor manifest"]
depends_on = ["eliot-dreamer-contracts"]
consumers = ["eliot-dreamer-curation", "maintenance planner"]
non_goals = ["canonical mutation", "semantic equivalence judgment without verifier evidence", "model synthesis", "utility-based deletion"]
invariants = ["verified/current/minority/counterexample/audit records are protected", "writer-supplied utility is not canonical evidence", "scan coverage and denominator are explicit", "all proposed actions are reversible candidates"]
failure_behavior = "Return partial/inconclusive screen with exact coverage; preserve every record and do not escalate a finding to an action."
proof_surface = ["protected-record fixtures", "wrong-scope/duplicate/unsafe-instruction cases", "partial denominator and cursor stability", "writer-utility non-authority"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-memory-curation/src/lib.rs"
disposition = "retain_pure_screen_only"
scope = "snapshot validation, protection logic, bounded pagination; replace duplicate domain enums"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.6-I9.8 and I12.21"
disposition = "authoritative_contract"
scope = "candidate-only curation and memory ecology"

[agent_task]
objective = "Salvage the good deterministic screen from the old curation crate behind current shared contracts."
write_scope = ["crates/smart/eliot-memory-curation-screen/**"]
deliverables = ["screen profile and evaluator", "coverage/cursor result", "protection/adversarial tests"]
acceptance = ["read-only and deterministic", "no deletion/suppression/lifecycle transition", "partial scan never claims full corpus coverage"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if a finding needs semantic judgment; emit a bounded Dreamer curation input or verifier requirement instead."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof, affected edge proof, current-main rebase and integration-owner review"
