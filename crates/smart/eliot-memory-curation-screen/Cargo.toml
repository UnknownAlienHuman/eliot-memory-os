[package]
name = "eliot-memory-curation-screen"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Deterministic read-only screening of a fenced memory snapshot for bounded curation work"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.memory.curation_screen"
source_layer = "C1"
runtime_layer = "R6"
runtime_bundle = "eliot-dreamer"
agent_order = 15

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-dreamer-contracts = { path = "../eliot-dreamer-contracts" }
