[package]
name = "eliot-epistemic-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Versioned store-neutral contracts for ELIOT Current Epistemic Position"

[lib]
path = "src/lib.rs"

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
schemars = { version = "1.2.1", features = ["derive", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = { version = "1.0.149" }

[package.metadata.eliot]
prototype = true
workspace_admission = "pending_agent_implementation"
functional_cell = "smart.epistemic.contracts"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 6

[lints]
workspace = true

# Standalone workspace root. Without this, cargo walks above the repository
# and can bind this package to an unrelated ancestor manifest, so every
# per-crate `cargo check|test|clippy` fails before it starts. Remove this
# table when the cell is promoted into the root workspace `members`.
[workspace]

# Mirrors the root `[workspace.lints]` verbatim so an excluded cell is linted
# exactly like an admitted one. Keep in sync; the promotion commit drops this
# whole `[workspace]` table and restores plain inheritance.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
