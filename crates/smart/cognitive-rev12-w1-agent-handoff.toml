schema_version = 1
authority = "eliot-cognitive-function-design-rev12"
status = "W1_D3A_AGENT_HANDOFF_CONTRACT"
field_contract_index = "crates/smart/cognitive-rev12-w1-field-contracts.toml"
brief_index = "crates/smart/cognitive-rev12-w1-agent-brief-index.toml"

[worker]
reads = ["one indexed W1 brief", "the exact field contracts named by that brief", "declared Architecture/Implementation anchors", "one-hop public contracts and fixtures only"]
writes = ["the brief declared src/<cell>.rs", "the brief declared tests/<cell>.rs"]
forbidden = ["Cargo.toml", "src/lib.rs", "re-exports", "another cell source", "root workspace", "runtime wiring", "canonical state", "policy ownership", "model/provider/tool execution", "scheduler", "authority", "task finish", "proof/status files", "local public-type redefinition", "oracle weakening"]
return = ["implemented exact declared function", "typed errors", "minimum and contract negative tests", "remaining ContractChallenge", "actual proof ceiling"]

[integration_owner]
owns = ["Cargo.toml", "src/lib.rs and re-exports", "cross-cell compatibility", "public-type ownership validation", "package Module Proof", "real Edge Proof", "Product Pulse", "migration and retirement"]

[challenge]
required_when = ["field contract absent or contradictory", "public type owner unresolved", "discriminator cannot fail old behavior", "work requires hidden I/O/model/tool/provider SDK", "work requires another mutable owner", "worker must weaken an oracle", "complete causal workset does not fit"]

[ordering]
contracts_precede_workers = true
parallel_workers_require_disjoint_source_files = true
shared_contract_change_serialized_by_integration_owner = true
worker_never_integrates_own_result = true
epistemic_position_precedes_orientation_handlers = true
bundle_precedes_grounding = true
grounding_precedes_transformation_validation = true
transformation_validation_precedes_draft_admission = true
draft_admission_precedes_rivals_relations_and_packet = true
rivals_precede_probe_plan = true
architecture_brief_precedes_implementation_brief = true

