id = "MemoryEcologyAssessment"
owner_crate = "eliot-memory-quality"
family = "memory ecology and memory gravity"
source_handles = ["I12-21", "I12-34"]
status = "FROZEN_STATIC_FIELD_CONTRACT"
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
fields = ["subject_item_and_cluster_refs", "retrieval_acknowledgement_verified_use_and_decision_delta_history", "verification_success_contradiction_stale_hit_and_false_activation_history", "horizon_checkpoint_expiry_eviction_regime_and_workload_exposure_denominators", "representation_path_raw_episode_or_typed_relation_or_compiled_view_or_active_context", "historical_recall_and_current_state_outcomes_separately", "outcome_classes_correct_or_wrong_specific_or_abstained_or_unknown", "evaluator_revision_provenance_comparison_intervention_and_uncertainty", "context_dominance_gravity_and_maintenance_storage_curation_cost", "minority_evidence_and_unresolved_discriminators", "where_applies_and_where_not_applies_and_transfer_evidence", "negative_transfer_poisoned_influence_and_suppression_history", "obsolete_current_reopen_cohorts_and_valid_near_match_positive_controls", "residual_distinctions_lost_or_retained_by_compression", "recommended_action_keep_or_narrow_or_split_or_compress_or_suppress_or_archive_or_reactivate_or_review", "influence_ladder_stored_to_outcome_supported_or_refuted", "lifecycle_economics_capture_ingest_read_write_storage_semantic_reconciliation_freshness_retrieval_curation_attention_prevented_errors_missing_coverage_exclusions_amortization_horizon", "maintenance_aggregates_candidate_backlog_stale_conflicted_superseded_cue_coverage_false_activations_unused_cargo_negative_transfer_poisoned_influence_missing_forgetting_promotion_rate_curation_quality_reconstruction_cost_decision_quality", "cold_capture_ratio_time_to_binding_p50_p95_cold_capture_never_bound_binding_rejection_or_rebind_rate", "weak_claim_rate_with_denominator_task_route_corpus_profile_age_operation_mix_evaluator_revision_exclusions_uncertainty"]
denominator = "evaluated_memory_items over declared_corpus_scope_at_named_horizon_with_workload_exposure_denominator_and_explicit_exclusions"
denominator_rule = "RECHECK: count evaluated items from retained evidence refs; re-resolve declared scope digest, horizon/checkpoint, workload/exposure denominator, and exclusions; recompute weak_claim_rate and cold-capture ratios from the same inputs. Any Complete coverage state without this exact denominator is invalid."
complete_rule = "Every Complete state requires the exact independently recheckable denominator above; omission list and fence must be present or the assessment is INCONCLUSIVE."
fence = "StateFence revisions plus horizon/checkpoint; historical-recall and current-state outcomes recorded separately."
omission_semantics = "Missing evidence is listed per field as unknown with reason; low use never reduces support; retrieval/repetition/agreement never reinforce support."
invariants = ["low use never reduces factual support and frequent retrieval does not strengthen a record", "popularity does not delete minority evidence", "delivery, citation and confident rationale do not demonstrate contribution without downstream outcome or counterfactual evidence", "negative memory and invariants are not suppressed only because they rarely changed an action", "minority evidence stays addressable until discriminator or applicability resolves", "consume immutable owner-produced projections only", "no aggregate intelligence/confidence/utility score", "retrieval/popularity/completion/delivery/tool-availability/model-agreement do not establish utility or support", "every Complete state requires the exact independently recheckable denominator", "this crate owns no canonical state, lifecycle transition, scheduler, effect, authority or task finish"]

