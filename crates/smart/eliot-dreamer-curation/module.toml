deliverables = ["typed dispatch table", "candidate-set assembler", "routing/partial-failure/atomicity tests"]
acceptance = ["facade contains no subtype semantics", "every item disposition is visible", "no canonical or lifecycle effect"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if a missing subtype tempts generic prose-to-candidate fallback; leave it unsupported or assign a new function-bounded handler."
