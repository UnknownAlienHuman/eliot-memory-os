id = "smart.dreamer.conflict_analysis"
stage = "W6_DIAGNOSIS_PLANNING"
physical_crate = "eliot-dreamer-diagnosis"
hot_path = false
responsibility = "Build a rival-preserving conflict analysis candidate with shared lineage, dependence, unresolved residue and discriminative probes."
public_functions = ["pub fn analyze_epistemic_conflict(request: &ConflictAnalysisRequest, position: &CurrentEpistemicPosition, draft: &AdmittedDreamDraft) -> Result<ConflictAnalysisCandidate, ConflictAnalysisError>"]
algorithm = ["validate exact conflict identity and participants", "separate observations from interpretations", "identify shared and dependent evidence", "retain strongest objections and unresolved residue", "list temporarily admissible actions and exact decision owner", "attach discriminative probes and revision conditions"]
