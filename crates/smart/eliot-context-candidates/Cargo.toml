[package]
name = "eliot-context-candidates"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Map immutable task, attention, epistemic, cue, negative-memory, evidence and affordance projections into whole context candidates with lineage."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.context.candidates"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 16

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts", version = "0.1.0" }
eliot-evidence = { path = "../../foundation/eliot-evidence", version = "0.1.0" }
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }
eliot-cue-contracts = { path = "../eliot-cue-contracts", version = "0.1.0" }
eliot-epistemic-contracts = { path = "../eliot-epistemic-contracts", version = "0.1.0" }
eliot-context-contracts = { path = "../eliot-context-contracts", version = "0.1.0" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts", version = "0.1.0" }
eliot-protocol = { path = "../../foundation/eliot-protocol", version = "0.1.0" }
serde_json = "1.0.150"

[lints]
workspace = true
