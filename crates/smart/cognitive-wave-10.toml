e dispatch envelope and not a semantic-payload owner adopting one -- which is the same distinction the seven families are being held to, so its presence neither triggers nor blocks their staying per-kind and unenveloped. WHAT THE ENVELOPE IS FOR, from its own declaration: a digest-only identity and dispatch receipt binding one handler call to one request. Its seven members are request_id, kind, family, disposition, handler_id, request_digest and result_digest; it carries no semantic payload member, and crates/smart/eliot-dreamer-contracts/src/curation_invocation.rs names the ConceptCandidate form as the precedent for a content-carrying result precisely AS OPPOSED to this digest-only envelope. THE DECISION: the seven families stay per-kind and unenveloped. Adopting TypedCurationHandlerResult would add a second identity carrier to each of those seven public result types while carrying none of the eleven I9.6 semantic fields, and it would require a Rust shape change in seven crates whose public result types are each already frozen under MM-01, MM-02, MM-03, MM-05, MM-06, MM-07, MM-08 and MM-09, changing no contract this catalogue froze. DERIVED FROM the routed A2.3 sentence that a micro-module is a bounded cell with 'one causal responsibility and one lifecycle owner; an explicit public contract, inputs, outputs, and owned mutable state': the shared envelope is a typed-dispatch concern owned by eliot-dreamer-contracts and is not a second owner of the per-kind semantic payload, and A2.3 also states that the Architecture does not prescribe its physical form, so an absent family type is recorded rather than invented. Any future adoption is a Cross-module change under the routed I0.4 change-class table ('protocol field, shared contract, dependency edge | integration owner') and belongs to the cognitive-wave-integrator, not to this catalogue. No Rust shape must change as a result of this row, so no path.rs::symbol is named as needing change and no owner is named for one. This row no longer rests on the withdrawn premise that the concept kind has no result type: MM-04 records the measured ConceptCandidate and its construction site."
