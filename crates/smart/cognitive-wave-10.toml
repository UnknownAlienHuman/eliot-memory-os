normative_pair_residual = "MEASURED ACROSS ALL FOUR PLACES, correcting this row's earlier description of two of them. THE ACCEPTED KEY is sha256:ab2011bd67557d89b2f094061d350a297389f7f57d0478be5e1ff8d2da8ed1c1, per docs/normative-pair.toml::pair_key (status accepted, adopted_at 2026-08-28, schema_version eliot-normative-pair-v2-sharded, content_layout eliot-doc-shards-v1 -- two distinct keys, and this row's earlier wording layout eliot-normative-pair-v2-sharded named the schema version as if it were the layout and is WITHDRAWN as that key error), which is the only owner of that value. (1) docs/normative-pair.toml::pair_key reads it, correctly. (2) crates/smart/cognitive-wave-09.toml:6 carries the SAME ab2011bd value with pair_key_authority = docs/normative-pair.toml::pair_key and pair_key_status = ACCEPTED_PAIR_PINNED_VERIFIED_NOT_COPIED, so the wave-09 side is REPAIRED and this row's earlier claim that it was a stale copy is WITHDRAWN; its issue_declared_pair_key sha256:105558fc... is retained under its own status SUPERSEDED_PRE_SHARDING_PAIR_RETAINED_AS_MIGRATION_EVIDENCE_NOT_AUTHORITY. (3) crates/smart/cognitive-wave-01.toml has NO pair_key KEY at all: a programmatic walk of its parsed tables returns zero pair_key keys, and its three grep hits are PROSE inside existing field values (definition_revision, later_negative_acceptance and implementation_steps, all of which describe how a pair_key is recomputed over a versioned preimage). None of the three asserts a key value, so wave-01 contradicts nothing; the only hand-maintained identity it carries is its normative_pair version string, whose revisions and edition do match docs/normative-pair.toml today and which CC-W2-NORMATIVE-PAIR-KEY's forbidden_workaround still names as forbidden hand-maintenance. (4) THE ONE REMAINING CONTRADICTION is crates/smart/cognitive-rev12-contract-schema-freeze.toml, whose header normative_pair_key reads sha256:3ea4dc3442f03d3a0020380854d45cdf20c9d5098197e0bfe1e80cf6f2b805ea, the pre-sharding value, not the accepted ab2011bd one. That file is byte-pinned, so correcting its header requires an ORDERED FREEZE RE-PIN -- a new revision with a new digest, then every byte pin and every freeze-identity string pin moved in the same work unit -- which belongs to the freeze integrator under CC-W2-FREEZE-REPIN (issue #261) and is not an edit this issue may make inside a byte-pinned artefact. THE ORDER AND THE FULL ENUMERATION ARE NOT RESTATED HERE AND ARE OWNED BY CC-W2-CONSUMER-REPIN (resolution_evidence and missing_contract), with the single recorded copy of the freeze digest and byte length in CC-W9-REV12-HANDOFF resolution_evidence; this row deliberately repeats none of it, because a third hand-maintained copy of that enumeration is how it rots a second time. THE CURRENT FACT, STATED ONCE: the freeze is cognitive-rev12-contract-schema-freeze-2026-09-22-r13, its bytes are enforced by TWO include_bytes! consumers -- REQUIRED_FREEZE_DIGEST in crates/smart/eliot-dreamer-memory-revision/src/lib.rs and CONSUMED_FREEZE_DIGEST in crates/smart/eliot-memory-quality/src/lib.rs -- and the freeze-identity string pins read r13 in seven places, six of them named FREEZE_ID and one named CONSUMED_FREEZE_ID in eliot-memory-quality. THIS ROW'S EARLIER PHRASING, naming only the eliot-dreamer-memory-revision byte pin and then the seven consumer FREEZE_ID pins, is WITHDRAWN on both counts: it omitted the second byte pin, which is what let a half-move land, and it named all seven string pins FREEZE_ID when six are FREEZE_ID and one is CONSUMED_FREEZE_ID. Every row in this catalogue binds the pair through docs/normative-pair.toml::pair_key and restates no version string of its own, so this file is not part of that contradiction."
