# ---------------------------------------------------------------------------
# Validation gates.
# ---------------------------------------------------------------------------

[[validation_gate]]
id = "W2-TOML-PARSE"
rule = "Every file edited by this work unit parses with python tomllib, and every field-shape denominator is recheckable by the stated denominator_rule."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-NO-INVENTED-SYMBOL"
rule = "Every rust_path and symbol in every [[type_contract]] and [[ownership]] row resolves to a public item in the named source file on the current base, or the row carries disposition missing_contract_decision. A guessed schema is never presented as frozen."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-ONE-DISPOSITION-PER-ROW"
rule = "Every load-bearing row carries exactly one disposition from reused_exact, corrected_static_description, missing_contract_decision, retired_with_successor. No row is both reused and missing."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-NO-FUNCTION-ONLY-PACKAGE"
rule = "No crate is created. All twenty-four issue-named physical owners already exist as admitted root workspace members or as explicitly named prototypes; no Cargo.toml, Cargo.lock, .rs file, workflow or generated index is edited by this work unit."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-NO-FREEZE-BYTE-CHANGE"
rule = "crates/smart/cognitive-rev12-contract-schema-freeze.toml is byte-identical before and after this work unit, and python scripts/read_freeze_digest.py still passes. A byte change is a new freeze candidate under that file's own [readback].rule and requires the recorded CC-W2-FREEZE-REPIN handoff."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-COMPLETE-REQUIRES-DENOMINATOR"
rule = "Every Complete coverage claim in every field_contract requires the exact independently recheckable denominator above; otherwise the state is Inconclusive, Partial, Unsupported or Unknown. A bare count never establishes completeness."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-PLANNING-OWNS-NO-EFFECT"
rule = "No planning family output carries a DurableJob, a Ready Queue entry, a route reservation, a launch, a schedule, a configuration write, an effect, an authority or a task finish. The ten admitted maintenance verbs are inert; DecompositionOutcome::Overlapped and ::Challenge block the two obvious escapes."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-CYCLE-ONE-CYCLE-NO-SCHEDULE"
rule = "PlanHorizon has exactly one variant and ExperimentKind admits only a clarification or reconciliation probe, so the cycle is one finite bounded adjacent phase and cannot self-schedule. Adding a recurring horizon or a schedule field is a contract break."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-NO-SELF-CERTIFICATION"
rule = "No model output self-certifies grounding, transformation faithfulness, authority, coverage or product support. The seven I9.7 preservation dimensions, the coverage denominator and the fence gate are verdicts over owner material, never self-granted truths."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-EXACT-TRIGGER-NOT-SIMILARITY"
rule = "An exact trigger blocks or requires a probe; a semantic near-match only warns. NegativeMemoryExtinctionCandidate.fingerprint is one opaque String on this base, so the structured exact-trigger boundary is recorded as an open gap rather than frozen as satisfied."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-FORWARD-REVERSIBLE-ONLY"
rule = "merge, split, reconsolidation, accessibility, influence, revision, plan and cycle outputs are forward reversible candidates only. No in-place rewrite, purge or irreversible operator is representable in any frozen shape."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-CHRONOLOGY-SEPARATE-FROM-CAUSIS"
rule = "ChronologyLink, ChronologyRelation, EpisodeBoundary and EpisodeGap stay separate from the causal-hypothesis fields. Merging them is a contract break."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-ROLE-SEPARATION"
rule = "Researcher acquires, Dreamer interprets, Governor governs. A Dreamer crate may not acquire sources, and no crate in this catalogue may govern."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-NO-AGGREGATE-SCORE"
rule = "No frozen type carries an aggregate intelligence, confidence, utility or learning score, and no generic JSON or vendor SDK type appears in a public contract field."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W2-PROOF-LADDER-CEILING"
rule = "This catalogue is STATIC_FIELD_CONTRACT_ONLY / TARGET / NOT_EXECUTED. Rust implementation, package Module Proof, real provider-consumer Edge Proof and named Product Pulse execution all stay TEST-PHASE until they exist; package proof alone never reports product support."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

# ---------------------------------------------------------------------------
# Handoff rules. Ordered; each names its consumer.
# ---------------------------------------------------------------------------

[[handoff]]
id = "H-W2-FREEZE-PROMOTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-rev12-contract-schema-freeze.toml owner"
trigger = "The owner decides to promote this semantic contract index into the freeze as revision 7."
order = 1
rule = "Publish r7 with a revision marker and supersedes_freeze_id plus supersedes_freeze_digest rows, then hand off to H-W2-DIGEST-REPIN. The r6 readback digest validates the r6 bytes only and never validates new bytes."
blocking_consumer = "eliot-dreamer-memory-revision::verify_freeze_binding, called from propose"
status = "BLOCKED_PENDING_OWNER_DECISION"

[[handoff]]
id = "H-W2-DIGEST-REPIN"
from = "freeze owner"
to = "crates/smart/eliot-dreamer-memory-revision/src/lib.rs owner"
trigger = "An r7 freeze is published."
order = 2
rule = "Update REQUIRED_FREEZE_DIGEST to the sha256 over the exact new freeze bytes. FREEZE_BYTES is an include_bytes! of the file itself, so no second copy or hand-copied digest is introduced. This is a .rs edit and is therefore out of scope for a TOML-only work unit."
blocking_consumer = "eliot-dreamer-memory-revision::propose"
status = "REQUIRED_BEFORE_R7_MERGE"

[[handoff]]
id = "H-W2-READBACK-ROW"
from = "freeze owner"
to = "crates/smart/cognitive-contract-challenges.toml owner"
trigger = "An r7 freeze is published."
order = 3
rule = "Repoint the CC-W9-REV12-HANDOFF resolution_evidence recorded digest and recorded byte length to the r7 values, then re-run python scripts/read_freeze_digest.py green. The recorded value lives here because a digest of a file's own bytes cannot live inside those bytes."
blocking_consumer = "scripts/read_freeze_digest.py"
status = "REQUIRED_BEFORE_R7_MERGE"

[[handoff]]
id = "H-W2-IDENTITY-PINS"
from = "freeze owner"
to = "eliot-cognitive-quality, eliot-dreamer-memory-revision, eliot-dreamer-self-query, eliot-epistemic-context-provider, eliot-experience-projection, eliot-experience-provider, eliot-memory-quality, eliot-understanding-assessment"
trigger = "An r7 freeze is published."
order = 4
rule = "Update all eight FREEZE_ID or CONSUMED_FREEZE_ID string pins in the same work unit as the digest re-pin, plus the six freeze_ref Cargo.toml rows and the four module.toml path rows. eliot-experience-provider is already stale on r5 and must move to the same revision rather than being left behind. Never mass find-and-replace the id: the self-comparison assertion in eliot-memory-quality must be updated together with its constant."
blocking_consumer = "every crate declaring freeze_ref in its Cargo.toml"
status = "REQUIRED_BEFORE_R7_MERGE"

[[handoff]]
id = "H-W2-CATALOGUE-PROMOTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-wave-01.toml, crates/smart/cognitive-wave-02.toml and crates/smart/cognitive-wave-09.toml owners"
trigger = "This index is accepted."
order = 5
rule = "Each owning wave keeps its own rows; this catalogue adds a sibling index and does not renumber, rewrite or absorb any existing order. The one overlap is NegativeMemoryExtinctionCandidate, which wave-09 already indexes: the implemented Rust field set is authoritative and wave-09's longer semantic field family is recorded as corrected_static_description under MR-04, so wave-09's owner should either re-point its field list or cite MR-04. Both indexes must never be treated as two owners."
blocking_consumer = "crates/smart/cognitive-wave-09.toml [[field_contract]] NegativeMemoryExtinctionCandidate"
status = "ADVISORY"

[[handoff]]
id = "H-W2-NORMATIVE-PAIR-CORRECTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-wave-01.toml and crates/smart/cognitive-wave-09.toml owners"
trigger = "Any pair identity in a wave catalogue is read."
order = 6
rule = "docs/normative-pair.toml is the only owner of the pair key, the revisions and the edition. The pair_key carried by wave-09 and the version string carried by wave-01 do not match it. This catalogue copies from docs/normative-pair.toml and records the discrepancy under CC-W2-NORMATIVE-PAIR-KEY rather than repairing the other wave files, because this work unit does not rewrite unrelated wave rows."
blocking_consumer = "every catalogue that hand-maintains a pair_key or a document version string"
status = "ADVISORY"

[[handoff]]
id = "H-W2-TOPOLOGY-DRIFT"
from = "crates/smart/cognitive-wave-10.toml"
to = "cognitive-crate-decisions.toml owner"
trigger = "The next wave assignment is issued."
order = 7
rule = "Three measured gaps are recorded, not repaired: eliot-dreamer-cycle has no agent_order and no decisions row; eliot-dreamer-research-synthesis declares agent_order 6, which collides with eliot-dreamer-orientation and has no decisions row; eliot-dreamer-probe-plan declares agent_order 17 with no decisions row. Assigning any of them an order is an owner decision, and a duplicate order is rejected at wave review."
blocking_consumer = "crates/smart/cognitive-crate-decisions.toml"
status = "ADVISORY"

