[[handoff]]
id = "H-W2-FREEZE-PROMOTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-rev12-contract-schema-freeze.toml owner"
trigger = "The owner decides to promote this semantic contract index into the freeze."
order = 1
rule = "Publish the next candidate with a revision marker and supersedes_freeze_id plus supersedes_freeze_digest rows, then hand off to H-W2-DIGEST-REPIN. The readback digest validates the bytes of its own candidate only and never validates new bytes. MEASURED ON THE CURRENT BRANCH: the freeze is already at r13, so 'r7' as named by the earlier revision of this row is stale and the next candidate is r14. This catalogue does not mint that number: the revision sequence belongs to the freeze owner, so the next revision is left to that owner and only the measured current identity is recorded here."
blocking_consumer = "eliot-dreamer-memory-revision::verify_freeze_binding, called from propose"
status = "BLOCKED_PENDING_OWNER_DECISION"

[[handoff]]
id = "H-W2-DIGEST-REPIN"
from = "freeze owner"
to = "crates/smart/eliot-dreamer-memory-revision/src/lib.rs owner"
trigger = "The next freeze candidate after the measured r13 is published."
order = 2
rule = "Update BOTH byte pins to the sha256 over the exact new freeze bytes: REQUIRED_FREEZE_DIGEST in crates/smart/eliot-dreamer-memory-revision/src/lib.rs AND CONSUMED_FREEZE_DIGEST in crates/smart/eliot-memory-quality/src/lib.rs, each of which hashes its own separate FREEZE_BYTES include_bytes! of the file itself, so no second copy or hand-copied digest is introduced and neither pin can be updated alone and leave the other refusing. This is a .rs edit and is therefore out of scope for a TOML-only work unit. The r13 repin is partially done on this branch: REQUIRED_FREEZE_DIGEST and FREEZE_ID in crates/smart/eliot-dreamer-memory-revision/src/lib.rs both read r13, while CONSUMED_FREEZE_DIGEST in crates/smart/eliot-memory-quality/src/lib.rs still holds the r12 digest and is issue #261's file, deliberately not edited here. WHAT THE READBACK ESTABLISHES, CORRECTING THIS ROW'S EARLIER CLAIM THAT THE CONSTANTS 'agree with the readback': scripts/read_freeze_digest.py reads only the freeze file and the CC-W9-REV12-HANDOFF row and never opens either crate, so its PASS proves only that the freeze file's actual bytes hash to the digest and the length recorded in CC-W9-REV12-HANDOFF resolution_evidence and that the row names this freeze id. It is silent about every crate constant. That gap is live: the script is green on this branch while eliot-memory-quality's CONSUMED_FREEZE_DIGEST refuses."
blocking_consumer = "eliot-dreamer-memory-revision::propose"
status = "REQUIRED_BEFORE_NEXT_CANDIDATE_MERGE"

[[handoff]]
id = "H-W2-READBACK-ROW"
from = "freeze owner"
to = "crates/smart/cognitive-contract-challenges.toml owner"
trigger = "The next freeze candidate after the measured r13 is published."
order = 3
rule = "Repoint the CC-W9-REV12-HANDOFF resolution_evidence recorded digest and recorded byte length to the new candidate's values, then re-run python scripts/read_freeze_digest.py green. The recorded value lives there because a digest of a file's own bytes cannot live inside those bytes, and it is the ONLY copy: it is the EXPECTED_SOURCE the script compares the freeze's actual bytes against, which is why this rule and every other row cross-reference it instead of restating a digest. That row already reads the measured values for freeze cognitive-rev12-contract-schema-freeze-2026-09-22-r13 and was NOT edited by this work unit."
blocking_consumer = "scripts/read_freeze_digest.py"
status = "REQUIRED_BEFORE_NEXT_CANDIDATE_MERGE"

[[handoff]]
id = "H-W2-IDENTITY-PINS"
from = "freeze owner"
to = "eliot-cognitive-quality, eliot-dreamer-memory-revision, eliot-dreamer-self-query, eliot-epistemic-context-provider, eliot-experience-projection, eliot-experience-provider, eliot-memory-quality, eliot-understanding-assessment"
trigger = "The next freeze candidate after the measured r13 is published."
order = 4
rule = "Update all eight FREEZE_ID or CONSUMED_FREEZE_ID string pins in the same work unit as the digest re-pin, plus the SEVEN freeze_ref Cargo.toml rows and the FIVE module.toml path rows. THIS ROW'S EARLIER 'six' AND 'four' ARE BOTH WRONG AND ARE WITHDRAWN. MEASURED BY PARSING, NOT BY GREPPING: tomllib over every Cargo.toml and every module.toml in the tree, 200 manifests and 71 module manifests, walking the parsed tables rather than the raw text. The SEVEN freeze_ref rows are eliot-cognitive-quality, eliot-dreamer-memory-revision, eliot-dreamer-self-query, eliot-epistemic-context-provider, eliot-experience-projection, eliot-experience-provider and eliot-understanding-assessment. The FIVE module.toml rows whose value IS the freeze path are the donor path rows of eliot-dreamer-self-query, eliot-epistemic-context-provider, eliot-experience-projection, eliot-experience-provider and eliot-understanding-assessment. THE ASYMMETRY THAT MAKES A GREP CENSUS UNDERCOUNT IS RECORDED HERE SO IT IS NOT REPEATED: crates/smart/eliot-memory-quality carries NO freeze_ref row at all, and no module.toml path row either, so no manifest-only census can see it -- yet it is one of the eight string-pin consumers and the only one of them currently refusing, because its CONSUMED_FREEZE_DIGEST still holds the r12 digest against the delivered r13 bytes. Its entire freeze binding is a pair of Rust constants and nothing else. The mirror asymmetry matters for the same reason: eliot-cognitive-quality carries a Cargo freeze_ref but no module.toml path row, so the two axes do not have the same membership and no single grep shape covers all three. A THIRD figure explains the residue: two rows in crates/smart/eliot-dreamer-memory-revision/module.toml (field_family_authority and superseded_field_family_owners) mention the freeze path inside prose rather than carrying it as a path value, so a text search for the path returns seven module.toml rows of which only five are path rows. This corrected SEVEN and FIVE AGREE WITH CC-W2-CONSUMER-REPIN in crates/smart/cognitive-contract-challenges.toml, which already carries the same measurement; the two rows must not be allowed to drift apart again, which is the same propagation class in reverse. eliot-experience-provider is stale on r5 and must move to the same revision rather than being left behind. Never mass find-and-replace the id: eliot-memory-quality's binding is a PAIR and both arms must be updated together. THE OLD WORDING NAMED A 'self-comparison assertion' in eliot-memory-quality, AND THAT IS WITHDRAWN, because no self-comparison exists there in that form any more. MEASURED IN THE CURRENT TREE, crates/smart/eliot-memory-quality/src/lib.rs::verify_consumed_freeze compares the DELIVERED bytes, not one constant with another: it reads the freeze_id declared inside those same bytes through declared_freeze_id and the sha256 of those same bytes through sha256_hex, and returns QualityError::VersionMismatch if EITHER side disagrees with its constant, and check_consumed_freeze passes it its own FREEZE_BYTES include_bytes! of the freeze. The identical-literal self-comparison that used to stand there was removed on purpose, because a constant compared with itself can never detect the freeze moving under it, which is exactly why the byte arm now has teeth. THE BINDING IS THEREFORE TWO ARMS THAT MUST MOVE AS ONE: a string arm, CONSUMED_FREEZE_ID, and a byte arm, CONSUMED_FREEZE_DIGEST. ON THIS BRANCH THE STRING ARM AGREES WITH THE DELIVERED FREEZE AND THE BYTE ARM DOES NOT, so the refusal this crate raises is the BYTE ARM ALONE, and that is the half a next repin must move. NEITHER DIGEST IS RESTATED HERE, deliberately: the recorded digest and byte length have exactly one owner, the CC-W9-REV12-HANDOFF resolution_evidence row of crates/smart/cognitive-contract-challenges.toml, and a second copy in this file is the drift H-W2-DIGEST-REPIN exists to prevent. THE DEFECT IS RECORDED RATHER THAN REPAIRED HERE: CC-W2-CONSUMER-REPIN carries its full disposition, both arms are Rust constants, and CC-W2-FREEZE-REPIN's forbidden_workaround names editing a .rs digest or FREEZE_ID constant, so this row describes the shape of the binding and changes nothing. MEASURED ON THE CURRENT BRANCH: seven of the eight pins already read r13 (eliot-cognitive-quality, eliot-dreamer-memory-revision, eliot-dreamer-self-query, eliot-epistemic-context-provider, eliot-experience-projection, eliot-memory-quality CONSUMED_FREEZE_ID, eliot-understanding-assessment); the eighth, crates/smart/eliot-experience-provider/src/lib.rs::FREEZE_ID, is still r5 and remains the one deliberate exception named in CC-W2-CONSUMER-REPIN."
blocking_consumer = "every crate declaring freeze_ref in its Cargo.toml"
status = "REQUIRED_BEFORE_NEXT_CANDIDATE_MERGE"

[[handoff]]
id = "H-W2-CATALOGUE-PROMOTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-wave-01.toml, crates/smart/cognitive-wave-02.toml and crates/smart/cognitive-wave-09.toml owners"
trigger = "This index is accepted."
order = 5
rule = "Each owning wave keeps its own rows; this catalogue adds a sibling index and does not renumber, rewrite or absorb any existing order. The one overlap is NegativeMemoryExtinctionCandidate, which wave-09 already indexes: the implemented Rust field set is authoritative and wave-09's longer semantic field family is SUPERSEDED by an owner decision, recorded as corrected_static_description under MR-04 and as the twenty-one replaced names there. Both indexes must never be treated as two owners."
blocking_consumer = "crates/smart/cognitive-wave-09.toml [[field_contract]] NegativeMemoryExtinctionCandidate"
status = "ADVISORY"

[[handoff]]
id = "H-W2-NORMATIVE-PAIR-CORRECTION"
from = "crates/smart/cognitive-wave-10.toml"
to = "crates/smart/cognitive-wave-01.toml and crates/smart/cognitive-wave-09.toml owners"
trigger = "Any pair identity in a wave catalogue is read."
order = 6
rule = "docs/normative-pair.toml is the only owner of the pair key, the revisions and the edition. MEASURED, CORRECTING THIS ROW'S EARLIER CLAIM that both other wave files disagreed with it: crates/smart/cognitive-wave-09.toml now carries the ACCEPTED ab2011bd value with pair_key_authority naming docs/normative-pair.toml::pair_key, so it agrees; and crates/smart/cognitive-wave-01.toml carries no pair_key key at all, only three prose mentions that assert no value. The ONE remaining contradiction is elsewhere and is not in either wave file: the byte-pinned crates/smart/cognitive-rev12-contract-schema-freeze.toml header carries the pre-sharding sha256:3ea4dc34... in normative_pair_key. This catalogue copies its pair identity from docs/normative-pair.toml, restates no version string of its own, and records the freeze contradiction under CC-W2-NORMATIVE-PAIR-KEY rather than repairing a byte-pinned artefact or an unrelated wave row, because this work unit does not rewrite unrelated files and the freeze repair needs the ordered repin named there."
blocking_consumer = "every catalogue that hand-maintains a pair_key or a document version string"
status = "ADVISORY"

[[handoff]]
id = "H-W2-TOPOLOGY-DRIFT"
from = "crates/smart/cognitive-wave-10.toml"
to = "cognitive-crate-decisions.toml owner"
trigger = "The next wave assignment is issued."
order = 7
rule = "Four measured topology gaps, each resolved on the side that is stale and WITHOUT renumbering anything here. (1) eliot-dreamer-cycle: crates/smart/eliot-dreamer-cycle/Cargo.toml carries NO agent_order, but crates/smart/eliot-dreamer-cycle/module.toml declares agent_order = 3, and crates/smart/cognitive-crate-decisions.toml [[decision]] order = 3 is already eliot-dreamer-contracts -- so this crate's manifest claims an order the ledger has given elsewhere; the earlier claim on this row that it 'has no agent_order' is superseded by measurement. (2) eliot-dreamer-research-synthesis: crates/smart/eliot-dreamer-research-synthesis/Cargo.toml and module.toml both declare agent_order = 6, and ledger order 6 is eliot-dreamer-orientation, whose own two manifests agree; the research-synthesis declaration is the stale side. (3) eliot-dreamer-probe-plan: both manifests declare agent_order = 17, and ledger order 17 is eliot-context-admission, whose own two manifests agree; the probe-plan declaration is the stale side. (4) eliot-dreamer-self-query: prototype = true and module.toml status PROTOTYPE while it is an admitted root workspace member at root Cargo.toml line 187 and a Cargo.lock entry; admitting it as a full cell is a topology decision this issue may not make. Assigning or correcting any of these orders belongs to the cognitive-crate-decisions.toml owner; a duplicate order is rejected at wave review."
blocking_consumer = "crates/smart/cognitive-crate-decisions.toml"
status = "ADVISORY"
resolution_evidence = "measured on the current branch, both sides of every collision read rather than one side assumed: crates/smart/cognitive-crate-decisions.toml [[decision]] rows order 3 = eliot-dreamer-contracts, order 6 = eliot-dreamer-orientation, order 17 = eliot-context-admission, and the ledger stops at 43; crates/smart/eliot-dreamer-cycle/Cargo.toml has no agent_order while crates/smart/eliot-dreamer-cycle/module.toml declares agent_order = 3; crates/smart/eliot-dreamer-research-synthesis/Cargo.toml and module.toml both declare agent_order = 6; crates/smart/eliot-dreamer-probe-plan/Cargo.toml and module.toml both declare agent_order = 17; crates/smart/eliot-dreamer-self-query/Cargo.toml declares prototype = true, source_status IMPLEMENTED_PROTOTYPE and agent_order = 49, crates/smart/eliot-dreamer-self-query/module.toml declares status PROTOTYPE, root Cargo.toml line 187 admits the crate annotated with agent_order 49, and Cargo.lock line 1774 pins it."

