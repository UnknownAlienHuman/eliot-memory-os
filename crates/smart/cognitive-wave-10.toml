[[agent_brief]]
order = 5
crate = "eliot-dreamer-candidate-validation"
functional_cell = "smart.dreamer.candidate_validation"
objective = "Emit the grounding receipt as either an accepted candidate or a retained rejection carrier. Retain the exact supplied grounding, ledger, manifest, policy, usage and preservation report on rejection; never rewrite, deduplicate or normalize them."
write_scope = ["crates/smart/eliot-dreamer-candidate-validation/src/**"]
inputs = ["frozen DreamJobAdmission, DreamInputBundle, ModelDraft, GroundedDreamDraft, ValidationPolicy, BudgetUsage, PreservationReport"]
outputs = ["CandidateValidationOutcome", "StructuredCandidateValidationOutcome"]
forbidden = ["duplicate validation algorithm", "normalizing or deduplicating retained grounding", "a second grounding receipt type parallel to the structured one", "a generic JSON escape field", "self-certifying grounding"]
stop_condition = "Stop and return ContractChallenge when the job shape is outside this gate's supported contract, when a required bound is exceeded, or when a caller asks the gate to make an unsupported claim."
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[agent_brief]]
order = 6
crate = "eliot-dreamer-orientation"
functional_cell = "smart.dreamer.orientation"
objective = "Project one candidate-only Orientation packet with exact source coverage, per-status anchored evidence, interpretation as hypothesis text, rival/dissent residue, hidden-relation residue, unknowns, inert probes, invalidation conditions and provenance that proves projection inputs only."
write_scope = ["crates/smart/eliot-dreamer-orientation/src/**"]
inputs = ["AdmittedOrientationJob", "bounded DreamInputBundle", "ValidatedOrientationCandidate", "CurrentEpistemicPositionHandle list", "OrientationPolicy"]
outputs = ["OrientationPacketCandidate"]
forbidden = ["promoting a model recommendation to a typed plan", "upgrading OrientationResidue to an algorithmic relation", "promoting InertProbe to an effect", "a second ContextCompiler invocation", "an I9.5 DreamPacket type that does not exist in source"]
stop_condition = "Stop and return ContractChallenge when coverage lacks an exact denominator, when a fence or scope identity disagrees, or when a closed OrientationSectionKind would have to be widened."
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

