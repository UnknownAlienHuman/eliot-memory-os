[[forbidden_edge]]
from = "any crate in this catalogue"
to = "canonical state, storage adapter, kernel or daemon implementation, provider SDK, scheduler or effect executor"
reason = "Every output is a candidate or an immutable projection with no operational authority."

[[forbidden_edge]]
from = "eliot-dreamer-research-synthesis"
to = "source acquisition, retrieval or a self-selected coverage denominator"
reason = "Researcher acquires, Dreamer interprets. CC-005 stays the Researcher's contract."

[[forbidden_edge]]
from = "eliot-dreamer-self-query, eliot-dreamer-architecture-brief, eliot-dreamer-implementation-brief"
to = "declaring Architecture or Implementation conformance from a pose receipt or from repository prose"
reason = "Target contract and current support stay separate; conformance evidence is a different owner's field."

[[forbidden_edge]]
from = "eliot-dreamer-memory-revision"
to = "any irreversible extinction operator or a physical purge"
reason = "AdvisoryNarrowing carries only suppress_activation, quarantine and archive by design."

[[forbidden_edge]]
from = "eliot-dreamer-maintenance-plan, eliot-dreamer-configuration-plan, eliot-dreamer-orchestration-plan, eliot-dreamer-probe-plan"
to = "DurableJob, Ready Queue, route reservation, launch, schedule, configuration write, effect, authority or task finish"
reason = "Planning owns none of these; the exclusion is structural in the outcome enums and vocabulary, and is recorded as W2-PLANNING-OWNS-NO-EFFECT."

[[forbidden_edge]]
from = "eliot-dreamer-cycle"
to = "a schedule, a launch, a recurring horizon or any second cycle"
reason = "PlanHorizon has exactly one variant and no cycle field schedules itself."

[[forbidden_edge]]
from = "any crate in this catalogue"
to = "a second type owner duplicating an existing frozen type under a new name, or a generic JSON or vendor SDK escape field"
reason = "A re-export is not a second owner, and an unbounded escape field defeats deny_unknown_fields."

