workspace_rule = "This catalogue is metadata only. It creates no crate, changes no Cargo membership, no Cargo.lock entry and no generated index, and every crate it names already exists as an admitted root workspace member or an explicitly named prototype. IT IS NOT TRUE THAT IT ADDS NO PUBLIC ITEM, and this row's earlier claim that the work unit 'adds no type, no variant, no field, no dependency and no behaviour' is WITHDRAWN as false by direct reading of the delivered source. THE ERROR WAS CONFLATING TWO DIFFERENT CLAIMS, and keeping them apart is the whole repair: 'adds no type to a FROZEN OR PRE-EXISTING OWNER SHAPE', which is what the [[field_contract]] and [[type_contract]] rows below assert and which remains true, is NOT the same claim as 'adds no public item at all', which is false. THE DISPROVING ITEM IS crates/smart/eliot-dreamer-claim-grounding/src/validation_bridge.rs, A BRAND-NEW FILE IN THIS DELIVERY -- absent at both the merge base e5706ef19 and at this commit's own parent 82359727e -- which declares three new PUBLIC items: pub struct ValidationAttachment (six public fields, all explicitly supplied A-05 data), pub struct GroundingValidationRequest (two public fields) and pub fn ground_for_validation, plus the public associated fn GroundingValidationRequest::new. Its crate root re-exports exactly those three names from the module, so they are the public surface. The same file also declares pub(crate) fn bind_validation_input, which is deliberately NOT re-exported so that ground_for_validation stays the only way in; that narrower publicity is why the count of NEW PUBLIC items in this file is three and not four. MEASURED ACROSS THE WHOLE DELIVERY so this row is not narrowed to one file: three further public items are new in the same commit -- pub struct ExactTrigger in crates/smart/eliot-dreamer-memory-revision/src/lib.rs, and pub enum OrientationResidueKind and pub enum InertProbeStatus in crates/smart/eliot-dreamer-orientation/src/projection.rs -- for six new public items across three crates, each indexed by an [[ownership]] or [[type_contract]] row below. WHAT REMAINS TRUE AND IS KEPT: no new crate, no new Cargo dependency, no new [[field_contract]] or [[type_contract]] denominator, and no widening of a frozen family's field set. Those are the claims this catalogue actually rests on; they were never the claim the withdrawn sentence made. The three alias retirements in [[retired_name]] are also still real, but they belong to the earlier commit 92000ee16 rather than to this one; see disjointness_rule."
authority_rule = "No row here owns canonical state, runtime scheduling, evaluator state, policy, authority, finish or external effects."
dependency_rule = "depends_on lists logical contract prerequisites; Cargo dependencies are narrower and exist only for public types actually imported."
order_rule = "No order is created, renumbered or reused by this catalogue. Every [[assignment]] order and every [[assignment_ref]] order below is a value already measured in crates/smart/cognitive-crate-decisions.toml (orders 1-43), crates/smart/cognitive-wave-09.toml (orders 76-86), or a [package.metadata.eliot] agent_order read from the crate's own Cargo.toml."
label_resolution_rule = "The Issue #262 body names ten crate labels. Five of them (eliot-dreamer-validation, eliot-dreamer-memory-models, eliot-dreamer-procedural, eliot-dreamer-diagnosis and eliot-dreamer-planning) do not name a physical crate on base cdf4a29, which is exactly the number of [[label_resolution]] rows carrying physical_crate_found = false; by extension any function-only package is treated the same way and is never realized as a new crate. Each such label is resolved to the measured owning crate or crates in [[label_resolution]]."
freeze_binding_rule = "crates/smart/cognitive-rev12-contract-schema-freeze.toml is NOT edited by this catalogue. Its exact bytes are pinned in THREE places, not two, and TWO of those three are runtime-enforcing: REQUIRED_FREEZE_DIGEST over FREEZE_BYTES in crates/smart/eliot-dreamer-memory-revision/src/lib.rs, enforced by verify_freeze_binding() which propose() calls; CONSUMED_FREEZE_DIGEST over its own separate FREEZE_BYTES include_bytes! of the same freeze file in crates/smart/eliot-memory-quality/src/lib.rs, enforced by verify_consumed_freeze() on that crate's public validation path; and scripts/read_freeze_digest.py, which is not a crate consumer at all -- it reads exactly two inputs, the freeze file and the CC-W9-REV12-HANDOFF row, never opens either include_bytes! consumer, and therefore its PASS is a file-against-row agreement check between two text artifacts and is NOT evidence about any crate constant. MEASURED, CORRECTING THIS ROW'S EARLIER CLAIM THAT THE FREEZE IS HELD BY THE ONE ENFORCING PAIR IN CRATES/SMART/ELIOT-DREAMER-MEMORY-REVISION: that claim is WITHDRAWN as the same error class the last pass corrected in CC-W2-FREEZE-REPIN. There are TWO runtime-enforcing consumers and THREE pins. LIVE COUNTER-EXAMPLE ON THIS BRANCH: scripts/read_freeze_digest.py reports PASS while crates/smart/eliot-memory-quality's CONSUMED_FREEZE_DIGEST still holds the r12 digest against the delivered r13 bytes, so that crate's public validation path refuses. eliot-memory-quality is the one currently refusing; it is issue #261's file and is deliberately not edited here. Per that file's own [readback].rule a byte change is a new freeze candidate, not an edit. Promotion of this index into the freeze is the recorded CC-W2-FREEZE-REPIN handoff. MEASURED ON THE CURRENT BRANCH: the freeze is revision 13 (freeze_id cognitive-rev12-contract-schema-freeze-2026-09-22-r13, revision 13, supersedes_freeze_id r12), and scripts/read_freeze_digest.py reports FREEZE_DIGEST_READBACK: PASS, its EXPECTED_SOURCE being CC-W9-REV12-HANDOFF resolution_evidence. The recorded digest and byte length are stated in THAT row alone, which is the single authoritative copy and the value the script compares the freeze's bytes against; this row does not restate either as a value it maintains, because a second hand-copied digest is exactly how a pin drifts silently."
disjointness_rule = "This catalogue does not modify the four cue handler crates crates/smart/eliot-cue-normalizer, crates/smart/eliot-cue-binding, crates/smart/eliot-cue-index and crates/smart/eliot-cue-activation, retired eliot-understanding paths, root Cargo.toml/Cargo.lock, workflows, normative prose, generated indexes, crates/smart/cognitive-rev12-contract-schema-freeze.toml, or any wave file beyond the sibling Smart catalogues it names. The earlier wording of this rule IS WITHDRAWN, and it was wrong in three directions. THE NUMBER 246 IS WITHDRAWN FIRST, because it has no referent in the current tree and is replaced by the named set for the same reason the twenty-four owner count was dropped from W2-NO-FUNCTION-ONLY-PACKAGE: a hand-kept tally in this file has already gone stale, so the set is named and the number is not maintained. MEASURED, every plausible reading of 246 against this base and every one of them fails to produce it: the four crates now named hold 32 files of which 24 are .rs, and their .rs lines total 13942; the six crates adding eliot-cue-contracts hold 56 files and 24669 .rs lines; the seven crates adding eliot-cues and eliot-cue-activation-wasm hold 71 files and 29755 .rs lines. The phrase is inherited verbatim from the W9 rule introduced by commit 9cf878959, and that commit touched six TOML files and no .rs at all, so 246 was not a count of the delivery that first asserted it either. WHAT THIS CLAUSE ACTUALLY ASSERTS IS THE NEGATIVE CLAIM -- this catalogue modifies none of those four crates -- and that is the claim kept, expressed as four named crates. MEASURED BY git show --stat ON THE COMMIT THAT CARRIES THIS CATALOGUE, c48160c2e. (a) It named six Rust files as the only edits -- crates/smart/eliot-dreamer-orientation/src/input.rs and its src/lib.rs, crates/smart/eliot-dreamer-concept/src/lib.rs and src/synthesis.rs, crates/smart/eliot-dreamer-cycle/src/durable.rs and src/lib.rs -- and NOT ONE of those six is edited by c48160c2e. They are the exact six-file set of the EARLIER commit 92000ee16, which is the commit that carried the three [[retired_name]] alias retirements; those retirements are real and remain recorded, but they belong to that commit and not to this one. crates/smart/eliot-dreamer-orientation/src/input.rs is therefore named in error and is dropped here. (b) The earlier rule's own first sentence said this catalogue does not modify bins/, while c48160c2e edits SEVEN files under bins/eliot-dreamer/src/ -- admitted_material.rs, dispatch_stage.rs, grounding_stage.rs, lib.rs, pipeline_e2e.rs, production_orientation.rs and validation_stage.rs -- so that clause was contradicted by its own delivery. THE ACTUAL DELIVERY, named at the level of crates and seams rather than as an exhaustive path list: 24 files, of which 19 are .rs, across four smart crates -- crates/smart/eliot-dreamer-claim-grounding (5 .rs, including the NEW file src/validation_bridge.rs), crates/smart/eliot-dreamer-memory-revision (3 .rs, including the NEW file src/field_family_tests.rs), crates/smart/eliot-dreamer-orientation (3 .rs) and crates/smart/eliot-dreamer-orientation-wasm (1 .rs, its tests/proof.rs) -- plus the bins/eliot-dreamer/src/ seam named in (b), which is the composition-root leg of the same handoff and not a sixth owner. The five non-.rs files are the three Smart catalogues (cognitive-wave-10.toml itself, cognitive-wave-09.toml and cognitive-contract-challenges.toml) and two module.toml files (crates/smart/eliot-dreamer-claim-grounding/module.toml and crates/smart/eliot-dreamer-memory-revision/module.toml). No Cargo.toml, no Cargo.lock, no workflow file and no generated index is among the 24."
single_ownership_rule = "A concern in this catalogue has exactly one live owner. A second name for a concern is a duplicate owner, not a convenience: an alias, a re-export or a compat spelling that keeps both names live is retired rather than kept, and the retirement is recorded once in [[retired_name]] with its single surviving owner. A re-export that exists only as a consumer boundary over a type the owning crate already declares is not a second owner and is not retired; the two cases are told apart by whether the second name defines anything. Two DISTINCT types that happen to share one name are also not duplicates and are never unified here."

