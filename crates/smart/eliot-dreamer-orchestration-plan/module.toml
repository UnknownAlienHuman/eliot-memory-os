[agent_task]
objective = "Implement one candidate-only CognitiveWorkPlan handler; deterministic compilation, admission and launch remain external."
write_scope = ["crates/smart/eliot-dreamer-orchestration-plan/**"]
deliverables = ["CognitiveWorkPlanCandidate core", "route/budget/independence fixtures", "TaskGraphCompiler Edge fixtures"]
acceptance = ["bounded candidate only", "no admission or launch", "alternatives and verifier paths explicit"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if planning requires admitting TaskGraph nodes, launching agents, creating budget or inventing route capacity."
