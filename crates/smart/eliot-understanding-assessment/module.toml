id = "UnderstandingAssessment"
owner_crate = "eliot-understanding-assessment"
family = "Common Ground and scoped understanding"
source_handles = ["I06-16", "A00-07", "A06-07", "I12-34"]
status = "FROZEN_STATIC_FIELD_CONTRACT"
