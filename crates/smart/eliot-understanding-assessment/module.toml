[[validation_gate]]
id = "W9-UA-LOCALLY-ADEQUATE-EVIDENCE-MINIMUM"
rule = "LOCALLY_ADEQUATE remains scoped and requires, at one declared question/task family and one State Fence, a public rival-aware model, a prediction fixed before observation, a discriminative probe or action, applicable outcome/verifier evidence, and revision discipline on failure. A Complete state and every LOCALLY_ADEQUATE require the exact independently recheckable closure denominator; otherwise the state is INCONCLUSIVE."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-UA-COMMON-GROUND-IS-PUBLIC-INHERITANCE"
rule = "Common Ground is assessed as public causal inheritance on terminology, reference, commitment and action-consequence compatibility. Summary similarity and native continuation state are rejected, tacit competence is not publicly inherited and requires requalification, and a persistent gap produces a candidate Problem rather than a quiet continuity claim."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-UA-NO-SECOND-COMPILATION-OR-ADMISSION"
rule = "The already-compiled ActiveUnderstandingView and the accepted-source projection are consumed by handle. This crate never invokes the ContextCompiler a second time, never runs a second admission pass, never owns a mutable UnderstandingState, and never emits a global understands flag or a single understanding score."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-UA-HELDOUT-WHERE-PRODUCT-CLAIM-APPLIES"
rule = "A product-level understanding claim additionally requires held-out or leakage-controlled evidence. Graphs, prose, self-report, delivery receipts and correlated-agent agreement never set LOCALLY_ADEQUATE, and fixed graph, edge or context thresholds never establish understanding."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
