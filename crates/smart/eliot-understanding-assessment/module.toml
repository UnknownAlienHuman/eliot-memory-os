fields = ["common_ground_terminology_compatibility", "common_ground_reference_compatibility", "common_ground_commitment_compatibility", "common_ground_action_consequence_compatibility", "common_ground_goals_decisions_invariants_rivals_unknowns_survival_after_model_harness_change", "common_ground_public_inheritance_transfer_refs", "common_ground_requalification_scope_for_tacit_competence", "scoped_subject_route_or_coupled_system", "scoped_question_and_task_family", "scoped_product_and_state_fence", "scoped_current_model_and_rivals", "scoped_material_unknowns", "scoped_pre_probe_predictions_fixed_before_observation", "scoped_selected_discriminator_or_action", "scoped_observed_outcome_and_verifier", "scoped_model_revision_after_outcome", "scoped_counterfactual_or_held_out_evidence", "scoped_transfer_boundary_and_requalification", "scoped_onboarding_slice_and_missing_inputs", "scoped_status_not_onboarded_or_untested_or_locally_adequate_or_refuted_or_inconclusive_or_stale", "scoped_unanswerable_stale_case_where_applicable", "scoped_counterfactual_intervention_or_state_update_case_where_applicable", "scoped_held_out_compositional_transfer_where_applicable", "scoped_abstention_precision_coverage_where_applicable"]
