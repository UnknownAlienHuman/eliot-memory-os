complete_rule = "Every Complete state and every LOCALLY_ADEQUATE requires the exact independently recheckable denominator above; NOT_ONBOARDED forbids LOCALLY_ADEQUATE until missing inputs resolve."
fence = "Product and State Fence binding per assessment; transfer requires explicit boundary and requalification."
omission_semantics = "Graphs, prose quality, self-report, delivery receipts, or correlated-agent agreement cannot set LOCALLY_ADEQUATE; fixed graph/edge/context thresholds cannot establish understanding. Outcome and discriminator cites require owner-verified roles."
invariants = ["no global understands flag and no single understanding score", "Common Ground is public causal inheritance, not summary similarity or native continuation state", "Common Ground compatibility is measured on terminology, reference, commitment and action-consequence grounds and survives model and harness change only as public inheritance", "tacit competence is not inherited publicly and requires requalification", "LOCALLY_ADEQUATE requires rival-aware model plus prediction before observation plus discriminator plus applicable outcome/verifier plus revision discipline", "product claims additionally require held-out or leakage-controlled evaluation", "retrieval/popularity/completion/delivery/tool-availability/model-agreement do not establish understanding", "no second ContextCompiler invocation, no mutable UnderstandingState, no second admission pass", "consume immutable owner-produced projections only", "every Complete state and every LOCALLY_ADEQUATE requires the exact independently recheckable denominator", "this crate owns no canonical state, lifecycle transition, scheduler, effect, authority or task finish"]

