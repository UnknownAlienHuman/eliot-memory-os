schema_version = 2
module_id = "smart.dreamer.relation"
crate = "eliot-dreamer-relation"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 18
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.relation"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Propose one typed directed relation between admitted endpoints with provenance, epistemic status, scope, time, and invalidation conditions."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Curation", "ValidatedDreamDraft item kind=relation", "admitted endpoint and relation-registry handles"]
outputs = ["RelationCandidate", "endpoint/registry validation report", "rival relation candidates"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
consumers = ["eliot-dreamer-curation"]
non_goals = ["graph persistence", "causal promotion from similarity", "endpoint creation", "broad graph traversal"]
invariants = ["both endpoints are exact admitted handles", "direction/type/scope/time are explicit", "similarity/co-change/sequence remain non-causal", "rival relations are preserved"]
failure_behavior = "Reject only the invalid relation candidate and preserve the source statement; never invent an endpoint or causal edge."
proof_surface = ["unknown endpoint", "direction reversal", "similarity-to-causality negative case", "scope/time mismatch"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-system-experience/src/lib.rs"
disposition = "extract_pure_only"
scope = "validated relation shape, not owner state"

[[donor]]
path = "ELIOT_IMPLEMENTATION I5.18 and I12.9"
disposition = "authoritative_contract"
scope = "relation registry and graph evidence semantics"

[agent_task]
objective = "Implement relation proposal as a typed micro-handler, not as graph ownership."
write_scope = ["crates/smart/eliot-dreamer-relation/**"]
deliverables = ["relation candidate builder", "registry/endpoint checks", "causal-laundering negative tests"]
acceptance = ["no graph mutation", "typed relation and invalidation always present", "invalid endpoint cannot be silently repaired"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if the relation requires source acquisition, graph mutation, or causal verification; return the applicable requirement."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof in an isolated candidate workspace, affected edge proof, current-main rebase and integration-owner review"
