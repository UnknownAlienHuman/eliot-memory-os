schema_version = 1
authority = "eliot-cognitive-function-design-rev12"
status = "W2_D3B_AGENT_HANDOFF_CONTRACT"
field_contract_index = "crates/smart/cognitive-rev12-w2-field-contracts.toml"
brief_index = "crates/smart/cognitive-rev12-w2-agent-brief-index.toml"

[worker]
reads = ["one indexed W2 brief", "the exact field contracts named by that brief", "declared Architecture/Implementation anchors", "one-hop public contracts and fixtures only"]
writes = ["the brief declared src/<cell>.rs", "the brief declared tests/<cell>.rs"]
forbidden = ["Cargo.toml", "src/lib.rs", "re-exports", "another cell source", "root workspace", "runtime wiring", "canonical state", "provider acquisition", "storage/filesystem scan", "model/provider/tool execution", "Context delivery/use", "authority", "scheduler", "task finish", "proof/status files", "local public-type redefinition", "oracle weakening"]
return = ["implemented exact declared function", "typed errors", "minimum and contract negative tests", "remaining ContractChallenge", "actual proof ceiling"]

[integration_owner]
owns = ["Cargo.toml", "src/lib.rs and re-exports", "cross-cell compatibility", "public-type ownership validation", "package Module Proof", "real Edge Proof", "Product Pulse", "migration and retirement"]

[challenge]
required_when = ["field contract absent or contradictory", "public type owner unresolved", "discriminator cannot fail old behavior", "work requires hidden I/O/model/tool/provider SDK", "work requires another mutable owner", "worker must weaken an oracle", "complete causal workset does not fit"]

[ordering]
contracts_precede_workers = true
parallel_workers_require_disjoint_source_files = true
shared_contract_change_serialized_by_integration_owner = true
worker_never_integrates_own_result = true
normalization_precedes_binding_and_direct_match = true
binding_precedes_snapshot_build = true
snapshot_precedes_direct_match_and_spread = true
direct_match_precedes_spread_and_activation = true
contribution_merge_precedes_admission = true
admission_precedes_assembly = true
assembly_precedes_quality_and_decision_tail = true
decision_tail_precedes_reactive_plan = true

