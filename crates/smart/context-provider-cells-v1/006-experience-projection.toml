  "success or failure count is not causal attribution",
  "temporal sequence is not a causal edge",
  "unknown external effect remains Unknown",
  "projection does not create AttemptLearningDelta, procedure, Skill or promotion input",
  "eliot-system-experience remains donor-only and cannot be a second mutable state owner",
]
