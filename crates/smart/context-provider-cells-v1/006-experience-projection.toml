  "SystemExperienceProjectionRequest",
  "SystemExperienceProjectionInputs",
  "OwnerProjectionRef",
  "AttemptExperience",
  "AttemptSequenceObservation",
  "FailureObservation",
  "OutcomeObservation",
  "OutcomeAttribution",
  "ConfounderRecord",
  "ExperienceCoverage",
  "SystemExperienceProjection",
]
type_shapes = [
  "pub enum OutcomeAttribution { ObservedAssociation, SupportedContribution, ObservedUnderIntervention, CompositeBenefit, Contradicted, Unknown }",
  "pub enum ExperienceCoverage { CompleteForRequest, Partial, Stale, Blocked }",
  "pub struct SystemExperienceProjectionInputs { pub task_projection: OwnerProjectionRef, pub attempt_lineage_projection: OwnerProjectionRef, pub trace_projection: OwnerProjectionRef, pub artifact_projection: OwnerProjectionRef, pub evaluator_projection: OwnerProjectionRef, pub effect_projection: OwnerProjectionRef, pub preserved_success_projection: Option<OwnerProjectionRef> }",
  "pub struct SystemExperienceProjection { pub projection_id: String, pub task_id: String, pub state_fence: StateFence, pub source_owner_revisions: Vec<OwnerProjectionRef>, pub attempts: Vec<AttemptExperience>, pub sequences: Vec<AttemptSequenceObservation>, pub failures: Vec<FailureObservation>, pub outcomes: Vec<OutcomeObservation>, pub confounders: Vec<ConfounderRecord>, pub coverage: ExperienceCoverage, pub missing_or_stale_owner_refs: Vec<String>, pub digest: String }",
]
preconditions = [
  "all owner projections are immutable, bounded and tied to exact task/attempt identities",
  "all load-bearing projections share one compatible StateFence",
  "request names the exact attempt/task range and required owners",
  "effect and evaluator outcomes distinguish executed, unknown, stale and not executed",
]
algorithm = [
  "validate request and expected owner set",
  "join attempts, traces, artifacts, evaluator observations and effect receipts only by exact stable identities",
  "record observed sequence separately from mechanism or causal attribution",
  "compare predeclared hypothesis/prediction with actual observable only when both exist",
  "classify attribution with the strongest justified enum value and retain contrary evidence/confounders",
  "retain failed, partial, cancelled and unknown-outcome attempts",
  "mark missing/stale owner coverage explicitly",
  "canonicalize by attempt lineage and event order, then compute digest",
]
