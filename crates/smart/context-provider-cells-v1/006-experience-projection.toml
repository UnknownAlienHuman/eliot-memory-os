responsibility = "Join immutable task, attempt, trace, artifact, evaluator and effect-owner projections into one bounded SystemExperienceProjection without creating an experience store or causal claim beyond evidence."
public_functions = [
  "pub fn project_system_experience(request: &SystemExperienceProjectionRequest, inputs: &SystemExperienceProjectionInputs) -> Result<SystemExperienceProjection, ExperienceProjectionError>",
]
