  "InvalidIdentity",
  "InvalidFence",
  "UnknownProviderClass",
  "DuplicateProvider",
  "RoleUnsupported",
  "RoleOverclaim",
  "RegistryRevisionMismatch",
  "ExpectedSetDigestMismatch",
  "DispositionPayloadMismatch",
  "IncompleteDenominator",
]
tests = [
  "all six provider classes round-trip and no seventh class decodes",
  "DecisionLocalTail cannot decode as ContextProviderClass",
  "EmptyComplete requires complete denominator and zero atoms",
  "Unavailable with contribution payload is rejected",
  "mandatory provider omission is rejected",
  "optional unavailable result remains valid and explicit",
  "provider result for another expected-set digest is rejected",
]
