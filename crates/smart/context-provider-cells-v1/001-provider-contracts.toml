  "pub fn validate_provider_projection_request(request: &ContextProviderProjectionRequest) -> Result<(), ContextProviderContractError>",
  "pub fn validate_provider_contribution_result(result: &ProviderContributionResult) -> Result<(), ContextProviderContractError>",
