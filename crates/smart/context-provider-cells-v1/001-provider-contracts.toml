  "ProviderLimit",
]
type_shapes = [
  "pub enum ContextProviderClass { TaskContinuity, CriticalAttention, EpistemicPosition, MemoryRecall, AuthorityAffordance, SelfModel }",
  "pub enum ContextSemanticRole { Goal, Acceptance, Attention, EpistemicPosition, SemanticModel, CausalModel, Continuity, Invariant, NegativeMemory, Evidence, Unknown, Affordance, Verifier, NextBoundary, SelfModel }",
  "pub enum ContextProviderRequirement { Mandatory, Optional, Conditional }",
  "pub enum ProviderContributionDisposition { Complete, EmptyComplete, Partial, Unavailable, Stale, Blocked, NotApplicable }",
  "pub struct ContextProviderProjectionRequest { pub request_id: String, pub compilation_id: String, pub provider_id: String, pub provider_class: ContextProviderClass, pub expected_provider_set_digest: String, pub registry_revision: u64, pub recipe_revision: String, pub scope_id: String, pub task_id: Option<String>, pub state_fence: StateFence, pub required_roles: Vec<ContextSemanticRole>, pub maximum_atoms: u32, pub maximum_inline_bytes: u32, pub policy_snapshot_ref: String, pub disclosure_decision_ref: Option<String> }",
]
input_owners = ["eliot-contracts::StateFence", "eliot-context-contracts owns every type declared by this cell"]
output_owners = ["eliot-context-contracts owns the closed provider/result wire algebra"]
preconditions = [
  "all identifiers are nonblank, bounded and canonicalizable",
  "all entries in one registry/set/request/result share one compatible StateFence",
  "provider class is one of the six closed classes and DecisionLocalTail is not a provider class",
  "every expected provider names supported roles and one requirement class",
]
algorithm = [
  "validate bounded identities, revisions and collections",
  "reject duplicate provider identities or duplicate classes where the recipe requires a single owner",
  "validate that supported roles cover every requested/expected role without overclaim",
  "validate result identity against exact request and expected-set digest",
  "require contribution presence only for Complete/Partial; require no payload for Unavailable/Stale/Blocked/NotApplicable; allow EmptyComplete only with a complete denominator",
  "canonicalize maps and vectors by stable identity and compute canonical digest",
]
complexity = "O(p log p + a log a) time and O(p + a) memory within explicit registry/provider/atom limits; no I/O."
invariants = [
  "the contract crate owns no provider implementation, registry lifecycle or Context admission",
  "one expected provider produces exactly one typed result or one typed collector failure",
  "EmptyComplete is not Unavailable, Partial, Stale, Blocked or NotApplicable",
  "a provider cannot claim another provider class or semantic role",
  "ContextAtom is a whole addressable unit and cannot be silently sliced",
  "Decision-local tail is assembled after admission and never appears in the provider denominator",
]
degradation = "Unknown class, unsupported role, stale registry/fence or missing mandatory provider fails typed validation; optional unavailable providers remain explicit results."
