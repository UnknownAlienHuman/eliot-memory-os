  "RequestInvalid",
  "NormativePairMismatch",
  "ArchitectureIdentityMismatch",
  "ImplementationIdentityMismatch",
  "SourceDigestMismatch",
  "FenceMismatch",
  "CurrentSupportOverclaim",
  "DimensionCollapsed",
  "CoverageInvalid",
  "LimitExceeded",
]
tests = [
  "accepted Architecture anchor becomes Constitutional only",
  "Implementation target without source evidence remains Target/Unknown",
  "prose-only current support is rejected",
  "operational degradation remains separate from implemented source",
  "system experience does not become constitutional rule",
  "all five dimensions survive round-trip",
  "wrong normative pair fails closed",
]
