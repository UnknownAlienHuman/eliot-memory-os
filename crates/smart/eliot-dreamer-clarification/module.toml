schema_version = 4
module_id = "smart.dreamer.clarification"
crate = "eliot-dreamer-clarification"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 7
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.clarification"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "One material ambiguity yields one discriminative question and safe fallback without becoming part of basic Orientation or owning delivery."
causal_property = "single discriminative clarification candidate"
old_failure_or_missing_capability = "Clarification was ordered as an Orientation prerequisite and its task was mixed with mailbox delivery concerns."
discriminator = "The handler emits exactly one question or an explicit no-question disposition, and basic Orientation can pass without it."
primary_responsibility = "Select and render one concise discriminative clarification question, why it matters and the safe fallback if unanswered."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Clarification", "ValidatedDreamDraft", "active-agent or Human-boundary projection"]
outputs = ["ClarificationDecision", "ClarificationCandidate", "routing recommendation", "safe fallback and expiry"]
depends_on = ["eliot-contracts", "eliot-dreamer-contracts"]
providers = ["Governor-admitted Dreamer bundle", "active agent or Human boundary owner"]
consumers = ["agent mailbox compiler", "Human attention proposal"]
non_goals = ["notification delivery", "attention ownership", "answer validation", "task decision", "inventing an answer", "basic Orientation synthesis"]
invariants = ["zero or one atomic question", "the answer changes a material branch or satisfies a hard owner boundary", "Human routing only at an explicit Human-owned boundary", "unanswered state preserves the unknown and declared fallback", "candidate-only proof and zero effects"]
failure_behavior = "Return an explicit typed no-question, blocked, partial, decomposition, unauthorized, cancelled or expired disposition; never generate a questionnaire or assume an answer."
proof_surface = ["atomicity and materiality", "task-local versus Human routing", "complete answer branch mapping", "unanswered fallback and invalidation", "no transport, answer, mutation, authority or Finish path"]
proof_ceiling = "Module proof only; real provider/consumer Edge proof and Product Pulse remain separate"
product_pulse = "D3A_CLARIFICATION_EDGE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-dreamer-core/src/lib.rs"
disposition = "rewrite only bounded candidate vocabulary; reject delivery, answer handling and state mutation"

[[donor]]
path = "docs/architecture/I09-03-job-classes.md and docs/architecture/I09-11-clarification-routing.md"
disposition = "authoritative question and routing boundary"

[agent_task]
objective = "Implement Clarification as one independent pure handler, leaving mailbox, authentication, answer validation and attention delivery to their owners."
write_scope = ["crates/smart/eliot-dreamer-clarification/**"]
deliverables = ["closed candidate/decision contracts", "deterministic selector and renderer", "39-case atomicity/routing/fallback acceptance suite"]
acceptance = ["zero or one concise question", "no state mutation or delivery side effect", "complete branch and ambiguity accounting", "safe fallback and invalidation remain explicit"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if selecting a question requires deciding the underlying fact; retain the ambiguity and return no selection."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["standalone fmt/test/clippy/doc", "all 39 Issue #630 cases discovered and passed", "independent atomicity/materiality/Human-boundary review", "workspace admission remains separate under #968"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"

[acceptance]
min_source_lines = 500
min_public_items = 20
min_tests = 39
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = ["propose_clarification", "AdmittedClarificationJob", "ClarificationPolicy", "ActiveAgentOrHumanBoundary", "ClarificationDecision", "ClarificationCandidate", "ClarificationDisposition", "AnswerSchema", "UnansweredFallback"]
required_tests = ["valid_atomic_choice_question", "crate_has_no_transport_provider_store_mutation_or_finish_path"]
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!', 'std::process', 'std::fs', 'tokio', 'reqwest', 'surrealdb']
