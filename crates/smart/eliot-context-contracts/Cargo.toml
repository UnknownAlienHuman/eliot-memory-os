[package]
name = "eliot-context-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Closed Context provider-registry contracts for ELIOT."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
layer = "C0"
purpose = "closed Context provider denominator and generic provider request"
source_maintenance_owner = "cognitive-integration-owner"
functional_cell_refs = ["smart.context.provider_registry_contracts"]
independent_proof_profile = "cargo test --manifest-path crates/smart/eliot-context-contracts/Cargo.toml"
contract_refs = ["crates/smart/cognitive-current.toml"]
implementation_support = "PACKAGE_CANDIDATE"
evidence_execution_status = "NOT_EXECUTED"
workspace_admission = "pending package proof, edge proof, and integration-owner review"

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[workspace]
