signature = "pub fn validate_pending_context_injection_plan(view: &ActiveUnderstandingView, tail: &DecisionLocalTail, host: &HostContextCapabilitySnapshot, policy: &ReactiveContextPolicy, plan: &PendingContextInjectionPlan) -> Result<(), ContextContractError>"

[[negative_test]]
id = "missing-provider-not-empty"
property = "Missing mandatory provider cannot be represented as empty complete candidate set."

[[negative_test]]
id = "unknown-delta-not-zero"
property = "Unknown DecisionDelta cannot justify suppression as zero value."

[[negative_test]]
id = "safety-floor-before-optional"
property = "Optional provider atom cannot consume budget required by a Safety Floor requirement."

[[negative_test]]
id = "headroom-before-optional"
property = "Optional allocation cannot consume downstream output/tool/reasoning/tail headroom."

[[negative_test]]
id = "provider-fairness"
property = "One verbose provider cannot consume the entire optional budget before other eligible providers receive a round."

[[negative_test]]
id = "every-candidate-dispositioned"
property = "SelectionIntegrityRecord rejects any missing or duplicated input-atom decision."

[[negative_test]]
id = "required-omission-reversible"
property = "Required/protected atom omission without an intelligible exact handle or compilation block is rejected."

[[negative_test]]
id = "assembly-no-membership-change"
property = "ActiveUnderstandingView cannot add, remove or change an admitted atom/disposition."

[[negative_test]]
id = "quality-no-aggregate"
property = "PacketQualityScorecard exposes no scalar total and a failed Safety Floor dimension remains blocking despite other passes."

[[negative_test]]
id = "missing-tokenizer-inconclusive"
property = "Absent exact tokenizer measurement is Inconclusive, not zero tokens or Pass."

[[negative_test]]
id = "tail-no-authority"
property = "DecisionLocalTail cannot invent next action, action authority or verifier absent from the boundary/view lineage."

[[negative_test]]
id = "tool-only-no-prevention"
property = "ToolOnly/ObserveOnly/Offline/Unavailable host cannot produce Ready PreAction injection or prevention claim."

[[negative_test]]
id = "plan-not-receipt"
property = "PendingContextInjectionPlan exposes no delivered, acknowledged, resolved, used, helpful or prevented-failure state."
