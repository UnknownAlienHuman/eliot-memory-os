invariants = ["host/generation/route/coverage/fence exact", "capabilities are observations not marketing labels", "ToolOnly/ObserveOnly/Offline/Unavailable cannot claim enforced pre-action delivery"]

[[public_type]]
name = "ReactiveContextPolicy"
kind = "struct"
definition = ["policy_id: ArtifactId", "policy_revision: String", "allowed_delivery_modes: Vec<ContextDeliveryMode>", "required_receipt_kind: String", "maximum_payload_bytes: u32", "maximum_handle_count: u32", "dedup_key_rule: String", "deadline_rule: String", "policy_sha256: String"]
invariants = ["modes unique", "bounds non-zero", "policy grants no host capability, delivery or prevention proof"]

[[public_type]]
name = "ContextDeliveryMode"
kind = "enum"
definition = ["PreAction", "NextBoundary", "AttentionOnly", "Unsupported"]

[[public_type]]
name = "PendingInjectionPlanState"
kind = "enum"
definition = ["Ready", "Partial", "Blocked", "Stale", "Unsupported"]

[[public_type]]
name = "PendingContextInjectionPlan"
kind = "struct"
definition = ["plan_id: ArtifactId", "view_sha256: String", "tail_sha256: String", "host_snapshot_sha256: String", "policy_sha256: String", "mode: ContextDeliveryMode", "state: PendingInjectionPlanState", "payload_section_refs: Vec<ArtifactId>", "expansion_handles: Vec<ExpansionHandle>", "attention_obligation_ref: Option<ArtifactId>", "deadline_ref: String", "dedup_key_suggestion: String", "required_receipt_kind: String", "limitation_reason_codes: Vec<String>", "state_fence: StateFence", "plan_sha256: String"]
invariants = ["plan/view/tail/host/policy/fence exact", "PreAction only for observed EventIntegrated capability", "ToolOnly uses NextBoundary or AttentionOnly", "plan contains no delivery/acknowledgement/prevention receipt", "session dedup owner external", "canonical order and digest"]

