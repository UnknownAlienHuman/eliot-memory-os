name = "validate_context_candidate_set"
signature = "pub fn validate_context_candidate_set(expected: &ExpectedContextProviderSet, contributions: &[ProviderContribution], set: &ContextCandidateSet) -> Result<(), ContextContractError>"

[[public_function]]
name = "validate_context_recipe"
signature = "pub fn validate_context_recipe(recipe: &ContextRecipe) -> Result<(), ContextContractError>"

