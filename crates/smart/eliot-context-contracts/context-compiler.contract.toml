[[public_type]]
name = "ContextImpactClass"
kind = "enum"
definition = ["Observe", "Reversible", "Material", "Critical"]

[[public_type]]
name = "ContextCandidateAtom"
kind = "struct"
definition = ["candidate_atom_id: ArtifactId", "provider_id: ProviderId", "provider_class: ContextProviderClass", "provider_generation: String", "provider_atom: ProviderAtom", "provider_contribution_sha256: String", "expected_provider_set_sha256: String", "candidate_reason_codes: Vec<String>"]
invariants = ["provider atom is whole and unchanged", "provider/contribution/expected-set identities exact", "candidate contains no admission disposition"]

[[public_type]]
name = "DecisionSafetyFloorRequirement"
kind = "struct"
definition = ["requirement_id: ArtifactId", "role: ContextRole", "allowed_classes: Vec<ContextAtomClass>", "minimum_whole_units: u32", "protected_source_or_atom_refs: Vec<ArtifactId>", "allow_exact_handle: bool", "allow_warning: bool", "failure_reason_code: String"]
invariants = ["allowed classes unique", "minimum non-zero", "protected refs unique", "required role cannot be satisfied by unrelated provider or class"]

[[public_type]]
name = "DecisionSafetyFloor"
kind = "struct"
definition = ["floor_id: ArtifactId", "impact_class: ContextImpactClass", "requirements: Vec<DecisionSafetyFloorRequirement>", "active_directive_refs: Vec<ArtifactId>", "floor_sha256: String"]
invariants = ["requirements/active directives unique", "Material/Critical floor includes goal/acceptance, scope/fence, material unknown/conflict/negative memory, expected effect and verifier roles when applicable", "floor cannot be weakened by recipe"]

[[public_type]]
name = "ContextCandidateSet"
kind = "struct"
definition = ["candidate_set_id: ArtifactId", "request_id: RequestId", "scope_id: String", "task_id: Option<TaskId>", "route_fingerprint: String", "state_fence: StateFence", "expected_provider_set_sha256: String", "provider_contribution_sha256s: Vec<String>", "provider_coverage: Vec<ProviderCoverage>", "atoms: Vec<ContextCandidateAtom>", "safety_floor: DecisionSafetyFloor", "candidate_set_sha256: String"]
invariants = ["every expected provider has one coverage row", "all contribution digests/atom ids unique", "every atom belongs to one contribution/provider/fence", "missing/partial/unavailable provider visible", "no admission, delivery or authority field", "canonical order and digest"]

[[public_type]]
name = "ContextSectionBudget"
kind = "struct"
definition = ["role: ContextRole", "unit_boundary_kind: String", "minimum_required_whole_units: u32", "protected_floor_or_required_refs: Vec<ArtifactId>", "planning_maximum_units: u32", "planning_maximum_bytes: u32", "allow_handle_fallback: bool", "degradation_reason_code: String"]
invariants = ["whole-unit boundary explicit", "planning maximum not below required minimum", "bounds non-zero where applicable", "budget cannot authorize dropping floor"]

[[public_type]]
name = "RouteBudget"
kind = "struct"
definition = ["route_fingerprint: String", "actual_tokenizer_ref: String", "maximum_context_bytes: u32", "maximum_context_tokens: u32", "maximum_atoms: u32", "section_budgets: Vec<ContextSectionBudget>", "budget_profile_sha256: String"]
invariants = ["route/tokenizer exact", "bounds non-zero", "one section budget per role", "budget is planning input not product proof"]

[[public_type]]
name = "DownstreamHeadroom"
kind = "struct"
definition = ["reservation_id: ArtifactId", "tool_result_bytes: u32", "reasoning_review_tokens: u32", "decision_tail_tokens: u32", "output_tokens: u32", "safety_margin_tokens: u32", "reservation_sha256: String"]
invariants = ["all required reserves non-zero for applicable route", "reservation is subtracted before optional allocation", "headroom cannot be consumed by earlier provider verbosity"]

[[public_type]]
name = "ProviderFairnessPolicy"
kind = "struct"
definition = ["round_order: Vec<ContextProviderClass>", "maximum_optional_units_per_provider_per_round: u32", "maximum_rounds: u32", "canonical_tie_break: String"]
invariants = ["provider classes unique", "bounds non-zero", "round order grants no epistemic priority or authority"]

[[public_type]]
name = "ContextRecipe"
kind = "struct"
definition = ["recipe_id: ArtifactId", "recipe_revision: String", "applicable_task_family: String", "route_fingerprint: String", "impact_class: ContextImpactClass", "governance_profile_ref: String", "stage_order: Vec<String>", "route_budget: RouteBudget", "headroom: DownstreamHeadroom", "safety_floor: DecisionSafetyFloor", "provider_fairness: ProviderFairnessPolicy", "protected_roles: Vec<ContextRole>", "quarantined_source_refs: Vec<ArtifactId>", "layout_ref: ArtifactId", "quality_blocking_dimensions: Vec<PacketQualityDimension>", "parent_recipe_ref: Option<ArtifactId>", "expiry_or_requalification: String", "recipe_sha256: String"]
invariants = ["recipe/task/route/impact/governance identity exact", "stages/roles/dimensions unique", "cannot weaken Safety Floor, privacy, authority, active directives, omission reversibility or proof ceiling", "recipe is immutable externally governed input"]

[[public_type]]
name = "AdmissionDisposition"
kind = "enum"
definition = ["IncludePayload", "IncludeExactExcerpt", "IncludeHandle", "IncludeWithWarning", "RequireRevalidation", "Suppress", "Quarantine", "Reject"]

[[public_type]]
name = "AdmissionOmissionReason"
kind = "enum"
definition = ["Budget", "HeadroomReservation", "ProviderFairness", "Duplicate", "DisclosureDenied", "UnsafeRepresentation", "Stale", "DeniedInfluence", "RoleUnsupported", "SafetyFloorUnrepresentable", "PolicySuppressed"]

[[public_type]]
name = "ExpansionHandle"
kind = "struct"
definition = ["handle: ArtifactId", "source_atom_id: ArtifactId", "source_contribution_sha256: String", "required_capability_ref: Option<String>", "validity_condition: String"]
invariants = ["handle/source identity exact", "expansion revalidates disclosure/scope/fence", "handle never re-executes original effect"]

[[public_type]]
name = "AdmissionDecision"
kind = "struct"
definition = ["decision_id: ArtifactId", "candidate_atom_id: ArtifactId", "provider_id: ProviderId", "role: ContextRole", "disposition: AdmissionDisposition", "selected_representation: Option<ProviderAtomRepresentation>", "omission_reason: Option<AdmissionOmissionReason>", "expansion_handle: Option<ExpansionHandle>", "warning_or_revalidation_codes: Vec<String>", "allocated_units: u32", "allocated_bytes: u32", "selection_round: u32", "reason_codes: Vec<String>"]
invariants = ["exactly one disposition per candidate", "included disposition has safe representation", "suppressed/quarantined/rejected has omission reason", "required/protected omitted atom has expansion handle or blocks compilation", "decision claims no delivery/use/outcome"]

[[public_type]]
name = "SelectionIntegrityRecord"
kind = "struct"
definition = ["candidate_set_sha256: String", "recipe_sha256: String", "expected_provider_set_sha256: String", "input_atom_ids: Vec<ArtifactId>", "decision_atom_ids: Vec<ArtifactId>", "admitted_atom_ids: Vec<ArtifactId>", "omitted_atom_ids: Vec<ArtifactId>", "safety_floor_requirement_ids: Vec<ArtifactId>", "headroom_reservation_sha256: String", "provider_rounds_executed: u32", "record_sha256: String"]
invariants = ["every input atom has one decision", "admitted/omitted partition exactly covers input", "Safety Floor/headroom identities exact", "no atom invented or lost", "canonical order and digest"]

[[public_type]]
name = "AdmittedContextAtom"
kind = "struct"
definition = ["candidate_atom_id: ArtifactId", "provider_atom_id: ArtifactId", "provider_id: ProviderId", "role: ContextRole", "class: ContextAtomClass", "loss_policy: ContextLossPolicy", "disposition: AdmissionDisposition", "representation: ProviderAtomRepresentation", "source_handles: Vec<ArtifactId>", "epistemic_status_ref: Option<String>", "warning_or_revalidation_codes: Vec<String>", "allocated_units: u32", "allocated_bytes: u32"]
invariants = ["membership/disposition/representation exactly derive from candidate and decision", "source lineage retained", "status reference is not rewritten"]

[[public_type]]
name = "AdmittedContextSet"
kind = "struct"
definition = ["admitted_set_id: ArtifactId", "candidate_set_sha256: String", "recipe_sha256: String", "scope_id: String", "task_id: Option<TaskId>", "route_fingerprint: String", "state_fence: StateFence", "atoms: Vec<AdmittedContextAtom>", "decisions: Vec<AdmissionDecision>", "safety_floor_satisfied_requirement_ids: Vec<ArtifactId>", "remaining_headroom: DownstreamHeadroom", "selection_integrity: SelectionIntegrityRecord", "admitted_set_sha256: String"]
invariants = ["all atoms have Include dispositions", "every candidate has one decision", "required floor satisfied or no admitted set", "remaining headroom non-negative and exact", "contains no delivery/use/outcome", "canonical order and digest"]

[[public_type]]
name = "ContextLayout"
kind = "struct"
definition = ["layout_id: ArtifactId", "layout_revision: String", "route_fingerprint: String", "semantic_role_order: Vec<ContextRole>", "section_heading_templates: Vec<ContextSectionHeading>", "warning_rendering_rule: String", "handle_rendering_rule: String", "maximum_rendered_bytes: u32", "layout_sha256: String"]
invariants = ["role order/headings unique", "bounds non-zero", "layout cannot change membership/disposition/epistemic meaning"]

[[public_type]]
name = "ContextSectionHeading"
kind = "struct"
definition = ["role: ContextRole", "heading: String"]

[[public_type]]
name = "ContextSection"
kind = "struct"
definition = ["section_id: ArtifactId", "role: ContextRole", "heading: String", "atom_ids: Vec<ArtifactId>", "rendered_content: String", "expansion_handles: Vec<ExpansionHandle>", "warning_codes: Vec<String>", "rendered_sha256: String"]
invariants = ["atom ids belong to admitted set and are unique", "rendering preserves role/disposition", "handle-only/omission remains expandable", "section cannot change membership"]

[[public_type]]
name = "ViewOmissionManifest"
kind = "struct"
definition = ["omitted_candidate_atom_ids: Vec<ArtifactId>", "admission_decision_ids: Vec<ArtifactId>", "expansion_handles: Vec<ExpansionHandle>", "explicit_losses: Vec<String>", "manifest_sha256: String"]
invariants = ["all omissions/losses exact and reversible where possible", "no silent truncation", "required loss blocks valid view"]

[[public_type]]
name = "ActiveUnderstandingView"
kind = "struct"
definition = ["view_id: ArtifactId", "admitted_set_sha256: String", "layout_sha256: String", "scope_id: String", "task_id: Option<TaskId>", "route_fingerprint: String", "state_fence: StateFence", "sections: Vec<ContextSection>", "omission_manifest: ViewOmissionManifest", "rendered_bytes: u32", "rendered_tokens: Option<u32>", "tokenizer_measurement_ref: Option<ArtifactId>", "view_sha256: String"]
invariants = ["sections follow layout role order", "membership equals admitted set", "required atom render failure blocks view", "token measurement absent means unknown not zero", "canonical order and digest"]

[[public_type]]
name = "PacketQualityDimension"
kind = "enum"
definition = ["GoalAcceptanceCoverage", "CriticalAttentionCoverage", "EpistemicPositionCoverage", "RivalCounterevidenceCoverage", "SemanticCausalModelCoverage", "ContinuityCoverage", "InvariantNegativeMemoryCoverage", "UnknownInquiryCoverage", "ExactEvidenceCoverage", "AuthorityAffordanceCoverage", "DecisionBoundaryCoverage", "StateFenceConsistency", "ProviderDenominatorIntegrity", "WholeUnitIntegrity", "ReversibleOmission", "DownstreamHeadroom", "SelectionIntegrity", "RouteMeasurementValidity"]

[[public_type]]
name = "PacketQualityResult"
kind = "enum"
definition = ["Pass", "Fail", "Inconclusive", "NotApplicable"]

[[public_type]]
name = "PacketQualityDimensionAssessment"
kind = "struct"
definition = ["dimension: PacketQualityDimension", "result: PacketQualityResult", "evidence_handles: Vec<ArtifactId>", "reason_codes: Vec<String>"]
invariants = ["one assessment per required dimension", "Pass requires exact evidence", "missing measurement becomes Inconclusive", "no aggregate score"]

[[public_type]]
name = "ContextMeasurements"
kind = "struct"
definition = ["measurement_id: ArtifactId", "view_sha256: String", "route_fingerprint: String", "serializer_ref: String", "tokenizer_ref: Option<String>", "rendered_bytes: u32", "actual_tokens: Option<u32>", "provider_rewrite_or_truncation_evidence_refs: Vec<ArtifactId>", "measurement_state_fence: StateFence"]
invariants = ["view/route/serializer/fence exact", "actual tokens absent remains unknown", "truncation evidence cannot be hidden"]

[[public_type]]
name = "PacketQualityScorecard"
kind = "struct"
definition = ["scorecard_id: ArtifactId", "candidate_set_sha256: String", "admitted_set_sha256: String", "view_sha256: String", "recipe_sha256: String", "state_fence: StateFence", "dimensions: Vec<PacketQualityDimensionAssessment>", "blocking_dimension_refs: Vec<PacketQualityDimension>", "scorecard_sha256: String"]
invariants = ["all recipe-required dimensions represented", "blocking Fail/Inconclusive dimensions visible", "no aggregate quality/confidence score", "scorecard cannot mutate or admit view", "canonical order and digest"]

[[public_type]]
name = "DecisionBoundary"
kind = "struct"
definition = ["boundary_id: ArtifactId", "view_sha256: String", "impact_class: ContextImpactClass", "goal_atom_refs: Vec<ArtifactId>", "acceptance_atom_refs: Vec<ArtifactId>", "load_bearing_atom_refs: Vec<ArtifactId>", "do_not_use_or_revalidate_atom_refs: Vec<ArtifactId>", "next_action_ref: Option<ArtifactId>", "expected_observable: Option<String>", "verifier_ref: Option<ArtifactId>", "stop_or_revision_condition: String", "active_directive_refs: Vec<ArtifactId>", "state_fence: StateFence"]
invariants = ["all atom/directive refs exist in view/admission lineage", "Material/Critical next action requires expected observable and verifier", "boundary grants no action authority"]

[[public_type]]
name = "ContextLimits"
kind = "struct"
definition = ["maximum_tail_atoms: u32", "maximum_tail_bytes: u32", "maximum_expansion_handles: u32"]
invariants = ["all bounds positive", "limits cannot remove required directives or floor atoms"]

[[public_type]]
name = "DecisionLocalTail"
kind = "struct"
definition = ["tail_id: ArtifactId", "view_sha256: String", "boundary_id: ArtifactId", "scope_id: String", "task_id: Option<TaskId>", "state_fence: StateFence", "goal_and_acceptance_atom_refs: Vec<ArtifactId>", "load_bearing_atom_refs: Vec<ArtifactId>", "do_not_use_or_revalidate_atom_refs: Vec<ArtifactId>", "next_action_ref: Option<ArtifactId>", "expected_observable: Option<String>", "verifier_ref: Option<ArtifactId>", "stop_or_revision_condition: String", "active_directive_refs: Vec<ArtifactId>", "expansion_handles: Vec<ExpansionHandle>", "blocked_reason_codes: Vec<String>", "tail_sha256: String"]
invariants = ["tail binds exact view/boundary/fence", "cannot invent next action/authority/verifier", "security/recovery/conflict directives retained", "blocked action represented explicitly", "canonical order and digest"]

[[public_type]]
name = "HostContextCapabilityClass"
kind = "enum"
definition = ["EventIntegrated", "ToolOnly", "ObserveOnly", "OfflineWorker", "Unavailable"]

[[public_type]]
name = "HostContextCapabilitySnapshot"
kind = "struct"
