schema_version = 1
contract_id = "smart.context.compiler-contracts.v1"
authority = "eliot-cognitive-function-design-rev12"
owner = "eliot-context-contracts"
status = "FIELD_LEVEL_FROZEN"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
functional_cells = ["smart.context.contracts.candidate", "smart.context.contracts.admission", "smart.context.contracts.view_quality", "smart.context.contribution_merge", "smart.context.admission", "smart.context.assembly", "smart.context.quality", "smart.context.decision_tail", "smart.context.reactive_delivery_plan"]
architecture_refs = ["ARCH-CTX-01", "ARCH-CTX-02", "ARCH-CTX-03", "ARCH-CTX-04", "ARCH-EPI-04", "ARCH-MEM-04", "ARCH-SCOPE-01", "ARCH-MOD-03"]
implementation_refs = ["I7.10", "I7.11", "I7.16", "I7.19", "I12.13", "I12.14", "I12.31"]
normative_pair_key = "sha256:105558fc8957e150fab407b4fc5818ec49dc784f23f246f42dc9d3ca5843196b"
primary_property = "Own provider-neutral whole-unit Context candidate, admission, immutable view, decision-tail, reactive-plan and dimensioned quality contracts while preserving Safety Floor, provider denominator, downstream headroom and reversible omission."
public_api_policy = "allowlist_only"
async_policy = "synchronous_pure"
unsafe_policy = "forbid"
panic_policy = "no_panic_for_admitted_input"
owned_mutable_state = []
allowed_effects = []
complexity = "Contract validation is O((providers + atoms + decisions + sections + dimensions) log n); implementations remain bounded and perform no model call, store scan, provider SDK call, delivery or host mutation."
replacement_boundary = "Replace Context merge/admission/render/quality implementations behind these contracts; Governor owns active recipe/admission policy and external host/session owners own delivery and receipts."

[closed_sets]
impact_classes = ["Observe", "Reversible", "Material", "Critical"]
admission_dispositions = ["IncludePayload", "IncludeExactExcerpt", "IncludeHandle", "IncludeWithWarning", "RequireRevalidation", "Suppress", "Quarantine", "Reject"]
omission_reasons = ["Budget", "HeadroomReservation", "ProviderFairness", "Duplicate", "DisclosureDenied", "UnsafeRepresentation", "Stale", "DeniedInfluence", "RoleUnsupported", "SafetyFloorUnrepresentable", "PolicySuppressed"]
quality_dimensions = ["GoalAcceptanceCoverage", "CriticalAttentionCoverage", "EpistemicPositionCoverage", "RivalCounterevidenceCoverage", "SemanticCausalModelCoverage", "ContinuityCoverage", "InvariantNegativeMemoryCoverage", "UnknownInquiryCoverage", "ExactEvidenceCoverage", "AuthorityAffordanceCoverage", "DecisionBoundaryCoverage", "StateFenceConsistency", "ProviderDenominatorIntegrity", "WholeUnitIntegrity", "ReversibleOmission", "DownstreamHeadroom", "SelectionIntegrity", "RouteMeasurementValidity"]
quality_results = ["Pass", "Fail", "Inconclusive", "NotApplicable"]
host_capability_classes = ["EventIntegrated", "ToolOnly", "ObserveOnly", "OfflineWorker", "Unavailable"]
delivery_modes = ["PreAction", "NextBoundary", "AttentionOnly", "Unsupported"]
plan_states = ["Ready", "Partial", "Blocked", "Stale", "Unsupported"]

[hard_invariants]
provider_contributions_are_candidates_until_context_admission = true
whole_addressable_atoms_only = true
unknown_decision_delta_is_not_zero = true
missing_provider_is_not_empty_complete = true
one_compatible_state_fence_per_candidate_set_admission_view_and_tail = true
safety_floor_is_reserved_before_optional_allocation = true
downstream_headroom_is_reserved_before_optional_allocation = true
required_or_protected_atom_never_silently_disappears = true
optional_allocation_is_provider_fair_and_deterministic = true
quarantine_and_suppression_are_distinct = true
omission_is_reversible_or_explicitly_blocks_compilation = true
admission_does_not_claim_delivery_use_outcome_or_helpfulness = true
assembly_cannot_change_membership_or_disposition = true
quality_assessment_cannot_change_membership_or_view = true
quality_uses_dimension_vector_without_aggregate_score = true
decision_tail_cannot_invent_action_authority_or_verifier = true
reactive_plan_is_not_delivery_or_prevention_receipt = true
tool_only_or_unavailable_host_cannot_claim_preaction_prevention = true
canonical_order_and_digest_are_deterministic = true

