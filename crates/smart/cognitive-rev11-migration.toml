schema_version = 1
authority = "eliot-cognitive-function-design-rev11"
status = "MIGRATION_PLAN_NOT_EXECUTED"
rule = "Reuse deterministic logic, tests and contract-neutral algorithms only. Do not inherit duplicate state, authority, lifecycle or proof ownership."

[[donor]]
path = "crates/smart/eliot-epistemic"
disposition = "REFRACTOR_IN_PLACE"
keep = ["stateless fenced resolver", "deterministic ordering", "provenance preservation", "freshness checks"]
replace = ["global conflicted collapse", "implicit assumed state", "unstructured inquiry strings"]
target = ["smart.epistemic.contracts", "smart.epistemic.position"]

[[donor]]
path = "crates/smart/eliot-cues"
disposition = "REFACTOR_IN_PLACE"
keep = ["immutable snapshot", "exact-first matching", "bounded spread", "activation trace", "deterministic ordering"]
replace = ["lowercasing canonical path spelling", "combined direct/spread proof", "hidden lifecycle mutation"]
target = ["smart.cue.normalizer", "smart.cue.binding", "smart.cue.index", "smart.cue.direct_match", "smart.cue.relation_spread", "smart.cue.activation"]

[[donor]]
path = "crates/smart/eliot-context"
disposition = "REFACTOR_IN_PLACE"
keep = ["pure whole-atom compiler", "typed admissions", "deterministic ordering", "inspectable omissions"]
replace = ["scalar or boolean-only quality shortcuts", "missing provider denominator", "no downstream headroom", "admission-owned quality", "single linear optional allocation"]
target = ["smart.context.contribution_merge", "smart.context.admission", "smart.context.assembly", "smart.context.quality", "smart.context.decision_tail", "smart.context.reactive_delivery_plan"]

[[donor]]
path = "crates/smart/eliot-dreamer-core"
disposition = "DONOR_ONLY_THEN_COMPATIBILITY_RETIREMENT"
keep = ["candidate-only ceiling", "bounded job input", "forbidden confirmation field", "scope and State Fence checks"]
replace = ["source count as coverage", "constant authority_unchanged", "constant uncertainty_visible", "self-asserted preservation", "monolithic generator"]
target = ["smart.dreamer.bundle", "smart.dreamer.claim_grounding", "smart.dreamer.transformation_validation", "smart.dreamer.draft_admission"]

[[donor]]
path = "crates/smart/eliot-memory-curation"
disposition = "DONOR_ONLY_THEN_COMPATIBILITY_RETIREMENT"
keep = ["bounded read-only scan", "protected-record checks", "stable pagination", "reversible proposal intent"]
replace = ["writer utility floats", "scalar confidence", "duplicate lifecycle enum", "archive as an already-owned action"]
target = ["smart.memory.curation.contracts", "smart.memory.curation.screen"]

[[donor]]
path = "crates/smart/eliot-understanding"
disposition = "MERGE_RENDERING_INTO_ELIOT_CONTEXT_THEN_RETIRE"
keep = ["role-preserving rendering", "omission manifest", "decision-tail formatting"]
replace = ["second Context Compiler invocation", "duplicate understanding owner"]
target = ["smart.context.assembly", "smart.context.decision_tail"]

[[donor]]
path = "crates/smart/eliot-memory"
disposition = "RETIRE_AS_CANONICAL_STATE_OWNER_AFTER_EDGE_MIGRATION"
keep = ["bounded exact retrieval discriminators", "negative-memory tests", "append-only intent"]
forbid_transfer = ["Arc<Mutex<State>> canonical plane", "status owner", "lifecycle owner", "session delivery owner", "influence owner", "duplicate record schema"]
target_owner = "Governor canonical state plus store-neutral storage"

[[donor]]
path = "crates/smart/eliot-system-experience"
disposition = "RETIRE_AS_STATE_OWNER_AFTER_EDGE_MIGRATION"
keep = ["bounded experience query/projection logic", "outcome-linking discriminators"]
forbid_transfer = ["second experience store", "second lifecycle owner", "self-authored system truth"]
target_owner = "Governor canonical evidence and owner-produced projections"

