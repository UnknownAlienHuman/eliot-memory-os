[package]
name = "eliot-dreamer-configuration-plan"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Translate a Human request or diagnosed problem into a typed configuration delta candidate with owner, impact, probe and rollback."

[lib]
path = "src/lib.rs"

