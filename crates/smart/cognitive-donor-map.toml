rationale = "Retain pure whole-unit compiler, deterministic ordering and vector quality ideas; separate candidate construction, admission and rendering. Measured #1862 status: ContextCompiler::compile_with_campaign_learning_state has zero product callers after the bins/eliotd eliot.packet call and its #[allow(deprecated)] were removed. The eliot-context crate still has one external production Cargo consumer (bins/eliotd): three campaign source modules import seven distinct items from eliot_context::campaign_publication across nine item import occurrences. Those imports cover 10 campaign_publication rows of 62 total FACADE_DISPOSITIONS rows. The #40 A4 zero-consumer denominator is therefore one external crate, three modules and nine import occurrences; retirement waits for those imports to migrate."
