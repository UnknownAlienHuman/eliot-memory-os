# Measured 2026-09-28 on origin/main@212db3db: the GAP(#40) claim that
# "rebuildable snapshot construction has no admitted contract cell yet" and
# that "CueSnapshot/CueRuntime stay in this facade" was false in the tree.
# `eliot-cue-index` (cell `smart.cue.index`, package description "Build and
# validate one immutable rebuildable CueSnapshot from admitted binding
# projections and typed activation edges") is already named in `targets` on
# this very row and owns `build_cue_snapshot`/`rebuild_cue_snapshot` in
# crates/smart/eliot-cue-index/src/build.rs. Production Governor code calls it
# directly (crates/governor/eliot-governor/src/cue_composition.rs:228 and
# :555), and this facade's `adapt_rebuild_snapshot`
# (crates/smart/eliot-cues/src/legacy_adapter.rs:412) delegates to exactly that
# owner once. `CueSnapshot` validation/migration/invalidation and
# `CueRuntime` evaluation are listed among this facade's own removed
# duplicates (crates/smart/eliot-cues/src/lib.rs:64-65), so they no longer
# live here. What remains open is governance metadata, not a missing cell:
# eliot-cue-index still declares `prototype = true` and
# `workspace_admission = "pending_agent_implementation_and_proof"`, so no
# workspace/runtime admission is inferred from that cell's existence.
rationale = "Retain deterministic matching, bounded spreading and trace shape; split canonical normalization, binding proposals, admitted projection construction and hot evaluation."
rejected_overgeneralization = "Destructive canonical-path lowercasing, candidate bindings bypassing Governor admission, session delivery state in the pure evaluator, or graph-edge minimums for exact firing."

