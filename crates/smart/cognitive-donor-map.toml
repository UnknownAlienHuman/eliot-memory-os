removal_condition = "Under #40 A4, re-verify zero consumers only after the one external production package bins/eliotd has migrated its three campaign source modules (nine imports across seven distinct items) off eliot_context::campaign_publication; those imports occupy 10 of the 62 FACADE_DISPOSITIONS rows. AUD1 remains PARTIAL because the campaign route has no admitted owner-minted admission closure, so migration and facade retirement are not claimed."

