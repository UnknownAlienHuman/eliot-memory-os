owned_mutable_state = []
allowed_effects = []
inputs = ["MemoryProjectionBatch", "exact current applicability request and owner-derived precondition evidence already present in the batch"]
outputs = ["ApplicableMemorySet"]
depends_on = ["eliot-memory-projection-contracts"]
providers = ["eliot-memory-projection-provider"]
consumers = ["eliot-context-candidates"]
non_goals = [
  "store/query expansion or retrieval",
  "cue firing or graph traversal",
  "support/accessibility/influence/lifecycle/purge transition",
  "Context ranking/admission/rendering/delivery",
  "hard-block, policy, authority, model, tool or finish decision",
]
invariants = [
  "evaluate only the supplied bounded projection",
  "cue hit/score/rank/similarity is never applicability proof",
  "exact preconditions require exact owner-derived current evidence",
  "exact negative trigger returns Governor-decision requirement rather than applying a block",
  "stale/conflicted/protected/omitted/unknown records remain visible and addressable",
  "partial/unavailable denominator cannot prove absence or complete applicability",
  "result cannot strengthen source status, accessibility, influence or lifecycle",
]
failure_behavior = "Return per-record not-applicable/revalidation/review/inconclusive dispositions with exact missing evidence; never query, widen, silently drop, or apply an effect."
proof_surface = [
  "cue-hit-but-not-applicable",
  "scope/task/session mismatch",
  "semantic-near versus exact precondition",
  "exact negative trigger",
  "stale/conflicted/suppressed/quarantined/protected records",
  "partial/unavailable denominator",
  "permutation determinism",
]
proof_ceiling = "Pure Smart Module proof only; real provider/Context Edge, Governor hard-block/lifecycle decision and Product Pulse remain separate"
product_pulse = "D3B_REACTIVE_CONTEXT_PULSE_01"
replacement_boundary = "pure evaluator behind the owner-neutral contracts; no provider, Context, lifecycle or authority implementation leaks"

