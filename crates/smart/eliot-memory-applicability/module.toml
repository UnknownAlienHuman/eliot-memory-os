state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.memory.applicability"
assignable = false
blocked_by = [
  "accepted memory projection/applicable-set contract implementation",
  "Governor projection-provider fixture and exact shared-fence corpus",
]
loc_soft_ceiling = 10000
product_objective = "Only currently applicable, source-addressable memory reaches Context candidate construction; cue activation and retrieval remain proposals."
causal_property = "pure current memory applicability evaluation"
old_failure_or_missing_capability = "activation/retrieval may be mistaken for applicability or Smart may query/expand storage"
discriminator = "cue-hit-but-not-applicable, semantic-near-precondition, exact negative-trigger, stale/conflicted/protected/truncated/missing-denominator fixtures produce distinct dispositions"
