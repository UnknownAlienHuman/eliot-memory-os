objective = "Implement evaluate_memory_applicability as a deterministic total function over the accepted bounded projection contract."
write_scope = [
  "crates/smart/eliot-memory-applicability/src/**",
  "crates/smart/eliot-memory-applicability/tests/**",
  "crates/smart/eliot-memory-applicability/Cargo.toml",
]
