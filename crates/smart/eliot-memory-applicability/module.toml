  "one pure evaluator responsibility",
  "no query expansion or hidden state",
  "all uncertain/protected/negative cases remain explicit",
]
forbidden = [
  "store/filesystem/network/model/tool access",
  "retrieval or graph expansion",
  "support/accessibility/influence/lifecycle/erasure transition",
  "Context admission, hard block, authority, finish or promotion",
]
stop_condition = "Return ContractChallenge when the supplied batch lacks exact scope/fence/denominator/precondition/owner evidence or evaluation would require another owner."
required_verification = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-memory-applicability --all-targets",
  "cargo test --locked -p eliot-memory-applicability",
  "cargo clippy --locked -p eliot-memory-applicability --all-targets -- -D warnings",
