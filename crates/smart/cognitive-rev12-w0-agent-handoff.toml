schema_version = 1
authority = "eliot-cognitive-function-design-rev12"
status = "W0_AGENT_HANDOFF_CONTRACT"
field_contract_index = "crates/smart/cognitive-rev12-all-field-contracts.toml"
orders = [1, 2, 4, 5, 6, 7, 19, 26, 27, 28, 35, 49, 50, 51, 52]

[worker_rule]
reads = ["one assignment below", "its exact field_contract", "declared Architecture/Implementation anchors", "one-hop external contracts and fixtures"]
writes = ["only declared source_file", "only declared test_file"]
forbidden = ["Cargo.toml", "src/lib.rs", "reexports", "another order source", "root workspace", "runtime wiring", "canonical state", "provider/model/tool calls", "proof/status files", "field-contract edits", "oracle weakening"]
return = ["implemented selected public functions", "typed errors", "minimum and contract negative tests", "remaining ContractChallenge", "actual proof ceiling"]

