schema_version = 4
module_id = "smart.dreamer.maintenance_plan"
crate = "eliot-dreamer-maintenance-plan"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-02"
agent_order = 41
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.maintenance_plan"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Bounded self-maintenance evidence yields one reviewable plan candidate with owner, budget, expected delta, rollback and Human boundary while executing nothing."
causal_property = "MaintenancePlanCandidate synthesis"
old_failure_or_missing_capability = "Maintenance recommendations can become generic background thinking without an exact trigger, owner, budget or measurable stop condition."
discriminator = "The handler emits one bounded MaintenancePlanCandidate or explicit no-plan disposition and never schedules or executes work."
primary_responsibility = "Translate bounded self-scope quality, memory, context, capability or Problem evidence into one maintenance plan candidate."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Maintenance", "self-quality, memory, context, capability and Problem evidence"]
outputs = ["MaintenancePlanCandidate", "candidate work items", "Human decision packet"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
providers = ["Governor-admitted Dreamer bundle"]
consumers = ["Dreamer maintenance surface", "Governor, Agent Coordinator, Doctor or Human owning execution"]
non_goals = ["job scheduling", "Doctor repair execution", "configuration publication", "automatic model spend"]
invariants = ["trigger, owner and budget are exact", "expected delta and observable stop condition are explicit", "rollback and disable path exist", "background automation mode remains externally owned"]
failure_behavior = "Return no-plan, inconclusive or unsupported MaintenancePlanCandidate with exact missing trigger, owner, budget or evidence."
proof_surface = ["no trigger", "budget absent", "duplicate plan", "Human-owned decision", "attempted execution"]
proof_ceiling = "Module proof only; real provider/consumer Edge proof and Product Pulse remain separate"
product_pulse = "D3A_ADVISORY_DIAGNOSIS_PLANNING_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.3 and I9.8"
disposition = "authoritative maintenance-planning and automation-policy boundary"

[agent_task]
objective = "Implement one candidate-only MaintenancePlan handler; all scheduling and execution remain with existing owners."
write_scope = ["crates/smart/eliot-dreamer-maintenance-plan/**"]
deliverables = ["MaintenancePlanCandidate core", "trigger/owner/budget/rollback fixtures", "execution-owner Edge fixtures"]
acceptance = ["one bounded plan or explicit no-plan", "no scheduling or execution", "Human and rollback boundaries explicit"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if the plan requires starting jobs, spending budget, publishing configuration, running Doctor or deciding Human-owned policy."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse or Edge proof before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# `source_issue` names the assignment this gate enforces. `test_matrix_cases` is
# the number of numbered cases in that issue's `Required test matrix` section,
# and `min_tests` may never fall below it -- otherwise the gate certifies work
# that ignores most of the matrix the assignment demands.
[acceptance]
source_issue = 677
source_unit = "A-41"
test_matrix_cases = 50
min_source_lines = 200
min_public_items = 6
min_tests = 50
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
