schema_version = 2
module_id = "smart.context.admission"
crate = "eliot-context-admission"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 9
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C1"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.context.admission"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Apply one immutable ContextRecipe to a candidate set and decide include, handle-only, warn/revalidate, suppress, or quarantine."
owned_mutable_state = []
allowed_effects = []
inputs = ["ContextCandidateSet", "ContextRecipe", "route/headroom profile"]
outputs = ["AdmittedContextSet", "AdmissionDecision list", "SelectionIntegrity stage", "pre-assembly quality/gap report"]
depends_on = ["eliot-context-contracts"]
consumers = ["eliot-context-assembly"]
non_goals = ["candidate construction", "section rendering", "recipe optimization", "support or authority changes"]
invariants = ["Decision Safety Floor is never silently dropped", "unknown decision delta is not negative evidence", "one verbose source cannot starve rivals/unknowns", "an earlier membership decision is never overwritten"]
failure_behavior = "Return DECISION_CONTEXT_INCOMPLETE, a narrower handle-only set, or a route/decomposition requirement; never fluent incomplete success."
proof_surface = ["permutation invariance", "budget/role starvation adversarial fixtures", "stale/quarantine cases", "non-droppable atom and downstream-headroom tests"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-context/src/lib.rs"
disposition = "extract_and_harden"
scope = "ContextCompiler ordering, dispositions and scorecard preflight"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.13"
disposition = "authoritative_contract"
scope = "whole-unit admission and selection integrity"

[agent_task]
objective = "Split ranking/admission from contracts, candidate collection, and rendering."
write_scope = ["crates/smart/eliot-context-admission/**"]
deliverables = ["pure admission engine", "typed reason registry", "selection-integrity stage and tests"]
acceptance = ["bounded deterministic work", "required atoms survive as payload or exact handle", "no source fetch or rendering"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if the recipe cannot preserve the safety floor and headroom; return explicit decomposition/route requirement."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof, affected edge proof, current-main rebase and integration-owner review"
