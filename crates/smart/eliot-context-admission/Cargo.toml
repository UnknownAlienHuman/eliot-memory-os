[package]
name = "eliot-context-admission"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Apply one immutable ContextRecipe and decide include, handle-only, revalidate, suppress or quarantine for each candidate."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED_PROTOTYPE"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.context.admission"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 17

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts", version = "0.1.0" }
eliot-evidence = { path = "../../foundation/eliot-evidence", version = "0.1.0" }
eliot-context-contracts = { path = "../eliot-context-contracts", version = "0.1.0" }
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }
eliot-reactive-context-plan = { path = "../eliot-reactive-context-plan", version = "0.1.0" }
serde = { workspace = true }

# Host-only owner evidence: the wasm32 guest contour must never see Governor
# state or the governed registries. Target-gating keeps the guest dependency
# closure to portable contracts/mechanics while native host callers keep full
# permit gates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eliot-governor = { path = "../../governor/eliot-governor", version = "0.1.0" }
eliot-improvement = { path = "../../meta/eliot-improvement", version = "0.1.0" }
# Issue #1742: the owner-issued impact class (I6.3 `ImpactClass`) is the
# applicability key of the applicable Decision Safety Floor, so the floor gate
# binds the authority owner's own class rather than a renamed local enum. The
# edge stays in the non-wasm section to keep the guest contour unchanged.
eliot-authority = { path = "../../governor/eliot-authority", version = "0.1.0" }
# Issue #1742 W4: the dispatch binding carries the authority owner's effect
# ceiling (`eliot-security-contracts::EffectCeiling`) and W6 consumes #1730's
# retained checkpoint (`eliot-agent-contracts::RetainedHandoffCheckpoint`).
# Both are owner types reused verbatim, never redefined locally. The edges stay
# in the non-wasm section to keep the guest contour unchanged.
eliot-agent-contracts.workspace = true
eliot-security-contracts.workspace = true

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts", version = "0.1.0" }

[lints]
workspace = true
