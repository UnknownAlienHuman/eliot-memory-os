[package]
name = "eliot-context-admission"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Apply one immutable ContextRecipe and decide include, handle-only, revalidate, suppress or quarantine for each candidate."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED_PROTOTYPE"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.context.admission"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 17

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-context-contracts = { path = "../eliot-context-contracts" }
eliot-receipts = { path = "../../foundation/eliot-receipts" }

# Host-only owner evidence: the wasm32 guest contour must never see Governor
# state. Target-gating keeps the guest dependency closure to portable
# contracts/mechanics while native host callers keep full permit gates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eliot-governor = { path = "../../governor/eliot-governor" }

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts" }

[lints]
workspace = true
