[edge_proof_gate]
required_evidence = [
  "exact producer and consumer package revisions",
  "fixture serialized by the producer contract and accepted by the consumer",
  "mixed-fence and stale-revision negative cases",
  "unknown/partial/unavailable failure propagation",
  "proof ceiling and Product Identity where applicable"
]
