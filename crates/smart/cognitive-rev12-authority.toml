[normative_pair]
architecture_revision = "4.5-draft"
architecture_edition = "2026-08-28"
architecture_sha256 = "c6932eaf26935e752eefb4de591afc91ea1a7180be5a8ff0005554b8029bac1a"
implementation_revision = "0.29-draft"
