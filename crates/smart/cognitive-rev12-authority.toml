pair_key = "sha256:105558fc8957e150fab407b4fc5818ec49dc784f23f246f42dc9d3ca5843196b"
precedence = "Architecture defines intent and Hard Boundaries; Implementation defines target owners, contracts, defaults and failure behavior; this design is a non-normative executable projection."

[scope]
functional_cells = 86
physical_crates = 31
hot_path_cells = 15
field_contract_scope = "W8_68_THROUGH_75"
field_contract_index = "crates/smart/cognitive-rev12-field-contracts.toml"
root_workspace_admission = false
rust_implementation = false
runtime_support = false
product_acceptance = false

[authority_rules]
cell_source = "Exactly one [[cell]] record in the indexed catalogs is authoritative for each agent assignment and Rust-oriented API."
field_contract_source = "For W8 public types, the indexed *.contract.toml file is the sole field-level source; cells and manifests reference but do not redefine it."
base_catalog_status = "Rev11 cell catalogs 1..67 are retained after semantic re-audit; rev12 catalogs replace the inconsistent projection/provider extension and add 76..86."
no_parallel_module_api_views = "Legacy module.toml and *.api.toml records are donor evidence only and are not assignment or field-contract authority."
cell_vs_crate = "A FunctionalCapabilityCell is assigned independently; several cells share one physical crate only when lifecycle owner, dependency island, proof oracle and replacement boundary remain coherent."
crate_creation = "A physical crate requires a contract, dependency, security, failure-containment, deployment, package-proof or replacement seam. Function count, agent count or LOC estimate is insufficient."
loc = "Ten thousand lines is a review trigger, never a constitutional split rule."
worker_scope = "A worker writes only the declared src/<cell>.rs and tests/<cell>.rs files. Cargo manifests, lib.rs and re-exports belong to the integration owner."

[hot_path]
requirements = ["no model call", "no storage scan", "no provider SDK", "no blocking I/O", "bounded inputs and outputs", "deterministic ordering and tie-breaks", "explicit complexity ceiling", "visible local degradation"]
cell_count = 15

[forbidden_ownership]
all_cells = ["canonical state", "truth or epistemic promotion", "authority grant or activation", "task finish", "DurableJob lifecycle", "scheduler or Ready Queue", "runtime lease", "provider credential or route execution", "external effect execution", "production-generation self-modification"]

[field_contract_freeze]
resolved_challenges = ["CC-MEMORY-PROJECTION-SCHEMA", "CC-FAILURE-OBSERVATION-SCHEMA", "CC-PROVIDER-CONTRIBUTION-SCHEMA"]
remaining_challenges = ["CC-PROVIDER-ADAPTERS", "CC-EDGE-PROOF", "CC-PRODUCT-PULSE", "CC-WAVE0-PROOF-IDENTITY"]
self_model_request_resolution = "Use ContextProviderProjectionRequest; no SelfModelContextProjectionRequest public type."

[proof_model]
module = "Package-local shape, behavior, property and adversarial proof for one implemented cell."
edge = "Executed proof over the real provider and consumer using exact typed contracts and State Fence."
product = "Named Product Pulse over an exact Product Identity."
current_ceiling = "TOML parse, field-contract freeze, branch presence, commit or review cannot promote implementation, runtime or product support."
