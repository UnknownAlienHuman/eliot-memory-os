# ---------------------------------------------------------------------------
# Field contract. Same table shape as the W9 catalogue
# crates/smart/cognitive-wave-09.toml [[field_contract]]; this file is the
# owning crate's own copy, so the implementation agent reads the contract from
# the crate it is asked to implement instead of from a remote catalogue.
# Frozen here under Issue #259; the catalogue row is the wave-level index of
# the same contract id and is not a second owner of it.
#
# This crate owns six causal families, so it carries six field contract ids and
# not one: SkillLifecycleView, ToolSurfaceAssessment, DreamerJobEconomics,
# EliotSelfQualityView, LearningBottleneckDiagnosis and
# SelfQualityInterventionReceipt. Each family has its own denominator,
# denominator_rule, complete_rule, fence, omission_semantics and invariants, and
# each is what the implementation agent reads for that family.
# CognitiveQualityAssessment is the crate-level projection composed of the six;
# its composed_of row names them, and it is not a seventh family and never
# collapses them into an aggregate score.
# ---------------------------------------------------------------------------

