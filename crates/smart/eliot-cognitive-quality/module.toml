allowed_effects = []
inputs = ["immutable Skill execution evidence by handle", "immutable tool-definition versions by handle", "immutable Durable Job and route-usage/curation/outcome receipts by handle", "immutable SystemObservationJournal/EliotSystemExperienceBank/AgentFeedbackReceipt projections by handle", "immutable Problem/ImprovementCandidate refs by handle"]
