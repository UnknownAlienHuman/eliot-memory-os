causal_property = "cognitive quality assessment (skill lifecycle, tool-surface, Dreamer economics, self-quality, bottleneck, intervention candidate)"
old_failure_or_missing_capability = "installed/delivered/executed/useful collapse into one score, elegant-but-unused synthesis counts as utility, and recurring same-hypothesis failure retries instead of opening Mechanism Review (CC-007)."
discriminator = "per-attempt HarnessActivationReceipt refs decide eligibility/activation/adherence; per-sub-assessment denominators decide completeness; activity or summary volume never closes the loop"
primary_responsibility = "Project one bounded quality scope into a CognitiveQualityAssessment with skill, tool-surface, economics, self-quality, bottleneck, and intervention sections."
