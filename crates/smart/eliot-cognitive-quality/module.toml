en_problems_improvement_candidates_and_human_actions", "self_quality_counter_metrics_context_bytes_vs_usefulness_delivery_vs_use_growth_vs_resolved_activity_vs_progress_cost_vs_delta_maintenance_vs_recurrence_resolution_latency", "bottleneck_diagnosis_update_quality_high_activation_low_or_activation_high_adherence_low_or_adherence_high_no_delta_or_delta_present_outcome_worse_or_immediate_gain_retention_regression", "intervention_id_and_trigger_observation_refs", "intervention_affected_capability_scope_and_owner", "intervention_causal_hypothesis_rivals_and_discriminator", "intervention_selected_action_observe_or_repair_or_configure_or_reroute_or_experiment_or_abstain_or_escalate", "intervention_candidate_change_and_authority_refs", "intervention_proof_ceiling_verifier_and_counter_metrics", "intervention_rollback_and_validity_scope", "intervention_immediate_and_delayed_outcomes", "intervention_terminal_disposition_retained_or_narrowed_or_rolled_back_or_reopened_or_escalated_or_inconclusive", "intervention_system_observation_and_experience_writeback_refs"]
denominator = "per_sub_assessment_denominators: skill_counts_over_task_host_route_scope_with_tool_versions; job_window_over_declared_job_family_with_full_cost_ledger; self_quality_observations_over_obligation_profile; intervention_scope_closure_over_affected_capability"
denominator_rule = "RECHECK: for Skill/tool-surface recompute delivered/expanded/executed and eligibility/activation/adherence from per-attempt HarnessActivationReceipt refs at the named scope; for Dreamer economics re-resolve the declared job/job-family window and full compute/storage/context/Human cost ledger plus held-out/live outcome refs; for SelfQuality compare observations against the ObservationObligationProfile; for intervention re-enumerate the affected capability closure. Each Complete sub-assessment requires its own exact denominator; aggregate counts never substitute for per-attempt receipts."
complete_rule = "Every Complete state requires the exact independently recheckable per-sub-assessment denominator above; installed != delivered != executed != useful; acknowledgement is not use; use is not adherence; adherence is not benefit."
fence = "Task/host/route/governance scope plus StateFence; tool-definition versions pin staleness."
omission_semantics = "Silence about adherence is unknown, not compliance; shared success may remain distributed or uncertain; missing observability stays unknown; each owner projection is consumed as a whole with its own coverage, so per-role input digests never collide in one flat digest list."
