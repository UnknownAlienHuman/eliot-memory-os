# ---------------------------------------------------------------------------

[[field_contract]]
id = "CognitiveQualityAssessment"
owner_crate = "eliot-cognitive-quality"
family = "skill lifecycle, tool-surface, Dreamer economics, EliotSelfQualityView, bottleneck, advisory intervention"
source_handles = ["I07-25", "I09-16", "I16-23", "I12-34"]
status = "FROZEN_STATIC_FIELD_CONTRACT"
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
fields = ["skill_ref_and_revision", "skill_task_host_route_and_governance_scope", "skill_applies_when_and_does_not_apply_when", "skill_dependency_and_tool_definition_versions", "skill_delivered_expanded_and_executed_counts", "skill_eligibility_activation_and_activation_latency", "skill_adherence_at_early_mid_and_final_checkpoints", "skill_verified_success_failure_and_uncertain_outcomes", "skill_observed_decision_or_verifier_delta", "skill_false_activation_and_distractor_history", "skill_interactions_ordering_and_mutual_exclusion", "skill_stale_or_quarantine_reason", "skill_proposed_action_keep_or_patch_or_split_or_merge_or_suppress_or_archive_or_quarantine_or_restore", "skill_evidence_review_and_rollback", "tool_surface_eligibility_retrieval_delivery_activation_adherence_per_attempt_with_exact_tool_definition_version", "tool_surface_where_not_apply_stop_and_escalation_first_class", "dreamer_job_accepted_rejected_expired_candidates", "dreamer_job_verified_decision_verifier_and_downstream_outcome_delta", "dreamer_job_false_merge_split_procedure_and_negative_transfer", "dreamer_job_source_coverage_missed_material_evidence_and_unresolved_uncertainty", "dreamer_job_model_agent_swarm_calls_raw_route_usage_and_retries", "dreamer_job_cpu_ram_storage_network_queue_wait_wall_latency_and_human_attention", "dreamer_job_context_reconstruction_savings_without_shifted_cost", "dreamer_job_clarification_usefulness_backlog_age_and_expiry", "dreamer_job_model_route_calibration_rollback_and_invalidation", "self_quality_agent_loop_and_no_progress", "self_quality_observation_coverage_and_integration_gaps", "self_quality_context_packet_size_quality_and_feedback", "self_quality_memory_growth_staleness_duplicates_false_activation_and_use", "self_quality_dreamer_watchdog_doctor_job_utility_and_failures", "self_quality_configuration_maintenance_and_update_outcomes", "self_quality_orphan_descendant_and_unknown_effect_state", "self_quality_product_pulse_and_user_outcome_delta", "self_quality_open_problems_improvement_candidates_and_human_actions", "self_quality_counter_metrics_context_bytes_vs_usefulness_delivery_vs_use_growth_vs_resolved_activity_vs_progress_cost_vs_delta_maintenance_vs_recurrence_resolution_latency", "bottleneck_diagnosis_update_quality_high_activation_low_or_activation_high_adherence_low_or_adherence_high_no_delta_or_delta_present_outcome_worse_or_immediate_gain_retention_regression", "intervention_id_and_trigger_observation_refs", "intervention_affected_capability_scope_and_owner", "intervention_causal_hypothesis_rivals_and_discriminator", "intervention_selected_action_observe_or_repair_or_configure_or_reroute_or_experiment_or_abstain_or_escalate", "intervention_candidate_change_and_authority_refs", "intervention_proof_ceiling_verifier_and_counter_metrics", "intervention_rollback_and_validity_scope", "intervention_immediate_and_delayed_outcomes", "intervention_terminal_disposition_retained_or_narrowed_or_rolled_back_or_reopened_or_escalated_or_inconclusive", "intervention_system_observation_and_experience_writeback_refs"]
denominator = "per_sub_assessment_denominators: skill_counts_over_task_host_route_scope_with_tool_versions; job_window_over_declared_job_family_with_full_cost_ledger; self_quality_observations_over_obligation_profile; intervention_scope_closure_over_affected_capability"
denominator_rule = "RECHECK: for Skill/tool-surface recompute delivered/expanded/executed and eligibility/activation/adherence from per-attempt HarnessActivationReceipt refs at the named scope; for Dreamer economics re-resolve the declared job/job-family window and full compute/storage/context/Human cost ledger plus held-out/live outcome refs; for SelfQuality compare observations against the ObservationObligationProfile; for intervention re-enumerate the affected capability closure. Each Complete sub-assessment requires its own exact denominator; aggregate counts never substitute for per-attempt receipts."
complete_rule = "Every Complete state requires the exact independently recheckable per-sub-assessment denominator above; installed != delivered != executed != useful; acknowledgement is not use; use is not adherence; adherence is not benefit."
fence = "Task/host/route/governance scope plus StateFence; tool-definition versions pin staleness."
omission_semantics = "Silence about adherence is unknown, not compliance; shared success may remain distributed or uncertain; missing observability stays unknown; each owner projection is consumed as a whole with its own coverage, so per-role input digests never collide in one flat digest list."
invariants = ["no aggregate intelligence/confidence/utility score and no aggregate learning score", "installed != delivered != executed != useful, and acknowledgement is not use, use is not adherence, adherence is not benefit", "retrieval/repetition/model-agreement do not reinforce a Skill", "retrieval/popularity/completion/delivery/tool-availability/model-agreement do not establish utility, support or understanding", "tool availability is not utility proof and a tool-definition change marks the surface stale before material use", "Dreamer/Curator proposals remain reversible candidates until governed promotion", "one model's delete recommendation is never its own oracle", "EliotSelfQualityView is a problem-oriented projection: no global intelligence score, no second projection owner, no self-certification, no self-promotion, no silent system rewrite", "learning-bottleneck diagnosis is a table lookup over observed combinations, never a single aggregate self-learning score", "recurring failure without a changed hypothesis or discriminator opens Mechanism Review rather than another equivalent retry", "consume immutable owner-produced projections only", "no Skill, tool, configuration or route mutation, no scheduler, effect, authority or task finish", "every Complete state requires the exact independently recheckable denominator", "this crate owns no canonical state or lifecycle transition"]

