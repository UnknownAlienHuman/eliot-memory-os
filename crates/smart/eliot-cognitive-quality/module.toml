[[validation_gate]]
id = "W9-CQ-PER-SUB-ASSESSMENT-DENOMINATOR"
rule = "Each of the six sub-assessments (Skill lifecycle, tool surface, Dreamer job economics, EliotSelfQualityView, learning bottleneck, advisory intervention) carries its own exact independently recheckable denominator. An aggregate count never substitutes for a per-attempt HarnessActivationReceipt, and a Complete sub-assessment without its own denominator is invalid."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-CQ-NO-AGGREGATE-SCORE"
rule = "No aggregate intelligence, confidence, utility or learning score is emitted. Learning-bottleneck diagnosis selects the bottleneck from the observed combination; it never collapses into one number, and no self-certification or self-promotion is produced."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-CQ-NO-FREQUENCY-AS-UTILITY"
rule = "Installed, delivered, expanded, executed, used and useful stay distinct. Retrieval, popularity, completion, delivery, tool availability and model agreement never establish utility, support or understanding, and never reinforce a Skill."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-CQ-CANDIDATE-ONLY-NO-MUTATION"
rule = "Every emitted value is a reversible candidate. This crate performs no Skill, tool, configuration or route mutation, owns no job, route, schedule, policy, effect, authority or task finish, and never lets one model's delete recommendation act as its own oracle."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"

[[validation_gate]]
id = "W9-CQ-RECURRING-FAILURE-OPENS-MECHANISM-REVIEW"
rule = "Recurring failure without a changed hypothesis or discriminator opens Mechanism Review rather than another equivalent retry; activity volume, summary volume and maintenance completion alone cannot close the loop."
status = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
