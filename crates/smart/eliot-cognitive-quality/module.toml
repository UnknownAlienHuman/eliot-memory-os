consumers = ["Dreamer/Curator review surface", "Human/Main Agent/Governor decision owner"]
non_goals = ["Skill/tool/config/route mutation", "scheduler/effect/authority ownership", "task finish", "promotion decision", "aggregate intelligence or learning score", "self-certification or self-promotion"]
invariants = ["installed != delivered != executed != useful", "acknowledgement is not use, use is not adherence, adherence is not benefit", "retrieval/repetition/agreement never reinforce a Skill", "Dreamer/Curator proposals remain reversible candidates until governed promotion", "recurring failure without changed hypothesis or discriminator opens Mechanism Review", "every candidate freezes its exact assessed inputs; insufficiency is Err, never a silent adequate; no Complete state is emitted"]
failure_behavior = "Return Err with the exact missing evidence, or a candidate freezing the assessed closure; never fabricate quality, benefit, promotion, or completeness."
proof_surface = ["projection-status exact denominator accounting", "per-attempt receipt scope/fence/denominator echo", "owner projection scope/fence/denominator echo", "closed-class omissions propagated into candidates", "candidate contract-version gate before wire acceptance", "owner-bound recheck entry for digests, denominators, and handles", "equivalent-retry Mechanism Review gate", "frozen digest recompute", "wire roundtrip with deny_unknown_fields"]
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
product_pulse = "W9_COGNITIVE_QUALITY_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

