denominator_rule = "RECHECK: re-enumerate the observation set behind the owning EliotSelfQualityView, verify the named combination is present with each of its observed arms, and select the bottleneck from the observed combination alone: update quality high with activation low locates retrieval, cue, trigger or context budget; activation high with adherence low locates route competence, instruction wording, or state loss between turns; adherence high with no decision delta locates an update that is irrelevant or too weak; decision delta present with outcome worse locates a bad lesson, a bad evaluator or an unresolved confounder; immediate gain with retention regression locates overfitting and harness-level forgetting. An unobserved arm is unknown and never a default, and any Complete state without this exact denominator is invalid."
complete_rule = "Every Complete state requires the exact independently recheckable denominator above; the diagnosis names the observed combination, the selected bottleneck, the selected intervention (change delivery, route, update, evaluator, or roll back) and the next discriminative observation, and a single aggregate self-learning score is never an accepted substitute."
fence = "The owning EliotSelfQualityView scope and StateFence; the diagnosis is re-derived whenever that view's denominator is re-resolved."
omission_semantics = "An unobserved arm makes the row INCONCLUSIVE rather than selecting a bottleneck; a combination observed once is reported with its sample count of one and is never generalized; two applicable rows are reported as competing candidates rather than merged into one score."
invariants = ["one aggregate self-learning score is prohibited; the diagnosis is a lookup over the observed combination", "the diagnosis locates a bottleneck and selects the intervention, and never certifies the system or self-promotes a change", "the diagnosis proposes only; it never changes delivery, route, update, evaluator or configuration itself", "recurring failure without a changed hypothesis or discriminator opens Mechanism Review rather than another equivalent retry", "retrieval, popularity, completion, delivery, tool availability and model agreement do not establish utility, support or understanding", "every emitted value is a reversible candidate", "consume immutable owner-produced projections only", "no configuration, route, tool or Skill mutation, no scheduler, effect, authority or task finish, and no self-promotion", "every Complete state requires the exact independently recheckable denominator", "this family owns no canonical state and no lifecycle transition"]

