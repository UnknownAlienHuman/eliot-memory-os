schema_version = 2
module_id = "smart.dreamer.structure_repair"
crate = "eliot-dreamer-structure-repair"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 23
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.structure_repair"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Propose one identity-structure repair candidate: merge equivalent records, split a false aggregate, or reverse a false merge with preservation and rollback proof."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Curation", "ValidatedDreamDraft item kind=merge or split", "admitted records, relations, counterexamples and identity evidence"]
outputs = ["StructureRepairCandidate", "preservation/equivalence report", "rollback and dependent-view invalidation plan"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
consumers = ["eliot-dreamer-curation"]
non_goals = ["canonical merge/split", "record deletion", "identity authority", "projection rebuild execution"]
invariants = ["primary records are never rewritten", "equivalence and shared wording are distinct", "minority/counterexample evidence survives", "rollback and dependent invalidation are explicit"]
failure_behavior = "Reject the repair candidate and preserve all branches; never choose one identity merely to reduce duplication."
proof_surface = ["false merge", "near-duplicate non-equivalence", "split with shared lineage", "rollback/dependency-closure cases"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-memory-curation/src/lib.rs"
disposition = "extract_and_harden"
scope = "duplicate/semantic-duplicate findings and protection"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.6-I9.7 and I12.21"
disposition = "authoritative_contract"
scope = "merge/split candidate and preservation rules"

[agent_task]
objective = "Implement merge/split as one identity-structure repair cell with a shared preservation proof."
write_scope = ["crates/smart/eliot-dreamer-structure-repair/**"]
deliverables = ["structure-repair candidate builder", "equivalence/preservation report", "false-merge adversarial corpus"]
acceptance = ["no source destruction", "merge and split use one coherent identity contract", "failed equivalence leaves both records active"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if equivalence cannot be verified within the supplied evidence; return a probe or preserved conflict."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof in an isolated candidate workspace, affected edge proof, current-main rebase and integration-owner review"
