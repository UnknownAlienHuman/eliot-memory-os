agent_order = 39
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.conflict_analysis"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "A conflict is represented as rivals, shared dependence, strongest objections and discriminative probes without vote-based resolution."
causal_property = "bounded rival and conflict analysis candidate"
old_failure_or_missing_capability = "The prototype conflated conflict analysis with Concilium planning and invented a combined top-level job surface."
discriminator = "The handler emits one ConflictAnalysisCandidate and can fail independently; it never emits a ConciliumPlan or resolves the decision."
primary_responsibility = "Frame one bounded conflict into observations, rival interpretations, shared lineage, strongest objections, discriminative probes and a decision-owner recommendation."
owned_mutable_state = []
allowed_effects = []
inputs = ["validated conflict or rival-analysis draft item", "ConflictSet and evidence handles"]
outputs = ["ConflictAnalysisCandidate", "discriminative probe candidates", "decision-owner recommendation", "invalidation conditions"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
providers = ["Governor-admitted Dreamer bundle"]
consumers = ["development diagnosis", "deferred Research synthesis", "advanced Orientation path"]
non_goals = ["Concilium planning", "source acquisition", "vote tally", "decision resolution", "Attention mutation"]
invariants = ["dissent remains visible", "independence and common lineage are explicit", "majority count does not determine support", "decision owner remains external"]
failure_behavior = "Return inconclusive or unsupported conflict analysis with exact missing evidence; never resolve the conflict or fabricate a deliberation plan."
proof_surface = ["majority wrong", "shared evidence dependence", "local conflict", "no discriminative probe", "Concilium output rejection"]
proof_ceiling = "Module proof only; real provider/consumer Edge proof and Product Pulse remain separate"
product_pulse = "D3A_ADVISORY_DIAGNOSIS_PLANNING_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.3 Orientation, Research synthesis and Development diagnosis"
disposition = "extract shared rival-analysis responsibility only"

[[donor]]
path = "ELIOT_ARCHITECTURE A7.2 and A14.6"
disposition = "dissent, independence and evaluation boundary"

[agent_task]
objective = "Implement one reusable candidate-only conflict-analysis sub-handler; leave Concilium planning to Research synthesis and deliberation owners."
write_scope = ["crates/smart/eliot-dreamer-conflict-analysis/**"]
deliverables = ["ConflictAnalysisCandidate core", "dependence/dissent/probe fixtures", "diagnosis-consumer Edge fixtures"]
acceptance = ["one conflict-analysis responsibility", "no Concilium or decision resolution", "dissent and lineage preserved"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if analysis needs source acquisition, deliberation orchestration, Attention mutation or final decision authority."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse or Edge proof before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# `source_issue` names the assignment this gate enforces. `test_matrix_cases` is
# the number of numbered cases in that issue's `Required test matrix` section,
# and `min_tests` may never fall below it -- otherwise the gate certifies work
# that ignores most of the matrix the assignment demands.
[acceptance]
source_issue = 673
source_unit = "A-39"
test_matrix_cases = 68
min_source_lines = 200
min_public_items = 6
min_tests = 68
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
