[package]
name = "eliot-dreamer-memory-semantics"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Candidate-only semantic memory formation cells for classification, episodes, concepts, procedures, Skills and FailureFingerprints"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_cell_implementation_edge_proof_and_product_pulse"
functional_cells = ["smart.dreamer.classification", "smart.dreamer.episode", "smart.dreamer.concept", "smart.dreamer.procedure", "smart.dreamer.skill", "smart.dreamer.failure_fingerprint"]
runtime_authority = "NONE"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-dreamer-contracts = { path = "../eliot-dreamer-contracts" }
eliot-dreamer-validation = { path = "../eliot-dreamer-validation" }
