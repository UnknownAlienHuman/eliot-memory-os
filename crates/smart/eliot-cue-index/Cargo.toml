[package]
name = "eliot-cue-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Rebuildable immutable per-scope cue projection and invalidation compiler"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.cue.index"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 4

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-cue-contracts = { path = "../eliot-cue-contracts" }
eliot-cue-normalizer = { path = "../eliot-cue-normalizer" }
