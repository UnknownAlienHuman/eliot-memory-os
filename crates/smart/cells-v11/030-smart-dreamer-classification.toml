schema_version = "eliot-functional-capability-cell-v11"
cell_id = "smart.dreamer.classification"
agent_order = 30
physical_package = "eliot-dreamer-memory-semantics"
execution_class = "COLD_BOUNDED"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"
causal_property = "Propose a semantic memory class without changing the source record or epistemic status."

[agent]
objective = "Implement semantic classification-candidate construction only."
write_scope = ["crates/smart/eliot-dreamer-memory-semantics/src/classification.rs", "crates/smart/eliot-dreamer-memory-semantics/tests/classification.rs"]
integration_owner = "Dreamer memory semantics integration owner"
forbidden_files = ["crates/smart/eliot-dreamer-memory-semantics/src/lib.rs", "crates/smart/eliot-dreamer-memory-semantics/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[api]
functions = ["pub fn build_classification_candidate(request: &ClassificationRequest, draft: &AdmittedDreamDraft) -> Result<ClassificationCandidate, ClassificationError>"]

[algorithm]
steps = [
  "Validate exact source handles, scope and fence.",
  "Map only to registered semantic classes.",
  "Retain alternative classes and disconfirming evidence.",
  "Name applicability, falsifier and authority ceiling.",
  "Return Unknown or NeedsProbe when evidence is insufficient."
]

[limits]
rules = ["Use explicit class and alternative maxima.", "Perform no taxonomy creation, retrieval or canonical write."]

[errors]
variants = ["IdentityMismatch", "FenceMismatch", "UnknownClass", "MissingEvidence", "MissingFalsifier", "UnsupportedPromotion"]

[forbidden]
operations = ["source-record mutation", "epistemic status change", "taxonomy creation", "model label as support", "generic fallback"]

[tests]
required = ["ambiguous item retains alternatives", "model label cannot promote support", "unregistered class is rejected", "counterevidence remains attached"]

[integration]
provider = "smart.dreamer.draft_admission"
consumer = "smart.dreamer.curation_dispatch and Governor/Human review owner"
product_pulse = "D3C_CURATION_PULSE_01"
stop_condition = "Stop and return ContractChallenge if semantic class registry or source-handle authority ceiling is unavailable."
