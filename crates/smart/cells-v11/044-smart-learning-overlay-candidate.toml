schema_version = "eliot-functional-capability-cell-v11"
cell_id = "smart.learning.overlay_candidate"
agent_order = 44
physical_package = "eliot-learning"
execution_class = "POST_ATTEMPT_BOUNDED"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"
causal_property = "Convert an admitted learning delta into a reversible task-local Harness overlay candidate."

[agent]
objective = "Implement reversible task-local overlay candidate construction only."
write_scope = ["crates/smart/eliot-learning/src/overlay_candidate.rs", "crates/smart/eliot-learning/tests/overlay_candidate.rs"]
integration_owner = "learning integration owner"
forbidden_files = ["crates/smart/eliot-learning/src/lib.rs", "crates/smart/eliot-learning/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[api]
functions = ["pub fn build_campaign_overlay_candidate(request: &OverlayCandidateRequest, delta: &AttemptLearningDelta) -> Result<CampaignHarnessOverlayCandidate, OverlayCandidateError>"]

[algorithm]
steps = [
  "Validate task, attempt, delta and fence identity.",
  "Permit changes only to local context recipe, working rules, local procedure or Skill variant, tool exposure, decomposition, route preference within policy, probe ordering and bounded stop rule.",
  "Reject objective, acceptance, finish, authority, privacy, cost ceiling, evaluator, holdout or canonical-write changes.",
  "Require expected decision delta, verifier, rollback and expiry."
]

[limits]
rules = ["Use explicit overlay-operation and byte maxima.", "Bind exactly one task-local scope."]

[errors]
variants = ["IdentityMismatch", "FenceMismatch", "DeltaNotAdmitted", "ForbiddenSurface", "MissingVerifier", "RollbackMissing", "ExpiryMissing"]

[forbidden]
operations = ["objective or acceptance mutation", "authority/privacy widening", "evaluator/holdout mutation", "canonical write semantics change", "global promotion"]

[tests]
required = ["objective mutation is rejected", "route preference cannot exceed admitted policy", "every overlay is reversible and expires", "NoJustifiedChange cannot produce overlay"]

[integration]
provider = "smart.learning.attempt_delta"
consumer = "smart.learning.overlay_validation"
product_pulse = "D4_TASK_LOCAL_LEARNING_PULSE_01"
stop_condition = "Stop and return ContractChallenge if a proposed operation cannot be proven task-local, reversible, expiring and policy-bounded."
