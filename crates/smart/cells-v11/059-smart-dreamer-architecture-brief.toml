schema_version = "eliot-functional-capability-cell-v11"
cell_id = "smart.dreamer.architecture_brief"
agent_order = 59
physical_package = "eliot-dreamer-self-model"
execution_class = "COLD_BOUNDED"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"
causal_property = "Compile a bounded Architecture intent brief from an exact accepted normative source projection."

[agent]
objective = "Implement bounded Architecture projection over an externally supplied accepted source."
write_scope = ["crates/smart/eliot-dreamer-self-model/src/architecture_brief.rs", "crates/smart/eliot-dreamer-self-model/tests/architecture_brief.rs"]
integration_owner = "Dreamer self-model integration owner"
forbidden_files = ["crates/smart/eliot-dreamer-self-model/src/lib.rs", "crates/smart/eliot-dreamer-self-model/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[api]
functions = ["pub fn build_architecture_brief(request: &ArchitectureBriefRequest, source: &AcceptedNormativeSourceProjection) -> Result<ArchitectureBriefCandidate, ArchitectureBriefError>"]

[algorithm]
steps = [
  "Validate accepted pair key, Architecture digest, source anchors and fence.",
  "Select only sections relevant to the exact question.",
  "Preserve Hard Boundaries, invariants, unresolved conflicts and source anchors.",
  "Separate quotation/projection from model interpretation.",
  "Emit candidate brief and omission manifest."
]

[limits]
rules = ["Use explicit section, anchor and byte maxima.", "Perform no repository, filesystem, web or storage read."]

[errors]
variants = ["PairKeyMismatch", "DigestMismatch", "FenceMismatch", "AnchorNotFound", "CoverageIncomplete", "BudgetExceeded"]

[forbidden]
operations = ["repository/web read", "third normative source creation", "Hard Boundary omission", "target/current conflation", "canonical write"]

[tests]
required = ["stale Architecture digest is rejected", "relevant Hard Boundary cannot be omitted", "interpretation is labelled candidate", "omitted section retains anchor"]

[integration]
provider = "accepted normative-source projection owner"
consumer = "smart.dreamer.current_system_conformance and external self-query review owner"
product_pulse = "D5_SELF_QUERY_EDGE_01"
stop_condition = "Stop and return ContractChallenge if accepted pair key, digest, exact source anchors or omission handles are unavailable."
