schema_version = "eliot-functional-capability-cell-v11"
cell_id = "smart.memory_curation.contracts"
agent_order = 28
physical_package = "eliot-memory-curation-contracts"
execution_class = "CONTRACT_ONLY"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"
causal_property = "Define read-only curation snapshots, dimensioned findings, protection roles and reversible proposal contracts."

[agent]
objective = "Implement shared curation contracts using existing evidence/lifecycle vocabularies."
write_scope = ["crates/smart/eliot-memory-curation-contracts/src/contracts.rs", "crates/smart/eliot-memory-curation-contracts/tests/contracts.rs"]
integration_owner = "memory curation contract owner"
forbidden_files = ["crates/smart/eliot-memory-curation-contracts/src/lib.rs", "crates/smart/eliot-memory-curation-contracts/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[api]
functions = ["pub fn validate_curation_contract(value: &CurationContractEnvelope) -> Result<(), CurationContractError>"]
owned_types = ["CurationSnapshot", "CurationRecordProjection", "ProtectionRole", "CurationEvidenceVector", "DimensionResult", "CurationFinding", "CurationProposal", "RestoreRequirement", "CurationCandidateSet"]

[algorithm]
steps = [
  "Validate exact snapshot revision, State Fence and unique canonical handles.",
  "Use shared evidence and lifecycle vocabularies rather than duplicate enums.",
  "Require dimensioned evidence for duplicate, applicability, support, use, outcome, false activation, retention, minority value and rollback coverage.",
  "Require every proposal to name restore and invalidation conditions.",
  "Represent unknown dimensions as Inconclusive."
]

[limits]
rules = ["Wire maxima are explicit.", "No scalar confidence, utility or aggregate quality proof."]

[errors]
variants = ["InvalidFence", "DuplicateHandle", "MissingProtectionRole", "MissingDimension", "InvalidProposal", "TooManyRecords"]

[forbidden]
operations = ["physical purge", "canonical mutation", "duplicate lifecycle enum", "writer utility scalar as proof", "support promotion"]

[tests]
required = ["writer utility scalar cannot satisfy a dimension", "protected minority record cannot be silently omitted", "proposal without restore condition is rejected", "support/accessibility/influence round-trip independently"]

[integration]
provider = "Governor canonical read projection owner"
consumer = "eliot-memory-curation and typed curation handlers"
product_pulse = "D3C_CURATION_PULSE_01"
stop_condition = "Stop and return ContractChallenge if shared lifecycle/evidence vocabularies or independent dimensions cannot be imported without duplication."
