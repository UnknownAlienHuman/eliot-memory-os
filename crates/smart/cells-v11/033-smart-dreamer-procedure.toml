schema_version = "eliot-functional-capability-cell-v11"
cell_id = "smart.dreamer.procedure"
agent_order = 33
physical_package = "eliot-dreamer-memory-semantics"
execution_class = "COLD_BOUNDED"
proof_ceiling = "STATIC_FUNCTION_DESIGN_ONLY"
causal_property = "Propose a procedure with preconditions, ordered steps, verifier, stop and transfer boundary."

[agent]
objective = "Implement candidate procedure synthesis only; do not execute or install capability."
write_scope = ["crates/smart/eliot-dreamer-memory-semantics/src/procedure.rs", "crates/smart/eliot-dreamer-memory-semantics/tests/procedure.rs"]
integration_owner = "Dreamer memory semantics integration owner"
forbidden_files = ["crates/smart/eliot-dreamer-memory-semantics/src/lib.rs", "crates/smart/eliot-dreamer-memory-semantics/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[api]
functions = ["pub fn build_procedure_candidate(request: &ProcedureRequest, draft: &AdmittedDreamDraft) -> Result<ProcedureCandidate, ProcedureError>"]

[algorithm]
steps = [
  "Validate evidence handles, scope and fence.",
  "Separate required preconditions from optional context.",
  "Emit ordered bounded steps with expected observations.",
  "Require verifier, stop, reopen and where-not-to-apply conditions.",
  "Represent external effects as required capabilities, never execute them."
]

[limits]
rules = ["Use explicit step and dependency maxima.", "Perform no tool call, action execution or package installation."]

[errors]
variants = ["IdentityMismatch", "FenceMismatch", "MissingPrecondition", "MissingVerifier", "MissingStopCondition", "UnavailableCapability", "UnsafeStep"]

[forbidden]
operations = ["tool execution", "external effect", "Skill installation", "authority inference", "canonical procedure write"]

[tests]
required = ["procedure without verifier is rejected", "unsafe external step remains capability requirement", "where-not-to-apply is mandatory for transferred procedure", "stop/reopen conditions are distinct"]

[integration]
provider = "smart.dreamer.draft_admission"
consumer = "smart.dreamer.skill and smart.dreamer.curation_dispatch"
product_pulse = "D3C_CURATION_PULSE_01"
stop_condition = "Stop and return ContractChallenge if capability, verifier, stop/reopen or transfer-boundary contracts are unavailable."
