schema_version = 2
module_id = "smart.epistemic.position"
crate = "eliot-epistemic"
status = "RETAIN_AND_HARDEN"
wave = "cognitive-micromodules-wave-01"
agent_order = 6
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C1"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.epistemic.position"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Resolve one explicit question over an admitted fenced record set into observed, supported, assumed, conflicted, stale, or unknown position with the cheapest inquiry."
owned_mutable_state = []
allowed_effects = []
inputs = ["PositionRequest", "admitted evidence records", "verifier competence/freshness projection"]
outputs = ["CurrentEpistemicPosition", "ProvenanceView", "InvestigationDirective candidate"]
depends_on = []
consumers = ["eliot-context-candidates", "eliot-dreamer-bundle", "ActionFrame compiler"]
non_goals = ["truth declaration", "record mutation", "model voting", "action authority"]
invariants = ["fresh outlier updates evidence without blindly replacing aggregate", "rivals and superseded lineage remain visible", "missing data is a valid position", "scope/fence mismatch fails locally"]
failure_behavior = "Return conflicted/stale/unknown with a discriminative inquiry; block only the dependent effect through the caller."
proof_surface = ["fresh outlier conflict", "assumption withdrawal", "stale verifier", "mixed provenance ceiling", "empty-current-position inquiry"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-epistemic/src/lib.rs"
disposition = "retain_and_harden"
scope = "existing resolver and provenance closure"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.12"
disposition = "authoritative_contract"
scope = "position algebra and Investigation Mode"

[agent_task]
objective = "Harden the existing crate in place; add missing assumption, supersession, verifier-competence, and investigation semantics without creating state."
write_scope = ["crates/smart/eliot-epistemic/**"]
deliverables = ["revised position algebra", "deterministic inquiry selection", "property/adversarial tests"]
acceptance = ["one causal owner remains", "no new crate split unless a second proof/replacement boundary appears", "rivals and unknowns survive every result"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop and challenge if a requested change belongs to Governor action state or canonical epistemic transition."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof, affected edge proof, current-main rebase and integration-owner review"
