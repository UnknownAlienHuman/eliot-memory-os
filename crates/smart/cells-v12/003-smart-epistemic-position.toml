  "crates/smart/eliot-epistemic/src/resolver.rs",
  "crates/smart/eliot-epistemic/tests/resolver.rs",
]
algorithm = [
  "validate request and admitted record-set digests, exact scope/task/time/fence, owner rows and denominator",
  "partition direct observations, candidate support, explicit assumptions, rivals, stale, superseded and unknown records without changing source status",
  "group contradictions only by compatible proposition, scope and valid time",
  "mark shared lineage, capture route, evaluator and model-family dependence before considering support",
  "preserve fresh minority and counterevidence independently of record count",
  "derive typed InvestigationRequirements only for unresolved decision dependencies",
  "canonicalize all role collections and compute the position digest",
]
minimum_tests = [
  "empty records under partial/unavailable coverage never mean no evidence",
  "DirectObservation does not become SupportedPosition",
  "ExplicitAssumption remains explicit and unsupported",
  "shared-lineage duplicates do not become independent support",
  "fresh minority counterevidence remains visible",
  "conflict on one proposition remains local",
  "record/owner-row permutation yields identical position",
  "resolver has no I/O, model, write or support-promotion surface",
]
