schema_version = 2
module_id = "smart.dreamer.rival_model"
crate = "eliot-dreamer-rival-model"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 16
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.rival_model"
loc_soft_ceiling = 10000
primary_responsibility = "Structure and preserve bounded competing interpretations from a grounded validated draft without selecting a winner or collapsing dissent."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamInputBundle", "ValidatedDreamDraft", "CurrentEpistemicPosition"]
outputs = ["RivalModelSet", "shared/discriminating evidence map", "invalidation conditions"]
depends_on = ["eliot-dreamer-contracts"]
execution_after = ["eliot-dreamer-claim-grounding", "eliot-dreamer-candidate-validation"]
consumers = ["eliot-dreamer-orientation", "eliot-dreamer-clarification", "later diagnosis/research handlers"]
non_goals = ["choose the true model", "vote/average models", "execute inquiry", "call a model"]
invariants = ["minority and counterexample models remain addressable", "each rival retains claim-level lineage and disconfirming evidence", "absence of a rival is not proof of certainty", "ordering is deterministic"]
failure_behavior = "Emit an explicit insufficient-rivals disposition or preserve partially grounded rivals; never manufacture consensus."
proof_surface = ["dissent preservation", "duplicate/equivalent rival handling", "counterevidence symmetry", "permutation invariance"]
replacement_boundary = "rival structuring algorithm behind RivalModelSet"
split_trigger = "winner selection, inquiry execution or source acquisition appears"
rust_contract_dependencies = ["eliot-dreamer-contracts"]

[[donor]]
path = "crates/smart/eliot-dreamer-core/src/lib.rs"
disposition = "partial_reuse"
scope = "CandidateKind::RivalModel, alternatives_preserved and counterevidence fields"

[[donor]]
path = "ELIOT Architecture/Implementation English edition 2026-08-28"
disposition = "authoritative_contract"
scope = "rival hypotheses, uncertainty preservation and discriminative inquiry"

[agent_task]
objective = "Implement a reusable rival-model structurer independent of Orientation assembly."
write_scope = ["crates/smart/eliot-dreamer-rival-model/**"]
deliverables = ["rival normalizer/validator", "evidence-discrimination map", "dissent/adversarial tests"]
acceptance = ["no winner or scalar consensus", "rivals retain exact lineage/counterevidence", "usable by Orientation and Clarification without concrete coupling"]
forbidden = ["canonical writes", "truth/support promotion", "provider/model SDKs", "source acquisition", "inquiry execution"]
stop_condition = "Stop if selecting a winner is required; return the unresolved rivalry and required inquiry."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package proof", "orientation/clarification edge fixtures", "Orientation Product Pulse"]
workspace_admission = "forbidden until src/lib.rs, package proof and Orientation Product Pulse pass"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# These are the floors every cell shares. The owning work unit tightens them
# with `required_exports` and `required_tests` taken from its own brief, so a
# reviewer decides on one exit code instead of reading prose criteria.
[acceptance]
min_source_lines = 200
min_public_items = 6
min_tests = 5
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
