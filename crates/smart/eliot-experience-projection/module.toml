schema_version = 4
module_id = "smart.experience.projection"
crate = "eliot-experience-projection"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 48
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.experience.projection"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Governor-owned observation records travel as a validated immutable slice with owner gaps and coverage provenance, never as a completeness claim."
causal_property = "immutable System Experience journal slice"
old_failure_or_missing_capability = "Self-quality evidence arrives as prose, bare handle refs, or vector-length completeness instead of owner-validated records with typed gaps and coverage provenance (CC-W9-COGNITIVE-QUALITY)."
discriminator = "every record validates with the owner validate(); gaps are owner CoverageGap records; the denominator is exactly the supplied set and completeness is never claimed"
primary_responsibility = "Assemble one immutable ExperienceJournalSlice from owner-typed SystemObservationJournalRecords with supplied-set accounting."
owned_mutable_state = []
allowed_effects = []
inputs = ["owner-typed SystemObservationJournalRecords by value (foundation observation-contracts owner)"]
outputs = ["ExperienceJournalSlice"]
depends_on = ["eliot-observation-contracts", "eliot-contracts"]
providers = ["Governor observation owner (record supply only)"]
consumers = ["eliot-cognitive-quality self-quality view (candidate only)"]
non_goals = ["experience bank ownership", "relation store", "lifecycle transitions", "owner completeness enumeration", "vector-length completeness", "free-form omission reasons", "support/influence promotion", "aggregate score"]
invariants = ["owner records only: every record validates with the owner validate()", "gaps are owner CoverageGap records, never invented reason strings", "supplied always equals records.len(); completeness over the owner journal is never claimed", "no caller-supplied scope/fence; scope/fence/revision stay with owner records", "typed bank/journal/feedback completeness proofs stay with their owners"]
failure_behavior = "Reject owner-invalid records, version drift, and supplied/carried count mismatch explicitly. Completeness use requires owner revalidation."
proof_surface = ["gap-record assembly", "ordinary-record-without-event rejection", "count mismatch", "wire roundtrip"]
proof_ceiling = "PACKAGE_PROOF_ONLY"
product_pulse = "W9_COGNITIVE_QUALITY_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "crates/foundation/eliot-observation-contracts/src/lib.rs"
disposition = "owner contracts reused: SystemObservationJournalRecord validate(), CoverageGap typed omissions, CoverageEvidence denominator_source_ref provenance, CONTRACT_VERSION 1.0.0"

[[donor]]
path = "crates/smart/cognitive-rev12-contract-schema-freeze.toml"
disposition = "wave authority: supplied-set denominator doctrine; typed journal/bank/feedback completeness proofs recorded NOT_FROZEN and stayed with their owners"

[[donor]]
path = "crates/smart/eliot-system-experience"
disposition = "RETIRED_DUPLICATE: reuse bounded read/projection mechanics by reference only; no second self-memory owner, relation store, or lifecycle transition path"

[agent_task]
objective = "Assemble an immutable validated slice over owner-typed journal records with supplied-set accounting."
write_scope = ["crates/smart/eliot-experience-projection/**"]
deliverables = ["journal-slice contract", "owner validation reuse", "consumer compile fixtures"]
acceptance = ["one declared responsibility only", "bounded deterministic behavior", "visible local degradation"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification", "second experience bank or lifecycle ownership"]
stop_condition = "Stop and return ContractChallenge when the work needs another owner, store access, model work or hidden state."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main rebase and integration-owner review"

# Acceptance is decided by the owning contract and independent review
# (I0.10: line/test/type counts are not goals). `scripts/verify-work-unit.py`
# is a retired legacy diagnostic that always reports completion=NOT_VERIFIED
# and never accepts a work unit. This table names the concrete contract and
# the required exports/tests plus small behaviour checks the reviewer verifies.
[acceptance]
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
