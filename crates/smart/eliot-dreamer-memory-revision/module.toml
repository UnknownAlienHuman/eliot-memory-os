field_family_authority = "The replaced list is the stale side and the list above is the corrected one. Decided by docs/architecture/I12-21-memory-ecology-residual-experience-and-transfer.md:97-98: 'Memory revision/reconsolidation is represented through the existing canonical `MemoryTransition` / `WriteReceipt` owner and a derived `MemoryRevisionEvidence`, not a second memory system:' -- the nine `revision_*` names that sentence introduces are the yaml field list of `MemoryRevisionEvidence` at I12-21:100-110, not of any candidate, and this crate already consumes that record by reference through `RevisionIntake::evidence`, so copying the nine names onto the candidate would be the second memory system the same sentence forbids. The ten `failure_fingerprint_*` names are decided by the same argument one donor earlier: docs/architecture/I12-19-negative-memory.md:6-17 is a `FailureFingerprint:` yaml block for a separate shape whose typed owner is `eliot_observation_contracts::FailureObservation`, which this crate already reaches by handle through `RevisionIntake::observation`. The only sentence in either donor that names a member of this candidate is I12-19:19, 'Extinction narrows influence after new evidence; history remains.', and that is what `candidate_reversible_advisory_narrowing_only` carries. DONOR PROVENANCE AND TYPED OWNERSHIP ARE TWO DIFFERENT MEASUREMENTS AND BOTH ARE STATED HERE, because the nineteen names are quoted out of both yaml blocks and a reader of this key alone would otherwise take the second for the first. As DONOR PROVENANCE the description is exact for 19/19: the ten `failure_fingerprint_*` names are the yaml field list of the `FailureFingerprint` block at I12-19:6-17 and the nine `revision_*` names are the yaml field list of the `MemoryRevisionEvidence` block at I12-21:100-110, verbatim. As TYPED OWNERSHIP it is true for only 4/10 and 0/9. The I12-19:6-17 block is field-typed as FC-OBS-FAILURE-OBSERVATION (`eliot_observation_contracts::FailureObservation`, 16 field rows at crates/smart/cognitive-rev12-contract-schema-freeze.toml:4644-4835), and only 4 of the ten donor names are field rows of that frozen type: `trigger`, `failed_action`, `violated_invariant`, `reopen_condition`. `failure_fingerprint_affected_scope_resources` is also not a field row of it; it resolves only by mapping to `FailureObservation::scope`. The other five -- `failure_fingerprint_evidence`, `_causal_status`, `_do_not_repeat_until`, `_discriminative_check`, `_false_activation_history` -- are field rows of neither frozen record this crate consumes, which is the whole scope of the claim; it asserts nothing about typed shapes elsewhere, and where a typed shape does exist elsewhere it is named rather than denied. All five have one elsewhere, and every one is named here: `failure_fingerprint_evidence` is carried as `FailureActionEvidence::evidence` (`pub evidence: Vec<FailureEvidence>`, crates/smart/eliot-dreamer-contracts/src/failure/records.rs:748, declared on `pub struct FailureActionEvidence` at same file:744, over the element type `pub struct FailureEvidence` at same file:624), a record that does carry evidence BODIES, which is why the handles-only statement below is scoped to the two frozen records rather than asserted repository-wide; `failure_fingerprint_causal_status` has TWO owners, `FailureHypothesis::status` (`pub status: FailureCausalStatus`, records.rs:1543, typed by `pub enum FailureCausalStatus` at same file:1524) and `NegativeMemoryFingerprint::causal: CausalLimits` (crates/smart/eliot-dreamer-failure/src/negative_memory.rs:1162); `failure_fingerprint_do_not_repeat_until` has TWO owners, `FailureMitigation::do_not_repeat_until` (`pub do_not_repeat_until: String` on `pub struct FailureMitigation`, records.rs:1559 and :1558, validated at same file:1571-1573) and `NegativeMemoryFingerprint::do_not_repeat: NegativeMemoryHorizon` (crates/smart/eliot-dreamer-failure/src/negative_memory.rs:1164, on `pub struct NegativeMemoryHorizon` at same file:891); `failure_fingerprint_discriminative_check` is carried under a DIFFERENT member name, `NegativeMemoryFingerprint::discriminating_check: NegativeMemoryDiscriminatingCheck` (crates/smart/eliot-dreamer-failure/src/negative_memory.rs:1168, on `pub struct NegativeMemoryDiscriminatingCheck` at same file:1011), so the donor spelling `discriminative_check` and the member spelling `discriminating_check` are one concept under two names, not two concepts; and `failure_fingerprint_false_activation_history` is the strongest case of the five, `NegativeMemoryFingerprint::false_activation_history: NegativeMemoryFalseActivationHistory` (crates/smart/eliot-dreamer-failure/src/negative_memory.rs:1170, on `pub struct NegativeMemoryFalseActivationHistory` at same file:1064, validated at same file:1085), which is a SAME-NAMED typed field on a production record and therefore refutes any reading that this name has no typed owner anywhere. None of the five is a field row of either frozen record, so the 4/10 and the 0/9 measured here are unaffected by naming them. The I12-21:100-110 block is field-typed as FC-OBS-MEMORY-REVISION-EVIDENCE (`eliot_observation_contracts::MemoryRevisionEvidence`, 12 field rows at same file:4847-4990, whose twelve `wire_name`s are `contract_version`, `evidence_id`, `observation_ref`, `evidence_refs`, `evidence_revision`, `scope`, `state_fence`, `coverage`, `same_hypothesis_recurrence`, `prior_attempts`, `omissions`, `digest`), and 0/9 of the `revision_*` donor names are field rows of it: none of the nine donor suffixes the block declares at I12-21:101-109 -- `prior_and_new_record_or_model_refs`, `reactivation_trigger_and_task_scope`, `new_observation_outcome_or_prediction_error`, `old_and_new_epistemic_accessibility_and_influence_state`, `retained_narrowed_and_lost_distinctions`, `retrieval_downstream_use_interference_and_false_recall_checks`, `affected_procedures_views_and_dependency_closure`, `rollback_reopen_or_no_return_boundary`, `verifier_or_review_disposition` -- matches any of those twelve `wire_name`s. No name of the nineteen may therefore be read as asserting typed ownership by the frozen type its yaml block describes; `superseded_field_family_owners` records per name the owner datum that does exist on either frozen record, or that none does; a name with no such datum may still have a typed shape in another crate, as the two named above show. Corroboration that no byte-pinned authority ever froze the 21 names: crates/smart/cognitive-rev12-contract-schema-freeze.toml:5456 states the candidate is 'the consumer's own output, NOT a frozen input to this family', and that file carries no [[field_contract]] or [[field_contract_index]] row for this type, so the only two copies that declared those 21 names as THIS CANDIDATE'S field family were this manifest and the wave-09 catalogue row, both `implementation_support = \"TARGET\"` and `evidence_execution_status = \"NOT_EXECUTED\"`; the replaced list does have a THIRD copy, but not a field-family claim: crates/smart/cognitive-wave-10.toml's `[[type_contract]]` MR-04 `fields` (same file:1643) restates the same 21 names (the twenty-first spelled there `extinction_evaluation_operation_equals_extinguish_with_evaluator_kind_and_subdimensions` and elided here as `extinction_evaluation_operation_equals_extinguish_with_...terminal_disposition`, both the collapsed `MemoryLifecycleEvaluation` list at I12-21:117-128, so the three spellings across this manifest, that row and the challenges ledger denote ONE name) as a `kind = \"prior static description\"` row whose `disposition = \"corrected_static_description\"` (same file:1642 and :1654) makes it the SUPERSEDED static description, and it claims no owner of the 21 names -- it names this manifest's row as `corrected_field_family_owner` (same file:1645) and carries the twelve corrected names in `corrected_field_family` (same file:1644) as the authoritative side, so the 21 names stand there only as the stale side it points away from and not as a third declaration of this candidate's field family; I0.3:3 classes an accepted generated contract or registry artifact as evidence that 'cannot override either book'."
field_family_disposition = "CORRECTED_STATIC_FIELD_FAMILY. No Rust member was added, removed or renamed, because the twelve corrected names resolve one-to-one onto the members the candidate already declares, so the corrected family is the shipped shape and nothing had to be invented to reach it. This copy and crates/smart/cognitive-wave-09.toml now carry the same twelve names in `fields`, and the two rows are byte-identical on the nine keys its contract_placement_rule (crates/smart/cognitive-wave-09.toml:27) enumerates -- id, owner_crate, fields, denominator, denominator_rule, complete_rule, fence, omission_semantics and invariants -- so that placement rule is satisfied by this delivery and no wave-09 edit is owed for `fields`; the re-point is the catalogue writer's and is not written here. `denominator`, `denominator_rule`, `complete_rule`, `fence`, `omission_semantics` and `invariants` are deliberately left byte-identical: the `ClosureDenominator` this crate already emits is exactly the re-enumeration duty `denominator` declares, while the two remaining duties in `denominator_rule` -- the false-activation history and the false-delete/false-retain/false-block/reopen counts -- are duties of the Governor-side `MemoryLifecycleEvaluation` that I12-21:114 conditions on 'A Material change to allowed influence' and that I12-21:143 keeps out of a reversible candidate, so they are not this cell's fields to carry. Two residuals are recorded rather than closed here, because both belong to other owners. The 21 replaced names partition as 21 = 5 carried by this candidate + 4 that resolve to a typed owner field of the frozen records by handle + 11 with no owner datum on either frozen record this crate consumes + 1 rejected for this cell. The four buckets are DISJOINT and together carry the 21 names EXACTLY ONCE EACH, so this partition is the single one any other file must use; `superseded_field_family_owners` enumerates the same buckets name by name. Bucket 1, the 5 carried by this candidate, is exactly `extinction_proposed_activation_influence_narrowing_only`, `failure_fingerprint_trigger`, `failure_fingerprint_failed_action`, `failure_fingerprint_violated_invariant`, `failure_fingerprint_reopen_condition`. Bucket 2, the 4 that resolve to a typed owner field by handle, is exactly `failure_fingerprint_affected_scope_resources`, `revision_prior_and_new_record_or_model_refs`, `revision_reactivation_trigger_and_task_scope`, `revision_affected_procedures_views_and_dependency_closure`. Bucket 3, the 11 with no owner datum on either frozen record, is exactly `failure_fingerprint_evidence`, `failure_fingerprint_causal_status`, `failure_fingerprint_do_not_repeat_until`, `failure_fingerprint_discriminative_check`, `failure_fingerprint_false_activation_history`, `revision_new_observation_outcome_or_prediction_error`, `revision_old_and_new_epistemic_accessibility_and_influence_state`, `revision_retained_narrowed_and_lost_distinctions`, `revision_retrieval_downstream_use_interference_and_false_recall_checks`, `revision_rollback_reopen_or_no_return_boundary`, `revision_verifier_or_review_disposition`. Bucket 4, the 1 rejected for this cell, is exactly `extinction_evaluation_operation_equals_extinguish_with_...terminal_disposition`. Bucket membership is stated per name here precisely so another writer aligns to these buckets instead of choosing its own partition. The 5 carried are Group C's `extinction_proposed_activation_influence_narrowing_only`, renamed here to `candidate_reversible_advisory_narrowing_only`, plus the four that ARE field rows of FC-OBS-FAILURE-OBSERVATION (`failure_fingerprint_trigger`, `_failed_action`, `_violated_invariant`, `_reopen_condition`), which are folded into `candidate_composite_failure_fingerprint_echoed_verbatim` rather than split out onto the candidate. The 4 that resolve to a typed owner field by handle without becoming a candidate member are `failure_fingerprint_affected_scope_resources` (mapped to `FailureObservation::scope` and bound by the proved `validate_intake` scope chain) and the three Group B names `revision_prior_and_new_record_or_model_refs`, `revision_reactivation_trigger_and_task_scope` and `revision_affected_procedures_views_and_dependency_closure` (mapped to `MemoryRevisionEvidence::evidence_refs` with the prior side held by the observation's `journal_refs`, to the observation's own `trigger` plus `scope`, and to `evidence_refs` counted into the closure denominator). Bucket 3's 11 have no owner datum on either frozen record this crate consumes, which is the scope of the claim; the five `failure_fingerprint_*` names in it each DO have a typed owner elsewhere, all five named with owner paths in `field_family_authority`, and that is not a reason to move a name out of the bucket, because bucket membership records the twenty-one-name disposition and not the presence or absence of a typed shape in some other crate. They are 5 from `failure_fingerprint_*` (`_evidence`, `_causal_status`, `_do_not_repeat_until`, `_discriminative_check`, `_false_activation_history`) and 6 from `revision_*` (`revision_new_observation_outcome_or_prediction_error`, `revision_old_and_new_epistemic_accessibility_and_influence_state`, `revision_retained_narrowed_and_lost_distinctions`, `revision_retrieval_downstream_use_interference_and_false_recall_checks`, `revision_rollback_reopen_or_no_return_boundary`, `revision_verifier_or_review_disposition`). The 1 rejected for this cell is `extinction_evaluation_operation_equals_extinguish_with_...terminal_disposition`, the collapsed `MemoryLifecycleEvaluation` list at I12-21:117-128. Therefore (1) 11 of the 21 removed names are field rows of neither frozen record this crate consumes, so the I12-19 `FailureFingerprint` yaml block is not field-typed in eliot-observation-contracts beyond the 4/10 measured above, and the I12-21 `MemoryRevisionEvidence` yaml block not at all (0/9); (2) no crate owns a `MemoryLifecycleEvaluation` type, measured by search over