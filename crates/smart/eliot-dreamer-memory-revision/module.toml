superseded_field_family_owners = "Group A, the ten names derived from the `FailureFingerprint` yaml block at I12-19:6-17, of which four are field rows of `eliot_observation_contracts::FailureObservation`, one resolves to its `scope` without being a field row, and five are field rows of neither frozen record this crate consumes: `failure_fingerprint_trigger` is `FailureObservation::trigger` and is the datum `candidate_exact_deterministic_trigger_with_its_observation_and_fence` ECHOES; the word `bound` in that member name means exactly what `NegativeMemoryExtinctionCandidate::validate` enforces and nothing more -- the recorded identity is bounded and control-character-free (crates/smart/eliot-dreamer-memory-revision/src/lib.rs:393), is refused when equal to `candidate_composite_failure_fingerprint_echoed_verbatim` (same file:407), is committed to by `candidate_frozen_digest` (same file:463), and `ExactTrigger::observation_ref` equals `candidate_observed_failure_handle` (same file:412) while `ExactTrigger::state_fence` is compared for compatibility against `ClosureDenominator::fence` (same file:436). The equality of `ExactTrigger::identity` with the owner datum is NOT enforced by `validate` and this manifest no longer claims it, because `validate` takes no owner input: that equality is established once where the observation record is reachable -- `validate_intake` revalidates it at same file:732 and the `ExactTrigger` literal in `finish` copies `observation.trigger` and `observation.state_fence` verbatim at same file:957 -- and is never re-read, so a writer who rewrites the identity (or the fence together with `ClosureDenominator::fence`) and recomputes `candidate_closure_denominator_named_fence_members_exclusions_and_recheck_digest` and `candidate_frozen_digest` still holds a record `validate` accepts. Measured reason it is not closable inside `validate`: every digest in this repository's vocabulary is unkeyed (`eliot_contracts::sha256_hex`, crates/foundation/eliot-co