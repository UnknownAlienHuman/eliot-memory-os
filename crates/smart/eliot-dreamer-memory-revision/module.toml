# Corrected under issue #262 (R-UNRESOLVED-ROWS). The list this line replaces
# carried 21 names: 19 of them were the `FailureFingerprint` field list
# (I12-19:6-17) or the `MemoryRevisionEvidence` field list (I12-21:100-110), one
# was the collapsed `MemoryLifecycleEvaluation` list (I12-21:117-128), and only
# one named this type. `field_family_authority` and `field_family_disposition`
# below state the decision and the sentence it was decided by, and
# `superseded_field_family_owners` states where each removed name actually
# lives. The twelve names here resolve one-to-one, in this order, onto the
# twelve members `NegativeMemoryExtinctionCandidate` declares at
# crates/smart/eliot-dreamer-memory-revision/src/lib.rs.
fields = ["candidate_contract_version", "candidate_stable_identity", "candidate_observed_failure_handle", "candidate_exact_deterministic_trigger_with_its_observation_and_fence", "candidate_composite_failure_fingerprint_echoed_verbatim", "candidate_posed_self_query_digest", "candidate_reversible_advisory_narrowing_only", "candidate_disposition", "candidate_closure_denominator_named_fence_members_exclusions_and_recheck_digest", "candidate_terminal_state", "candidate_exact_missing_evidence", "candidate_frozen_digest"]
denominator = "enumerated_affected_procedures_views_and_dependency_closure over independently_re-enumerated_closure_at_named_fence_with_exclusions"
denominator_rule = "RECHECK: re-enumerate affected procedures/views/dependency closure from retained refs at the named fence; verify false-activation history and valid-near-match positive controls are present; recompute false-delete/false-retain/false-block/reopen counts from the same inputs. Extinction Completeness without this closure is invalid."
complete_rule = "Every Complete state requires the exact independently recheckable closure denominator above; without adequate adjudication only reversible suppress/quarantine/archive is allowed."
fence = "Task scope plus StateFence revisions; exact deterministic trigger scope for block/probe."
omission_semantics = "Missing closure members block completeness; semantic similarity only warns, while an exact deterministic trigger blocks or requires a probe within matching scope."
invariants = ["extinction narrows influence after new evidence and history remains", "the original failure episode is never rewritten or purged and every history field is preserved verbatim", "raw episodes and source observations remain immutable", "an exact deterministic trigger may block or require a probe within matching scope; semantic similarity only creates a warning or inquiry obligation", "extinction is never justified by the rarity of an action change alone, and never by retrieval, popularity or repetition frequency", "revision changes current support/applicability/accessibility/influence through forward transitions only", "no second memory system", "recurring failure with the same causal hypothesis yields Mechanism Review rather than another equivalent retry", "consume immutable owner-produced projections only", "no aggregate intelligence/confidence/utility score", "every Complete state requires the exact independently recheckable denominator", "this crate owns no canonical state, lifecycle transition, scheduler, effect, authority or task finish"]
field_family_authority = "The replaced list is the stale side and the list above is the corrected one. Decided by docs/architecture/I12-21-memory-ecology-residual-experience-and-transfer.md:97-98: 'Memory revision/reconsolidation is represented through the existing canonical `MemoryTransition` / `WriteReceipt` owner and a derived `MemoryRevisionEvidence`, not a second memory system:' -- the nine `revision_*` names that sentence introduces are the yaml field list of `MemoryRevisionEvidence` at I12-21:100-110, not of any candidate, and this crate already consumes that record by reference through `RevisionIntake::evidence`, so copying the nine names onto the candidate would be the second memory system the same sentence forbids. The ten `failure_fingerprint_*` names are decided by the same argument one donor earlier: docs/architecture/I12-19-negative-memory.md:6-17 is a `FailureFingerprint:` yaml block for a separate shape whose typed owner is `eliot_observation_contracts::FailureObservation` (frozen as FC-OBS-FAILURE-OBSERVATION at crates/smart/cognitive-rev12-contract-schema-freeze.toml:4633), which this crate already reaches through `RevisionIntake::observation`. The only sentence in either donor that names a member of this candidate is I12-19:19, 'Extinction narrows influence after new evidence; history remains.', and that is what `candidate_reversible_advisory_narrowing_only` carries. Corroboration that no byte-pinned authority ever froze the 21 names: crates/smart/cognitive-rev12-contract-schema-freeze.toml:5456 states the candidate is 'the consumer's own output, NOT a frozen input to this family', and that file carries no [[field_contract]] or [[field_contract_index]] row for this type, so the only two copies of the replaced list were this manifest and the wave-09 catalogue row, both `implementation_support = \"TARGET\"` and `evidence_execution_status = \"NOT_EXECUTED\"`; I0.3:3 classes an accepted generated contract or registry artifact as evidence that 'cannot override either book'."
field_family_disposition = "CORRECTED_STATIC_FIELD_FAMILY. No Rust member was added, removed or renamed, because the twelve corrected names resolve one-to-one onto the members the candidate already declares, so the corrected family is the shipped shape and nothing had to be invented to reach it. This copy and crates/smart/cognitive-wave-09.toml are therefore no longer byte-identical on `fields`, which its contract_placement_rule (crates/smart/cognitive-wave-09.toml:27) requires: every other key of this row is unchanged and the wave-09 owner must re-point its own `fields` list to the twelve names above, which is handed over as catalogue row text and not written here. `denominator`, `denominator_rule`, `complete_rule`, `fence`, `omission_semantics` and `invariants` are deliberately left byte-identical: the `ClosureDenominator` this crate already emits is exactly the re-enumeration duty `denominator` declares, while the two remaining duties in `denominator_rule` -- the false-activation history and the false-delete/false-retain/false-block/reopen counts -- are duties of the Governor-side `MemoryLifecycleEvaluation` that I12-21:114 conditions on 'A Material change to allowed influence' and that I12-21:143 keeps out of a reversible candidate, so they are not this cell's fields to carry. Two residuals are recorded rather than closed here, because both belong to other owners: (1) eleven of the fifteen removed names have no typed owner datum anywhere in the production path, so the I12-19 `FailureFingerprint` yaml block is not field-typed in eliot-observation-contracts; (2) no crate owns a `MemoryLifecycleEvaluation` type, measured by search over crates/, so I12-21:117-128 has no implementation at all. Neither is closed by this correction and neither is claimed by it."
superseded_field_family_owners = "Group A, the ten `failure_fingerprint_*` names, all owned by `eliot_observation_contracts::FailureObservation` and reached through `RevisionIntake::observation`: `failure_fingerprint_trigger` is `FailureObservation::trigger` and is the datum `candidate_exact_deterministic_trigger_with_its_observation_and_fence` ECHOES; the word `bound` in that member name means exactly what `NegativeMemoryExtinctionCandidate::validate` enforces and nothing more -- the recorded identity is bounded and control-character-free (crates/smart/eliot-dreamer-memory-revision/src/lib.rs:392), is refused when equal to `candidate_composite_failure_fingerprint_echoed_verbatim` (same file:406), is committed to by `candidate_frozen_digest` (same file:462), and `ExactTrigger::observation_ref` equals `candidate_observed_failure_handle` (same file:411) while `ExactTrigger::state_fence` is compared for compatibility against `ClosureDenominator::fence` (same file:435). The equality of `ExactTrigger::identity` with the owner datum is NOT enforced by `validate` and this manifest no longer claims it, because `validate` takes no owner input: that equality is established once where the observation record is reachable -- `validate_intake` revalidates it at same file:732 and the `ExactTrigger` literal in `finish` copies `observation.trigger` and `observation.state_fence` verbatim at same file:957 -- and is never re-read, so a writer who rewrites the identity (or the fence together with `ClosureDenominator::fence`) and recomputes `candidate_closure_denominator_named_fence_members_exclusions_and_recheck_digest` and `candidate_frozen_digest` still holds a record `validate` accepts. Measured reason it is not closable inside `validate`: every digest in this repository's vocabulary is unkeyed (`eliot_contracts::sha256_hex`, crates/foundation/eliot-contracts/src/lib.rs:693, takes only bytes and holds no key; this crate holds no hmac, signature, nonce or secret), so no recorded value a forger can recompute distinguishes an authored member from a rewritten one. The two values on this path not reachable from the candidate are `SafetyProjection::negative_memory_triggers` and `TaskProjection::binding.state_fence` (`RevisionIntake::task`, same file:680, copied into `ClosureDenominator::fence` at same file:944 and compared against `observation.state_fence` at same file:756), both reachable only inside `finish`; the first is ALREADY the input of `NegativeMemoryExtinctionCandidate::recheck_exact_trigger` (same file:505), which refuses with the existing `RevisionError::ScopeMismatch` and which `finish` calls on every emitted candidate (same file:984), so this residual is recorded open to the integration owner rather than closed by a second scheme or a keyed mechanism, neither of which this file's forbidden list admits; `failure_fingerprint_failed_action`, `failure_fingerprint_violated_invariant` and `failure_fingerprint_reopen_condition` are `failed_action`, `violated_invariant` and `reopen_condition` on that same record and are deliberately not split out onto the candidate, because a verbatim echo of an owner field on a consumer candidate is the string-facade boundary crates/foundation/eliot-contracts/AGENTS.md forbids; `failure_fingerprint_affected_scope_resources` is `FailureObservation::scope`, and the scope binding is a proved chain (validate_intake proves the observation scope equals both admitted projections' scope before anything is classified) rather than a copied value; `failure_fingerprint_evidence` has NO owner datum, because the typed owners expose `journal_refs` and `MemoryRevisionEvidence::evidence_refs` as handles only and never an evidence body (crates/smart/cognitive-rev12-contract-schema-freeze.toml:4641 and :4844); `failure_fingerprint_causal_status`, `failure_fingerprint_do_not_repeat_until`, `failure_fingerprint_discriminative_check` and `failure_fingerprint_false_activation_history` have NO owner datum, and the closed `FailureOmissionClass` admits no false-activation class. Group B, the nine `revision_*` names, all owned by `eliot_observation_contracts::MemoryRevisionEvidence` (frozen as FC-OBS-MEMORY-REVISION-EVIDENCE at crates/smart/cognitive-rev12-contract-schema-freeze.toml:4836) and reached through `RevisionIntake::evidence`: `revision_prior_and_new_record_or_model_refs` is `evidence_refs` on the post-dating side with the prior side held by the observation's own `journal_refs`, and the two together are exactly what `candidate_closure_denominator_named_fence_members_exclusions_and_recheck_digest` enumerates; `revision_reactivation_trigger_and_task_scope` is the observation's `trigger` plus its `scope`, which the record already carries through the chain the candidate binds, and the evidence record has no such field of its own; `revision_affected_procedures_views_and_dependency_closure` is `evidence_refs` counted into that denominator; `revision_new_observation_outcome_or_prediction_error`, `revision_old_and_new_epistemic_accessibility_and_influence_state`, `revision_retained_narrowed_and_lost_distinctions`, `revision_retrieval_downstream_use_interference_and_false_recall_checks`, `revision_rollback_reopen_or_no_return_boundary` and `revision_verifier_or_review_disposition` have NO owner datum, and `candidate_disposition` is this crate's own review routing decided in classify, which is not the evidence record's verifier or review disposition. Group C, `extinction_proposed_activation_influence_narrowing_only`, is RETAINED and RENAMED: it is the one removed name that named this type, and it is now `candidate_reversible_advisory_narrowing_only` per I12-19:19. Group D, `extinction_evaluation_operation_equals_extinguish_with_...terminal_disposition`, is REJECTED for this cell: it is the collapsed field list of the `MemoryLifecycleEvaluation` yaml block at I12-21:117-128, and its own wording asserts operation = extinguish, which I12-21:140 forbids ('destructive purge or permanent extinction cannot claim epistemic safety') and which this manifest's own non-goals and the W9-MR-ADVISORY-ONLY-HISTORY-PRESERVED gate already refuse."

