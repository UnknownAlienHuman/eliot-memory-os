missing_contract = "Issue #259 measured the tree before writing: the four crates/smart/*/module.toml files carried zero [[field_contract]], [[field_contract_index]], [[assignment]], [[agent_brief]], [[ownership]], [[crate_manifest]] and [[validation_gate]] tables, and the whole W9 freeze lived only in crates/smart/cognitive-wave-09.toml, so an implementation agent handed its own crate manifest had no contract in front of it. Each of the four field contracts is now also written into the owning crate's own module.toml, and every [[agent_brief]] names a field_contract_ref pointing at that crate copy. The W3 half was then frozen one contract per causal family: crates/smart/eliot-cognitive-quality carries SkillLifecycleView, ToolSurfaceAssessment, DreamerJobEconomics, EliotSelfQualityView, LearningBottleneckDiagnosis and SelfQualityInterventionReceipt in both locations, byte-agreeing on id, owner_crate, fields, denominator, denominator_rule, complete_rule, fence, omission_semantics and invariants. The remaining undecided point is which of the two locations is the single source of truth for the field text, and therefore which one a later edit must touch. This issue does not decide it: it is the integration owner's call, and no W9 field, denominator, dimension, action candidate, proof ceiling or mutation authority depends on the choice. Related but separate: crates/smart/cognitive-wave-09.toml carried the superseded pre-sharding pair key, and that divergence has since been repaired at the source under CC-W2-NORMATIVE-PAIR-KEY by re-pinning pair_key to the accepted docs/normative-pair.toml value and marking the superseded value as retained migration evidence."
