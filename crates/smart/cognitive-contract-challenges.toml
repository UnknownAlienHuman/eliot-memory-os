rule = "A cognitive agent must stop at a missing owner-neutral provider contract. It may define only its own output protocol and must not invent another plane's authority, denominator, state or runtime behavior."

[[challenge]]
id = "CC-001"
status = "OPEN_BLOCKING_ACCESSIBILITY"
required_owner = "Governor/Meta evaluation contract owner"
needed_by = ["eliot-dreamer-accessibility", "future use attribution/usefulness evaluation"]
missing_contract = "Canonical attributed inclusion/influence/use/outcome/cost/regret evidence with complete denominator, fence, scope and no-use semantics."
forbidden_workaround = "writer utility score, retrieval count, recency or model judgment treated as usefulness proof"
resolution_evidence = ["versioned owner-neutral contract", "producer fixtures", "complete-denominator and attribution tests", "Governor/Meta ownership acceptance"]

