schema_version = 1
status = "OPEN_EXTERNAL_CONTRACT_CHALLENGES"
authority = "crates/smart/cognitive-rev11-authority.toml"
rule = "A Smart or Meta agent must not invent an owner-neutral contract that belongs to Governor, Kernel, Researcher, Security, Task Controller, Evaluator or Agent Coordinator. Block the live edge and implement against fixtures until the owner publishes it."

[[challenge]]
id = "CC-001"
required_by = ["smart.dreamer.implementation_brief"]
owner = "current-system evidence/conformance owner"
missing = "CurrentSystemEvidenceSnapshot with exact Product Identity, proof ceiling, coverage and State Fence"
fallback = "target-only Implementation brief with current support Unknown"

[[challenge]]
id = "CC-002"
required_by = ["smart.dreamer.architecture_brief", "smart.dreamer.implementation_brief"]
owner = "Architecture authority projection owner"
missing = "runtime-accessible accepted normative document projection preserving exact path, digest, revision, edition and pair key"
fallback = "fixture-only package proof; live self-query remains blocked"

[[challenge]]
id = "CC-003"
required_by = ["smart.dreamer.accessibility"]
owner = "usage/outcome attribution owner"
missing = "Frozen opportunity/use/outcome/false-activation denominator with exact record and attempt lineage"
fallback = "Inconclusive; no accessibility demotion proposal"

[[challenge]]
id = "CC-004"
required_by = ["smart.dreamer.influence_repair"]
owner = "Security influence owner"
missing = "Owner-neutral InfluenceDependencyClosure with completeness, indirect paths, State Fence and revision"
fallback = "warning or revalidation proposal only; no revoke-influence proposal"

[[challenge]]
id = "CC-005"
required_by = ["smart.dreamer.curation"]
owner = "Governor/module registry owner"
missing = "Open typed CurationHandlerRegistrySnapshot with handler identity, subtype, schema, generation and State Fence"
fallback = "fixture-only dispatch proof; live unknown subtype remains Unsupported"

[[challenge]]
id = "CC-006"
required_by = ["meta.learning.activation_assessment"]
owner = "Harness activation/delivery owner"
missing = "HarnessActivationReceipt proving exact candidate, target, revision, delivery boundary and observed activation ceiling"
fallback = "activation Inconclusive; acknowledgement is insufficient"

[[challenge]]
id = "CC-007"
required_by = ["smart.learning.state_view"]
owner = "Task Controller and AgentAttempt owners"
missing = "Complete owner-neutral campaign/attempt lineage projection with task revision and attempt boundaries"
fallback = "PARTIAL or BLOCKED CampaignLearningStateView"

[[challenge]]
id = "CC-008"
required_by = ["meta.learning.closure", "meta.learning.promotion_input"]
owner = "Evaluator and Product Pulse evidence owners"
missing = "Outcome attribution, evaluator-validity, retention, transfer and Product Pulse projections over exact Product Identity"
fallback = "NO_REUSABLE_DELTA or insufficient promotion input"

[[challenge]]
id = "CC-009"
required_by = ["smart.dreamer.maintenance_plan", "smart.dreamer.cycle_plan"]
owner = "Governor maintenance owner"
missing = "MaintenanceModeProjection, maintenance family registry and trigger snapshot from the single MaintenanceTriggerEvaluator"
fallback = "no maintenance plan"

[[challenge]]
id = "CC-010"
required_by = ["smart.dreamer.orchestration_plan"]
owner = "Task Controller, Governor and Agent Coordinator"
missing = "Owner-neutral capability, admission and execution-boundary projections without exposing mutable Ready Queue or SwarmExecutionState"
fallback = "advisory NoEligibleRoute or HumanReviewRequired"

[[challenge]]
id = "CC-011"
required_by = ["smart.context.reactive_delivery_plan"]
owner = "host integration and session delivery owner"
missing = "HostContextCapabilitySnapshot and delivery-boundary contract distinguishing event-integrated, tool-only and attention-only hosts"
fallback = "AttentionOnly plan; no prevention claim"

[[challenge]]
id = "CC-012"
required_by = ["smart.cue.normalizer"]
owner = "WorkScope/resource identity owner"
missing = "Comparison profile projection for case sensitivity, path separators, repository spelling and error-signature rules"
fallback = "UnsupportedProfile; never global lowercasing"

[closure_rule]
requirements = ["owner publishes contract", "exact schema and proof ceiling reviewed", "fixture proof updated", "real provider/consumer Edge Proof passes"]
