schema_version = 1
registry_id = "cognitive-contract-challenges-2026-08-28"
status = "ACTIVE"
wave = "cognitive-micromodules-wave-01"
rule = "A cognitive agent must stop at a missing owner-neutral provider contract. It may define only its own output protocol and must not invent another plane's authority, denominator, state or runtime behavior."

[[challenge]]
id = "CC-001"
status = "OPEN_BLOCKING_ACCESSIBILITY"
required_owner = "Governor/Meta evaluation contract owner"
needed_by = ["eliot-dreamer-accessibility", "future use attribution/usefulness evaluation"]
missing_contract = "Canonical attributed inclusion/influence/use/outcome/cost/regret evidence with complete denominator, fence, scope and no-use semantics."
forbidden_workaround = "writer utility score, retrieval count, recency or model judgment treated as usefulness proof"
resolution_evidence = ["versioned owner-neutral contract", "producer fixtures", "complete-denominator and attribution tests", "Governor/Meta ownership acceptance"]
candidate_contracts = [
  "crates/foundation/eliot-evaluation-contracts/attributed-memory-use.contract.toml",
  "crates/foundation/eliot-evaluation-contracts/memory-outcome-economics.contract.toml",
]
candidate_assessment_cell = "crates/meta/eliot-memory-attribution-assessment/module.toml"
consumer_gate = "crates/smart/eliot-dreamer-accessibility/module.toml"
accessibility_assignable = false
remaining_resolution_evidence = [
  "Rust contract implementation and package proof",
  "real producer denominator/outcome/cost fixtures",
  "Meta assessment package and provider/consumer Edge proof",
  "Governor/Meta ownership acceptance",
  "D3A curation Product Pulse before promotion",
]

[[challenge]]
id = "CC-002"
status = "OPEN_INTEGRATION_GATE"
required_owner = "Codex-owned runtime composition"
needed_by = ["Orientation Product Pulse", "all Dreamer handlers"]
missing_contract = "Typed model-route adapter boundary from DreamInputBundle to schema-valid ModelDraft, including timeout/cancellation/privacy/cost receipt and no semantic authority."
forbidden_workaround = "provider SDK or route reservation inside Smart crates"
resolution_evidence = ["adapter contract fixture", "malformed/partial/timeout model-output fixtures", "cost/privacy receipt", "Product Pulse wiring proof"]

[[challenge]]
