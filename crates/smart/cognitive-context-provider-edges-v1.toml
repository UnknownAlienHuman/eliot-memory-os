schema_version = 1
authority = "eliot-cognitive-context-provider-cells-v1"
status = "STATIC_EDGE_DESIGN_ONLY"
issue = 152
branch = "work/152-context-provider-projections"
base_main_commit = "e7c0cdbfd9b2a95305b63e63e3a69aa6242f846a"
provider_class_count = 6
typed_edge_count = 10
new_crates = 4
existing_crates_extended = 3

[[provider_class]]
class = "TaskContinuity"
semantic_owner = "Governor Task Controller/read-model owner"
implementation_location = "outside issue 152"
requirement_default = "Mandatory"
roles = [
  "Goal",
  "Acceptance",
  "Continuity",
  "NextBoundary",
]
smart_implementation = false

[[provider_class]]
class = "CriticalAttention"
semantic_owner = "Governor Problem/Critical Attention owner"
implementation_location = "outside issue 152"
requirement_default = "Conditional"
roles = [
  "Attention",
  "Invariant",
  "NegativeMemory",
  "Unknown",
]
smart_implementation = false

[[provider_class]]
class = "EpistemicPosition"
semantic_owner = "eliot-epistemic"
implementation_location = "crates/smart/eliot-epistemic/src/context_projection.rs"
requirement_default = "Conditional"
roles = [
  "EpistemicPosition",
  "SemanticModel",
  "CausalModel",
  "Evidence",
  "Unknown",
]
smart_implementation = true

[[provider_class]]
class = "MemoryRecall"
semantic_owner = "Governor canonical memory read owner plus stateless eliot-memory-projection"
implementation_location = "crates/smart/eliot-memory-projection/src/context_projection.rs"
requirement_default = "Conditional"
