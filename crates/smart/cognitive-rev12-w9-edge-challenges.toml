schema_version = 1
authority = "eliot-cognitive-function-design-rev12"
status = "W9_EXTERNAL_EDGE_CHALLENGES"
field_contract_index = "crates/smart/cognitive-rev12-w9-field-contracts.toml"
rule = "Pure functions may be implemented and proven on exact fixtures. Live integration is blocked until the named external owner exposes an owner-neutral typed projection/receipt and the real provider-consumer Edge Proof passes."

[[challenge]]
id = "W9E01_MEMORY_ECOLOGY_EVIDENCE"
cells = ["meta.memory.ecology_assessment"]
consumer = "eliot-memory-quality"
required_owners = ["Governor memory lifecycle owner", "Context delivery/use observation owner", "Evaluator/Product outcome owner"]
required_projection = "Immutable per-record/cluster ecology evidence with exact stage receipts, outcome horizon, denominator, scope and State Fence."
forbidden_substitute = ["retrieval count", "model opinion", "transcript prose", "writer-supplied utility", "missing-event-as-nonuse"]
fixture_implementation_allowed = true
live_edge_status = "BLOCKED"

