providers = ["A-03 self-query contract owner (input and projection supply only)"]
consumers = ["eliot-dreamer-architecture-brief", "eliot-dreamer-implementation-brief"]
non_goals = ["second ContextCompiler invocation", "second admission pass", "mutable UnderstandingState", "ArchitectureBrief/ImplementationBrief authorship", "parallel request/candidate types", "model route calls", "support/truth promotion", "opaque bundle-handle verification"]
invariants = ["no local request types: the owner input and projection are the only surfaces", "owner validate() runs before any digest freezes", "every cited triple matches a projected ref exactly or the pose fails closed", "opaque bundle handles are never treated as typed citations", "no compilation, admission, briefing, or model work"]
failure_behavior = "Return the owner's own rejection for invalid input, stale/uncited sources, or projection-fence drift; reject malformed receipt digests explicitly. Pose acceptance with an owner-valid fixture executes at package proof."
proof_surface = ["owner rejection passthrough", "citation currency and staleness", "receipt digest shape", "wire roundtrip"]
