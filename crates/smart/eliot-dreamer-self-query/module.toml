causal_property = "bounded Dreamer self-query pose with source citation"
old_failure_or_missing_capability = "Self-queries recompile context, rerun admission, invent a parallel request type, or cite sources without a currency check instead of using the existing SelfQueryInput and accepted-source owner contracts (CC-006)."
