schema_version = 1
contract_id = "smart.dreamer.self-query.v1"
authority = "eliot-cognitive-function-design-rev12"
owner = "eliot-dreamer-self-query"
status = "FIELD_LEVEL_FROZEN"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
functional_cells = ["smart.dreamer.architecture_brief", "smart.dreamer.implementation_brief", "smart.self_model.context_projection"]
architecture_refs = ["ARCH-INTENT-01", "ARCH-SELF-01", "ARCH-UND-01", "ARCH-EPI-04", "ARCH-PORT-01", "ARCH-MOD-03"]
implementation_refs = ["I0.3", "I0.4", "I0.5", "I0.13", "I0.14", "I12.23"]
normative_pair_key = "sha256:105558fc8957e150fab407b4fc5818ec49dc784f23f246f42dc9d3ca5843196b"
primary_property = "Project exact accepted Architecture and Implementation sources plus explicit current-system evidence into bounded briefs without mixing revisions, inventing coverage, or self-certifying implementation support."
public_api_policy = "allowlist_only"
async_policy = "synchronous_pure"
unsafe_policy = "forbid"
panic_policy = "no_panic_for_admitted_input"
owned_mutable_state = []
allowed_effects = []
complexity = "O((sections + evidence bindings + omissions) log n + rendered bytes) over bounded immutable inputs; no repository scan, document acquisition, model call, support promotion or Architecture mutation."
replacement_boundary = "Replace self-query projection algorithms behind this contract; normative-pair acceptance, current-system evidence acquisition, conformance status and Architecture ownership remain external."

[closed_sets]
document_roles = ["Architecture", "Implementation"]
document_acceptance_states = ["Accepted", "Candidate", "Superseded", "Invalidated"]
coverage_states = ["Complete", "Partial", "Unavailable", "Blocked", "Stale"]
implementation_brief_states = ["TargetOnly", "CurrentEvidenceBound", "Partial", "Blocked", "Unknown", "Stale", "NotApplicable"]

[hard_invariants]
only_the_exact_accepted_normative_pair_is_authoritative = true
architecture_semantic_precedence_is_explicit = true
branch_copy_summary_audit_or_model_memory_is_not_normative_authority = true
brief_cannot_modify_or_accept_architecture_or_implementation = true
implementation_target_is_not_current_support = true
current_support_requires_exact_external_evidence_binding = true
missing_or_stale_evidence_yields_unknown_or_target_only = true
complete_requires_exact_recheckable_denominator = true
brief_contains_no_self_certification_product_acceptance_authority_or_finish_state = true
self_model_projection_consumes_briefs_but_cannot_raise_their_ceiling = true
canonical_order_and_digest_are_deterministic = true

[[external_type]]
name = "ArtifactId"
owner = "eliot-contracts"

[[external_type]]
name = "RequestId"
owner = "eliot-contracts"

[[external_type]]
name = "StateFence"
owner = "eliot-contracts"

[[external_type]]
name = "CurrentSystemEvidenceSnapshot"
owner = "eliot-bootstrap"

[[public_type]]
name = "NormativeDocumentRole"
kind = "enum"
definition = ["Architecture", "Implementation"]

[[public_type]]
name = "NormativeDocumentAcceptanceState"
kind = "enum"
definition = ["Accepted", "Candidate", "Superseded", "Invalidated"]

[[public_type]]
name = "AcceptedNormativeSection"
kind = "struct"
definition = ["section_id: String", "heading_path: String", "section_sha256: String", "exact_source_handle: ArtifactId", "architecture_anchor_ids: Vec<String>", "implementation_anchor_ids: Vec<String>", "rendered_bytes: u32"]
invariants = ["section/heading/digest exact", "exact source handle required", "anchor ids unique", "rendered bytes non-zero"]

[[public_type]]
name = "AcceptedNormativeDocument"
kind = "struct"
definition = ["document_id: ArtifactId", "role: NormativeDocumentRole", "accepted_path: String", "semantic_version: String", "edition: String", "sha256: String", "paired_document_sha256: String", "normative_pair_key: String", "acceptance_state: NormativeDocumentAcceptanceState", "section_index_revision: String", "sections: Vec<AcceptedNormativeSection>", "document_identity_receipt_handle: ArtifactId"]
invariants = ["path/version/edition/digests/pair exact", "acceptance state must be Accepted for current brief", "section ids/digests unique", "candidate/superseded/invalidated document cannot substitute", "document grants no implementation support"]

[[public_type]]
name = "SelfQueryCoverageState"
kind = "enum"
definition = ["Complete", "Partial", "Unavailable", "Blocked", "Stale"]

[[public_type]]
name = "SelfQueryCoverageDenominator"
kind = "struct"
definition = ["document_sha256: String", "section_index_revision: String", "method_ref: String", "expected_sections: Option<u32>", "expected_section_ids: Vec<String>"]
invariants = ["document/index/method non-blank", "Complete requires exact expected count", "section ids unique", "denominator independently recheckable"]

[[public_type]]
name = "SelfQueryCoverage"
kind = "struct"
definition = ["state: SelfQueryCoverageState", "denominator: Option<SelfQueryCoverageDenominator>", "observed_sections: u32", "missing_section_or_reason_refs: Vec<String>"]
invariants = ["Complete requires exact count and no missing refs", "Partial requires denominator and named gaps", "Unavailable or Blocked has zero observed sections and names reason", "Stale cannot support current brief"]

[[public_type]]
name = "ArchitectureBriefRequest"
kind = "struct"
definition = ["request_id: RequestId", "normative_pair_key: String", "architecture_sha256: String", "requested_section_ids: Vec<String>", "decision_scope: String", "required_architecture_anchor_ids: Vec<String>", "maximum_sections: u32", "maximum_rendered_bytes: u32", "request_sha256: String"]
invariants = ["pair/document identity exact", "section/anchor ids unique", "bounds non-zero", "request grants no source acquisition or Architecture authority"]

[[public_type]]
name = "ArchitectureBriefSection"
kind = "struct"
definition = ["section_id: String", "section_sha256: String", "exact_source_handle: ArtifactId", "architecture_anchor_ids: Vec<String>", "bounded_exact_excerpt: Option<String>", "expansion_handle: ArtifactId", "omission_reason: Option<String>"]
invariants = ["source identity exact", "excerpt preserves exact wording", "omission remains expandable", "anchor ids unique"]

[[public_type]]
name = "ArchitectureBrief"
kind = "struct"
definition = ["brief_id: ArtifactId", "request_sha256: String", "normative_pair_key: String", "architecture_sha256: String", "semantic_version: String", "edition: String", "decision_scope: String", "coverage: SelfQueryCoverage", "sections: Vec<ArchitectureBriefSection>", "hard_boundary_anchor_ids: Vec<String>", "omitted_section_ids: Vec<String>", "architecture_precedence_statement: String", "brief_sha256: String"]
invariants = ["exact accepted Architecture only", "Complete coverage exact", "hard boundaries and omissions visible", "contains no current implementation support or Architecture change", "canonical order and digest"]

[[public_type]]
name = "ImplementationBriefState"
kind = "enum"
definition = ["TargetOnly", "CurrentEvidenceBound", "Partial", "Blocked", "Unknown", "Stale", "NotApplicable"]

[[public_type]]
name = "ImplementationBriefRequest"
kind = "struct"
definition = ["request_id: RequestId", "normative_pair_key: String", "architecture_sha256: String", "implementation_sha256: String", "requested_section_ids: Vec<String>", "decision_scope: String", "current_system_evidence_snapshot_ref: ArtifactId", "current_system_evidence_snapshot_sha256: String", "state_fence: StateFence", "maximum_sections: u32", "maximum_evidence_bindings: u32", "maximum_rendered_bytes: u32", "request_sha256: String"]
invariants = ["pair/documents/evidence snapshot/fence exact", "section ids unique", "bounds non-zero", "request grants no support promotion or repository/runtime probe"]

[[public_type]]
name = "ImplementationTargetSection"
kind = "struct"
definition = ["section_id: String", "section_sha256: String", "exact_source_handle: ArtifactId", "architecture_anchor_ids: Vec<String>", "implementation_anchor_ids: Vec<String>", "target_contract_handles: Vec<ArtifactId>", "bounded_exact_excerpt: Option<String>", "expansion_handle: ArtifactId"]
invariants = ["source/anchors/contracts exact", "target text cannot be represented as current support", "excerpt exact and expandable"]

[[public_type]]
name = "ImplementationEvidenceBinding"
kind = "struct"
definition = ["binding_id: ArtifactId", "implementation_section_id: String", "target_contract_ref: String", "support_claim_ref: ArtifactId", "current_system_evidence_snapshot_ref: ArtifactId", "state_fence: StateFence", "brief_state: ImplementationBriefState", "source_handles: Vec<ArtifactId>", "evidence_handles: Vec<ArtifactId>", "proof_ceiling: String", "blind_or_unobserved_boundaries: Vec<String>", "invalidation_conditions: Vec<String>"]
invariants = ["target/support/evidence identity exact", "CurrentEvidenceBound requires evidence and no blind boundary for the claimed property", "TargetOnly/Unknown/Stale cannot be rendered as current verified", "proof ceiling and invalidation explicit", "binding cannot change external support state"]

[[public_type]]
name = "ImplementationBrief"
kind = "struct"
definition = ["brief_id: ArtifactId", "request_sha256: String", "normative_pair_key: String", "architecture_sha256: String", "implementation_sha256: String", "semantic_version: String", "edition: String", "decision_scope: String", "state_fence: StateFence", "target_coverage: SelfQueryCoverage", "target_sections: Vec<ImplementationTargetSection>", "evidence_bindings: Vec<ImplementationEvidenceBinding>", "current_gaps_and_unknowns: Vec<String>", "omitted_section_ids: Vec<String>", "architecture_precedence_statement: String", "proof_ceiling: String", "brief_sha256: String"]
invariants = ["target and current evidence remain separate", "stale/missing evidence produces Unknown or TargetOnly", "Architecture precedence explicit", "no Product/Release acceptance or self-certification", "canonical order and digest"]

[[public_function]]
name = "validate_accepted_normative_document"
signature = "pub fn validate_accepted_normative_document(document: &AcceptedNormativeDocument) -> Result<(), SelfQueryContractError>"

[[public_function]]
name = "validate_architecture_brief_request"
signature = "pub fn validate_architecture_brief_request(request: &ArchitectureBriefRequest) -> Result<(), SelfQueryContractError>"

[[public_function]]
name = "validate_architecture_brief"
signature = "pub fn validate_architecture_brief(request: &ArchitectureBriefRequest, brief: &ArchitectureBrief) -> Result<(), SelfQueryContractError>"

[[public_function]]
name = "validate_implementation_brief_request"
signature = "pub fn validate_implementation_brief_request(request: &ImplementationBriefRequest, evidence: &CurrentSystemEvidenceSnapshot) -> Result<(), SelfQueryContractError>"

[[public_function]]
name = "validate_implementation_brief"
signature = "pub fn validate_implementation_brief(request: &ImplementationBriefRequest, brief: &ImplementationBrief) -> Result<(), SelfQueryContractError>"

[[negative_test]]
id = "wrong-digest-rejected"
property = "A branch copy, predecessor document or mismatched normative-pair digest cannot produce a current brief."

[[negative_test]]
id = "target-is-not-support"
property = "Implementation target text without exact evidence binding remains TargetOnly or Unknown."

[[negative_test]]
id = "stale-evidence-not-current"
property = "Stale CurrentSystemEvidenceSnapshot cannot support CurrentEvidenceBound output."

[[negative_test]]
id = "prose-only-support-rejected"
property = "Audit prose, code shape, build success or model self-report without exact support/evidence handles cannot establish current support."

[[negative_test]]
id = "architecture-precedence-preserved"
property = "ImplementationBrief cannot override Architecture semantics or hide the precedence statement."

[[negative_test]]
id = "brief-not-acceptance"
property = "Neither brief contains Architecture acceptance, support promotion, Product acceptance, authority or finish fields."
