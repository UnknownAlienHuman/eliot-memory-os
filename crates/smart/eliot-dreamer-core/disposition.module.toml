[[blocked_items]]
item = "NegativeMemoryEntry / AdviceGate negative-memory behaviour — OWNER CORRECTED, DELETION STILL BLOCKED"
measured_at = "a2ecf618c (origin/main), 2026-09-30, branch refactor/1143-duplicate-owners-CB2."
correction = "The prior row above is factually wrong on one load-bearing point and is corrected here rather than restated. It says the canonical negative-memory shape is FailureFingerprint in docs/architecture/I12-19-negative-memory.md and is 'owned by neither this package nor any cell named in the donor map'. Measurement contradicts the second half: there IS an ADMITTED current cell that owns the durable negative-memory record, its reopen condition, its discriminating check and its action-policy value. `git grep -n 'pub struct NegativeMemoryFingerprint' -- crates` returns exactly one declaration, crates/smart/eliot-dreamer-failure/src/negative_memory.rs:1142, and that crate's module.toml:2-4 declares `module_id = \"smart.dreamer.failure\"`, `status = \"ADMITTED\"`. Its primary_responsibility at :21 is 'Propose one exact negative-memory fingerprint with failed action, outcome, invariant, reopen and extinction conditions', its depends_on is only eliot-dreamer-contracts + eliot-receipts, and it declares `owned_mutable_state = []`."
what_the_admitted_owner_carries = "`NegativeMemoryFingerprint` (one current durable record shape, every field required on the wire with no serde default, so a legacy or partial value cannot decode into a current one); `NegativeMemoryReopenCondition` (:936) with `required_verifier` and `required_evidence_refs`, whose `validate()` at :961 recomputes `digest_hex(condition.as_bytes())` against the recorded `condition_digest`; `NegativeMemoryDiscriminatingCheck` (:1011) with `required_verifier`, `discriminates_dimension_names` and `NegativeMemoryCheckExecution`; `NegativeMemoryActionPolicy` (:1383) with `NegativeMemoryDisposition` Advisory/Block/RequireCheck; and `migrate_legacy_fingerprint` (:1707), the explicit legacy migration that keeps a migrated record advisory and structurally incapable of carrying an exact predicate or an any-scope rule. The record carries NO disposition field at all, so neither a record existing nor its digest matching can ever be read as a block decision — the ceiling this aggregate's `AdviceGate` also asserts, by an independent and stronger construction."
why_the_block_still_holds = "Naming the semantic owner does not make this aggregate's `AdviceGate` removable, for a reason that is about the DIVERGENCE, not about the missing owner. The admitted owner records a failed action against a TYPED `FailureAction` inside an exact `NegativeMemoryTrigger` predicate, confined to an owner-issued `NegativeMemoryAffectedScope` (task, scope, environment and a non-empty resource set). `AdviceGate::record_failure` keys on a free-text hypothesis key, `<class>:<whitespace-folded lowercased statement>`, with no failed action, no trigger predicate, no affected scope and no resource set. Migrating that key into the admitted record shape is not a re-point; it would require inventing a `FailureAction` and a trigger predicate out of model-authored prose, which is exactly the 'a second negative-memory state owner' that [[rejected_overgeneralization]].additions_from_this_ledger[4] rejects and exactly the 'LegacyPayloadNotAdmissible' refusal the admitted owner itself raises. So the row stays `delete` with an owner precondition, but the precondition is now NAMED (`smart.dreamer.failure`) and CONCRETE (a typed proposal/result adapter that carries an exact trigger predicate and affected scope, not a folded string) instead of 'none admitted'."
effect_on_this_ledger = "The `AdviceGate` / `NegativeMemoryEntry` / `AdviceClass` / `AdviceState` / `AdviceCandidate` / `OwnerDecision` / `AdviceProposal` / `AdviceRejected` rows keep `current_owner = \"none admitted\"` ONLY where they own the advice change-control LIFECYCLE (propose -> owner decision -> verifier -> retain/rollback) and the executable `AdviceGate::direct_apply` prohibition; their negative-memory PAYLOAD rows are now dispositioned against `smart.dreamer.failure` in [[work_item_4_negative_memory_owner_reevaluation]]. No code was deleted: work item 4's clause 3 (removal must not drop a proof) is unsatisfied while the package's only live acceptance fixture, `mod advice_gate_1924`, asserts the whole loop, and the lane may not author a replacement test in another crate."
