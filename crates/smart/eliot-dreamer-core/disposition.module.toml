dependency_security_license_and_build_isolation = "No new dependency and no optional edge. Removing the package removes one workspace member, one `Cargo.lock` entry and fourteen serde-boundary rows."
expected_agent_workset_context_and_reverse_fanout_delta = "Removing the package removes ~1183 source lines from the Dreamer workset. Reverse fan-out is currently zero, so the measured delta is workset size, not fan-in."
expected_compile_test_integration_and_release_cost_delta = "Removes one workspace member, one `Cargo.lock` entry and one build target. No integration or release cost is added."
migration_reexport_rollback_removal_and_expiry = "Six rows are already migrated (three canonical re-exports plus three one-to-one delegations); the thirty-four `delete` rows require no migration because nothing consumes them. Expiry is the removal of the last `metadata_references_to_close_before_any_delete` entry."
