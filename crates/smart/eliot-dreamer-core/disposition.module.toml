# Issue #1143 work item 3 — one disposition per public item of
# `eliot-dreamer-core`.
#
# Companion record for the `SPLIT_AND_RETAIN_AS_TEMPORARY_FACADE` donor row in
# `crates/smart/cognitive-donor-map.toml` (same `disposition` vocabulary, same
# `rejected_overgeneralization` field). It is the item-level ledger the donor
# map does not have room for.
#
# This file is deliberately NOT named `module.toml`. A bare `module.toml` is
# read by `scripts/code_navigation_lib/capsules.py` (`MODULE_MANIFEST`) as the
# declaration of a `FunctionalCapabilityCell` via its `module_id`. A retiring
# legacy facade must not mint a cell id, so the record uses the
# `<name>.module.toml` form already used by
# `crates/governor/eliot-observation/classifier.module.toml` and
# `crates/meta/eliot-improvement/{learning-closure,promotion}.module.toml`.
#
# Nothing here deletes code. The issue's deletion step is a separate pass.

