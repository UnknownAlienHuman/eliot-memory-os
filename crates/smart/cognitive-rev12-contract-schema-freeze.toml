[[version_rule]]
id = "VR-LEARNING-BINDING-VERSION"
rule = "Every durable candidate in the learning family validates its schema_version by exact equality against the PUBLIC constant LEARNING_SCHEMA_VERSION 1 declared at crates/smart/eliot-learning-contracts/src/identity.rs::LEARNING_SCHEMA_VERSION, and carries its policy_revision as a separate fact governing how the record is read. The two checks are conjunctive: passing the version while carrying a different policy revision, or passing both while raising proof_ceiling above what the family claims, is still a refusal. Equality only, no range, no negotiation and no partial acceptance. Note the declared width is u16, which differs from the dreamer self-query family's u32, so the two families' schema_version fields are not interchangeable and a reader must not assume one shape for both. Admitted in r12."
applies_to = ["eliot-learning-contracts"]

# ===========================================================================
# r12 FIELD CONTRACT RULE AMENDMENT. The existing [field_contract_rule] table
# is kept and only its admitted_in_revision and applies_to are extended, so a
# reader of the r9/r10/r11 shape is not forced to relearn it. No new column is
# introduced: the four r12 families join under the SAME row shape and the SAME
# rules.
# ===========================================================================

[ field_contract_rule_r12_amendment ]
admitted_in_revision = 12
note = "The governing [field_contract_rule] table above is UNCHANGED by r12 except for two extended fields, restated here so this candidate's amendment is legible without editing the earlier table. r12 introduces NO new column and NO new vocabulary value."
extends_applies_to_with = ["eliot-observation", "eliot-dreamer-contracts", "eliot-context-contracts", "eliot-learning-contracts"]
row_shape_unchanged = "type_id, crate, type_rust_path, wire_naming, validator, error_family, provenance_privacy, invalidation_rule, disposition -- the same nine keys every r9, r10 and r11 type row carries"
field_row_shape_unchanged = "field_id, type_rust_path, wire_name, owner_rust_type, requiredness, none_meaning, bound_or_variants, identity_binding, validator, validation_error -- the same ten keys"
new_vocabulary_value_introduced = "NONE. The two disposition values remain FROZEN_EXACT and REFERENCED_NOT_FROZEN, and the four requiredness values remain REQUIRED, OPTIONAL_NONE_<meaning>, EMPTY_SET_ALLOWED and NOT_APPLICABLE. r12 used only existing values."
new_optional_type_level_key_introduced = "YES, and it is named here rather than smuggled in: reference_gap on REFERENCED_NOT_FROZEN rows, carried over unchanged from the r9 cue rows, and recorded_field_list_disagreement on FC-CTX-ACTIVE-VIEW, which points at a [[disagreement]] row instead of restating it. recorded_field_list_disagreement appears on exactly ONE row in this file and is documentation of a known record-versus-source disagreement; it asserts no contract semantics and is not a frozen attribute."
bundle_rows_at_r12 = "TWENTY-TWO [[field_contract_field]] ROWS sit under three BUNDLE parent rows, not the nineteen under two as the r11 text above states: nineteen under FC-CUE-VOCABULARIES and FC-CUR-VOCABULARIES from r9 and r10, plus one under FC-CTX-SEMANTIC-ROLE, whose single field row names all fourteen measured members of the closed SemanticRole enum. A reader checking parent/child linkage must exempt every field row whose field_id prefix belongs to one of those three bundle rows, because those rows intentionally carry a type_rust_path naming a different type than their parent's -- a member of the family rather than the family's representative type."
validator_column_still_binding = "UNCHANGED AND STILL BINDING: a row without a resolving validator anchor is a gap and is not counted as frozen. At r12 all 106 path.rs::symbol anchors in this file were machine-checked to resolve as real text in the file each names, and the check earned its keep: it caught two malformed validator paths introduced while authoring these rows, which were corrected before this candidate was published."
