[[assignment_binding]]
id = "AB-MEM-SELECTION"
order = 44
crate = "eliot-memory-projection-contracts"
consumer_crate = "a future selection consumer; NO in-tree caller exists today"
functional_cell = "foundation.memory.projection-contracts"
input_rust_path = "eliot_memory_projection_contracts::MemoryProjectionBatch plus eliot_memory_projection_contracts::MemoryQueryIntent plus eliot_memory_projection_contracts::MemorySelectionPolicy"
output_rust_path = "eliot_memory_projection_contracts::MemorySelectionTrace"
definition_revision = "eliot_contracts::ContractVersion 0.2.0, exact triple equality against CONTRACT_VERSION declared at crates/foundation/eliot-memory-projection-contracts/src/contracts.rs, under VR-SELECTION-CONTRACT-VERSION. Equality only. Note this is a different triple from the epistemic family's 1.2.0 and the observation family's 1.0.0."
first_consumer = "NONE. Measured: `git grep -rln MemorySelectionTrace -- '*.rs'` on this base commit returns exactly two files, both inside the owning crate itself (crates/foundation/eliot-memory-projection-contracts/src/contracts.rs, which re-exports the type, and src/contracts/selection.rs, which defines it). No crate outside eliot-memory-projection-contracts constructs, reads or forwards a selection trace. The producing entry point is selection.rs::select, and it currently has no external caller. This is recorded rather than papered over with a guessed consumer."
owned_files = ["crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs", "crates/foundation/eliot-memory-projection-contracts/src/contracts/error.rs", "crates/foundation/eliot-memory-projection-contracts/src/contracts.rs"]
prerequisite_contract = "FC-SEL-QUERY-INTENT, FC-SEL-POLICY, FC-SEL-TRACE, FC-SEL-ENTRY, FC-SEL-COVERAGE and FC-SEL-DISPOSITION in this file, plus DEN-MEMORY-SELECTION, CR-SEL-DENOMINATOR-EXACT, CR-SEL-NO-SILENT-CUT, CR-SEL-NO-VERDICT and VR-SELECTION-CONTRACT-VERSION. The batch input is already frozen as MemoryProjectionBatch, ProjectionCoverage and DenominatorState in the pre-existing rows."
error_behavior = "Every rejection is a typed variant and never a formatted string that is later collapsed into a code. SelectionError::Upstream wraps a MemoryProjectionError; BindingMismatch is raised when the intent binding differs from the batch binding OR when validate_against finds the trace binding differing from either; LimitOverPolicy when the requested limit exceeds the enforced ceiling; LimitExceeded when more records pass the allowlist than the limit admits, carrying both counts so the caller can narrow rather than guess; EmptyKinds when the allowlist is empty, because narrowing must be explicit; DuplicateKind when the allowlist repeats a kind; BoundViolated when a limit or ceiling is zero or exceeds MEMORY_PROJECTION_MAX_RECORDS 256. Inside the wrapped MemoryProjectionError: VersionMismatch for a wrong triple, InvalidField for a malformed digest or a ceiling that does not match the policy, CoverageMismatch for accounting that contradicts the carried members, Bounds and Duplicate for the bound and uniqueness checks, FenceMismatch and ScopeMismatch for cross-record gating. There is no partial trace and no error carrying a partial trace, so a caller can never be handed a half-built selection."
implementation_steps = "1. Obtain a validated MemoryProjectionBatch from the projection provider; do not construct one here. 2. Build a MemoryQueryIntent through MemoryQueryIntent::new, which sets CONTRACT_VERSION and validates; an empty or duplicated allowlist and an out-of-bound limit fail here rather than at selection time. 3. Build a MemorySelectionPolicy through MemorySelectionPolicy::new with a ceiling at or below MEMORY_PROJECTION_MAX_RECORDS 256. 4. Confirm intent.limit does not exceed policy.max_selected. 5. Call select(&intent, &policy, &batch); the batch is consumed whole, records are emitted in deterministic provider order, and the returned trace is already validated. 6. Before the trace crosses a boundary, call MemorySelectionTrace::validate_against(&intent, &policy, &batch) to re-run binding equality, allowlist and ceiling echoes, intent digest recomputation and the positional entry replay. 7. Reconcile SelectionCoverage against the consumer's own batch.records length. 8. Stop. Forward the UNTOUCHED batch to evaluate_applicability for the verdict: this trace narrows and never decides, and selection entries never enter ApplicableMemorySet."
acceptance_positive = "A selection over a batch whose records are all inside the allowlist and whose passing count is at or below the intent limit yields a trace whose coverage.considered equals the consumer's own batch.records length, whose selected plus not_selected equals considered, whose selected satisfies both selected <= policy_ceiling and selected <= intent.limit, and which survives validate_against against the exact intent, policy and batch it was computed from. An intent digest recomputed by a third party over the canonical intent bytes equals trace.intent_digest."
acceptance_negative = "A trace whose selected exceeds either the echoed policy ceiling or the intent limit is rejected, as LimitOverPolicy or LimitExceeded rather than by silent truncation. A trace whose coverage counts balance but whose entries do not replay against the batch is rejected as CoverageMismatch. An intent digest that does not match the intent is rejected. A ceiling that does not match the policy is rejected. An allowlist that does not match the intent is rejected. A selected entry whose kind is outside the echoed allowlist is rejected. An empty or duplicated allowlist is rejected. A limit of zero, or a ceiling above MEMORY_PROJECTION_MAX_RECORDS 256, is rejected as BoundViolated. A trace built under one binding and validated against a batch sharing the task but differing in scope is rejected as BindingMismatch."
proof_status = "STATIC_FIELD_CONTRACT_ONLY; the acceptance above is NOT_EXECUTED and no test is claimed by this row"
known_gap = "No in-tree caller exists. Wiring the first one is a separate implementation action belonging to whichever consumer crate actually needs narrowing; this row does not choose that consumer, because choosing one would be guessing an owner."

[[assignment_binding]]
id = "AB-FAILURE-OBSERVATION"
order = 79
crate = "eliot-observation-contracts"
consumer_crate = "eliot-dreamer-memory-revision"
functional_cell = "smart.dreamer.memory_revision"
input_rust_path = "eliot_observation_contracts::FailureObservation plus eliot_observation_contracts::MemoryRevisionEvidence"
output_rust_path = "smart.dreamer.memory_revision::NegativeMemoryExtinctionCandidate (the consumer's own output, NOT a frozen input to this family)"
definition_revision = "eliot_contracts::ContractVersion 1.0.0, exact triple equality against CONTRACT_VERSION declared at crates/foundation/eliot-observation-contracts/src/lib.rs, under VR-FAILURE-OBSERVATION-VERSION. In addition, each record carries its own frozen digest which the owner recomputes from every other field on each validate(), so the revision axis for the CONTENT of a record is its digest and the revision axis for WHERE it was read is its SourceRevisionHandle. Those are two distinct axes and neither substitutes for the other."
first_consumer = "crates/smart/eliot-dreamer-memory-revision/src/lib.rs::propose, reached through RevisionIntake which carries observation: &'a FailureObservation and evidence: &'a [MemoryRevisionEvidence]. This consumer is real and is the reason this family exists: propose calls verify_freeze_binding() first, then validate_intake, then classify. Measured present on this base commit."
owned_files = ["crates/foundation/eliot-observation-contracts/src/failure_observation.rs", "crates/foundation/eliot-observation-contracts/src/lib.rs", "crates/foundation/eliot-observation-contracts/src/source_handles.rs"]
prerequisite_contract = "FC-OBS-FAILURE-OBSERVATION, FC-OBS-MEMORY-REVISION-EVIDENCE, FC-OBS-OMISSION and FC-OBS-OMISSION-CLASS in this file, plus DEN-FAILURE-OBSERVATION, CR-OBS-COMPLETE-POSTURE, CR-OBS-UNKNOWN-NOT-COMPLETE, CR-OBS-NO-APPLIED-AUTHORITY and VR-FAILURE-OBSERVATION-VERSION. The nested owners CoverageEvidence, ObservationScope and SourceRevisionHandle are already frozen as pre-existing [[frozen_type]] rows in this same file and are referenced rather than duplicated."
error_behavior = "Every rejection is an ObservationError variant and never a formatted string collapsed into a code across layers. InvalidField carries a static field name and a static reason and is what a blank value, a control character, an over-length value, a wrong contract version, an over-bound ref or omission list, an invalid fence interval or a digest mismatch produces. InvalidInterval is a reversed interval. Duplicate names the offending field and value, and is raised for a repeated journal_ref or evidence_ref handle rather than deduplicating it. CoverageIncomplete is the coverage-accounting failure. Foundation, Receipt and Runtime wrap the shared primitive, receipt and runtime contract errors. Unknown evidence is a VALUE and never an error path: an unreadable source is CoverageDisposition::Unavailable plus a named FailureOmission, an unadmitted source is the UNADMITTED_SOURCE omission class, and neither is silently reported as an empty list. A false same_hypothesis_recurrence or prior_attempts is not detectable by this crate by design, because ruling recurrence out is a reviewer decision; the honest failure is a reviewer reading it wrong, which the frozen digest at least makes visible as an edit."
implementation_steps = "1. Receive the FailureObservation from the Governor journal owner and validate it; do not construct one here, and do not open any cited journal record. 2. Confirm contract_version is 1.0.0 and that the stored digest equals the recomputed digest over every other field. 3. Confirm every journal_ref is non-blank, at most MAX_OBSERVATION_TEXT 1024 characters, within MAX_OBSERVATION_REFS 256 entries and free of duplicates. 4. Confirm journal_revision validates as a SourceRevisionHandle, which checks source_id and revision within 256 characters and content_sha256 as 64 lowercase hex, WITHOUT opening the source bytes. 5. Read coverage_complete(); treat false as an explicit partial read and carry it as such into any downstream decision rather than treating the record as complete. 6. For each MemoryRevisionEvidence, repeat steps 2 to 5 and confirm evidence_revision is the axis that establishes post-dating relative to journal_revision; comparing the two cursors is an owner comparison, not one this crate performs. 7. Carry every FailureOmission forward as a named value rather than collapsing the omissions list. 8. Hand the validated observation and evidence to the consumer. 9. Stop. This crate applies no lifecycle change, retires nothing, reopens nothing, and schedules nothing; a satisfied extinction_condition retires nothing and a true same_hypothesis_recurrence routes to Mechanism Review rather than to another equivalent retry."
acceptance_positive = "An observation carrying a valid digest, a validated SourceRevisionHandle, refs within their bounds with no duplicates, and coverage with disposition Complete and an empty blind_intervals list satisfies coverage_complete() and is accepted as a complete read. An observation paired with evidence whose evidence_revision post-dates the journal_revision, whose same_hypothesis_recurrence is true and whose prior_attempts is non-zero, is accepted and the consumer routes it to Mechanism Review rather than to a retry."
acceptance_negative = "An observation whose stored digest does not match the recomputed digest is rejected as InvalidField. A repeated journal_ref or evidence_ref handle is rejected as Duplicate rather than deduplicated. A 257th ref or a 65th omission is rejected. An observation whose coverage disposition is Complete but whose blind_intervals list is NON-EMPTY does NOT satisfy coverage_complete and is carried as a partial read; that pairing is the specific negative this rule exists for. An over-length condition string, a control character and a malformed content_sha256 are each rejected. An inadmissible omission class cannot be expressed, and an omission whose note is blank is rejected as InvalidField. A record under a contract version other than 1.0.0 is rejected. An observation with no omission recorded for a source the owner reported as unadmitted is a REVIEW finding, not a machine rejection, and is stated here so it is not mistaken for one."
proof_status = "STATIC_FIELD_CONTRACT_ONLY; the acceptance above is NOT_EXECUTED and no test is claimed by this row"
known_gap = "none for this family; the owner crate, the frozen digests, the closed omission classes and a real first consumer all exist. What remains unproven is runtime behaviour: no acceptance above has been executed."

[[assignment_binding]]
id = "AB-PROVIDER-CONTRIBUTION"
order = 6
crate = "eliot-epistemic-contracts"
consumer_crate = "eliot-epistemic-context-provider, and independently eliot-understanding-assessment"
functional_cell = "smart.epistemic.contracts"
input_rust_path = "eliot_epistemic_contracts::CurrentEpistemicPosition (already validated and admitted by its owner)"
output_rust_path = "eliot_epistemic_contracts::ProviderContribution"
definition_revision = "eliot_contracts::ContractVersion 1.2.0, exact triple equality against CONTRACT_VERSION declared at crates/smart/eliot-epistemic-contracts/src/lib.rs, under VR-CONTRIBUTION-CONTRACT-VERSION, CONJUNCTIVE with the view_kind discriminator being AdmittedKind::CurrentEpistemicPosition and currentness being Currentness::Current. Passing the version while failing either of the other two is still a rejection. Note this is a different triple from the projection family's 0.2.0 and the observation family's 1.0.0."
first_consumer = "crates/smart/eliot-epistemic-context-provider/src/context_projection.rs::EpistemicContextContribution::from_contribution, which consumes an owner contribution and adapts it. Measured present on this base commit, and the module declares from_position, from_contribution and validate. A SECOND independent consumer exists and is recorded rather than collapsed: crates/smart/eliot-understanding-assessment/src/lib.rs::EvidenceCite::contribution, which validates a contribution and copies position_digest into the cite digest and source_revision into the cite revision."
owned_files = ["crates/smart/eliot-epistemic-contracts/src/contribution.rs", "crates/smart/eliot-epistemic-contracts/src/admitted.rs", "crates/smart/eliot-epistemic-contracts/src/error.rs", "crates/smart/eliot-epistemic-contracts/src/lib.rs"]
prerequisite_contract = "FC-EPI-PROVIDER-CONTRIBUTION in this file, plus DEN-PROVIDER-CONTRIBUTION, CR-EPI-CURRENT-NOT-STALE, CR-EPI-WHOLE-ENVELOPE and VR-CONTRIBUTION-CONTRACT-VERSION. The nested owners CurrentEpistemicPosition, AdmittedKind and Currentness are already frozen as pre-existing [[frozen_type]] rows in this same file and are referenced rather than duplicated."
error_behavior = "Every rejection is a ContractError variant and never a formatted string collapsed into a code. ImpossibleCombination is what a wrong contract_version, a wrong view_kind, a non-Current currentness or a field combination this contract forbids produces, and it names the field. InvalidDigest is a digest that is not exactly 64 lowercase hex characters. TooLong is a value over MAX_SHORT_TEXT 256 characters, and Blank or ControlCharacter is an empty or control-bearing value. FenceMismatch is a fence whose interval does not validate. The whole envelope is the unit of failure: contribute() returns Result<Self, ContractError> and there is no partial contribution and no error carrying one, so a caller can never be handed a partly-populated handoff. Uncertainty is a value rather than an absence: a superseded position is refused outright by contribute() rather than contributed with a weakened marker, and the epistemic distinctions this envelope does not carry, such as assumed, conflicted, stale or under investigation, remain visible on the CurrentEpistemicPosition and are not flattened by the handoff."
implementation_steps = "1. Receive a CurrentEpistemicPosition that its own owner has already admitted and validated. 2. Confirm currentness is Currentness::Current; a superseded position is refused here and is NOT downgraded to a weaker contribution. 3. Call ProviderContribution::contribute(&position). It runs the position's closed validation, shape plus frozen-digest recompute, then constructs the envelope by ECHOING position_digest, claim, admission.owner, admission.position, admission.position_revision, admission.scope, admission.fence, admission.revision, admission.coverage_digest and position.receipt_identity(). 4. Do not construct a ProviderContribution literal by hand at any point: the fields are echoes and there is no synthetic construction path, so a hand-built envelope is by definition one whose fields were supplied independently of the admission. 5. Call ProviderContribution::validate, which contribution already does; a second call is the consumer's own check. 6. Carry the envelope. Do NOT attach a per-provider identity, request state or consumer framing: this envelope is provider-neutral by construction and the contributing provider IS the admitted position owner, so adding a provider field would create a second attribution that can disagree with owner. 7. At the consumer edge, re-gate liveness and fence compatibility against the governing StateFence under VR-FENCE-GATE; a contribution written while current can be stale by the time it is read. 8. Stop. The envelope is a handoff record: it resolves nothing, acquires nothing, ranks nothing, stores nothing and applies nothing."
acceptance_positive = "ProviderContribution::contribute over a validated Current position with Currentness::Current yields an envelope whose view_kind is CURRENT_EPISTEMIC_POSITION, whose currentness is CURRENT, whose three digest fields are 64 lowercase hex, and whose owner, position, position_revision, scope, fence, source_revision, coverage_digest and receipt_digest each EQUAL the corresponding field of the admission envelope, so a consumer holding the admission record can re-derive the envelope field by field and reach the same bytes. The understanding-assessment consumer accepts that envelope as a citation and reads position_digest as the cite digest."
acceptance_negative = "contribute over a position whose currentness is Superseded is refused with ImpossibleCombination and NO envelope is produced, rather than producing an envelope that declares staleness. A hand-built envelope whose echoes disagree with the admission envelope is rejected by validate on the field that disagrees, for example ImpossibleCombination naming contribution.view_kind for a wrong marker. A position whose own frozen digest does not recompute is refused by contribute() BEFORE any envelope exists, so an envelope over an unvalidated position is not reachable. A digest of the wrong shape, an over-length scope or source_revision, and an invalid fence interval are each rejected with their own variant. A record under a contract version other than 1.2.0 is rejected. Passing the version check while carrying a wrong view_kind is still rejected, which is the specific negative the conjunction exists for."
proof_status = "STATIC_FIELD_CONTRACT_ONLY; the acceptance above is NOT_EXECUTED and no test is claimed by this row"
known_gap = "none for this family; the owner crate, the closed validation and TWO real independent consumers all exist. What remains unproven is runtime behaviour."


