denominator_note = "Protection is assessed independently of the finding that flagged a member. ProtectionDecision is Unprotected/Protected/Unknown and ProtectionEvidenceState separates CurrentVerified, Stale, Missing, Malformed, Unavailable and Unknown, so a missing protection record is Unknown rather than Unprotected, and DisclosureCeiling bounds what may leave the boundary. A Protected member stays protected regardless of any other verdict."

[[frozen_type]]
crate = "eliot-memory-curation-contracts"
