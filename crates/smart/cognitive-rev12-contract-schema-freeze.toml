# r8 exists for exactly one reason, and it is a reconciliation rather than a
# new claim. The r7 `ProjectionCoverage` denominator_note stated a LOWER BOUND
# ("Known{total} must cover projected plus omitted volume") and never mentioned
# the resume frontier, so on its own it was not proof of completeness: an empty
# batch declaring Known{total:1} with no omissions, no frontier,
# truncated=false and revalidation_required=false satisfied it. The Rust owner
# `MemoryProjectionBatch::validate` in
# crates/foundation/eliot-memory-projection-contracts/src/contracts/batch.rs was
# already stricter than the note, because its only producer
# (`eliot-memory-projection-provider::project_batch`) partitions every observed
# record into exactly one of records/omissions/frontier and already required
# `request.denominator_total == observations.len()`. This candidate states the
# rule the owner code actually enforces, so the contract and the code no longer
# disagree. No type, field, enum, denominator id, or cell binding is added,
# removed, or renamed by r8; the only semantic change is the wording of one
# denominator_note. Every verdict bound to the r7 digest is invalidated by this
# revision rather than edited, per the [readback] rule above.
[revision_note]
revision = 8
supersedes = "cognitive-rev12-contract-schema-freeze-2026-09-22-r7"
changed = "one denominator_note: eliot-memory-projection-contracts::ProjectionCoverage"
reason = "r7 stated a lower bound that omitted the resume frontier and was therefore not a completeness proof; the delivered owner code already enforced the exact disjoint three-way accounting this note now states."
unchanged = "all frozen_type field lists, all enums, all denominator ids, all cell bindings, all [[bound]] rows, proof_ceiling, implementation_support, and evidence_execution_status"
issue = "#196"

# r9 is the eliot-cue-contracts field-level contract. It was authored on a branch
# whose merge base predated the r8 above, so it was first written as a candidate
# also numbered r8. On rebase onto current main that numbering collided with the
# already-published r8, and the honest resolution is what this note records: r9
# supersedes the published r8 above, and the r8 that was drafted in parallel is
# retired in favour of it rather than published under a duplicate identity. The
# r8 [revision_note] block above is left in place because it is a true statement
# about a candidate that really was published on main; nothing here edits it.
#
# r9 adds no new Rust owner and invents no type. It states, field by field, what
# crates/smart/eliot-cue-contracts already declares: the exact defining owner,
# the wire spelling the current serde attributes produce, requiredness and the
# meaning of an absent optional, the numeric bound or closed variant set the
# owner crate itself checks, the identity/scope/fence/revision binding, a
# path.rs::symbol validator anchor, a typed error variant, and the
# compatibility/invalidation rule. Every expected set a completeness claim names
# is declared by the owner crate, so this file states no Complete claim of its
# own. The seven cue concerns stay seven distinct types: observed source,
# canonical identity, comparison key, admitted binding, snapshot membership,
# direct match and relation-derived activation.
[revision_note_r9]
revision = 9
supersedes = "cognitive-rev12-contract-schema-freeze-2026-09-22-r8"
changed = "adds the field-level contract for the eliot-cue-contracts family: 19 [[field_contract]] type rows, 103 [[field_contract_field]] field rows and 5 [[completeness_rule]] rows, plus [[field_contract_rule]]"
reason = "The seven cue concerns were frozen at type level only, so a downstream implementation agent received function names rather than field semantics. r9 states the field contract over the types the crate already defines, and names no new owner."
unchanged = "every [[frozen_type]] row, every enum list, every [[denominator]] id, every [[cell_binding]] order, every [[bound]] row, proof_ceiling, implementation_support and evidence_execution_status. The r8 denominator_note correction is preserved verbatim, not re-derived."
retired_parallel_candidate = "A candidate also numbered r8 was drafted on a branch whose merge base predated the published r8. It is superseded by this r9 and is not published under a duplicate revision identity."
issue = "#261"

# r10 is the eliot-memory-curation-contracts field-level contract, plus two
# tables that did not exist before: the disagreement register and the downstream
# assignment bindings. Same row shape, same reading discipline and same
# no-derived-completeness rule as r9 above.
#
# The disagreement register exists because W5 requires a real Rust-versus-I-section
# conflict to be recorded where it is found rather than resolved by editing the
# freeze to match the code. Each [[disagreement]] row names the exact field, both
# references, the measured fact, the proposed repair and the existing owning task.
# None of them edits a frozen type to agree with a wrong manifest, and none of them
# adds a type to satisfy a manifest that names something the crate does not define.
#
# The assignment bindings exist because a downstream agent otherwise receives a
# contract without a caller. Each [[assignment_binding]] row names the concrete
# input and output Rust paths, the exact definition/schema revision, the first
# real consumer found by git grep rather than a guessed one, the owned files, the
# prerequisite field-contract rows, the typed error and unknown behaviour, ordered
# implementation steps, and the later positive and negative acceptance. Every
# first_consumer in these rows is a function that exists on this base commit.
#
# r10 was also drafted as a candidate numbered r9 and is renumbered for the same
# reason r9 was renumbered above. Its content is unchanged by the renumbering.
[revision_note_r10]
revision = 10
supersedes = "cognitive-rev12-contract-schema-freeze-2026-09-22-r9"
changed = "adds the field-level contract for the eliot-memory-curation-contracts family (13 [[field_contract]] type rows, 76 [[field_contract_field]] field rows, 6 [[completeness_rule]] rows, 1 [[denominator]] row, 1 [[version_rule]] row), the [[disagreement]] register and the [[assignment_binding]] rows"
reason = "The curation family was frozen at type level only, and the deliverable had no disagreement register and no caller binding, so an implementation agent could neither detect a real conflict nor know who calls the contract. r10 states the field contract over types the crate already defines, records the conflicts where they are, and binds the two families that already have a first consumer."
unchanged = "every [[frozen_type]] row, every enum list, every [[cell_binding]] order, every [[bound]] row, the r8 and r9 field contracts, proof_ceiling, implementation_support and evidence_execution_status"
retired_parallel_candidate = "A candidate also numbered r9 was drafted on a branch whose merge base predated the published r8. It is superseded by this r10 and is not published under a duplicate revision identity."
issue = "#261"

# ---------------------------------------------------------------------------
# r11 is the W1 reconciliation and W2 field-contract completion of the three
# families the #196 C1 card names as existing but which were frozen at TYPE
# level only, plus the W1 disposition of the three the card names as still
# NOT_FROZEN. It adds no new Rust owner, invents no type, and edits no Rust
# except the single REQUIRED_FREEZE_DIGEST repin that the [readback] rule
# requires for any byte change.
#
# Why the three existing families needed field contracts at all: memory
# selection, failure observation and provider contribution were each closed as
# a challenge with a [[frozen_type]] row naming a list of field NAMES. A
# downstream implementation agent handed that row receives six field names and
# no requiredness, no bound, no None meaning, no validator anchor and no error
# variant, which is the "function-name-only schema presented as frozen" shape
# the acceptance criteria forbid. r11 states all of those per field.
#
# Why the three NOT_FROZEN families got a disposition rather than a type: each
# was measured and none has an owner. The [[family_disposition]] rows above
# give each exactly one disposition, name the measured fact, name the owning
# task, and contribute ZERO to every coverage count. A NOT_FROZEN row that has
# been measured and assigned an owner is still NOT_FROZEN; what changed is that
# it is no longer an unexplained omission.
# ---------------------------------------------------------------------------
[revision_note_r11]
revision = 11
supersedes = "cognitive-rev12-contract-schema-freeze-2026-09-22-r10"
changed = "adds the [[family_disposition]] table for all seven C1 families, the field contract for three previously type-level-only families (11 [[field_contract]] type rows: 6 selection, 4 failure-observation, 1 provider-contribution, together with 70 [[field_contract_field]] field rows), 3 [[denominator]] rows, 8 [[completeness_rule]] rows, 3 [[version_rule]] rows, 3 [[assignment_binding]] rows, and the r11_disposition block on all three [[not_frozen]] rows"
reason = "W1 requires every required type to carry exactly one disposition against current source and unresolved rows to stay visible; W2 requires every load-bearing field to carry an exact owner, wire spelling, requiredness, bound, binding, validator, typed error and compatibility rule. Three families satisfied W1 at type level only, and three rows had no owner and no decision at all."
unchanged = "every pre-existing [[frozen_type]] row and its field list, every [[bound]] row, every [[cell_binding]] order, the r9 cue field contract and the r10 curation field contract verbatim, the r8 and r9 and r10 revision notes, proof_ceiling, implementation_support and evidence_execution_status"
rust_change = "crates/smart/eliot-dreamer-memory-revision/src/lib.rs only, and only the REQUIRED_FREEZE_DIGEST constant, because that is the single constant pair that enforces this freeze byte-for-byte at runtime through verify_freeze_binding called from propose. No other Rust file is touched, and no contract shape is described here that the owner crates do not already declare."
issue = "#261"

# ---------------------------------------------------------------------------
# r11 coverage accounting. Every Complete claim in this file has to carry a
# recheckable member denominator, and unknown or incomplete evidence must not
# become complete by default. This table is the single place where the
# per-family member counts are declared, so a reader can recheck coverage
# without counting rows by hand.
#
# The denominator of each row is stated as a MEASURED COUNT over the owner
# crate's own declarations, and the recheck procedure names the command that
# reproduces it. A count alone is deliberately not treated as proof of coverage:
# each row also states the omission axis and the unknown behaviour, because a
# member count that ignores omissions is not coverage.
#
# Rows whose owner_is_complete is false are NOT counted toward any coverage
# claim anywhere in this file. That is the mechanism by which unknown or
# incomplete evidence cannot become complete by default: the three
# [[not_frozen]] rows and the [[cell_binding]] order-80 blocked_inputs string
# each name the rows they prevent, and each of those rows contributes zero.
# ---------------------------------------------------------------------------
