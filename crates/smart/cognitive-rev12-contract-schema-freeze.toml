rule = "NO CANDIDATE IN THIS FAMILY MAY RAISE ITS OWN CEILING, and the ceiling travels on the binding every durable candidate is bound by. ContractBinding::proof_ceiling carries the owner's own statement that this package never emits a higher ceiling, so the field declares what the family will claim rather than parameterising what a caller may demand. schema_version is an exact equality against the public constant LEARNING_SCHEMA_VERSION 1 with no range and no negotiation, so a record written against another shape is refused rather than reinterpreted. policy_revision sits alongside it as a separate fact governing how the record is READ, which is why a schema match alone does not authorise a policy reinterpretation."
enforced_by = "crates/smart/eliot-learning-contracts/src/identity.rs::ContractBinding::validate"
independent_expected_set = "the owner-declared public constants LEARNING_SCHEMA_VERSION and the family's closed proof-ceiling vocabulary; the record's own values are the thing under test and never their own reference"
