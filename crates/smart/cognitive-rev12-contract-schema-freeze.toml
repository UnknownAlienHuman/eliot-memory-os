denominator_note = "Read-only screen result for a later semantic curation owner. ResultState is Complete, Partial, Blocked or Unknown, and Complete is accepted only when the source denominator is complete, the frontier is empty, the coverage order equals the source member order, and no resume cursor is present; incomplete, truncated or blocked evidence therefore yields Partial, Blocked or Unknown and never Complete by default. The result applies no lifecycle change and grants no authority."

