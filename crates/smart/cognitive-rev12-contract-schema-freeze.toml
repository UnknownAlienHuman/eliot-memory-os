error_family = "crates/smart/eliot-epistemic-contracts/src/error.rs::ContractError"
provenance_privacy = "Owner-neutral and provider-neutral BY CONSTRUCTION: the contributing provider is the admitted position owner itself, so this envelope carries no per-provider identity, no request state and no consumer framing. It names a position by digest and identity and carries no claim body, so it can cross into a Smart provider without widening the position's own privacy posture."
invalidation_rule = "WHOLE ENVELOPE OR ERROR. There are no partial contributions and no omission entries: contribute() runs the position's closed validation first, so a contribution covers exactly its named receipt envelope or it fails. Every envelope field is echoed from the validated admission envelope and the constructor takes only the admitted position, so no field can be supplied independently and there is no synthetic construction path. That is also why there is no omission axis here: missing or invalid governing material is an error, never a gap. Currentness is the OWNER verdict at contribution time; consumers re-gate liveness at their own edge. Version compatibility is VR-EXACT-CONTRACT-VERSION on ContractVersion 1.2.0."

