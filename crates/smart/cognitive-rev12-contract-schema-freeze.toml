# description of the owner; where the description and the owner disagree, the
# issue's W5 clause requires recording both references and proposing a repair,
# not editing the freeze to agree with the code. A drift corrected in the freeze
# alone would make the freeze agree with the code while leaving the two recorded
# decisions -- what the r6 row said, and what the code now says -- unreconciled.
# Both repairs are rust_change_needed = false and manifest-side or freeze-side
# only; see the two rows for which owner takes each.
