# r11 field contract for the eliot-epistemic-contracts provider-contribution family
# (contribution.rs). ProviderContribution was already a [[frozen_type]] row closed as
# CC-PROVIDER-CONTRIBUTION-SCHEMA, but at TYPE level only. r11 states the field contract
# over the SAME type and creates no new owner.
#
# Wire naming here: the struct is #[serde(deny_unknown_fields)] with no rename_all, so every
# wire_name below equals the Rust field name. AdmittedKind and Currentness are unit-variant
# enums with #[serde(rename_all = "SCREAMING_SNAKE_CASE")] and NO deny_unknown_fields, so
# their wire spellings are CURRENT_EPISTEMIC_POSITION, CURRENT and SUPERSEDED, which are NOT
# the Rust member names. ClaimId, PositionId and SourceId are newtype wrappers over String and
# travel as their inner text.
#
# CONTRACT_VERSION for this crate is 1.2.0 (crates/smart/eliot-epistemic-contracts/src/lib.rs:
# 119), which is a DIFFERENT triple from the projection and observation families. That is why
# VR-EXACT-CONTRACT-VERSION exists as equality and not as a range.
# ---------------------------------------------------------------------------

[[field_contract]]
type_id = "FC-EPI-PROVIDER-CONTRIBUTION"
crate = "eliot-epistemic-contracts"
type_rust_path = "eliot_epistemic_contracts::ProviderContribution"
disposition = "FROZEN_EXACT"
wire_naming = "contribution.rs declares the struct #[serde(deny_unknown_fields)] with no rename_all, so every wire_name below equals the Rust field name. position_digest, coverage_digest and receipt_digest are bare 64-character lowercase hex strings. view_kind is the internally-tagged marker CURRENT_EPISTEMIC_POSITION and currentness is the SCREAMING_SNAKE_CASE unit member CURRENT."
