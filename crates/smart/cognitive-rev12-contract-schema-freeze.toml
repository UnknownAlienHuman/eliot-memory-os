# --- completeness accounting ----------------------------------------------
[[completeness_rule]]
id = "CR-CUE-DIRECT-INDEPENDENCE"
family = "eliot-cue-contracts"
applies_to = ["FC-CUE-ACTIVATION-RESULT.direct", "FC-CUE-ACTIVATION-RESULT.derived", "FC-CUE-SNAPSHOT-CLOSURE.relation_edges"]
rule = "A result with an empty derived list and an empty retained-edge set must still fire on exact keys. Relation traversal is optional and is never a precondition for a direct match, so no completeness rule may make a derived result a precondition of a direct one."
enforced_by = "crates/smart/eliot-cue-contracts/src/activation.rs::ActivationResult::validate_against"
independent_expected_set = "the snapshot's own member and edge sets, declared by the snapshot owner and compared against the result, never the result's own direct list"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUE-COMPLETE-NO-FRONTIER"
family = "eliot-cue-contracts"
applies_to = ["FC-CUE-ACTIVATION-RESULT.completeness"]
rule = "Completeness::Complete is accepted only when the whole declared denominator was searched and no frontier remains. Pairing Complete with a nonempty frontier is rejected as CompleteWithFrontier, and a truncated search that does not name the bound it hit is rejected as TruncationWithoutBound. No other member may be read as Complete."
enforced_by = "crates/smart/eliot-cue-contracts/src/activation.rs::ActivationResult::validate_completeness"
independent_expected_set = "CueProjectionDenominator on the snapshot closure, compared against the traversed rows and edges"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUE-CLOSURE-ACCOUNTING"
family = "eliot-cue-contracts"
applies_to = ["FC-CUE-SNAPSHOT-CLOSURE.denominator", "FC-CUE-SNAPSHOT-CLOSURE.rows", "FC-CUE-SNAPSHOT-CLOSURE.relation_edges"]
rule = "A closed snapshot reconciles expected_rows against observed rows plus named row omissions, and expected_edges against observed edges plus named edge omissions. Every omission is a CueProjectionOmission drawn from the closed omission-kind and reason sets, so an omission is a value. A count alone is not closure and a truncation with no stated bound is not closure."
enforced_by = "crates/smart/eliot-cue-contracts/src/snapshot.rs::CueSnapshot::validate_self_closed"
independent_expected_set = "CueProjectionDenominator declared by the snapshot owner, compared against the member list the snapshot actually carries"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUE-UNKNOWN-NOT-COMPLETE"
family = "eliot-cue-contracts"
applies_to = ["FC-CUE-ACTIVATION-RESULT.completeness", "FC-CUE-SNAPSHOT.closure", "FC-CUE-NORMALIZED.canonical"]
rule = "Unknown and incomplete evidence cannot become Complete by default anywhere in this family. An absent closure is SnapshotNotRebuildable, an unclassifiable normalization is Unsupported with no canonical identity, an unreadable source is SourceUnavailable rather than an empty result, and no seed hitting is NoDirectMatch rather than an empty snapshot. Each of those is a distinct value and none of them is Complete."
enforced_by = "crates/smart/eliot-cue-contracts/src/error.rs::CueContractError"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUE-CANDIDATE-NO-PROMOTION"
family = "eliot-cue-contracts"
applies_to = ["FC-CUE-INDEX-CANDIDATE.proof_ceiling", "FC-CUE-BINDING-CANDIDATE.disposition"]
rule = "No candidate in this family creates canonical truth, authority, scheduling, an external effect, task completion or its own promotion. A built index is admitted only as a CandidateArtifact under INDEX_CONTRACT_REVISION, and a caller-supplied Admitted disposition on a proposal is not snapshot membership."
enforced_by = "crates/smart/eliot-cue-contracts/src/index_candidate.rs::CueSnapshotBuildCandidate::validate_published"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count"
evidence_required = "NOT_EXECUTED; static field contract only"


[[version_rule]]
id = "VR-EXACT-CONTRACT-VERSION"
rule = "A record, batch, set, or view written against a different ContractVersion triple is rejected with VersionMismatch. Equality only; no range, no negotiation."
applies_to = ["eliot-memory-projection-contracts", "eliot-memory-projection-provider", "eliot-context-contracts", "eliot-epistemic-contracts"]

[[version_rule]]
id = "VR-EXACT-SCHEMA-VERSION"
rule = "Canonical projections require CANONICAL_PROJECTIONS_SCHEMA_VERSION exactly; learning bindings require LEARNING_SCHEMA_VERSION exactly. Mismatch fails closed."
applies_to = ["eliot-context-contracts", "eliot-learning-contracts"]

[[version_rule]]
id = "VR-DENY-UNKNOWN-FIELDS"
rule = "Every frozen wire shape carries deny_unknown_fields (or a checked wire TryFrom route). Unknown fields fail at the boundary; similarity scores, ranks, and model judgments have no field to hide in."
applies_to = ["all frozen types"]

[[version_rule]]
id = "VR-NO-AGGREGATE-SCORE"
rule = "No frozen type carries an aggregate intelligence, confidence, utility, or learning score. Installed, delivered, executed, and useful stay distinct; acknowledgement is not use, use is not adherence, adherence is not benefit."
applies_to = ["all frozen types"]

[[version_rule]]
id = "VR-FENCE-GATE"
rule = "Cross-record or cross-projection acceptance requires StateFence::is_compatible_with against the governing fence. Incompatible material becomes a named omission or exclusion, never silent loss or filler."
applies_to = ["all frozen types"]

[[version_rule]]
id = "VR-DREAMER-HUB-VERSION"
rule = "The dreamer hub version is a string equality (1.0.0), not a ContractVersion triple; self_query shapes additionally require schema_version exactly 1. Mismatch fails closed."
applies_to = ["eliot-dreamer-contracts"]

[[version_rule]]
id = "VR-EXACT-CONTRACT-VERSION-EXT"
rule = "Same equality rule as VR-EXACT-CONTRACT-VERSION, extended to the observation family admitted in r3."
applies_to = ["eliot-observation-contracts"]

[[version_rule]]
id = "VR-CUE-SCHEMA-REVISION"
rule = "Cue records validate their schema_revision by string equality against CONTRACT_REVISION 2.0.0 through is_supported_schema_revision, and the A-10 index candidate envelope validates its own INDEX_CONTRACT_REVISION 1.0.0 equality. Equality only; a payload written against a retired revision is rejected by current decoding rather than interpreted under the current shape. Admitted in r7."
applies_to = ["eliot-cue-contracts"]

[[version_rule]]
id = "VR-CURATION-CONTRACT-VERSION"
rule = "The screen surface is the eliot_contracts ContractVersion triple 1.0.0 and ScreenProfile.schema_revision is matched exactly, under CONTRACT_NAME eliot.smart.memory-curation-screen. Deny-unknown-fields plus the closed FindingClass, MemberDisposition, ResultState and ProtectionClass sets make an unknown field or an unknown variant fail closed at the boundary. Legacy action and lifecycle fields are rejected on the current schema, not mapped onto a current field. Admitted in r7."
applies_to = ["eliot-memory-curation-contracts"]

[[denominator]]
id = "DEN-MEMORY-BATCH"
definition = "DenominatorState::Known{total} over the read-side observed volume at the named batch fence, with explicit truncation frontier, named omissions, and revalidation flag. Every Complete state requires this exact independently recheckable denominator."
owner = "eliot-memory-projection-contracts"

[[denominator]]
id = "DEN-CONTEXT-SET"
definition = "Provider/semantic-role slot coverage with explicit OmissionRecord entries per missing or incompatible atom, bound to one ContextBinding fence. Completeness without the exact slot denominator is invalid."
owner = "eliot-context-contracts"

[[denominator]]
id = "DEN-LEARNING-STATE"
definition = "SourceDenominator{declared, observed} per recipe: declared nonzero, observed never above declared. Per-sub-assessment denominators recompute from per-attempt HarnessActivationReceipt refs; aggregate counts never substitute."
owner = "eliot-learning-contracts"

[[denominator]]
id = "DEN-EPISTEMIC-CLOSURE"
definition = "Coverage completeness derived only by explicit closed validation with the governing records (admission envelope, evidence, coverage, conflict, proof digests). Unknown, assumed, conflicted, and stale stay distinct."
owner = "eliot-epistemic-contracts"

[[denominator]]
id = "DEN-EXPERIENCE-COVERAGE"
definition = "Owner coverage binding per envelope: disposition plus denominator source ref plus coverage digest plus observed count plus explicit blind intervals. Carried members reconciling against observed volume is necessary but never sufficient; completeness additionally requires the owner Complete posture with exact count, empty omissions, and empty blind intervals. Bare counts never establish completeness."
owner = "eliot-observation-contracts"

[[denominator]]
id = "DEN-CUE-SNAPSHOT-CLOSURE"
definition = "CueProjectionDenominator{expected_rows, expected_edges, omitted_rows, omitted_edges, row_omissions, edge_omissions, source_revision} per snapshot closure. Every omitted row and every omitted edge is named by a CueProjectionOmission{identity, kind, reason} drawn from the closed CueProjectionOmissionReason set, so an omission is a value and not a free-form reason string. Row and edge totals are reconciled against the declared expected counts and bounded by CueSnapshotFanout; counts alone never establish closure, and a source_revision drift invalidates the denominator rather than refreshing it silently."
owner = "eliot-cue-contracts"

[[denominator]]
id = "DEN-CURATION-SCREEN"
definition = "FiniteDenominator{coverage, total_members, declared_member_ids} per screen request, with DenominatorCoverage Complete accepted only when total_members equals the unique declared member identity count. ScreenCoverage adds the per-member disposition, the frontier, the resume position and the accumulated work usage, and the coverage member identities must be a subset of the source members. A ResultState Complete claim additionally requires a complete source denominator, an empty frontier, coverage order equal to source member order, and no resume cursor, so unknown, blocked, truncated or unprocessed evidence cannot become Complete by default."
owner = "eliot-memory-curation-contracts"

