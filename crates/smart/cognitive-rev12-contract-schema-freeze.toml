rust_path = "eliot_memory_curation_contracts::FiniteDenominator"
fields = ["coverage", "total_members", "declared_member_ids"]
denominator_note = "Declared member denominator for one screen. DenominatorCoverage Complete is accepted only when total_members equals the length of the unique declared_member_ids, and total_members below the observed page is rejected, so a count can never be larger than the members it declares."

[[frozen_type]]
crate = "eliot-memory-curation-contracts"
rust_path = "eliot_memory_curation_contracts::ScreenCoverage"
fields = ["denominator", "start_position", "members", "frontier", "usage", "next_cursor", "digest"]
denominator_note = "Per-member accounting: every observed member has exactly one MemberDisposition, the frontier names where a bounded screen resumes, and the next cursor pins the resume position and usage. Coverage member identities must be a subset of the source members, and the immutable-reference disposition is reconciled against the partition, so mixed-lineage target/reference influence stays visible instead of merged."

[[frozen_type]]
crate = "eliot-memory-curation-contracts"
