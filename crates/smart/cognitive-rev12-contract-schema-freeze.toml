frozen = true
role = "Provider-neutral read-only memory curation screening contracts: source snapshot, finite denominator, protection assessment, findings, dimension verdicts, eligibility and the screen result. Owns vocabulary and intrinsic validation only; it does not execute a screen, read a store, select a semantic kind, or apply a lifecycle or action transition. Reported disagreement, not resolved here: this crate's own module.toml outputs list names ProtectionReason, which is defined in eliot-dreamer-accessibility and not in this crate, so that name is not a frozen output of this family."

