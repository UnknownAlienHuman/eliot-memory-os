type_rust_path = "eliot_memory_curation_contracts::CurationScreenRequest"
wire_name = "partition"
owner_rust_type = "MemberPartition"
requiredness = "REQUIRED"
none_meaning = "no None variant exists; a screen with no target/reference partition cannot bound mixed-lineage influence"
bound_or_variants = "changed_targets and immutable_references must be disjoint, so a member cannot be proposed for change and simultaneously held as an immutable reference"
identity_binding = "which members a later owner may consider and which it must not touch. The two sets are the boundary that keeps mixed-lineage influence visible."
validator = "crates/smart/eliot-memory-curation-contracts/src/source.rs::MemberPartition::validate"
validation_error = "ContractError::Duplicate"

