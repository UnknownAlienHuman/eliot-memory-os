# DRIFT 4, AGGREGATE_ROW 6, NO_DECL 1. r12's own revision note and its
# DIS-CTX-VIEW-EXECUTION-POLICY row both asserted that EXACTLY TWO lists no
# longer matched; FOUR do, so that claim was never true on the commit that made
# it. In every one of the four the Rust is the intended shape and only the
# recorded summary is behind it, so r13 changes no type, field, enum, denominator
# id, bound or cell binding -- it corrects four recorded field lists, one
# superseded denominator_note, and two prose counts, and it says so in the rows
# that recorded the disagreement rather than absorbing them silently. Every
# verdict bound to the r12 digest is invalidated by this revision rather than
# edited, per the [readback] rule below.
[revision_note]
