scope_fence_fields = ["scope", "state_fence"]
denominator_note = "Immutable owner source identity at one revision and digest. Every result revalidates against it, so a screen bound to a drifted source revision is a BindingMismatch rather than a quiet refresh."

[[frozen_type]]
