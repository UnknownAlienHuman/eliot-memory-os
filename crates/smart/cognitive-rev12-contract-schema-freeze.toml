fields = ["finding_id", "source", "profile_id", "member_id", "rule_id", "class", "evidence", "invariant", "proof", "invalidated_by", "digest"]
denominator_note = "Structural evidence about one member under one profile rule. FindingClass is a closed set (Duplicate, StaleSuperseded, MalformedIncomplete, ProvenanceGap, ProtectionGap, ConflictAmbiguity, BoundedOut, Unprocessed) and FindingProof separates Deterministic, Observed and Unknown, so an unproven finding cannot read as a deterministic one. A finding states evidence; it applies nothing."

[[frozen_type]]
crate = "eliot-memory-curation-contracts"
