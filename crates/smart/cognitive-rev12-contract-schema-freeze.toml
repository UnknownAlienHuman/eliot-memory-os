[[completeness_rule]]
id = "CR-CTX-VIEW-PROOF-IS-CROSS-RECORD"
family = "eliot-context-contracts"
applies_to = ["FC-CTX-ACTIVE-VIEW.admitted_ids", "FC-CTX-ACTIVE-VIEW.rendered", "FC-CTX-ACTIVE-VIEW.execution", "FC-CTX-ACTIVE-VIEW.policy_sha256", "FC-CTX-ACTIVE-VIEW.recipe_digest"]
rule = "THE SELECTION-INTEGRITY PROOF MUST COMPARE TWO INDEPENDENT RECORDS, AND THE OWNER SAYS WHY IN ITS OWN COMMENT. admitted_ids are read from the ADMITTED SET while rendered identities come from the PROJECTION; deriving both from the projection would make the recorded equality a comparison of one list with a copy of itself, which no dropped member could violate. Four cross-record comparisons follow: the output_digest is recomputed from binding, recipe_digest, fence_digest and the selected atoms; the recipe_digest and policy_sha256 are each compared against the admitted economy receipt's own values; the quality card's admitted_digest is compared against the ADMITTED SET's own canonical payload digest; and the execution identity is cross-checked against the independently recorded measurement. The policy_sha256 comparison is the one that closes a real hole: without it a View and a receipt issued under different approved policy revisions could be joined merely by hashing each of them."
enforced_by = "crates/smart/eliot-context-contracts/src/view.rs::ActiveUnderstandingView::validate_against"
independent_expected_set = "the AdmittedContextSet held by the consumer -- its own canonical payload digest, its own displaced omission list and its own economy recipe_digest and policy_sha256; the view's own copies of all five are the thing under test"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-LEA-DENOMINATOR-ASYMMETRY"
family = "eliot-learning-contracts"
applies_to = ["FC-LEA-SOURCE-DENOMINATOR.declared", "FC-LEA-SOURCE-DENOMINATOR.observed"]
rule = "COVERAGE MAY FALL SHORT OF THE DECLARATION AND MAY NEVER EXCEED IT, and neither number may be defaulted. declared must be strictly non-zero, so a zero-denominator record is refused with Missing rather than treated as a trivial case. observed must be LESS THAN OR EQUAL TO declared, and an excess is refused with the crate's own IncompleteCoverage variant naming no field, never clamped and never silently reduced. That asymmetry is the rule: a projection cannot inflate its own completeness by counting more than was promised. Both fields are plain integers with no serde default, so a projection that observed nothing must SAY zero rather than omit the key -- an omitted observation and an observation of nothing are different facts and only one of them is a measurement. Named explicitly as NOT enforced here: no check compares the observed MEMBERS against the declared ones, and this type carries no omission list; the per-slot omission information lives in SlotDisposition, which is dispositioned separately."
