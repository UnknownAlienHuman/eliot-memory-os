[[upstream_crate]]
crate = "eliot-cue-contracts"
source_path = "crates/smart/eliot-cue-contracts"
version_scheme = "schema_revision string equality on CONTRACT_REVISION 2.0.0 through is_supported_schema_revision; the A-10 index candidate envelope carries a separate INDEX_CONTRACT_REVISION 1.0.0 equality"
frozen = true
role = "Provider-neutral cue vocabulary for the A-11 normalizer, A-12 binding, A-13 index, A-14a activation and A-16a context candidates. Owns schemas, canonical identities and intrinsic validation; runs no normalization algorithm, builds no index, traverses no graph and performs no I/O. Keeps observed source, canonical identity, comparison key, admitted binding, snapshot membership, direct match and relation-derived activation as seven distinct types."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::ObservedCue"
fields = ["schema_revision", "observed_cue_id", "kind", "original_value", "source", "context"]
scope_fence_fields = ["context task_id", "context scope_id", "context state_fence"]
denominator_note = "Observed source material only. It carries no canonical identity, no comparison key, no target handle and no admission, and original_value is the captured text before normalization, never a match result."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::NormalizedCue"
fields = ["schema_revision", "observed", "profile", "canonical", "comparison_keys", "outcome", "transformation_evidence"]
denominator_note = "The one record that joins the three upstream seams, and it keeps them in separate fields: observed stays the source material, canonical is the identity, comparison_keys are the keys. NormalizationOutcome is closed to Lossless, and the ordered transformation evidence is bounded by MAX_TRANSFORMATION_STEPS. Keys per identity are bounded by MAX_COMPARISON_KEYS, so identity count is never match count."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::CanonicalCueIdentity"
fields = ["canonical_cue_id", "kind", "canonical_value", "digest"]
denominator_note = "Canonical identity only. It names no target handle and no comparison key, so existence of an identity is not accessibility of a target and not a match."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::ComparisonKey"
fields = ["comparison_key_id", "profile", "key_value", "form", "match_mode"]
denominator_note = "Comparison key bound to one NormalizationProfile. ComparisonForm and MatchMode are closed enums, so a key is a comparable spelling, not an identity and not a direct match."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::CueBindingCandidate"
fields = ["binding_candidate_id", "canonical", "target", "role", "freshness", "disposition", "digest"]
denominator_note = "Proposed canonical-to-target binding. BindingRole is Names/Touched/ExpectedReuse and BindingDisposition is Admitted/Withheld/Rejected, so a proposal is not a binding: admission is carried separately by AdmittedCueBindingProjection with its admission receipt, and a Withheld or Rejected candidate never becomes a member."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::CueSnapshot"
fields = ["schema_revision", "snapshot_id", "members", "rebuild", "state_fence", "source_revision", "closure"]
scope_fence_fields = ["state_fence", "source_revision"]
denominator_note = "Snapshot membership with its RebuildIdentity, so projection state stays rebuildable. A member is a stored canonical identity plus target handle: membership is neither a direct match nor a relation-derived activation, and the snapshot is not editable in place."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::CueSnapshotClosure"
fields = ["denominator", "rows", "relation_edges", "edge_weights", "fanout"]
denominator_note = "The closure that makes the snapshot recheckable: rows and relation edges are bounded by the declared CueProjectionDenominator and by CueSnapshotFanout. fanout bounds traversal only; a Complete closure with a nonempty frontier, or truncation with no stated bound, is rejected by the owner."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::DirectActivation"
fields = ["target", "matched_key", "strength"]
denominator_note = "Direct match against one comparison key. The activation path is empty because no relation was traversed, which is the frozen statement of exact-cue independence: a result set with zero relation edges still fires on exact keys, and BoundedRelationTraversal is optional, never a precondition for a direct match."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::DerivedActivation"
fields = ["target", "direct_seed", "path", "depth", "strength"]
denominator_note = "Relation-derived activation. It always names the direct_seed it descends from and always carries a nonempty path and its depth; a derived activation without a resolvable path is rejected as BrokenActivationPath. Bounded by MAX_DERIVED and MAX_PATH_LEN, and traversal is bounded separately by MAX_RELATION_EDGES."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::ActivationResult"
fields = ["schema_revision", "request_id", "snapshot_id", "normalization_profile", "state_fence", "observed_at", "deadline_ms", "cancelled", "direct", "derived", "completeness", "trace"]
scope_fence_fields = ["state_fence"]
denominator_note = "direct and derived are two separate collections and are never merged into one ranked list. Completeness::Complete asserts the whole denominator was searched with no frontier, so pairing Complete with a frontier is rejected as CompleteWithFrontier, and a bound that stopped the search without a stated frontier is rejected as TruncationWithoutBound. ActivationStrength carries a threshold bound, not a score of usefulness."

[[frozen_type]]
crate = "eliot-cue-contracts"
rust_path = "eliot_cue_contracts::CueSnapshotBuildCandidate"
fields = ["schema_revision", "scope_id", "snapshot", "admitted_bindings", "relation_edges", "proof_ceiling", "build_digest"]
denominator_note = "The only candidate-shaped record in this family. It is validated against the separate INDEX_CONTRACT_REVISION 1.0.0 and must carry proof_ceiling CandidateArtifact, so a built index stays a candidate artifact and never becomes the canonical cue index on its own."

