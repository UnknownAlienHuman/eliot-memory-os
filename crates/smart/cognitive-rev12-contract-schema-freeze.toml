# cover the Governor observation classification family at all -- that crate has
# zero occurrences in this file before r12 -- nor the dreamer self-query source
# and denominator family, nor the context binding/view/omission family, nor the
# learning binding/activation family. r12 adds the field contract for those four,
# measured from the current source, so all seven families named by the issue now
# carry at least one field-contract row rather than being silently absent.
# ---------------------------------------------------------------------------
