# r11 denominators for the three families the C1 card names as existing but
# previously frozen at type level only. Each names an INDEPENDENTLY declared
# expected set, because a completeness check that compares a list against a
# copy of itself proves nothing.

[[denominator]]
id = "DEN-MEMORY-SELECTION"
definition = "SelectionCoverage{considered, selected, not_selected} over EXACTLY the records presented to one selection. The denominator is the PRESENTED SET, declared independently by the consumer as the records array length of the batch it holds, and never by the trace's own entries list recomputed from itself. selected plus not_selected must EQUAL considered exactly, and considered must EQUAL entries.len(). This is deliberately a different type with different field names from the batch denominator DenominatorState, so the batch total can never be echoed under a filtered set and an intentional kind selection can never be mistaken for unaccounted loss. Two further recheckable bounds apply outside the denominator itself: selected must not exceed the echoed policy_ceiling and must not exceed the intent limit, and every entry handle and kind must replay against the paired batch record in deterministic provider order. Counts alone never establish completeness here, because a caller arithmetic that merely balances proves only that the caller balanced its own numbers."
owner = "eliot-memory-projection-contracts"
independent_expected_set = "the consumer's own held MemoryProjectionBatch.records array length; the trace's entries list is the thing under test and is never used as its own reference"
recheck_procedure = "1. read batch.records.len() from the consumer's own batch; 2. read trace.coverage.considered and assert equality; 3. assert selected + not_selected == considered; 4. assert selected <= policy_ceiling; 5. assert selected <= intent.limit; 6. zip entries against batch.records and assert handle and kind equality and that each disposition follows the intent allowlist. Any failure is MemoryProjectionError::CoverageMismatch, SelectionError::LimitExceeded or SelectionError::BindingMismatch."
unknown_behaviour = "There is no unknown state in this denominator and none is needed: the denominator is a count of records actually presented, not a claim about records that might exist elsewhere. An unreadable batch is a MemoryProjectionError from batch.validate() and no trace is produced at all, which is structurally different from a trace with a small considered count. An UNKNOWN batch denominator does not block selection, because selection deliberately claims no completeness: select() reads batch.coverage.denominator and never echoes it."
omission_axis = "NONE BY CONSTRUCTION, and that is a deliberate design fact rather than a gap. Selection narrows a set the producer already presented; it does not read, so it cannot omit. Incompleteness in the SOURCE is carried by the batch's own ProjectionCoverage denominator, frontier and omissions, which this denominator deliberately does not re-state and cannot blur."

[[denominator]]
id = "DEN-FAILURE-OBSERVATION"
definition = "CoverageEvidence{disposition, denominator_source_ref, interval, blind_intervals, observed_count} carried on BOTH FailureObservation and MemoryRevisionEvidence, plus the typed omission list and the counted ref list. Observed volume arrives as OWNER coverage evidence and never as caller arithmetic. The owner-declared expected set is the SourceRevisionHandle plus the observed_count at the named denominator_source_ref; a completeness claim is compared against THAT, never against the refs this crate happens to carry. A Complete claim additionally requires the FULL POSTURE, not just the disposition word: disposition == CoverageDisposition::Complete AND blind_intervals EMPTY. Reachable only through FailureObservation::coverage_complete and MemoryRevisionEvidence::coverage_complete, which is what makes 'counts reconcile' and 'complete' two different statements."
owner = "eliot-observation-contracts"
independent_expected_set = "the owner's CoverageEvidence observed_count together with the SourceRevisionHandle and denominator_source_ref that evidence itself declares, compared against the carried journal_refs or evidence_refs. The carried ref list is the thing under test and is never its own reference."
recheck_procedure = "1. read coverage.disposition; 2. read coverage.blind_intervals and assert it is EMPTY for any Complete claim; 3. reconcile the counted ref list length against coverage.observed_count, naming any difference as an explicit FailureOmission rather than absorbing it; 4. assert journal_refs or evidence_refs holds no duplicate, which the owner validator enforces as ObservationError::Duplicate; 5. recompute digest over every field except digest itself and assert equality. Steps 1 and 2 together are the Complete-posture test; failing either yields an explicit partial read, not a quiet pass."
unknown_behaviour = "Uncertainty is a NAMED VALUE, never an absence. CoverageDisposition carries UNKNOWN, UNAVAILABLE, BLIND, INCOMPLETE_COVERAGE and PARTIAL as five distinct members, and none of them has a default that reads as Complete. An unreadable source is CoverageDisposition::Unavailable plus a FailureOmission, not an empty ref list. An unadmitted source is the UNADMITTED_SOURCE omission class, not a silent zero. A false sense of completeness cannot arise from an omitted key, because the disposition field is required and there is no serde default."
omission_axis = "Every omission is a FailureOmission carrying one of the five closed FailureOmissionClass members and a bounded note, bounded at MAX_OBSERVATION_OMISSIONS 64. The frontier equivalent for this family is the blind_intervals list on the coverage evidence, which is owner-declared rather than computed here. Both axes are typed and both are covered by the record's frozen digest."

[[denominator]]
id = "DEN-PROVIDER-CONTRIBUTION"
definition = "There is NO coverage denominator on ProviderContribution, and that is the design rather than an omission. The envelope is WHOLE-ENVELOPE-OR-ERROR: contribute() takes only an admitted CurrentEpistemicPosition, refuses a non-current position, and runs the position's closed validation (shape plus frozen-digest recompute) before constructing anything. So a contribution covers EXACTLY its named receipt envelope or it fails to exist. There are no partial contributions and no omission entries by construction, and coverage_digest is a DIGEST OF THE OWNER'S EVIDENCE rather than a completeness claim made here."
owner = "eliot-epistemic-contracts"
independent_expected_set = "the admission envelope named by the combination of receipt_digest, position_digest, position and position_revision, which is declared by the owner through position.receipt_identity() and the admission record. The echoed fields are the thing under test and are never their own reference."
recheck_procedure = "1. assert contract_version equals 1.2.0; 2. assert view_kind is CURRENT_EPISTEMIC_POSITION and currentness is CURRENT; 3. assert all three digests are 64 lowercase hex; 4. assert scope and source_revision are within MAX_SHORT_TEXT 256; 5. assert fence.validate succeeds; 6. re-derive the envelope from the named admission record and assert every echoed field equals it. Step 6 is the whole-envelope check and is available only to a consumer that holds the admission record; without it, validate() establishes shape and echoes internal consistency but NOT provenance."
unknown_behaviour = "Currentness carries SUPERSEDED as its second member and contribute() refuses it, so a superseded position is an ERROR rather than a contribution with a weakened marker. Epistemic status distinctions that this envelope does not carry, such as assumed, conflicted, stale or under investigation, live on the CurrentEpistemicPosition itself and are not flattened by the handoff. A position whose governing material is missing or invalid yields ContractError from the position validation and NO envelope, which is structurally different from an envelope with an unknown field set to None."
omission_axis = "NONE, and a missing omission axis is the strongest completeness statement in this file: there is no way to express a partial contribution, so a consumer never has to decide whether a gap is tolerable. The cost is that a caller cannot ship a partial handoff at all, which is the intended trade."

# r11 completeness rules for the same three families. Same no-derived-completeness
# discipline: each names the OWNER validator that enforces it and the independent
# expected set the validator compares against.

[[completeness_rule]]
id = "CR-SEL-DENOMINATOR-EXACT"
family = "eliot-memory-projection-contracts"
applies_to = ["FC-SEL-COVERAGE.considered", "FC-SEL-COVERAGE.selected", "FC-SEL-COVERAGE.not_selected", "FC-SEL-TRACE.coverage"]
rule = "SelectionCoverage must account for every entry exactly: considered equals entries.len(), selected plus not_selected equals considered, and selected must not exceed the echoed policy_ceiling. The three counts must balance; they need not be equal to the batch total, and deliberately so, because this denominator counts the PRESENTED set rather than the source. A trace whose counts balance but whose entries do not replay against the batch is still rejected, so balancing arithmetic alone never establishes a valid selection."
enforced_by = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::MemorySelectionTrace::validate"
independent_expected_set = "the consumer's own held MemoryProjectionBatch.records array, compared entry by entry under validate_against; the trace's entries list is the thing under test and is never its own expected set"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-SEL-NO-SILENT-CUT"
family = "eliot-memory-projection-contracts"
applies_to = ["FC-SEL-QUERY-INTENT.limit", "FC-SEL-POLICY.max_selected", "FC-SEL-TRACE.policy_ceiling", "FC-SEL-ENTRY.disposition"]
rule = "Selection never cuts silently and never reorders. More records passing the allowlist than the limit admits is SelectionError::LimitExceeded carrying both counts, and a requested limit above the policy ceiling is SelectionError::LimitOverPolicy. Neither is resolved by dropping records: the caller narrows kinds or raises the limit. Records outside the allowlist are not dropped either, they are recorded as NotSelected with ExclusionReason::Rejected, so the presented set is always fully accounted for. Provider order is never re-sorted, so the deterministic order a consumer replays is the order the producer emitted."
enforced_by = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::select"
independent_expected_set = "the intent limit and the policy ceiling, both declared by their own owner types and compared against the count of Selected entries; neither is derived from the entries list"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-SEL-NO-VERDICT"
family = "eliot-memory-projection-contracts"
applies_to = ["FC-SEL-ENTRY.disposition", "FC-SEL-DISPOSITION.NOT_SELECTED", "FC-SEL-DISPOSITION.SELECTED"]
rule = "Selection NARROWS and never VERDICTS. A Selected entry is not an applicable memory and never enters ApplicableMemorySet. A NotSelected entry carries ExclusionReason::Rejected with a narrow TRACE-LOCAL meaning, rejected by the explicit caller allowlist recorded in that trace, which is deliberately NOT the same claim as an applicability exclusion even though both use the ExclusionReason::Rejected spelling. The distinction is structural rather than documentary: selection entries are a different type from applicability exclusions, so the two cannot merge on the wire, and the untouched batch still flows whole to evaluate_applicability, which remains the sole verdict authority and still verdicts every record independently. Selection therefore creates no authority, no canonical truth, no scheduling, no external effect and no task finish."
enforced_by = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::MemorySelectionTrace::validate_against"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count. The ApplicableMemorySet verdict is produced by the separate set.rs evaluator over the whole batch, never by this trace."
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-OBS-COMPLETE-POSTURE"
family = "eliot-observation-contracts"
applies_to = ["FC-OBS-FAILURE-OBSERVATION.coverage", "FC-OBS-MEMORY-REVISION-EVIDENCE.coverage", "FC-OBS-FAILURE-OBSERVATION.journal_refs", "FC-OBS-MEMORY-REVISION-EVIDENCE.evidence_refs"]
rule = "A Complete verdict on either failure-family record requires the FULL POSTURE and not merely the disposition word: coverage.disposition must equal CoverageDisposition::Complete AND coverage.blind_intervals must be EMPTY. Anything else is an explicit partial read reached through coverage_complete returning false. The disposition word alone is therefore insufficient on purpose, and a carried-member count that reconciles against observed_count establishes nothing about completeness on its own: it is necessary and not sufficient. Duplicates in the ref list are rejected rather than deduplicated, so the counted set and the declared set are the same set."
enforced_by = "crates/foundation/eliot-observation-contracts/src/failure_observation.rs::FailureObservation::coverage_complete"
independent_expected_set = "the owner CoverageEvidence observed_count together with the SourceRevisionHandle and denominator_source_ref that evidence itself declares, compared against the carried ref list. The carried refs are the thing under test and are never their own expected set."
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-OBS-UNKNOWN-NOT-COMPLETE"
family = "eliot-observation-contracts"
applies_to = ["FC-OBS-FAILURE-OBSERVATION.coverage", "FC-OBS-OMISSION.CLASS", "FC-OBS-MEMORY-REVISION-EVIDENCE.same_hypothesis_recurrence", "FC-OBS-MEMORY-REVISION-EVIDENCE.prior_attempts"]
rule = "Unknown and incomplete evidence cannot become Complete by default anywhere in this family, and each uncertainty is a NAMED VALUE rather than an absence. CoverageDisposition carries UNKNOWN, UNAVAILABLE, BLIND, INCOMPLETE_COVERAGE and PARTIAL as five distinct members and none of them reads as Complete. FailureOmissionClass carries JOURNAL_BLIND, SUPERSEDED_REVISION, PRIVACY_WITHHELD, EXPIRED_CURSOR and UNADMITTED_SOURCE and has NO Unknown or Other member, so an unnamed reason is not representable. An empty omissions list means the owner declared no omission and is never a claim that nothing was missed. On MemoryRevisionEvidence the same_hypothesis_recurrence flag is a plain Rust bool with no absent case, and prior_attempts zero is an HONEST ZERO distinct from an absent field; neither may be read as evidence that recurrence was ruled out, because ruling recurrence out is a reviewer decision and not something this record asserts."
enforced_by = "crates/foundation/eliot-observation-contracts/src/lib.rs::ObservationError"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-OBS-NO-APPLIED-AUTHORITY"
family = "eliot-observation-contracts"
applies_to = ["FC-OBS-FAILURE-OBSERVATION.extinction_condition", "FC-OBS-FAILURE-OBSERVATION.reopen_condition", "FC-OBS-MEMORY-REVISION-EVIDENCE.same_hypothesis_recurrence"]
rule = "Nothing in this family applies a lifecycle change, creates canonical truth, grants authority, schedules work, produces an external effect, finishes a task or promotes itself. A satisfied extinction_condition does NOT retire the memory: the conditions are identity references and this crate evaluates neither. A satisfied reopen_condition does not reopen anything. A true same_hypothesis_recurrence flag ROUTES the case to Mechanism Review rather than to another equivalent retry, which is a routing decision and not an effect this record performs. The original episode stays with the Governor owner; this shape narrows nothing and deletes nothing. Journal and verifier records are cited by handle and never opened, so no admission, retrieval, ranking or promotion happens on this path."
enforced_by = "crates/foundation/eliot-observation-contracts/src/failure_observation.rs::FailureObservation::validate"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count. Lifecycle change, Mechanism Review routing and re-open decisions all stay with the Governor and Task owners named in crates/smart/eliot-dreamer-memory-revision/src/lib.rs::propose."
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-EPI-CURRENT-NOT-STALE"
family = "eliot-epistemic-contracts"
applies_to = ["FC-EPI-PROVIDER-CONTRIBUTION.currentness", "FC-EPI-PROVIDER-CONTRIBUTION.position_revision", "FC-EPI-PROVIDER-CONTRIBUTION.source_revision"]
rule = "A contribution exists only for a CURRENT position. contribute() refuses a non-current position before it validates anything, and validate() refuses any currentness other than Current, so a superseded position is a typed error and never a contribution carrying a weakened marker. That is a construction-time statement, not a continuing one: a contribution already written can go stale, which is why the position revision and the source revision are separate echoed axes and why every consumer re-gates liveness at its OWN edge under VR-FENCE-GATE. Neither revision axis is collapsed into the other, so a consumer can tell a revised position from a revised source."
enforced_by = "crates/smart/eliot-epistemic-contracts/src/contribution.rs::ProviderContribution::contribute"
independent_expected_set = "the admission record named by receipt_digest, held by the consumer; the envelope's echoed fields are the thing under test and are never their own reference. Without that record, validate() establishes shape and internal echo consistency only, never provenance or liveness."
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-EPI-WHOLE-ENVELOPE"
family = "eliot-epistemic-contracts"
applies_to = ["FC-EPI-PROVIDER-CONTRIBUTION.coverage_digest", "FC-EPI-PROVIDER-CONTRIBUTION.receipt_digest", "FC-EPI-PROVIDER-CONTRIBUTION.position_digest"]
rule = "Completeness in this family is DERIVED and never CLAIMED, and there is no path by which it becomes complete by default. There is no coverage denominator, no omission list, no partial-contribution variant and no completion flag on the envelope. contribute() runs the position's closed validation, shape plus frozen-digest recompute, and fails closed if any of it fails, so a contribution covers exactly its named receipt envelope or does not exist. A consumer that wants a completeness claim must hold the admission record and re-derive the envelope from it; coverage_digest being present is a digest of the OWNER's evidence and never itself a Complete verdict. An unknown or absent field has no representation, so no partial handoff can be shipped and later mistaken for a whole one."
enforced_by = "crates/smart/eliot-epistemic-contracts/src/contribution.rs::ProviderContribution::contribute"
independent_expected_set = "the admission envelope named by receipt_digest and the position named by position_digest, both held by the consumer; the envelope's own echoed fields are the thing under test and are never their own expected set"
evidence_required = "NOT_EXECUTED; static field contract only"

[[version_rule]]
id = "VR-SELECTION-CONTRACT-VERSION"
rule = "Every selection record validates its contract_version by exact string-shaped triple equality against CONTRACT_VERSION 0.2.0 declared at crates/foundation/eliot-memory-projection-contracts/src/contracts.rs. Equality only; no range and no negotiation. This triple is DIFFERENT from the epistemic family's 1.2.0 and the observation family's 1.0.0, which is precisely why the rule is equality: a record written against a sibling family is a VersionMismatch and is rejected at decode rather than reinterpreted. Admitted in r11."
applies_to = ["eliot-memory-projection-contracts"]

[[version_rule]]
id = "VR-FAILURE-OBSERVATION-VERSION"
rule = "Every failure-family record validates its contract_version by exact triple equality against CONTRACT_VERSION 1.0.0 declared at crates/foundation/eliot-observation-contracts/src/lib.rs, and additionally re-derives its own frozen digest on every validate(). A record whose stored digest does not match the recomputed value is ObservationError::InvalidField, so a byte edit to any field without a digest recompute is rejected. Admitted in r11."
applies_to = ["eliot-observation-contracts"]

[[version_rule]]
id = "VR-CONTRIBUTION-CONTRACT-VERSION"
rule = "Every provider contribution validates its contract_version by exact triple equality against CONTRACT_VERSION 1.2.0 declared at crates/smart/eliot-epistemic-contracts/src/lib.rs, together with the view_kind discriminator and a currentness of Current. The three checks are conjunctive: passing the version while failing the discriminator, or passing both while carrying a superseded marker, is still a rejection. Admitted in r11."
applies_to = ["eliot-epistemic-contracts"]


