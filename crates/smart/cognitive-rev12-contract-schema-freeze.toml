scope_fence_fields = ["binding task_id", "binding attempt_id", "binding scope", "binding state_fence"]
denominator_note = "Screening request: the source identity and its declared FiniteDenominator, the target/reference partition, the request binding, the ScreenProfile and an optional resume cursor. The request proposes a bounded read; it carries no finding, no protection decision and no action."

[[frozen_type]]
