wire_name = "binding"
owner_rust_type = "RequestBinding"
requiredness = "REQUIRED"
none_meaning = "no None variant exists; a screen with no request binding has no scope, fence or attempt to answer to. The one optional leaf is binding.task_id, whose None means the screen is not task-attached, NOT that the binding is absent."
bound_or_variants = "request_id, operation_id, attempt_id, scope and state_fence are required; task_id is Option<TaskId> and its None means no task attachment"
identity_binding = "the exact request, operation, attempt, scope and fence the screen runs under. task_id None is recorded as un-attached and is distinct from an attached task with a different fence."
validator = "crates/smart/eliot-memory-curation-contracts/src/identity.rs::RequestBinding::validate"
validation_error = "ContractError::BindingMismatch"

[[field_contract_field]]
