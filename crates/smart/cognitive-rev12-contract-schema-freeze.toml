purpose = "Single versioned upstream projection surface for #223 Wave 1 projection packages. Reuses exact public fields, type owners, version-compatibility rules, scope/fence bindings, and denominator definitions from memory-projection, context, learning, epistemic, dreamer, and observation contracts. No invented authority, no guessed cell mapping."
