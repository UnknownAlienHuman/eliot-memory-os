# ---------------------------------------------------------------------------
# r8 field contract for the eliot-cue-contracts family.
#
# Every row below is a field-level statement read from the current defining
# struct in the named crate. Nothing is invented here: `type_rust_path` is the
# one defining owner, `wire_name` is the spelling the current serde attributes
# produce, `validator` and `validation_error` are `path.rs::symbol` anchors
# that resolve on this freeze's base commit, and `bound_or_variants` names a
# `[[bound]]` row in this same file or a closed enum declared by the owner.
#
# `provenance_privacy` and `invalidation_rule` are declared once per type
# rather than repeated per field, because in this family every field of a
# record shares the record's provenance owner and the record's revision
# invalidation rule. That is a stated scope decision, not an omission:
# a field that does NOT share its type's rule carries its own
# `invalidation_rule` key on the field row instead.
#
# Rows whose `disposition` is `REFERENCED_NOT_FROZEN` are owner types the r7
# `[[frozen_type]]` list reaches but does not itself freeze. They are listed
# here so the gap is visible and countable, never silently omitted.
# ---------------------------------------------------------------------------
[field_contract_rule]
admitted_in_revision = 9
first_admitted_in = "eliot-cue-contracts at r9. Extended at r10 to eliot-memory-curation-contracts and at r11 to eliot-memory-projection-contracts (selection), eliot-observation-contracts (failure family) and eliot-epistemic-contracts (contribution). The r11 families join under the SAME row shape and the SAME rules; r11 adds no new column."
applies_to = ["eliot-cue-contracts", "eliot-memory-curation-contracts", "eliot-memory-projection-contracts", "eliot-observation-contracts", "eliot-epistemic-contracts"]
row_shape = ["field_id", "type_rust_path", "wire_name", "owner_rust_type", "requiredness", "none_meaning", "bound_or_variants", "identity_binding", "validator", "validation_error"]
type_level_shape = ["type_id", "crate", "type_rust_path", "wire_naming", "validator", "error_family", "provenance_privacy", "invalidation_rule", "disposition"]
validator_column = "A `path.rs::symbol` anchor naming the real validating function in the defining crate. A row without a resolving validator anchor is a gap and is not counted as frozen."
validation_error_column = "A variant of the named `error_family`, never a formatted string. A typed failure is never collapsed into a code or a message between layers."
requiredness_vocabulary = ["REQUIRED", "OPTIONAL_NONE_<meaning>", "EMPTY_SET_ALLOWED", "NOT_APPLICABLE"]
requiredness_vocabulary_note = "EMPTY_SET_ALLOWED is not the same as REQUIRED and not the same as optional. A field carrying this requiredness is always present and may be an empty list, and the none_meaning column states in words whether an empty list is a real absence, an honest zero, or a claim the owner forbids. Two r11 cases make the distinction load-bearing: FailureOmission.handle is OPTIONAL_NONE with a stated meaning, while MemoryRevisionEvidence.prior_attempts is a plain Rust bool where ZERO is an honest zero and an ABSENT key is a different thing entirely, so that field is REQUIRED with no None case rather than EMPTY_SET_ALLOWED."
independent_set_rule = "Every expected set named by bound_or_variants, identity_binding or a completeness claim is declared by the OWNER CRATE, never re-derived here. A completeness check compares an independently declared expected set, never a second copy of the caller's own list."
no_derived_completeness_rule = "This file states no Complete claim. A Complete claim is reachable only through the validator anchor named on the row, over the denominator named by `denominator_ref`."
disposition_column = "FROZEN_EXACT means the type is a top-level frozen output of its family and the current source matches the row. REFERENCED_NOT_FROZEN means the type is reachable as a nested owner field or as vocabulary of a frozen row but is not itself a top-level frozen output, so a consumer may reference it and may not treat it as a standalone contract. Exactly one of the two applies to every [[field_contract]] row; there is no third value and no blank."
coverage_claim_rule = "A Complete claim anywhere in this file must carry a recheckable member denominator, an omission axis and an unknown behaviour. The per-family denominators are declared in [[coverage_accounting]] and each carries a recheck_procedure. A row that cannot state all three contributes zero to every count rather than being counted on the strength of its field list alone."
vocabulary_bundle_rule = "A [[field_contract]] type row whose type_id ends in -VOCABULARIES is a BUNDLE: its type_rust_path names one representative member of a closed enum family, and its [[field_contract_field]] rows name the OTHER members of that family individually, each with its own wire spelling, closed member set and owner path. Those field rows therefore carry a type_rust_path that is not itself a [[field_contract]] type_rust_path, and that is the intended shape rather than a dangling reference. Nineteen rows are in this position at r11: six under FC-CUE-VOCABULARIES (BindingDisposition, BindingRole, ComparisonForm, Completeness, MatchMode, NormalizationOutcome) and thirteen under FC-CUR-VOCABULARIES (DenominatorCoverage, DimensionOutcome, DisclosureCeiling, EligibilityStatus, FindingClass, FindingProof, MemberDisposition, ProtectionClass, ProtectionEvidenceState, ProtectionOutcome, ResultState, SourceAvailability, SourceMemberKind). Every one of the nineteen was machine-checked to be a real type declared in its owner crate's own source. A reader checking parent/child linkage must exempt rows whose field_id prefix belongs to a bundle row."

