[[frozen_type]]
crate = "eliot-memory-curation-contracts"
rust_path = "eliot_memory_curation_contracts::CurationScreenResult"
fields = ["request", "source", "findings", "protection", "eligibility", "coverage", "member_sets", "state", "result_digest"]
