[[field_contract_field]]
field_id = "FC-CUR-REQUEST.cursor"
type_rust_path = "eliot_memory_curation_contracts::CurationScreenRequest"
wire_name = "cursor"
owner_rust_type = "Option<CumulativeCursor>"
requiredness = "OPTIONAL_NONE_FIRST_PAGE"
none_meaning = "None means this is the FIRST page of the screen and there is no predecessor. A genesis request that carries a predecessor digest is rejected, and None is never a way to skip the resume checks on a later page."
