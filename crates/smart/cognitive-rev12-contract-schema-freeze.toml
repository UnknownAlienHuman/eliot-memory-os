definition_revision = "CONTRACT_REVISION 2.0.0 by exact string equality through eliot_cue_contracts::is_supported_schema_revision; the equality is on the record's own schema_revision field, not on the crate constant alone"
first_consumer = "crates/smart/eliot-cue-normalizer/src/lib.rs::normalize_cue"
owned_files = ["crates/smart/eliot-cue-contracts/src/normalization.rs", "crates/smart/eliot-cue-contracts/src/observation.rs", "crates/smart/eliot-cue-contracts/src/identity.rs", "crates/smart/eliot-cue-contracts/src/context.rs", "crates/smart/eliot-cue-contracts/src/error.rs"]
prerequisite_contract = "eliot-cue-contracts FC-CUE-OBSERVED, FC-CUE-CONTEXT, FC-CUE-SOURCE-HANDLE, FC-CUE-NORMALIZED, FC-CUE-CANONICAL, FC-CUE-COMPARISON-KEY, FC-CUE-PROFILE and FC-CUE-VOCABULARIES in crates/smart/cognitive-rev12-contract-schema-freeze.toml, plus VR-CUE-SCHEMA-REVISION"
error_behavior = "Every rejection is a CueContractError variant, never a formatted string and never a collapsed code: a retired schema_revision is InvalidText, a blank or oversized observed value is InvalidText or BoundExceeded, a malformed nested identity is Foundation, a duplicated comparison key identity is DuplicateIdentity, and a canonical that disagrees with its outcome or its observed kind is Foundation. UNKNOWN has no representation here: an unclassifiable normalization is NormalizationOutcome::Unsupported with a reason and a None canonical, and a many-to-one mapping is Ambiguous with its rivals preserved rather than resolved."
implementation_steps = "1. Construct ObservedCue from the caller's source material and validate it. 2. Load the NormalizationProfile and validate it; the profile_revision is the invalidation axis. 3. Produce the canonical identity and its comparison keys under that profile, or record Lossless, AuthorizedLoss, Ambiguous or Unsupported. 4. Call NormalizedCue::validate, which enforces the outcome-to-canonical coupling, the MAX_COMPARISON_KEYS 8 and MAX_TRANSFORMATION_STEPS 16 bounds, key uniqueness and match-mode admissibility. 5. Return the record; do not build a snapshot, admit a binding or schedule anything."
acceptance_positive = "a lossless normalization under one profile yields a NormalizedCue whose canonical kind equals the observed kind and whose every comparison key carries an equal profile; a round trip of that record through the wire is byte-stable"
acceptance_negative = "a record written against a retired schema_revision is rejected at decode rather than reinterpreted; a canonical present with outcome Ambiguous, and a canonical absent with outcome Lossless, are both rejected; a ninth comparison key is rejected as BoundExceeded; a key whose match_mode is inadmissible for the canonical kind is rejected; an oversized observed value is rejected as BoundExceeded and not truncated"
proof_status = "STATIC_FIELD_CONTRACT_ONLY; the acceptance above is NOT_EXECUTED and no test is claimed by this row"

