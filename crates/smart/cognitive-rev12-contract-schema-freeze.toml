# ---------------------------------------------------------------------------
# r11 field contract for the eliot-memory-projection-contracts selection family
# (contracts/selection.rs). These six types were already [[frozen_type]] rows closed as
# CC-MEMORY-PROJECTION-SCHEMA, but at TYPE level only. r11 states the field contract
# over the SAME types and creates no new owner.
#
# Wire naming here: every struct in selection.rs is `#[serde(deny_unknown_fields)]` with
# no rename_all, so every wire_name equals the Rust field name. SelectionDisposition is
# `#[serde(tag = "disposition", deny_unknown_fields)]`, so it is INTERNALLY TAGGED on
# the wire with the literal tag "disposition"; NOT_SELECTED additionally carries a
# `reason` payload key. ExclusionReason is a plain unit-variant enum, so its wire
# spelling is the Rust member name with no case change.
#
# CONTRACT_VERSION for this crate is 0.2.0 (crates/foundation/eliot-memory-projection-
# contracts/src/contracts.rs:75), NOT 1.0.0. VR-EXACT-CONTRACT-VERSION is equality on
# that triple, so a 1.0.0 record written against another family is a VersionMismatch.
# ---------------------------------------------------------------------------

[[field_contract]]
type_id = "FC-SEL-QUERY-INTENT"
crate = "eliot-memory-projection-contracts"
type_rust_path = "eliot_memory_projection_contracts::MemoryQueryIntent"
disposition = "FROZEN_EXACT"
wire_naming = "selection.rs declares the struct #[serde(deny_unknown_fields)] with no rename_all, so every wire_name below equals the Rust field name. contract_version is the eliot_contracts ContractVersion triple {major, minor, patch}, not a string."
validator = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::MemoryQueryIntent::validate"
error_family = "crates/foundation/eliot-memory-projection-contracts/src/contracts/error.rs::MemoryProjectionError"
provenance_privacy = "Declares no disclosure class of its own and carries no memory body: it names a scope, a kind allowlist and a limit. The privacy posture of anything it points at is carried by the nested MemoryScopeBinding owner and by the batch, not widened here."
invalidation_rule = "The intent pins one exact binding and one exact allowlist. The trace echoes the allowlist and recomputes intent_digest over the canonical intent bytes, so an intent changed after the trace was produced is caught as a digest mismatch rather than reinterpreted. Version compatibility is VR-EXACT-CONTRACT-VERSION on ContractVersion 0.2.0, equality only."

[[field_contract_field]]
field_id = "FC-SEL-QUERY-INTENT.contract_version"
type_rust_path = "eliot_memory_projection_contracts::MemoryQueryIntent"
wire_name = "contract_version"
owner_rust_type = "eliot_contracts::ContractVersion"
requiredness = "REQUIRED"
none_meaning = "no None variant exists; a record with no version cannot be matched against this crate's own CONTRACT_VERSION and is not representable"
bound_or_variants = "exact equality with CONTRACT_VERSION 0.2.0 declared at crates/foundation/eliot-memory-projection-contracts/src/contracts.rs::CONTRACT_VERSION; no range, no negotiation"
identity_binding = "the contract revision this intent was written against"
validator = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::MemoryQueryIntent::validate"
validation_error = "MemoryProjectionError::VersionMismatch"

[[field_contract_field]]
field_id = "FC-SEL-QUERY-INTENT.binding"
type_rust_path = "eliot_memory_projection_contracts::MemoryQueryIntent"
wire_name = "binding"
owner_rust_type = "MemoryScopeBinding"
requiredness = "REQUIRED"
none_meaning = "no None variant exists; an intent with no binding names no scope and could select from any batch, so it is not representable"
bound_or_variants = "closed by the nested owner: task_id, scope_id, session_id (Option) and state_fence, all validated in full by MemoryScopeBinding::validate with MAX_SCOPE_CHARS 256 on scope_id"
identity_binding = "the exact task, scope, optional session and fence the selected batch must carry exactly; select() rejects a batch whose binding differs as BindingMismatch"
validator = "crates/foundation/eliot-memory-projection-contracts/src/contracts/record.rs::MemoryScopeBinding::validate"
validation_error = "MemoryProjectionError::Bounds"

[[field_contract_field]]
field_id = "FC-SEL-QUERY-INTENT.kinds"
type_rust_path = "eliot_memory_projection_contracts::MemoryQueryIntent"
wire_name = "kinds"
owner_rust_type = "Vec<MemoryKind>"
requiredness = "EMPTY_SET_ALLOWED_NO_EMPTY_IS_REJECTED"
none_meaning = "there is no None and an EMPTY LIST IS REJECTED: narrowing must be explicit, so an empty allowlist is SelectionError::EmptyKinds rather than a silent select-everything"
bound_or_variants = "closed set of the six MemoryKind members {Episode, Observation, Procedure, Concept, NegativeMemory, Counterexample}; duplicates rejected; length is bounded only by the batch bound MEMORY_PROJECTION_MAX_RECORDS 256"
identity_binding = "the explicit kind allowlist. It is a caller NORMALIZATION request, not evidence: a kind present in the allowlist is not thereby present in the batch, and select() emits a Selected entry only for a record actually carried"
validator = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::MemoryQueryIntent::validate"
validation_error = "SelectionError::DuplicateKind"

[[field_contract_field]]
field_id = "FC-SEL-QUERY-INTENT.limit"
type_rust_path = "eliot_memory_projection_contracts::MemoryQueryIntent"
wire_name = "limit"
owner_rust_type = "usize"
