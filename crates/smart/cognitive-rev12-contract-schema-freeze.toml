code_reference = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs::select is the only producer, and it has zero callers"
measured_fact = "Measured by git grep over this base commit: `git grep -rln MemorySelectionTrace -- '*.rs'` returns exactly two files, both inside the owning crate (src/contracts.rs, which re-exports it, and src/contracts/selection.rs, which defines it). `git grep -rln 'MemoryQueryIntent|MemorySelectionPolicy|SelectionCoverage' -- '*.rs'` returns the same two files. The crate's own tests/projection_contracts.rs references none of the six selection types. So the selection contract is fully declared, fully frozen at field level at r11, and entirely unconsumed. This is a real adoption gap, not a contract gap."
document_reference = "docs/architecture/I12-06-cue-binding.md and the #196 C1 card require a contract to be bound to a real caller before it counts as delivered. The card text names memory selection as something that 'exists', which is true of the contract and false of its adoption, and the two must not be conflated."
freeze_reference = "crates/smart/cognitive-rev12-contract-schema-freeze.toml::[[coverage_accounting]] family = 'eliot-memory-projection-contracts-selection' carries owner_is_complete = false for exactly this reason, and [[assignment_binding]] AB-MEM-SELECTING names NO in-tree caller rather than naming a consumer that does not exist."
proposed_repair = "Do not invent a consumer. The decision owner either (a) names the consumer crate that genuinely needs kind narrowing from a whole batch, and that crate's lane wires it, or (b) records that selection is delivered-but-unconsumed and carries it as a known adoption gap. Option (b) is the honest default when no consumer has been identified. What must NOT happen is a binding row naming a plausible-sounding crate with no call site, which is the failure mode this row exists to prevent."
owning_task = "the cognitive-wave integrator named as integration_owner at crates/foundation/eliot-memory-projection-contracts/module.toml"
rust_change_needed = false
why_no_rust_change = "The contract is complete and correct at 6 of 6 members with resolving validator anchors. What is missing is a caller, and a caller is an integration decision, not a Rust fix."
status = "OPEN_OWNED"

[[disagreement]]
id = "DIS-SEL-DENOMINATOR-NAMING"
family = "eliot-memory-projection-contracts-selection"
disposition = "REPORTED_NOT_INVENTED"
field = "crates/smart/cognitive-rev12-contract-schema-freeze.toml::[[denominator]] id = 'DEN-MEMORY-SELECTION' versus the crate's own type name"
code_reference = "crates/foundation/eliot-memory-projection-contracts/src/contracts/selection.rs:222 doc comment on SelectionCoverage reads 'Selection denominator: exactly the records presented to selection.'"
measured_fact = "The crate names the type SelectionCoverage and calls it a denominator in prose; this file names the row DEN-MEMORY-SELECTION and adds a [[denominator]] row for it. Both are true and they do not conflict, but the two vocabularies are not obviously the same word and a future reader could reasonably read DEN-MEMORY-SELECTION as the batch denominator that already exists separately as the ProjectionCoverage/DenominatorState pair. The selection crate is explicit that SelectionCoverage is DELIBERATELY a different type from the batch denominator, with different field names, precisely so the batch total can never be echoed under a filtered set."
document_reference = "docs/architecture/I5.22-schema-and-migration-rules.md requires an exact referent for a binding identifier rather than a nearest match. A denominator row whose name reads like a sibling denominator is exactly the case where a reader matches on the nearest name."
freeze_reference = "crates/smart/cognitive-rev12-contract-schema-freeze.toml::[[denominator]] id = 'DEN-MEMORY-SELECTION', whose definition column states the independence rule and the deliberate type difference in full."
proposed_repair = "No repair is required to the DEN-MEMORY-SELECTION row, which already states the distinction in its definition column. The bounded improvement belongs to a reader-facing index: when the catalogue is next touched by the integration owner, the [[denominator]] set should carry one line naming which row is the batch denominator and which is the selection denominator, so the two are never confused by name. Recorded here so the near-match is visible rather than left for a reader to trip over."
owning_task = "the cognitive-wave integrator that owns crates/smart/cognitive-rev12-contract-schema-freeze.toml, named as integration_owner at crates/smart/cognitive-rev12-contract-schema-freeze.toml::integration_owner"
rust_change_needed = false
why_no_rust_change = "Both sides describe the same Rust correctly; only the naming could mislead, and the row that could mislead already carries an explicit statement of the distinction."
status = "OPEN_OWNED"

[[disagreement]]
id = "DIS-VR-DENY-UNKNOWN-SCOPE"
family = "cross-family, affects eliot-observation-contracts, eliot-epistemic-contracts and eliot-memory-curation-contracts"
disposition = "REPORTED_NOT_INVENTED"
field = "the literal scope of VR-DENY-UNKNOWN-FIELDS as against the serde attributes the owner crates actually declare"
code_reference = "crates/foundation/eliot-observation-contracts/src/failure_observation.rs:108 declares FailureOmissionClass with #[serde(rename_all = \"SCREAMING_SNAKE_CASE\")] and NO deny_unknown_fields. Measured across crates/smart/eliot-memory-curation-contracts/src: all sixteen declared enums are unit-only and every one of them carries rename_all with NO deny_unknown_fields. The same holds for AdmittedKind and Currentness in crates/smart/eliot-epistemic-contracts/src and for CoverageDisposition in crates/foundation/eliot-observation-contracts/src."
measured_fact = "VR-DENY-UNKNOWN-FIELDS in this file states 'Every frozen wire shape carries deny_unknown_fields (or a checked wire TryFrom route).' Measured against the source, that sentence is TRUE of every STRUCT in these families and FALSE of every ENUM: no enum in any of the three crates carries deny_unknown_fields, and no crate routes enum decode through a checked TryFrom. So the rule as literally written does not hold over the full set of frozen wire shapes it claims to cover. This is a defect in the RULE'S WORDING, not a demonstrated defect in the wire behaviour: the serde container attribute documentation describes deny_unknown_fields in terms of unknown FIELDS, and these sixteen enums are all unit-only with no payload fields for such an attribute to govern. What this row deliberately does NOT claim is that an unknown enum MEMBER decodes successfully; this work unit ran no cargo, so no decode was executed and no such claim is made here."
document_reference = "docs/architecture/I05-16-common-durable-fields.md and I5.22-schema-and-migration-rules.md require a closed wire shape at a durable boundary. I5.22 in particular requires an exact referent for a rule identifier rather than a nearest match, which is why a rule that over-generalizes is recorded rather than quietly narrowed."
freeze_reference = "crates/smart/cognitive-rev12-contract-schema-freeze.toml::[[version_rule]] id = \"VR-DENY-UNKNOWN-FIELDS\". The r9 and r10 field-contract wire_naming columns already describe the struct-side and enum-side behaviour SEPARATELY and do not claim deny-unknown-fields on the enum side, so no [[field_contract]] row is contradicted by this."
proposed_repair = "Narrow the rule's wording at its owner, do not widen the code on the strength of it. The honest replacement states the rule over structs and states separately, for enums, that closedness is a property of the OWNER-DECLARED member set validated by the owner validator named on each row, and that whether an unknown member is rejected at decode is a per-crate serde question that was NOT EXECUTED here. The alternative repair, adding deny_unknown_fields to sixteen enums, is a behavioural change to durable wire contracts across three crates and is the crate owners' decision, not this issue's. Editing the freeze to keep the broad sentence while the source does not support it would be ratifying an incorrect claim, which is precisely what this row prevents."
owning_task = "the cognitive-wave integrator that owns crates/smart/cognitive-rev12-contract-schema-freeze.toml, named as integration_owner at crates/smart/cognitive-rev12-contract-schema-freeze.toml::integration_owner, for the rule wording; and the crates/foundation/eliot-observation-contracts, crates/smart/eliot-epistemic-contracts and crates/smart/eliot-memory-curation-contracts owner lanes respectively, for any serde-level change"
rust_change_needed = false
why_no_rust_change = "The observed fact is about which container attributes the owner crates declare, not about behaviour this work unit is entitled to change or could verify without running cargo. The rule wording is a documentation correction inside this file's own owner scope; the serde attributes are three other crates' durable wire contracts."
status = "OPEN_OWNED"

