# r8 exists for exactly one reason, and it is a reconciliation rather than a
# new claim. The r7 `ProjectionCoverage` denominator_note stated a LOWER BOUND
# ("Known{total} must cover projected plus omitted volume") and never mentioned
# the resume frontier, so on its own it was not proof of completeness: an empty
# batch declaring Known{total:1} with no omissions, no frontier,
# truncated=false and revalidation_required=false satisfied it. The Rust owner
# `MemoryProjectionBatch::validate` in
# crates/foundation/eliot-memory-projection-contracts/src/contracts/batch.rs was
# already stricter than the note, because its only producer
# (`eliot-memory-projection-provider::project_batch`) partitions every observed
# record into exactly one of records/omissions/frontier and already required
# `request.denominator_total == observations.len()`. This candidate states the
# rule the owner code actually enforces, so the contract and the code no longer
# disagree. No type, field, enum, denominator id, or cell binding is added,
# removed, or renamed by r8; the only semantic change is the wording of one
# denominator_note. Every verdict bound to the r7 digest is invalidated by this
# revision rather than edited, per the [readback] rule above.
