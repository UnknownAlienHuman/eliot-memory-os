# --- completeness accounting ----------------------------------------------
[[completeness_rule]]
id = "CR-CUR-SCREEN-COMPLETE"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-RESULT.state", "FC-CUR-RESULT.coverage", "FC-CUR-RESULT.source"]
rule = "ResultState Complete is accepted only when five conditions hold together: the source denominator is complete, the frontier is complete with an empty remaining list, the coverage member order equals the source member order, no member carries the Unprocessed disposition, and next_cursor is None. Any one of them failing yields Partial, Blocked or Unknown, so incomplete, truncated, blocked or unprocessed evidence cannot become Complete by default. A Partial result carrying a complete frontier is separately rejected."
enforced_by = "crates/smart/eliot-memory-curation-contracts/src/result.rs::CurationScreenResult::validate"
independent_expected_set = "the SourceSnapshot's own member list and the request's FiniteDenominator, both declared by the source owner and compared against the result. The result's coverage list is the thing under test and is never used as its own expected set."
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUR-DENOMINATOR-RECONCILE"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-DENOMINATOR.total_members", "FC-CUR-DENOMINATOR.declared_member_ids", "FC-CUR-SOURCE-SNAPSHOT.members"]
rule = "The declared count must be at least the unique declared member identity count and at least the observed page size. Complete coverage additionally requires the count to EQUAL the unique declared member count, so a count can never exceed the members it declares and a bare count is never a completeness claim. Duplicate declared identities are rejected rather than deduplicated."
enforced_by = "crates/smart/eliot-memory-curation-contracts/src/source.rs::FiniteDenominator::validate"
independent_expected_set = "the owner-declared member identity list, compared against the total; the total is never compared against a list the caller derived from its own findings"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUR-COVERAGE-SUBSET"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-RESULT.coverage.members", "FC-CUR-RESULT.coverage.next_cursor", "FC-CUR-RESULT.findings"]
rule = "Every member the coverage names, every member a finding or protection row names, and every member an eligibility row names must be a member of the source. A resume cursor additionally reconciles its position, its processed-member digest, its usage counters and its predecessor digest against the source member order, so a bounded screen cannot skip, reorder or double-count a member across pages."
enforced_by = "crates/smart/eliot-memory-curation-contracts/src/coverage.rs::CumulativeCursor::validate_progress"
independent_expected_set = "the SourceSnapshot member order declared by the source owner; the coverage order is what is checked and is never its own reference"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUR-UNKNOWN-NOT-COMPLETE"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-RESULT.state", "FC-CUR-PROTECTION.decision", "FC-CUR-ELIGIBILITY.status", "FC-CUR-FINDING.proof", "FC-CUR-SOURCE-SNAPSHOT.availability"]
rule = "Unknown and incomplete evidence cannot become Complete or Eligible by default anywhere in this family, and each uncertainty is a NAMED value rather than an absence: SourceAvailability carries UNKNOWN and UNAVAILABLE; ProtectionEvidenceState carries STALE, MISSING, MALFORMED, UNAVAILABLE and UNKNOWN, any of which forces the decision to UNKNOWN; ProtectionDecision carries UNKNOWN; EligibilityStatus carries UNKNOWN_BLOCKED and INCOMPLETE_TRUNCATED; FindingProof carries UNKNOWN; MemberDisposition carries UNPROCESSED; and ResultState carries BLOCKED and UNKNOWN. None of them has a default that reads as the affirmative."
enforced_by = "crates/smart/eliot-memory-curation-contracts/src/protection.rs::ProtectionAssessment::validate"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUR-AXES-STAY-DISTINCT"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-VOCABULARIES.CurationDimension", "FC-CUR-VOCABULARIES.DimensionOutcome"]
rule = "Existence, support, lifecycle, accessibility and permitted influence are five separate axes with one DimensionOutcome each. A Clear outcome on one axis never stands in for an Unknown on another, and in particular an ACCESSIBILITY verdict is never read as a PERMITTED_INFLUENCE verdict. The five members are declared as CurationDimension::ALL by the owner, so the expected axis set comes from the owner and is not restated here."
enforced_by = "crates/smart/eliot-memory-curation-contracts/src/dimensions.rs::MemberDimensions::validate"
independent_expected_set = "CurationDimension::ALL as declared by the owner crate, compared against the verdicts actually present"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-CUR-NO-APPLIED-AUTHORITY"
family = "eliot-memory-curation-contracts"
applies_to = ["FC-CUR-ELIGIBILITY.status", "FC-CUR-RESULT.member_sets", "FC-CUR-RESULT.protection", "FC-CUR-FINDING.invalidated_by"]
rule = "Nothing in this family applies a lifecycle change, creates canonical truth, grants authority, schedules work, produces an external effect, finishes a task or promotes itself. A finding states evidence, an eligibility row is a neutral handoff status, a protection assessment is a verdict that can only remove a member from consideration, and a member set is a proposal surface. The crate declares allowed_effects = [] and owned_mutable_state = [], so this is a structural property of the crate and not only a field rule."
enforced_by = "crates/smart/eliot-memory-curation-contracts/module.toml"
independent_expected_set = "not applicable; this rule is a default prohibition, not a count"
evidence_required = "NOT_EXECUTED; static field contract only"


