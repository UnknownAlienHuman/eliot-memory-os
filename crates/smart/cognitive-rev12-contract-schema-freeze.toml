acceptance_positive = "a derived candidate validates, and an AdmittedCueBindingProjection whose receipt matches the candidate digest and whose task, scope and fence match the request is accepted as a snapshot member"
acceptance_negative = "a candidate with disposition Admitted but no admission receipt is never a member; a candidate whose digest changed after admission is rejected; a target carrying control characters is rejected as InvalidText; a duplicate candidate identity in one result is rejected as DuplicateIdentity"
