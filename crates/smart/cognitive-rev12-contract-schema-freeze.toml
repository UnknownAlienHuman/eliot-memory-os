[[version_rule]]
id = "VR-EXACT-CONTRACT-VERSION"
rule = "A record, batch, set, or view written against a different ContractVersion triple is rejected with VersionMismatch. Equality only; no range, no negotiation."
applies_to = ["eliot-memory-projection-contracts", "eliot-memory-projection-provider", "eliot-context-contracts", "eliot-epistemic-contracts"]

[[version_rule]]
id = "VR-EXACT-SCHEMA-VERSION"
rule = "Canonical projections require CANONICAL_PROJECTIONS_SCHEMA_VERSION exactly; learning bindings require LEARNING_SCHEMA_VERSION exactly. Mismatch fails closed."
applies_to = ["eliot-context-contracts", "eliot-learning-contracts"]

[[version_rule]]
id = "VR-DENY-UNKNOWN-FIELDS"
rule = "Every frozen wire shape carries deny_unknown_fields (or a checked wire TryFrom route). Unknown fields fail at the boundary; similarity scores, ranks, and model judgments have no field to hide in."
applies_to = ["all frozen types"]

[[version_rule]]
id = "VR-NO-AGGREGATE-SCORE"
rule = "No frozen type carries an aggregate intelligence, confidence, utility, or learning score. Installed, delivered, executed, and useful stay distinct; acknowledgement is not use, use is not adherence, adherence is not benefit."
applies_to = ["all frozen types"]

[[version_rule]]
