# r10 is the eliot-memory-curation-contracts field-level contract, plus two
# tables that did not exist before: the disagreement register and the downstream
# assignment bindings. Same row shape, same reading discipline and same
# no-derived-completeness rule as r9 above.
#
# The disagreement register exists because W5 requires a real Rust-versus-I-section
# conflict to be recorded where it is found rather than resolved by editing the
# freeze to match the code. Each [[disagreement]] row names the exact field, both
# references, the measured fact, the proposed repair and the existing owning task.
# None of them edits a frozen type to agree with a wrong manifest, and none of them
# adds a type to satisfy a manifest that names something the crate does not define.
#
# The assignment bindings exist because a downstream agent otherwise receives a
# contract without a caller. Each [[assignment_binding]] row names the concrete
# input and output Rust paths, the exact definition/schema revision, the first
# real consumer found by git grep rather than a guessed one, the owned files, the
# prerequisite field-contract rows, the typed error and unknown behaviour, ordered
# implementation steps, and the later positive and negative acceptance. Every
# first_consumer in these rows is a function that exists on this base commit.
#
# r10 was also drafted as a candidate numbered r9 and is renumbered for the same
# reason r9 was renumbered above. Its content is unchanged by the renumbering.
