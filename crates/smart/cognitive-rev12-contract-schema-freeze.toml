denominator_definition = "The whole-file member denominator is the count of [[field_contract]] type rows, one row per named type. It is NOT a count of Rust types in the tree, because most Rust types in these families are correctly unrepresented here as second owners or as nested vocabulary. Measured at r12 by crate: 19 eliot-cue-contracts + 13 eliot-memory-curation-contracts + 11 eliot-observation + 7 eliot-dreamer-contracts + 6 eliot-memory-projection-contracts + 5 eliot-context-contracts + 4 eliot-observation-contracts + 2 eliot-learning-contracts + 1 eliot-epistemic-contracts = 68. The recheck_procedure below recomputes this number rather than restating it, and is the authority."
disposition_split = "across the whole file at r12: 68 [[field_contract]] type rows, of which 12 carry disposition REFERENCED_NOT_FROZEN and 56 carry FROZEN_EXACT; and 7 [[family_disposition]] rows, of which 4 are REUSED_EXACT and 3 are MISSING_CONTRACT_DECISION. The 12 REFERENCED_NOT_FROZEN rows break down as 7 in eliot-cue-contracts, 3 in eliot-memory-curation-contracts, 1 in eliot-dreamer-contracts (FC-DRM-SOURCE-STATUS) and 1 in eliot-context-contracts (FC-CTX-SEMANTIC-ROLE)."
field_rows = 416
owner_is_complete = false
incomplete_reason = "THREE of the seven C1 families are NOT complete and cannot be made complete by this work unit, because each lacks a Rust owner: MemoryContextProjectionRequest, the rev12 closed seven-class provider enum, and the typed skill/tool/job evidence projections. Each is dispositioned, measured and assigned an exact owning task in [[family_disposition]] and [[not_frozen]], each contributes ZERO to every count in this table, and [[cell_binding]] order 80 is blocked by the third of them. A sixth family, memory selection, has a complete CONTRACT at 6 of 6 members but zero adoption and zero callers, which is why its owner_is_complete is false even though every member is frozen. r12 did not change any of those: the three ownerless rows are unaffected by adding field contracts elsewhere. The four families added at r12 are themselves declared incomplete on their own rows for SCOPE reasons -- dreamer, context and learning each have large parts of their crate outside the frozen sub-family -- and those scope gaps are stated per row rather than absorbed here. The Complete owner rows are cue at 19 of 19, curation at 13 of 13, failure observation at 4 of 4, provider contribution at 1 of 1 and governor-observation classification at 11 of 11, each with its recheck_procedure stated on its own row."
omission_axis = "Per-family, as stated on each owner row. No single cross-family omission axis is declared here, because these families share no denominator and a combined one would be a count that proves nothing."
unknown_behaviour = "A NOT_FROZEN row that has been measured and assigned an owner is STILL not frozen. Measuring it changes it from an unexplained omission into a visible blocked row; it does not move it into any Complete count, and this file states no Complete claim of its own."
recheck_procedure = "python -c \"import tomllib; d=tomllib.load(open('crates/smart/cognitive-rev12-contract-schema-freeze.toml','rb')); print(len(d['family_disposition']), len(d['field_contract']), len(d['field_contract_field']), len(d['coverage_accounting']), len(d['not_frozen']))\" returns 7 68 416 10 3, and the second number is the declared_member_denominator above. This table itself has TEN rows at r12: five owner rows at r11 plus four added at r12, plus this aggregate."
not_frozen_rows_in_family = "3, all dispositioned MISSING_CONTRACT_DECISION, all contributing zero."
recheck_note = "This aggregate row is the only place in the file that states a whole-file total. It states a COUNT and explicitly refuses to treat that count as coverage: at r12 nine of the issue's seven families carry field contracts and every one of them is a PARTIAL slice of its crate rather than the whole crate, one family is frozen at field level with zero adoption, and three rows carry no owner at all. A count of 68 type rows across nine families is not evidence that the contracts behind them are complete."


