[[fence]]
id = "F-NO-MODEL-STORAGE-NETWORK"
rule = "Projection cells own no model route, storage access, network call, canonical write, admission, delivery/use receipt, lease, or effect behavior."
[[fence]]
id = "F-NO-REACTIVE-PATH-D"
rule = "Projection packages must not implement reactive path D (ContextPlanningView production, cue activation wiring, session delivery, reactive feed). Reactive producers belong to #1942."
[[fence]]
id = "F-NO-W9-CONSUMER-INVENTION"
rule = "Projection packages must not emit W9 consumer assessments (MemoryEcologyAssessment, NegativeMemoryExtinctionCandidate, CognitiveQualityAssessment, CommonGroundAssessment, ScopedUnderstandingAssessment) or their field contracts. Those outputs belong to the W9 consumer crates."
[[fence]]
id = "F-NO-AUTO-TRIGGER"
rule = "No automatic GitHub Actions trigger is introduced. Workflows stay workflow_dispatch only."
[[fence]]
id = "F-PACKAGE-PROOF-BEFORE-EDGE"
rule = "Each target package builds independently against this freeze and exposes only its declared projection/provider contract. Package proof records PACKAGE_PROOF_ONLY before any edge promotion. Package proof alone never reports product support."
