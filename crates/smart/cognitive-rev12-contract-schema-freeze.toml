error_behavior = "Every rejection is a CueContractError variant, never a formatted string and never a collapsed code: a retired schema_revision is InvalidText, a blank or oversized observed value is InvalidText or BoundExceeded, a malformed nested identity is Foundation, a duplicated comparison key identity is DuplicateIdentity, and a canonical that disagrees with its outcome or its observed kind is Foundation. UNKNOWN has no representation here: an unclassifiable normalization is NormalizationOutcome::Unsupported with a reason and a None canonical, and a many-to-one mapping is Ambiguous with its rivals preserved rather than resolved."
