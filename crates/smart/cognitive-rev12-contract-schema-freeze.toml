type_rust_path = "eliot_memory_curation_contracts::CurationScreenRequest"
wire_name = "profile"
owner_rust_type = "ScreenProfile"
requiredness = "REQUIRED"
none_meaning = "no None variant exists; a screen with no profile has no rule, no precedence and no limits"
bound_or_variants = "ScreenLimits bounds max_items, max_references, max_bytes, max_work_units and max_output_bytes, plus an optional deadline_ms and cancellation_grace_ms; the result is rejected when coverage or usage exceeds any of them"
