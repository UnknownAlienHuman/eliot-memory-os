# orders 1-43 and cognitive-wave-09.toml assigns orders 76-86. This freeze
# binds the current orders below and does not invent mappings for the stale
# numbers. Code and document disagree here; the disagreement is reported,
# not resolved by invention.
[cell_number_note]
historical_numbers = [69, 70, 72, 73, 75]
