requiredness = "REQUIRED"
none_meaning = "no None variant exists; an undeclared denominator cannot be reconciled against an observed page, so it is not representable"
bound_or_variants = "closed by the nested owner; DenominatorCoverage Complete is accepted only when total_members equals the unique declared member count"
identity_binding = "the declared member denominator for this screen. It is the INDEPENDENT expected set every coverage claim is compared against, never a copy of the observed page."
