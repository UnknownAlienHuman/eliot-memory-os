[[assignment_binding]]
id = "AB-CUE-NORMALIZER"
order = 10
crate = "eliot-cue-contracts"
consumer_crate = "eliot-cue-normalizer"
functional_cell = "smart.cue.contracts"
input_rust_path = "eliot_cue_contracts::ObservedCue"
output_rust_path = "eliot_cue_contracts::NormalizedCue"
definition_revision = "CONTRACT_REVISION 2.0.0 by exact string equality through eliot_cue_contracts::is_supported_schema_revision; the equality is on the record's own schema_revision field, not on the crate constant alone"
first_consumer = "crates/smart/eliot-cue-normalizer/src/lib.rs::normalize_cue"
owned_files = ["crates/smart/eliot-cue-contracts/src/normalization.rs", "crates/smart/eliot-cue-contracts/src/observation.rs", "crates/smart/eliot-cue-contracts/src/identity.rs", "crates/smart/eliot-cue-contracts/src/context.rs", "crates/smart/eliot-cue-contracts/src/error.rs"]
