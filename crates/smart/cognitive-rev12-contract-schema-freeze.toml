[[completeness_rule]]
id = "CR-OBSG-NO-SILENT-REPLAY"
family = "eliot-observation"
applies_to = ["FC-OBSG-ADMISSION-RESULT.replayed", "FC-OBSG-JOURNAL-ENTRY.result"]
rule = "A replay is a TRANSIENT RESULT AND MAY NOT BECOME A SECOND ADMISSION. ObservationJournal::admit returns Replayed only when the stored entry's request_digest EQUALS the digest recomputed from the resubmitted submission; a key match with differing bytes is a Conflict rejection instead, never a replay. The completeness consequence is that the journal can never contain two admissions of one canonical request, and from_entries REFUSES a Replayed member outright with PersistedReplay so a replay marker cannot enter canonical journal input at all. The storable result set is therefore exactly {accepted, rejected}."
enforced_by = "crates/governor/eliot-observation/src/lib.rs::ObservationJournal::from_entries"
independent_expected_set = "the STORED entry's request_digest compared against the digest recomputed by re-canonicalizing the resubmitted submission; the journal's own entries map is never its own expected set, and the recomputation is the independent side"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-OBSG-RECEIPT-IS-REPLAY"
family = "eliot-observation"
applies_to = ["FC-OBSG-ADMISSION-RECEIPT.request_digest", "FC-OBSG-ADMISSION-RECEIPT.candidate_disposition", "FC-OBSG-ADMISSION-RECEIPT.evidence_digest", "FC-OBSG-ADMISSION-RECEIPT.record_id"]
rule = "AN ADMITTED RECEIPT PROVES ITSELF BY REPLAYING ITS OWN INPUTS, NOT BY BEING STORED CORRECTLY. validate() reconstructs the equivalent ObservationSubmission from the receipt's own fields, runs the FULL submission validation on it, recomputes the request digest and recomputes the disposition and the evidence digest. Any disagreement is refused. So a receipt cannot be edited field by field: changing the record_id, the disposition, the evidence or the evidence_digest without changing every other field consistently makes the record fail validation rather than become a different truth. This is the strongest completeness statement in this family and it is a statement about INTEGRITY rather than about coverage."
enforced_by = "crates/governor/eliot-observation/src/lib.rs::ObservationAdmissionReceipt::validate"
independent_expected_set = "the reconstructed submission's own recomputed request_digest, disposition and evidence digest; the stored fields are the thing under test and are never their own expected set"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-OBSG-REJECTION-IS-NOT-SILENCE"
family = "eliot-observation"
applies_to = ["FC-OBSG-REJECTION.all_contract_errors", "FC-OBSG-REJECTION.safe_capture_fallback"]
rule = "A REFUSAL MUST BE EXPLICIT AND MUST NOT DESTROY THE OBSERVATION. Two coupled rules. First, all_contract_errors is required to be NON-EMPTY: an empty list is refused with Empty, because a rejection reporting no contract error is exactly the shape by which a silent failure would be recorded as a refusal. Second, a rejection is not a discard: every rejection carries a safe_capture_fallback candidate where one could be built, so a refused observation is preserved rather than lost. The residual loss is the reuse ceiling on that candidate, which is a typed closed marker and never an unbounded gap."
enforced_by = "crates/governor/eliot-observation/src/lib.rs::ObservationAdmissionRejection::validate"
independent_expected_set = "the nonempty error list required by the owner itself; there is no list in this family that could serve as a self-referential completeness reference, and none is used"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-DRM-DENOMINATOR-NOT-VACUOUS"
family = "eliot-dreamer-contracts"
applies_to = ["FC-DRM-DEPENDENCY-DENOMINATOR.complete", "FC-DRM-DEPENDENCY-DENOMINATOR.members"]
rule = "COMPLETE WITH NO MEMBERS IS REFUSED, so an empty declared set can never be vacuously complete, and the completeness flag is covered by the recomputed digest so it cannot be flipped in isolation. validate() raises Missing when complete is true and members is empty, requires member identities to be duplicate-free so the count cannot be inflated by repetition, and recomputes the digest over (schema_version, denominator_id, members, complete) so a stored digest that disagrees is DigestMismatch. AcceptedSourceProjection is DELIBERATELY OUTSIDE THIS RULE: its owner states it covers exactly its listed refs and makes no completeness claim, so it is never counted toward a Complete figure."
enforced_by = "crates/smart/eliot-dreamer-contracts/src/self_query/source.rs::ArchitectureDependencyDenominator::validate"
independent_expected_set = "the declared member set named by the OWNER's own maximum constant MAX_DEPENDENCY_MEMBERS and by the digest preimage; the members list under test is compared against the digest computed from it plus the three other declared fields, never against a copy of itself"
evidence_required = "NOT_EXECUTED; static field contract only"

[[completeness_rule]]
id = "CR-DRM-PAIR-IS-JOINT"
family = "eliot-dreamer-contracts"
applies_to = ["FC-DRM-NORMATIVE-PAIR.pair_key", "FC-DRM-SOURCE-SNAPSHOT.revision", "FC-DRM-SOURCE-SNAPSHOT.digest", "FC-DRM-ACCEPTED-SOURCE-PROJECTION.sources"]
rule = "THE EDITION IS A JOINT BINDING AND A PROJECTION MAY NOT MIX ACCEPTANCES. Three coupled exactness rules, none of which has a fallback. A source snapshot's revision and digest must both EQUAL the pair's architecture_revision and architecture_digest. A pair_key is RECOMPUTED from the two digests over the versioned preimage and a disagreement is DigestMismatch, not a re-derivation. And within an AcceptedSourceProjection EVERY cited ref's owner must EQUAL pair.accepted_by and its acceptance_receipt must EQUAL pair.acceptance_receipt, so a projection cannot assemble citations from two different acceptances. There is no nearest-version match anywhere in this family: a snapshot from another edition simply does not belong to this pair."
