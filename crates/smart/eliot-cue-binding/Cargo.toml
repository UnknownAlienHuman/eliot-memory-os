[package]
name = "eliot-cue-binding"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Derive bounded cue-binding candidates from an admitted observation, touched resources and an optional expected-reuse hint."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.cue.binding"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 12

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-cue-contracts = { path = "../eliot-cue-contracts" }
eliot-cue-normalizer = { path = "../eliot-cue-normalizer" }
