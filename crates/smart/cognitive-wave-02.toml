schema_version = 4
wave_id = "cognitive-micromodules-wave-02"
status = "PROTOTYPE_ASSIGNMENT_GATED"
base_commit = "7d7f03259cc3d3d90b2fe1af7a6175b13808ece2"
normative_architecture = "ELIOT Architecture 4.5-draft / English edition 2026-08-28"
normative_implementation = "ELIOT Implementation 0.29-draft / English edition 2026-08-28"
purpose = "Add the cross-plane online-learning inner loop and later advisory Dreamer planning handlers without creating new task, scheduler, evaluator, promotion or authority owners."
prerequisite = "D1 capture/read/finish and D3B Context Compiler edges are current enough to compile task-local learning; exact attempt/evaluator/overlay owners must exist."
integration_owner = "cognitive-wave-integrator"
agent_rule = "One agent receives exactly one active module manifest, its frozen contract revision, one-hop providers/consumers, old failure, discriminator, exact write scope, proof ceiling and Product Pulse."
workspace_rule = "Prototype Cargo manifests remain outside the root workspace until implementation, isolated package proof, affected edge proof, current-main rebase and integration review."
size_rule = "10000 LOC is a soft review ceiling only; causal cohesion, context/build/test closure, state ownership, proof and replacement boundaries decide split or merge."
source_rule = "Current source, Cargo metadata/diagnostics and exact runtime evidence outrank prototype manifests; manifests are assignments, not support claims."
old_branch_rule = "cognitive-crates-prototypes-01 is superseded as an assignment source; only individually revalidated donor ideas may be reused."
gate = "Orders 32-38 require current attempt/evaluator/context edges and D3B_REACTIVE_CONTEXT_PULSE_01. Orders 39-43 require D3A_ORIENTATION_PULSE_01 plus exact Problem/Config/AgentCoordinator provider contracts. Research synthesis remains deferred to Researcher."

[global_boundaries]
forbidden = ["second canonical, operational, task, scheduler, evaluator or promotion owner", "Dreamer source acquisition or Researcher denominator/freeze ownership", "provider/model SDK in pure cognitive cores", "job scheduling, process supervision or route reservation", "truth/support/authority/policy/finish/effect promotion", "unbounded hot-path work", "similarity as exact applicability, causality or proof", "active generation self-modification", "facade semantic recomputation", "implicit scope/disclosure widening"]
required = ["one causal responsibility", "one lifecycle owner or explicit statelessness", "one owner for every mutable state", "typed provider/consumer ports", "independent proof surface and proof ceiling", "local visible degradation", "replacement/removal and merge/rejoin boundary", "Product Objective and exact discriminator"]

[[stage]]
id = "ONLINE_LEARNING_INNER_LOOP"
orders = [32, 38]
gate = "Attempt outcome must change the next compatible attempt through a bounded local overlay or record an evidence-backed no-change disposition; broader influence stays candidate-only."

[[stage]]
id = "ADVISORY_DREAMER_PLANNING_HANDLERS"
orders = [39, 43]
gate = "Conflict, diagnosis, maintenance, configuration and orchestration plans remain typed candidates consumed by existing owners."

[[product_pulse]]
id = "ONLINE_LEARNING_INNER_LOOP_PULSE_01"
scenario = "One consequential attempt produces an evidence-linked AttemptLearningDelta, Governor-admitted task-local overlay, exact next-attempt retrieval/delivery/activation/adherence assessment, and closure or explicit no-change; no cross-task promotion occurs without external owner proof."
required_observables = ["attempt/evaluator evidence exact", "unchanged retry requires declared reason", "overlay cannot change objective/authority/evaluator", "activation and adherence remain orthogonal", "closure/promotion owner external"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

[[product_pulse]]
id = "D3A_ADVISORY_PLANNING_PULSE_01"
scenario = "One bounded self-scope problem yields typed conflict/diagnosis/maintenance/configuration/orchestration candidates that preserve rivals, exact owners, budgets and rollback while executing nothing."
required_observables = ["one handler per causal output", "no task graph mutation", "no config publication", "no maintenance execution", "no problem closure by prose"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

