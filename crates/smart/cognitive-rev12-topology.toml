schema_version = 2
authority = "eliot-cognitive-function-design-rev12"
status = "TARGET_TOPOLOGY_NOT_WORKSPACE_ADMITTED"
physical_crate_count = 31
functional_cell_count = 86
rule = "Cells are assigned independently; physical crates follow owner, dependency, proof and replacement seams rather than function count."

[[crate]]
path = "crates/governor/eliot-observation"
package = "eliot-observation"
action = "extend_existing_crate"
owner = "Governor Observation Owner"
cells = ["governor.observation.classifier"]
seam = "Governor-only deterministic capture classification."

