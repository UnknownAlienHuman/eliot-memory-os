action = "retain_contract_crate"
owner = "Epistemic Contract Owner"
cells = ["smart.epistemic.contracts"]
seam = "Provider-neutral Current Epistemic Position algebra."

[[crate]]
path = "crates/smart/eliot-epistemic"
