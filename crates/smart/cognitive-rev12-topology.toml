[package_counter_metrics]
reject_when = ["glue or re-export code dominates semantic code", "adjacent crates always change and prove together", "package exists only because one agent was assigned", "package has no independent replacement or failure boundary"]
review_when = ["estimated implementation exceeds 10000 LOC", "public API exceeds one causal family", "dependencies diverge", "proof or lifecycle owner diverges"]
