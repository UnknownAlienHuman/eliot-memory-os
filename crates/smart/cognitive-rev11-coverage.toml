[relation_semantics]
owner = "smart.dreamer.relation_candidate"
shared_core = "build_relation_candidate_set"
orientation_entrypoint = "build_orientation_relation_candidates"
curation_entrypoint = "build_curation_relation_candidates"
rule = "Both entrypoints call the same typed relation semantics. Orientation and Curation cannot fork relation meaning."

[research_boundary]
acquisition_owner = "Researcher"
interpretation_owner = "smart.dreamer.research_synthesis"
admission_and_support_owner = "Governor"
required_inputs = ["ResearchEvidenceBundle", "AllowedReferenceManifest", "frozen coverage denominator", "exact citations", "counterclaims", "failed acquisition", "State Fence"]
forbidden = ["provider discovery", "credential use", "network acquisition", "new source expansion", "citation invention", "epistemic promotion"]

[coverage_assertions]
dreamer_job_classes = 8
candidate_kinds = 17
curation_subtypes = 11
all_handlers_are_cells = true
all_unknowns_fail_closed = true
