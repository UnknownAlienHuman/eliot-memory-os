# #1862: context_recipe_body_digest stays imported because it remains the right
# value for the stored document body comparison in campaign_packet.rs. The three
# owner cells are given the owner ROW digest instead, derived inside
# campaign_context_owner.rs, so the frozen facade surface grows no import.
unique_imported_symbol_count = 7
import_item_occurrences = 9
facade_disposition_rows = 62
campaign_publication_disposition_rows = 10
compile_with_campaign_learning_state_product_callers = 0
replacement_owner_chain = ["A-15", "A-16a", "A-17a", "A-18"]
admitted_campaign_view_join = "eliot-context-candidates::check_campaign_learning_state_view, eliot-context-admission::check_campaign_view_for_admission, eliot-context-assembly::check_campaign_view_for_assembly"
admitted_campaign_view_join_caller = "bins/eliotd/src/campaign_packet.rs::candidate_request_for_packet (reaches the candidate cell), bins/eliotd/src/campaign_packet.rs::resolve_compile_and_bind_result (reaches the candidate and admission cells), bins/eliotd/src/kernel_context_read_client.rs::KernelContextReadClient::compile_context_packet (reaches the admission and assembly cells; ZERO production call sites, so the assembly cell is defined and correct in-crate but unreachable)"
admitted_campaign_view_join_enforces = "view State Fence against the candidate request binding; task/scope/request identity; load-bearing Context recipe owner revision against the immutable Context owner ROW digest the Context owner re-derived through its own publication from the exact recipe body (bins/eliotd/src/campaign_context_owner.rs::derive_context_recipe_record_digest), which is the domain the immutable view records for its ContextRecipe source resolution; refusal of invalidated, STALE, BLOCKED and missing-Context-row views; and, at the admission cell, the owner-minted Decision Safety Floor resolved by eliot-context::campaign_publication::context_safety_floor_identity. The cell re-derives the closed equality set AdmissionInput::validate_contract states - floor.floor.binding == the decision binding (else InvalidFence), floor.decision == recipe.decision AND floor.decision.decision_id == binding.decision_id (else IdentityConflict), floor.floor.capacity == recipe.capacity (else IdentityConflict), and floor.mandatory_roles covering every recipe.mandatory_roles entry (else MissingFloor) - and validates the floor through the contract owner's own SafetyFloorIdentity::validate. Comparing the full DecisionRevision and the capacity envelope, rather than decision_id alone, is what refuses a floor carrying a foreign recipe_revision or policy_sha256, or a shaved capacity. The admission cell's own typed ContextError now crosses the composition boundary instead of being discarded by is_err(); the response gap code stays the coarse wire classification while the owner's exact variant is logged, so a moved fence, a cross-compilation identity conflict, a completeness refusal, a missing Context row and a recipe-digest mismatch remain distinguishable in production evidence. #1862: the three cell parameters are named context_recipe_record_digest. An earlier revision passed context_recipe_body_digest - the digest of the recipe body alone - to a comparison against the view's recorded owner-record content digest, so the load-bearing-revision arm compared two different objects and could refuse no view at all; the body digest remains correct only for the stored document body comparison in bins/eliotd/src/campaign_packet.rs, which is a different check with a different pair of sides."
admitted_pre_render_output_identity = "eliot-context-assembly::rendered_output_identity"
admitted_pre_render_output_identity_reason = "QualityScorecard::output.rendered_digest must be filled before assemble_active_view is called, but the rendered payload is produced inside it from render::render, which is pub(crate) in eliot-context-assembly, so no caller outside that crate could derive it and the composition was unsatisfiable by construction rather than merely unminted. rendered_output_identity returns that identity from the same render::render + measurement::canonical_matches pair assemble_active_view itself runs, so the digest a card is built against and the digest assembly recomputes in require_graded_output are one derivation, not two that must agree."
unadmitted_campaign_view_joins = ["eliot-context-candidates::construct_context_candidates", "eliot-context-admission::admit_context_traced", "eliot-context-assembly::assemble_active_view"]
unadmitted_campaign_view_join_reason = "SafetyFloorIdentity is now minted on the live route from the Context owner's own publication and the admission closure is no longer built before the candidate set it must cover, so the two ordering reasons that made compile_context_packet unsatisfiable are gone. What remains is a genuine owner-record absence, measured per identity: the seven provider role projections have no producer on this route and required_projection converts only KnownEmpty; RecipeAdmissionPolicy::admission_rule is an owner reference whose rule record is deliberately not copied into the recipe body and is read nowhere; I2.16 places serializer identity on SerializedContextMeasurement, and that identity half has exactly one issuer end to end - eliot_context_contracts::canonical_render_serializer, in the crate that owns the canonical rendered payload and CONTEXT_CONTRACT_VERSION, publishing eliot_contracts::canonical_json_bytes over that payload with an options digest computed from the options in force - and eliot-context-measurement stamps that owner record into every measurement it produces instead of copying a caller-supplied triple, so the measurement side and the AssemblyPolicy side of measurement::verify both name the owner rather than each other; the third side is now bound too: #1862 BLOCK-2 reached the DELIVERED lane, because the authenticated ContextDelivery row's retained owner closures carry the exact delivered ActiveUnderstandingView and its ContextExecutionIdentity, which no owner validator had bound to the issuer - ActiveUnderstandingView::validate compares that identity against the same delivery's own measurement, so both sides came from one record and a delivery rendered under json-v1 or serde-json satisfied every check on the route. bins/eliotd/src/kernel_context_read_client.rs::require_delivered_context_render_codec now re-proves the delivered identity's own recorded fields and hands them to the same require_context_render_codec the pre-render policy check uses, called from bins/eliotd/src/campaign_packet.rs::resolve_compile_and_bind_result over every retained closure of the authenticated delivery row and refusing with CampaignPacketGapCode::DeliveredRenderCodecUnbound. The two sides have independent producers - a persisted owner delivery record and the Context contracts codec owner record - so it is a real comparison, not a record agreeing with itself, and it lives on the delivered lane rather than inside ActiveUnderstandingView::validate, which is shared with out-of-scope routes and fixtures that legitimately render under other codecs. What is still absent is a route that issues a measurement record at all, since measure_exact_utf8 has no production caller: its only non-test call site is crates/smart/eliot-context-assembly/src/measurement.rs::assemble_active_view_with_measurement, reached only from rebuild_handoff_view <- resume_handoff (handoff_resume.rs:92), which has zero callers, and the alternative - re-measuring the delivered bytes on the campaign route - would recompute a digest in place of validating the recorded value, so it is refused rather than done; and RecipeLayoutPolicy::role_positions is per-ROLE, not per-atom, so no per-atom priority class exists. PriorityPolicyIdentity, AdmissionRuleIdentity, MeasurementCompositionProfile, the per-atom AdmissionMeasurement set, QualityScorecard, AssemblyPolicy and the measure callback therefore still have zero production construction sites, and minting them would fabricate the I12.26 selection record. The typed CampaignPacketGapCode::AdmissionClosureUnbound reporting carries the per-identity account."
unadmitted_campaign_view_join = "eliot-context-assembly::check_campaign_view_for_delivery"
unadmitted_campaign_view_join_reason = "Measured unfireable, so deliberately not written. A fourth cell that joins the immutable campaign view to the delivery boundary is only worth adding if some fact it compares has an independent producer, and on the live route none does. context_delivery_publication (campaign_publication.rs:291-312) derives the ContextDelivery row's record_id, revision and recorded_state_fence FROM the very SessionDeliverySnapshot the cell would be handed; validate_recipe_prior_delivery_link (:450-462) forces that snapshot's task_id and scope_id equal to the recipe binding, which candidate_request_for_packet has already forced equal to the packet binding; bind_current_owner_record (campaign_context_owner.rs:352-382) requires the re-derived record to equal the authenticated current row and its read State Fence to equal the packet fence; and context_owner_read_for_role (campaign_packet.rs:1596-1632) requires the row reference, the head reference and the view's own resolution reference to all equal the learning-state recipe's expected_reference. validate_campaign_learning_state_view_current (eliot-learning-state-view src/lib.rs:303) then requires the view's frozen source_resolutions to equal the fresh set. The view's frozen ContextDelivery row therefore IS the re-derived publication, so every comparison such a cell could make is x == x and a write would add an unfireable validator rather than a refusal. The one alternative pairing looked independently and rejected on the documents' own terms: the delivered view's recipe_digest against the current recipe's recipe_sha256, because context_delivery_publication explicitly preserves the prior delivery's original attempt and fence verbatim and a later recipe legitimately belongs to a later attempt, so demanding equality refuses every real packet. Binding the delivered bytes to the CURRENT packet's own identity is circular here, since HostRequestResultBody.result_digest is computed from the serialized response that carries the view. What would actually make this cell fireable is a delivered-packet or admitted-set identity with an independent producer - a persisted owner-minted delivery record minted by something other than the row the cell is handed, or an AdmittedContextSet this route can construct - and neither exists today. check_campaign_view_for_assembly stays the correct delivery-stage shape and remains unreachable for the separate reason recorded above."
owner_admission_status = "AUD1_PARTIAL_TWO_VIEW_JOINS_REACHED_MAPPER_AND_DELIVERY_CELL_UNADMITTED"
removal_condition = "Migrate all three bins/eliotd source modules from the frozen campaign_publication surface to admitted owner contracts, then re-verify zero external Cargo dependents and zero imports before #40 A4 facade retirement. The owner chain is not yet an admitted campaign closure."

