# #1862: the campaign packet route is a Host/composition consumer of Context, so
# it must use owner contracts and never call the #40-frozen donor algorithm in
# `eliot-context`. The production call and its `#[allow(deprecated)]` were
# removed; this remains a no-new-call prohibition, not a live compile edge. The
# immutable campaign view now enters a current owner cell instead
# (`eliot-context-candidates::check_campaign_learning_state_view`), and the
# surviving campaign_publication imports and their #40 removal denominator are
# recorded separately below.
[[forbidden_compile_edge]]
from = "bins/eliotd campaign packet route (eliot.packet)"
to = "eliot-context legacy ContextCompiler / CampaignCompiledContext"
reason = "the frozen donor surface takes no new caller; compile_with_campaign_learning_state has zero product callers, so this row is a regression prohibition rather than a current edge. The campaign view's load-bearing revision and State Fence joins are owned by eliot-context-candidates::check_campaign_learning_state_view, not by this facade. The campaign_publication imports that remain are recorded in legacy_facade_consumer."

# #1862: the campaign view must not reach the current cells as a donor-produced
# compile DTO. The candidate cell re-derives every join it enforces, so the
# route carries the immutable view and the Context owner's independently
# re-derived recipe digest, never a legacy compiler verdict.
[[forbidden_compile_edge]]
from = "bins/eliotd campaign packet route (eliot.packet)"
to = "any donor-produced campaign compile verdict presented to eliot-context-candidates / eliot-context-admission / eliot-context-assembly"
reason = "the current owner cells own the load-bearing revision and State Fence joins; a caller-carried compile DTO is a second, unverifiable spelling of the same facts and is refused by construction at the candidate cell"

