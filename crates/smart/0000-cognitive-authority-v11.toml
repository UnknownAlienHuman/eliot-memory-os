[invariants]
items = [
  "No cognitive cell owns canonical truth, support, authority, task completion, scheduler state, provider acquisition, external effects or production promotion.",
  "Every decision-boundary hot cell is bounded, deterministic, model-free, storage-scan-free, network-free, lock-free and blocking-I/O-free.",
  "Every model output remains candidate-only with exact lineage, visible uncertainty, invalidation and a source-derived authority ceiling.",
  "Existence, epistemic support, accessibility and permitted influence are independent dimensions.",
  "Observed chronology is not causality; causality requires mechanism, evidence, rivals and falsifier.",
  "Online learning may change only reversible expiring task-local overlays; global promotion is external and proof-gated.",
  "Planning cannot create DurableJob, WorkItem, SwarmPlanDefinition, execution state, lease, queue reservation or launch.",
  "DreamCycle is one bounded sample and one finite plan and cannot schedule itself."
]

[agent_contract]
rules = [
  "Read this file, the two topology files, exactly one cell record and the cell's named normative anchors.",
  "Edit only the declared worker source and test files; Cargo.toml, src/lib.rs and package re-exports belong to the integration owner.",
  "Do not invent a missing external owner contract inside Smart; return a ContractChallenge.",
  "Unknown job, kind, subtype, missing denominator, stale fence, absent owner projection or unavailable authority path fails closed.",
  "A package-local green result does not establish Edge, Product Pulse, runtime or product support."
]

[supersedes_for_assignment]
paths = [
  "crates/smart/000-cognitive-authority-v11.toml",
  "crates/smart/cognitive-design-authority-v11.toml",
  "crates/smart/cognitive-crate-decisions.toml",
  "historical cognitive wave files",
  "historical standalone module.toml/api.toml pairs",
  "crates/smart/eliot-dreamer-candidate-validation",
  "crates/smart/eliot-dreamer-memory-repair"
]

[admission_gate]
required = [
  "all 61 cell records pass static closed-world validation",
  "physical package seams are approved by integration owners",
  "worker write scopes are non-overlapping",
  "root Cargo.toml and Cargo.lock remain unchanged until implementation admission",
  "implemented package obtains package proof",
  "every affected edge obtains provider-consumer Edge Proof",
  "the named Product Pulse passes on exact Product Identity"
]
