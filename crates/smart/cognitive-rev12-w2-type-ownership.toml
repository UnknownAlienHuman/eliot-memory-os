schema_version = 1
authority = "eliot-cognitive-function-design-rev12"
status = "W2_PUBLIC_TYPE_OWNERSHIP_ALLOWLIST"
field_contract_index = "crates/smart/cognitive-rev12-w2-field-contracts.toml"
rule = "Every W2 refinement public type has exactly one owner. Existing cue/context types remain owned by their original contracts; briefs and implementations import rather than redefine fields."

[[family]]
owner = "eliot-cue-contracts"
contract_ref = "crates/smart/eliot-cue-contracts/w2-execution.contract.toml"
types = ["RelationSpreadCombinationRule", "CueRelationSpreadExecutionPolicy"]

[[family]]
owner = "eliot-context-contracts"
contract_ref = "crates/smart/eliot-context-contracts/w2-execution.contract.toml"
types = ["ContextCompilationLimits", "ContextCompilationRequest", "DecisionTailLimits"]

[external_owner_registry]
allowed_owners = ["eliot-contracts", "eliot-cue-contracts/cue.contract.toml", "eliot-context-contracts/provider-contribution.contract.toml", "eliot-context-contracts/context-compiler.contract.toml"]

[forbidden]
duplicate_field_level_definition = true
brief_owned_public_type = true
generic_any_json_or_vendor_type = true
stringly_combination_rule = true
compiler_tail_limit_alias = true
execution_or_delivery_receipt = true
