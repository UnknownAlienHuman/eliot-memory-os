contract_placement_rule = "DATED HISTORY, not a present-tense measurement: Issue #259 measured the four physical crates before this delivery was written and found zero [[field_contract]], [[field_contract_index]], [[ownership]], [[crate_manifest]], [[validation_gate]], [[assignment]] and [[agent_brief]] tables in all four module.toml files, so the wave tables existed only in this catalogue. That premise held when measured and does not hold now. CURRENT STATE, measured on this branch: all four declaring manifests -- crates/smart/eliot-memory-quality/module.toml, crates/smart/eliot-dreamer-memory-revision/module.toml, crates/smart/eliot-cognitive-quality/module.toml and crates/smart/eliot-understanding-assessment/module.toml -- now carry [[field_contract]] (1, 1, 7 and 1 rows), [[field_contract_index]] (1, 1, 7 and 1), [[ownership]] (2, 1, 6 and 2), [[crate_manifest]] (1 each) and [[validation_gate]] (3, 4, 6 and 4); only [[assignment]] and [[agent_brief]] remain absent from all four, which is correct because an assignment and its brief are wave-level objects with no per-crate owner. OPERATIVE SCOPE, stated explicitly because the previous wording implied whole-row identity: each field contract exists in two places under Issue #259 -- this catalogue row and the owning crate's own module.toml -- and the crate copy is the owner-located copy while this catalogue is the wave-level index of the same contract id, so neither is a second owner. The two are required to be byte-identical on EXACTLY NINE KEYS and no others: id, owner_crate, fields, denominator, denominator_rule, complete_rule, fence, omission_semantics and invariants. Nine, not whole-row: this catalogue row additionally carries owner_manifest, CognitiveQualityAssessment additionally carries proof_depth_rule, and the owner copy of NegativeMemoryExtinctionCandidate additionally carries field_family_authority, field_family_disposition, superseded_field_family_owners and source_handles, so whole-row byte-identity is neither true nor claimed. RECORDED MEMBERSHIP GAP under issue #262: the NegativeMemoryExtinctionCandidate row of this file is the only one of its ten that carries no source_handles key while its owner copy does. That is a membership gap and NOT a byte-identity break, because source_handles is not one of the nine bound keys; the same handle pair is stated twice in this file anyway, on this contract's own [[field_contract_index]] row and in the owner copy, so no handle is unrecorded. The gap is recorded here rather than closed here because closing it means adding a key to a frozen row, which is outside the single-value repair this issue authorises. Every catalogue row that names a manifest points at the crate file that carries the contract."
family_contract_rule = "One field-complete public contract per causal family, not one per crate. eliot-cognitive-quality owns six causal families and therefore carries six field contract ids, each indexed by its own [[field_contract_index]] row, named by its own [[ownership]] row and read by the [[agent_brief]] of the order that owns it: SkillLifecycleView (order 80), ToolSurfaceAssessment (81), DreamerJobEconomics (82), EliotSelfQualityView (83), LearningBottleneckDiagnosis (83, same order and a different family) and SelfQualityInterventionReceipt (84). CognitiveQualityAssessment is the crate-level projection composed of those six and is declared as such by its composed_of row, so no family is frozen twice and no family is left unowned. A second contract for a family that already has one is a ContractChallenge."
disjointness_rule = "This catalogue does not modify bins/, the memory-curation and dreamer-cycle crates at crates/smart/eliot-memory-curation/** and crates/smart/eliot-dreamer-cycle/**, the cue crates at crates/smart/eliot-cue-normalizer/**, crates/smart/eliot-cue-binding/**, crates/smart/eliot-cue-index/** and crates/smart/eliot-cue-activation/**, retired eliot-understanding paths, root Cargo.toml/Cargo.lock, workflows, normative prose, or generated indexes. WITHDRAWN under issue #262: this row previously read 233 memory-curation/dreamer-cycle files and 246 cue normalizer/binding/index/activation files, and both figures are withdrawn as never-held rather than merely stale. Measured: the two memory/dreamer crates hold 16 files and the four cue crates hold 32, so neither figure was ever a file count, and at 8041 and 14066 lines they are not line counts either. Reachable history agrees: at commit 9cf878959, the revision that introduced the figures, the same two groups held 14 and 30 files, and the maximum over EVERY revision in this repository's history that touches those paths is 18 and 32, so 233 and 246 are unreachable as counts in any revision that has ever existed here, not merely wrong today. Globs replace them because a glob names the disjoint surface and cannot drift the way a count did, and because a count was never the quantity this rule needed to name: docs/architecture/A02-03-modular-architecture.md states that the Architecture sets no maximum size, line count, token count or file count, and docs/architecture/A14-08-development-doctrine.md states that counts are not progress without Product Proof. THE SAME FIGURES ELSEWHERE, measured rather than assumed: crates/smart/cognitive-wave-10.toml contains no 233 at all, and its only 246 sits inside a withdrawal that file has already written, whose replacement names the same four cue crates; so this file held the last live copy of 233, and 246 was already withdrawn in the sibling catalogue by the same reasoning. What remains a live copy elsewhere is the zero-module.toml-tables premise, which crates/smart/cognitive-contract-challenges.toml still asserts as measured evidence and which is owed to its own writer."

