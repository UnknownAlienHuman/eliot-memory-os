thority, because no [[field_contract]], [[field_contract_index]], [[validation_gate]] or [[agent_brief]] value reads the key. The same rule is stated by this repository's own sibling catalogue, crates/smart/cognitive-wave-10.toml::pair_key_copy_rule, which removed its own copy instead of refreshing it, and by the recorded forbidden_workaround on registry row CC-W2-NORMATIVE-PAIR-KEY, which forbids hand-maintaining a pair key in a catalogue or treating a wave file as the authority over docs/normative-pair.toml."
