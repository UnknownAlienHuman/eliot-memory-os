dependency_rule = "Assignment depends_on lists logical contract prerequisites; Cargo dependencies are narrower and exist only for public types actually imported. NARROWED under issue #262: an [[ownership]] consumers entry that names a concrete crate is a claim about a dependency edge and must be backed by that crate's manifest and sources, while every other entry in this table is a role string and asserts no such edge. The one entry that broke that rule named eliot-dreamer-accessibility as an inputs consumer of MemoryEcologyAssessment, and that crate's Cargo.toml declares no dependency on eliot-memory-quality and its sources never mention the type, so the claim was false; the entry is restated in the role form this table uses everywhere else and the concrete-crate reading is withdrawn rather than carried. The same string is copied into the owner-located manifest crates/smart/eliot-memory-quality/module.toml, so that copy is still wrong and is owed a matching correction by its own writer; this catalogue row is the one that asserted it and is the one repaired here."
