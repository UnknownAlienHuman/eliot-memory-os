schema_version = 2
module_id = "smart.dreamer.episode"
crate = "eliot-dreamer-episode"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 19
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.episode"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Reconstruct one bounded episode candidate from admitted observations while preserving chronology, participant/action/outcome distinctions, gaps, and alternative causal accounts."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Curation", "ValidatedDreamDraft item kind=episode", "admitted event/effect/artifact/verifier handles"]
outputs = ["EpisodeCandidate", "chronology/gap manifest", "rival causal account list"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
consumers = ["eliot-dreamer-curation"]
non_goals = ["event acquisition", "canonical episode admission", "causal proof", "cross-task narrative merge"]
invariants = ["observed order and inferred order are separate", "unknown intervals remain gaps", "effect outcome and explanation remain distinct", "one episode has a bounded scope and State Fence"]
failure_behavior = "Return a partial episode candidate with exact gaps or reject an incoherent chronology; never smooth missing events into a story."
proof_surface = ["out-of-order events", "unknown effect outcome", "mixed task/scope", "rival mechanism preservation"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-system-experience/src/lib.rs"
disposition = "extract_projection_only"
scope = "experience query/snapshot ideas, not owner state"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.4, I12.25 and I12.37"
disposition = "authoritative_contract"
scope = "ExperienceRecord and governed episode semantics"

[agent_task]
objective = "Implement bounded episode reconstruction without turning coherent prose into proof."
write_scope = ["crates/smart/eliot-dreamer-episode/**"]
deliverables = ["episode candidate builder", "chronology/gap model", "out-of-order and missing-event tests"]
acceptance = ["every episode atom has a handle", "causal claims retain their ceiling", "partial reconstruction is explicit"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if a coherent episode requires joining incompatible fences or inventing an event."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof in an isolated candidate workspace, affected edge proof, current-main rebase and integration-owner review"
