schema_version = 4
module_id = "smart.context.reactive_delivery_plan"
crate = "eliot-reactive-context-plan"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 19
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C1"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.context.reactive_delivery_plan"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Relevant assembled context reaches the next available host boundary once, while Critical Attention and delivery limitations remain visible."
causal_property = "reactive delivery planning and session dedup disposition"
old_failure_or_missing_capability = "The prior activation cell incorrectly owned session dedup and no cell owned the activation-to-injection planning decision."
discriminator = "The same immutable session snapshot and assembled view yield the same PendingContextInjectionPlan; actual delivery and receipt remain host or Governor effects."
primary_responsibility = "Plan one bounded context injection from an assembled ActiveUnderstandingView, CueActivationResult and immutable SessionDeliverySnapshot."
owned_mutable_state = []
allowed_effects = []
inputs = ["ActiveUnderstandingView", "CueActivationResult", "SessionDeliverySnapshot", "CriticalAttention projection", "IntegrationCoverageProfile"]
outputs = ["PendingContextInjectionPlan", "per-item delivery disposition", "required DeliveryReceipt request"]
depends_on = ["eliot-context-contracts", "eliot-cue-contracts", "eliot-cue-activation", "eliot-context-assembly"]
providers = ["context assembly", "cue activation", "Governor session projection"]
consumers = ["Host event or reactive delivery service"]
non_goals = ["actual delivery", "DeliveryReceipt creation", "Session state mutation", "Attention resolution", "authority decision"]
invariants = ["normal items deduplicate only against the explicit session snapshot", "Critical Attention items remain sticky", "tool-only degradation is visible", "DeliveryReceipt is produced only by the downstream delivery owner; this cell requests it but cannot issue it"]
failure_behavior = "Return delayed, advisory or unsupported delivery plan with the exact host gap; never claim delivery, prevention or acknowledgement."
proof_surface = ["repeat-session dedup", "Critical Attention sticky item", "event-integrated versus tool-only host", "stale view or session fence", "receipt ownership"]
proof_ceiling = "Module proof only; real provider/consumer Edge proof and Product Pulse remain separate"
product_pulse = "D3B_REACTIVE_CONTEXT_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "ELIOT_IMPLEMENTATION I7.10, I7.19 and I12.7"
disposition = "authoritative delivery/dedup boundary"

[[donor]]
path = "crates/smart/eliot-cues/src/lib.rs"
disposition = "reject session state from the evaluator"

[agent_task]
objective = "Implement the pure activation-to-delivery planning seam without owning delivery or receipts."
write_scope = ["crates/smart/eliot-reactive-context-plan/**"]
deliverables = ["PendingContextInjectionPlan builder", "dedup/sticky/degradation fixtures", "host delivery Edge fixtures"]
acceptance = ["deterministic plan", "no session mutation", "downstream receipt ownership explicit"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if planning needs actual delivery, receipt issuance, Attention resolution, authority or hidden session state."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse or Edge proof before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"
