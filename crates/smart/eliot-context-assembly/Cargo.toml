[package]
name = "eliot-context-assembly"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Project one admitted A-15 context set into a bounded ActiveUnderstandingView without re-running admission."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.context.assembly"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 18

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts", version = "0.1.0" }
eliot-context-contracts = { path = "../eliot-context-contracts", version = "0.1.0" }
eliot-observation-contracts = { path = "../../foundation/eliot-observation-contracts", version = "0.1.0" }
# Issue #1862: the assembly cell owns the campaign learning-state view join, so it
# consumes the immutable view contract directly instead of a caller-carried
# verdict. Same edge the candidate cell already declares.
eliot-learning-contracts = { path = "../eliot-learning-contracts", version = "0.1.0" }
# Sole #704 measurement owner. Assembly names it as a declared provider so a
# route composes the canonical `measure_exact_utf8` callback instead of
# hand-rolling a local byte/3 fallback or a fabricated tokenizer observation.
eliot-context-measurement = { path = "../eliot-context-measurement", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

# Host-only owner evidence (same rule as eliot-context-admission): the
# permit-based delivery screen never enters a guest closure.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eliot-governor = { path = "../../governor/eliot-governor", version = "0.1.0" }
eliot-improvement = { path = "../../meta/eliot-improvement", version = "0.1.0" }

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts", version = "0.1.0" }
eliot-evidence = { path = "../../foundation/eliot-evidence", version = "0.1.0" }
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }

[lints]
workspace = true
