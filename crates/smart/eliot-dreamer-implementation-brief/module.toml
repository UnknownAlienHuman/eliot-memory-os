path = "crates/smart/eliot-dreamer-architecture-brief"
disposition = "reuse bounded pure-projection structure only; do not import ArchitectureBrief authority or semantics"

[agent_task]
objective = "Implement the Implementation side of A-03 self-query separately from Architecture meaning and observed runtime proof."
write_scope = ["crates/smart/eliot-dreamer-implementation-brief/**"]
deliverables = ["typed accepted Implementation source and evidence closure", "deterministic candidate-only projector", "39-case exact profile/source/evidence/gap acceptance suite"]
