state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.implementation_brief"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "ELIOT self-query exposes accepted Implementation intent and separately qualified current conformance evidence without upgrading prose or lower-level tests into higher-level support."
causal_property = "evidence-bound ArchitectureSelfQuery Implementation-profile projection"
old_failure_or_missing_capability = "Implementation projection was treated as an optional Orientation section and could silently reinterpret Architecture or certify prose/package tests as runtime support."
discriminator = "The brief keeps accepted Implementation, governing Architecture, exact evidence targets and independent conformance axes separate and opens an owned gap for every missing or contradictory obligation."
primary_responsibility = "Project one candidate-only ImplementationBrief from the exact A-03 ArchitectureSelfQuery Implementation profile, accepted Implementation source, governing Architecture and immutable current evidence."
owned_mutable_state = []
allowed_effects = []
inputs = ["ArchitectureSelfQuery with output_profile=ImplementationBrief", "A-05 ValidatedCandidate and preservation receipt", "accepted Implementation source snapshot", "governing Architecture source and anchors", "I0.5 ConformanceContractSet", "complete-or-partial mechanism/obligation/evidence denominator"]
