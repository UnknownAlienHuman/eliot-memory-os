depends_on = ["eliot-contracts", "eliot-conformance-contracts", "eliot-dreamer-contracts"]
providers = ["Governor-admitted accepted normative pair and Implementation source", "owner-neutral current conformance evidence"]
consumers = ["Dreamer self-query surface", "ELIOT self-scope Edge proof"]
non_goals = ["new ImplementationSelfQuery job", "Architecture reinterpretation", "support promotion from prose", "runtime probe or test execution", "source acquisition", "task/issue/work-plan generation", "provider, Store, authority, effect or Finish"]
invariants = ["Architecture remains constitutional", "TARGET is not CURRENT", "all proof stages are independent", "contract maturity, implementation support, evidence execution, observation state and evidence domain are independent axes", "accepted Implementation and current evidence retain exact distinct identities", "unknown, stale, skipped, simulated, partial, missing and failed remain distinct", "candidate-only proof ceiling and zero effects"]
failure_behavior = "Return exact unsupported, mismatch, conflict, partial, missing, failed, skipped, stale, cancelled or bound evidence/gap state; never invent source, infer a higher proof stage or mutate support."
proof_surface = ["wrong A-03 profile/job", "pair/revision/digest mismatch", "Architecture conflict", "duplicate same-ID evidence", "partial denominator", "compile/package/Edge/runtime/Product/release separation", "target/status/proof-axis compatibility", "bounds and replay"]
proof_ceiling = "Module/package proof only; real provider/consumer Edge proof, current collection and Product Pulse remain separate"
product_pulse = "D3A_SELF_QUERY_EDGE_01"
replacement_boundary = "pure projector behind the declared public contract; package ownership creates no discovery, execution, semantic authority or runtime state"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "docs/architecture/I09-03-job-classes.md and accepted A-03 self-query contracts"
