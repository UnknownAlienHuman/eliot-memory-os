forbidden = ["new Dreamer job", "canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs", "source or test execution", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop and return ContractChallenge if exact accepted Implementation source, governing Architecture or owner-neutral conformance contracts are unavailable."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["standalone fmt/test/clippy/doc", "all 39 Issue #651 cases discovered and passed", "independent profile/normative/evidence-axis review", "workspace admission remains separate under #968"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review under #968"

[acceptance]
min_source_lines = 1200
min_public_items = 24
min_tests = 39
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = ["project_implementation_brief", "ImplementationBriefInput", "ImplementationBriefProjection", "ImplementationSourceSnapshot", "ImplementationStatement", "ImplementationMechanism", "ImplementationObligation", "ImplementationEvidence", "ImplementationDenominator", "EvidenceAxisSnapshot", "ProofStage", "ImplementationGap", "ImplementationBriefDisposition"]
required_tests = ["minimal_implementation_brief", "exact_job_and_output_profile_only", "support_axes_are_independent_not_a_total_ladder", "mechanism_binds_accepted_implementation_and_architecture", "projector_has_no_io_effect_status_mutation_or_finish"]
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!', 'std::process', 'std::fs', 'tokio', 'reqwest', 'surrealdb']
