crate = "eliot-dreamer-implementation-brief"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 9
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.implementation_brief"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "ELIOT self-query exposes accepted implementation intent and current conformance evidence without upgrading TARGET prose to CURRENT support."
causal_property = "ImplementationBrief projection"
old_failure_or_missing_capability = "Implementation projection was treated as an optional Orientation section and could silently reinterpret Architecture or certify prose as runtime support."
discriminator = "The brief keeps accepted Implementation contracts and observed conformance evidence separate and opens an explicit gap when they disagree."
primary_responsibility = "Produce an ImplementationBrief candidate from exact accepted Implementation handles plus current conformance evidence, preserving status and Architecture precedence."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=ArchitectureSelfQuery", "ValidatedDreamDraft", "accepted Implementation handles", "CurrentSystemEvidenceSnapshot handles"]
outputs = ["ImplementationBriefCandidate", "support and gap matrix", "invalidation conditions"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
providers = ["Governor-admitted accepted Implementation handles", "current conformance evidence projections"]
consumers = ["Dreamer self-query surface", "ELIOT self-scope Edge proof"]
non_goals = ["Architecture reinterpretation", "support promotion from prose", "runtime probe execution", "source acquisition", "basic Orientation"]
invariants = ["TARGET is not CURRENT", "Architecture precedence remains explicit", "accepted Implementation and current conformance evidence retain separate handles", "unknown or stale runtime evidence stays unknown or stale"]
failure_behavior = "Return partial or unsupported ImplementationBrief with exact source, conformance or status gaps; never certify unsupported mechanisms."
proof_surface = ["mixed digest", "prose-only support claim", "stale conformance evidence", "Architecture conflict"]
proof_ceiling = "Module proof only; real provider/consumer Edge proof and Product Pulse remain separate"
product_pulse = "D3A_SELF_QUERY_EDGE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "ELIOT_IMPLEMENTATION I9.3 Architecture/self query"
disposition = "authoritative contract"

[[donor]]
path = "ELIOT_IMPLEMENTATION I0.5"
disposition = "current support and evidence-status boundary"

[agent_task]
objective = "Implement the Implementation side of self-query separately from Architecture meaning and runtime proof."
write_scope = ["crates/smart/eliot-dreamer-implementation-brief/**"]
deliverables = ["typed ImplementationBrief projection", "status/conformance/precedence fixtures", "self-query Edge fixtures"]
acceptance = ["candidate-only output", "exact accepted Implementation lineage", "TARGET and CURRENT never conflated"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if the requested result requires Architecture reinterpretation, source acquisition, runtime probe execution or support promotion."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse or Edge proof before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# These are the floors every cell shares. The owning work unit tightens them
# with `required_exports` and `required_tests` taken from its own brief, so a
# reviewer decides on one exit code instead of reading prose criteria.
[acceptance]
min_source_lines = 200
min_public_items = 6
min_tests = 5
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
