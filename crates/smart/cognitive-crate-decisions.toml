# ---------------------------------------------------------------------------
# #261 r12 crate-decision ownership notes for the four families that had NO
# field-contract row before r12. As at r11 these are NOT new [[decision]] rows
# and NOT new crates: all four contract crates already exist and are already
# decided upstream in their own waves. What changes at r12 is only that their
# field contract is stated.
#
# Restating the governing rule of this file because these rows are the ones most
# likely to be misread as proposals: a crate exists only for a real contract,
# dependency, context, proof or replacement seam. None of the four notes below
# proposes a crate and none re-decides a package_action.
#
# The asymmetry carried over from r11 still holds and is worth reading before the
# table: every one of these four families has a MEASURED first consumer, unlike
# the memory-selection family at r11 which had none. But two of them also carry a
# measured SCOPE gap -- r12 freezes one slice of a much larger crate -- and that
# is recorded per row rather than left for a reader to discover.
# ---------------------------------------------------------------------------

[[contract_ownership_note]]
issue = 261
family = "eliot-observation-governor-classification"
owning_crate = "eliot-observation"
functional_cell = "governor.observation.admission"
existing_decision_reference = "this file's order 1 eliot-observation IS the owning cell for this family, and this is the only one of the four r12 families that is assigned in this 1-43 decision set. Its manifest is classifier.module.toml, not module.toml, and it carries status = PROTOTYPE with workspace_admission recorded as forbidden pending implementation, package proof, edge proof, a current-main rebase and integration-owner review."
field_contract_state = "FROZEN_EXACT at 11 of 11 frozen types as of freeze r12, with a resolving validator anchor on every row and a typed GovernorObservationError variant on every field"
first_consumer = "eliot-governor, and independently eliot-cue-binding"
first_consumer_status = "MEASURED_EXISTS_TWO_INDEPENDENT_CONSUMERS"
first_consumer_note = "crates/governor/eliot-governor/src/observation_reconciliation.rs drives ObservationJournal::admit; crates/smart/eliot-cue-binding/src/derive.rs reads ObservationAdmissionReceipt and branches on candidate_disposition == CandidateDisposition::TaskBound at line 692. Both located by git grep on the r12 base commit."
owning_task_for_the_gap = "none for the contract; what remains unproven is runtime behaviour, which stays NOT_EXECUTED. The cell's own manifest still records workspace admission as forbidden, which is a package-lane fact this row does not change."
package_action_unchanged = true
rust_change_needed = false
note = "This cell is PROVIDER-NEUTRAL and boundary-only: it admits, classifies and preserves observations and creates no truth, authority, scheduling, external effect, task completion or self-promotion. Its own declared invariant is that uncertain input is preserved rather than rejected, which the safe_capture_fallback field contract states directly."

