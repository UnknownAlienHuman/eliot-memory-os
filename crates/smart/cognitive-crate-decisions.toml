# ---------------------------------------------------------------------------
# #261 r11 contract-ownership notes for the three families that were frozen at
# TYPE level only until that revision. These are NOT new [[decision]] rows and
# NOT new crates: the three contract crates already exist and are already
# decided upstream in their own waves. What changes at r11 is only that their
# field contract is stated, so a reader of THIS decision set can see which
# existing crate owns each family and which consumer was actually found.
#
# The governing rule of this file is unchanged and is restated here because it
# is the rule these three rows are most likely to be misread against: a crate
# exists only for a real contract, dependency, context, proof or replacement
# seam. None of the three notes below proposes a crate, and none of them
# re-decides a package_action.
#
# Note the asymmetry between the third row and the first two. Memory selection
# has NO named first consumer because none exists: git grep over the r11 base
# commit finds no crate outside eliot-memory-projection-contracts referencing
# any of the six selection types, and select() has zero callers. The other two
# have measured consumers. An empty first_consumer is recorded as an empty
# value with an owner rather than filled with a plausible-sounding crate.
# ---------------------------------------------------------------------------

