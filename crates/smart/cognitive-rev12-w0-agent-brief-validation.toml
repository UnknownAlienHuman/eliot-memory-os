[[gate]]
id = "W0B01_PARSE"
requirement = "Every new brief/index/disposition artifact parses as TOML."

[[gate]]
id = "W0B02_ORDER_CLOSURE"
requirement = "Orders are exactly the fifteen W0 contract cells, unique and complete."

[[gate]]
id = "W0B03_HANDOFF_MATCH"
requirement = "Each brief's cell, crate, field contract, function selectors, source/test scope and stop condition match the parent handoff authority."

[[gate]]
id = "W0B04_NO_PARALLEL_TYPE_AUTHORITY"
requirement = "Briefs contain no public type or field definitions; the indexed field contract remains the sole wire authority."

[[gate]]
id = "W0B05_WRITE_ISOLATION"
requirement = "All thirty source/test paths are unique; Cargo.toml, src/lib.rs, re-exports and integration files are absent."

[[gate]]
id = "W0B06_LOCAL_OVERLAY_DISPOSITION"
requirement = "All twenty-seven local draft files have exactly one retained/merged/superseded disposition and SHA-256."

[[gate]]
id = "W0B07_PAYLOAD_HYGIENE"
requirement = "Diff contains TOML only and no Rust, Markdown, workflow, root Cargo.toml, Cargo.lock, archive, .eliot or runtime state."

[[gate]]
id = "W0B08_PROOF_CEILING"
requirement = "A brief, branch, commit, review or PR cannot claim Rust implementation, package behavior, Edge Proof, Product Pulse, runtime or release support."
