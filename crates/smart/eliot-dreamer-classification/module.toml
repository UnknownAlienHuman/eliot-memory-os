schema_version = 2
module_id = "smart.dreamer.classification"
crate = "eliot-dreamer-classification"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 17
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.classification"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Propose one semantic record-family or subtype classification with scope, evidence, alternatives, and abstention when the distinction is unsupported."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Curation", "ValidatedDreamDraft item kind=classification", "admitted source handles and existing type projection"]
outputs = ["ClassificationCandidate", "alternative classifications", "abstention/unknown manifest"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
consumers = ["eliot-dreamer-curation"]
non_goals = ["relation proposals", "record mutation", "automatic promotion", "ontology redesign"]
invariants = ["classification never raises epistemic or authority status", "ambiguous roles preserve alternatives", "existing canonical type is evidence rather than an oracle", "one candidate concerns one target identity"]
failure_behavior = "Return an unclassified/ambiguous candidate with reasons; never force a record into the nearest known type."
proof_surface = ["ambiguous observation", "wrong caller hint", "existing-type conflict", "unknown subtype and abstention"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-memory/src/lib.rs"
disposition = "extract_pure_only"
scope = "legacy RecordKind classification ideas"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.3-I12.5"
disposition = "authoritative_contract"
scope = "classification pipeline and record families"

[agent_task]
objective = "Implement one narrow classification handler over the common validated draft."
write_scope = ["crates/smart/eliot-dreamer-classification/**"]
deliverables = ["classification candidate builder", "alternative/abstention handling", "table-driven adversarial tests"]
acceptance = ["one target per candidate", "no status/lifecycle effect", "unsupported distinctions remain explicit"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop if the requested decision changes the canonical ontology or record family contract; return a ContractChallenge."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof in an isolated candidate workspace, affected edge proof, current-main rebase and integration-owner review"
