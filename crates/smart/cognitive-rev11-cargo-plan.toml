[integration_owner_tasks]
steps = [
  "compare retained manifest dependencies with this target plan",
  "remove implementation-to-implementation ordering edges",
  "add only workspace dependency aliases after package code exists",
  "create package src/lib.rs and re-export exact cell modules",
  "run cargo metadata in an isolated candidate workspace",
  "run package proof before root workspace admission",
]

[workspace_admission]
allowed_only_after = ["all source modules exist", "all target dependencies resolve", "package-local tests pass", "affected Edge Proof passes", "named Product Pulse passes"]
current = "BLOCKED"
