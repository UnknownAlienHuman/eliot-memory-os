schema_version = 1
authority = "eliot-cognitive-function-design-rev11"
status = "TARGET_CARGO_PLAN_NOT_WORKSPACE_ADMITTED"
rule = "Cargo manifests are package integration-owner surfaces. Cell agents do not edit them. Dependencies follow contract/lower-layer direction; logical implementation order is never encoded as an implementation-to-implementation dependency."

