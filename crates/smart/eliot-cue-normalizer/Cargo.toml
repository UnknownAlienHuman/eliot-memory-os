[package]
name = "eliot-cue-normalizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Single shared pure normalization contract for cue capture and firing"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
