[package]
name = "eliot-context-compiler-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Thin typed wasm32-wasip2 adapter over the native Context admission gate (A-17a)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "pending_package_proof_and_integration_owner_review"
functional_cell = "smart.context.compiler-wasm"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 17

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts", version = "0.1.0" }
eliot-evidence = { path = "../../foundation/eliot-evidence", version = "0.1.0" }
eliot-context-contracts = { path = "../eliot-context-contracts", version = "0.1.0" }
eliot-context-admission = { path = "../eliot-context-admission", version = "0.1.0" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
thiserror = "2.0.18"
wasmparser = "0.256.0"

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts", version = "0.1.0" }
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }
eliot-wasm-runtime = { path = "../../modules/eliot-wasm-runtime", version = "0.1.0" }
wat = "=1.256.0"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
