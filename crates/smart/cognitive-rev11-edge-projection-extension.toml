schema_version = 1
authority = "eliot-cognitive-function-design-rev11"
status = "TYPED_EDGE_EXTENSION_DESIGN_ONLY"
base_edge_map = "crates/smart/cognitive-edge-map.toml"
additional_edges = 7
combined_edges = 34
additional_product_pulses = 2
combined_product_pulses = 9

[[edge]]
id = "E28_GOVERNOR_READ_TO_MEMORY_SNAPSHOT"
producer = "Governor canonical read adapter"
contract = "CanonicalMemoryReadSnapshot"
consumer = "smart.memory.candidate_query::query_memory_candidates"
failure = "stale, partial or unavailable read remains explicit; Smart does not retry storage or infer missing records"

[[edge]]
id = "E29_CUE_TO_MEMORY_QUERY"
producer = "smart.cue.activation::assemble_cue_activation"
contract = "CueActivationResult"
consumer = "smart.memory.candidate_query::query_memory_candidates"
failure = "cue mismatch or stale snapshot blocks exact association; activation score does not become support"

[[edge]]
id = "E30_MEMORY_QUERY_TO_CONTEXT_PROJECTION"
producer = "smart.memory.candidate_query::query_memory_candidates"
contract = "MemoryCandidateSet"
consumer = "smart.memory.context_projection::project_memory_context"
failure = "partial denominator and omitted candidates remain visible; projection cannot fetch replacements"

[[edge]]
id = "E31_MEMORY_PROJECTION_TO_CONTEXT_MERGE"
producer = "smart.memory.context_projection::project_memory_context"
contract = "ProviderContribution"
consumer = "smart.context.contribution_merge::merge_context_contributions"
failure = "missing provider is coverage gap, not empty complete contribution"

[[edge]]
id = "E32_CANONICAL_EXPERIENCE_TO_PROJECTION"
producer = "Task/attempt/evaluator/effect canonical read adapter"
contract = "CanonicalExperienceReadSnapshot"
consumer = "smart.experience.projection::project_system_experience"
failure = "missing owner or outcome remains partial/unknown and blocks attribution"

[[edge]]
id = "E33_EXPERIENCE_TO_LEARNING_AND_DIAGNOSIS"
producer = "smart.experience.projection::project_system_experience"
contract = "SystemExperienceProjection"
consumer = "smart.learning.state_view::assemble_campaign_learning_state_view and smart.dreamer.development_diagnosis::diagnose_development_failure"
failure = "partial projection blocks causal learning/diagnosis claims but preserves observations"

[[edge]]
id = "E34_SELF_MODEL_TO_CONTEXT_MERGE"
producer = "smart.self_model.context_projection::project_self_model_context"
contract = "ProviderContribution"
consumer = "smart.context.contribution_merge::merge_context_contributions"
failure = "missing conformance produces target-only and Unknown atoms; target prose cannot become current support"

[[pulse]]
id = "D3B_CANONICAL_PROJECTION_PULSE_01"
required_edges = ["E28_GOVERNOR_READ_TO_MEMORY_SNAPSHOT", "E29_CUE_TO_MEMORY_QUERY", "E30_MEMORY_QUERY_TO_CONTEXT_PROJECTION", "E31_MEMORY_PROJECTION_TO_CONTEXT_MERGE", "E34_SELF_MODEL_TO_CONTEXT_MERGE"]
product_observable = "An exact observed cue and current task boundary cause Governor-owned canonical records and exact self-model constraints to appear as bounded owner-attributed Context candidates without Smart-owned mutable memory."
negative_cases = ["zero graph edges still retrieve exact cue-linked record", "inaccessible payload is not leaked", "partial read denominator remains visible", "Implementation target is not current support"]

[[pulse]]
id = "D4_EXPERIENCE_PROJECTION_PULSE_01"
required_edges = ["E32_CANONICAL_EXPERIENCE_TO_PROJECTION", "E33_EXPERIENCE_TO_LEARNING_AND_DIAGNOSIS"]
product_observable = "One exact attempt's hypothesis, trace, artifact, evaluator and effect evidence become an immutable outcome-linked projection usable by learning and diagnosis without a second experience store."
negative_cases = ["unattributed success remains observed only", "unknown external outcome remains Unknown", "failed attempt is retained", "projection cannot create a learning delta"]
