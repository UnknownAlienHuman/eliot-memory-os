first_consumer_status = "MEASURED_EXISTS_TWO_INDEPENDENT_CONSUMERS"
first_consumer_note = "Located by git grep: crates/governor/eliot-governor/src/observation_reconciliation.rs constructs ObservationSubmission at maintenance_result_submission and verification_submission and drives ObservationJournal::admit at admit_maintenance_result and admit_scratch_observation. The SECOND consumer is crates/smart/eliot-cue-binding/src/derive.rs, which reads ObservationAdmissionReceipt and branches on candidate_disposition == CandidateDisposition::TaskBound at line 692 to decide whether an observation may seed a cue binding. Recorded as two consumers rather than collapsed into one."
