later_positive_acceptance = "a submission whose plan fence equals its own fence and whose selection task_ref AND work_scope_ref both equal the record's own affected_scope values is admitted, yielding a receipt whose request_digest, record_id, candidate_disposition and evidence_digest each equal their independently recomputed values; resubmitting identical bytes under the same key yields Replayed with the original receipt unchanged"
later_negative_acceptance = "the same key with DIFFERENT bytes yields a Conflict rejection rather than a second admission; a task-bound record with no selection is TaskSelectionRequired; a selection at a superseded revision is StaleTaskSelection and is not rebound; a plan or evidence envelope on another fence is FenceMismatch; Durability::Durable over an OperationalLog route is InsufficientDurability and a protected coverage_gap without Durability::Protected is likewise refused; an empty all_contract_errors list is Empty rather than an accepted rejection; a Replayed result offered as journal input is PersistedReplay"
owning_task_for_the_gap = "none for the admission family itself; the crate, the closed validation and two real independent consumers all exist. What remains unproven is runtime behaviour, which stays NOT_EXECUTED. The private classifier has no wire form by design and the bank_admission lane is a separate owner path; both are named in the freeze coverage_accounting row rather than left silent."
