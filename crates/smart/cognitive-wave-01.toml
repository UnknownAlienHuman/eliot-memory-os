# READ THE OWNERSHIP ASYMMETRY BEFORE THE TABLE. Each row records that the crate
# pre-dates this issue and was NOT created by it. Two of the four families
# additionally carry a MEASURED scope gap recorded in the freeze's
# [[coverage_accounting]]: eliot-dreamer-contracts declares roughly 387 public
# types and r12 freezes one job family of them, and eliot-learning-contracts
# declares 80 and r12 freezes two shared types. Those rows are NOT a claim that
