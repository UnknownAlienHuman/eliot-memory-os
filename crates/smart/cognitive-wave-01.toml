schema_version = 6
wave_id = "cognitive-micromodules-wave-01"
status = "PROTOTYPE_ASSIGNMENT_READY_AFTER_STATIC_REVIEW"
base_commit = "7f075ddf5d168f3d2ad3144807b7f0b9d4f0bb61"
normative_pair = "ELIOT Architecture 4.5-draft + Implementation 0.29-draft; English edition 2026-08-28"
purpose = "Keep D1 capture ownership in Governor, close a minimal D3a Orientation pulse, add independent Clarification/self-query handlers, then D3b reactive context and bounded candidate-only curation."
integration_owner = "cognitive-wave-integrator"
agent_rule = "One agent receives one active module manifest, frozen one-hop contracts, old failure, discriminator, exact write scope, proof ceiling and named Product Pulse or Edge proof."
workspace_rule = "Prototype packages stay outside the root workspace until implementation, package proof, affected Edge proof, current-main ancestry and integration review."
size_rule = "10000 LOC is a review signal only; causal cohesion, state ownership, proof, change closure and replacement boundary decide topology."
authority_rule = "No prototype owns canonical state, runtime scheduling, evaluator state, policy, authority, finish or external effects."
dependency_rule = "Assignment depends_on lists logical implementation prerequisites; Cargo dependencies are narrower and exist only for public types actually imported."
supersession_rule = "The stale cognitive-crates-prototypes-01 branch is not an assignment source."

[[stage]]
id = "D1_CAPTURE_OWNER_REPAIR"
orders = [1, 1]
gate = "Keep first-pass classification inside the existing Governor observation owner."

[[stage]]
id = "D3A_ORIENTATION_FIRST_VALUE"
orders = [2, 6]
gate = "Current Epistemic Position, bounded bundle, common validation and candidate-only Orientation close the first useful D3a pulse."

[[stage]]
id = "D3A_COMPANION_JOB_HANDLERS"
orders = [7, 9]
gate = "Clarification and Architecture/self query remain independent job handlers and do not become prerequisites of basic Orientation or D3b."

[[stage]]
id = "D3B_REACTIVE_CONTEXT_NEXT_VALUE"
orders = [10, 19]
gate = "Cue binding/index/activation, context admission/assembly and pure delivery planning; may start once order 6 passes."

[[stage]]
id = "D3A_BOUNDED_CURATION_EXPANSION"
orders = [20, 31]
gate = "Assign only after the Orientation Product Pulse shows useful value."

[[product_pulse]]
id = "D1_CAPTURE_CLASSIFICATION_EDGE_01"
scenario = "A misleading or ambiguous hint is preserved once by Governor as a deterministic family or cold ObservationCandidate."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Edge proof only"

[[product_pulse]]
id = "D3A_ORIENTATION_PULSE_01"
scenario = "One current goal yields a source-linked DreamPacket with Current Epistemic Position handles, rivals, unknowns, hidden relation candidates and probes; no self-query brief is required."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Product proof only"

[[product_pulse]]
id = "D3A_CLARIFICATION_EDGE_01"
scenario = "One material ambiguity yields exactly one discriminative question, why it matters and a safe unanswered fallback; no delivery effect occurs in the handler."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Edge proof only"

[[product_pulse]]
id = "D3A_SELF_QUERY_EDGE_01"
scenario = "An ELIOT self-query yields separate ArchitectureBrief and ImplementationBrief candidates bound to exact accepted source digests and current conformance evidence; Architecture precedence remains visible."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Edge proof only"

[[product_pulse]]
id = "D3B_REACTIVE_CONTEXT_PULSE_01"
scenario = "An exact cue fires with zero relation edges, preserves the Decision Safety Floor and yields a delivery plan without model work on the hot path."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Product proof only"

[[product_pulse]]
id = "D3A_CURATION_PULSE_01"
scenario = "A bounded batch routes each item to one typed handler or explicit unsupported disposition; original memory remains unchanged."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Product proof only"

