schema_version = 4
wave_id = "cognitive-micromodules-wave-01"
status = "PROTOTYPE_ASSIGNMENT_READY_AFTER_STATIC_REVIEW"
base_commit = "7d7f03259cc3d3d90b2fe1af7a6175b13808ece2"
normative_architecture = "ELIOT Architecture 4.5-draft / English edition 2026-08-28"
normative_implementation = "ELIOT Implementation 0.29-draft / English edition 2026-08-28"
purpose = "Implement the first function-bounded cognitive contour: preserve D1 capture ownership, deliver Basic Dreamer Orientation first, then reactive context, then bounded curation expansion."
prerequisite = "Current main contract rebind plus a reliable D1 capture/read/strict-finish loop; no prototype receives runtime authority."
integration_owner = "cognitive-wave-integrator"
agent_rule = "One agent receives exactly one active module manifest, its frozen contract revision, one-hop providers/consumers, old failure, discriminator, exact write scope, proof ceiling and Product Pulse."
workspace_rule = "Prototype Cargo manifests remain outside the root workspace until implementation, isolated package proof, affected edge proof, current-main rebase and integration review."
size_rule = "10000 LOC is a soft review ceiling only; causal cohesion, context/build/test closure, state ownership, proof and replacement boundaries decide split or merge."
source_rule = "Current source, Cargo metadata/diagnostics and exact runtime evidence outrank prototype manifests; manifests are assignments, not support claims."
old_branch_rule = "cognitive-crates-prototypes-01 is superseded as an assignment source; only individually revalidated donor ideas may be reused."
gate = "Orders 20-31 require D3A_ORIENTATION_PULSE_01. Workspace/runtime admission of orders 10-19 requires D3B_REACTIVE_CONTEXT_PULSE_01. No order receives canonical or external-effect authority."

[global_boundaries]
forbidden = ["second canonical, operational, task, scheduler, evaluator or promotion owner", "Dreamer source acquisition or Researcher denominator/freeze ownership", "provider/model SDK in pure cognitive cores", "job scheduling, process supervision or route reservation", "truth/support/authority/policy/finish/effect promotion", "unbounded hot-path work", "similarity as exact applicability, causality or proof", "active generation self-modification", "facade semantic recomputation", "implicit scope/disclosure widening"]
required = ["one causal responsibility", "one lifecycle owner or explicit statelessness", "one owner for every mutable state", "typed provider/consumer ports", "independent proof surface and proof ceiling", "local visible degradation", "replacement/removal and merge/rejoin boundary", "Product Objective and exact discriminator"]

[[stage]]
id = "D1_CAPTURE_OWNER_REPAIR"
orders = [1, 1]
gate = "Keep deterministic first-pass classification inside the existing Governor observation owner."

[[stage]]
id = "D3A_ORIENTATION_FIRST_VALUE"
orders = [2, 9]
gate = "Current Epistemic Position and candidate-only Orientation/Clarification/Architecture self-briefs before any D3b dependency."

[[stage]]
id = "D3B_REACTIVE_CONTEXT_NEXT_VALUE"
orders = [10, 19]
gate = "Cue binding/index/activation followed by Context candidates/admission/assembly and a pure delivery plan; zero graph edges remain valid."

[[stage]]
id = "D3A_BOUNDED_CURATION_EXPANSION"
orders = [20, 31]
gate = "Assign only after the Orientation pulse; stop broad expansion if orientation/reactive pulses show no product delta."

[[product_pulse]]
id = "D1_CAPTURE_CLASSIFICATION_EDGE_01"
scenario = "A natural observation with a misleading/ambiguous hint reaches the real Governor capture path, is preserved once, and receives one deterministic family or cold ObservationCandidate fallback without a Smart state owner."
required_observables = ["exact old-path discriminator", "one Governor owner", "raw capture preservation", "no support/influence promotion"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

[[product_pulse]]
id = "D3A_ORIENTATION_PULSE_01"
scenario = "A Human or Main Agent asks what ELIOT knows about one current goal and receives a bounded, source-linked DreamPacket with Current Epistemic Position, separate Architecture/Implementation briefs, rivals, unknowns and probes without knowing database handles."
required_observables = ["D1 admitted records", "exact source handles", "candidate-only result", "route failure leaves deterministic orientation available"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

[[product_pulse]]
id = "D3B_REACTIVE_CONTEXT_PULSE_01"
scenario = "An exact file/symbol/error/task cue fires with zero relation edges, is admitted through the Decision Safety Floor, assembled without double compilation, and yields a deduplicated delivery plan before the next Material boundary."
required_observables = ["write/read normalization symmetry", "zero-edge direct firing", "Decision Safety Floor preservation", "delivery planning separated from activation", "no model call on hot path"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

[[product_pulse]]
id = "D3A_CURATION_PULSE_01"
scenario = "A bounded curation batch routes every item to exactly one typed candidate-only handler or explicit unsupported disposition; evidence, dissent, scope, rollback and source authority are preserved and no lifecycle action occurs."
required_observables = ["deterministic pre-screen", "typed subtype handlers", "no generic fallback", "partial/unsupported items visible", "original memory unchanged"]
status = "NOT_EXECUTED"
proof_ceiling = "Product proof only for the exact scenario/Product Identity; does not establish release or global conformance"

