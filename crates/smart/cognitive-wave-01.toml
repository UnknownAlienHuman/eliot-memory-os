# see which existing crate owns each family, what the field contract now states,
# and who the first consumer actually is. One of the three has NO consumer, and
# that is recorded as an empty value with an owner rather than filled in.
#
# No write_scope is widened, no package_action changes, and no product pulse is
# created. The proof ceiling of this wave is unchanged.
# ---------------------------------------------------------------------------
[[w0_contract_handoff_note]]
issue = 261
family = "eliot-memory-projection-contracts-selection"
owning_crate = "eliot-memory-projection-contracts"
in_this_wave = false
in_this_wave_reason = "this wave assigns orders 1-31 and the projection-contracts seam is foundation, assigned upstream"
definition_revision = "eliot_contracts::ContractVersion 0.2.0, exact triple equality, under freeze rule VR-SELECTION-CONTRACT-VERSION"
field_contract_state = "FROZEN_EXACT at 6 of 6 members as of freeze r11, every row carrying a resolving validator anchor and a typed error variant"
input_rust_path = "eliot_memory_projection_contracts::MemoryProjectionBatch plus MemoryQueryIntent plus MemorySelectionPolicy"
output_rust_path = "eliot_memory_projection_contracts::MemorySelectionTrace"
first_consumer = ""
first_consumer_status = "NONE_EXISTS"
error_unknown_behaviour = "Every rejection is a SelectionError or a wrapped MemoryProjectionError variant. An unreadable batch produces NO trace at all rather than a partial one, and an UNKNOWN batch denominator does not block selection because select() reads that denominator and never echoes it, since selection deliberately claims no completeness."
later_positive_acceptance = "a selection over a batch whose records are all inside the allowlist and whose passing count is at or below the intent limit yields a trace whose coverage.considered equals the consumer's own batch.records length, whose selected plus not_selected equals considered, and which survives validate_against against the exact intent, policy and batch it was computed from"
later_negative_acceptance = "a trace whose selected exceeds either the echoed policy ceiling or the intent limit is rejected as LimitOverPolicy or LimitExceeded rather than by silent truncation; a trace whose counts balance but whose entries do not replay against the batch is rejected as CoverageMismatch"
owning_task_for_the_gap = "the cognitive-wave integrator named as integration_owner at crates/foundation/eliot-memory-projection-contracts/module.toml"
proof_ceiling = "STATIC_FIELD_CONTRACT_ONLY"
evidence_execution_status = "NOT_EXECUTED"

