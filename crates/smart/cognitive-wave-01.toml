schema_version = 3
wave_id = "cognitive-micromodules-wave-01"
status = "PROTOTYPE_ASSIGNMENT_READY"
base_commit = "7d7f03259cc3d3d90b2fe1af7a6175b13808ece2"
normative_architecture = "ELIOT Architecture 4.5-draft / English edition 2026-08-28"
normative_implementation = "ELIOT Implementation 0.29-draft / English edition 2026-08-28"
purpose = "Prepare function-bounded cognitive crates and one-agent assignments without writing Rust implementation code."
integration_owner = "cognitive-wave-01-integrator"
workspace_rule = "Prototype Cargo manifests are intentionally absent from the root workspace until implementation and integration review; package proof runs in an isolated candidate workspace or integration branch."
agent_rule = "One agent receives exactly one active module.toml plus its immediate provider/consumer contracts and donor anchors."
loc_rule = "10000 LOC is a soft review ceiling; causal cohesion, one owner, one proof surface and one replacement boundary decide topology."
old_branch_rule = "cognitive-crates-prototypes-01 is superseded as an assignment source; reuse only revalidated boundary ideas, never its stale effective indexes or empty crates."
product_pulse_id = "D3A_COGNITIVE_ORIENTATION_PULSE_01"
product_pulse = "From one admitted observation/evidence snapshot and an observed cue, produce deterministic classification, cue activation, Current Epistemic Position, a Decision-Safety-Floor-preserving Active Understanding View, and a candidate-only DreamPacket with rivals, unknowns and probes; no cognitive crate mutates canonical state or performs an external effect."
product_pulse_gate = "Orders 15-27 are assigned only after order 14 closes this pulse; no post-orientation handler is admitted to the workspace or runtime earlier."

[global_boundaries]
forbidden = ["second canonical or operational state owner", "Dreamer source acquisition or Researcher denominator ownership", "provider/model SDK in cognitive cores", "job scheduling, process supervision or route reservation", "truth/support/authority/policy/finish/effect promotion", "unbounded hot-path work", "similarity as exact applicability or proof", "active generation self-modification"]
required = ["one causal responsibility", "explicit statelessness or rebuildable projection state", "typed provider/consumer ports", "independent proof surface", "local visible degradation", "replacement/removal boundary"]

[[stage]]
id = "CAPTURE_AND_CUES"
orders = [1, 5]
gate = "shared contracts and normalization symmetry before projection/activation"

[[stage]]
id = "EPISTEMIC_AND_CONTEXT"
orders = [6, 10]
gate = "Current Epistemic Position before candidate admission; admission before assembly"

[[stage]]
id = "DREAMER_ORIENTATION_FOUNDATION"
orders = [11, 14]
gate = "contracts -> bundle -> common validation -> Orientation Product Pulse"

[[stage]]
id = "POST_ORIENTATION_HANDLERS"
orders = [15, 27]
gate = "assign only after the Orientation Product Pulse passes; subtype handlers before curation facade"

