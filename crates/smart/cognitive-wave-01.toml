schema_version = 5
wave_id = "cognitive-micromodules-wave-01"
status = "PROTOTYPE_ASSIGNMENT_READY_AFTER_STATIC_REVIEW"
base_commit = "ce05a82500093681862727909f00483522e600f8"
normative_pair = "ELIOT Architecture 4.5-draft + Implementation 0.29-draft; English edition 2026-08-28"
purpose = "Keep D1 capture ownership in Governor, deliver D3a Basic Dreamer Orientation, then D3b reactive context, then bounded candidate-only curation."
integration_owner = "cognitive-wave-integrator"
agent_rule = "One agent receives one module manifest, frozen one-hop contracts, old failure, discriminator, exact write scope, proof ceiling and Product Pulse."
workspace_rule = "Prototype packages stay outside the root workspace until implementation, package proof, affected Edge proof, current-main rebind and integration review."
size_rule = "10000 LOC is a review signal only; causal cohesion, state ownership, proof, change closure and replacement boundary decide topology."
authority_rule = "No prototype owns canonical state, runtime scheduling, evaluator state, policy, authority, finish or external effects."
supersession_rule = "The stale cognitive-crates-prototypes-01 branch is not an assignment source."

[[stage]]
id = "D1_CAPTURE_OWNER_REPAIR"
orders = [1, 1]
gate = "Keep first-pass classification inside existing Governor observation owner."

[[stage]]
id = "D3A_ORIENTATION_FIRST_VALUE"
orders = [2, 9]
gate = "Current Epistemic Position and candidate-only Orientation before D3b."

[[stage]]
id = "D3B_REACTIVE_CONTEXT_NEXT_VALUE"
orders = [10, 19]
gate = "Cue binding/index/activation, context admission/assembly and pure delivery planning."

[[stage]]
id = "D3A_BOUNDED_CURATION_EXPANSION"
orders = [20, 31]
gate = "Assign only after Orientation Product Pulse shows useful value."

[[product_pulse]]
id = "D1_CAPTURE_CLASSIFICATION_EDGE_01"
scenario = "Misleading/ambiguous hint is preserved once by Governor as a deterministic family or cold candidate."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Product proof only"

[[product_pulse]]
id = "D3A_ORIENTATION_PULSE_01"
scenario = "One current goal yields a source-linked DreamPacket with epistemic position, separate Architecture/Implementation briefs, rivals, unknowns and probes."
status = "NOT_EXECUTED"
proof_ceiling = "Exact-scenario Product proof only"

[[product_pulse]]
id = "D3B_REACTIVE_CONTEXT_PULSE_01"
