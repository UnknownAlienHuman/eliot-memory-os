[package]
name = "eliot-dreamer-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Provider-neutral Dreamer job, input, grounding, validation, orientation, research, curation and W1 policy contracts."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
layer = "C0"
purpose = "bounded candidate-only Dreamer contract hub"
source_maintenance_owner = "cognitive-integration-owner"
functional_cell_refs = [
  "smart.dreamer.contracts.common",
  "smart.dreamer.contracts.orientation",
  "smart.dreamer.contracts.research",
  "smart.dreamer.contracts.curation",
]
independent_proof_profile = "prototype-not-workspace-admitted"
contract_refs = [
  "crates/smart/cognitive-current.toml",
  "crates/smart/eliot-dreamer-contracts/common.contract.toml",
  "crates/smart/eliot-dreamer-contracts/orientation.contract.toml",
  "crates/smart/eliot-dreamer-contracts/research.contract.toml",
  "crates/smart/eliot-dreamer-contracts/curation.contract.toml",
  "crates/smart/eliot-dreamer-contracts/w1-policy.contract.toml",
]
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
workspace_admission = "forbidden until all contract cells have Rust implementation, ModuleTestCapsule, affected real Edge Proof and named Product Pulses"

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
