[package]
name = "eliot-dreamer-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Own provider-neutral job, bundle, draft, candidate, preservation and result schemas shared by all Dreamer handlers."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.dreamer.contracts"
source_layer = "C0"
runtime_layer = "R6"
runtime_bundle = "eliot-dreamer"
agent_order = 3

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-receipts = { path = "../../foundation/eliot-receipts" }
blake3 = "1.8.5"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
sha2 = "0.10.9"
thiserror = "2.0.18"

[lints]
workspace = true

# Standalone workspace root. Without this, cargo walks above the repository
# and can bind this package to an unrelated ancestor manifest, so every
# per-crate `cargo check|test|clippy` fails before it starts. Remove this
# table when the cell is promoted into the root workspace `members`.
[workspace]

# Mirrors the root `[workspace.lints]` verbatim so an excluded cell is linted
# exactly like an admitted one. Keep in sync; the promotion commit drops this
# whole `[workspace]` table and restores plain inheritance.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
