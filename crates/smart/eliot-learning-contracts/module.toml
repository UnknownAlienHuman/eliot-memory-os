schema_version = 3
module_id = "smart.learning.contracts"
crate = "eliot-learning-contracts"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-02"
agent_order = 32
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D4"
source_layer = "C0"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.learning.contracts"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal cohesion, proof, owner, build/test closure and replacement boundary decide topology"
product_objective = "Consequential work changes the next compatible attempt through inspectable local learning, or records why no change is justified."
causal_property = "online-learning contract representation"
old_failure_or_missing_capability = "updated I12.24 objects exist only in prose and no shared source contract joins Context, Dreamer and Meta"
discriminator = "all learning cells compile against one contract without creating a campaign state owner"
primary_responsibility = "Own provider-neutral contracts for CampaignLearningStateView, AttemptLearningDelta, CampaignHarnessOverlay candidate, activation/adherence assessment and closure inputs."
owned_mutable_state = []
allowed_effects = []
inputs = ["foundation task/attempt/evidence/evaluation identities"]
outputs = ["learning state/delta/overlay/activation/closure schemas"]
depends_on = []
providers = ["foundation contracts"]
consumers = ["learning state view", "learning delta", "learning overlay", "activation assessment", "Meta closure"]
non_goals = ["scheduler/task graph", "canonical admission", "promotion decision"]
invariants = ["views are derived not mutable aggregates", "activation/delivery/adherence/outcome orthogonal", "no self-promotion field"]
failure_behavior = "Return explicit inconclusive/no-change/unsupported output with exact missing evidence; never fabricate learning or promotion."
proof_surface = ["schema roundtrip", "forbidden owner fields", "lifecycle compatibility", "consumer fixtures"]
proof_ceiling = "Module proof only; real provider/consumer edge and Product Pulse remain separate"
product_pulse = "ONLINE_LEARNING_INNER_LOOP_PULSE_01"
replacement_boundary = "implementation behind the declared public contract; package ownership creates no runtime or semantic authority"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.24"
disposition = "authoritative contract"

[[donor]]
path = "ELIOT_ARCHITECTURE A14"
disposition = "intent/invariants"

[agent_task]
objective = "Create the common online-learning contract hub."
write_scope = ["crates/smart/eliot-learning-contracts/**"]
deliverables = ["typed pure core/contract", "negative and lifecycle fixtures", "affected edge fixtures"]
acceptance = ["task-local/candidate-only ceiling is explicit", "no evaluator/authority ownership", "missing observability remains unknown"]
forbidden = ["canonical writes outside the named Governor transition path", "truth/support/authority/policy/finish/effect promotion", "provider or model SDKs in pure cognitive cores", "vendor or storage types in public contracts", "unbounded synchronous work", "silent truncation", "oracle or verifier weakening in the same work unit", "implicit scope widening", "active-generation self-modification"]
stop_condition = "Stop if the change would alter user objective, acceptance, authority, privacy, evaluator, sealed holdout, active production generation or its own promotion."
challenge_path = "return ContractChallenge to the integration owner when owner, discriminator, proof ceiling or dependency boundary is wrong"
integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = ["module/package proof at the declared proof ceiling", "real provider/consumer fixture for every changed edge", "the named Product Pulse before promotion", "exact donor reuse/rewrite/reject trace"]
writeback = "return implementation artifact, exact proof evidence, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "forbidden until implementation, package proof, affected edge proof, current-main rebase and integration-owner review"

# Machine-checked completion gate, read by `scripts/verify-work-unit.py`.
# `cargo fmt|test|clippy` all pass on an empty crate, so they cannot tell a
# finished cell from an unstarted one. This table can.
#
# `source_issue` names the assignment this gate enforces. `test_matrix_cases` is
# the number of numbered cases in that issue's `Required test matrix` section,
# and `min_tests` may never fall below it -- otherwise the gate certifies work
# that ignores most of the matrix the assignment demands.
[acceptance]
source_issue = 590
source_unit = "A-32"
test_matrix_cases = 58
min_source_lines = 200
min_public_items = 6
min_tests = 58
require_deny_unknown_fields = true
forbid_unsafe = true
required_exports = []
required_tests = []
forbidden_patterns = ['serde_json::Value', 'unimplemented!', 'todo!']
