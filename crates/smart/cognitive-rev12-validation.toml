[[gate]]
id = "V01_TOML_PARSE"
requirement = "Every changed prototype artifact parses as TOML."

[[gate]]
id = "V02_ORDER_CLOSURE"
requirement = "Indexed orders are exactly 1..86 with no duplicate cell ID."

[[gate]]
id = "V03_SINGLE_ASSIGNMENT_VIEW"
requirement = "One indexed cell record is the only assignment/API authority; legacy module/api files are forbidden assignment sources."

[[gate]]
id = "V04_PUBLIC_TYPE_OWNER"
requirement = "Every public type has one owner; ContextProviderProjectionRequest is owned by eliot-context-contracts."

[[gate]]
id = "V05_CRATE_SEAM"
requirement = "Each of 31 crates has an owner/dependency/proof/replacement seam; agent or function count is not a seam."

[[gate]]
id = "V06_HOT_PATH"
requirement = "Exactly 15 hot cells; all have bounded complexity, deterministic ordering, no I/O/model/provider SDK and visible degradation."

[[gate]]
id = "V07_CANDIDATE_ONLY"
requirement = "Dreamer and Meta outputs contain no canonical transition, authority, job, effect, scheduler, finish or promotion decision."

[[gate]]
id = "V08_DIMENSIONAL_EVIDENCE"
requirement = "Transformation, Context quality, memory ecology, Skill/tool utility, learning and understanding use dimension vectors; no aggregate confidence/intelligence score."

[[gate]]
id = "V09_MEMORY_SEPARATION"
requirement = "Existence, support, accessibility and permitted influence are distinct; retrieval/repetition cannot reinforce."

[[gate]]
id = "V10_CAUSALITY"
requirement = "Chronology/association/prediction/intervention support remain distinct; success alone cannot prove mechanism."

[[gate]]
id = "V11_RESEARCH_BOUNDARY"
requirement = "Researcher acquires, Dreamer interprets, Governor governs; no provider discovery/credential/network acquisition in Dreamer cells."

[[gate]]
id = "V12_LEARNING_BOUNDARY"
requirement = "Task-local overlay is reversible and cannot change goal, acceptance, authority, privacy, cost, evaluator or its own promotion."

[[gate]]
id = "V13_META_BOUNDARY"
requirement = "Memory/Skill/tool/Dreamer/self-quality assessments consume owner projections and return views or candidates only."

[[gate]]
id = "V14_COMMON_GROUND"
requirement = "Handoff checks goals, decisions, invariants, rivals, unknowns, commitments and action consequences; summary similarity is insufficient."

[[gate]]
id = "V15_SCOPED_UNDERSTANDING"
requirement = "LOCALLY_ADEQUATE requires rival-aware public model, prediction before observation, discriminator, outcome/verifier and revision discipline."

[[gate]]
id = "V16_SOURCE_SCOPE_EXCLUSIVITY"
requirement = "Worker source/test scopes do not overlap; Cargo/lib/reexports belong to integration owner."

[[gate]]
id = "V17_PAYLOAD_HYGIENE"
requirement = "Prototype diff contains TOML only; no Rust, Markdown, workflow, archive, probe, .eliot, root Cargo.toml or Cargo.lock changes."

[[gate]]
id = "V18_PROOF_CEILING"
requirement = "No parse, branch, commit, test count or design review claims implementation/runtime/product support."
