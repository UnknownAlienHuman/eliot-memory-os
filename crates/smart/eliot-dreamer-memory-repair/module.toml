status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 26
plane = "Smart"
runtime_layer = "R6"
delivery_depth = "D3a"
source_layer = "C1"
runtime_bundle = "eliot-dreamer"
state_class = "stateless"
hot_path = false
lifecycle_owner = "smart.dreamer.memory_repair"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Propose one bounded memory repair for missing provenance, contaminated influence, stale derived views, false relations, or representation gaps, including affected dependency closure and verification."
owned_mutable_state = []
allowed_effects = []
inputs = ["DreamJobInput class=Curation", "ValidatedDreamDraft item kind=repair", "source/provenance/influence/disclosure and projection evidence"]
outputs = ["MemoryRepairCandidate", "affected dependency closure", "verification/rollback/quarantine recommendation"]
depends_on = ["eliot-dreamer-contracts", "eliot-dreamer-candidate-validation"]
