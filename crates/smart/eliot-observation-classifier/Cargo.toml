[package]
name = "eliot-observation-classifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Deterministic first-pass classification of admitted observations into candidate record roles"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.observation.classifier"
source_layer = "C1"
runtime_layer = "R5"
runtime_bundle = "eliotd"
agent_order = 1

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-observation-contracts = { path = "../../foundation/eliot-observation-contracts" }
