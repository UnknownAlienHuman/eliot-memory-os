schema_version = 2
module_id = "smart.observation.classifier"
crate = "eliot-observation-classifier"
status = "PROTOTYPE"
wave = "cognitive-micromodules-wave-01"
agent_order = 1
plane = "Smart"
runtime_layer = "R5"
delivery_depth = "D3b"
source_layer = "C1"
runtime_bundle = "eliotd"
state_class = "stateless"
hot_path = true
lifecycle_owner = "smart.observation.classifier"
loc_soft_ceiling = 10000
loc_policy = "review ceiling only; causal responsibility, proof and replacement boundary decide split/merge"
primary_responsibility = "Classify an already admitted observation into a bounded candidate role and reason trace while preserving safe cold capture."
owned_mutable_state = []
allowed_effects = []
inputs = ["AdmittedObservationEnvelope", "registered verifier/tool metadata", "optional caller hint"]
outputs = ["ObservationClassificationCandidate", "ClassificationTrace", "cold-capture fallback disposition"]
depends_on = []
consumers = ["eliot-cue-normalizer", "Governor observation admission"]
non_goals = ["canonical writes", "epistemic promotion", "task or scope selection", "semantic Dreamer curation"]
invariants = ["a wrong hint never discards otherwise safe material", "text content never creates Human authority", "uncertain material remains an ObservationCandidate", "classification is deterministic for one contract revision"]
failure_behavior = "Return an untyped/cold ObservationCandidate plus exact validation reasons; never fabricate a stronger record kind."
proof_surface = ["wrong-hint preservation fixtures", "verifier/tool classification fixtures", "stable failure-signature cases", "Human-authority laundering negative cases"]
replacement_boundary = "crate implementation behind the declared public contract; no runtime authority follows from package ownership"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface, or independent rollback boundary appears"

[[donor]]
path = "crates/smart/eliot-memory/src/lib.rs"
disposition = "extract_pure_only"
scope = "classification and normalization ideas; reject MemoryPlane state ownership"

[[donor]]
path = "ELIOT_IMPLEMENTATION I12.2-I12.3"
disposition = "authoritative_contract"
scope = "capture-first and deterministic classification pipeline"

[agent_task]
objective = "Implement the deterministic first-pass classifier without importing the legacy MemoryPlane."
write_scope = ["crates/smart/eliot-observation-classifier/**"]
deliverables = ["public candidate/trace contract", "pure classifier", "table-driven and adversarial tests"]
acceptance = ["safe capture survives misclassification", "no authority or support promotion", "unknown input has an explicit candidate result"]
forbidden = ["canonical writes", "authority, policy, truth, finish or effect decisions", "provider/model SDKs", "storage/vendor types in public contracts", "unbounded synchronous work", "silent truncation", "weakening another owner's verifier or oracle"]
stop_condition = "Stop and return a ContractChallenge if classification requires canonical state mutation or model judgment."
integration_owner = "cognitive-wave-01-integrator"
implementation_language = "Rust 2024"
required_verification = ["package-local shape/behavior proof", "declared consumer/provider contract fixtures", "affected Product Pulse when listed"]
workspace_admission = "forbidden until src/lib.rs, package proof, affected edge proof, current-main rebase and integration-owner review"
