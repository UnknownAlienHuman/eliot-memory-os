[package]
name = "eliot-dreamer-cycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Pure bounded one-step Dreamer controller transition"

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED_PROTOTYPE"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "smart.dreamer.cycle"
source_layer = "C0"
runtime_layer = "R6"
runtime_bundle = "eliot-dreamer"

[dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts" }
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-dreamer-contracts = { path = "../eliot-dreamer-contracts" }
eliot-receipts = { path = "../../foundation/eliot-receipts" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
