[package]
name = "eliot-git-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Typed Git bridge without destructive worktree handling (issue 1830)"

[lib]
name = "eliot_git_bridge"
path = "src/lib.rs"

# Documented classification (scripts/code_navigation.py check):
# explicit prototype label plus admission state. Navigation closure through
# the shared `crates/bridges/**` logical-block mapping in root-owned
# docs/code-navigation/logical-blocks.toml and the #1811 gate (standalone
# carveout removed at admission: this crate is a workspace member).
[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "admitted via #1830 root workspace membership as the typed Git bridge (I10.9); executor binding proven package-local; prototype classification retained pending integration-owner review"

[dependencies]
eliot-process.workspace = true
eliot-process-executor.workspace = true
