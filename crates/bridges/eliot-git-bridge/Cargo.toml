[package]
name = "eliot-git-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Typed Git bridge without destructive worktree handling (issue 1830)"

# Standalone workspace root on purpose: root integration owns admission into
# the workspace `members` table, so this crate must build and test in
# isolation via --manifest-path with an isolated --target-dir.
[workspace]

[lib]
name = "eliot_git_bridge"
path = "src/lib.rs"

# Documented prototype classification (scripts/code_navigation.py check):
# explicit prototype label plus admission state. Full navigation closure also
# needs the shared `crates/bridges/**` logical-block mapping (root-owned
# docs/code-navigation/logical-blocks.toml) and the #1811 disposition row.
[package.metadata.eliot]
prototype = true
source_status = "IMPLEMENTED"
workspace_admission = "prototype per #1830; executor binding proven package-local; forbidden until root workspace membership, lock admission, navigation-index regeneration and integration-owner review"

[dependencies]
eliot-process = { path = "../../kernel/eliot-process", version = "0.1.0" }
eliot-process-executor = { path = "../../instrument/eliot-process-executor", version = "0.1.0" }
serde_json = "1.0.150"

[dev-dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts", version = "0.1.0" }
eliot-platform = { path = "../../kernel/eliot-platform", version = "0.1.0" }
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"
