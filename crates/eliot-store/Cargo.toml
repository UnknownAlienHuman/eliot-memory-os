[package]
name = "eliot-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
blake3.workspace = true
# The Windows Job Object mechanics owner (issue #1888): the owned SurrealDB
# server is assigned to a kill-on-close Job at launch so an owned server ends
# with its owner. This is the existing declared `process_owner` for Windows
# process/Job mechanics in `config/architecture-boundaries.toml`; no second Job
# wrapper is introduced.
eliot-platform-windows.workspace = true
eliot-types.workspace = true
eliot-runtime-contracts.workspace = true
eliot-windows-ipc.workspace = true
futures-util.workspace = true
redb.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true

[dev-dependencies]
time.workspace = true

[target.'cfg(windows)'.dev-dependencies]
eliot-windows-ipc = { workspace = true, features = ["test-support"] }

[features]
live-edge = []

[lints]
workspace = true
