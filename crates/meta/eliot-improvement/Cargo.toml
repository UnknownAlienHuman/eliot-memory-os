[package]
name = "eliot-improvement"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
blake3 = "1.8.5"
eliot-contracts.workspace = true
eliot-context-contracts = { path = "../../smart/eliot-context-contracts", version = "0.1.0" }
# I12.24:76 binds the single canonical I18.47 `BudgetEquivalenceLedger` by
# value, and its own `validate()` is the only admissible check. Naming that
# type here is what lets the matched-budget gate read the ledger's recorded
# `equivalence` class instead of a caller-set Boolean. Direction is the
# A2.03:40-49 `contract` layer beneath a Meta plane cell, the same edge
# `eliot-budget` (crates/governor/eliot-budget/Cargo.toml:12) and
# `eliot-governor` (crates/governor/eliot-governor/Cargo.toml:42) already take.
eliot-evaluation-contracts.workspace = true
eliot-evidence = { path = "../../foundation/eliot-evidence", version = "0.1.0" }
eliot-governor.workspace = true
eliot-learning-contracts.workspace = true
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
eliot-agent-contracts = { path = "../../agent/eliot-agent-contracts", version = "0.1.0" }
