es at :486 and :491, and the re-export at src/lib.rs:88, so the recorded consumer reference `Governor or Human promotion owner` is an admission-path declaration and is NOT yet realised in code; this is a wiring fact read from source, not a runtime observation. Measured and NOT realised in code: this cell is not an in-code consumer of the learning-closure cell. src/promotion_input.rs never imports learning_closure and takes its own structurally declared `ClosureBinding` (closure_id, campaign_id, digest, valid, stale, lineage_ref, schema_version, revision) rather than a `learning_closure::CampaignLearningClosure` value, so construction of that binding from a real closure belongs to the external caller and is not present on current main. Review owner: the #973 integration owner named by this router."
