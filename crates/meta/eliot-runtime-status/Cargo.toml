[dev-dependencies]
eliot-evaluation-contracts.workspace = true
eliot-evidence.workspace = true
# The reader-verification fixtures in this crate's unit tests assert that a
# reader fails closed on corrupt or contradictory durable state — contours the
# append reducer provably cannot produce (a record with no applied entry, two
# records at the same applied sequence, vector order disagreeing with applied
# order). Those fixtures need the owner's test-only
# `HostStateReadVerificationParts` seam. Enabling the off-by-default feature
# from `[dev-dependencies]` unifies it into test builds only; the production
# `[dependencies]` entry above stays featureless, so the seam does not exist in
# any production composition root. Same pattern as `bins/eliot-host`.
eliot-host-state = { workspace = true, features = ["test-support"] }
eliot-observation-contracts.workspace = true
eliot-security-contracts.workspace = true

[lints]
workspace = true
