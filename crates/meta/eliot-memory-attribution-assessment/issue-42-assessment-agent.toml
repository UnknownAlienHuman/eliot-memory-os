  "direct Context, Store, task, effect, evaluator, provider, model, or tool access",
  "memory support/accessibility/influence/lifecycle/purge transition",
  "promotion, canary, rollback execution, policy, authority, or finish",
  "scalar usefulness/confidence/trust/regret score",
]
verification = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-memory-attribution-assessment --all-targets",
  "cargo test --locked -p eliot-memory-attribution-assessment",
  "cargo clippy --locked -p eliot-memory-attribution-assessment --all-targets -- -D warnings",
  "real provider/consumer fixtures on exact contract revisions",
]
stop_condition = "Return ContractChallenge for every missing producer owner, incomplete denominator, stale evaluator/fence, unresolved effect, unknown outcome window, or requested lifecycle/promotion action."
