prerequisites = [
  "accepted eliot.evaluation.attributed-memory-use.v1 Rust contract and fixtures",
  "accepted eliot.evaluation.memory-outcome-economics.v1 Rust contract and fixtures",
  "current provider ownership for decision-opportunity denominator, outcome/evaluator evidence, and cost observations",
]
write_scope = [
  "crates/meta/eliot-memory-attribution-assessment/src/**",
  "crates/meta/eliot-memory-attribution-assessment/tests/**",
  "crates/meta/eliot-memory-attribution-assessment/Cargo.toml",
]
