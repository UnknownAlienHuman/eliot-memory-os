  "crates/smart/eliot-learning-contracts/**",
]
required_tests = [
  "complete denominator qualifying non-use",
  "blind interval remains unknown",
  "acknowledgement-only remains below UseProof",
  "exact decision/action/verifier use",
  "used-but-regressed/harmful outcome",
  "composite success retains rival causes",
  "missing/non-exposed cost never becomes zero",
  "counterfactual absent limits attribution",
  "delayed outcome window remains open",
  "protected low-use material cannot receive an automatic demotion recommendation",
  "input permutation determinism",
]
