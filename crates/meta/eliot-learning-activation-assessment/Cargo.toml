[package]
name = "eliot-learning-activation-assessment"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Assess immutable retrieval/delivery/use checkpoints into a HarnessActivationReceipt candidate without inferring hidden reasoning or causal benefit."

[lib]
path = "src/lib.rs"

[package.metadata.eliot]
prototype = true
source_status = "NOT_IMPLEMENTED"
workspace_admission = "pending_agent_implementation_and_proof"
functional_cell = "meta.learning.activation_assessment"
source_layer = "C1"
runtime_layer = "R7"
runtime_bundle = "eliotd"
agent_order = 36

[dependencies]
eliot-contracts = { path = "../../foundation/eliot-contracts" }
eliot-evidence = { path = "../../foundation/eliot-evidence" }
eliot-learning-contracts = { path = "../../smart/eliot-learning-contracts" }

[lints]
workspace = true

# Standalone workspace root. Without this, cargo walks above the repository
# and can bind this package to an unrelated ancestor manifest, so every
# per-crate `cargo check|test|clippy` fails before it starts. Remove this
# table when the cell is promoted into the root workspace `members`.
[workspace]

# Mirrors the root `[workspace.lints]` verbatim so an excluded cell is linted
# exactly like an admitted one. Keep in sync; the promotion commit drops this
# whole `[workspace]` table and restores plain inheritance.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
