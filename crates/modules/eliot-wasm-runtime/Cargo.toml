[package]
name = "eliot-wasm-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Provider-neutral bounded WASM component runtime facade"

[package.metadata.eliot]
work_id = "A-12"
functional_cell = "wasm-runtime"
lifecycle_owner = "A-12"
source_layer = "C3"
proof_entrypoint = "cargo test --manifest-path crates/modules/eliot-wasm-runtime/Cargo.toml"

[workspace]

[dependencies]
eliot-observation-contracts = { path = "../../foundation/eliot-observation-contracts" }
eliot-runtime-contracts = { path = "../../foundation/eliot-runtime-contracts" }
eliot-security-contracts = { path = "../../foundation/eliot-security-contracts" }
eliot-process = { path = "../../kernel/eliot-process" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
