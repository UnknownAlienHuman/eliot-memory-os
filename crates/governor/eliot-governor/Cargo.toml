# Issue #1731 W3/W4: the Governor is the semantic owner that admits a
# negative-memory action policy and that runs the bounded pure matcher over an
# owner-resolved rule snapshot. This crate owns neither the durable record
# (`NegativeMemoryFingerprint`, `NegativeMemoryActionPolicy`) nor the matcher
# (`match_negative_memory`). `eliot-governor` is itself a runtime root (the
# binaries `eliotd`, `eliot`, `eliot-agent-bridge` and `eliot-wasm-host`, plus
# `eliot-improvement` and the `eliot-context-*` crates, all depend on it), and
# that is the point of the edge rather than an exception to it: the Governor is
# the consumer that admits and gates, so it must reach the semantic owner. The
# edge is provider-shaped like the existing `eliot-epistemic*` / `eliot-cue-*`
# Smart edges — a pure semantic owner supplies record, policy and matcher types
# and performs no I/O, holds no store handle and owns no runtime root of its own,
# so nothing semantic crosses back out of this process boundary. Kernel does not
# depend on it and never will (crates/kernel/AGENTS.md 56-58), so this edge can
# never be reached from the Kernel authority boundary.
eliot-dreamer-failure = { path = "../../smart/eliot-dreamer-failure", version = "0.1.0" }
eliot-instrument-nextest = { path = "../../instrument/eliot-instrument-nextest", version = "0.1.0" }
