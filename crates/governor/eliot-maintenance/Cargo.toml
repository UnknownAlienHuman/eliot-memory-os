[package]
name = "eliot-maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic Governor maintenance trigger and durable-job lifecycle contracts"

[package.metadata.eliot]
work_id = "G-19"
functional_cell = "maintenance"
lifecycle_owner = "G-19"
source_layer = "G"
proof_entrypoint = "cargo test -p eliot-maintenance"

[dependencies]
eliot-authority.workspace = true
eliot-contracts.workspace = true
# Issue #1695 W3: the maintenance owner records, with every source transition,
# the result-to-observation obligation its durable job revision owes. The
# execution-outcome and delivery-state vocabularies already exist in this
# foundation contract crate, so the owner states its obligation in the shared
# vocabulary instead of minting a second one beside it.
eliot-observation-contracts.workspace = true
# The observation-family record the producer emits carries a `WorkScopeId` from
# the shared receipt contract, which this crate already depends on.

eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
