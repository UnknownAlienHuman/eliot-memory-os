[package]
name = "eliot-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Legacy ELIOT Governor migration and regression facade; not a current production composition root"

[[bin]]
name = "eliot-governor"
path = "src/main.rs"

[features]
default = []
test-support = ["eliot-windows-ipc/test-support"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
eliot-engine.workspace = true
eliot-runtime-contracts.workspace = true
eliot-store.workspace = true
eliot-types.workspace = true
jsonc-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
eliot-windows-ipc.workspace = true
windows-service.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
eliot-windows-ipc = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
