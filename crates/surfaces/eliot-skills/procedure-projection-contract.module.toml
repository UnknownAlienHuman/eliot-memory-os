integration_owner = "cognitive-wave-integrator"
implementation_language = "Rust 2024"
required_verification = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-skills --all-targets",
  "cargo test --locked -p eliot-skills",
  "cargo clippy --locked -p eliot-skills --all-targets -- -D warnings",
  "real provider/consumer fixture for every changed edge",
]
writeback = "return implementation artifact, exact proof evidence, owner/compatibility gaps, donor disposition, unresolved ContractChallenges and merge/remove recommendation"
workspace_admission = "existing workspace package; new cell remains unsupported until implementation, package proof, affected Edge proof, current-main ancestry and integration-owner review"
