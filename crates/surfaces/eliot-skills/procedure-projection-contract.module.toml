split_trigger = "a mutable owner, execution effect, separate public consumer family, or independent rollback boundary appears"

[agent_task]
objective = "Implement the owner-neutral procedure-to-portable-candidate contract in the existing eliot-skills crate without duplicating current Skill lifecycle or materialization owners."
write_scope = [
  "crates/surfaces/eliot-skills/src/procedure_projection.rs",
  "crates/surfaces/eliot-skills/tests/procedure_projection.rs",
  "crates/surfaces/eliot-skills/src/lib.rs",
  "crates/surfaces/eliot-skills/Cargo.toml",
]
deliverables = [
  "deny_unknown_fields DTOs and closed dispositions",
  "cross-field identity/fence/authority validators",
  "canonical ordering and digest derivation",
  "negative, round-trip, and permutation fixtures",
  "Governor-provider and Smart-mapper consumer fixture contracts",
]
acceptance = [
  "one stateless contract responsibility",
  "all required evidence, safety, privacy, rollback, omission, and compatibility states are representable",
  "no duplicate lifecycle/materialization/package owner",
]
forbidden = [
  "canonical or lifecycle mutation",
  "installation, registration, signing, activation, execution, credential, or provider effects",
  "import of Smart or Governor implementation into the public contract core",
  "trusted/admitted package status minted from candidate input",
  "model judgment, retrieval, repetition, or import success treated as procedure acceptance",
]
stop_condition = "Return ContractChallenge when a field belongs to procedure admission, Skill lifecycle, sealed materialization, installation, tool execution, capability grant, policy, authority, or another owner."
