]
non_goals = [
  "procedure admission or promotion",
  "Skill signing, registration, installation, activation, execution, or lifecycle mutation",
  "tool/provider/runtime SDK or credential handling",
  "another package, registry, policy, capability-grant, or authority owner",
]
invariants = [
  "raw ProcedureCandidate cannot satisfy the governed input contract",
  "accepted procedure identity and receipt share exact WorkScope and StateFence",
  "verifier, rollback, safety, privacy, provenance, counterexamples, omissions, and unsupported targets remain explicit",
  "generated package candidates are quarantined and authority-free",
  "scripts and tool/capability declarations are inert",
  "existing Skill/package/lifecycle contracts remain the single current owners",
]
failure_behavior = "Reject malformed, ownerless, candidate-on-candidate, cross-fence, stale, unsafe, privacy-incompatible, or authority-escalating values; preserve explicit unsupported/unknown target dispositions."
proof_surface = [
  "accepted versus raw candidate procedure",
  "receipt/procedure identity and fence binding",
  "mandatory verifier/rollback/safety/privacy",
  "compatible and unsupported mixed target set",
  "stale dependency and Tool Definition",
  "source revocation and omission preservation",
  "inert scripts/assets/capability requirements",
  "permutation determinism",
]
proof_ceiling = "Contract/package proof only; Governor provider, Smart mapper, Skill admission/materialization, installation/execution, Edge and Product proof remain separate"
product_pulse = "D3A_CURATION_PULSE_01"
