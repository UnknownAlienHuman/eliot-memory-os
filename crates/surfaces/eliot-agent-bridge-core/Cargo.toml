[package]
name = "eliot-agent-bridge-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Thin no-state demand-start agent bridge core"

[package.metadata.eliot]
work_id = "A-16"
functional_cell = "agent-bridge-core"
lifecycle_owner = "A-16"
source_layer = "C3"
proof_entrypoint = "cargo test --manifest-path crates/surfaces/eliot-agent-bridge-core/Cargo.toml"

[dependencies]
eliot-agent-api = { path = "../../agent/eliot-agent-api", version = "0.1.0" }
eliot-observation-contracts = { path = "../../foundation/eliot-observation-contracts", version = "0.1.0" }
eliot-process = { path = "../../kernel/eliot-process", version = "0.1.0" }
eliot-protocol = { path = "../../foundation/eliot-protocol", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
