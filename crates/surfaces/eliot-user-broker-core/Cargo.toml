[package]
name = "eliot-user-broker-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Provider-neutral A-09 interactive user broker core"

[workspace]

[dependencies]
eliot-protocol = { path = "../../foundation/eliot-protocol", version = "0.1.0" }
eliot-receipts = { path = "../../foundation/eliot-receipts", version = "0.1.0" }
eliot-runtime-contracts = { path = "../../foundation/eliot-runtime-contracts", version = "0.1.0" }
eliot-security-contracts = { path = "../../foundation/eliot-security-contracts", version = "0.1.0" }
eliot-process = { path = "../../kernel/eliot-process", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
