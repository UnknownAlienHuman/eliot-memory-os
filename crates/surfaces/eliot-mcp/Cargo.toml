[package]
name = "eliot-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Stateless MCP contract bridge over ELIOT Kernel and Governor ports"

[workspace]

[dependencies]
eliot-protocol = { path = "../../foundation/eliot-protocol" }
eliot-receipts = { path = "../../foundation/eliot-receipts" }
eliot-security-contracts = { path = "../../foundation/eliot-security-contracts" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
