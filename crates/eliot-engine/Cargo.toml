[package]
name = "eliot-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
# Issue #938: `RestoreService::rollback_isolated` proves owner issuance by
# decoding the owner-placed artifact as `eliot_backup::RestoreReceipt` and
# calling that owner's own `validate()`. Declared by explicit path because
# `eliot-backup` is not a `[workspace.dependencies]` entry, matching
# `crates/storage/eliot-blob/Cargo.toml`.
eliot-backup = { path = "../storage/eliot-backup", version = "0.1.0" }
eliot-bootstrap.workspace = true
eliot-build-test-graph = { path = "../instrument/eliot-build-test-graph", version = "0.1.0" }
eliot-contracts.workspace = true
eliot-context-contracts = { path = "../smart/eliot-context-contracts", version = "0.1.0" }
eliot-context-measurement = { path = "../smart/eliot-context-measurement", version = "0.1.0" }
eliot-instrument-api.workspace = true
eliot-instrument-nextest = { path = "../instrument/eliot-instrument-nextest", version = "0.1.0" }
eliot-instrument-runner = { path = "../instrument/eliot-instrument-runner", version = "0.1.0" }
eliot-instrument-rustc = { path = "../instrument/eliot-instrument-rustc", version = "0.1.0" }
eliot-observability = { path = "../instrument/eliot-observability", version = "0.1.0" }
eliot-process.workspace = true
eliot-skills.workspace = true
eliot-store.workspace = true
eliot-types.workspace = true
eliot-verifier = { path = "../instrument/eliot-verifier", version = "0.1.0" }
eliot-windows-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
eliot-windows-ipc = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
