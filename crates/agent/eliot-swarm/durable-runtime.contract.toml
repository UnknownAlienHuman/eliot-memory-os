[documentation]
architecture = [
  "docs/architecture/A10-04-delegation.md#a104-delegation",
  "docs/architecture/A10-07-swarm-and-concilium.md#a107-swarm-and-concilium",
  "docs/architecture/A13-02-kernel-and-failure-domains.md#a132-kernel-and-failure-domains",
]
implementation = [
  "docs/architecture/I05-27-canonical-operation-identity-and-effect-identity.md#i527-canonical-operation-identity-and-effect-identity",
  "docs/architecture/I09-09-agentswarm-launch-and-no-lost-child-contract.md#i99-agentswarm-launch-and-no-lost-child-contract",
  "docs/architecture/I10-15-agent-execution-fabric-and-durable-swarm.md#i1015-agent-execution-fabric-and-durable-swarm",
  "docs/architecture/I14-13-idle-drain-and-cancellation.md#i1413-idle-drain-and-cancellation",
