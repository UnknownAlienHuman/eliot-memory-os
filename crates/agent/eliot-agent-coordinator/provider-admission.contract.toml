implementation = [
  "docs/architecture/I03-06-model-route-and-portfolio-policy.md#i36-model-route-and-portfolio-policy",
  "docs/architecture/I09-09-agentswarm-launch-and-no-lost-child-contract.md#i99-agentswarm-launch-and-no-lost-child-contract",
  "docs/architecture/I10-11-external-model-bridges.md#i1011-external-model-bridges",
