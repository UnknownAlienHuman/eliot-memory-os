[package]
name = "eliot-kernel-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Governed Kernel service lifecycle, Host handoff and readiness boundary"

[features]
test-support = []

[package.metadata.eliot]
work_id = "P-07"
functional_cell = "kernel-service"
lifecycle_owner = "P-07"
source_layer = "C1"
proof_entrypoint = "cargo test -p eliot-kernel-service"

[dependencies]
eliot-contracts.workspace = true
eliot-doctor-core.workspace = true
eliot-ipc.workspace = true
eliot-kernel-core.workspace = true
eliot-mcp.workspace = true
eliot-memory-curation = { path = "../../smart/eliot-memory-curation", version = "0.1.0" }
eliot-ors.workspace = true
eliot-platform.workspace = true
eliot-process.workspace = true
eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
eliot-protocol.workspace = true
eliot-security-contracts.workspace = true
eliot-store-api.workspace = true
schemars.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Issue #2031: Kernel-route tests share the single `KernelRouteEvidence`
# binding and the `KernelRouteStoreFixture` from `eliot-ors` instead of
# vendoring their own, so the `test-support` feature is unified into test
# builds here. Production builds never see it.
eliot-ors = { workspace = true, features = ["test-support"] }
eliot-platform-windows.workspace = true
# T11.1-DAEMON live E2E (test-only): the real Surreal adapter on a temp root
# (never the memory adapter) plus the Governor read facade under test. These
# edges never enter the production dependency graph or the runtime boundary.
eliot-store-surreal-adapter.workspace = true
eliot-read = { path = "../../governor/eliot-read", version = "0.1.0" }
# Issue #1905: lifecycle persist tests admit real curation chains, so the
# epistemic/evidence contract types behind the fixtures are test-only deps.
# They never enter the production dependency graph or the runtime boundary.
eliot-epistemic = { path = "../../smart/eliot-epistemic", version = "0.1.0" }
eliot-evidence.workspace = true
# Issue #1905 mutation legs: tests play the legitimate Governor caller via
# the owned revision encoder, and build payloads from the exact contract
# types. Test-only; production accepts caller-supplied typed payloads.
eliot-canonical.workspace = true
eliot-epistemic-contracts = { path = "../../smart/eliot-epistemic-contracts", version = "0.1.0" }
# Issue #1779 failure history: adapter tests drive the real reference
# contour (never a fake store) through the canonical failure leg.
# Test-only; production backends serve the same contract.
eliot-store-memory = { path = "../../storage/eliot-store-memory", version = "0.1.0" }
secrecy.workspace = true

[lints]
workspace = true
