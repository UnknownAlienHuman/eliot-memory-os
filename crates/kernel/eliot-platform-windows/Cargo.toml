[package]
name = "eliot-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows adapters for the provider-neutral ELIOT platform ports"

[features]
default = []
test-support = []

[dependencies]
eliot-contracts.workspace = true
eliot-windows-ipc.workspace = true
eliot-platform.workspace = true
eliot-runtime-contracts.workspace = true
eliot-security-contracts.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Globalization",
    "Win32_Security_Credentials",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows.workspace = true

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
