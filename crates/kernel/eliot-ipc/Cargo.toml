[package]
name = "eliot-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded EBP/1 transport contract and Windows named-pipe adapter"

[features]
test-support = []

[dependencies]
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-protocol.workspace = true
eliot-runtime-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
