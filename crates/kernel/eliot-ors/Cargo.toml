[package]
name = "eliot-ors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "P-06 durable non-semantic operational recovery state"

[features]
test-support = []

[package.metadata.eliot]
work_id = "P-06"
functional_cell = "operational-recovery-state"
lifecycle_owner = "P-06"
source_layer = "P"
proof_entrypoint = "cargo test -p eliot-ors"

[dependencies]
eliot-contracts.workspace = true
eliot-platform.workspace = true
eliot-process.workspace = true
eliot-receipts.workspace = true
eliot-runtime-contracts.workspace = true
eliot-security-contracts.workspace = true
eliot-store-api.workspace = true
redb.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
eliot-contracts.workspace = true
# Issue #2031: the Kernel-route fixture proof (`tests/kernel_route_fixture.rs`
# and the `test-support`-gated unit proofs) runs under the crate's declared
# proof entrypoint `cargo test -p eliot-ors`. The self dev-dependency unifies
# the off-by-default `test-support` feature into every test build without
# linking it into production builds.
eliot-ors = { path = ".", features = ["test-support"] }

[lints]
workspace = true
