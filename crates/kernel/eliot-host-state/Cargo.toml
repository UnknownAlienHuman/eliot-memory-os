[package]
name = "eliot-host-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure HostStateJournal state machine and persistence port"

[features]
default = []
test-support = []

[dependencies]
eliot-observation-contracts.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-runtime-contracts.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
