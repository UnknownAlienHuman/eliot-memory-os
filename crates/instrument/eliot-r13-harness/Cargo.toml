[package]
name = "eliot-r13-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Feature-gated R13 two-token Windows conformance harness at the Instrument boundary"

[lib]
path = "src/lib.rs"

[features]
r13-os-harness = ["dep:eliot-installation", "dep:windows-service"]

[[bin]]
name = "eliot-r13-two-token-harness"
path = "src/bin/eliot-r13-two-token-harness.rs"
required-features = ["r13-os-harness"]

[dependencies]
eliot-kernel = { path = "../../../bins/eliot-kernel", version = "0.1.0" }
eliot-contracts.workspace = true
eliot-installation = { workspace = true, optional = true }
eliot-ipc.workspace = true
eliot-kernel-service.workspace = true
eliot-platform.workspace = true
eliot-platform-windows.workspace = true
eliot-protocol.workspace = true
eliot-runtime-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same workspace feature set eliot-kernel builds with; covers
# tokio::process::Command (process), runtime::Builder (rt via
# rt-multi-thread), time::timeout/sleep (time), io::AsyncWriteExt (io-util).
tokio.workspace = true
windows-service = { workspace = true, optional = true }

[lints]
workspace = true
