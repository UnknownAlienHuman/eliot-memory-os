[package]
name = "eliot-observability-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared ELIOT observability runtime: rolling logs, OpenMetrics, Event Log, spool fallback and critical-path state"

[features]
default = []
# OTLP bridge module (I16.2). Disabled by default; no default startup may
# open a collector connection.
otlp = []

[dependencies]
eliot-contracts.workspace = true
eliot-platform-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
