[package]
name = "eliot-instrument-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bounded provider-neutral instrument runner for ELIOT"

[dependencies]
eliot-build-test-graph = { path = "../eliot-build-test-graph", version = "0.1.0" }
eliot-bootstrap.workspace = true
eliot-contracts.workspace = true
eliot-instrument-api.workspace = true
eliot-instrument-cargo = { path = "../eliot-instrument-cargo", version = "0.1.0" }
eliot-instrument-dotnet = { path = "../eliot-instrument-dotnet", version = "0.1.0" }
eliot-instrument-nextest = { path = "../eliot-instrument-nextest", version = "0.1.0" }
eliot-instrument-rustc = { path = "../eliot-instrument-rustc", version = "0.1.0" }
eliot-instrument-rustfmt = { path = "../eliot-instrument-rustfmt", version = "0.1.0" }
eliot-instrument-scip = { path = "../eliot-instrument-scip", version = "0.1.0" }
eliot-process.workspace = true
eliot-process-executor = { path = "../eliot-process-executor", version = "0.1.0" }
eliot-receipts.workspace = true
eliot-store-api.workspace = true
eliot-test-selection = { path = "../eliot-test-selection", version = "0.1.0" }
eliot-testd-core.workspace = true
eliot-verifier = { path = "../eliot-verifier", version = "0.1.0" }
serde.workspace = true
serde_json = "1.0.150"
thiserror = "2.0.18"

[[bin]]
name = "eliot-verifier-selfchange"
path = "src/bin/eliot-verifier-selfchange.rs"

# The one production entry a local `verify.ps1` run and a CI run both execute
# (issue #1914 W2/W4, I18.21). It resolves a closed profile ALIAS through
# `resolve_verification_route`, runs the admitted stages as real processes under
# the Kernel dispatch fence, and issues the shared
# `VerificationProfileReceipt`. No thin invoker names a command list.
[[bin]]
name = "eliot-profile-resolver"
path = "src/bin/eliot-profile-resolver.rs"

[lints]
workspace = true
