[package]
name = "eliot-instrument-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bounded provider-neutral instrument runner for ELIOT"

[dependencies]
eliot-instrument-api = { path = "../eliot-instrument-api", version = "0.1.0" }
eliot-process = { path = "../../kernel/eliot-process", version = "0.1.0" }
serde_json = "1.0.150"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
