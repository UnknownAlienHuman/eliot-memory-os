[package]
name = "eliot-instrument-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bounded provider-neutral instrument runner for ELIOT"

[dependencies]
eliot-contracts.workspace = true
eliot-instrument-api.workspace = true
eliot-instrument-cargo = { path = "../eliot-instrument-cargo", version = "0.1.0" }
eliot-instrument-dotnet = { path = "../eliot-instrument-dotnet", version = "0.1.0" }
eliot-instrument-nextest = { path = "../eliot-instrument-nextest", version = "0.1.0" }
eliot-instrument-rustc = { path = "../eliot-instrument-rustc", version = "0.1.0" }
eliot-instrument-rustfmt = { path = "../eliot-instrument-rustfmt", version = "0.1.0" }
eliot-instrument-scip = { path = "../eliot-instrument-scip", version = "0.1.0" }
eliot-process.workspace = true
serde_json = "1.0.150"
thiserror = "2.0.18"

[lints]
workspace = true
