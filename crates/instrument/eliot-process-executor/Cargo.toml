[package]
name = "eliot-process-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sole governed Windows ProcessExecutor implementation for ELIOT"

[dependencies]
eliot-instrument-api.workspace = true
