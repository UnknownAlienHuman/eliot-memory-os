[functions]
public = [
  "required_control_reserve_bottlenecks() -> [CapacityBottleneck; 15]",
  "canonicalize_control_reserve_profile(profile) -> Result<ControlReserveProfile, ControlReserveContractError>",
  "validate_control_reserve_profile(profile) -> Result<(), ControlReserveContractError>",
  "classify_capacity_request(request) -> Result<CapacityClass, ControlReserveContractError>",
  "validate_capacity_request(request, profile) -> Result<(), ControlReserveContractError>",
  "validate_capacity_permit(request, permit, profile) -> Result<(), ControlReserveContractError>",
  "validate_capacity_release(permit, release, profile) -> Result<(), ControlReserveContractError>",
  "derive_reserve_health(profile, current_owner_evidence) -> Result<ReserveHealthDisposition, ControlReserveContractError>",
]
forbidden = [
  "allocate or retain a permit inside the contract crate",
  "one global semaphore",
  "one scalar reserve percentage",
  "priority-only reserve enforcement",
  "normal borrowing from protected/emergency partitions",
  "implicit promotion of normal work to control",
  "conversion from DownstreamHeadroomReservation to Control Reserve permit",
  "capacity reset after restart without durable reconciliation",
  "inference of owner or availability from a PID/process/queue/counter alone",
]

[errors]
closed_values = [
  "UNSUPPORTED_CONTRACT_REVISION",
  "MISSING_BOTTLENECK",
  "DUPLICATE_BOTTLENECK",
  "NONCANONICAL_PROFILE",
  "UNKNOWN_OR_UNSUPPORTED_BOTTLENECK",
  "MISSING_CAPACITY_OWNER",
  "MISSING_ENFORCEMENT",
  "PRIORITY_ONLY_ENFORCEMENT_FORBIDDEN",
  "MISSING_PROOF_PROFILE",
  "MISSING_EVIDENCE",
  "MISSING_INVALIDATION_SET",
  "UNIT_MISMATCH",
  "ZERO_CAPACITY",
  "CAPACITY_SUM_OVERFLOW",
  "PARTITIONS_EXCEED_PHYSICAL_TOTAL",
  "MISSING_NORMAL_PARTITION",
  "MISSING_PROTECTED_PARTITION",
  "INVALID_CAPACITY_CLASS",
  "NORMAL_BORROWING_FORBIDDEN",
  "EMERGENCY_BORROWING_FORBIDDEN",
  "STALE_PROFILE",
  "STALE_OWNER_GENERATION",
  "STALE_AUTHORITY_EPOCH",
  "OPERATION_IDENTITY_MISMATCH",
  "PERMIT_LIMIT_MISMATCH",
  "RELEASE_LIMIT_MISMATCH",
  "CONTROL_GUARANTEE_LOST",
]

[migration]
current_defect = "eliot-kernel-core FrontDoor uses one ControlReserve pool for ordinary authorize and explicit long-running control acquisition"
current_idempotency_limit = "the in-memory FIFO IdempotencyLedger is not durable operation/effect reconciliation"
normal_pool_target = "ordinary daemon/store/read/write/module work uses a separate normal bounded pool"
protected_pool_target = "only closed ControlOperationClass operations use protected partitions"
emergency_target = "optional preallocated slot records reserve loss/gap or enters recovery"
no_relabel_rule = "renaming the existing ordinary pool or assigning higher priority does not satisfy the contract"

[[migration.wave]]
order = 1
owner = "eliot-runtime-contracts"
scope = ["contract", "canonicalization", "validation", "property/golden fixtures"]
must_not_touch = ["Kernel pool implementation", "ORS", "Store", "Host", "Watchdog", "Product status"]

[[migration.wave]]
order = 2
owner = "Kernel FrontDoor"
scope = ["normal/protected/emergency split", "typed operation classes", "owner-produced permit evidence"]
must_not_touch = ["ORS/Store adapter internals", "global Product claim"]

[[migration.wave]]
order = 3
owner = "ORS and Store adapters"
scope = ["transaction/byte/connection/memory partitions", "durable permit reconciliation"]
must_not_touch = ["process/notification adapter internals"]

[[migration.wave]]
order = 4
owner = "Host/process/IPC/Watchdog/notification adapters"
scope = ["launch/control slots", "pipe/handle/disk paths", "critical signal and inbox delivery"]
must_not_touch = ["semantic task scheduling or finish"]

[[migration.wave]]
order = 5
owner = "integration and Product proof"
scope = ["multidimensional saturation fault matrix", "lost-last-resort recovery", "issue-11 Product Pulse"]
must_not_touch = ["support promotion without executed evidence"]

[fixtures]
minimum = [
  "complete profile contains exactly all fifteen bottlenecks",
  "omitted and duplicate bottleneck rows fail closed",
  "CLAIMED row requires owner, generation, protected partition, enforcement, proof, evidence, and invalidation",
  "UNKNOWN and UNSUPPORTED remain visible and cannot satisfy a reserve claim",
  "normal saturation leaves protected capacity available",
  "normal request for protected or emergency class is rejected",
  "protected request for normal or emergency class is rejected",
  "emergency partition is optional but never borrowable",
  "priority-only configuration is rejected",
  "limits with different units cannot be aggregated",
  "partition sum overflow and physical-total overflow fail closed",
  "one exhausted bottleneck produces a dimension-local disposition",
  "last-resort loss produces CONTROL_GUARANTEE_LOST",
  "stale operation, generation, epoch, or profile rejects permit evidence",
  "release amount/unit mismatch fails",
  "restart without durable release/reconciliation cannot restore capacity",
  "profile permutation canonicalizes identically and strict serialized order rejects drift",
  "DownstreamHeadroomReservation cannot create a protected permit",
  "ordinary Store/daemon admission cannot consume the final protected slot",
]

[consumer_proof]
package = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-runtime-contracts --all-targets",
  "cargo test --locked -p eliot-runtime-contracts",
  "cargo clippy --locked -p eliot-runtime-contracts --all-targets -- -D warnings",
]
module = [
  "Kernel normal/protected saturation proof",
  "owner-local ORS/Store/process/IPC/notification capacity proof",
  "durable permit release/reconciliation proof",
]
edge = [
  "normal Store writes backpressure while cancellation/fencing/recovery completes",
  "independent Ordering Scope workload cannot consume another scope's control path",
  "reserve-loss evidence reaches Watchdog/Problem/Incident path through a remaining protected or emergency route",
]
product = [
  "issue-11 saturation pulse with normal work rejected and control/recovery completed",
  "manual/platform recovery boundary when last-resort capacity is unavailable",
]

[stop_conditions]
contract_challenge = [
  "a bottleneck cannot identify one owner, unit, or enforceable partition",
  "the proposed mechanism is priority-only or one global semaphore",
  "durable operation identity is unavailable for permit reconciliation",
  "a normal workload requires protected borrowing to pass",
  "the profile omits an I14.3 bottleneck instead of marking it UNKNOWN or UNSUPPORTED",
  "the proof measures queue ordering but not preserved capacity",
  "the implementation would create a second scheduler, authority owner, or recovery ledger",
]
