schema = "eliot.capability-cells.v1"
package = "eliot-runtime-contracts"

# Pure C0 schemas and legality checks. These cells own no process, service,
# authority, lease, ORS, Host-journal, publication, route or canonical state.

[[cell]]
cell_id = "foundation.runtime-contracts.lifecycle-core"
causal_responsibility = "Define provider-neutral process, health, generation, cutover and recovery schemas plus pure legality checks."
lifecycle_owner = "none.stateless-runtime-contract"
runtime_owner = "none.stateless-runtime-contract"
runtime_bundle = "eliot-runtime-contracts.rlib"
execution_contour = "static_native"
replacement_class = "offline_release"
removal_boundary = "Replace only through additive compatibility or an explicit consumer migration of the runtime contract family."
stateless = true
allowed_effect_classes = []
contract_owner = "contract.foundation.runtime-contracts"
contract_sources = ["crates/foundation/eliot-runtime-contracts/src/lib.rs"]
proof_entrypoint = "cargo test --locked -p eliot-runtime-contracts"
proof_ceiling = "PACKAGE_PURE_CONTRACT_ONLY"
edge_profiles = ["runtime-contract-consumer-compatibility"]
product_pulse = "D0_RUNTIME_CONTRACT_COMPATIBILITY_01"
implementation_support = "CURRENT_UNVERIFIED"
evidence_execution_status = "NOT_EXECUTED"
providers = ["foundation-contract-primitives"]
consumers = ["host", "kernel", "watchdog", "runtime-status", "installation", "governor"]
invalidation = ["source_sha", "normative_pair", "contract_digest", "consumer_contract_digest"]

