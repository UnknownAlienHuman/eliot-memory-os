# Cell manifest for the `test-support` functional capability cell.
#
# One manifest represents one FunctionalCapabilityCell, never one Cargo
# package (I2.20:26), and package membership never transfers lifecycle
# authority to a cell (I2.20:22). This file records the cell contract the
# crate did not previously carry; every value below is an existing
# declaration of this crate, not a new policy claim. A field the
# documentation does not determine for this cell stays undeclared and is
# named with its reason in `[i2_10].undetermined` instead of being defaulted
# (I2.10:3, I2.20:63).
schema_version = 4
module_id = "test-support"
crate = "eliot-test-support"
# Carried verbatim from `[package.metadata.eliot]` in
# `crates/foundation/eliot-test-support/Cargo.toml`. Read from that
# declaration, never from the crate name (I2.10:3).
source_layer = "C0"
lifecycle_owner = "C0-10"
# Quoted verbatim from `[package].description` in the crate's own manifest.
primary_responsibility = "ELIOT bounded test-only clocks, fixtures, failpoints and fake resources"
# Quoted from the crate's own `src/lib.rs` module contract: deterministic,
# in-memory, caller-constructed fixtures that touch no product state.
causal_property = "A test reproduces a contract or adapter behavior exactly, from deterministic fixtures that no production crate may depend on"
# Quoted from `src/lib.rs`: the crate "deliberately contains no process,
# store, network, provider, or authority implementation"; the fake process
# never launches a process and the fake store performs no disk or database
# IO. `TempRoot` is the one explicitly test-facing filesystem guard, it
# creates a single bounded child under the host temp directory, and it never
# accepts path separators or parent components from callers.
non_goals = ["production runtime execution", "process, store, network or provider implementation", "product authority", "any state a product runtime would own"]
# Quoted from `src/lib.rs` and from the crate's own package metadata
# (`test_only = true`, `authority = false`, `TEST_SUPPORT_ONLY`,
# `HAS_AUTHORITY = false`): no production crate may depend on this cell, no
# global or process state is touched, and the cell never carries product
# authority.
invariants = ["no production crate may depend on this cell", "no product authority is ever carried", "no global or process state is touched"]
# Quoted from the crate's own proof entrypoint.
proof_surface = ["deterministic clock and identifier generation", "fixture roundtrip", "typed failpoint, fake process and fake store rejection", "bounded temporary root"]
proof_ceiling = "Module proof of the fixtures themselves; the contract or adapter behavior a test exercises keeps its own proof ceiling, as the crate itself records"
# Quoted from the crate's own declared boundary: package ownership creates
# no product authority, and the crate exports HAS_AUTHORITY = false.
replacement_boundary = "package ownership creates no product, authority or runtime ownership; replacing this cell replaces a test fixture library and never a production generation"
merge_rejoin_condition = "merge back when no independent consumer, proof, dependency or replacement seam remains"
split_trigger = "a second causal responsibility, mutable owner, independent proof surface or independent rollback boundary appears"

# I2.10 classification of this functional capability cell. Every value below
# is an explicit declaration of THIS cell, recorded per I2.10:124 ("The
# decision and rejected alternatives are recorded in the Module Catalog").
# No value is derived from a crate, bundle, source-layer or runtime-layer
# name (I2.10:3), and an undetermined field is recorded as undetermined with
# its reason instead of being defaulted (I2.10:3, I2.20:63).
[i2_10]
# Functional capability cell: test-support
cell = "test-support"
# I2.10:12 admits the `development_only` contour for "generators, fuzzers,
# benchmarks, migration/test utilities" whose use is "never required by
# production runtime", and I2.10:41 admits the `development_tool` runtime
# class whose default replacement is "never required at runtime". This cell
# declares that non-requirement from its own evidence, never from its name
# (I2.10:3):
#   * `[package.metadata.eliot]` in this crate's own manifest records
#     `test_only = true` and `authority = false`;
#   * the crate's own module contract states "Production crates must not
#     depend on it" and exports `TEST_SUPPORT_ONLY` and `HAS_AUTHORITY =
#     false` as compile-time boundary markers;
#   * `Cargo.lock` records no package that depends on `eliot-test-support`,
#     and the only references to the crate in the tree are the root
#     `Cargo.toml` workspace member list and its own `Cargo.toml`;
#   * `python scripts/code_navigation.py capsules` reports this cell
#     `UNREACHABLE`, so no bin in the workspace reaches it and it is on no
#     production execution path;
#   * the cell declares no runtime layer and no runtime bundle above.
# A production-required cell carrying either development classification is
# refused by manifest generation with
# CellManifestError::DevelopmentClassifiedProductionRequired; a
# non-production-required cell carrying neither is refused with
# CellManifestError::DevelopmentClassificationMissing.
production_required = false
# I2.10:12 names `development_only` and gives its use verbatim: generators,
# fuzzers, benchmarks, migration/test utilities, never required by the
# production runtime. A bounded test-fixture utility that no production
# crate may depend on is that contour. It is not read off the crate name
# (I2.10:3).
execution_contour = "DEVELOPMENT_ONLY"
# I2.10:41 names `development_tool` with the single defining property "never
# required at runtime". This cell is a development utility rather than a
# runtime service, process or host, and its own package metadata declares
# `test_only = true` with `authority = false`, so the class that records
# non-production-requirement is the only one of the I2.10:29-41 runtime
# classes that can express it. The class is not read off the crate, bundle,
# source-layer or runtime-layer name (I2.10:3).
runtime_class = "DEVELOPMENT_TOOL"
# I2.10:62-63 states that canonical storage, semantic admission and
# mechanical fencing remain one path with separated responsibilities, and
# that no hot-replaceable module declares canonical_semantic. This cell
# declares no canonical write, persistence or authority role above or in
# its own module contract, so it claims none. A hot-replaceable cell that
# claimed it would be refused with
# CellManifestError::HotReplaceableCanonicalSemantic.
canonical_semantic = "NOT_CLAIMED"
least_privilege_reason = "I2.10:108 selects the least privileged contour that can express the capability, and I2.10:12 is the contour that exists for exactly this capability: test utilities that are never required by the production runtime. This cell declares that non-requirement in its own evidence (its own `test_only = true` and `authority = false` package metadata, its own 'Production crates must not depend on it' contract, an empty consumer set, an UNREACHABLE module graph, no runtime layer and no runtime bundle), so no production capability surface exists for it to hold. I2.10:41 is the matching runtime class because its defining property is exactly 'never required at runtime'; the classes that require a delegated execution surface (I2.10:31 daemon_service, I2.10:33 process_bridge, I2.10:34 component_host, I2.10:35 test_execution_plane) each name a runtime service this cell is not. Neither value is inferred from the crate, bundle, source-layer or runtime-layer name (I2.10:3)."
promotion_path = "No promotion is owed and none is available: I2.10:12 bounds this contour by 'never required by the production runtime', so moving the cell onto a production contour would contradict the cell's own declared boundary that production crates must not depend on it. I2.10:124 makes a later change of contour a governed promotion or migration, never an invisible build optimization, so a future production-grade fixture library would be a new cell with its own manifest and its own selection record rather than a reclassification of this one."

# Contours and runtime classes considered and rejected, with the reason each
# does not express this capability (I2.10:124). The chosen classification is
# never among them.
rejected_alternatives = [
  { contour = "wasm_component", reason = "I2.10:9 admits wasm_component for pure or nearly pure experimental logic with a narrow capability surface, isolated as a Wasmtime Store/instance. This cell exists to be linked into the test binaries of other crates, and its TempRoot guard performs a real host filesystem operation, so hosting it would have to widen a component's capability surface to serve a fixture library. It is also never admitted by a production component host: it declares no runtime bundle, no runtime layer and an empty consumer set." },
  { contour = "native_process", reason = "I2.10:10 admits a native process for OS, Cargo, Git, LSP, browser, native-library, credential or long-CPU work behind a separate process or Job Object. This cell's own module contract states it contains no process, store, network or provider implementation, and its FakeProcess 'never launches a process'. A separate process would add IPC latency and a second lifecycle owner for a fixture library." },
  { contour = "static_native", reason = "I2.10:11 admits a static native release candidate for a trusted Kernel or control path or a measured stable hot path, and I2.10:21 states that static native is not a default reward for maturity. This cell is neither a control path nor a hot path, carries no product authority by its own declaration, and no measurement is recorded for it. A development-only cell is never required by the production runtime (I2.10:12), so it can never be a trusted control path." },
  { class = "test_execution_plane", reason = "I2.10:35 names test_execution_plane for a build, test or simulation service whose default replacement is an independent testd generation. The production build and test execution plane in this repository is the `eliot-testd` binary, which the Kernel admits and launches as a real runtime process (bins/eliot-kernel/src/dispatch_launch.rs). This cell is an in-process fixture library, not that service; declaring the service class for it would name a runtime process the cell does not provide and would demand a runtime bundle it correctly does not have." },
  { class = "process_bridge", reason = "I2.10:33 names process_bridge for an MCP, LSP, provider or tool bridge replaced through an independent process generation. This cell starts no process and speaks no provider, LSP or MCP protocol; its own module contract states there is no provider implementation." },
  { class = "derived_index", reason = "I2.10:36 names derived_index for a code graph, cue or search index that is rebuilt, shadowed and switched. This cell publishes no index: it has an empty consumer set and an UNREACHABLE module graph, so no runtime ever queries a projection it produces." },
]

# Fields the documentation does not determine for this cell. They stay
# undeclared on purpose: manifest generation refuses an absent
# classification with CellManifestError::MissingField instead of accepting a
# synthesized value (I2.10:3, I2.20:63).
undetermined = [
  { field = "state_class", reason = "I2.10:46-47 admits `stateless` only when no state survives request or process, and this cell's TempRoot guard deliberately creates one child directory under the host temp directory that a crashed test process can leave behind, so `stateless` would over-claim here. host_state_externalized (I2.10:49-50) requires state that remains in ELIOT-owned snapshot or delta form with a replaceable generation, rebuildable (I2.10:52-53) requires derived state that recreates from canonical or external sources, checkpointed_operational (I2.10:55-56) requires non-semantic state resuming from a versioned checkpoint or reconciliation, and external_canonical_adapter (I2.10:58-59) requires an adapter owning no ELIOT semantics behind a declared surface. None of those five describes a bounded test fixture, and I2.10:3 forbids inferring a classification from a crate, bundle, source-layer or runtime-layer name or defaulting an undetermined field, so this field is left undetermined rather than guessed." },
  { field = "replacement_class", reason = "I2.10:69-84 names the cutover of a sandboxed component generation, a native process generation, a daemon generation, the external Host/SCM cutover, or an offline release with an explicit owner, reason and recovery. This cell hosts nothing and is replaced only as a source library, so the documentation records no cutover to name, and the class must not be read off the hosting bundle or crate name (I2.10:3)." },
  { field = "iteration_lane", reason = "I2.20:53-63 requires a ProofLatencyProfile carrying the exact machine, toolchain, cache and build fingerprint with measured p50/p95/p99/max before a lane is claimed. No such profile is recorded for this cell, and I2.20:63 states that missing proof-latency evidence disables automatic assignment to the interactive lane without naming a substitute lane, so every lane value here would be invented." },
  { field = "runtime_layer", reason = "I2.10:12 bounds this contour to capabilities never required by the production runtime, so the crate declares no runtime layer. Inventing one would assert a production runtime position the cell explicitly does not have (I2.10:3)." },
  { field = "runtime_bundle", reason = "The cell is linked into the test binary of its caller and is admitted by no production bundle, so there is no bundle to name. I2.10:3 forbids defaulting it from a layer or bundle name." },
]
