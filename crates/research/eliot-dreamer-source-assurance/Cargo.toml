[package]
name = "eliot-dreamer-source-assurance"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Role-separated source assurance over frozen Research evidence sets for Dreamer and Governor consumers"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "=1.8.5"
schemars = { version = "=1.2.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"

[dev-dependencies]
serde_json = "=1.0.150"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
