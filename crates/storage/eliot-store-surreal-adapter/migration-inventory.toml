# The current adapter owns the canonical control plane only (the 23
# current_table entries below). Legacy domain tables have no current-adapter
# counterpart: inventing one would invent authority. Their disposition is
# therefore retire-with-#1189 with an explicit blocking condition (I00-08
# UNKNOWN blocks deletion until #1189 closes P1-P5); no table is silently
# omitted. Legacy files declare tables and indexes only (all SCHEMALESS, no
# DEFINE FIELD); field dispositions follow their table. Indexes follow their
# table disposition; index counts per source file: 000_schema(src) 22,
# 000_schema(migrations) 5, 001 9, 002 2, 003 1, 004 4, 005 3, 006 3, 007 5,
# 008 4, 009 5, 010 0.

