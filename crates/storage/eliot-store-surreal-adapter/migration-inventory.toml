# Machine-readable Store schema/migration inventory (issue #1221, wave A).
#
# Every .surql file and embedded DDL body in the repository has exactly one
# owner, one consumer-or-disposition, one schema generation and one digest.
# The single executable graph is `MIGRATION_GRAPH` in
# crates/storage/eliot-store-surreal-adapter/src/schema.rs, admitted only by
# `is_admitted_migration` in
# crates/storage/eliot-store-surreal-adapter/src/apply.rs. All other roots are
# non-executable by the current graph: the root orphan is a retired fixture,
# legacy bodies belong to `crates/eliot-store` (retirement owner #1189) and
# dead-code DDL consts belong to their owning slices until admitted.
#
# Verification: `sha256` values are full-file/const SHA-256 hex digests
# recomputed from source at inventory time (base origin/main 1d6b2ce9).
# Embedded pins are additionally enforced at runtime by `validate_graph_pins`.

schema = "eliot.storage.migration-inventory.v1"
issue = 1221
owner_crate = "crates/storage/eliot-store-surreal-adapter"
graph_authority = "crates/storage/eliot-store-surreal-adapter/src/schema.rs:MIGRATION_GRAPH"
admission_authority = "crates/storage/eliot-store-surreal-adapter/src/apply.rs:is_admitted_migration"
receipt_authority = "crates/storage/eliot-store-surreal-adapter/src/readiness.rs:MigrationReceipt"
bridge_range = "eliot.storage.store-surreal-adapter"

