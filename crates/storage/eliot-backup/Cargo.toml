[package]
name = "eliot-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Governed ECXF logical backup and isolated restore contracts"

[package.metadata.eliot]
workspace_admission = "admitted bounded non-runtime product surface per #1873 (operator CLI previews/coverage plus isolated rehearsal runner; governed export path: #1871); production execution/cutover stays with #960/#961 owners; not a selectable storage fallback. #1141 disposition: LIVE GOVERNED PORTABILITY/RECOVERY CONSUMER - the 'non-runtime' wording above predates the #960/#961 edges and is superseded by three shipped production binary dependency edges (bins/eliot, bins/eliot-host, bins/eliot-kernel); proof ceiling: eliot_backup::export_ecxf_package, the only ECXF/1 export entry, is now reached in production by the store bridge's one-shot export command (bins/eliot-store-surreal, #1871) through a real EcxfSourceStore implementor over the adapter's single-transaction capture; no production process produces an ECXF/1 package yet, because that implementor observes no complete source view and therefore fails closed rather than emitting one"

