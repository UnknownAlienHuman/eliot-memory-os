[package]
name = "eliot-ecxf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical ECXF/1 interchange source for ELIOT storage"

[package.metadata.eliot]
workspace_admission = "#1716 disposition: KEEP with reachable owner eliot-backup, the only workspace package that selects this crate. Single governed ECXF/1 builder per #1871 (eliot_backup::export_ecxf_package, which calls EcxfArchive::build/layout and is the only writer of the format); its EcxfSourceStore port is implemented by the store owner in bins/eliot-store-surreal (StoreOwnerEcxfSource, the one-shot export command), so the crate reaches production only through eliot-backup's regular edge and no production binary declares it directly; not a selectable storage fallback. #1141 disposition: BOUNDED REFERENCE/IMPLEMENTATION-SUPPORT PACKAGE with an explicit non-production ceiling - no production process emits an ECXF/1 package yet, because that implementor observes no complete source view and fails closed rather than emitting one"

