  "task scheduling or Finish",
  "canonical Store credentials or writes",
  "ambient filesystem/network/process/secrets",
  "generic host-call escape or in-process Rust plugin loading",
]

[what_to_do]
steps = [
  "Replace the unconditional admission-required exit with an authenticated generation-bound request loop.",
  "Construct complete RuntimePorts only from Kernel/Governor-admitted providers and exact immutable manifests.",
  "Instantiate WasmtimeComponentEngine and WasmHostRunner for the selected compiled profile.",
  "Execute, cancel, reconcile, drain and shut down exact invocation identities without local authority or promotion.",
  "Prove capability denial, resource isolation, trap containment, cache identity and generation cutover.",
]

[how_to_do]
steps = [
  "Obtain artifact hash, WIT world, facet introductions, capability envelope, State Fence, Authority Epoch, limits, deadline and cancellation identity from authenticated Kernel admission; accept none from ambient caller text.",
  "Validate the complete RuntimePorts set before readiness and keep missing providers as typed PLAN_GAP.",
  "Build the provider against the exact immutable component bytes and interface digest; reject stale/mismatched generation before instance creation.",
  "Expose only introduced host resources and methods; configure no broad WASI world, inherited stdio/env/network/filesystem/process or secrets.",
  "Bind compiled-component caches and instance pools to artifact/interface/provider generation and make them disposable/rebuildable.",
  "Map trap, fuel/memory/deadline exhaustion, cancellation and cleanup to typed results and quarantine only the affected instance/generation.",
  "Require a separate exact effect permit for canary effects; shadow execution remains effect-free.",
]

[acceptance]
criteria = [
  "A valid authenticated invocation reaches WasmHostRunner and the Wasmtime engine exactly once.",
  "Missing/stale/mismatched artifact, interface, facet, generation, epoch or fence performs no component call.",
  "Unintroduced methods/resources are absent and produce typed capability errors.",
  "The built component host exposes no ambient filesystem, network, process, environment, clock, random, credential or canonical Store capability unless an exact declared facet requires and introduces it.",
  "Fuel, memory, deadline, cancellation and trap limits leave no leaked instance or resource handle.",
  "Shadow execution creates no canonical/external effect; canary effect requires a separate permit.",
  "Exact replay/reconcile uses one invocation identity; changed same-identity request conflicts.",
  "Old generation cannot reconnect or publish after cutover; caches do not revive proof or authority.",
  "Core/native/WASM compatibility claims use the same semantic conformance corpus and report divergence explicitly.",
  "The binary no longer exits unconditionally when supplied a valid current admission.",
]

[verification]
commands = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-wasm-runtime -p eliot-wasm-host --all-targets",
  "cargo test --locked -p eliot-wasm-runtime -p eliot-wasm-host --all-targets",
  "cargo clippy --locked -p eliot-wasm-runtime -p eliot-wasm-host --all-targets -- -D warnings",
  "python scripts/verify-wasm-toolchain.py",
  "git diff --check",
]
edge_proof = "Run an actual admitted component through execute/cancel/reconcile/trap/resource-exhaustion and generation-cutover cases, and inspect the built import set."

[boundaries]
non_goals = [
  "new semantic component algorithms",
  "dynamic Rust library loading",
  "automatic workflow trigger",
  "Product or release promotion from package tests",
]
