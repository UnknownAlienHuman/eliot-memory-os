[confirmed_gap]
observations = [
  "bins/eliot-kernel contains real authenticated transport, Host binding, authority/fence, ORS, generation, daemon/store bootstrap and process-management code.",
  "The production composition remains broad and co-locates front door, authority projection, ORS, Control Reserve, generation routing, store/daemon/process adapters and large in-package test/harness surfaces.",
  "Several live child gaps remain open: typed StoreFailure consumption #451, activation-result receiver #1115, P-07 authority lifecycle #1110, Agent Bridge port #77 and Doctor/research/native process edges.",
  "No #13 registry yet proves exact state/lifecycle owners, public contract digests and independent proof entrypoints for every Kernel cell.",
  "Issue #11 has no current exact Windows proof that eliotd loss, generation cutover, stale reconnect, unknown commit and Control Reserve saturation preserve one authority owner and recovery path.",
]
discriminator = "Kill or replace eliotd during an admitted transition, then replay an old generation and inject Store unknown outcome plus normal-lane saturation. Current source has partial mechanisms but no accepted complete Edge/Product proof demonstrating one surviving Kernel authority/recovery contour."

[causal_property]
statement = "Kernel is the minimal failure-surviving mechanical owner of authenticated front door, authority epoch/fence, ORS, Control Reserve, generation routing, canonical-transition validation and Recovery View; it never owns task semantics, broad retrieval, provider policy or canonical meaning."

[scope]
primary_paths = [
  "bins/eliot-kernel/src/main.rs",
  "bins/eliot-kernel/src/lib.rs",
  "bins/eliot-kernel/src/front_door*/**",
  "bins/eliot-kernel/src/daemon_*/**",
  "bins/eliot-kernel/src/store_*/**",
  "crates/kernel/eliot-kernel-core/src/**",
  "crates/kernel/eliot-kernel-service/src/**",
  "crates/kernel/eliot-ors/src/**",
  "crates/kernel/eliot-generation/src/**",
  "crates/kernel/eliot-control-reserve/src/**",
  "focused Kernel boundary/recovery tests",
]
read_only_dependencies = [
  "bins/eliot-host public lifecycle contract",
  "bins/eliotd public semantic/transition contracts",
  "crates/storage/eliot-store-api public named-operation and receipt contracts",
  "crates/foundation/eliot-protocol and runtime contracts",
]
forbidden_ownership = [
  "task, WorkScope, Context, plan or Finish semantics",
  "provider/model/MCP policy or broad retrieval",
  "SurrealDB SDK/raw query or canonical semantic store client",
  "testd/instrument execution or generic shell",
  "second Host, Governor or Store state owner",
]

[what_to_do]
steps = [
  "Make bins/eliot-kernel a thin process/composition root over explicit Kernel capability cells.",
  "Freeze one state owner for authenticated front door/session binding, Authority Epoch/fencing, ORS, Control Reserve, Generation Registry/cutover, transition mechanical validation, Recovery View and process-generation lifecycle adapter.",
  "Move test-only R13/OS/process harnesses to Instrument/conformance boundaries where an independent seam exists.",
  "Complete the open typed producer/consumer edges without absorbing their semantic owners.",
  "Prove eliotd loss, stale generation, unknown commit, saturation and generation replacement independently from Product self-report.",
  "Bind every Kernel cell and proof surface through #13.",
]

[how_to_do]
steps = [
  "Inventory every Kernel mutable state and entrypoint; assign one owner and explicit persistence/recovery boundary before extraction.",
  "Keep one canonical transition path: eliotd supplies one immutable PreparedTransition, Kernel rechecks identity/epoch/fence/order/class/effect ceiling, Store executes one named operation and returns one receipt.",
  "Persist accepted operations/checkpoints/generation and uncertain outcomes in ORS before acknowledging state transitions.",
  "On eliotd generation loss, revoke daemon-issued leases and fence the old generation immediately while retaining cancellation, ORS and Recovery View.",
  "Require old generation/session/process reconnects to prove exact current generation, epoch, artifact, connection and State Fence; reject stale publication/effects.",
  "Reserve independent bounded Control Reserve capacity for cancellation, fencing, health and recovery; normal-lane saturation cannot consume it.",
  "Keep Recovery View bounded and usable without eliotd, models, graph, broad canonical reads or provider adapters.",
  "Treat unknown commit/effect as exact-operation reconciliation state and never blind retry or convert it to unavailable/success.",
  "Move generic process/test execution out of Kernel production closure and retain only admitted generation lifecycle mechanics.",
  "Add negative dependency/source guards against semantic, model, MCP, Store SDK/raw-query and Instrument ownership leakage.",
]

[acceptance]
criteria = [
  "The binary composition root owns no hidden semantic mutable state and every Kernel cell has one state/lifecycle owner.",
  "Hard dependency closure from Kernel outward is acyclic, bounded and excludes task/Context/provider/Store-SDK/Instrument semantics.",
  "eliotd loss immediately revokes/fences old daemon authority while Kernel retains ORS, cancellation, health and Recovery View.",
  "Old epoch/generation/session cannot reconnect, publish effects, checkpoint or become current after cutover.",
  "Every accepted pending operation is enumerable and reconcilable before writer readiness.",
  "PreparedTransition/admission digest, class and effect ceiling remain exact across daemon, Kernel and Store; mismatch fails closed.",
  "Unknown commit/effect remains exact-operation recovery state and cannot trigger blind retry.",
  "Control Reserve remains usable under normal-lane saturation and its own loss is explicit/quarantining.",
  "Generation replacement closes old process/Job Object lineage before activating the replacement and leaves no orphan.",
  "Recovery View remains available without eliotd/model/graph/UI broad dependencies.",
  "#13 resolves each cell to contract/proof/Product Pulse and #11 executes daemon-loss, stale reconnect, saturation, unknown-outcome and cutover scenarios.",
]

