  "cargo clippy --locked -p eliot-kernel -p eliot-kernel-core -p eliot-kernel-service -p eliot-ors -p eliot-generation -p eliot-control-reserve --all-targets -- -D warnings",
  "python scripts/audit-runtime-source-hygiene.py",
  "python scripts/audit-architecture-boundaries.py",
  "git diff --check",
]
