[documentation]
architecture = [
  "docs/architecture/A02-02-roles.md#a22-roles",
  "docs/architecture/A13-02-kernel-and-failure-domains.md#a132-kernel-and-failure-domains",
  "docs/architecture/A13-08-integrity.md#a138-integrity",
