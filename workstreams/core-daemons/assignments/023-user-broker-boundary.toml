[work_unit]
cell_id = "runtime.user-broker-complete-boundary"
causal_property = "One user-logon Session owns exactly one current User Broker generation that mediates user-token, credential and interactive-resource introduction through Kernel-issued grants and exact child operations; broker loss, logout, permit revocation or generation replacement fences every owned resource/process without exposing secrets or granting task, semantic, provider-policy, canonical or Finish authority."
current_discriminator = "eliot-user-broker contains a real protected-root process, Kernel registration, heartbeat and Launch/Cancel/Reconcile loop, and the root CLI exposes broker-mediated UI startup. The parent boundary is not closed while per-operation identities #74, live SID/session/resource proof #1098, Operator attach #1105 and downstream notification/native-worker consumers remain separate and no one current integration proves exact startup, credential introduction, revocation, restart and no-orphan behavior."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/23"

[documentation]
architecture = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A12-02-principal-session-and-visibility.md#a122-principal-session-and-visibility",
