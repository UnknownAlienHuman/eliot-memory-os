steps = [
  "Declare and bind every current eliotd/Governor capability cell and mutable-state owner through #13.",
  "Close one canonical PreparedTransition contract and exact daemon-to-Kernel-to-Store receipt identity across all consumers.",
  "Keep task/WorkScope/plan/current-position/Finish meaning exclusively in Governor canonical state and process/generation truth exclusively in Kernel/ORS.",
  "Prove daemon caches/hot mirrors revision-keyed, rebuildable and non-authoritative.",
  "Bind strict Finish to the current TaskContract, exact artifacts, executed applicable verifier evidence, State Fence and reconciled effects.",
  "Inventory every real consumer of crates/eliot-app and eliot-governor and assign migrate, bounded fixture with expiry/removal condition, or delete.",
  "Remove current packaging/install/runtime/docs dependence on the legacy Governor facade and retire it when its final consumer is gone.",
]

[how_to_do]
steps = [
  "Use one immutable PreparedTransition canonical encoding containing semantic source revisions, admission digest, complete Ordering Scopes/State Fence, Authority Epoch/effect ceiling, named-operation manifest digest, deterministic MutationPlan digest, transition class and proof/approval handles.",
  "Have Kernel recheck only principal, authority snapshot, epoch, fence, identity, ordering, class/effect ceiling and generation compatibility; it must not reinterpret semantic policy.",
  "Have Store execute only the closed named operation and exact parameter/transition digest; reject raw query, command widening and mismatch.",
  "Carry the same admission/transition/mutation/class/effect identity into the final immutable WriteReceipt and exact unknown-outcome reconciliation.",
  "Persist semantic owner revisions and rebuild daemon caches solely from owner state; cache presence or freshness timestamp cannot create authority.",
  "Make VERIFIED_COMPLETE impossible without exact current applicable verifier execution, artifact/target binding, scope/fence/freshness/independence and reconciled external effects.",
  "Generate a current-consumer ledger for eliot-app from actual dependency/call/runtime/package references rather than command names or source presence.",
  "For each legacy path, migrate to the declared current owner, retain only as an exact bounded regression fixture with consumer/proof/expiry/removal condition, or delete.",
  "Prohibit new public commands/state/effects in the facade and keep it out of current default/install/runtime roots throughout migration.",
]

[acceptance]
criteria = [
  "Every canonical mutation follows eliotd semantic admission -> Kernel mechanical validation/order/fence -> exact named Store transaction -> immutable receipt.",
  "Admission digest, semantic revisions, MutationPlan digest, transition class and effect ceiling remain identical across daemon, Kernel, Store and receipt.",
  "Mismatch returns a typed conflict/contract error and cannot retry as the same semantic decision.",
  "ORS remains opaque operational state and never answers task/plan/WorkScope/Finish semantic queries.",
  "Daemon loss leaves Kernel able to fence/cancel/reconcile but unable to mint new semantic authority.",
  "Daemon caches are revision-keyed, rebuildable and incapable of creating freshness/support/authority.",
  "Only exact current executed verifier evidence and reconciled effects can produce VERIFIED_COMPLETE.",
  "Every eliot-app/eliot-governor consumer has one explicit migrate/fixture/delete disposition and no undocumented unique production owner remains.",
  "Current release/install/runtime routes do not launch or advertise legacy eliot-governor as the production Governor.",
  "No new feature/state/effect is added to preserve the facade.",
  "#13 resolves all Governor cells and #11 proves daemon restart, transition/receipt identity, unknown outcome and strict Finish in the Product Pulse.",
]

