  "No #13 registry yet binds all Governor cells, mutable-state owners, contracts and proof entrypoints to current runtime generations.",
]
discriminator = "Trace one semantic task mutation and strict Finish decision through current daemon, Kernel and Store, then inventory every production consumer of eliot-app/eliot-governor. No complete accepted evidence proves one semantic owner, exact end-to-end transition identity and zero unique legacy production ownership."

[causal_property]
statement = "eliotd is the sole semantic Governor: it owns admission, WorkScopes, tasks, plans, Context, coordination, application state, module intent and strict Finish; Kernel performs mechanical validation/fencing/order and Store executes only the exact admitted named transition. No legacy facade or adapter becomes a second semantic/state/effect owner."

