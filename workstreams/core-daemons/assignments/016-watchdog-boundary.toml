base_sha = "8ebf8b41847391c340393d56aeb14dd4f2b5e37b"
normative_pair_ref = "docs/normative-pair.toml"

[work_unit]
cell_id = "supervision.watchdog-independent-boundary"
causal_property = "Watchdog remains an independently started and independently observed supervision process that can detect and contain exact Host/Kernel process-generation failures, preserve bounded local evidence and coverage gaps, and request only predeclared mechanical recovery without depending on the monitored semantic or Store path and without acquiring diagnosis, policy, canonical or Finish ownership."
current_discriminator = "eliot-watchdog has real SCM/console startup, protected registration/spool state, observation/supervision modules and a WatchdogComposition. The repository still lacks one accepted Windows Edge proving independent SCM startup, exact target-process ownership, supervision lease continuity, control-path availability during Host/Kernel/eliotd/Store faults, spool export/replay and bounded no-orphan containment under current installed identities."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/16"

[documentation]
architecture = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A13-02-kernel-and-failure-domains.md#a132-kernel-and-failure-domains",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A13-03-module-supervision-and-doctor.md#a133-module-supervision-and-doctor",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A13-05-bounded-resources-and-control-reserve.md#a135-bounded-resources-and-control-reserve",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A13-08-restart-and-recovery.md#a138-restart-and-recovery",
]
implementation = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I01-02-mandatory-runtime-processes.md#i12-mandatory-runtime-processes",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I01-04-scm-supervision-tree.md#i14-scm-supervision-tree",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I01-05-demand-start-observable-use-supervision-and-idle-shutdown.md#i15-demand-start-observable-use-supervision-and-idle-shutdown",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I08-02-independent-observation-routes.md#i82-independent-observation-routes",
