schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_IMPLEMENTATION_ALLOCATION"
routing_authority = "owning_issue_and_normative_pair_only"
status = "READY_FOR_IMPLEMENTATION_AND_WINDOWS_EDGE_PROOF"
implementation_support = "SUBSTANTIAL_LOCAL_SUPERVISION_PRESENT_COMPLETE_INDEPENDENCE_AND_RECOVERY_PROOF_MISSING"
evidence_execution_status = "CURRENT_BINARY_COMPOSITION_SPOOL_REGISTRATION_AND_ISSUE_PATHS_INSPECTED_TESTS_NOT_EXECUTED"
proof_ceiling = "WATCHDOG_INDEPENDENT_SUPERVISION_EDGE_CANDIDATE_ONLY"
issue = 16
spool_export_issue = 458
supervision_lease_issue = 88
host_issue = 14
kernel_issue = 15
doctor_issue = 461
parent_product_issue = 11
