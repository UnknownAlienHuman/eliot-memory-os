[current_source]
confirmed = [
  "AgentActivationResolutionResult v2 defines seven closed semantic dispositions and exact validation/digest semantics.",
  "GovernorComposition has a typed activation-resolution owner and eliotd has a pure exhaustive mapper, but production daemon submission remains owned by #839.",
  "Kernel ticket result persistence, exact replay and unknown-submission reconciliation remain owned by #1095.",
  "Kernel bridge admission/request state remains #342 and the executable KernelHostRequestPort remains #77.",
  "The current parent Issue has no open integration PR covering the complete bridge-to-Governor-to-bridge cycle.",
  "A claim lease, transport timeout or bridge reconnect is not a changed semantic discriminator and cannot justify another Governor read by itself.",
]

[scope]
primary_paths = [
  "cross-package activation integration tests and finite fixtures",
  "minimal exact glue required after #839/#1095/#342/#77 land",
  "one versioned activation trace/receipt projection if the existing public contracts cannot expose the complete stage lineage",
  "directly relevant Product Pulse scenario registration under #11",
]
read_only_owners = [
  "bins/eliot-agent-bridge activation request/result adapter from #77",
  "Kernel P-04/ticket/replay state from #342/#1095",
  "eliotd typed producer from #839",
  "Governor activation resolver from #18",
]
forbidden = [
  "duplicating producer, receiver, resolver, ticket, Session or P-04 owners",
  "trial-decoding current v2 as legacy v1",
  "using human detail, logs, process exit, timeout or claim expiry to choose a semantic disposition",
  "creating a Session for a non-Resolved result",
  "repeating the Governor read after possible result submission without exact reconciliation",
  "retrying NotReady without its due time and a changed named dependency revision",
  "turning TaskSelectionRequired, ScopeSelectionRequired or ScopeAmbiguous into generic failure/timeout",
  "automatic task selection, scope widening, authority issue, canonical write or Finish",
  "automatic workflow triggers",
]

[[waves]]
id = "A"
what = "Freeze one complete activation trace and stage denominator."
how = [
  "Bind host correlation, bridge process/connection, principal, activation request, Kernel ticket/claim, daemon generation, Governor read snapshot, semantic result, Kernel acceptance/replay, Session creation when applicable and bridge delivery/acknowledgement identities.",
  "Declare every stage as not-attempted, accepted, started, submitted, possibly-submitted, accepted-result, delivered, acknowledged, expired, cancelled, conflicted, unknown/reconciling or terminal.",
  "Require one current StateFence, task/WorkScope source revision and deadline/cancellation lineage across all applicable stages.",
  "Do not collapse result delivery, Session activation and host acknowledgement.",
]

[[waves]]
id = "B"
what = "Compose the exact once-only semantic resolution path."
how = [
  "Accept one bounded bridge activation request through #77/#342 and issue at most one Kernel ticket identity.",
  "Let one current daemon generation claim the ticket and invoke the Governor typed resolver once for a newly admitted ticket.",
  "Map and submit exactly one of Resolved, TaskSelectionRequired, ScopeSelectionRequired, ScopeAmbiguous, NotReady, StaleFence or FailedInternal through #839/#1095.",
  "Create a Session only for an exact current Resolved binding after Kernel validation; every other disposition is immediately returned without Session authority.",
]

[[waves]]
id = "C"
what = "Close selection follow-up, retry/no-progress and transport uncertainty."
how = [
  "A user task/scope selection is a new explicitly related activation request with the chosen exact identity and revised request digest, not mutation of the prior result.",
  "NotReady may be reconsidered only after not_before and a changed named dependency revision; lease expiry, reconnect and elapsed wall time alone are insufficient.",
  "After possible daemon-to-Kernel submission or Kernel-to-bridge delivery, reconcile the same result/request identity before semantic recomputation or resend.",
  "Changed same-identity request, ticket, result, selected task/scope, fence or owner revision is IDENTITY_CONFLICT.",
  "Bound retry/reconciliation counts and surface no-progress rather than looping indefinitely.",
]

[[waves]]
id = "D"
what = "Prove independent restart, cancellation and all seven dispositions end to end."
how = [
  "Execute every disposition through the real bounded bridge, authenticated P-04, daemon producer, Kernel receiver and host result mapping.",
  "Restart or disconnect bridge, Kernel and daemon independently before claim, after Governor read, after possible result submission and after Kernel acceptance but before host acknowledgement.",
  "Race cancellation/deadline with claim, semantic result and Session creation and prove one stable terminal/reconciling disposition.",
  "Verify no duplicate Governor read, no duplicate Session, no lost semantic result and no stale-generation revival through independent state/readback evidence.",
]

[acceptance]
criteria = [
  "One activation request creates at most one Kernel ticket and one semantic result identity.",
  "Every stage retains exact bridge/connection/principal/request/ticket/claim/daemon/Governor/result/Session/delivery identities and one explicit disposition.",
  "A newly admitted ticket causes exactly one Governor typed read; exact replay or reconciliation causes zero additional reads.",
  "All seven result dispositions traverse the complete production path losslessly and are immediately host-visible.",
  "Only Resolved may create a Session, and only after exact current principal/task/WorkScope/revision/fence validation.",
  "Selection-required and ambiguity results create no Session and are not rendered as generic failure or timeout.",
  "User selection creates a new related request identity; the prior result remains immutable.",
  "NotReady cannot retry solely from claim expiry, reconnect or time passage; due time plus changed named dependency revision is required.",
  "StaleFence cannot create Session/authority and cannot be retried as the same request under a new fence.",
  "FailedInternal remains a terminal or explicitly owner-authorized retry disposition and cannot become ambiguity/transient unavailability by string parsing.",
  "Possible result submission/delivery is reconciled before another Governor read or resend.",
  "Changed request/result/selection/fence/owner revision under one identity conflicts.",
  "Bridge, Kernel and daemon restart at every stage preserves one result and creates no duplicate Session, lost ticket or stale-generation authority.",
  "Cancellation/deadline races produce one stable terminal or exact reconciling state and cannot erase an accepted result or Session.",
  "Retry/reconciliation is finite and repeated unchanged failure surfaces no-progress.",
  "No integration glue becomes a second resolver, ticket owner, Session allocator, authority issuer, canonical writer or Finish owner.",
  "A real Operator/host onboarding trace is included in #11 before #66 closes.",
]

[verification]
commands = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-protocol -p eliot-agent-bridge -p eliot-kernel-service -p eliot-kernel -p eliotd -p eliot-governor --all-targets",
  "cargo test --locked -p eliot-protocol -p eliot-agent-bridge -p eliot-kernel-service -p eliot-kernel -p eliotd -p eliot-governor --all-targets",
  "cargo clippy --locked -p eliot-protocol -p eliot-agent-bridge -p eliot-kernel-service -p eliot-kernel -p eliotd -p eliot-governor --all-targets -- -D warnings",
  "python scripts/verify-agent-bridge-protocol.py",
  "git diff --check",
]
edge_proof = "Execute all seven outcomes plus selection follow-up, NotReady dependency change, cancellation/deadline races and bridge/Kernel/daemon loss at every submission/delivery boundary; prove exactly one semantic read and at most one Session."
product_proof = "This closes the activation integration Edge candidate only; real installed onboarding remains #11."
