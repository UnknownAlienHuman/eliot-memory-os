[work_unit]
cell_id = "integration.activation-request-ticket-resolution-response"
causal_property = "One exact Agent Bridge activation request creates at most one Kernel-owned ticket and one Governor semantic resolution identity; every request reaches one immediate typed disposition or an exact durable pending/reconciling state, and no error, lease expiry, reconnect or lost acknowledgement can silently drop the result, repeat semantic resolution, create a duplicate Session or loop without a changed discriminator."
current_discriminator = "AgentActivationResolutionResult v2 and the pure Governor mapper exist, but the live path is split across unfinished daemon producer #839, Kernel receiver/replay #1095, P-04 admission #342 and executable bridge #77. No parent integration PR currently proves all seven dispositions, exact replay, transport-loss reconciliation, selection follow-up and restart behavior end to end."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/66"

[documentation]
architecture = [
