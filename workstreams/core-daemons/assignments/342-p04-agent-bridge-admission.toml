  "python scripts/verify-agent-bridge-protocol.py",
  "git diff --check",
]
edge_proof = "Drive activation, invocation, cancellation, reconnect and unknown-result cases through one authenticated current bridge process, restart Kernel and prove exact rehydration with no duplicated semantic/provider work."
product_proof = "This establishes the Kernel P-04 Edge candidate only; executable bridge and installed Product proof remain #77/#11."
