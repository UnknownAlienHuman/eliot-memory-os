[work_unit]
cell_id = "kernel.p04-agent-bridge-admission-and-request-state"
causal_property = "Kernel accepts one Agent Bridge host request only from an authenticated current bridge process and connection bound to exact installation, principal, Session, task/WorkScope, RequestIdentity, operation, capability, deadline, cancellation, AuthorityEpoch and StateFence; it owns durable request/replay/cancel/reconcile state but never interprets MCP/domain semantics or lets transport success create authority, completion or canonical truth."
current_discriminator = "The Agent Bridge exposes typed host invocation and cancellation surfaces, but its production KernelHostRequestPort is unavailable. The current Kernel path does not expose one complete P-04 owner that admits, persists, routes, cancels and reconciles the exact host request while preserving activation v2 outcomes and session/fence lineage."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/342"

