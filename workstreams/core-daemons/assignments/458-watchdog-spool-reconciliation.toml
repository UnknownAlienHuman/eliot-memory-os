[work_unit]
cell_id = "supervision.watchdog-spool-export"
causal_property = "A retained Watchdog spool record advances past the Watchdog-owned cursor only after an exact authenticated sink acknowledgement for the same immutable batch and per-entry disposition."
old_path_discriminator = "IndependentKernelSensor::readback opens the protected redb spool and returns the complete Vec<WatchdogSpoolEntry>; no production caller exports it, no durable cursor/batch/ack contract exists, and no Governor consumer admits heartbeat/gap/recovery records."
result = "Wave A/B source candidate; Kernel/Governor Edge and Product proof remain separate"

[documentation]
architecture_sections = [
  "docs/architecture/A08-01-purpose.md#a81-purpose",
  "docs/architecture/A13-02-kernel-and-failure-domains.md#a132-kernel-and-failure-domains",
]
