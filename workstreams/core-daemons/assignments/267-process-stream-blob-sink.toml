]
routing_receipt_status = "REQUIRED_BEFORE_FIRST_SOURCE_MUTATION"

[current_state]
contract_owner = "crates/kernel/eliot-process"
contract_surface = [
  "ProcessStreamEvidence and independent transport/persistence/preview/gap axes",
  "ProcessStreamSinkClient and ProcessStreamSinkFuture",
  "ProcessStreamSinkOpenRequest",
  "ProcessStreamSinkAppend",
  "ProcessStreamSinkFinalizeRequest",
  "ProcessStreamSinkAbortRequest",
  "ProcessStreamSinkReadback",
  "ProcessStreamSinkSessionView",
  "ProcessStreamSinkTerminal",
]
blob_owner = "crates/storage/eliot-blob-api + crates/storage/eliot-blob"
confirmed_gap = [
  "Repository search finds no production impl ProcessStreamSinkClient outside the provider-neutral contract/tests.",
  "No adapter binds a stream session to BlobStageRequest/BlobReadyReceipt/readback.",
  "WindowsProcessExecutor still owns only an in-memory prefix and synthetic locator; #268 depends on this adapter.",
]
old_discriminator = "Open, append and finalize a ProcessStreamSink session against current main: only fake/contract implementations exist; no real BlobStore source can be returned or read back."

[crate_extraction_decision]
disposition = "create"
proposed_path = "crates/instrument/eliot-process-stream-blob"
package_name = "eliot-process-stream-blob"
layer = "C3 adapter"
state_owner = "none; session state is operation-local and the BlobStore service remains the sole durable byte owner"
justification = [
  "Real first consumer is WindowsProcessExecutor in #268 and testd in #20.",
  "The adapter has an independent fake/real BlobStore contract-test seam.",
  "It isolates the storage dependency from provider-neutral eliot-process and avoids a C0/C1 dependency inversion.",
  "It can be removed or replaced without changing ProcessStreamEvidence or BlobStore public contracts.",
]
forbidden_alternatives = [
  "add eliot-blob or filesystem dependencies to eliot-process",
  "make eliot-blob understand process/task/finish semantics",
  "create a second Blob root, CAS implementation or stream database",
  "put the adapter inside WindowsProcessExecutor so no other process consumer can use it",
]
workspace_rule = "Add the crate to the root workspace only in the same source commit that provides a compilable first implementation and updates Cargo.lock if required. Empty package admission is forbidden."

[public_surface]
required_types = [
  "BlobProcessStreamSink<C: BlobStoreClient>",
  "BlobProcessStreamSession",
  "BlobProcessStreamSinkConfig",
  "BlobProcessStreamSinkError",
  "ProcessStreamBlobBinding",
]
required_impl = "impl<C: BlobStoreClient> ProcessStreamSinkClient for BlobProcessStreamSink<C>"
config_fields = [
  "exact BlobRootLease or root-lease provider port",
  "BlobPolicyBinding source/policy projection",
  "bounded append queue items and bytes",
  "bounded chunk and total bytes",
  "bounded preview bytes",
  "append/finalize/readback deadlines",
  "overflow disposition",
  "source retention/erasure identity",
]
binding_fields = [
  "ProcessExecutionBinding",
  "ProcessStreamKind",
  "ProcessStreamSinkSessionId",
  "ProcessStreamSinkSourceId",
  "ProcessStreamPolicyBinding",
  "ProcessStreamTransformationBinding",
  "Blob operation/request/idempotency identities",
  "Blob root/path generation and State Fence",
]

[algorithm.open]
steps = [
  "Validate the complete ProcessStreamSinkOpenRequest before any Blob mutation.",
  "Resolve one exact Blob root lease, policy binding and operation/request identity from injected owner ports.",
  "Create one operation-local session with bounded in-memory queue and digest/preview accumulators.",
  "Return Open only after every owner needed for append/finalize/cancel is installed.",
]

[algorithm.append]
steps = [
  "Validate session, stream, process binding, policy, sequence, offset and replay identity.",
  "Update full physical transport digest/count and policy-transformed admissible digest/count incrementally.",
  "Retain only the bounded allowed preview; never retain raw pre-policy bytes in the public evidence record.",
  "Move admissible bytes through a bounded queue that does not block the pipe reader beyond the declared append deadline.",
  "On queue saturation, provider backpressure or persistence failure, preserve exact admitted bytes/counts and transition to a typed partial/unavailable/unknown state; never report CompleteSource.",
  "An exact append retry is idempotent; changed bytes under the same sequence/offset are MismatchedReplay.",
]

[algorithm.finalize]
steps = [
  "Close append admission and drain every already accepted queue item under the bounded finalize deadline.",
  "Stage the exact post-policy byte sequence through BlobStageRequest and obtain an owner-issued BlobReadyReceipt.",
  "Independently read back the immutable source through BlobReadRequest under a byte ceiling.",
  "Verify source length, source digest, Blob locator/root/path generation, ready-receipt identity and metadata digest.",
  "Construct ProcessStreamEvidence only after terminal transport/persistence/source/preview/gap invariants agree.",
  "Zero-byte EOF produces a real complete immutable object/receipt when policy permits.",
]

[algorithm.abort_or_unknown]
steps = [
  "Cancellation, read failure, redaction failure and policy prohibition preserve the exact terminal reason and all bytes already admitted.",
  "A Blob stage/finalize response with unknown outcome keeps the exact Blob operation identity and cannot be restaged blindly.",
  "Reopen/reconcile queries the same Blob operation/receipt before deciding complete, partial or unavailable.",
  "Terminal session identity is immutable; changed terminal command under the same terminal ID is rejected.",
]

[backpressure]
requirements = [
  "No Blob call, filesystem call or unbounded allocation occurs while holding the physical pipe-reader lock.",
  "Queue item and byte ceilings are both enforced.",
  "Overflow disposition is explicit: partial source, source unavailable, or unknown outcome according to accepted-byte certainty.",
  "The physical reader can continue draining/discarding under policy after durable persistence becomes unavailable, while exact evidence records the resulting gap.",
  "No retry loop can exceed the session deadline or hide provider backpressure.",
]

[privacy]
requirements = [
  "The adapter consumes an owner-produced policy/transformation binding and does not choose privacy policy.",
  "Raw pre-policy bytes never appear in preview, logs, errors, evidence refs or Blob metadata when policy prohibits them.",
  "Transformation input/output identity is bound into the stream evidence and Blob operation receipt.",
  "Redaction failure cannot fall back to raw persistence.",
  "BlobStore receipt proves durable bytes only and creates no semantic, verifier, task or finish authority.",
]

