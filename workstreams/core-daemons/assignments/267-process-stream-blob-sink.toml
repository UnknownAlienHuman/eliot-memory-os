[documentation]
architecture_handles = ["ARCH-MOD-03", "ARCH-SEC-02", "ARCH-OBS-01", "ARCH-RES-01", "ARCH-RES-04"]
implementation_handles = ["I1.2 BlobStore", "I2 Instrument Plane IP0-IP3", "I5.12", "I7.23", "I7.26", "I7.27", "I18"]
