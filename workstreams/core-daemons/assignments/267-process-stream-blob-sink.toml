primary_cell = "instrument.process-stream.immutable-sink"
causal_property = "A process stdout/stderr reader can continuously drain into one bounded policy-transformed immutable Blob object and obtain typed terminal ProcessStreamEvidence; Blob latency, backpressure, failure or unknown outcome cannot block the pipe indefinitely or fabricate complete evidence."
