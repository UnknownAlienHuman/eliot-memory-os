[work_unit]
cell_id = "runtime.user-broker-resource-credential-boundary"
causal_property = "A user-session-bound resource, credential or UI/runtime launch is materialized only under the exact current Windows principal, interactive session, broker generation/epoch, operation lease, StateFence and process lineage; logoff, lease loss or generation change revokes it without transferring task, route or canonical-state ownership to the broker."
old_path_discriminator = "Replay a resource or launch request after logoff, broker restart, SID/session change, broker epoch change, path substitution or credential-policy revision. The broker must reject/fence the stale binding and preserve the exact in-flight reconciliation state rather than impersonating another user, widening the path or copying the secret to the service side."
integration_owner = "#23 User Broker boundary; #15 owns Kernel registration/authority; #22 consumes resource/credential bindings in native workers; #74 owns per-operation RequestIdentity; #79 owns durable session versus transport identity; #100 owns process mechanics"
one_writer_rule = "One worker per wave and mutable path claim. Workers return candidates and do not merge their own work."
result = "integration candidate only"

[normative_basis]
architecture = [
  "A2.2",
  "A9",
  "A11",
  "A12",
  "A13.2",
  "ARCH-AUTH-01",
  "ARCH-HUM-01",
  "ARCH-RES-04",
  "ARCH-SEC-01",
  "ARCH-SEC-02",
]
implementation = [
  "I1.3",
  "I1.4",
  "I1.5",
  "I1.6",
  "I3.3",
  "I3.4",
  "I3.5",
  "I3.6",
  "I6.10",
  "I6.15",
  "I7.14",
  "I7.16",
]
reason = "The machine service cannot manufacture or retain an interactive user's identity, credential or desktop authority; the on-demand User Broker is an exact lease-bound materialization boundary, not a scheduler or semantic owner."

[current_source]
observed_on = "main@317774c7bf50660e49249e7a74ef5fa798234f91"
source_handles = [
  "bins/eliot-user-broker/src/lib.rs",
  "bins/eliot-user-broker/src/main.rs",
  "bins/eliot-user-broker/src/protected_launch_config.rs",
  "bins/eliot-user-broker/src/kernel_authority_port.rs",
  "crates/governor/eliot-user-broker-core/src/lib.rs",
  "crates/kernel/eliot-process/src/lib.rs",
  "crates/instrument/eliot-process-executor/src/lib.rs",
  "crates/kernel/eliot-kernel-service/src/lib.rs",
  "crates/foundation/eliot-runtime-contracts/src/lib.rs",
]
confirmed_current_mechanics = [
  "The broker validates protected launch configuration, current executable digest and Windows SID/session against the current token.",
  "The broker exposes registration, heartbeat, launch authorization and fence calls through a Kernel authority port.",
  "The broker composes a local ProcessExecutor client and retains protected durable registration state.",
]
missing_closure = [
  "one stable caller/registration binding distinct from per-operation RequestIdentity owned by #74",
  "one typed resource lease and credential introduction contract for every boundary crossing",
  "immediate revocation/reconciliation on logoff, broker loss, lease expiry, epoch/fence or policy change",
  "negative proof that credential values never escape the exact child contour",
  "real Windows SID/session/logoff/Job Object Product evidence",
]

[ownership]
lifecycle_owner = "Kernel owns active broker registration and authority; User Broker owns only current user-session process/materialization mechanics; Governor owns route/task policy; Host does not impersonate the user"
mutable_state = [
  "one active broker registration per installation/SID/interactive-session",
  "broker heartbeat and expiry state",
  "operation-scoped resource and credential introductions",
  "broker-owned Job Object/process lineage",
  "in-flight launch/effect reconciliation state",
  "protected broker registration snapshot",
]
allowed_effects = [
  "prove current Windows SID and interactive session",
  "retain and renew one Kernel-issued broker registration",
  "validate and materialize exact resource/credential handles for one operation",
  "launch and contain approved user-session children through ProcessExecutor",
  "revoke/fence and reconcile broker-bound operations on identity or lease loss",
]
must_not_own = [
  "Task, WorkItem, plan, budget or route selection",
  "canonical semantic state",
  "credential vault or secret policy",
  "service-side interactive token creation or impersonation",
  "generic UI shell or arbitrary process launcher",
  "finish, approval or retry policy",
]

[contract]
preferred_owner = "existing User Broker core/runtime, Kernel authority and platform resource-lease contracts; no new crate without a reviewed CrateExtractionDecision"
public_types = [
  "UserBrokerCallerBinding",
  "UserBrokerRegistrationIdentity",
  "UserBrokerRegistrationLease",
  "UserExecutionRequest",
  "UserResourceIntroduction",
  "UserCredentialIntroduction",
  "UserExecutionGrant",
  "UserExecutionReceipt",
  "UserBrokerRevocationReceipt",
  "UserBrokerReconciliationView",
]
closed_registration_states = [
  "UNREGISTERED",
  "CHALLENGE_PENDING",
  "ACTIVE",
  "RENEWAL_DUE",
  "EXPIRED",
  "FENCED",
  "LOGOFF_OBSERVED",
  "RECONCILING",
  "TERMINAL",
]
closed_resource_kinds = [
  "FILE",
  "DIRECTORY",
  "NAMED_PIPE",
  "NETWORK_ENDPOINT",
  "DEVICE",
  "WINDOW_STATION_DESKTOP",
  "CLIPBOARD_OR_UI_SURFACE",
]
closed_credential_classes = [
  "USER_OWNED_PROVIDER_CREDENTIAL",
  "USER_OWNED_OS_RESOURCE_TOKEN",
  "USER_OWNED_APPLICATION_SESSION",
]
closed_execution_outcomes = [
  "KNOWN_NOT_STARTED",
  "STARTED",
  "SUCCEEDED_CANDIDATE_ONLY",
  "FAILED_KNOWN",
  "CANCELLED_CONFIRMED",
  "CANCEL_UNKNOWN",
  "UNKNOWN_EXTERNAL_EFFECT",
  "RECONCILING",
]

[contract.caller_binding]
required_fields = [
  "installation_id",
  "Windows SID",
  "interactive session id",
  "broker artifact/config/protocol/generation identity",
  "broker launch nonce and process-tree identity",
  "Kernel challenge/registration root identity",
  "lineaged broker/authority EpochId from #64",
  "StateFence",
  "policy/config authority references",
]
rule = "This stable caller binding is not a RequestIdentity. Register, each heartbeat revision, each launch authorization and fence/logoff use distinct operation identities under #74."

[contract.registration]
required_fields = [
  "registration id and broker epoch",
  "exact caller binding digest",
  "current process/Job Object ownership challenge",
  "issued/observed/expiry times bound to boot/session observation",
  "heartbeat predecessor revision and receipt digest",
  "allowed user-execution/resource/credential classes",
  "StateFence and EpochId",
  "Kernel signature/receipt identity",
]
rules = [
  "Exactly one active registration exists per installation + SID + interactive session.",
  "A successor broker epoch fences the predecessor before new launch/effect authority.",
  "Process survival, transport traffic or config-file presence cannot renew registration.",
  "A broker restart uses the stable caller binding and a new registration operation; it never revives historical RequestIdentity or lease revision.",
]

[contract.resource_introduction]
required_fields = [
  "resource lease id/version and owner",
  "operation and parent request identity",
  "resource kind and canonical allowed root/endpoint/device identity",
  "stable object/file identity and generation",
  "read/write/execute/create/delete/network/device permissions",
  "reparse/symlink/path traversal policy",
  "privacy, visibility, retention and disclosure envelope",
  "issued/expiry/revocation evidence",
  "SID/session/broker registration/EpochId/StateFence binding",
]
rules = [
  "Revalidate stable identity and path/root immediately before use and before each load-bearing effect where replacement is possible.",
  "A caller may narrow but never widen root, path, method, permission, privacy or retention dimensions.",
  "A stale/replayed/substituted lease fails only the dependent operation and creates no fallback path.",
]

[contract.credential_introduction]
required_fields = [
  "credential reference id and credential class without the value",
  "credential authority/policy revision",
  "exact target process operation and executable/generation identity",
  "SID/session/broker registration/EpochId/StateFence binding",
  "allowed destination/provider/account scope",
  "materialization channel and child-only lifetime",
  "expiry/revocation/non-disclosure evidence",
]
rules = [
  "Credential values are materialized only into the exact approved child process through an admitted protected channel.",
  "Credential values are absent from command line, inherited ambient environment, durable logs, receipts, model context, canonical memory and reusable config snapshots.",
  "Kernel, Host and machine-service code receive references and receipts only, never user credential values.",
  "Logoff, registration loss, policy revision, operation completion or target-process identity change revokes materialization.",
]

[contract.execution_request]
required_fields = [
  "distinct per-operation RequestIdentity from #74",
  "active registration id/revision and caller binding digest",
  "Task/WorkItem/AgentAttempt or service-operation owner reference without ownership transfer",
  "exact approved executable/artifact/config/protocol identity",
  "resource and credential introduction sets",
  "ProcessExecutor request/operation identity",
  "deadline, cancellation, resource and descendant ceilings",
  "privacy/data class and output/evidence policy",
  "effect class and exact ceiling",
]
rule = "The broker validates the grant and materializes mechanics. It cannot choose or widen the route, tool, model, executable, resource, credential, privacy, budget or effect envelope."

[algorithm]
steps = [
  "1. Validate protected caller binding against current executable, process token SID, interactive session, launch nonce, process lineage, EpochId and StateFence.",
  "2. Register through one distinct operation identity; Kernel issues one active registration lease and fences any predecessor for the same installation/SID/session.",
  "3. Renew only from fresh authenticated heartbeat/progress evidence and the exact predecessor revision; process survival alone does not renew.",
  "4. For one execution request, validate the distinct operation identity, current registration and exact approved envelope before resource or credential access.",
  "5. Revalidate every resource lease and credential policy/target immediately before materialization.",
  "6. Materialize credential values only in the exact child contour and launch through ProcessExecutor under the broker Job Object/process lineage.",
  "7. Retain process/effect evidence and reconcile cancellation or unknown outcomes by exact operation identity.",
  "8. On logoff, heartbeat loss, expiry, epoch/fence/policy change or broker termination, close new launches, revoke introductions and begin bounded cancellation/reconciliation for in-flight operations.",
  "9. Publish typed revocation/reconciliation evidence; do not stop unrelated machine-scoped tasks or claim semantic completion.",
]

[errors]
required = [
  "NO_MATCHING_INTERACTIVE_SESSION",
  "SID_MISMATCH",
  "INTERACTIVE_SESSION_MISMATCH",
  "BROKER_ARTIFACT_MISMATCH",
