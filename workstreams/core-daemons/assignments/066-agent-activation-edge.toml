schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_INTEGRATION_ALLOCATION"
routing_authority = "owning_issue_and_normative_pair_only"
status = "BLOCKED_ON_COMPONENT_EDGES_READY_FOR_INTEGRATION"
implementation_support = "V2_COMPONENTS_PARTIAL_END_TO_END_EDGE_UNPROVED"
evidence_execution_status = "SOURCE_AND_ISSUE_INSPECTED_TESTS_NOT_EXECUTED"
proof_ceiling = "AGENT_ACTIVATION_ONBOARDING_EDGE_CANDIDATE_ONLY"
issue = 66
bridge_port_issue = 342
daemon_producer_issue = 839
kernel_receiver_issue = 1095
kernel_issue = 15
governor_issue = 18
user_broker_issue = 23
agent_bridge_issue = 77
parent_product_issue = 11
normative_pair_ref = "docs/normative-pair.toml"

[work_unit]
cell_id = "runtime.agent-activation-onboarding-edge"
causal_property = "One bounded Agent Bridge activation request produces one Kernel-owned ticket, at most one Governor semantic read, one durable typed v2 result, one immediate agent-visible disposition, and a Session only for an exact current Resolved binding; restart, replay, cancellation, deadline, ambiguity, and unknown submission cannot lose work or create authority."
current_discriminator = "The v2 result contract, daemon mapper, Kernel receiver allocation, and Agent Bridge host-port allocation are split across #839, #1095, and #342, but no accepted end-to-end edge proves request-to-ticket-to-result-to-bridge behavior for all seven dispositions and failure races."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/66"

[documentation]
architecture = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A10-01-agent-interaction-loop.md#a101-agent-interaction-loop",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A12-02-principal-session-and-visibility.md#a122-principal-session-and-visibility",
]
implementation = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I01-11-startup-algorithm.md#i111-startup-algorithm",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I05-16-common-durable-fields.md#i516-common-durable-fields",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I07-01-eliot-bridge-protocol-ebp1.md#i71-eliot-bridge-protocol-ebp1",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I07-02-frame.md#i72-frame",
