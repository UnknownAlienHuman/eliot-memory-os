]
rule = "Do not collapse transport, durable session, owner, epoch/fence, generation and lease defects into one SessionFenced result above the internal transport boundary."

[start_admission]
required_order = [
  "authenticate and validate EBP transport binding",
  "resolve the current durable ProcessExecutionCallerBinding from Kernel/ORS owner state",
  "validate exact owner class and identity for the requesting contour",
  "validate ProcessIntent operation/session/effect digest without connection-derived substitution",
  "validate dispatch authority, action lease, canonical EpochId, StateFence and process generation",
  "reserve durable replay/operation identity",
  "launch suspended under the existing ProcessExecutor authority path",
  "consume authority and publish the exact start receipt",
]
hard_rule = "Until every required binding is present, Start remains fail-closed exactly as current frame_dispatch does."

[cancel_and_reconcile]
rules = [
  "Cancel and reconcile use operation_id, process tree/physical identity, process owner and durable execution session; the current pipe connection is optional routing only.",
  "Loss of the original transport does not erase cancellation or reconciliation authority already held by the correct owner.",
  "A new transport must present a current rebind receipt before receiving session-bound observations or control responses.",
  "Unknown outcome remains operation-local and blocks only dependent execution scope.",
  "No cancel request may target a process merely because it arrived on the connection that launched it.",
]

