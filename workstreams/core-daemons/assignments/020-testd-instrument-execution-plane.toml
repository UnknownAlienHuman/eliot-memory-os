  "CLEANUP_INCOMPLETE",
  "IDENTITY_CONFLICT",
]

[[wave]]
order = 1
id = "instrument-contract-and-core-state-machine"
issue_owner = "new bounded child issue under #20"
mutable_paths = [
  "crates/instrument/eliot-instrument-api/src/**",
  "crates/instrument/eliot-testd-core/src/**",
  "crates/instrument/eliot-testd-core/tests/**",
]
deliverable = "Closed request/receipt dimension contracts and a pure bounded state machine with no process or canonical effects."
must_not_touch = ["ProcessExecutor", "BlobStore/evidence sink", "Kernel/ORS", "bins/eliot-testd composition"]
proof_ceiling = "INSTRUMENT_CONTRACT_AND_TESTD_CORE_MODULE_PROOF_ONLY"

[[wave]]
order = 2
id = "sandbox-and-build-fingerprint"
issue_owner = "separate child issue under #20"
mutable_paths = [
  "declared testd sandbox/worktree provisioner modules",
  "declared BuildFingerprint/cache adapter modules",
  "focused sandbox/cache fixtures",
]
deliverable = "Stable source/worktree/artifact identity, bounded temporary roots, optional identity-bound caches and cleanup ownership."
must_not_touch = ["process mechanics", "parser/evaluator semantics", "canonical source owner"]
proof_ceiling = "TESTD_SANDBOX_AND_BUILD_IDENTITY_PROOF_ONLY"

[[wave]]
order = 3
id = "process-executor-client"
issue_owner = "separate child issue under #20 and #100"
mutable_paths = [
  "bins/eliot-testd ProcessExecutor adapter modules",
  "focused start/cancel/timeout/reconcile fixtures",
]
deliverable = "Thin typed client of the one ProcessExecutor with no direct spawn/shell/pipe/timer implementation."
must_not_touch = ["ProcessExecutor owner source", "stream evidence owner", "task/finish owner"]
proof_ceiling = "TESTD_PROCESS_CLIENT_MODULE_PROOF_ONLY"

[[wave]]
order = 4
id = "typed-stream-and-artifact-evidence"
issue_owner = "separate child issue coordinated with #85 and #267-#271"
mutable_paths = [
  "testd typed process-stream consumer paths",
  "testd artifact binding/readback paths",
  "focused zero-byte/partial/purged/corrupt fixtures",
]
deliverable = "Typed stdout/stderr/artifact evidence consumption with exact readback and no synthetic raw locator."
must_not_touch = ["BlobStore root ownership", "ProcessExecutor mechanics", "evaluator meaning"]
proof_ceiling = "TESTD_EVIDENCE_CONSUMER_PROOF_ONLY"

[[wave]]
order = 5
id = "parser-normalizer-evaluator-adapters"
issue_owner = "separate child issue under #20"
mutable_paths = [
  "one declared parser/normalizer/evaluator adapter family at a time",
  "profile-specific conformance fixtures",
]
deliverable = "Typed adapters preserving parsing, evaluation, applicability, independence and coverage as separate dimensions."
must_not_touch = ["Task acceptance", "strict finish", "generic shell or generic JSON profile"]
proof_ceiling = "INSTRUMENT_ADAPTER_MODULE_PROOF_ONLY"

[[wave]]
order = 6
id = "testd-composition-and-operational-recovery"
issue_owner = "separate child issue under #20 and #15"
mutable_paths = [
  "bins/eliot-testd/src/**",
  "declared ORS testd-job operational projection paths",
  "focused daemon restart/reconcile fixtures",
]
deliverable = "Thin service/composition root, bounded job queue, checkpoint/cancel/cleanup recovery and exact receipt publication."
must_not_touch = ["canonical task state", "semantic scheduler", "Kernel process mechanics", "finish"]
proof = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-testd -p eliot-testd-core --all-targets",
  "cargo test --locked -p eliot-testd -p eliot-testd-core",
  "cargo clippy --locked -p eliot-testd -p eliot-testd-core --all-targets -- -D warnings",
]
proof_ceiling = "TESTD_COMPOSITION_AND_RECOVERY_MODULE_PROOF_ONLY"

[[wave]]
order = 7
id = "real-edge-and-product"
issue_owner = "integration owner under #20 and #11"
mutable_paths = ["bounded Windows edge fixtures and Product Pulse artifacts only"]
deliverable = "One real compiler/test Instrument produces expandable evidence, survives process/testd restart, remains distinct across all dimensions and contributes to task acceptance only through the owning Governor verifier/finish path."
proof_ceiling = "REAL_TESTD_PROCESS_EVIDENCE_EDGE_AND_PRODUCT_PULSE"

[fixtures]
required = [
  "admitted profile and complete successful execution",
  "profile/version mismatch",
  "stale source snapshot or BuildFingerprint",
  "sandbox reparse/symlink escape attempt",
  "cache miss, cache corruption and optional-cache bypass",
  "child exit zero with partial stdout transport",
  "child exit zero with source persistence unavailable",
  "zero-byte complete stdout/stderr",
  "read error after a persisted prefix",
  "large output and pipe saturation",
  "cancellation and timeout races",
  "process crash with descendants",
  "unknown process or persistence outcome",
  "parser failure after complete source",
  "evaluator unavailable or stale",
  "partial/unknown coverage denominator",
  "artifact produced but bound to the wrong source/worktree",
  "cleanup failure after evaluator pass",
  "testd restart with a nonterminal operation",
  "attempted direct task finish from process success",
]
required_assertions = [
  "no direct canonical write or finish authority exists in testd",
  "process exit cannot promote stream, parse, evaluate, coverage or cleanup dimensions",
  "partial/unavailable source cannot satisfy a complete verifier",
  "all descendants and temporary resources are contained or explicitly reported unknown/manual recovery",
  "retry requires exact prior-operation reconciliation and external policy",
]

[prerequisites]
required = [
  "#64 lineaged EpochId for authority-bearing job/process bindings",
  "#65 protected capacity for cancellation/fencing/recovery under workload saturation",
  "#79 durable execution-session binding separated from transport connection",
  "#85 and #267-#271 accepted typed stream evidence path for load-bearing output",
  "#100 one admitted ProcessExecutor mechanics owner",
]

[non_goals]
items = [
  "No task scheduler, agent harness or persistent autonomous test agent.",
  "No canonical store credential or semantic mutation path.",
  "No generic shell profile or arbitrary caller command.",
  "No tool exit code, parser success or test count as canonical truth.",
  "No reuse of an old verifier verdict through build/test cache.",
  "No Product or VERIFIED_COMPLETE claim from package-local tests alone.",
]

[stop_conditions]
items = [
  "Another open PR owns any selected mutable path.",
  "Current main is not an ancestor of the worker branch.",
  "The profile lacks a single field-level owner contract.",
  "A complete evidence claim would depend on a synthetic/non-resolvable locator.",
  "The worker would need to duplicate ProcessExecutor, BlobStore or ORS ownership.",
  "Coverage completeness lacks an exact independently recheckable denominator.",
  "The requested parser/evaluator would need generic JSON, prose inference or model self-certification.",
  "The change would allow testd to decide Task acceptance or finish.",
]
challenge = "Return a ContractChallenge to #20 with exact source/evidence. Do not add a generic runner, local spawn path, synthetic evidence handle, inferred coverage or finish shortcut."

[result_contract]
required_fields = [
  "issue_and_cell",
  "source_base_and_candidate",
  "causal_property",
  "old_path_discriminator",
  "changed_contract_or_source",
  "owned_state_and_effects",
  "module_proof",
  "edge_proof",
  "product_pulse_or_not_applicable_reason",
  "evidence_execution_status",
  "known_uncovered_behavior",
  "security_privacy_and_authority_delta",
  "migration_rollback_and_removal",
  "integration_candidate",
  "residual_unknowns",
]
finish_states = [
  "VERIFIED_COMPLETE",
  "PARTIAL",
  "BLOCKED",
  "FAILED_VERIFICATION",
  "DEGRADED_NO_PROOF",
  "UNSAFE_TO_FINISH",
  "CANCELLED",
  "SUPERSEDED",
]
