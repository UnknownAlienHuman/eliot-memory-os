schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_AGENT_HANDOFF"
status = "READY_FOR_SWARM_IMPLEMENTATION"
implementation_support = "TARGET"
evidence_execution_status = "NOT_EXECUTED"
proof_ceiling = "AGENT_HANDOFF_ONLY"
parent_issue = 20
integration_issue_refs = [11, 15, 18, 85, 100, 267, 268, 269, 270, 271]
base_branch = "main"
base_sha = "317774c7bf50660e49249e7a74ef5fa798234f91"
normative_pair_ref = "docs/normative-pair.toml"
docs_read_status = "ACCEPTED_PAIR_READ_FROM_PROJECT_INPUT / REPOSITORY_READER_MUST_BE_RERUN_BY_SOURCE_WORKER"
dreamer_excluded = true

[work_unit]
cell_id = "instrument.testd.execution-plane"
causal_property = "One admitted typed Instrument job executes in an isolated bounded process/worktree contour and returns exact raw-source, transport, parsing, evaluation, artifact-binding, coverage and cleanup evidence without becoming a scheduler, verifier authority, canonical writer or finish owner."
old_path_discriminator = "Run a profile whose child exits successfully while stream persistence is partial, parsing fails, the tested artifact is stale, coverage is incomplete or cleanup leaves descendants. The result must preserve every failed dimension and cannot become verified completion from exit code or a non-empty stdout handle."
integration_owner = "#20 testd execution plane; #15 owns Kernel admission/control; #18 owns semantic acceptance/finish; #85 and #267-#271 own typed durable stream evidence; #100 owns native process mechanics; #11 owns the real Product Pulse"
one_writer_rule = "One worker per wave and mutable path claim. Workers return candidates and do not merge their own work."
result = "integration candidate only"

[normative_basis]
architecture = [
  "A2.3",
  "A5.5",
  "A10.8",
  "A13.5",
  "A13.9",
  "A14.8",
  "ARCH-FIN-01",
  "ARCH-GROUND-01",
  "ARCH-OBS-01",
  "ARCH-ORD-01",
  "ARCH-RES-04",
]
implementation = [
  "I1.3",
  "I2.7",
  "I2.18",
  "I2.22",
  "I7.20",
  "I7.22",
  "I7.23",
  "I7.26",
  "I7.27",
  "I10",
  "I14.6",
  "I17",
  "I18",
  "IP0",
  "IP1",
  "IP2",
  "IP3",
  "IP4",
  "IP5",
]
reason = "Instrument execution, raw evidence, normalization, evaluation, artifact binding and finish are independent stages with different owners and proof ceilings."

[current_source]
observed_on = "main@317774c7bf50660e49249e7a74ef5fa798234f91"
source_handles = [
  "bins/eliot-testd/Cargo.toml",
  "bins/eliot-testd/src/lib.rs",
  "bins/eliot-testd/src/main.rs",
  "crates/instrument/eliot-testd-core/src/lib.rs",
  "crates/instrument/eliot-process-executor/src/lib.rs",
  "crates/kernel/eliot-process/src/lib.rs",
  "crates/instrument/eliot-instrument-api/src/lib.rs",
  "crates/kernel/eliot-ors/src/model.rs",
  "crates/kernel/eliot-ors/src/store.rs",
]
required_current_inventory = [
  "all accepted testd profile kinds and their exact contract owners",
  "all worktree/build/sandbox provisioning paths",
  "all direct process launch, cancellation and cleanup paths",
  "all stdout/stderr evidence producers and consumers",
  "all parser/normalizer/evaluator adapters",
  "all active job/checkpoint/retry/dedup state",
  "all paths that can influence task acceptance or finish",
]
source_inventory_rule = "The implementation worker must regenerate the exact reverse-consumer/effect inventory on then-current main. Seed paths do not prove completeness or safe deletion."

[ownership]
lifecycle_owner = "testd owns only one active Instrument job's operational execution state; Kernel/Governor owners retain durable job, budget, task, plan, semantic acceptance and finish"
mutable_state = [
  "bounded active testd execution records",
  "temporary worktree/build/sandbox roots and declared cache leases",
  "process operation and cancellation/checkpoint references",
  "parser/normalizer checkpoints",
  "cleanup/reconciliation state",
]
allowed_effects = [
  "provision and release an admitted temporary worktree/sandbox",
  "invoke only an admitted typed Instrument profile through ProcessExecutor",
  "persist policy-bound raw stream/artifact evidence",
  "run typed parser/normalizer/evaluator adapters",
  "publish immutable evidence and operational receipts",
  "cancel, contain and clean up owned process trees and temporary roots",
]
must_not_own = [
  "Task or WorkItem lifecycle",
  "scheduler or route/model selection",
  "canonical semantic writes",
  "acceptance or VERIFIED_COMPLETE",
  "generic shell profile",
  "provider credentials outside exact process/resource bindings",
  "automatic equivalent retry after unknown outcome",
]

[contract]
preferred_location = "existing eliot-instrument-api / eliot-testd-core / process-evidence owners; no new crate unless a reviewed CrateExtractionDecision proves an independent contract, state, consumer and proof seam"
public_types = [
  "InstrumentExecutionRequest",
  "InstrumentProfileBinding",
  "InstrumentSandboxBinding",
  "InstrumentProcessBinding",
  "InstrumentRawEvidenceSet",
  "InstrumentNormalizationResult",
  "InstrumentEvaluationResult",
  "InstrumentCleanupDisposition",
  "InstrumentExecutionReceipt",
  "InstrumentReconciliationView",
]
closed_job_states = [
  "ACCEPTED",
  "SANDBOX_PREPARING",
  "READY_TO_EXECUTE",
  "EXECUTING",
  "CAPTURING_EVIDENCE",
  "NORMALIZING",
  "EVALUATING",
  "CLEANING_UP",
  "TERMINAL",
  "RECONCILING",
]
closed_execution_states = [
  "NOT_EXECUTED",
  "START_REJECTED",
  "EXECUTED",
  "CANCELLED_CONFIRMED",
  "TIMEOUT_CONFIRMED",
  "CRASHED_OBSERVED",
  "UNKNOWN_OUTCOME",
]
closed_transport_states = [
  "COMPLETE",
  "PARTIAL",
  "READ_ERROR",
  "CANCELLED",
  "UNAVAILABLE",
]
closed_persistence_states = [
  "COMPLETE_SOURCE",
  "PARTIAL_SOURCE",
  "SOURCE_UNAVAILABLE",
  "UNKNOWN_PERSISTENCE_OUTCOME",
  "PURGED_OR_REVOKED",
]
closed_parse_states = [
  "NOT_APPLICABLE",
  "NOT_EXECUTED",
  "PARSED_COMPLETE",
  "PARSED_PARTIAL",
  "PARSE_FAILED",
]
closed_evaluation_states = [
  "NOT_APPLICABLE",
  "NOT_EXECUTED",
  "SIMULATED",
  "EXECUTED_PASS",
  "EXECUTED_FAIL",
  "INCONCLUSIVE",
  "STALE",
  "UNKNOWN_OUTCOME",
]
closed_coverage_states = [
  "COMPLETE_DENOMINATOR",
  "PARTIAL_DENOMINATOR",
  "UNKNOWN_DENOMINATOR",
  "NOT_APPLICABLE",
]
closed_cleanup_states = [
  "NOT_REQUIRED",
  "COMPLETE",
  "PARTIAL",
  "UNKNOWN_OUTCOME",
  "MANUAL_RECOVERY_REQUIRED",
]

[contract.request]
required_fields = [
  "exact Instrument profile id/version/digest and closed profile kind",
  "parent Task/WorkItem/job/attempt identities without ownership transfer",
  "operation and idempotency identity",
  "WorkScope, StateFence and lineaged EpochId",
  "tested source/worktree/artifact/BuildFingerprint identities",
  "executable/config/environment/toolchain identities",
  "resource-limit and Control Reserve class",
  "privacy, visibility, retention, redaction and disclosure policy",
  "stdout/stderr/artifact evidence policy and sink contract revision",
  "deadline, cancellation, retry and cleanup policy",
  "expected parser/normalizer/evaluator identities",
  "expected coverage denominator and applicable verifier contract",
]
rule = "The request is immutable after admission. testd may narrow execution due to local capacity or policy but cannot widen tool, path, environment, data, resource, evidence, effect or retry dimensions."

[contract.sandbox]
required_fields = [
  "canonical source snapshot or worktree identity",
  "repository/workspace root identity and stable path lease",
  "BuildFingerprint inputs and digest",
  "dirty/untracked/submodule/symlink/reparse disposition",
  "temporary root and cleanup owner",
  "cache identity, optionality, generation and invalidation set",
  "read/write/network/device/process permissions",
]
rules = [
  "A cache hit never reuses a verifier verdict or evidence execution status.",
  "A stale or mismatched artifact/worktree blocks load-bearing evaluation.",
  "Temporary roots are operation-scoped and cannot become canonical source or mutable shared authority.",
]

[contract.process]
required_fields = [
  "ProcessExecutor request/operation identity",
  "exact executable artifact/config/argv/working-directory/environment binding",
  "Job Object/process-tree ownership",
  "wall deadline and cancellation identity",
  "CPU/memory/process/handle/pipe/output ceilings",
  "stdout and stderr typed stream-session identities",
  "terminal process receipt and unknown-outcome reconciliation owner",
]
rule = "testd consumes the one admitted ProcessExecutor. It does not implement local spawn, shell, pipe, timer or descendant-kill mechanics."

[contract.evidence]
required_dimensions = [
  "process start and terminal disposition",
  "stdout transport coverage",
  "stderr transport coverage",
  "stdout durable persistence/readback",
  "stderr durable persistence/readback",
  "produced artifact set and immutable locators",
  "tested artifact/source identity",
  "parser/normalizer execution and coverage",
  "evaluator execution, applicability and independence",
  "coverage denominator",
  "cleanup and descendant disposition",
]
rule = "No dimension can promote another. Exit code zero, complete transport, durable bytes, successful parsing, evaluator pass, complete coverage and cleanup are separate facts."
raw_source_rule = "Every load-bearing complete source resolves to immutable bytes whose digest/count match. A preview or synthetic locator is display/navigation only and cannot satisfy complete proof."
zero_byte_rule = "A zero-byte stream may be COMPLETE_SOURCE when the typed profile permits it and the immutable zero-byte object/receipt verifies. It is not automatically missing."

[algorithm]
steps = [
  "1. Validate the admitted profile, exact owner identities, StateFence/EpochId, artifact/worktree/BuildFingerprint and all resource/evidence ceilings.",
  "2. Allocate bounded testd capacity without consuming protected Kernel control capacity intended for cancellation/fencing/recovery.",
  "3. Provision or validate one operation-scoped sandbox/worktree; reject identity drift and record exact cache disposition.",
  "4. Open stdout/stderr evidence sessions before process execution where required by the accepted sink contract.",
  "5. Start the typed process only through ProcessExecutor and preserve exact start/unknown outcome.",
  "6. Drain streams continuously under bounded memory and persist policy-bound source/preview/gap evidence without blocking the child indefinitely.",
  "7. Reconcile process terminal state independently from stream transport and persistence completion.",
  "8. Run only the declared parser/normalizer over verified applicable source; parsing never creates evaluator truth.",
  "9. Run the declared evaluator only when artifact, evidence, parser and denominator prerequisites are satisfied; otherwise return typed inconclusive/not-executed/stale state.",
  "10. Clean up descendants, handles, temporary roots and leases; cleanup failure remains a separate terminal/recovery disposition.",
  "11. Publish one immutable receipt containing every dimension and exact evidence handle. Do not mark Task acceptance or finish.",
  "12. Retry only under the external owner policy and only after exact reconciliation proves the prior operation's permitted retry state.",
]

[errors]
required = [
  "PROFILE_NOT_ADMITTED",
  "PROFILE_CONTRACT_MISMATCH",
  "WORK_SCOPE_MISMATCH",
  "STATE_FENCE_MISMATCH",
  "EPOCH_LINEAGE_MISMATCH",
  "SOURCE_SNAPSHOT_STALE",
