  "crates/kernel/eliot-ors/src/store.rs",
  "crates/kernel/eliot-ors/src/status.rs",
  "bins/eliotd/src/daemon_runtime.rs",
]
confirmed_existing_mechanics = [
  "Kernel retains daemon runtime status, process receipt, live-readiness evidence and supervision contour.",
  "Kernel already owns mechanical daemon failure publication and bridge-profile revocation paths.",
  "ORS owns failure-surviving operational records and supervision lease revisions.",
  "The daemon live-receipt classifier already distinguishes exact replay, activation predecessor replacement and renewal predecessor replacement.",
]
missing_closure = [
  "one explicit denominator for all accepted operations and daemon-issued effect/admission leases affected by daemon loss",
  "one typed ordering for close-ingress, revoke authority, preserve/reconcile accepted work and publish Recovery View",
  "one exact successor-generation admission condition after predecessor fencing",
  "one cross-process proof that daemon loss leaves cancellation, fencing, ORS and Recovery View available without semantic authority",
]

[ownership]
lifecycle_owner = "Kernel for mechanical daemon binding and recovery state; Host for physical process lineage; eliotd/Governor owners for semantic state"
mutable_state = [
  "active daemon generation binding",
  "daemon transport/admission binding",
  "daemon-issued effect-lease revocation state",
  "accepted-operation recovery projections in ORS",
  "minimal Kernel Recovery View projection",
]
allowed_effects = [
  "close daemon ingress",
  "revoke or fence daemon-issued mechanical authority",
  "cancel or contain already admitted operations through their existing owners",
  "append/update ORS operational recovery records",
  "publish bounded health and Recovery View evidence",
]
must_not_own = [
  "task selection or WorkScope meaning",
  "plan interpretation",
  "semantic retry or repair policy",
  "canonical project-state reconstruction",
  "store-vendor commands",
  "physical daemon restart budget",
  "new semantic admission while eliotd is unavailable",
]

[contract]
contract_owner = "eliot-kernel-service with ORS-owned persistence projection"
preferred_location = "existing Kernel service/ORS modules; no new crate without a reviewed CrateExtractionDecision"
public_types = [
  "DaemonLossObservation",
  "DaemonAuthorityRevocationRequest",
  "DaemonAuthorityRevocationReceipt",
  "DaemonAcceptedOperationDenominator",
  "DaemonLossRecoveryProjection",
  "KernelRecoveryViewSnapshot",
  "DaemonSuccessorAdmissionEvidence",
]
closed_loss_kinds = [
  "SUPERVISION_LEASE_EXPIRED",
  "AUTHENTICATED_TRANSPORT_LOST",
  "PROCESS_EXIT_OBSERVED",
  "PROCESS_IDENTITY_CONFLICT",
  "GENERATION_FENCED",
  "HOST_ORDERED_DRAIN",
  "UNKNOWN_LIVENESS",
]
closed_recovery_states = [
  "INGRESS_CLOSED",
  "AUTHORITY_REVOKING",
  "AUTHORITY_REVOKED",
  "OPERATIONS_ENUMERATING",
  "RECONCILING",
  "RECOVERY_VIEW_AVAILABLE",
  "SUCCESSOR_CANDIDATE_BLOCKED",
  "SUCCESSOR_CANDIDATE_ADMISSIBLE",
  "MANUAL_RECOVERY_REQUIRED",
]
closed_operation_dispositions = [
  "KNOWN_NOT_STARTED",
  "RUNNING_CANCELLABLE",
  "CANCELLATION_PENDING",
  "KNOWN_TERMINAL",
  "UNKNOWN_STORE_OUTCOME",
  "UNKNOWN_EXTERNAL_EFFECT",
  "RECONCILING",
  "MANUAL_RECOVERY_REQUIRED",
]

[contract.identity]
required_fields = [
  "installation_id",
  "Kernel process and generation identity",
  "lost daemon artifact/config/protocol/generation identity",
  "lost daemon process-tree identity and retained process receipt",
  "authenticated transport binding as transport identity only",
  "current lineaged EpochId from #64",
  "StateFence",
  "supervision lease id, revision and ORS receipt digest",
  "last accepted daemon live-receipt digest",
  "boot/session/time-observation identity",
  "loss observation source/evidence handles",
]
forbidden_substitutions = [
  "PID or process name for process ownership",
  "connection_id for durable Session or operation identity",
  "scalar epoch for lineaged EpochId",
  "StoreHealth for daemon liveness or supervision renewal",
  "daemon cache contents for canonical semantic state",
]

[contract.accepted_operation_denominator]
required_fields = [
  "ORS snapshot revision and completeness disposition",
  "complete bounded set of accepted nonterminal operation identities",
  "operation class and owning reconciliation adapter",
  "request/idempotency identity and canonical request digest",
  "StateFence and EpochId",
  "effect ceiling and introduced capability/lease identities",
  "store mutation certainty and receipt/reconciliation handle",
  "external-effect certainty and receipt/reconciliation handle",
  "cancellation/containment capability state",
]
completeness = "A complete empty denominator is distinct from unavailable, partial, stale or conflicted ORS evidence. No absence or safe-successor claim is permitted without an independently recheckable complete denominator."
bounds = "Overflow returns a typed capacity failure and preserves the exact continuation/cursor; truncation cannot be reported as complete."

[contract.recovery_view]
required_dimensions = [
  "daemon process observation",
  "authenticated transport state",
  "supervision lease state",
  "daemon generation and fence state",
  "daemon-issued authority revocation state",
  "accepted operation denominator completeness",
  "per-operation reconciliation disposition",
  "Store route and semantic-readiness observation",
  "Control Reserve availability required for cancellation/fencing/recovery",
  "Watchdog coverage observation",
  "successor admission blockers",
]
rule = "The Recovery View exposes operational evidence and allowed next actions only. It does not answer task, plan, epistemic, acceptance or finish questions."

[algorithm]
steps = [
  "1. Validate the loss observation against the exact active daemon generation, process identity, transport binding, supervision predecessor, EpochId and StateFence.",
  "2. Atomically close new daemon ingress and freeze issuance of daemon-derived admission/effect leases before publishing a failed/degraded status.",
  "3. Revoke every mechanically enumerable daemon-issued lease and bridge/profile admission bound to the lost generation; preserve exact revocation receipts.",
  "4. Read one coherent ORS denominator of all accepted nonterminal operations affected by the lost generation. Partial or unavailable enumeration blocks automatic successor admission.",
  "5. Classify each operation without semantic reinterpretation. Preserve unknown Store/external effects and route them to exact-operation reconciliation; never blind retry.",
  "6. Keep cancellation, containment, fencing, ORS and minimal health/Recovery View paths available through protected capacity.",
  "7. Publish one revisioned Recovery View bound to the exact loss/revocation/denominator evidence.",
  "8. Admit a successor candidate only after predecessor ingress is closed, stale authority is revoked/fenced, required unknown outcomes have an explicit recovery owner, and Host supplies an exact successor process/generation binding.",
  "9. Require successor eliotd to rebuild semantic mirrors from canonical owners and obtain fresh semantic authority; Kernel never transfers old daemon cache meaning.",
]

[errors]
required = [
  "LOSS_OBSERVATION_STALE",
  "DAEMON_GENERATION_MISMATCH",
  "PROCESS_IDENTITY_CONFLICT",
  "TRANSPORT_BINDING_MISMATCH",
  "EPOCH_LINEAGE_MISMATCH",
  "STATE_FENCE_MISMATCH",
  "SUPERVISION_PREDECESSOR_MISMATCH",
  "AUTHORITY_REVOCATION_INCOMPLETE",
  "ORS_DENOMINATOR_PARTIAL",
  "ORS_DENOMINATOR_UNAVAILABLE",
  "CONTROL_PATH_UNAVAILABLE",
  "UNKNOWN_STORE_OUTCOME",
  "UNKNOWN_EXTERNAL_EFFECT",
  "SUCCESSOR_ADMISSION_BLOCKED",
  "RECOVERY_VIEW_PUBLICATION_UNKNOWN",
]
rule = "A secondary failure while revoking authority, persisting ORS state or publishing the Recovery View remains typed and observable together with the primary daemon-loss disposition."

