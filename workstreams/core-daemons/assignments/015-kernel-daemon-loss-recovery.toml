[work_unit]
cell_id = "kernel.daemon-loss-recovery"
causal_property = "Loss, replacement, or fencing of the active eliotd generation immediately removes daemon-issued admission and effect authority while Kernel preserves every accepted operation identity, cancellation path, reconciliation obligation, and a bounded non-semantic Recovery View."
old_path_discriminator = "Kill or detach the active eliotd generation after Kernel has accepted work but before all effects and store outcomes are terminal. The successor path must not infer safety from process death, lose accepted-operation identity, revive stale daemon authority, or require semantic reads from the unavailable daemon."
integration_owner = "#15 small-Kernel boundary; #14 owns physical daemon process replacement; #18 owns semantic admission; #16 observes supervision; #11 owns the real Windows Product Pulse"
one_writer_rule = "One worker per wave and mutable path claim. Workers return candidates and do not merge their own work."
result = "integration candidate only"

[normative_basis]
architecture = [
  "A2.2",
  "A10.4",
  "A13.1",
  "A13.2",
  "A13.3",
  "ARCH-AUTH-01",
  "ARCH-RES-01",
  "ARCH-RES-04",
  "ARCH-SEC-02",
]
implementation = [
  "I1.2",
  "I1.4",
  "I1.8",
