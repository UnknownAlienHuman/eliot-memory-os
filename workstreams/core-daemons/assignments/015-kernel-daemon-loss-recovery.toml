  "I2.4",
  "I2.5",
  "I5.5",
  "I6.10",
  "I14",
  "I15",
  "I16",
]
reason = "Kernel is the failure-surviving mechanical owner for identity, fencing, ORS, cancellation, generation routing and minimal recovery; eliotd remains the semantic owner and cannot be reconstructed from Kernel caches."

[current_source]
observed_on = "main@317774c7bf50660e49249e7a74ef5fa798234f91"
source_handles = [
  "bins/eliot-kernel/src/lib.rs",
  "bins/eliot-kernel/src/daemon_supervision.rs",
