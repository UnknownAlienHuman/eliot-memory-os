  ".github/workflows/**",
]
non_goals = [
  "implement canonical Epoch migration inside Doctor",
  "change Host last-known-good logic",
  "add generic repair language or scripting",
  "let Doctor resolve Problem/Incident/task",
  "let Doctor verify/promote itself",
  "claim Product/release support from package tests",
]

[proof]
commands = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-doctor-core -p eliot-doctor -p eliot-kernel-service -p eliot-ors --all-targets",
  "cargo test --locked -p eliot-doctor-core -p eliot-doctor -p eliot-kernel-service -p eliot-ors --all-targets",
  "cargo clippy --locked -p eliot-doctor-core -p eliot-doctor -p eliot-kernel-service -p eliot-ors --all-targets -- -D warnings",
  "git diff --check",
]
required_nonzero_tests = true
required_target = "x86_64-pc-windows-msvc for one-shot process/effect edge"
edge_profile = "D2_DOCTOR_ONE_SHOT_REPAIR_RECONCILIATION_EDGE_01"
product_pulse = "Inject one real owner-approved automatic-safe recoverable failure, execute one-shot Doctor through Kernel/ORS, crash after intent/effect boundary, reconcile exact outcome, run independent verifier, apply Governor Problem transition, and prove budget/quarantine behavior."

[stop_conditions]
contract_challenge = [
  "Canonical Epoch/RecoveryLease owner is unavailable and the proposed fix requires another local authority type.",
  "No safe named effect exists for the first edge without inventing a generic shell or widening authority.",
  "The actual verifier owner/contract cannot be identified without creating a second evaluator.",
  "Another active PR claims the same Doctor/Kernel/ORS source wave.",
  "Only in-process fake effect tests are available for a claimed Windows recovery edge.",
]

[integration]
merge_owner = "Doctor/Kernel/Governor recovery integration swarm"
merge_rule = "Wave A may land only if it removes, not multiplies, authority/evidence duplicates. Full #461 closes only after one-shot IPC, durable intent/unknown reconciliation and independent verifier/Governor transition agree on one revision."
result_schema = "issue, dependency_revisions, source_base, changed_paths_by_wave, identity_and_manifest_contract, Kernel_ORS_attempt_records, effect_adapter_and_process_evidence, one_shot_runtime, independent_verifier_and_problem_transition, package_and_windows_edge_proof, residual_unknowns, finish"
