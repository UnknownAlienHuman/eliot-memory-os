[work_unit]
cell_id = "surface.agent-bridge-kernel-host-request-port"
causal_property = "One validated inert host invocation or cancellation is bound by the trusted Kernel to exact principal, Session, WorkScope, task, fence, deadline and operation identity, then returns a result correlated to the original host request without accepting authority from the host."
old_path_discriminator = "Pre-cutover path, superseded by cutover 666526cf: the binary parsed typed Invoke/Cancel and called HostRequestGateway but composed UnavailableKernelHostRequestPort. The original issue inventory also named an internal forward_frame(Frame) contradiction. Current production composes KernelHostRequestClient through kernel_ports_with_declaration; public Request/Cancel has no arbitrary raw Frame variant and there is no internal forward_frame(Frame) passthrough. Typed Kernel protocol Frames remain in use. UnavailableKernelHostRequestPort is #[cfg(test)]-only. The original inventory is historical input, not a current-source claim."
result = "finite implementation allocation for parent #77; no live Edge or Product claim"
osp1_front_door_scope = "Owner decision 2026-09-25: one Claude Code host switches behind a flag from the legacy eliot-governor mcp stdio route to Agent Bridge -> Kernel -> eliotd; other hosts remain on legacy during this step."

[documentation]
architecture_sections = [
  "docs/architecture/A10-01-agent-interaction-loop.md#a101-agent-interaction-loop",
  "docs/architecture/A10-02-impact-and-authority.md#a102-impact-and-authority",
]
