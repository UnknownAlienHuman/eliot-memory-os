[current_source]
bridge_binary = "bins/eliot-agent-bridge/src/main.rs"
host_gateway = "crates/surfaces/eliot-mcp/src/host_gateway.rs"
confirmed_facts = [
  "Issue #104 established the inert host invocation/cancellation contract and #112 established the stateless HostRequestGateway; the bridge adopts those existing contracts instead of duplicating them.",
  "The public Request enum contains Attach, Invoke, Cancel, DryRunInvoke, DryRunCancel, ForwardHook, ForwardEvent, ReactiveAdmit, ReactiveRecordUse, ReactiveRecordUseByHandle, ReactiveRecordDisposition, ReactiveSnapshot, ReconcileExternal, Bootstrap, Reconnect, Detach, Status and Stop.",
  "Raw ForwardFrame is absent from the production request surface and an inline regression test rejects it.",
  "HostInvocationRequest, HostCancellationRequest, HostRequestGateway and KernelHostRequestPort already exist and must be reused.",
  "Since cutover 666526cf the production binary constructs the real shared-transport KernelHostRequestClient via bins/eliot-agent-bridge/src/lib.rs::kernel_ports_with_declaration called from main; UnavailableKernelHostRequestPort in bins/eliot-agent-bridge/src/main.rs is #[cfg(test)]-gated at definition and impl and reaches no production path.",
  "Invoke and Cancel reach the composed real port through main.rs::handle_invocation and main.rs::handle_cancellation; this establishes port composition, not Kernel-owned RequestIdentity or Governor effect dispatch.",
  "Bounded stdin acquisition is a separate source owner under issue #977 and must not be reimplemented here.",
]
open_code_gaps = [
  "Identity/deadline (#77 wave 1): bins/eliot-agent-bridge/src/kernel_host_request_client.rs::build_invocation_envelope derives request_id, idempotency_key and cancellation_id from host correlation_id, derives absolute deadline from host deadline_preference_ms, and sets task_id/work_scope_id to None. bins/eliot-kernel/src/host_request_route.rs::requested_host_request_record copies these values. The host therefore still supplies RequestIdentity inputs; this is not TEST-PHASE.",
  "Governor dispatch (#77 wave 3): crates/kernel/eliot-kernel-service/src/host_request_binding.rs::KernelHostRequestBinder::new has no production construction/caller; bins/eliot-kernel/src/host_request_route.rs::KernelComposition::dispatch_host_request_frame submit arm admits Requested to Admitted without entering dispatch_once or consuming a semantic result. crates/surfaces/eliot-mcp/src/core.rs::NoProviderPort is not a production Governor provider. bins/eliot-agent-bridge/src/kernel_host_request_client.rs::canonical_dispatch_entry routes State, Act, Verify and Coordinate as SubmitAdmitOnly. This shared C4/W6/A3 gap is product wiring, not TEST-PHASE.",
  "Reconnect/status/rehydrate (#77 wave D): bins/eliot-agent-bridge/src/main.rs::handle_reconnect and handle_detach exist, but main.rs::status_response has no Kernel client; kernel_host_request_client.rs::check_kernel_binding returns Ok before a Kernel exchange when replay_cache is empty; rehydrate_operation is called only by the unresolved invoke arm and is not composed after attach/reconnect. ReplayCacheEntry does not retain the exact admission receipt required for a rehydrate pair. These are code gaps, not runtime-proof gaps.",
]
unexecuted_proof = [
  "The real host -> Bridge -> Kernel -> Governor/MCP Edge and Product Pulse are NOT_EXECUTED; source presence and an admitted operation handle cannot substitute for them.",
]

[decomposition]
wave_1_kernel_contract = [
  "Define or adopt one closed Kernel host-request bind/dispatch/cancel operation using existing host DTOs only at the inert boundary.",
  "Kernel derives RequestIdentity, principal, Session, WorkScope, task, authority epoch, StateFence, absolute deadline, idempotency identity and cancellation target from authenticated current state.",
  "Host correlation is data for response routing only and never becomes Kernel authority or operation identity.",
]
wave_2_bridge_adapter = [
  "Retain the production KernelHostRequestPort adapter already composed in Agent Bridge since cutover 666526cf.",
  "Keep UnavailableKernelHostRequestPort test-only; the replacement of its production composition is complete and must not be repeated.",
  "Preserve HostRequestGateway as the sole validation/correlation layer and preserve #977 bounded input when it lands.",
]
wave_3_governor_operation = [
  "Compose a production Governor-backed KernelHostRequestBinder caller and provider, then route each allowed logical operation to its existing Governor/MCP owner; an admission-only handle is not a semantic result, and no second dispatcher or generic JSON command is allowed.",
  "Return typed success, rejection, pending or unknown outcome with exact operation handle and original host correlation.",
]
wave_4_replay_cancel_reconnect = [
  "Bind exact replay to canonical payload digest and operation scope.",
  "Reject same host correlation with changed payload.",
  "Cancel only the exact operation handle owned by the authenticated current Session.",
  "After unknown delivery/submission, reconcile the same operation before any retry.",
  "Keep the existing Reconnect and Detach handlers, but require an owner-issued live Kernel binding result even before the first invocation; an empty replay cache cannot prove currency.",
  "Compose status and exact-pair rehydration against Kernel-owned state; do not synthesize a receipt or infer durable Session continuity from process identity alone.",
]
wave_5_edge = [
  "Execute one real host -> Bridge -> Kernel -> Governor/MCP operation -> correlated response path.",
  "Execute its exact cancellation and reconnect/reconciliation cases.",
  "Record readiness only after the real operation probe succeeds.",
]

[worker_allocations]
contract_owner = [
  "Parent #77 wave 1 owns bins/eliot-kernel/src/host_request_route.rs host-request admission, Kernel-derived identity and deadline; serialize any shared edit with wave 3.",
  "Parent #77 wave 1 owns crates/kernel/eliot-kernel-service/src/host_request_binding.rs contract span; no #342 Rust writer is allocated.",
]
bridge_owner = [
  "Parent #77 bridge worker owns bins/eliot-agent-bridge/src/kernel_host_request_client.rs identity, replay and binding-check spans.",
  "Parent #77 bridge worker owns bins/eliot-agent-bridge/src/main.rs Status, Reconnect and exact rehydrate composition spans; one bridge worker writes each file.",
]
governor_owner = [
  "Parent #77 wave 3 Governor worker owns crates/surfaces/eliot-mcp/src/core.rs interface/adapter span only after reverse-consumer inspection; production provider ownership is resolved before this worker edits.",
]
serialized_paths = [
  "Issue #342 writes only this handoff TOML; parent #77 owns all Rust implementation paths above, with one writer per file.",
  "Any file shared with issue #977 must wait for its accepted input-profile/parser turn and rerun that boundary suite.",
  "Kernel identity and Governor contract/provider changes land before the Bridge adapter consumes them; host correlation remains response data only.",
]
forbidden = [
  "public raw Frame request/cancel ingress",
  "host-supplied RequestIdentity, principal, Session, task, fence, lease or effect ceiling",
  "generic JSON or shell dispatch",
  "Bridge-owned durable retry ledger",
  "process identity treated as durable Session identity",
  "new unbounded stdin parser",
]

[acceptance]
criteria = [
  "One typed host invocation reaches one real admitted Kernel/Governor operation and returns the same host correlation.",
  "One cancellation reaches only the exact current operation handle and cannot redirect to another request.",
  "No host field can supply or widen principal, Session, task, WorkScope, epoch, fence, deadline, effect ceiling, completion or proof.",
  "Same correlation with changed canonical payload is rejected; exact replay follows the owner idempotency contract without duplicate effect.",
  "Wrong or stale connection, Session, fence, generation and cancellation target return typed recovery guidance.",
  "Unknown outcome is reconciled by exact operation identity before retry.",
  "Raw ForwardFrame remains absent from all production host request/cancel paths while durable EventEnvelope forwarding remains intact.",
  "The production binary no longer constructs UnavailableKernelHostRequestPort after all required contracts and adapters exist.",
  "Forwarding readiness is not advertised until an actual operation probe succeeds.",
  "Parser-only, mock-port or source-construction tests cannot close parent #77 or Product issue #11.",
]

[verification]
commands = [
  "taplo check workstreams/core-daemons/assignments/077-agent-bridge-host-request-port.toml",
