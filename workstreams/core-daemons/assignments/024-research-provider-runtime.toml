composition = "bins/eliot-mod-research/src/lib.rs@4769db814b4d45151bf6fea2abed9c9860980dc5"
discriminator = "The production binary always emits KERNEL_ADMISSION_REQUIRED and exits 78. The library's only concrete bridge reads ELIOT_RESEARCH_BRIDGE from ambient environment, launches that path through std::process::Command, discards stderr, has no deadline/cancellation/Job Object/resource/credential/fence manifest, and treats exit success plus a provider-local job_id as the complete process result."
reusable_source = [
  "eliot-research-exchange already owns typed exchange job lifecycle and candidate-only results.",
  "eliot-research-exchange-api already owns ResearchQueryRequest.",
  "eliot-researcher already separates Researcher inquiry ownership from the physical ResearchBridge.",
  "ProcessResearchBridge is a replaceable adapter and should not be promoted as-is.",
]

[causal_property]
statement = "One admitted bounded research-provider operation runs through the shared governed process contour, preserves exact route/source/coverage/raw evidence and effect outcome, and returns candidate material without gaining synthesis, canonical, authority, policy or Finish ownership."

[scope]
