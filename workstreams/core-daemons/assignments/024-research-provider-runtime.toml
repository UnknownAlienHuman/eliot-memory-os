  "authenticated Kernel provider admission",
  "immutable BridgeContract/provider generation",
  "shared ProcessExecutor",
  "raw stdout/stderr/evidence sink",
  "credential/privacy/budget/deadline/cancellation envelope",
  "exact-operation replay and reconciliation",
]
forbidden_ownership = [
  "Dreamer synthesis or truth promotion",
  "canonical write or memory admission",
  "task scheduling or Finish",
  "generic shell/arbitrary caller executable",
  "hidden paid/network/privacy fallback",
]

[what_to_do]
steps = [
  "Replace environment-selected direct Command execution with a registered immutable provider bridge and shared ProcessExecutor.",
  "Replace the unconditional binary exit with authenticated one-shot or bounded provider request handling.",
  "Bind every operation to artifact/config/protocol/provider/route/privacy/budget/deadline/cancellation/fence and generation identity.",
  "Preserve raw stdout, stderr, process lineage and provider outcome as immutable evidence or omission handles.",
  "Implement exact cancellation, timeout, crash and unknown-outcome reconciliation without blind retry.",
]

[how_to_do]
steps = [
  "Kernel/Governor resolves the provider generation and supplies a closed BridgeContract; no executable path comes from task text, stdin or ambient environment.",
  "Use the shared Windows ProcessExecutor and Job Object contour for start, streams, limits, cancellation and descendant cleanup.",
  "Use a typed versioned EBP/provider protocol. Provider-local job_id remains subordinate to the canonical operation identity.",
  "Persist operation intent before provider execution and preserve exact raw output/evidence lineage before parsing or reduction.",
  "Bind source portfolio and coverage denominator to the request; unavailable providers narrow coverage and return a typed gap rather than fabricated empty results.",
  "Keep returned material candidate-only until normal Governor admission; a successful provider exit does not prove correctness, completeness or support.",
  "On disconnect/timeout after possible execution, reconcile the same operation/provider identity before any retry.",
]

[acceptance]
criteria = [
  "No production path launches a research executable solely from ELIOT_RESEARCH_BRIDGE or a caller-supplied path.",
  "The production binary executes a valid authenticated provider request instead of always exiting 78.",
  "Artifact, provider, route, protocol, privacy, budget, deadline, cancellation, epoch/fence and operation identities remain exact end-to-end.",
  "stdout, stderr, exit and process lineage are retained or represented by immutable omission handles; stderr is never silently discarded.",
  "Timeout/cancel/crash leaves no descendant and returns a terminal or exact unknown/reconciliation state.",
  "Exact replay is idempotent; changed same-identity payload conflicts.",
  "Unavailable provider yields RESEARCH_SOURCE_UNAVAILABLE/coverage gap, not fabricated no-match or semantic failure.",
  "Coverage completeness is impossible without an exact denominator and actual source dispositions.",
  "Provider output remains candidate-only and cannot write canonical state, promote truth, issue authority or Finish.",
  "Provider failure degrades only the dependent acquisition path.",
]

[verification]
commands = [
  "cargo fmt --all -- --check",
  "cargo check --locked -p eliot-research-exchange-api -p eliot-research-exchange -p eliot-researcher -p eliot-mod-research --all-targets",
  "cargo test --locked -p eliot-research-exchange-api -p eliot-research-exchange -p eliot-researcher -p eliot-mod-research --all-targets",
  "cargo clippy --locked -p eliot-research-exchange-api -p eliot-research-exchange -p eliot-researcher -p eliot-mod-research --all-targets -- -D warnings",
  "git diff --check",
]
edge_proof = "Run one real approved provider, one unavailable provider, cancellation, timeout, stderr failure and unknown-outcome reconciliation through authenticated Kernel admission."

