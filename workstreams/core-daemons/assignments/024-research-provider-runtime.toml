[confirmed_gap]
main = "bins/eliot-mod-research/src/main.rs@37d9b3cbdb1c97201f766892f11d45505e111d0d"
composition = "bins/eliot-mod-research/src/lib.rs@37d9b3cbdb1c97201f766892f11d45505e111d0d"
discriminator = "Before this work unit the production binary always emitted KERNEL_ADMISSION_REQUIRED and exited 78, and the Kernel had no research-provider route: no authenticated owner event built or sent a dispatch, and no daemon-side submit/cancel/status/reconcile caller existed. The ambient ELIOT_RESEARCH_BRIDGE plus std::process::Command path had already been removed by #87, so the residue was missing reachability, not a live bypass."
reusable_source = [
  "eliot-research-exchange already owns typed exchange job lifecycle and candidate-only results.",
  "eliot-research-exchange-api already owns ResearchQueryRequest.",
  "eliot-researcher already separates Researcher inquiry ownership from the physical ResearchBridge.",
  "eliot-kernel-service::protocol::research_provider now owns the research dispatch wire contract, mirroring the existing provider_capability ownership pattern.",
  "bins/eliot-doctor/src/dispatched_material.rs is the established precedent for delivering per-operation admitted material to a one-shot bin without argv, stdin, or environment.",
  "eliot-process-executor::WindowsProcessExecutor remains the single governed Windows process contour; this unit adds no process launch of its own.",
]

[causal_property]
statement = "One admitted bounded research-provider operation runs through the shared governed process contour, preserves exact route/source/coverage/raw evidence and effect outcome, and returns candidate material without gaining synthesis, canonical, authority, policy or Finish ownership."

[scope]
primary_paths = [
  "bins/eliot-mod-research/src/**",
  "bins/eliot-kernel/src/research_provider_route.rs",
  "crates/kernel/eliot-kernel-service/src/protocol/research_provider.rs",
  "focused package and process-edge tests",
]
required_edges = [
  "authenticated Kernel research dispatch route (live authority epoch plus session module-generation State Fence)",
  "admitted immutable BridgeContract/provider generation bound to executable path, content digest, config and protocol digests",
  "shared ProcessExecutor with Job Object, limits, descendant cleanup and no-orphan semantics",
  "raw stdout/stderr/exit/lineage evidence sink plus I7.23 transport hash and redaction receipt",
  "credential/privacy/budget/deadline/cancellation envelope",
  "exact-operation replay and reconciliation by stable operation identity",
]
forbidden_ownership = [
  "Dreamer synthesis or truth promotion",
  "canonical write or memory admission",
  "task scheduling or Finish",
  "generic shell/arbitrary caller executable",
  "hidden paid/network/privacy fallback",
  "durable research Job/Attempt or coverage-denominator state (owned by #15/#18)",
]

[what_to_do]
steps = [
  "DONE: the Kernel owns the research dispatch wire contract and admits a dispatch against the live authority epoch and the session module-generation State Fence on every call.",
  "DONE: the one-shot binary reads its bounded admitted material from the executable directory (loader image path, never argv/stdin/environment), re-proves it against the live authority, and dispatches through the authenticated Kernel front door.",
  "DONE: the launch material is minted only from the admitted manifest through the shared governed Windows ProcessExecutor; no production path resolves an executable from an environment string or a caller-supplied path.",
  "DONE: stdout/stderr/exit/lineage are retained as immutable evidence with explicit omission handles, and the cancellation receipt is retained on deadline overrun.",
  "DONE: the submit is delivered as a bounded projection inside the admitted ProcessIntent argv (sealed by the dispatch permit through effect_digest); the full canonical envelope is retained as the exact reconciliation record.",
  "DONE: the terminal ProviderExecutionReceipt binds deadline, cancellation, process-tree cleanup, raw evidence, route, usage, privacy and provider outcome, and marks the result candidate-only.",
  "OPEN: durable research Job/Attempt and source-portfolio/coverage-denominator state, and the answerable status/cancel/reconcile control path, require ORS research rows that #15/#18 own and that do not exist on current main.",
  "OPEN: live edge proof for one real provider, one unavailable provider, cancellation, timeout, stderr failure and unknown-outcome reconciliation.",
]

[how_to_do]
steps = [
  "SATISFIED: the Kernel re-queries live authority on every call and never caches a verdict; the bin re-verifies every reply against its own dispatch before it may become an admission.",
  "SATISFIED: the shared Windows ProcessExecutor and Job Object contour own start, streams, limits, cancellation and descendant cleanup.",
  "SATISFIED: the provider wire protocol is typed and versioned; the provider-local job_id stays subordinate to the admitted operation identity.",
  "SATISFIED: the submit envelope is sealed and retained before the executor is contacted, and raw output/evidence lineage is preserved before any reduction.",
  "SATISFIED: the frozen inquiry and its exact coverage denominator digest are bound into the admission and re-checked on every request binding.",
  "SATISFIED: returned material stays candidate-only; a successful provider exit proves nothing about correctness, completeness or support.",
  "SATISFIED: a timeout or an unproven delivery leaves the outcome explicit and reconcile-gated by the stable operation identity, never a blind retry.",
]

[acceptance]
criteria = [
  "MET: no production path launches a research executable from ELIOT_RESEARCH_BRIDGE, an environment string, or a caller-supplied path.",
  "MET (source): the production binary executes one authenticated, reply-verified provider request instead of always exiting 78; it still exits 78 for the one honest no-admission case (front door unreachable, no admitted material, or an unverified reply).",
  "MET: artifact, provider, route, protocol, privacy, budget, deadline, cancellation, epoch/fence and operation identities remain exact end to end.",
  "MET: stdout, stderr, exit and process lineage are retained or represented by immutable omission handles; stderr is never silently discarded.",
  "MET (source): timeout/cancel/crash returns a terminal or an exact unknown/reconciliation state, and the cancellation receipt is retained rather than discarded.",
  "MET (source): the same logical operation is keyed by one stable identity, so a retry resolves to the same submission rather than a second one.",
  "MET: an unavailable provider yields RESEARCH_SOURCE_UNAVAILABLE with an exact reason code, not a fabricated no-match or semantic failure.",
  "MET: an admitted acquisition cannot run without the exact coverage denominator digest, and a request whose coverage goal differs from the admitted one is refused.",
  "MET: provider output remains candidate-only and cannot write canonical state, promote truth, issue authority or Finish.",
  "MET: provider failure degrades only the dependent acquisition path and exits with a distinct code, never the admission-required code.",
]

