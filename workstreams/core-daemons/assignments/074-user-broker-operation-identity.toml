[work_unit]
cell_id = "user-broker.per-operation-request-identity"
causal_property = "The protected User Broker launch declaration authenticates one stable caller/launch binding, while every register, heartbeat revision, launch authorization and fence/logoff call uses its own exact request, idempotency, deadline and cancellation identity."
old_path_discriminator = "BrokerLaunchConfig stores one full RequestIdentity. BrokerComposition::self_register installs it once through KernelClient::set_request_identity, after which register, every heartbeat, authorize-launch and fence reuse the same request metadata, idempotency key, absolute deadline and cancellation ID."
integration_owner = "parent #74 with User Broker integration #23, Kernel front door/ORS #15, and #11 Product Pulse"
one_writer_rule = "Protected config migration, shared identity contract, Kernel validation, broker consumption and real process edge are separate writers."
result = "integration candidate only"

[normative_basis]
architecture = ["ARCH-AUTH-01", "ARCH-LIFE-01", "ARCH-SEC-02", "ARCH-MOD-03", "ARCH-RES-04"]
implementation = ["I1.3", "I1.8", "I3.4", "I5.27", "I6.10", "I7.2", "I7.3", "I7.14", "I14"]
reason = "A static installation/SID/session/artifact binding is not an operation. Request, cancellation, deadline and idempotency identity are exact per transition and preserve lineage without collapsing authority or effects."

[current_source]
observed_on = "main@73a7a8b6fcc2d292fe61d0eeb94fcae4217087e9"
source_handles = [
  "bins/eliot-user-broker/src/protected_launch_config.rs",
  "bins/eliot-user-broker/src/lib.rs",
  "bins/eliot-user-broker/src/kernel_authority_port.rs",
