  "crates/kernel/eliot-ors/src/store.rs",
  "crates/kernel/eliot-user-broker-core/src/lib.rs",
]
confirmed_gap = [
  "BrokerLaunchConfig contains RegistrationRequest, one full RequestIdentity, and operator artifact configuration.",
  "protected launch validation validates the full RequestIdentity as if it were durable launch configuration.",
  "BrokerComposition::self_register clones the launch RequestIdentity and installs it once through set_request_identity.",
  "heartbeat, launch authorization and close/logoff do not install a new identity before their Kernel call.",
  "KernelAuthorityPort::kernel_call invokes KernelClient::transact_json with only operation and payload, so the mutable client identity is ambient state.",
  "launch first performs heartbeat, then authorize-launch, while the resulting ProcessIntent/ProcessRequest has another operation identity; current lineage does not make all three identities explicit.",
  "An absolute deadline stored in launch.json eventually becomes stale without invalidating the underlying installation/SID/session/artifact binding.",
]

[stable_launch_binding]
type = "BrokerLaunchBinding"
schema_revision = "eliot.user-broker.launch-binding.v2"
required_fields = [
  "installation identity",
  "authorized Windows SID",
  "interactive Windows session identity",
  "broker artifact digest and immutable generation",
  "broker launch nonce/challenge and protected config identity",
  "initial Kernel endpoint/connection challenge material that is not an operation request identity",
  "registration policy/config/authority-root references",
  "operator artifact identity and permitted execution class",
  "binding creation/expiry or invalidation conditions appropriate to the launch generation",
]
forbidden_fields = [
  "RequestIdentity",
  "request_id",
  "idempotency_key",
  "cancellation_id",
  "absolute per-operation deadline",
  "operation payload hash",
  "heartbeat revision",
  "launch authorization identity",
  "fence/logoff identity",
]
rules = [
  "The binding authenticates who/what may begin registration; it does not authorize every future operation.",
  "Expiry of one operation identity never invalidates the stable binding by itself.",
  "SID/session/artifact/nonce checks remain fail-closed on every restart.",
  "Broker restart reuses only a current stable binding and creates a new registration operation.",
  "The protected file never becomes an ambient replay ledger.",
]

[operation_identity_contract]
types = [
  "BrokerOperationKind",
  "BrokerOperationIdentityInput",
  "BrokerOperationIdentity",
  "BrokerOperationLineage",
  "BrokerOperationIdentityError",
]
operation_kinds = [
  "REGISTER",
  "HEARTBEAT_RENEWAL",
  "AUTHORIZE_LAUNCH",
  "FENCE_LOGOFF",
]
shared_builder_rule = "Use one provider-neutral identity builder/issuer contract in an existing protocol/Kernel client boundary. Do not format request, idempotency or cancellation IDs independently inside User Broker."
required_fields = [
  "contract revision and operation-kind domain separator",
  "stable BrokerLaunchBinding digest",
  "current registration ID/digest and UserBrokerEpoch when applicable",
  "exact canonical operation payload digest",
  "current RequestMetadata and StateFence",
  "lineaged EpochId after #64 migration",
  "fresh request_id",
  "operation-specific idempotency identity",
  "operation-specific cancellation_id",
  "bounded deadline selected from the current operation/deadline policy",
  "parent/causal operation references",
  "attempt or revision ordinal when the operation contract owns one",
]
must_not_include = [
  "provider secrets",
  "raw process handles",
  "mutable client-global ambient identity",
  "display labels as identity",
  "scalar epoch compatibility invented in the broker",
  "one universal deadline or idempotency key for the broker process",
]

[operation_rules.register]
identity = "One registration attempt has one exact operation identity derived from the stable binding and exact RegistrationRequest bytes."
replay = "Exact retry of the same registration bytes returns the same RegistrationGrant/Receipt; changed registration bytes under the same idempotency key are IDENTITY_CONFLICT."
restart = "A new broker process/generation creates a new registration operation even when the stable installation binding remains current."
must_not = "A historical protected RequestIdentity cannot be revived as the new registration request."

[operation_rules.heartbeat]
identity = "Each logical lease-renewal revision has its own operation/request/cancellation identity."
replay = "Retry of the exact same registration predecessor, observed_at/cursor revision and payload reuses that revision identity and resolves the same result."
next_revision = "The next heartbeat renewal is a new operation identity even when it renews the same registration."
deadline = "A heartbeat deadline is bounded from the current clock/policy and is not inherited from launch.json."
race = "A heartbeat that races fence/logoff resolves against the exact registration/epoch predecessor and cannot reopen a fenced registration."

[operation_rules.authorize_launch]
identity = "Each LaunchRequest has its own caller request identity and canonical payload hash."
lineage = [
  "user/broker LaunchRequest identity",
  "Kernel authorize-launch operation identity",
  "LaunchGrant identity",
  "P-03 ProcessIntent/ProcessRequest operation and effect identity",
  "ProcessStart/unknown/cancellation/reconciliation receipts",
]
rules = [
  "These identities are linked but never collapsed into one idempotency key.",
  "Repeating the same LaunchRequest authorization is exact replay only while registration, epoch, fence and payload remain identical.",
  "A new launch, changed argv/environment/resource limit, or changed registration state is a new operation or an identity conflict.",
  "Unknown process outcome is reconciled through the process operation identity and is not retried through the authorization request identity.",
]

[operation_rules.fence]
identity = "Fence/logoff has a distinct operation identity bound to the exact registration, UserBrokerEpoch, reason and terminal target state."
replay = "Exact repeat returns the same fence receipt; it cannot duplicate logoff or advance a second terminal transition."
rules = [
  "Fence cannot reuse an expired register or heartbeat RequestIdentity.",
  "Fence is permitted through its protected/control capacity even when ordinary launch authorization is unavailable, subject to #65.",
  "A stale heartbeat cannot reopen a successfully fenced registration.",
  "Unknown fence outcome is read back/reconciled before retry with the same identity.",
]

[builder_and_kernel_validation]
rules = [
  "The exact builder/issuer ownership is fixed before code: either Kernel issues/reserves an identity or a shared deterministic builder constructs it from Kernel-admitted policy; the broker never invents a private wire convention.",
  "Kernel validates operation kind, payload digest, registration/epoch/fence, deadline, cancellation and idempotency identity together.",
  "Cross-operation reuse of request_id, cancellation_id or idempotency identity is rejected.",
  "Same idempotency key with different canonical bytes or operation kind is IDENTITY_CONFLICT and performs no state/effect transition.",
  "An expired operation identity remains historical evidence; it does not invalidate the stable launch binding or authorize another operation.",
  "KernelClient APIs accept an explicit identity per transaction or an operation-bound closure; a mutable client-global identity must not be the production ownership model.",
  "Identity creation grants no semantic or process authority; existing Capability/registration/lease checks still decide admission.",
]

[durable_replay_state]
owner = "Kernel ORS and the existing User Broker durable registration snapshot each retain only the replay/cursor state they already own"
rules = [
  "Protected launch config stores no operation replay ledger.",
  "BrokerSnapshot operation cursors identify exact broker operations without copying Kernel authority state.",
  "Kernel/ORS owns request/idempotency conflict and terminal receipt reconciliation for Kernel operations.",
  "User Broker owns its durable registration/process lifecycle projection and references Kernel operation receipts by identity.",
  "Restore imports operation state as suspended/history and never reactivates an old RequestIdentity.",
]

[migration]
from_schema = "current launch configuration containing request_identity"
to_schema = "BrokerLaunchBinding v2 without per-operation request fields"
required_steps = [
  "read and validate the old protected object under its retained path lease",
  "classify old RequestIdentity as compatibility-only historical operation evidence",
  "extract only fields independently justified as stable launch binding",
  "obtain or regenerate missing stable challenge/policy fields through the authorized installer/Kernel path",
  "write a new immutable protected binding revision atomically",
  "retain a migration receipt and old digest without retaining expired operation authority",
  "restart/register using a new operation identity and verify SID/session/artifact/nonce",
]
forbidden = [
  "silently deserialize v1 as v2",
  "copy old request_id/idempotency/deadline/cancellation into v2",
  "extend the old deadline",
  "rewrite launch.json periodically to simulate per-operation identity",
  "accept an unversioned partial file after crash",
]
rollback = "Before cutover, keep the exact old protected file and current running registration. After cutover, rollback requires an explicit compatible v1 reader only for extraction/recovery, never resurrection of the historical RequestIdentity."

