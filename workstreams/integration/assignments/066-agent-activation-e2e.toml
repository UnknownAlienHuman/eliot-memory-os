schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_INTEGRATION_ALLOCATION"
status = "READY_AFTER_COMPONENT_SLICES"
implementation_support = "V2_CONTRACT_AND_PARTIAL_SLICES_PRESENT_END_TO_END_EDGE_OPEN"
evidence_execution_status = "ISSUE_AND_SOURCE_ROUTING_INSPECTED_TESTS_NOT_EXECUTED"
proof_ceiling = "AGENT_ACTIVATION_ONBOARDING_EDGE_CANDIDATE_ONLY"
issue = 66
related_issue_refs = [77, 977, 1095, 839, 1105, 15, 18]
parent_product_issue = 11
normative_pair_ref = "docs/normative-pair.toml"

[work_unit]
cell_id = "integration.agent-activation-and-onboarding"
causal_property = "One bounded host activation request creates one Kernel ticket, one Governor semantic read, one exact typed result and one immediate bridge/user disposition; exact replay causes no second semantic read, changed meaning conflicts, and possible submission is reconciled before retry."
current_discriminator = "Agent Bridge input, Kernel host port, Kernel result receiver and daemon v2 producer are split across #977, #77, #1095 and #839; no accepted integration proof yet shows all seven outcomes, exact replay, restart and no timeout/reclaim loop across the complete Operator-to-Governor path."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/66"

[documentation]
architecture = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A10-01-agent-interaction-loop.md#a101-agent-interaction-loop",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A12-02-principal-session-and-visibility.md#a122-principal-session-and-visibility",
]
implementation = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I01-11-startup-algorithm.md#i111-startup-algorithm",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I07-01-eliot-bridge-protocol-ebp1.md#i71-eliot-bridge-protocol-ebp1",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I07-02-frame.md#i72-frame",
