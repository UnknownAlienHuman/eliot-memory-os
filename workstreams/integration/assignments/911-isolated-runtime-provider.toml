[[waves]]
id = "A"
what = "Implement #907's closed Runtime provider and deterministic topology plan."
how = [
  "Validate exact runtime requirement classes, target and provider revision from #905.",
  "Plan derives only the requested component dependency graph and exact Store/Git receipt dependencies without mutation.",
  "Allocate unique run-owned installation, Session, config, data, log, temp, artifact, pipe namespace and containment identities.",
]

[[waves]]
id = "B"
what = "Verify artifacts and start contained foreground processes."
how = [
  "Require one accepted same-source build/artifact receipt and verify every component digest, PE architecture, target and profile before launch.",
  "Construct all commands and minimal environment internally; caller/inventory/workflow cannot supply executable, service, pipe, ACL or environment authority.",
  "Enter the exact run-owned Job Object or accepted race-free containment before descendants can escape and bind image/start/containment identity rather than PID alone.",
]

[[waves]]
id = "C"
what = "Prove authenticated component and whole-topology readiness."
how = [
  "Keep artifact accepted, launch registered/requested, contained process observed, authenticated peer connected, generation/fence accepted, subsystem ready and whole selected topology ready as separate receipts.",
  "Obtain authoritative generation, epoch and StateFence from the actual current owner handshake; never mint them in the provider.",
  "Bind each readiness record to run/component/artifact/process/principal/Session/endpoint/generation/fence/expiry/dependency identities.",
  "For ELIOT_GOVERNOR_CONFIG rows, generate the exact versioned run-local config and bind path/digest; ambient or production config is forbidden.",
]

[[waves]]
id = "D"
what = "Close reset, evidence, shutdown and cleanup/reconciliation."
how = [
  "Reset only through documented owner APIs with exact receipts; unknown state change blocks replacement/reuse.",
  "Collect bounded redacted component evidence with explicit truncation.",
  "Stop in reverse dependency order through owner shutdown, then terminate only the exact owned process tree if allowed.",
  "Verify descendants, Job Objects, pipes, mutexes, ports, handles, locks and roots; repeated cleanup is idempotent.",
  "Implement exactly WORK_UNIT_CASE: 911/1..29 through #907's fixed bridge under #850 containment, plus real Windows execution for every accepted required runtime class.",
]

[acceptance]
criteria = [
  "Unknown class/component/target/revision is rejected and no unrequested component launches.",
  "Plan is deterministic and creates no process, pipe, ACL or root.",
  "All artifacts bind one accepted source/build and exact digest/PE target/profile; stale, mixed-source, missing or substituted artifacts fail before launch.",
  "Caller-supplied command, executable, service, pipe, ACL and environment authority are unrepresentable.",
  "Concurrent runs share no installation, Session, root, pipe namespace or containment identity.",
  "Path/reparse/symlink/reserved-name and foreign-owner collisions fail closed.",
  "Store/Git receipts cannot be fabricated or locally mutated.",
  "Launch registration/containment precedes runnable execution; observed process is not authenticated readiness.",
  "Peer substitution and stale/foreign/expired generation/fence receipts are rejected.",
  "Whole-topology readiness accounts for every selected component and exact dependency denominator.",
  "Crash/readiness timeout blocks dependent groups; unknown launch/state change requires reconciliation before replacement.",
  "Reset cannot delete live/foreign state and contamination remains explicit.",
  "Shutdown is reverse dependency order and parent exit does not prove descendant/IPC/resource cleanup.",
  "Forced stop targets only exact owned tree; PID reuse, foreign endpoints and foreign roots survive.",
  "ELIOT_GOVERNOR_CONFIG comes only from the exact provider receipt; Runtime and Store ownership remain separate.",
  "Exactly 29 substantive cases execute and every accepted Runtime class completes one real same-source Windows ready→cleanup cycle.",
]

