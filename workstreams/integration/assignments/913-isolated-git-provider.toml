  "Plan is deterministic and creates no repository, config, ref or worktree.",
  "Arbitrary subcommand, executable, shell, config, hook, URL, refspec and argv are unrepresentable.",
  "The repository root is canonical, owner-marked and below the exact run root; source checkout and other runs are unchanged.",
  "Path/reparse/symlink/nested foreign repository/owner-marker escape fails before mutation.",
  "Initial branch, object format, fixture bytes, author/committer and timestamps are deterministic and load-bearing.",
  "Global/system/user config, HOME and credential helpers remain untouched and unread as payload.",
  "Readiness verifies exact object/tree/commit/ref/registered/materialized worktree identities beyond exit status.",
  "Foreign/preexisting refs and worktrees are rejected without adoption.",
  "Lost mutation response is reconciled before retry; exact replay is idempotent and changed profile/config conflicts.",
  "Reset restores only the declared owned baseline; unexpected dirty/foreign state blocks destructive cleanup.",
  "Evidence is bounded/redacted and retains identities without secret/config/content/private-path canaries.",
  "Cleanup removes only exact owned topology, verifies locks/registrations/roots and preserves foreign state.",
  "Exactly 22 substantive cases execute through #907/#850 and one real local fixture smoke proves source checkout/ref/config non-mutation.",
