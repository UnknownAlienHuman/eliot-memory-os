  "Validate exact Git requirement/class, provider revision and fixture profile from #905.",
  "Plan derives one canonical owner-marked run-local repository or declared bare-plus-worktree topology without mutation.",
  "Resolve the approved Git executable/version through repository policy; caller executable is forbidden.",
]

[[waves]]
id = "B"
what = "Create a deterministic isolated repository without ambient Git authority."
how = [
  "Use a closed fixed command set with shell disabled and a minimal environment.",
  "Disable global/system/user config inheritance, aliases, hooks, templates, filters, signing, credential helpers and protocol/network paths through command/fixture-local settings only.",
  "Freeze object format, initial branch, fixture bytes, author/committer identities and deterministic timestamps internally.",
  "Reject path/reparse/symlink escape, nested foreign repository and owner-marker mismatch.",
]

[[waves]]
id = "C"
what = "Verify exact objects, refs, worktrees, replay and reset."
how = [
  "Independently verify object/tree/commit/ref identities and both registered and materialized worktree paths; init/status exit alone is not readiness.",
  "Bind run/provider/tool/config/fixture/source/test-group/repository/operation identity to every receipt.",
  "Exact operation replay creates no duplicate commit/ref/worktree; changed fixture/config under one identity conflicts.",
  "Lost mutation response requires exact object/ref reconciliation before retry.",
  "Reset only the declared owned disposable baseline; unexpected dirty/foreign state is preserved as contamination/reconciliation evidence.",
]

[[waves]]
id = "D"
what = "Close evidence and exact-owned cleanup."
how = [
  "Collect bounded redacted status/ref/worktree identities, never raw config/content/credentials/private paths.",
  "Before cleanup, verify owner marker, topology, allowed disposition, registrations, locks and roots.",
  "Remove only exact owned refs/worktrees/repository; repeated cleanup is idempotent and foreign state survives.",
  "Implement exactly WORK_UNIT_CASE: 913/1..22 through #907's fixed bridge under #850 containment, plus one mandatory real fixture prepare-ready-reset-cleanup smoke.",
]

