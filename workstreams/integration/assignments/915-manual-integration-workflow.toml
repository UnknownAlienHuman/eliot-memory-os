[work_unit]
cell_id = "integration.manual-windows-workflow"
causal_property = "One explicitly dispatched workflow executes one admitted source and finite isolated integration profile through the accepted inventory, harness and required providers; missing tests, providers, artifacts, cleanup or evidence cannot become green."
current_discriminator = ".github/workflows/integration.yml is absent on main; the previous #928 PR was closed unmerged, while .github/README.md requires every repository workflow to remain workflow_dispatch-only."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/915"

[documentation]
repository = ["https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/.github/README.md#workflows"]
implementation = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I18-32-stateful-test-environments.md#i1832-stateful-test-environments",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/I18-04-test-tiers.md#i184-test-tiers",
