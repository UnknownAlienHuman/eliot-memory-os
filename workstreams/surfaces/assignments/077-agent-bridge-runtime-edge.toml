[work_unit]
cell_id = "surface.agent-bridge-complete-runtime-edge"
causal_property = "One admitted Agent Bridge process accepts only bounded versioned host requests from the exact user/agent peer, dispatches each valid request to exactly one closed operation through the authenticated Kernel port, preserves ordered bounded responses and exact cancel/reconcile state, and cannot become a Session, semantic, authority, provider, canonical, or Finish owner."
current_discriminator = "Agent Bridge has an inert host contract and request handlers, while #977 and #342 separately own bounded ingress and the real Kernel port. No accepted parent edge proves all declared host operations, output backpressure, peer/session binding, cancellation, reconnect, process replacement, and installed attach behavior together."
