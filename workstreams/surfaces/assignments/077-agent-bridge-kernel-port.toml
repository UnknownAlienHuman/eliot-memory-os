schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_IMPLEMENTATION_ALLOCATION"
routing_authority = "owning_issue_and_normative_pair_only"
status = "READY_AFTER_P04_CONTRACT"
implementation_support = "TYPED_LOCAL_DISPATCH_PRESENT_PRODUCTION_KERNEL_PORT_UNAVAILABLE"
evidence_execution_status = "CURRENT_BINARY_REQUEST_SURFACE_AND_PORT_COMPOSITION_INSPECTED_TESTS_NOT_EXECUTED"
proof_ceiling = "AGENT_BRIDGE_EXECUTABLE_EDGE_CANDIDATE_ONLY"
issue = 77
kernel_p04_issue = 342
bounded_input_issue = 977
activation_parent_issue = 66
activation_receiver_issue = 1095
activation_producer_issue = 839
