normative_pair_ref = "docs/normative-pair.toml"

[work_unit]
cell_id = "surface.agent-bridge-executable-and-kernel-port"
causal_property = "One bounded versioned host request received by the Agent Bridge is validated as inert untrusted input, bound to the exact bridge process/connection and forwarded once through the authenticated Kernel P-04 client; the bridge preserves request/result/cancellation/reconciliation identity and cannot allocate Session/task authority, interpret domain semantics, access Store credentials or decide completion."
current_discriminator = "The Agent Bridge binary has a typed request surface and local dispatch abstraction, but production still uses an unavailable KernelHostRequestPort. No real authenticated Kernel client carries invocation, cancellation, status, reconciliation and activation results through the executable path. Bounded stdin acquisition remains separately owned by #977."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/77"

[documentation]
architecture = [
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A10-01-agent-interaction-loop.md#a101-agent-interaction-loop",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A12-02-principal-session-and-visibility.md#a122-principal-session-and-visibility",
  "https://github.com/UnknownAlienHuman/eliot-memory-os/blob/main/docs/architecture/A13-02-kernel-and-failure-domains.md#a132-kernel-and-failure-domains",
]
implementation = [
