schema = "eliot.agent-work-unit.v1"
authority = "NON_NORMATIVE_IMPLEMENTATION_ALLOCATION"
routing_authority = "owning_issue_and_normative_pair_only"
status = "BLOCKED_ON_728_AND_754_READY_FOR_SITE_INVENTORY"
implementation_support = "UNSAFE_BOUNDARY_PRESENT_COMPLETE_FAMILY_PROOF_ABSENT"
evidence_execution_status = "MANIFEST_AND_SOURCE_SET_INSPECTED_TESTS_NOT_EXECUTED"
