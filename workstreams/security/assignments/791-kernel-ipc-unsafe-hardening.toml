[work_unit]
cell_id = "security.kernel-ipc-unsafe-family-boundaries"
causal_property = "Every production unsafe family in eliot-ipc is reachable only through one enforceable safe wrapper that preserves EBP framing, peer/session authentication, exact I/O state, handle ownership, cancellation, late-completion and cleanup semantics."
current_discriminator = "eliot-ipc allows unsafe code and contains the Windows named-pipe adapter plus frame codec, but no accepted complete #754 site/family inventory and 22-case Windows proof currently closes raw I/O, buffer lifetime, peer verification, cancellation and handle ownership."
primary_issue_url = "https://github.com/UnknownAlienHuman/eliot-memory-os/issues/791"

