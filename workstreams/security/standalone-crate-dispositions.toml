# Standalone-workspace crate disposition and owner inventory (issue #1811, slice 1).
#
# Scope: checked-in disposition + named owner per standalone-workspace package
# crate. A standalone-workspace crate carries its own `[workspace]` table and is
# neither a root workspace member nor listed in root workspace `exclude`, so it
# is invisible to `cargo check --locked --workspace` and to the root Cargo.lock.
#
# Denominator method: `python scripts/verify-standalone-crates.py --root . --list`
# at the base commit below. That verifier discovers crates from the tree, never
# from this file, so drift between the tree and this inventory fails the proof
# test instead of diverging silently.
#
# Count reconciliation: the audit premise named 13 excluded packages when root
# `exclude` still listed capability cells. At the base commit root `exclude` is
# empty (admission waves moved cells into `members`) and the tree holds 11
# standalone package crates. Three further `[workspace]` tables exist but are
# not production supply-chain inputs and are out of #1811 package scope:
# `mcpls.toml` (tool config, no `[package]`) and the two `scripts/testdata/`
# fixture workspaces (test-only packages, ignored by the discovery rule below).
# 11 packages + 3 non-production roots = 14 `[workspace]` tables.
#
# REMAINDER (explicitly not this slice): per-crate SBOM, lock/provenance
# evidence, license/advisory records, and release/build gating that rejects
# undeclared excluded inputs. No row here confers workspace, runtime, state,
# authority, or production support admission; `workspace_admission` values are
# quoted verbatim from each manifest. Generated SBOM/license/advisory artifacts
# stay out of Git per docs/DEPENDENCY_POLICY.md repository hygiene.
#
# Per-row owner sources: `[package.metadata.eliot]` in the crate Cargo.toml and
# `lifecycle_owner` / `agent_task.integration_owner` in the crate module.toml
# where present. Production-boundary claim verified at the base commit by
# scanning every in-tree Cargo manifest (normal/dev/build/target edges,
# excluding target/ and testdata/) for path references to these packages (zero
# hits) and by confirming none of the 11 package names occurs in the root
# Cargo.lock.

