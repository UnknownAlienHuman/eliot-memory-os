schema_version = "eliot-doc-router-v1"

# Applied to every implementation route. This is intentionally small: purpose,
# hard boundaries, and the distinction between target claims and current proof.
[base]
required = [
  "A0.1",
  "A0.3",
  "I0.3..I0.5",
]
optional = [
  "A0.4",
  "I0.13",
]

[[route]]
id = "documentation-governance"
description = "Normative pair, repository instructions, documentation structure, links, and policy surfaces."
priority = 100
paths = [
  "docs/**",
  ".github/**",
  "AGENTS.md",
  "WORKFLOW.md",
  "README.md",
  "scripts/docs_router*.py",
  "scripts/check_docs_links.py",
  "scripts/README.md",
  "tests/test_docs_router.py",
  "tests/test_docs_links.py",
  "workstreams/**",
]
tasks = ["documentation", "architecture", "normative", "doc-routing", "doc-links"]
required = [
  "A0",
  "I0.14",
  "I16",
  "I19..I20",
]
optional = [
  "A1",
  "A16.3",
  "I17",
]

[[route]]
id = "kernel-and-recovery"
description = "Host, Kernel, fencing, ORS, supervision, recovery, and canonical transition ownership."
priority = 95
paths = [
  "bins/eliot-host/**",
  "bins/eliot-kernel/**",
  "bins/eliot-watchdog/**",
  "crates/kernel/**",
  "crates/platform/**",
]
tasks = ["host", "kernel", "watchdog", "recovery", "fencing", "ors"]
required = [
  "A2.2..A2.3",
  "A12.2",
  "A13.2..A13.12",
  "I1",
  "I2.3..I2.5",
  "I5.5..I5.23",
  "I14..I16",
]
optional = [
  "A8",
  "I8",
  "I17..I18",
]

[[route]]
id = "canonical-storage"
description = "Canonical store, write path, BlobStore, projections, durability, backup, and migration."
priority = 95
paths = [
  "bins/eliot-store-*/**",
  "crates/storage/**",
  "crates/**/*store*/**",
  "crates/**/*blob*/**",
]
tasks = ["storage", "store", "surrealdb", "blobstore", "persistence", "backup", "restore"]
required = [
  "A4",
  "A12.3",
  "A12.8",
  "A13.6..A13.9",
  "I5",
]
optional = [
  "I6",
  "I16",
  "I19..I20",
]

[[route]]
id = "agent-runtime-and-swarm"
description = "Agent Coordinator, external runtimes, delegation, swarm, route identity, and effect ownership."
priority = 95
paths = [
  "bins/eliot-agent-*/**",
  "bins/eliot-native-worker/**",
  "crates/agents/**",
  "crates/**/*agent*/**",
  "integrations/**",
  "skills/**",
]
tasks = ["agent", "runtime", "swarm", "codex", "claude", "opencode", "antigravity", "mcp"]
required = [
  "A10",
  "A12",
  "I3",
  "I7",
  "I10.15..I10.18",
  "I13..I14",
  "I16",
  "I18.16..I18.17",
]
optional = [
  "I2.17",
  "I10",
  "I17..I18",
]

[[route]]
id = "research-and-provider-federation"
description = "Inquiry, local search provider, ELIOT Research federation, evidence bundles, and research debt."
priority = 96
paths = [
  "crates/**/*research*/**",
  "crates/**/*search*/**",
  "bins/**/*research*/**",
  "bins/**/*search*/**",
  "integrations/**/*research*/**",
  "integrations/**/*search*/**",
]
tasks = ["research", "inquiry", "search-provider", "research-federation"]
required = [
  "A5..A6",
  "A12",
  "A14",
  "I21",
]
optional = [
  "I9",
  "I12..I13",
  "I16..I18",
]

[[route]]
id = "memory-context-and-dreamer"
description = "Canonical memory consumers, context, cues, understanding, graphs, Dreamer, and cognitive inheritance."
priority = 95
paths = [
  "bins/eliot-dreamer/**",
  "crates/**/*memory*/**",
  "crates/**/*context*/**",
  "crates/**/*dream*/**",
  "crates/**/*cognit*/**",
  "crates/**/*graph*/**",
  "crates/eliot-engine/**",
]
tasks = ["memory", "context", "dreamer", "understanding", "cognition", "graph", "causality"]
required = [
  "A4..A7",
  "A9",
  "A14.1..A14.4",
  "I9",
  "I12..I13",
  "I16",
]
optional = [
  "A5.5",
  "I6.16",
  "I10",
  "I17..I18",
]

[[route]]
id = "instrument-and-verification"
