  "scripts/**",
  "tests/**",
  "xtask/**",
  "crates/**/*instrument*/**",
  "crates/**/*evidence*/**",
  "crates/**/*verif*/**",
  "crates/**/*code*cortex*/**",
]
tasks = ["instrument", "verification", "testing", "evidence", "proof", "code-understanding"]
required = [
  "A5.5",
  "A10.8",
  "A14.6..A14.8",
  "I2.10..I2.23",
  "I2.25",
  "I10.8..I10.10",
  "I12.9..I12.10",
  "I16.17",
  "I17..I18",
]
optional = [
  "I7.9",
  "I7.27",
]

[[route]]
id = "human-surfaces"
description = "CLI, UI, operator, notification, user broker, configuration, and human control surfaces."
