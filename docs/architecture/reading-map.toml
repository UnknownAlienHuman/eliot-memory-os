  "apps/**",
  "crates/surfaces/**",
  "bins/eliot-cli/**",
  "bins/eliot-ui/**",
  "bins/eliot-user-broker/**",
  "bins/eliot-notify/**",
]
tasks = ["cli", "ui", "operator", "surface", "notification", "human-control"]
required = [
  "A11",
  "I3",
  "I11",
  "I13..I14",
]
optional = [
  "A7",
  "I7",
  "I10",
]

[[route]]
id = "security-privacy-authority"
description = "Authority, secrets, provenance, influence, privacy, credentials, and cryptography."
priority = 90
paths = [
  "config/**",
  "crates/**/*security*/**",
  "crates/**/*crypto*/**",
  "crates/**/*authority*/**",
  "crates/**/*secret*/**",
  "crates/**/*provenance*/**",
]
tasks = ["security", "privacy", "authority", "crypto", "secrets", "provenance"]
required = [
  "A12",
  "I6.10",
  "I6.15",
  "I8",
  "I15",
]
optional = [
  "A2",
  "I1.8",
  "I5.26",
]

[[route]]
id = "release-migration-and-installation"
description = "Build/release packaging, installation, compatibility, migration, rollback, and delivery slices."
priority = 90
paths = [
  "packaging/**",
  "install/**",
  "release/**",
  "scripts/build-*/**",
  "scripts/build-*",
  "scripts/finalize-*",
  "scripts/invoke-*production*",
  ".github/workflows/source-candidate.yml",
]
tasks = ["release", "migration", "installation", "packaging", "deployment", "rollback"]
required = [
  "A11",
  "A13",
  "I0.8..I0.9",
  "I15..I16",
  "I18..I20",
]
optional = [
  "I17",
]

[[route]]
id = "workspace-and-dependencies"
description = "Workspace topology, crates, dependencies, build graph, and cross-cutting source policy."
priority = 80
paths = [
  "Cargo.toml",
  "Cargo.lock",
  "deny.toml",
  ".gitattributes",
  ".gitignore",
  ".typos.toml",
  ".cargo/**",
  "rust-toolchain.toml",
  "Justfile",
  "config/**",
]
tasks = ["workspace", "dependency", "build-graph", "repository-policy"]
required = [
  "A2.3",
  "A14.8",
  "I2",
  "I15",
  "I17..I18",
]
optional = [
  "I6",
]

[[route]]
id = "generic-capability-cell"
description = "Fallback for an ordinary source capability with one owner, contract, proof surface, and affected edges."
priority = 10
paths = [
  "bins/**",
  "crates/**",
  "apps/**",
]
tasks = ["module", "crate", "capability-cell"]
required = [
  "A2.3",
  "A10.4",
  "A14.8",
  "I2.1..I2.25",
  "I6.4..I6.5",
  "I7.1..I7.5",
  "I10",
  "I14.14",
  "I18",
]
optional = [
  "I17",
]

[[route]]
id = "professional-and-multimodal"
description = "Professional workflows, multimodal capture, and specialized contract surfaces."
priority = 85
paths = [
  "crates/**/*media*/**",
  "crates/**/*multimodal*/**",
  "crates/**/*professional*/**",
]
tasks = ["professional", "multimodal", "media"]
required = [
  "A3",
  "I4",
  "I10.13",
  "I10.20..I10.22",
  "I12.35",
  "I18.47",
]
optional = [
  "A7",
  "I17",
]

[[route]]
id = "cross-cutting-fallback"
description = "Explicit fail-safe fallback when a path/task is not yet mapped; never selected silently."
priority = 0
paths = []
tasks = ["cross-cutting-fallback"]
required = [
  "A0..A2",
  "A10",
  "A12..A14",
  "I0..I3",
  "I5..I7",
  "I10",
  "I14..I18",
]
optional = [
  "I19..I20",
]
