schema_version = "eliot-doc-routes-v1"
pair_schema = "eliot-normative-pair-v2-sharded"

[baseline]
# Decision Safety Floor. These fragments apply to every material mutation.
required_handles = [
  "A0.1",
  "A0.2",
  "A0.3",
  "A0.4",
  "A0.6",
  "I0.3",
  "I0.4",
  "I0.5",
  "I0.13",
  "I0.14",
]
required_files = [
  "AGENTS.md",
  "WORKFLOW.md",
  "workstreams/ACTIVE.toml",
  "docs/ARCHITECTURE_CONTRACT.md",
  "docs/DEPENDENCY_POLICY.md",
  "docs/architecture/READING_PROTOCOL.md",
]
optional_handles = []
optional_files = ["docs/PROJECT_MAP.md"]
max_required_bytes = 393216

[[route]]
id = "generic-source"
description = "Common causal-cell, ownership, edge-proof, and completion rules for any source mutation."
