topic_keywords = ["source code", "implementation", "crate", "module", "binary", "refactor"]
required_handles = ["A2.3", "A10.4", "A14.8", "I2.17", "I2.20", "I18"]
optional_handles = ["I2.*", "I17"]
required_files = []
optional_files = ["Cargo.toml"]

[[route]]
id = "host-kernel"
description = "Host, Kernel, authority epoch, fencing, ORS, supervision, startup, and recovery ownership."
path_globs = ["bins/eliot-host/**", "bins/eliot-kernel/**", "crates/kernel/**"]
topic_keywords = ["host", "kernel", "authority epoch", "fencing", "ors", "supervision", "startup"]
