[script_inventory]
directory = "scripts"
documentation = "scripts/README.md"
extensions = [".py", ".ps1", ".sh", ".txt"]
exclude = []

[binary_inventory]
workspace_manifest = "Cargo.toml"
documentation = "docs/PROJECT_MAP.md"
member_prefix = "bins/"

[[owner_binding]]
path = "crates/agent/eliot-agent-coordinator/AGENTS.md"
required_phrases = ["#265"]
forbidden_current_phrases = ["Issue #224 owns current"]

[repository_paths]
scan_roots = [
  "AGENTS.md",
  "WORKFLOW.md",
  "README.md",
  "apps",
  "bins",
  "crates",
  "integrations",
  "plugin",
  "scripts",
  "config",
  "workstreams",
  "workspace",
  ".github/pull_request_template.md",
]
extensions = [
  ".rs",
  ".md",
  ".toml",
  ".py",
  ".ps1",
  ".sh",
  ".yml",
  ".yaml",
  ".json",
  ".js",
  ".mjs",
  ".cs",
  ".csproj",
  ".manifest",
  ".surql",
  ".txt",
  ".wat",
  ".wit",
  ".xaml",
]
# The verifier and policy contain negative examples or reasoned missing-path
# allowances; neither is an operational documentation consumer.
ignore_globs = [
  "scripts/docs_read.py",
  "scripts/docs_shards.py",
  "scripts/verify-doc-code-conformance.py",
  "scripts/doc_code_conformance_core.py",
  "config/doc-code-conformance.toml",
  ".github/workflows/repository-policy.yml",
]
handle_index = "docs/architecture/handle-index.json"

[[repository_paths.allow_missing]]
source = "scripts/docs_shards_core.py"
path = "docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md"
reason = "The shard verifier intentionally rejects restoration of the retired predecessor authority file."

[[repository_paths.allow_missing]]
source = "scripts/docs_shards_core.py"
path = "docs/architecture/ELIOT_IMPLEMENTATION_ENGLISH_FINAL_2026-08-28.md"
reason = "The shard verifier intentionally rejects restoration of the retired predecessor authority file."

[[repository_paths.allow_missing]]
source = "crates/eliot-types/schema/operator-contract-v1.json"
path = "docs/AGENT_HOST_INTEGRATIONS.md"
reason = "The schema retains a pre-sharding documentation reference as data; changing it is outside this conformance-surface repair."

[[repository_paths.allow_missing]]
source = "crates/kernel/eliot-process/src/execution_evidence.rs"
path = "docs/generated/rust-boundary-interfaces.md"
reason = "The source comment names a retained candidate mapping that is intentionally not a generated operational artifact."

[[repository_paths.allow_missing]]
source = "crates/security/eliot-source-assurance/src/lib.rs"
path = "docs/ELIOT_ARCHITECTURE.md"
reason = "The unit-test fixture preserves an incoming legacy identity and is not an operational documentation consumer."

[[repository_paths.allow_missing]]
source = "scripts/verify-legacy-config-retirement.py"
path = "docs/notes.md"
reason = "The self-test fixture uses docs/notes.md as a temporary test path."

[documentation_pipeline]
shards_front_door = "scripts/docs_shards.py"
router_front_door = "scripts/docs_router.py"
required_link_skip_parts = [
  ".eliot",
  ".eliot-docs",
  ".codebase-memory",
  "target",
  "dist",
  "node_modules",
  "obj",
  "__pycache__",
]
exact_case_marker = "DOC_LINK_EXACT_CASE_V1"
drive_path_rejection_marker = "DRIVE_QUALIFIED_PATH_REJECTED"
