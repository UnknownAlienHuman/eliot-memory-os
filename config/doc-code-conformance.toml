schema_version = "eliot-doc-code-conformance-v1"

[documentation_reader]
command = "python scripts/docs_read.py read"
required_terms = [
  "docs-read-bundle.md",
  "docs-read-receipt.json",
  "route alone",
  "verified bundle",
  "read receipt",
]
surfaces = [
  "AGENTS.md",
  "WORKFLOW.md",
  "docs/architecture/READING_PROTOCOL.md",
  "docs/architecture/README.md",
]
scan_all_agent_files = true

[[documentation_reader.generator_scope]]
path = "scripts/docs_shards.py"
start = "def routing_block("
end = "def patch_navigation_surfaces("

[[documentation_reader.generator_scope]]
path = "scripts/docs_shards.py"
start = "def render_reading_protocol("
end = "def render_architecture_readme("

[[documentation_reader.generator_scope]]
path = "scripts/docs_shards.py"
start = "def render_architecture_readme("
end = "def render_topic_index("

[workflows]
directory = ".github/workflows"
documentation = ".github/README.md"
allowed_events = ["workflow_dispatch"]
# Closed per-workflow exception (accepted issue #3004): ci.yml is the sole
# repository-owned workflow allowed automatic events. Every other workflow
# keeps the workflow_dispatch-only default above.
required_documentation_terms = ["`workflow_dispatch` only", "sole automatic workflow"]
forbidden_documentation_terms = [
  "Runs on every branch push and pull request to `main`.",
  "Runs for pull requests to `main` and may be dispatched manually.",
]
require_workflow_filenames = true

[[workflows.exceptions]]
file = "ci.yml"
allowed_events = ["workflow_dispatch", "pull_request", "push"]
reason = "Accepted issue #3004: sole automatic compile-only merge check."

[retired_references]
# The configured operational source surface is checked fail-closed. The
# documentation books themselves are excluded because compatibility paths and
# predecessor identities are documented there intentionally.
scan_roots = [
  "AGENTS.md",
  "WORKFLOW.md",
  "README.md",
  "apps",
  "bins",
  "crates",
  "integrations",
  "plugin",
  "scripts",
  "config",
  "workstreams",
  "workspace",
  ".github",
]
extensions = [
  ".rs",
  ".md",
  ".toml",
  ".py",
  ".ps1",
  ".sh",
  ".yml",
  ".yaml",
  ".json",
  ".js",
  ".mjs",
  ".cs",
  ".csproj",
  ".manifest",
  ".surql",
  ".txt",
  ".wat",
  ".wit",
  ".xaml",
]
tokens = [
  "docs/normative/",
  "docs/tasks/",
  "eliot-architecture-docs-fa941135",
  "58E71A2BDB10925C63D85A708ED768AEE8617BED0FB52EB044478EC20AB439D8",
  "C216FB7F6FDBC62D108C748BE6F61CA7EF9E5D24E5BB13AF2677C31A58460C0B",
  "docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md",
  "docs/architecture/ELIOT_IMPLEMENTATION_ENGLISH_FINAL_2026-08-28.md",
  # Issue #1147: the two stable monolith paths survive on disk as generated
  # COMPATIBILITY MAPS, not the normative book. Their own header requires
  # agents to use the reading protocol, route table, or handle index and open
  # only the returned canonical fragments. A production comment that cites one
  # of them as current authority therefore teaches a retired reading path and
  # is rejected; the canonical shard path belongs in the comment instead.
  "docs/architecture/ELIOT_ARCHITECTURE.md",
  "docs/architecture/ELIOT_IMPLEMENTATION.md",
]
# These implementation modules retain pre-sharding traceability markers. Each
# exception is exact path/token scoped; all other operational source remains
# fail-closed.
ignore_globs = [
  "config/doc-code-conformance.toml",
  "scripts/doc_code_conformance_core.py",
  "scripts/verify-doc-code-conformance.py",
  "scripts/docs_shards_core.py",
  # The closure audit defines the same retired-token list it scans for.
  "scripts/docs_closure_audit.py",
]
unstable_line_reference_regex = '(?<![A-Za-z0-9_./-])(?:docs/(?:normative|architecture)/)?ELIOT_(?:ARCHITECTURE|IMPLEMENTATION)\.md:\d+(?:-(?:[A-Za-z0-9_]+)?)?'

[[retired_references.allow]]
path = ".github/workflows/repository-policy.yml"
token = "docs/normative/"
reason = "The policy intentionally rejects reintroduced retired authority paths."

[[retired_references.allow]]
path = ".github/workflows/repository-policy.yml"
token = "docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md"
reason = "The policy intentionally rejects restoration of the predecessor file."

[[retired_references.allow]]
path = ".github/workflows/repository-policy.yml"
token = "docs/architecture/ELIOT_IMPLEMENTATION_ENGLISH_FINAL_2026-08-28.md"
reason = "The policy intentionally rejects restoration of the predecessor file."

# The three surfaces below own the retirement rule itself. A rule that forbids a
# token must spell that token out, so each is exempt from its own prohibition.
# Adding a token here does not weaken the check: every other path in every other
# scan root is still rejected fail-closed.

[[retired_references.allow]]
path = "config/doc-code-conformance.toml"
token = "docs/normative/"
reason = "This file is the owner of the retired-token list and of these exemptions."

[[retired_references.allow]]
path = "config/doc-code-conformance.toml"
token = "docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md"
