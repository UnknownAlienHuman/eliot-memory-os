name: Temporary issue 530 push dispatcher

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'chore(docs): dispatch issue 530 closure audit'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact closure audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/docs-closure-audit.yml/dispatches" \
            -f ref=main
