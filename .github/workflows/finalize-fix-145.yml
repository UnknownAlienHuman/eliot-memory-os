name: Finalize secret fixture source edits

on:
  push:
    branches:
      - fix/145-secret-scanning-fixtures
    paths:
      - .github/workflows/finalize-fix-145.yml

permissions:
  contents: write

concurrency:
  group: finalize-fix-145
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-secret-scanning-fixtures
          fetch-depth: 0

      - name: Apply final exact edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), observed {observed}: {old!r}"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          old_block = '''    let jwt = [
          ["eyJhbGciOi", "JIUzI1NiJ9"].concat(),
          ["eyJzdWIiOi", "JlbGlvdCJ9"].concat(),
          ["signature", "bytes"].concat(),
      ]
      .join(".");'''
          # The previous source edit intentionally avoided workspace-wide formatting;
          # normalize the exact block and borrow the generated String in assertions.
          actual_unformatted = '''    let jwt = [
    ["eyJhbGciOi", "JIUzI1NiJ9"].concat(),
    ["eyJzdWIiOi", "JlbGlvdCJ9"].concat(),
    ["signature", "bytes"].concat(),
]
.join(".");'''
          formatted = '''    let jwt = [
        ["eyJhbGciOi", "JIUzI1NiJ9"].concat(),
        ["eyJzdWIiOi", "JlbGlvdCJ9"].concat(),
        ["signature", "bytes"].concat(),
    ]
    .join(".");'''

          for path in [
              "crates/eliot-app/src/host_runtime/tests.rs",
              "crates/eliot-engine/src/antigravity.rs",
          ]:
              replace_exact(path, actual_unformatted, formatted)
              replace_exact(path, "contains(jwt)", "contains(&jwt)")

          http_path = "crates/agent/eliot-agent-opencode/src/http.rs"
          replace_exact(
              http_path,
              'assert!(!error.to_string().contains("test-secret"));',
              'assert!(!error.to_string().contains(["test-", "secret"].concat().as_str()));',
          )
          replace_exact(
              http_path,
              'assert!(!debug.contains("secret"));',
              'assert!(!debug.contains(["sec", "ret"].concat().as_str()));',
          )

          forbidden = [
              'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJlbGlvdCJ9.signaturebytes',
              'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzeW50aGV0aWMifQ.signaturevalue1234',
              'ghp_syntheticTokenValue1234567890',
              'SecretString::from("secret".to_owned())',
              'SecretString::from("test-secret".to_owned())',
              '.contains("test-secret")',
          ]
          roots = [
              Path("crates/agent/eliot-agent-opencode/src/http.rs"),
              Path("crates/eliot-app/src/host_runtime/tests.rs"),
              Path("crates/eliot-engine/src/antigravity.rs"),
              Path("crates/eliot-types/src/secret_boundary.rs"),
          ]
          for path in roots:
              text = path.read_text(encoding="utf-8")
              hits = [literal for literal in forbidden if literal in text]
              if hits:
                  raise SystemExit(f"{path}: scanner-shaped fixture remains: {hits}")

          Path(".github/workflows/finalize-fix-145.yml").unlink()
          PY

          git diff --check
          git add -A
          git commit -m "test(security): normalize generated secret fixtures"
          git push origin HEAD:fix/145-secret-scanning-fixtures
