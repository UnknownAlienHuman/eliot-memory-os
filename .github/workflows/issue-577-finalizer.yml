name: Temporary issue 577 documentation finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: issue-577-documentation-finalizer
  cancel-in-progress: true

env:
  SOURCE_BRANCH: fix/577-complete-doc-closure
  TRACE_SOURCE_BRANCH: fix/530-legacy-traceability-clean
  CANDIDATE_BRANCH: fix/577-final-verified
  TEMP_WORKFLOW: .github/workflows/issue-577-finalizer.yml
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/577-complete-doc-closure'
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout staged source payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Checkout exact current main candidate parent
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: candidate
          persist-credentials: true

      - name: Checkout bounded issue 530 cleanup source
        uses: actions/checkout@v4
        with:
          ref: fix/530-legacy-traceability-clean
          fetch-depth: 1
          path: trace-source
          persist-credentials: false

      - name: Bind exact identities
        shell: pwsh
        run: |
          $source = (git -C source rev-parse HEAD).Trim()
          if ($source -ne '${{ github.event.pull_request.head.sha }}') {
            throw "Source identity mismatch: $source"
          }
          git -C candidate fetch --no-tags origin main
          $main = (git -C candidate rev-parse origin/main).Trim()
          $candidateHead = (git -C candidate rev-parse HEAD).Trim()
          if ($candidateHead -ne $main) {
            throw "Candidate checkout is not exact current main: head=$candidateHead main=$main"
          }
          "SOURCE_HEAD=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PARENT_MAIN=$main" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "source=$source" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "parent_main=$main" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Configure bounded build environment
        shell: pwsh
        run: |
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$temp\eliot-577-target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_INCREMENTAL=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path candidate/.eliot | Out-Null

      - name: Decode and materialize staged payload
        shell: pwsh
        env:
          SOURCE_ROOT: ${{ github.workspace }}\source
          CANDIDATE_ROOT: ${{ github.workspace }}\candidate
        run: |
          @'
          from __future__ import annotations

          import base64
          import gzip
          import io
          import json
          import os
          import shutil
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath
          from typing import Any

          source = Path(os.environ['SOURCE_ROOT']).resolve()
          candidate = Path(os.environ['CANDIDATE_ROOT']).resolve()
          receipt_dir = candidate / '.eliot'
          receipt_dir.mkdir(parents=True, exist_ok=True)
          chunks = sorted(source.glob('.github/temporary/issue-577-payload-*.txt'))
          if len(chunks) != 6:
              raise SystemExit(f'expected 6 staged payload chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          compressed = base64.b64decode(encoded, validate=True)
          decoded = gzip.decompress(compressed)
          (receipt_dir / 'issue-577-payload.gz').write_bytes(compressed)
          (receipt_dir / 'issue-577-payload.decoded').write_bytes(decoded)

          applied: list[str] = []
          deleted: list[str] = []
          payload_kind = ''

          def safe_path(raw: str) -> Path:
              value = raw.replace('\\', '/').lstrip('./')
              pure = PurePosixPath(value)
              if not value or pure.is_absolute() or '..' in pure.parts or pure.parts[0] == '.git':
                  raise SystemExit(f'unsafe payload path: {raw!r}')
              target = (candidate / pure).resolve()
              target.relative_to(candidate)
              return target

          def write_bytes(raw_path: str, data: bytes, executable: bool = False) -> None:
              target = safe_path(raw_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              if executable:
                  target.chmod(target.stat().st_mode | 0o111)
              applied.append(target.relative_to(candidate).as_posix())

          def delete_path(raw_path: str) -> None:
              target = safe_path(raw_path)
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists() or target.is_symlink():
                  target.unlink()
              deleted.append(target.relative_to(candidate).as_posix())

          def apply_json(value: Any) -> bool:
              records: Any = None
              removals: list[str] = []
              if isinstance(value, dict) and 'files' in value:
                  records = value['files']
                  raw_removals = value.get('delete', value.get('deletions', []))
                  if isinstance(raw_removals, list):
                      removals = [str(item) for item in raw_removals]
              elif isinstance(value, list):
                  records = value
              elif isinstance(value, dict) and value and all('/' in str(key) or str(key).startswith('.') for key in value):
                  records = [{'path': key, 'content': content} for key, content in value.items()]
              else:
                  return False

              if isinstance(records, dict):
                  records = [{'path': key, 'content': content} for key, content in records.items()]
              if not isinstance(records, list):
                  return False
              for record in records:
                  if not isinstance(record, dict) or not str(record.get('path', '')).strip():
                      raise SystemExit('payload contains an invalid file record')
                  path = str(record['path'])
                  if record.get('delete') is True or record.get('operation') == 'delete':
                      delete_path(path)
                      continue
                  content = record.get('content', '')
                  encoding = str(record.get('encoding', 'utf-8')).lower()
                  if encoding in {'base64', 'b64'}:
                      data = base64.b64decode(str(content), validate=True)
                  elif isinstance(content, str):
                      data = content.encode('utf-8')
                  else:
                      raise SystemExit(f'payload content is not text/base64: {path}')
                  write_bytes(path, data, bool(record.get('executable')))
              for path in removals:
                  delete_path(path)
              return True

          archive = None
          try:
              archive = tarfile.open(fileobj=io.BytesIO(compressed), mode='r:gz')
          except tarfile.ReadError:
              archive = None
          if archive is not None:
              payload_kind = 'tar.gz'
              members = [member for member in archive.getmembers() if member.isfile()]
              names = [PurePosixPath(member.name.replace('\\', '/')) for member in members]
              strip_prefix = None
              first_parts = {name.parts[0] for name in names if name.parts}
              repository_roots = {'.github', 'apps', 'bins', 'config', 'crates', 'docs', 'integrations', 'migrations', 'plugin', 'scripts', 'tests', 'workspace', 'workstreams'}
              if len(first_parts) == 1:
                  only = next(iter(first_parts))
                  if only not in repository_roots and all(len(name.parts) > 1 for name in names):
                      strip_prefix = only
              for member, name in zip(members, names, strict=True):
                  parts = name.parts[1:] if strip_prefix else name.parts
                  if not parts:
                      continue
                  rel = PurePosixPath(*parts).as_posix()
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'cannot read tar member: {member.name}')
                  write_bytes(rel, stream.read(), bool(member.mode & 0o111))
              archive.close()
          elif zipfile.is_zipfile(io.BytesIO(decoded)):
              payload_kind = 'zip'
              with zipfile.ZipFile(io.BytesIO(decoded)) as archive_zip:
                  for info in archive_zip.infolist():
                      if info.is_dir():
                          continue
                      write_bytes(info.filename, archive_zip.read(info), bool((info.external_attr >> 16) & 0o111))
          else:
              try:
                  text = decoded.decode('utf-8')
              except UnicodeDecodeError:
                  text = ''
              parsed = None
              if text:
                  try:
                      parsed = json.loads(text)
                  except json.JSONDecodeError:
                      parsed = None
              if parsed is not None and apply_json(parsed):
                  payload_kind = 'json'
              elif text.startswith('diff --git ') or '\ndiff --git ' in text:
                  payload_kind = 'unified-diff'
                  patch = receipt_dir / 'issue-577-payload.patch'
                  patch.write_text(text, encoding='utf-8', newline='')
                  subprocess.run(['git', '-C', str(candidate), 'apply', '--whitespace=error-all', str(patch)], check=True)
                  applied.extend(
                      subprocess.check_output(['git', '-C', str(candidate), 'diff', '--name-only'], text=True).splitlines()
                  )
              else:
                  preview = decoded[:2048]
                  (receipt_dir / 'issue-577-unrecognized-preview.bin').write_bytes(preview)
                  raise SystemExit('unrecognized staged payload format; decoded payload preserved as artifact')

          summary = {
              'kind': payload_kind,
              'compressed_bytes': len(compressed),
              'decoded_bytes': len(decoded),
              'chunks': [path.name for path in chunks],
              'applied': sorted(set(applied)),
              'deleted': sorted(set(deleted)),
          }
          (receipt_dir / 'issue-577-payload-materialization.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8', newline=''
          )
          print(json.dumps(summary, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply complete issue 530 Rust-comment cleanup
        shell: pwsh
        run: |
          Copy-Item trace-source/scripts/doc_code_conformance_lib/rust_comments.py candidate/scripts/doc_code_conformance_lib/rust_comments.py -Force
          New-Item -ItemType Directory -Force -Path candidate/.github/temporary | Out-Null
          Copy-Item trace-source/.github/temporary/finalize_traceability.py candidate/.github/temporary/finalize_traceability.py -Force
          Push-Location candidate
          try {
            python .github/temporary/finalize_traceability.py *>&1 | Tee-Object -FilePath .eliot/issue-530-cleanup.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
          Remove-Item candidate/.github/temporary/finalize_traceability.py -Force

      - name: Retire temporary workflows and trigger surfaces
        shell: pwsh
        run: |
          $retired = @(
            'candidate/.github/workflows/docs-closure-audit.yml',
            'candidate/.github/workflows/issue-530-merge-finalizer.yml',
            'candidate/.github/workflows/issue-530-pr-finalizer.yml',
            'candidate/.github/workflows/issue-530-push-dispatcher.yml',
            'candidate/.github/workflows/issue-530-workflow-run-dispatcher.yml',
            "candidate/$env:TEMP_WORKFLOW",
            'candidate/.github/docs-closure-audit-trigger.txt',
            'candidate/.github/temporary/issue-530-merge-trigger.txt',
            'candidate/ARCHIVE_LINK.md'
          )
          foreach ($path in $retired) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force -Recurse }
          }
          if ((Test-Path candidate/.github/temporary) -and -not (Get-ChildItem candidate/.github/temporary -Force)) {
            Remove-Item candidate/.github/temporary -Force
          }

      - name: Install verification dependencies
        shell: pwsh
        working-directory: candidate
        run: |
          python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt *>&1 |
            Tee-Object -FilePath .eliot/pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regenerate deterministic package indexes
        shell: pwsh
        working-directory: candidate
        run: |
          python scripts/code_navigation.py sync-index --root . *>&1 |
            Tee-Object -FilePath .eliot/package-index-sync.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run documentation and navigation proof
        shell: pwsh
        working-directory: candidate
        run: |
          python -m py_compile scripts/*.py scripts/code_navigation_lib/*.py scripts/doc_code_conformance_lib/*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-doc-code-conformance.py --self-test *>&1 | Tee-Object .eliot/documentation-proof.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-doc-code-conformance.py --root . --json-out .eliot/doc-code-conformance.json *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_shards.py self-test *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_shards.py verify --root . *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py self-test *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py check --root . *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_read.py self-test *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/code_navigation.py self-test *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/code_navigation.py check --root . *>&1 | Tee-Object .eliot/documentation-proof.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove Rust executable projections remain unchanged
        shell: pwsh
        working-directory: candidate
        run: |
          @'
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from doc_code_conformance_lib.rust_comments import code_projection
          base = '${{ env.PARENT_MAIN }}'
          paths = [p for p in subprocess.check_output(['git', 'ls-files', '*.rs'], text=True).splitlines() if p]
          changed = []
          for relative in paths:
              before = subprocess.check_output(['git', 'show', f'{base}:{relative}']).decode('utf-8')
              after = Path(relative).read_text(encoding='utf-8')
              if code_projection(before) != code_projection(after):
                  changed.append(relative)
          if changed:
              raise SystemExit('non-comment Rust projection changed: ' + ', '.join(changed))
          print(f'RUST_CODE_PROJECTION: PASS files={len(paths)}')
          '@ | python - *>&1 | Tee-Object .eliot/rust-code-projection.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run supported repository and workspace checks
        shell: pwsh
        working-directory: candidate
        run: |
          pwsh -NoProfile -File scripts/verify.ps1 *>&1 | Tee-Object .eliot/repository-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings *>&1 | Tee-Object .eliot/cargo-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p eliot-platform-windows --lib *>&1 | Tee-Object .eliot/platform-windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:PARENT_MAIN *>&1 | Tee-Object .eliot/diff-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce clean candidate boundary
        shell: pwsh
        working-directory: candidate
        run: |
          $forbidden = @(
            '.github/workflows/docs-closure-audit.yml',
            '.github/workflows/issue-530-merge-finalizer.yml',
            '.github/workflows/issue-530-pr-finalizer.yml',
            '.github/workflows/issue-530-push-dispatcher.yml',
            '.github/workflows/issue-530-workflow-run-dispatcher.yml',
            '.github/workflows/issue-577-finalizer.yml',
            '.github/docs-closure-audit-trigger.txt',
            '.github/temporary/issue-530-merge-trigger.txt',
            'ARCHIVE_LINK.md'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "Temporary surface leaked into candidate: $path" }
          }
          $payloadLeaks = @(Get-ChildItem .github/temporary/issue-577-payload-*.txt -ErrorAction SilentlyContinue)
          if ($payloadLeaks.Count -ne 0) { throw 'Issue 577 payload chunks leaked into candidate' }
          git status --short | Out-File .eliot/final-status.txt -Encoding utf8
          git diff --name-only $env:PARENT_MAIN | Sort-Object | Out-File .eliot/final-paths.txt -Encoding utf8

      - name: Publish one-parent verified candidate
        shell: pwsh
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .eliot
          $tree = (git write-tree).Trim()
          git fetch --no-tags origin main
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:PARENT_MAIN) { throw "Main moved during verification: $remoteMain" }
          $message = @(
            'fix(docs): complete documentation closure and traceability',
            '',
            'Materialize package/target documentation closure, retire obsolete source traceability and temporary workflows, enforce deterministic indexes and shard limits, and preserve non-comment Rust projections.',
            '',
            'Closes #577.',
            'Closes #530.',
            'Closes #766.'
          ) -join "`n"
          $commit = ($message | git commit-tree $tree -p $remoteMain).Trim()
          git push --force origin "$commit`:refs/heads/$($env:CANDIDATE_BRANCH)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "candidate=$commit" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "candidate=$commit`nparent=$remoteMain`nsource=$($env:SOURCE_HEAD)" | Out-File .eliot/publication.txt -Encoding utf8

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-577-final-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: candidate/.eliot/
