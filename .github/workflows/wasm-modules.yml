name: Manual WASM Modules Lane

# Issue #764 (A2/16): the affected-component WASM build/test lane as an
# authorized manual-only workflow. `workflow_dispatch` only, per
# `.github/README.md` (no pushes, pull requests, schedules, merges,
# releases, or any other automatic event). A person starts one explicitly
# from the Actions UI or an equivalent authenticated manual dispatch with
# a PR-shaped fixture (module + base/head SHAs). Ordinary verification is
# run locally.
#
# Bounds: read-only contents permission, no credentials persisted, one
# workflow per ref (concurrency group below), a 120-minute timeout, no
# cache restore (the lane derives isolated target roots per I02-22 and
# correctness never depends on a cache hit), and no artifact upload — the
# JSON receipts print to the step log and the step summary in bounded
# form, so nothing leaves the runner except logs.
on:
  workflow_dispatch:
    inputs:
      module:
        description: Registered lane module to build and test (registry name)
        required: true
        type: string
      lane_step:
        description: Lane step to run for the module
        required: false
        default: test
        type: choice
        options: [build, test]
      base_sha:
        description: Selection base SHA (defaults to the dispatch SHA)
        required: false
        default: ''
        type: string
      head_sha:
        description: Selection head SHA (defaults to the dispatch SHA)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm-modules-lane:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: checked out $sourceSha but expected $env:GITHUB_SHA"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "SOURCE_SHA=$sourceSha"

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target list --installed

      - name: Prove toolchain declaration
        shell: pwsh
        run: python scripts/verify-wasm-toolchain.py --format json

      - name: Prove affected selection parity
        shell: pwsh
        env:
          LANE_BASE: ${{ inputs.base_sha }}
          LANE_HEAD: ${{ inputs.head_sha }}
        run: |
          if ([string]::IsNullOrEmpty($env:LANE_BASE)) { $env:LANE_BASE = $env:GITHUB_SHA }
          if ([string]::IsNullOrEmpty($env:LANE_HEAD)) { $env:LANE_HEAD = $env:GITHUB_SHA }
          python scripts/wasm_component_lane.py --select `
            --registry scripts/testdata/wasm-component-lane/registry.json `
            --base-sha $env:LANE_BASE --head-sha $env:LANE_HEAD `
            --format json --receipt-out $env:RUNNER_TEMP/wasm-select-receipt.json

      - name: Run lane step for the dispatched module
        shell: pwsh
        env:
          LANE_MODULE: ${{ inputs.module }}
          LANE_STEP: ${{ inputs.lane_step }}
          LANE_BASE: ${{ inputs.base_sha }}
          LANE_HEAD: ${{ inputs.head_sha }}
        run: |
          # Inputs travel via environment so the whole value stays one argv;
          # the lane itself resolves names through the registry only and
          # fail-closes unknown, traversal, absolute, separator, and
          # shell-injection spellings before constructing any command.
          if ([string]::IsNullOrEmpty($env:LANE_BASE)) { $env:LANE_BASE = $env:GITHUB_SHA }
          if ([string]::IsNullOrEmpty($env:LANE_HEAD)) { $env:LANE_HEAD = $env:GITHUB_SHA }
          python scripts/wasm_component_lane.py --$env:LANE_STEP $env:LANE_MODULE `
            --registry scripts/testdata/wasm-component-lane/registry.json `
            --base-sha $env:LANE_BASE --head-sha $env:LANE_HEAD `
            --format json --receipt-out $env:RUNNER_TEMP/wasm-module-receipt.json
          $receipt = Get-Content -LiteralPath $env:RUNNER_TEMP/wasm-module-receipt.json -Raw -Encoding utf-8
          if ($receipt.Length -gt 4000) { $receipt = $receipt.Substring(0, 4000) }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "RECEIPT=$receipt"
