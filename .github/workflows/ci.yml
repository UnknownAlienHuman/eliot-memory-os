name: Manual PR Integration Conformance Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$testTemp\eliot-pr-check-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Install bounded Python verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r scripts/requirements-verification.txt

      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-review-${{ hashFiles('Cargo.lock') }}

      - name: Run current bounded repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Profile Review

      - name: Restore and build Eliot.Operator in locked mode
        shell: pwsh
        run: |
          dotnet restore apps/Eliot.Operator/Eliot.Operator.csproj --locked-mode
          dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release --no-restore

      - name: Execute Eliot.Operator test harness
        shell: pwsh
        run: |
          dotnet run --project tests/Eliot.Operator.Tests/Eliot.Operator.Tests.csproj -c Release --no-restore

      - name: Record proof ceiling and manifest
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Manual Conformance Run Manifest"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Source SHA: $sourceSha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Actions: checkout@11bd7190, cache@1bd1e32a"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Python dependencies: hash-locked requirements-verification.txt"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- NuGet: locked-mode restore packages.lock.json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Operator tests: executed Eliot.Operator.Tests (exit 0)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Profile: Review (sole gate-definition owner scripts/verify.ps1 -Profile Review)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate order: documentation-shards-self-test, documentation-shards, documentation-routes-self-test, documentation-routes, documentation-read-self-test, documentation-code-conformance-self-test, documentation-code-conformance, code-navigation-self-test, code-navigation, documentation-closure-audit, standalone-crates, core-daemon-inventory-self-test, core-daemon-inventory, normative-pair, dependency-policy-self-test, dependency-policy-offline, architecture-boundaries-self-test, architecture-boundaries, agent-guardrails-self-test, agent-guardrails, agent-route-bundles-self-test, agent-route-bundles, runtime-source-hygiene-self-test, runtime-source-hygiene, agent-bridge-protocol-self-test, agent-bridge-protocol, cargo-metadata, cargo-fmt, cargo-check-workspace, cargo-clippy-workspace, cargo-test-workspace, cargo-deny"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Proof ceiling: REVIEW_SOURCE_ONLY (not release/source-candidate, not installed-runtime/store/Product-Pulse proof)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- D-INT ceiling: ignored/stateful/live-provider tests are outside normal Review"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Cache: key binds OS+lockfile+profile; hit/miss run the same gates; no pass receipt from cache"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "PR_INTEGRATION_SOURCE_CHECK_ONLY"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No live Windows/store/Product-Pulse claim."
