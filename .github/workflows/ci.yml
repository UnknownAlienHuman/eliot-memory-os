name: Automatic PR Merge Compile Gate

# Sole automatic workflow (accepted issue #3004): one automatic, required,
# Windows compile-only merge check. Triggers: pull_request targeting main,
# push to main, manual rerun. No privileged-target, schedule, release,
# merge-group, or dispatch inputs. Every other repository workflow stays
# workflow_dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Event-specific cancellation: a PR update cancels only that PR's obsolete
# run; each pushed main SHA and each manual run keeps a terminal result.
concurrency:
  group: merge-compile-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  merge-compile:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$testTemp\eliot-pr-check-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Install bounded Python verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r scripts/requirements-verification.txt

      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-profile-mergecompile-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml', 'scripts/verify.ps1', '.github/workflows/ci.yml') }}-${{ github.event_name == 'push' && 'main' || 'pr' }}
          lookup-only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Bind integration candidate identity
        shell: pwsh
        run: |
          $eventName = $env:GITHUB_EVENT_NAME
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $checkedOut = ((git rev-parse HEAD) | Out-String).Trim()
          $tree = ((git rev-parse 'HEAD^{tree}') | Out-String).Trim()
          $baseSha = ''
          $headSha = ''
          $beforeSha = ''
          $afterSha = ''
          $targetBranch = ''
          $expected = $env:GITHUB_SHA
          if ($eventName -eq 'pull_request') {
            $baseSha = $event.pull_request.base.sha
            $headSha = $event.pull_request.head.sha
            $targetBranch = $event.pull_request.base.ref
            if ($targetBranch -ne 'main') {
              throw "Candidate targets '$targetBranch', not main."
            }
          } elseif ($eventName -eq 'push') {
            $beforeSha = $event.before
            $afterSha = $event.after
            $expected = $afterSha
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Push run on '$env:GITHUB_REF', not refs/heads/main."
            }
          }
          if ([string]::IsNullOrWhiteSpace($expected) -or $checkedOut -ne $expected) {
            throw "Checked-out $checkedOut does not match the integration candidate $expected."
          }
          if ($eventName -eq 'pull_request' -and $baseSha -match '^[0-9a-fA-F]{40}$') {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "MERGE_COMPILE_BASE_SHA=$baseSha"
          } elseif ($eventName -eq 'push' -and $beforeSha -match '^[0-9a-fA-F]{40}$' -and $beforeSha -notmatch '^0{40}$') {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "MERGE_COMPILE_BASE_SHA=$beforeSha"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Candidate event=$eventName ref=$env:GITHUB_REF sha=$env:GITHUB_SHA run=$env:GITHUB_RUN_ID"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Base=$baseSha Head=$headSha Before=$beforeSha After=$afterSha Expected=$expected"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Checked-out Source SHA=$checkedOut tree=$tree"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Target branch=$targetBranch (main only)"

      - name: Verify shared documentation evidence
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $baseSha = [string]$event.pull_request.base.sha
          $candidateSha = ((git rev-parse HEAD) | Out-String).Trim()
          $prBodyPath = Join-Path $env:RUNNER_TEMP 'merge-compile-pr-body.txt'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($prBodyPath, [string]$event.pull_request.body, $utf8NoBom)
          python -m scripts.work_unit_gate doc-read-evidence --base $baseSha --candidate $candidateSha --pr-body $prBodyPath
          exit $LASTEXITCODE

      # Quarantined legacy lane (issue #1813 W6): the MergeCompile gates
      # execute cargo/dotnet directly with no governed profile receipt.
      # Thin-invoker migration awaits W4 stage-execution provisions.
      - name: Run MergeCompile verification profile
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Profile MergeCompile

      - name: Record proof ceiling and manifest
        shell: pwsh
        run: |
          $manifestSha = ((git rev-parse HEAD) | Out-String).Trim()
          $lockHash = ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash).Substring(0, 12)
          $toolHash = ((Get-FileHash rust-toolchain.toml -Algorithm SHA256).Hash).Substring(0, 12)
          $ciHash = ((Get-FileHash .github/workflows/ci.yml -Algorithm SHA256).Hash).Substring(0, 12)
          $profileHash = ((Get-FileHash scripts/verify.ps1 -Algorithm SHA256).Hash).Substring(0, 12)
          $rustcIdentity = 'unavailable'
          $cargoIdentity = 'unavailable'
          $dotnetIdentity = 'unavailable'
          $pythonIdentity = 'unavailable'
          try { $rustcIdentity = ((rustc --version) | Out-String).Trim() } catch { $rustcIdentity = 'unavailable' }
          try { $cargoIdentity = ((cargo --version) | Out-String).Trim() } catch { $cargoIdentity = 'unavailable' }
          try { $dotnetIdentity = ((dotnet --version) | Out-String).Trim() } catch { $dotnetIdentity = 'unavailable' }
          try { $pythonIdentity = ((python --version) | Out-String).Trim() } catch { $pythonIdentity = 'unavailable' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Merge Compile Run Manifest"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Repository: $env:GITHUB_REPOSITORY event=$env:GITHUB_EVENT_NAME ref=$env:GITHUB_REF Source SHA=$manifestSha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Runner: os=$env:RUNNER_OS image=$env:ImageOS arch=$env:RUNNER_ARCH"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Toolchain: $rustcIdentity / $cargoIdentity / dotnet $dotnetIdentity / $pythonIdentity"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Inputs: Cargo.lock=$lockHash rust-toolchain=$toolHash ci.yml=$ciHash verify.ps1=$profileHash"
          $gwfJson = Join-Path $env:RUNNER_TEMP 'gwf-actions.json'
          python scripts/verify-github-workflows.py --root . --json-out $gwfJson
          if ($LASTEXITCODE -ne 0) { throw "GITHUB_WORKFLOWS_MANIFEST_REJECTED: common verifier failed; no action manifest is published" }
          $gwf = Get-Content -LiteralPath $gwfJson -Raw | ConvertFrom-Json
          if ($gwf.status -ne 'pass') { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: verifier payload status is not pass' }
          $derivedActions = @($gwf.actions | Where-Object { $_.workflow -eq '.github/workflows/ci.yml' } | ForEach-Object { "$($_.action)@$($_.ref)" } | Select-Object -Unique)
          if ($derivedActions.Count -eq 0) { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: derived record holds no action identities for ci.yml' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Actions: " + ($derivedActions -join ', '))
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Python dependencies: hash-locked requirements-verification.txt"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- NuGet: locked-mode restore of Eliot.Operator and Eliot.Operator.Tests packages.lock.json files"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Operator harness: built, zero execution; no Operator test claim"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Profile: MergeCompile (sole gate-definition owner scripts/verify.ps1, closed MergeCompile profile)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Package denominator: exact count bound at runtime by VERIFY_WORKSPACE_MEMBERS and VERIFY_DENOMINATOR lines (cargo metadata --locked --no-deps)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate order: documentation-shards-self-test, documentation-shards, documentation-routes-self-test, documentation-routes, documentation-read-self-test, documentation-code-conformance-self-test, documentation-code-conformance, code-navigation-self-test, code-navigation, documentation-closure-audit, documentation-evidence-check-self-test, core-daemon-inventory-self-test, core-daemon-inventory, normative-pair, dependency-policy-self-test, dependency-policy-offline, architecture-boundaries-self-test, architecture-boundaries, agent-guardrails-self-test, agent-guardrails, agent-route-bundles-self-test, agent-route-bundles, runtime-source-hygiene-self-test, runtime-source-hygiene, agent-bridge-protocol-self-test, agent-bridge-protocol, cargo-metadata, cargo-fmt, cargo-check-workspace, cargo-denominator, cargo-test-compile, cargo-clippy-changed, standalone-crates-compile, dotnet-restore-operator, dotnet-build-operator"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate states: every mandatory gate reports pass/fail-exit/fail-exception/cancelled/not-run via VERIFY_GATE; any nonpass fails this check"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Cache: key binds OS+toolchain+lockfile+profile+event-class; fork pull requests restore-only; hit/miss run the same gates; no pass receipt from cache"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Proof ceiling: MERGE_COMPILE_SOURCE_ONLY (compile-only; zero test execution; no lint-cleanliness claim; not Review/release/source-candidate, not installed-runtime/store/Product-Pulse proof)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "MERGE_COMPILE_SOURCE_ONLY"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Omitted: broad unit behavior, installed Windows services, Store correctness/recovery, external providers, release packaging, Product Pulse, live acceptance"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No live Windows/store/Product-Pulse claim."

  # Temporary owner-requested diagnostic, tracked in #3004. Not an admission
  # profile or a replacement check. Remove after collecting this exact run.
  audit-linked-build:
    name: One-shot unsigned core build (not admission)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[audit-build-b292c304]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AUDIT_SOURCE_SHA: b292c3041251d5ffc510743f5eb6c703945dc7aa
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: audit-checkout
        with:
          ref: b292c3041251d5ffc510743f5eb6c703945dc7aa
          fetch-depth: 1
          persist-credentials: false
      - name: Bind diagnostic source and inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP\eliot-audit-target"
          New-Item -ItemType Directory -Path audit-output -Force | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:AUDIT_SOURCE_SHA) { throw 'Diagnostic source mismatch' }
          if ((git status --porcelain | Out-String).Trim()) { throw 'Checkout is not clean' }
          @{
            source_sha = $actual
            workflow_sha = $env:GITHUB_SHA
            tree = (git rev-parse 'HEAD^{tree}').Trim()
            cargo_lock = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash
            toolchain_file = (Get-FileHash rust-toolchain.toml -Algorithm SHA256).Hash
            profile = 'dev with debug=0; two build jobs; no shared cache'
            ceiling = 'UNSIGNED_BUILD_DIAGNOSTIC_ONLY; no dependency clearance or runtime acceptance'
          } | ConvertTo-Json | Set-Content audit-output/source.json -Encoding utf8
      - name: Install repository-pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose | Tee-Object -FilePath audit-output/rustc.txt
          exit $LASTEXITCODE
      - name: Link core executables without running them
        id: audit-rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked --target x86_64-pc-windows-msvc --bins --keep-going -p eliot -p eliot-host -p eliot-kernel -p eliotd -p eliot-store-surreal -p eliot-watchdog -p eliot-agent-bridge -p eliot-doctor --message-format=json-render-diagnostics 1> audit-output/build.jsonl 2> audit-output/build.stderr.log
          $buildExit = $LASTEXITCODE
          Set-Content audit-output/rust-exit.txt $buildExit
          Get-Content audit-output/build.stderr.log -Tail 160
          exit $buildExit
      - name: Compile Operator independently without running it
        if: ${{ !cancelled() && steps.audit-checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet --info > audit-output/dotnet.txt
          dotnet restore apps/Eliot.Operator/Eliot.Operator.csproj --locked-mode *> audit-output/operator-restore.log
          $restoreExit = $LASTEXITCODE
          Set-Content audit-output/operator-restore-exit.txt $restoreExit
          if ($restoreExit -ne 0) { Get-Content audit-output/operator-restore.log -Tail 100; exit $restoreExit }
          dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release --no-restore *> audit-output/operator-build.log
          $buildExit = $LASTEXITCODE
          Set-Content audit-output/operator-build-exit.txt $buildExit
          Get-Content audit-output/operator-build.log -Tail 100
          exit $buildExit
      - name: Record exact binary availability and hashes
        if: ${{ !cancelled() && steps.audit-checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path audit-output/unsigned-binaries -Force | Out-Null
          $names = @('eliot', 'eliot-host', 'eliot-kernel', 'eliotd', 'eliot-store-surreal', 'eliot-watchdog', 'eliot-agent-bridge', 'eliot-doctor')
          $rows = @(foreach ($name in $names) {
            $file = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\debug\$name.exe"
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              $item = Get-Item -LiteralPath $file
              $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
              Copy-Item -LiteralPath $file -Destination audit-output/unsigned-binaries
              @{ name = $name; present = $true; bytes = $item.Length; sha256 = $digest }
            } else { @{ name = $name; present = $false } }
          })
          $rows | ConvertTo-Json | Set-Content audit-output/binaries.json -Encoding utf8
          git diff --exit-code -- Cargo.lock apps/Eliot.Operator/packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Locked inputs changed' }
          Add-Content $env:GITHUB_STEP_SUMMARY "## Unsigned diagnostic build; NOT an accepted product"
          Add-Content $env:GITHUB_STEP_SUMMARY "Source=$env:AUDIT_SOURCE_SHA; workflow=$env:GITHUB_SHA. Existing MergeCompile verdict remains independent."
          Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content audit-output/binaries.json -Raw)
      - name: Retain diagnostic logs and any linked unsigned binaries
        if: ${{ !cancelled() && steps.audit-checkout.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-core-diagnostic-b292c304-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
