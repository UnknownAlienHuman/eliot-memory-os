name: Automatic PR Merge Compile Gate

# Sole automatic workflow (accepted issue #3004): one automatic, required,
# Windows compile-only merge check. Triggers: pull_request targeting main,
# push to main, manual rerun. No privileged-target, schedule, release,
# merge-group, or dispatch inputs. Every other repository workflow stays
# workflow_dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Event-specific cancellation: a PR update cancels only that PR's obsolete
# run; each pushed main SHA and each manual run keeps a terminal result.
concurrency:
  group: merge-compile-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  merge-compile:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$testTemp\eliot-pr-check-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Install bounded Python verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r scripts/requirements-verification.txt

      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Issue #1923 (I18.44): the key separates the entry by every
          # dimension that changes whether reusing it is safe — runner
          # platform/arch, dependency lock, toolchain, source manifests, the
          # run's event class, and the run's trust class. A restored
          # registry/git cache is reused build output whose trust boundary is
          # exactly the fork/PR trust class, the source tree and the toolchain
          # that produced it, so a key that named only OS+lockfile+profile
          # reused one entry across all of them. The source dimension hashes
          # every workspace member root the root manifest declares, including
          # workspace/tools/** — a manifest outside that set changes what the
          # workspace resolves while leaving this key identical, which is
          # exactly the cross-source reuse the contract forbids. Every
          # workflow that restores this cache spells these dimensions the same
          # way, and scripts/verify-github-workflows.py rejects a key that
          # drops one (GWF-020) or whose manifest globs miss a member root
          # (GWF-021), so neither the binding nor its coverage can silently
          # regress.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-profile-mergecompile-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml', 'scripts/verify.ps1', '.github/workflows/ci.yml') }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'bins/**/Cargo.toml', 'workspace/**/Cargo.toml') }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}-${{ github.event.pull_request.head.repo.fork && 'untrusted-fork' || 'trusted' }}
          lookup-only: ${{ github.event.pull_request.head.repo.fork == true }}

      # Clean-runner dependency-policy preparation (issues #3004/#1229/#1225,
      # external audits 5887267578 / 5885520490(d)):
      # invoke #1229's one declared preparation entrypoint on the clean runner
      # before the read-only offline gate, exactly as
      # scripts/verify-dependency-policy.py names it (PREPARATION_ENTRYPOINT,
      # line 3769) and for the profile that gate actually runs (offline-source).
      # That entrypoint owns discovery of
      # pinned scanner identity, of the project-local Surreal provisioner, and
      # of the standalone resolver inputs; this file no longer re-implements
      # that discovery and no longer declines a leg. The only operations kept
      # here are the two the owner deliberately does not perform: installing
      # the exact pinned scanner, and fetching the root lock's selected
      # dependency bytes. Preparation writes no lock, no receipt and no
      # verdict - it records a PREPARE_* marker plus a step-summary line for
      # every declared input, and a nonzero owner exit keeps the read-only
      # offline gate failed, because that gate owns the verdict. Nothing here
      # converts a failed policy into PASS or fabricates evidence.
      - name: Prepare dependency-policy inputs
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Dependency-policy input preparation'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Owner entrypoint scripts/prepare-dependency-policy-inputs.py (profile offline-source) owns the pinned scanner identity, scripts/provision-surrealdb-release.py and the standalone resolver inputs. This step adds only the exact pinned scanner install and the root locked prefetch; it writes no lock, no receipt and no verdict'
          # The dependency-policy gate resolves its scanner through PATH and
          # admits only digest-matched bytes, so a clean runner must
          # materialize the exact identity declared in
          # config/dependency-policy.toml rather than install a latest
          # cargo-deny. The preparation owner verifies that identity and
          # never installs a tool, so this provisioning call stays ahead of
          # it. A nonzero exit here keeps the gate failed; the provisioner
          # provisions inputs and never writes a verdict.
          $scannerJson = python scripts/provision-dependency-scanner.py --root .
          $scannerExit = $LASTEXITCODE
          if ($scannerExit -ne 0) {
            Write-Host "PREPARE_SCANNER_EXACT_IDENTITY: exit=$scannerExit"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Pinned scanner provisioning exit=$scannerExit (exact identity unavailable; the offline gate keeps the failed result failed)"
            exit $scannerExit
          }
          $scanner = ($scannerJson -join "`n") | ConvertFrom-Json
          Write-Host "PREPARE_SCANNER_EXACT_IDENTITY: tool=$($scanner.tool) version=$($scanner.version) sha256=$($scanner.observed_sha256) reused=$($scanner.reused)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Pinned scanner: $($scanner.tool) $($scanner.version) sha256=$($scanner.observed_sha256) from $($scanner.release_asset)"
          $scannerDirectory = Join-Path $env:GITHUB_WORKSPACE $scanner.install_directory
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scannerDirectory
          $env:PATH = $scannerDirectory + [IO.Path]::PathSeparator + $env:PATH
          $preparationManifest = '.eliot/dependency-policy-preparation.json'
          $preparationOutput = @(& python scripts/prepare-dependency-policy-inputs.py --root . --profile offline-source --manifest-out $preparationManifest 2>&1)
          $preparationExit = $LASTEXITCODE
          foreach ($preparationLine in $preparationOutput) { Write-Host $preparationLine }
          Write-Host "PREPARE_DEPENDENCY_POLICY_INPUTS: exit=$preparationExit"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Owner preparation exit=$preparationExit (nonzero keeps the offline gate failed; the gate owns the verdict and reports the same inputs)"
          $preparation = $null
          if (Test-Path -LiteralPath $preparationManifest -PathType Leaf) {
            $preparation = Get-Content -LiteralPath $preparationManifest -Raw | ConvertFrom-Json
          }
          if ($null -eq $preparation) {
            Write-Host "PREPARE_PREPARATION_MANIFEST: absent=$preparationManifest"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Owner preparation manifest absent at $preparationManifest; the read-only offline gate keeps the failed result failed and names the missing inputs itself"
          } else {
            foreach ($inputRecord in @($preparation.inputs)) {
              Write-Host "PREPARE_INPUT: $($inputRecord.input) status=$($inputRecord.status) scope=$($inputRecord.evidence_scope) detail=$($inputRecord.detail)"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Input $($inputRecord.input): $($inputRecord.status) ($($inputRecord.evidence_scope))"
            }
            $missingInputs = @($preparation.missing_inputs | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            if ($missingInputs.Count -eq 0) {
              Write-Host "PREPARE_MISSING_INPUTS: none"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Missing required preparation inputs: none'
            } else {
              Write-Host "PREPARE_MISSING_INPUTS: $($missingInputs -join ', ')"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Missing required preparation inputs: $($missingInputs -join ', ') (the owner materializes nothing it does not own; the read-only offline gate below reports these same inputs and owns the verdict)"
            }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Preparation manifest: $preparationManifest (per-input and per-standalone-workspace detail; ignored local input, never a PASS receipt)"
          }
          cargo fetch --locked
          $rootFetchExit = $LASTEXITCODE
          Write-Host "PREPARE_ROOT_FETCH_LOCKED: exit=$rootFetchExit"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Root cargo fetch --locked exit=$rootFetchExit (prepares the root resolution only; standalone resolution inputs are declared by the owner above)"

      - name: Bind integration candidate identity
        shell: pwsh
        run: |
          $eventName = $env:GITHUB_EVENT_NAME
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $checkedOut = ((git rev-parse HEAD) | Out-String).Trim()
          $tree = ((git rev-parse 'HEAD^{tree}') | Out-String).Trim()
          $baseSha = ''
          $headSha = ''
          $beforeSha = ''
          $afterSha = ''
          $targetBranch = ''
          $expected = $env:GITHUB_SHA
          if ($eventName -eq 'pull_request') {
            $baseSha = $event.pull_request.base.sha
            $headSha = $event.pull_request.head.sha
            $targetBranch = $event.pull_request.base.ref
            if ($targetBranch -ne 'main') {
              throw "Candidate targets '$targetBranch', not main."
            }
          } elseif ($eventName -eq 'push') {
            $beforeSha = $event.before
            $afterSha = $event.after
            $expected = $afterSha
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Push run on '$env:GITHUB_REF', not refs/heads/main."
            }
          }
          if ([string]::IsNullOrWhiteSpace($expected) -or $checkedOut -ne $expected) {
            throw "Checked-out $checkedOut does not match the integration candidate $expected."
          }
          if ($eventName -eq 'pull_request' -and $baseSha -match '^[0-9a-fA-F]{40}$') {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "MERGE_COMPILE_BASE_SHA=$baseSha"
          } elseif ($eventName -eq 'push' -and $beforeSha -match '^[0-9a-fA-F]{40}$' -and $beforeSha -notmatch '^0{40}$') {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "MERGE_COMPILE_BASE_SHA=$beforeSha"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Candidate event=$eventName ref=$env:GITHUB_REF sha=$env:GITHUB_SHA run=$env:GITHUB_RUN_ID"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Base=$baseSha Head=$headSha Before=$beforeSha After=$afterSha Expected=$expected"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Checked-out Source SHA=$checkedOut tree=$tree"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Target branch=$targetBranch (main only)"

      - name: Verify shared documentation evidence
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $baseSha = [string]$event.pull_request.base.sha
          $candidateSha = ((git rev-parse HEAD) | Out-String).Trim()
          $prBodyPath = Join-Path $env:RUNNER_TEMP 'merge-compile-pr-body.txt'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($prBodyPath, [string]$event.pull_request.body, $utf8NoBom)
          python -m scripts.work_unit_gate doc-read-evidence --base $baseSha --candidate $candidateSha --pr-body $prBodyPath
          exit $LASTEXITCODE

      # Minimal bootstrap build (I18.21:14). The ELIOT verifier/runner
      # bootstrap is the only unavoidable pre-run exception, so this step builds
      # exactly the owning crate and nothing else; every later verification
      # stage is derived from the resolved profile definition, never from a
      # command list written down in this file.
      - name: Build the verification profile bootstrap
        shell: pwsh
        run: cargo build --locked -p eliot-instrument-runner --bin eliot-profile-resolver

      # Versioned profile admission (issue #1914 W2/W4, I18.21:3). This step
      # calls the SAME shared owner the local entrypoint calls, with the same
      # closed profile alias, so "local profile revision == CI profile revision"
      # is a computed equality rather than a claim in a report. The alias is a
      # name resolved through eliot_instrument_runner::profile::PROFILE_ALIASES;
      # an alias outside that closed table, a missing executable identity, or an
      # absent provenance receipt fails the run here, before any gate executes.
      - name: Resolve the versioned verification profile
        shell: pwsh
        run: |
          $resolverPath = Join-Path $env:CARGO_TARGET_DIR 'debug\eliot-profile-resolver.exe'
          if (-not (Test-Path -LiteralPath $resolverPath -PathType Leaf)) {
            throw "VERIFY_PROFILE_ADMISSION_REFUSED: the shared profile resolver was not built at $resolverPath"
          }
          $targetRoot = $env:CARGO_TARGET_DIR
          $cacheRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE '.cargo') -ErrorAction SilentlyContinue)
          if ($null -eq $cacheRoot) {
            $cacheRoot = Join-Path $env:RUNNER_TEMP 'eliot-pr-check-cache'
            New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
            $cacheRoot = (Resolve-Path $cacheRoot).Path
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'ci-verification-profile-receipt.json'
          $resolverArgs = @(
            '--alias', 'package-verification',
            '--source-root', $env:GITHUB_WORKSPACE,
            '--target-root', $targetRoot,
            '--cache-root', $cacheRoot.Path,
            '--declared-environment', 'eliot-ci-merge-compile',
            '--receipt-out', $receiptPath
          )
          $resolverOutput = @(& $resolverPath @resolverArgs 2>&1)
          $resolverExit = $LASTEXITCODE
          foreach ($resolverLine in $resolverOutput) { Write-Host "VERIFY_PROFILE_RESOLVER: $resolverLine" }
          Write-Host "VERIFY_PROFILE_ALIAS: package-verification exit=$resolverExit"
          if ($resolverExit -ne 0) {
            throw "VERIFY_PROFILE_ADMISSION_REFUSED: the shared resolver refused alias 'package-verification' (exit $resolverExit); no gate runs under an unadmitted profile revision."
          }
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw "VERIFY_PROFILE_ADMISSION_REFUSED: no VerificationProfileReceipt was issued at $receiptPath"
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Versioned verification profile (I18.21)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Alias: package-verification (eliot_instrument_runner::profile::PROFILE_ALIASES)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Revision: $($receipt.profile)@$($receipt.profile_revision) schema=$($receipt.schema.schema)@$($receipt.schema.version)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Profile digest: $($receipt.profile_digest)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Stage DAG digest: $($receipt.dag_digest)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Normalized outcome: $($receipt.outcome); proof ceiling: $($receipt.proof_ceiling)"
          foreach ($tool in @($receipt.tool_identities)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Tool identity: $($tool.stage_id) $($tool.instrument) executable=$($tool.executable) sha256=$($tool.executable_digest)"
          }
          foreach ($dependency in @($receipt.environment_dependencies)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Declared environment dependency: $($dependency.name) expected=$($dependency.expected_class) observed=$($dependency.observed_class)"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Receipt path: $receiptPath (this run's own CI-side receipt; the local run issues the same schema at the same revision)"

      # Quarantined legacy lane (issue #1813 W6): the MergeCompile gates
      # execute cargo/dotnet directly with no governed PER-GATE receipt. The
      # profile ADMISSION above is governed; each gate in the table is not.
      - name: Run MergeCompile verification profile
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Profile MergeCompile

      - name: Record proof ceiling and manifest
        shell: pwsh
        run: |
          $manifestSha = ((git rev-parse HEAD) | Out-String).Trim()
          $lockHash = ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash).Substring(0, 12)
          $toolHash = ((Get-FileHash rust-toolchain.toml -Algorithm SHA256).Hash).Substring(0, 12)
          $ciHash = ((Get-FileHash .github/workflows/ci.yml -Algorithm SHA256).Hash).Substring(0, 12)
          $profileHash = ((Get-FileHash scripts/verify.ps1 -Algorithm SHA256).Hash).Substring(0, 12)
          $rustcIdentity = 'unavailable'
          $cargoIdentity = 'unavailable'
          $dotnetIdentity = 'unavailable'
          $pythonIdentity = 'unavailable'
          try { $rustcIdentity = ((rustc --version) | Out-String).Trim() } catch { $rustcIdentity = 'unavailable' }
          try { $cargoIdentity = ((cargo --version) | Out-String).Trim() } catch { $cargoIdentity = 'unavailable' }
          try { $dotnetIdentity = ((dotnet --version) | Out-String).Trim() } catch { $dotnetIdentity = 'unavailable' }
          try { $pythonIdentity = ((python --version) | Out-String).Trim() } catch { $pythonIdentity = 'unavailable' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Merge Compile Run Manifest"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Repository: $env:GITHUB_REPOSITORY event=$env:GITHUB_EVENT_NAME ref=$env:GITHUB_REF Source SHA=$manifestSha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Runner: os=$env:RUNNER_OS image=$env:ImageOS arch=$env:RUNNER_ARCH"
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Post-merge push run: diagnostic only for the exact landed SHA; never prevention for an already completed merge'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Toolchain: $rustcIdentity / $cargoIdentity / dotnet $dotnetIdentity / $pythonIdentity"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Inputs: Cargo.lock=$lockHash rust-toolchain=$toolHash ci.yml=$ciHash verify.ps1=$profileHash"
          $gwfJson = Join-Path $env:RUNNER_TEMP 'gwf-actions.json'
          python scripts/verify-github-workflows.py --root . --json-out $gwfJson
          if ($LASTEXITCODE -ne 0) { throw "GITHUB_WORKFLOWS_MANIFEST_REJECTED: common verifier failed; no action manifest is published" }
          $gwf = Get-Content -LiteralPath $gwfJson -Raw | ConvertFrom-Json
          if ($gwf.status -ne 'pass') { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: verifier payload status is not pass' }
          $derivedActions = @($gwf.actions | Where-Object { $_.workflow -eq '.github/workflows/ci.yml' } | ForEach-Object { "$($_.action)@$($_.ref)" } | Select-Object -Unique)
          if ($derivedActions.Count -eq 0) { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: derived record holds no action identities for ci.yml' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Actions: " + ($derivedActions -join ', '))
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Python dependencies: hash-locked requirements-verification.txt"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- NuGet: locked-mode restore of Eliot.Operator and Eliot.Operator.Tests packages.lock.json files"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Operator harness: built, zero execution; no Operator test claim"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Profile: MergeCompile (sole gate-definition owner scripts/verify.ps1, closed MergeCompile profile); the versioned verification routes are named only by their closed profile aliases (package-verification, bundle-verification), never as a command list"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Package denominator: exact count bound at runtime by VERIFY_WORKSPACE_MEMBERS and VERIFY_DENOMINATOR lines (cargo metadata --locked --no-deps)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate order: not restated in this file (issue #1914 W4). The single executed gate list is the shared owner's, and the single executed profile admission is the resolver step above, which named the closed alias package-verification and issued this run's receipt. No step in this workflow restates a verifier command list, and no gate exists here that the owner does not select."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate states: every mandatory gate reports pass/fail-exit/fail-exception/cancelled/not-run via VERIFY_GATE; any nonpass fails this check"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Cache: key binds OS+toolchain+lockfile+profile+event-class; fork pull requests restore-only; hit/miss run the same gates; no pass receipt from cache"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Proof ceiling: MERGE_COMPILE_SOURCE_ONLY (compile-only; zero test execution; no lint-cleanliness claim; not Review/release/source-candidate, not installed-runtime/store/Product-Pulse proof)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "MERGE_COMPILE_SOURCE_ONLY"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Omitted: broad unit behavior, installed Windows services, Store correctness/recovery, external providers, release packaging, Product Pulse, live acceptance"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No live Windows/store/Product-Pulse claim."
