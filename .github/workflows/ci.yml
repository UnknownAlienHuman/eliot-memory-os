name: CI

# Catches obvious repository regressions. It deliberately does not re-certify
# the product: no live providers, no credential migration, no OS matrix. If a
# check here needs a running database or a paid API, it does not belong here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TARGET_DIR: ${{ runner.temp }}/eliot-target
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows only: the Governor is a Windows product -- named pipes, Windows
    # Credential Manager, Win32 process identity. A Linux runner would not be
    # testing the same program.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; installing it explicitly
      # keeps the runner from silently using whatever it shipped with.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1 > $null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace --all-targets

      # The server binary is pinned independently from the workspace SDK:
      # crates use SurrealDB SDK 3.2.3, while the official Windows server
      # release available for CI is v3.2.0.
      - name: Provision pinned SurrealDB server 3.2.0
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "User-Agent" = "eliot-memory-os-ci"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/surrealdb/surrealdb/releases/tags/v3.2.0"
          if ($release.tag_name -ne "v3.2.0") {
            throw "Expected release tag v3.2.0, got '$($release.tag_name)'"
          }
          $assets = @(
            $release.assets |
              Where-Object { $_.name -eq "surreal-v3.2.0.windows-amd64.exe" }
          )
          if ($assets.Count -ne 1) {
            throw "Expected one pinned SurrealDB 3.2.0 Windows asset; found $($assets.Count)"
          }
          $surreal = Join-Path `
            $env:RUNNER_TEMP `
            "surreal-v3.2.0.windows-amd64.exe"
          Invoke-WebRequest `
            -Headers @{ "User-Agent" = "eliot-memory-os-ci" } `
            -Uri $assets[0].browser_download_url `
            -OutFile $surreal
          if (-not (Test-Path -LiteralPath $surreal -PathType Leaf)) {
            throw "Pinned SurrealDB executable was not downloaded"
          }
          $expectedDigest = "sha256:9382a851a54df09aaf39c74c0b010a14b09f2565651f620e83c21dc1f1bca8d3"
          $digest = "sha256:$((Get-FileHash -LiteralPath $surreal -Algorithm SHA256).Hash.ToLowerInvariant())"
          if ($digest -ne $expectedDigest) {
            throw "Pinned SurrealDB SHA256 mismatch: got '$digest'"
          }
          $version = (& $surreal version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "^3\.2\.0\b") {
            throw "Expected SurrealDB 3.2.0, got '$version'"
          }
          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "ELIOT_SURREAL_EXE=$surreal"

      - name: Tests
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:ELIOT_SURREAL_EXE) -or
            -not (Test-Path -LiteralPath $env:ELIOT_SURREAL_EXE -PathType Leaf)
          ) {
            throw "ELIOT_SURREAL_EXE is missing"
          }
          $version = (& $env:ELIOT_SURREAL_EXE version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "^3\.2\.0\b") {
            throw "Expected SurrealDB server 3.2.0 before tests, got '$version'"
          }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
