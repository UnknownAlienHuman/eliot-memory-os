name: CI

# Catches obvious repository regressions. It deliberately does not re-certify
# the product: no live providers, no credential migration, no OS matrix. If a
# check here needs a running database or a paid API, it does not belong here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows only: the Governor is a Windows product -- named pipes, Windows
    # Credential Manager, Win32 process identity. A Linux runner would not be
    # testing the same program.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; installing it explicitly
      # keeps the runner from silently using whatever it shipped with.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1 > $null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace --all-targets

      # Unit tests only. The integration tests under `crates/*/tests` need a
      # provisioned local runtime -- a Governor daemon, an authenticated
      # SurrealDB and a git identity -- none of which exist on a runner, so
      # they are out of scope here rather than `#[ignore]`d one by one.
      - name: Unit tests
        run: cargo test --workspace --lib --bins

      # The integration tests that need nothing but the checkout. These are the
      # ones that read source and manifests, and they are exactly the tests that
      # went red unnoticed when the phase-closeout commands were deleted.
      - name: Repository-only integration tests
        run: |
          cargo test -p eliot-engine --test verification_gates
          cargo test -p eliot-engine --test host_integration
          cargo test -p eliot-engine --test collective_blackboard
          cargo test -p eliot-engine --test runtime_services
          cargo test -p eliot-engine --test safety_and_backup
