name: Fast Integration CI

# Catches obvious repository regressions. It deliberately does not re-certify
# the product: no live providers, no credential migration, no OS matrix. If a
# check here needs a running database or a paid API, it does not belong here.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows only: the Governor is a Windows product -- named pipes, Windows
    # Credential Manager, Win32 process identity. A Linux runner would not be
    # testing the same program.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP\eliot-fast-integration-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TERM_VERBOSE=false"

      # rust-toolchain.toml pins the exact version; installing it explicitly
      # keeps the runner from silently using whatever it shipped with.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Metadata
        run: cargo metadata --locked --format-version 1 --no-deps > $null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Default members check
        run: cargo check --locked --all-targets

      - name: Core members check
        run: >-
          cargo check --locked --all-targets
          -p eliot-kernel-core
          -p eliot-engine
          -p eliot-store
          -p eliot-types
          -p eliot-windows-ipc

      - name: Default members clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Core members clippy
        run: >-
          cargo clippy --locked --all-targets
          -p eliot-kernel-core
          -p eliot-engine
          -p eliot-store
          -p eliot-types
          -p eliot-windows-ipc
          -- -D warnings

      - name: Eliot.Operator Release build
        run: dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release
