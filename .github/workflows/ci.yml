name: Pull Request Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  apply_rev10:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 58 && github.event.pull_request.head.ref == 'cognitive-micromodules-wave-01'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cognitive-micromodules-wave-01
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify and apply rev10
        shell: bash
        run: |
          set -euo pipefail
          BASE_MAIN=d5f37f288f8de281b3451019403f37d7e17e6886
          test "$(git merge-base "$BASE_MAIN" HEAD)" = "$BASE_MAIN"
          test -d .eliot/rev10-bootstrap
          test "$(find .eliot/rev10-bootstrap -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 6

          rm -rf /tmp/eliot-rev10
          mkdir -p /tmp/eliot-rev10
          cat .eliot/rev10-bootstrap/part-*.b64 | tr -d '\r\n' | base64 -d > /tmp/eliot-rev10/payload.tar.xz
          tar -xJf /tmp/eliot-rev10/payload.tar.xz -C /tmp/eliot-rev10

          VALIDATION="$(find /tmp/eliot-rev10 -type f -path '*/overlay/validation.json' -print -quit)"
          test -n "$VALIDATION"
          ROOT="$(dirname "$(dirname "$VALIDATION")")"
          test -d "$ROOT/repo"

          python3 - "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys, tomllib
          root = pathlib.Path(sys.argv[1])
          repo = root / 'repo'
          validation = json.loads((root / 'overlay' / 'validation.json').read_text())
          assert validation['status'] == 'PASS'
          assert validation['current_main_seen'] == 'd5f37f288f8de281b3451019403f37d7e17e6886'
          assert validation['proof_ceiling'] == 'STATIC_FUNCTION_DESIGN_ONLY'
          assert validation['counts']['files'] == 198
          assert validation['counts']['api_specs'] == 65
          assert validation['counts']['assignments'] == 65
          assert validation['counts']['function_edges'] == 137
          assert validation['counts']['product_pulses'] == 8
          expected = validation['payload_sha256']
          files = sorted(p for p in repo.rglob('*') if p.is_file())
          rels = {p.relative_to(repo).as_posix() for p in files}
          assert len(files) == 198
          assert rels == set(expected)
          for path in files:
              rel = path.relative_to(repo).as_posix()
              assert path.suffix == '.toml', rel
              tomllib.loads(path.read_text())
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              assert got == expected[rel], (rel, got, expected[rel])
          assert not any(rel.endswith('.rs') or rel.endswith('.md') for rel in rels)
          assert 'Cargo.toml' not in rels and 'Cargo.lock' not in rels
          PY

          cp -a "$ROOT/repo/." .
          rm -f crates/smart/.audit-probe
          rm -rf crates/smart/eliot-dreamer-candidate-validation
          rm -rf crates/smart/eliot-dreamer-memory-repair
          rm -f crates/smart/eliot-dreamer-contracts/module.toml
          rm -f crates/smart/eliot-context-contracts/module.toml
          rm -f crates/smart/eliot-learning-contracts/module.toml

          git add crates/governor/eliot-observation crates/meta/eliot-improvement crates/meta/eliot-learning-activation-assessment crates/smart
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -E '\.(rs|md)$|^Cargo\.toml$|^Cargo\.lock$' || true)"
          test -z "$bad" || { printf 'Forbidden staged paths:\n%s\n' "$bad"; exit 1; }
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'prototype(smart): pin all cognitive function designs'
          git push origin HEAD:cognitive-micromodules-wave-01

  check:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$testTemp\eliot-pr-check-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run current bounded repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1

      - name: Build Eliot.Operator
        run: dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release

      - name: Record proof ceiling
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'PR_INTEGRATION_SOURCE_CHECK_ONLY'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No live Windows/store/Product-Pulse claim.'
