name: Fast Integration CI

# Catches obvious repository regressions. It deliberately does not re-certify
# the product: no live providers, no credential migration, no OS matrix. If a
# check here needs a running database or a paid API, it does not belong here.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows only: the Governor is a Windows product -- named pipes, Windows
    # Credential Manager, Win32 process identity. A Linux runner would not be
    # testing the same program.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          # Windows security tests bind caller paths to OS-resolved handles.
          # The hosted account's default TEMP may use a DOS 8.3 alias, so use
          # the runner-owned canonical temp contour for every later process.
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$testTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$testTemp\eliot-fast-integration-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TERM_VERBOSE=false"

      # rust-toolchain.toml pins the exact version; installing it explicitly
      # keeps the runner from silently using whatever it shipped with.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Workspace topology baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          if ($metadata.packages.Count -ne 125) {
            throw "Expected 125 workspace packages, observed $($metadata.packages.Count)"
          }
          if ($metadata.workspace_default_members.Count -ne 6) {
            throw "Expected 6 default members, observed $($metadata.workspace_default_members.Count)"
          }
          "workspace_packages=$($metadata.packages.Count) default_members=$($metadata.workspace_default_members.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # cargo-deny 0.20.2 is pinned to the official release dated 2026-07-09.
      - name: Install pinned cargo-deny
        shell: pwsh
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          $cargoDeny = (Get-Command cargo-deny -ErrorAction Stop).Source
          $version = (& cargo-deny --version).Trim()
          if ($version -notmatch '^cargo-deny 0\.20\.2(?:\s|$)') {
            throw "Unexpected cargo-deny identity: $version"
          }
          $sha256 = (Get-FileHash -LiteralPath $cargoDeny -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "cargo-deny version: $version"
            "cargo-deny path: $cargoDeny"
            "cargo-deny sha256: $sha256"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Versioned local verification profile
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1

      - name: Eliot.Operator Release build
        run: dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release
