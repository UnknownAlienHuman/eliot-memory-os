name: Runtime017 primary validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/runtime017-conformance

permissions:
  contents: read

jobs:
  primary:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run one bounded primary validation/build contour
        shell: pwsh
        run: >-
          ./scripts/run-runtime017-primary.ps1
          -TargetRoot "${{ runner.temp }}/eliot-runtime017-primary"
          -ReportRoot "${{ runner.temp }}/eliot-runtime017-report"

      - name: Upload compact reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime017-primary-${{ github.sha }}
          path: ${{ runner.temp }}/eliot-runtime017-report
          if-no-files-found: error
          retention-days: 7
