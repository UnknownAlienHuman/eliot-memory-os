name: Manual Repository Policy Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-and-authority-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate branch identity, issue, and current-main ancestry
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pattern='^(work|fix|docs|chore|refactor|test)/([0-9]+)-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ "$HEAD_BRANCH" == 'main' ]]; then
            exit 0
          fi

          if [[ ! "$HEAD_BRANCH" =~ $pattern ]]; then
            echo "Branch '$HEAD_BRANCH' is not issue-numbered."
            echo "Use <work|fix|docs|chore|refactor|test>/<issue>-<slug>."
            exit 1
          fi

          issue_number="${BASH_REMATCH[2]}"
          issue_state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq '.state')"
          issue_is_pr="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq 'has("pull_request")')"
          if [[ "$issue_state" != 'open' || "$issue_is_pr" != 'false' ]]; then
            echo "Branch issue #${issue_number} is not an open issue."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Current origin/main is not an ancestor of this branch."
            echo "Refresh from main before additional mutation or integration."
            exit 1
          fi

      - name: Validate authority receipts and active work registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          pair = tomllib.loads(pathlib.Path('docs/normative-pair.toml').read_text(encoding='utf-8'))
          active = tomllib.loads(pathlib.Path('workstreams/ACTIVE.toml').read_text(encoding='utf-8'))
          inventory = json.loads(pathlib.Path('workstreams/core-daemons/inventory.json').read_text(encoding='utf-8'))

          assert pair['status'] == 'accepted'
          assert pair['repository_authority_branch'] == 'main'
          assert active['authority_branch'] == 'main'
          assert active['branch_policy']['standard_branch_requires_open_issue'] is True
          assert active['branch_policy']['requires_current_main_ancestor'] is True
          assert active['branch_policy']['one_issue_one_branch_one_pr'] is True
          assert active['branch_policy']['unlisted_branch_mutation_allowed'] is False
          assert active.get('exception_branch', []) == []
          assert all(w['status'] == 'active' for w in active['workstream'])
          assert all(w['branch_strategy'] == 'fresh_per_issue_from_current_main' for w in active['workstream'])
          core_daemons = next(w for w in active['workstream'] if w['id'] == 'core-daemons')
          defect_sets = {}
          for field in ['confirmed_open_defect_refs', 'merged_source_fix_refs', 'forbidden_active_defect_refs']:
              if field in core_daemons:
                  defect_sets[field] = core_daemons[field]
          for name, refs in defect_sets.items():
              assert refs == sorted(set(refs)), f'{name} must be sorted and duplicate-free'
          names = list(defect_sets)
          for index, name in enumerate(names):
              for other_name in names[index + 1:]:
                  assert set(defect_sets[name]).isdisjoint(defect_sets[other_name]), (
                      f'{name} overlaps {other_name}'
                  )
          assert inventory['authority']['branch'] == 'main'

          # The capability-cell contract is a non-normative projection, so it is
          # validated by its own declared schema and by the inventory source it
          # names. No historical issue number carries authority here: the
          # contract is whatever the current workstream routing record produces.
          registry_path = pathlib.Path('workstreams/core-daemons/capability-cell-registry.contract.toml')
          if registry_path.is_file():
              reg = tomllib.loads(registry_path.read_text(encoding='utf-8'))
              assert reg.get('schema') == 'eliot.capability-cell-registry-implementation.v1'
              inventory_source = pathlib.Path(reg['inventory_source']['path'])
              assert inventory_source.is_file(), inventory_source

          required = [
              '.github/README.md',
              '.github/workflows/ci.yml',
              '.github/workflows/repository-policy.yml',
              '.github/workflows/source-candidate.yml',
              'scripts/README.md',
          ]
          for item in required:
              assert pathlib.Path(item).is_file(), item

          # Declared workstream inputs are derived from the current routing
          # record, never from a literal filename list here, so an obsolete
          # cognitive-map name cannot become policy authority and a new one is
          # covered without editing this workflow. A declared brief or inventory
          # that is present must be readable, and a declared TOML record must
          # parse; a retired or not-yet-created one is not a policy failure,
          # because its own owner disposition owns its removal (I0.8: an
          # unresolved item blocks its own deletion, not unrelated work).
          for workstream in active['workstream']:
              for key in ('briefs', 'inventories'):
                  for declared in workstream.get(key, []):
                      declared_path = pathlib.Path(declared)
                      if not declared_path.is_file():
                          continue
                      text = declared_path.read_text(encoding='utf-8')
                      assert text.strip(), declared
                      if declared_path.suffix == '.toml':
                          assert isinstance(tomllib.loads(text), dict), declared

          # Standalone-crate package/owner denominator. The denominator is
          # discovered from the tree by the accepted rule (the discovery
          # scripts/verify-standalone-crates.py --list applies: a manifest
          # carrying both [package] and [workspace] that is neither a root
          # workspace member nor a root workspace exclude entry), and every
          # discovered package must carry an explicit owner disposition in the
          # accepted record. Nothing here is a package list, count or issue
          # number.
          dispositions = tomllib.loads(
              pathlib.Path('workstreams/security/standalone-crate-dispositions.toml').read_text(encoding='utf-8')
          )
          allowed_dispositions = set(dispositions['allowed_dispositions'])
          disposition_rows = {}
          for row in dispositions.get('crate', []):
              assert row['path'] not in disposition_rows, f"duplicate disposition path {row['path']}"
              disposition_rows[row['path']] = row
          workspace = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']
          members = set(workspace.get('members', []))
          excluded = set(workspace.get('exclude', []))
          discovered = set()
          for manifest in sorted(pathlib.Path('.').rglob('Cargo.toml')):
              if any(part in ('target', 'testdata', 'fixtures') for part in manifest.parts):
                  continue
              text = manifest.read_text(encoding='utf-8')
              if '[package]' not in text or '[workspace]' not in text:
                  continue
              relative = manifest.parent.as_posix()
              if relative in members or relative in excluded:
                  continue
              discovered.add(relative)

          # An unknown or unclassified package is a failure, never a silent pass.
          unclassified = sorted(discovered - set(disposition_rows))
          assert not unclassified, f'standalone packages without an owner disposition: {unclassified}'
          # A recorded package may be absent from the tree only with an accepted
          # retirement disposition; any other absence is arbitrary source
          # deletion and stays malformed.
          for relative in sorted(set(disposition_rows) - discovered):
              verb = disposition_rows[relative]['disposition']
              assert verb == 'RETIRE', (
                  f'{relative} is absent from the tree without an accepted RETIRE '
                  f'disposition (recorded {verb})'
              )
          for relative in sorted(discovered):
              row = disposition_rows[relative]
              assert row['disposition'] in allowed_dispositions, (
                  f"{relative} records undeclared disposition {row['disposition']!r}"
              )
              assert str(row.get('owner', '')).strip(), f'{relative} has no owner in the disposition record'
          PY

      - name: Reject retired authority and campaign surfaces
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            '.eliot'
            '.codebase-memory'
            'research'
            'reports'
            'swarm'
            'docs/tasks'
            'docs/normative'
            'docs/conformance.toml'
            'docs/UNIMPLEMENTED.md'
            'docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md'
            'docs/architecture/ELIOT_IMPLEMENTATION_ENGLISH_FINAL_2026-08-28.md'
            'docs/operations/BRANCH_INTEGRATION_CLEANUP_HANDOFF_2026-08-28.md'
            'docs/operations/M5_OPERATIONS_RUNBOOK.md'
            'docs/operations/PRODUCTION_CUTOVER_RUNBOOK.md'
            'docs/operations/RUNTIME_LIVE_V3_HANDOFF_2026-08-22.md'
            'COGNITIVE_COMPLETION_RECOVERY_PROGRESS.md'
            'UL_PROGRESS.md'
            'crates/smart/.audit-probe'
            '.github/workflows/runtime017-primary.yml'
            '.github/workflows/candidate-release.yml'
            'scripts/gen-composition-roots.ps1'
            'scripts/verify-composition-roots.ps1'
            'scripts/gen-conformance.ps1'
            'scripts/verify-conformance.ps1'
            'scripts/gen-contour-cut.ps1'
            'scripts/verify-contour-cut.ps1'
            'scripts/gen-module-manifests.ps1'
            'scripts/verify-module-manifests.ps1'
            'scripts/gen-unimplemented.ps1'
            'scripts/verify-unimplemented.ps1'
            'scripts/measure-stu.ps1'
            'scripts/run-cognitive-field-certification.ps1'
            'scripts/run-runtime017-primary.ps1'
            'scripts/run-ul-cross-agent-certification.ps1'
            'scripts/test-m5-isolated-operations.ps1'
            'scripts/plan-eliot-production-cutover.ps1'
          )

          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Retired authority/campaign surface is present: $path"
              exit 1
            fi
          done

      - name: Verify canonical normative identity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-normative.ps1

      - name: Reject stale links in current routing surfaces
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            AGENTS.md
            WORKFLOW.md
            .github/README.md
            docs/README.md
            docs/ARCHITECTURE_CONTRACT.md
            docs/PROJECT_MAP.md
            docs/architecture/README.md
            docs/architecture/INDEX.md
            docs/operations/README.md
            scripts/README.md
            workstreams/README.md
            workstreams/ACTIVE.toml
            workstreams/core-daemons/AGENTS.md
          )

          if grep -nE 'reports/audit/|docs/normative/|RECOVERY_PROGRAM_v1|ELIOT_(ARCHITECTURE|IMPLEMENTATION)_ENGLISH_FINAL_2026-08-28|PR #26 is the sole active|candidate-release\.yml' "${files[@]}"; then
            echo 'Stale authority/reference detected in a current routing surface.'
            exit 1
          fi

          if git grep -nE 'docs/normative/|ELIOT_(ARCHITECTURE|IMPLEMENTATION)_ENGLISH_FINAL_2026-08-28' \
            -- ':!config/doc-code-conformance.toml' \
               ':!scripts/doc_code_conformance_core.py' \
               ':!scripts/docs_closure_audit.py' \
               ':!scripts/docs_shards_core.py' \
               ':!.github/workflows/repository-policy.yml'; then
            echo 'Stale normative reference detected across active tracked tree.'
            exit 1
          fi

      - name: Verify workflow trigger policy, profile wiring, least privilege, cache safety, source-candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import pathlib
          import re
          import sys

          failures = []

          def fail(area, detail):
              failures.append(f'POLICY_{area}_FAILURE: {detail}')

          # One owner for trigger and action-reference reading: this gate reads
          # the same module the common verifier does, so the two cannot disagree
          # about which events a workflow declares or which `uses:` values a
          # workflow references. The module is registered in sys.modules before
          # execution because its frozen dataclass resolves its module there.
          _owner_name = 'verify_github_workflows'
          _owner_spec = importlib.util.spec_from_file_location(
              _owner_name,
              pathlib.Path('scripts/verify-github-workflows.py'),
          )
          _owner = importlib.util.module_from_spec(_owner_spec)
          sys.modules[_owner_name] = _owner
          _owner_spec.loader.exec_module(_owner)

          def on_children(text):
              # The top-level `on:` event set, read by the common verifier.
              return set(_owner.parse_workflow_events(text))

          harness_execution_re = re.compile(r'dotnet\s+(run|exec)\b[^\n]*Eliot\.Operator\.Tests')
          non_execution_command_re = re.compile(r'(?<![\w.-])(echo|write-host|write-output|printf)(?![\w-])', re.IGNORECASE)
          harness_command_prefix_re = re.compile(
              r'''(?ix)^
              [\s|>&;]*
              (?:-\s+)?
              (?:run:\s*)?
              (?:[|>&;]+\s*|&&\s*|\|\|\s*)*
              (?:&\s*)?
              (?:(?:pwsh(?:\.exe)?|powershell(?:\.exe)?|sh|bash|cmd(?:\.exe)?|/bin/(?:sh|bash))
                 (?:\s+[^\s|>&;]+)*\s+(?:-c(?:ommand)?\s+)?)?
              $''')
          # The claim marker is assembled from fragments at runtime: this file
          # is itself scanned by the closed `operator_harness_executed` check
          # below, and a literal copy of the marker here would make this
          # workflow report an execution claim it does not make. The same
          # reason the two keys below are split.
          operator_execution_claim = 'Operator tests: ' + 'executed'
          # Shell-level failure suppression (issue #1225 N_step5), mirrored from
          # scripts/verify-github-workflows.py: an invocation whose result cannot
          # reach the step's exit status is not terminal evidence. `||`/`|`
          # replace a failure with another status and a trailing `&` detaches the
          # harness, so the run can report success over a harness that never
          # reached its result; a bare `exit 0` as the statement right after the
          # invocation does the same before anything observes the exit code. The
          # `&` of a `2>&1` redirection is excluded, and a guarded block is not
          # this shape.
          harness_failure_suppression_re = re.compile(r'\|(?!\|)|(?<!>)&(?!&)')
          harness_exit_override_re = re.compile(r'^exit\s+0$', re.IGNORECASE)
          # Execution conditions (issue #1225 N_step5), mirrored verbatim from
          # scripts/verify-github-workflows.py: an invocation line is executed
          # evidence only when the step that carries it can actually execute and
          # its result reaches the run. The soft-failure and timeout keys are
          # assembled at runtime from the same fragments the closed scan above
          # uses, so this step's own source keeps passing that scan.
          soft_failure_key = 'continue-' + 'on-' + 'error'
          timeout_key = 'timeout-' + 'minutes'

          def _strip_expression_braces(body):
              return body.replace('$', '').replace('{', '').replace('}', '').strip()

          def _strip_comment(text):
              return text.split('#', 1)[0]

          def _strip_quotes(text):
              return text.strip().strip('\'"')

          def _condition_is_falsy(expression):
              # True when a GitHub `if:` condition provably evaluates to false:
              # an empty condition (`if:`, `if: ${{ }}`, `if: null`) or a value
              # that is `false` or numeric zero. Any other condition is not
              # proof of a skip, so it stays unverifiable rather than a licence
              # to claim execution.
              value = _strip_quotes(_strip_comment(_strip_expression_braces(expression)))
              text = value.strip()
              if text in ('', 'null'):
                  return True
              if text.lower() == 'false':
                  return True
              try:
                  return float(text) == 0.0
              except ValueError:
                  return False

          def _condition_is_unconditional(expression):
              # True when a GitHub `if:` condition runs the step on every
              # dispatch. An absent condition, the literals `true`/`always()`,
              # and a comparison whose two sides are identical all run the step
              # whatever the run looks like. Any other condition depends on
              # something the workflow does not fix at authoring time, so it is
              # a condition the claim may not assume holds.
              value = _strip_quotes(_strip_comment(_strip_expression_braces(expression)))
              text = value.strip()
              if text in ('', 'true', 'always', 'always()'):
                  return True
              left, separator, right = text.partition('==')
              if separator and left.strip() and left.strip() == right.strip():
                  return True
              return False

          def _yaml_key(line):
              # The YAML mapping key of a line, or None when it carries none: an
              # optionally quoted key, any spacing before the `:`, and either a
              # value or a block indicator after it. Block-scalar shell source,
              # list items and comments carry no key.
              match = re.match(r'^\s*(?:-\s+)?(?:"([^"]*)"|\'([^\']*)\'|([^\s#:][^:]*?))\s*:(?:\s|$)', line)
              if match is None:
                  return None
              for group in (match.group(1), match.group(2), match.group(3)):
                  if group is not None:
                      return group.strip()
              return None

          def _yaml_value(line):
              # The scalar value written on a mapping line, or '' for a block
              # indicator.
              _, separator, tail = line.partition(':')
              if not separator:
                  return ''
              tail = tail.strip()
              if tail in ('|', '>', '|-', '>-', '|+', '>+'):
                  return ''
              return _strip_quotes(_strip_comment(tail))

          def _is_yaml_comment(line):
              stripped = line.lstrip()
              return stripped == '' or stripped.startswith('#')

          def _is_step_entry(line):
              # True for a YAML block-sequence entry (`      - name: ...`).
              stripped = line.lstrip(' ')
              return stripped.startswith('- ') or stripped.rstrip() == '-'

          def _enclosing_job_block(lines, index, indent):
              # Line indexes of the job body that owns a step at `indent`.
              # A YAML mapping is unordered, so the owning job's body is every
              # mapping line at the job-body indentation: above the `steps:`
              # container up to the shallower job header, and below the steps
              # block down to the next shallower mapping line. Every governing
              # `if:`/soft-failure/timeout key in that body is returned, so a
              # skipped or soft-failure job is seen no matter which key carries
              # it or where in the job body the key is written.
              governing = []
              body_indent = None
              for previous in range(index, -1, -1):
                  line = lines[previous]
                  if _is_yaml_comment(line):
                      continue
                  key = _yaml_key(line)
                  if key is None:
                      continue
                  leading = len(line) - len(line.lstrip(' '))
                  if leading >= indent:
                      continue
                  if body_indent is not None and leading < body_indent:
                      # Shallower than a job-body key: this is the job header, so
                      # the job body ends and nothing above it governs the step.
                      break
                  governing.append(previous)
                  if key == 'steps':
                      body_indent = leading
              if body_indent is not None:
                  # A job-level key may also be written after the `steps:` block
                  # (the mapping is unordered and GitHub still reads it as a job
                  # condition), so collect the job-body keys below the step too.
                  # Deeper lines are step content; the first shallower mapping
                  # line ends the job body.
                  for following in range(index + 1, len(lines)):
                      line = lines[following]
                      if _is_yaml_comment(line):
                          continue
                      key = _yaml_key(line)
                      if key is None:
                          continue
                      leading = len(line) - len(line.lstrip(' '))
                      if leading > body_indent:
                          continue
                      if leading < body_indent:
                          break
                      governing.append(following)
                  return governing

          def _nearest_list_item(lines, index):
              # The index of the nearest block-sequence entry at or above `index`.
              for previous in range(index, -1, -1):
                  if not _is_yaml_comment(lines[previous]) and _is_step_entry(lines[previous]):
                      return previous
              return None

          def _own_block_end(lines, item):
              # The last line index of the block owned by the sequence entry at
              # `item`: every following line that is blank, a comment, or
              # indented deeper than the entry's dash. The first same-indent
              # sibling ends the block.
              indent = len(lines[item]) - len(lines[item].lstrip(' '))
              last = item
              for index in range(item + 1, len(lines)):
                  line = lines[index]
                  if _is_yaml_comment(line):
                      continue
                  if len(line) - len(line.lstrip(' ')) > indent:
                      last = index
                      continue
                  break
              return last

          def _own_block(lines, item):
              # Line indexes from the sequence entry at `item` to the end of its
              # block.
              return list(range(item, _own_block_end(lines, item) + 1))

          def _enclosing_step_scope(lines, index):
              # The index of the sequence entry that owns the invocation at
              # `index`. A step's `run`/`uses` body belongs to its own sequence
              # entry, so the owning entry is the nearest one whose block still
              # covers `index`. The index is resolved to that entry's line, so an
              # identical repeated mapping line never resolves to a later,
              # unrelated block.
              item = _nearest_list_item(lines, index)
              if item is None:
                  return None
              if index > _own_block_end(lines, item):
                  return None
              return item

          def _overrides_harness_status(lines, index):
              # True when the statement immediately after the invocation
              # discards the harness status. Only that statement can be reached
              # before anything has observed the exit code, so a bare `exit 0`
              # there replaces a failure with success; a block that guards the
              # exit first has already converted the failure and is left alone.
              for follow in range(index + 1, len(lines)):
                  code = re.sub(r'"[^"]*"', '', lines[follow])
                  code = re.sub(r"'[^']*'", '', code)
                  code = code.split('#', 1)[0].strip()
                  if not code:
                      continue
                  return harness_exit_override_re.match(code) is not None
              return False

          def _harness_invocations(lines):
              # (owning sequence entry, invocation line) for every real
              # invocation: `dotnet` at command position, not a print-builtin
              # argument, with quoted prose and comments stripped, and with a
              # result that can still reach the step's exit status.
              invocations = []
              for index, line in enumerate(lines):
                  code = re.sub(r'"[^"]*"', '', line)
                  code = re.sub(r"'[^']*'", '', code)
                  code = code.split('#', 1)[0]
                  match = harness_execution_re.search(code)
                  if match is None:
                      continue
                  before = code[:match.start()]
                  if non_execution_command_re.search(before):
                      continue
                  if not harness_command_prefix_re.match(before):
                      continue
                  if harness_failure_suppression_re.search(code[match.end():]):
                      continue
                  if _overrides_harness_status(lines, index):
                      continue
                  scope = _enclosing_step_scope(lines, index)
                  if scope is None:
                      continue
                  invocations.append((scope, index))
              return invocations

          def _mapping_value_is_falsy(line):
              # True when a governing `if:` is provably false, or carries no
              # value at all (`if:`, `if: ${{ }}`).
              value = _yaml_value(line)
              if value == '':
                  return True
              return _condition_is_falsy(value)

          def _step_executes(scope, lines):
              # True when the step carrying the invocation can execute and
              # report. The step's own `if:`/soft-failure/timeout keys govern
              # it, and so does the job that owns it: a job whose `if:` is false
              # never reaches its steps, and a soft-failure job discards their
              # results. A step timeout is a bound rather than a skip, so only a
              # degenerate bound of zero refuses. An `if:` runs the step on every
              # dispatch only when it is unconditional; any other condition may
              # skip the step, so it cannot carry an execution claim.
              indent = len(lines[scope]) - len(lines[scope].lstrip(' '))
              governing = _enclosing_job_block(lines, scope - 1, indent)
              governing.extend(_own_block(lines, scope))
              for index in governing:
                  key = _yaml_key(lines[index])
                  if key is None:
                      continue
                  normalized = key.replace('_', '-').lower()
                  if normalized == soft_failure_key:
                      return False
                  if normalized == timeout_key:
                      if _mapping_value_is_falsy(lines[index]):
                          return False
                      continue
                  if key.lower() == 'if':
                      value = _yaml_value(lines[index])
                      if _condition_is_falsy(value):
                          return False
                      if not _condition_is_unconditional(value):
                          return False
                      continue
              return True

          def operator_harness_executed(text):
              # Issue #1225 N_step5: execution is an explicit dotnet run/exec
              # of the Eliot.Operator.Tests harness with dotnet at command
              # position. A step name, quoted prose, a run-summary claim, or
              # a harness-shaped mention passed to a print builtin
              # (echo/Write-Host bypass, quoted or not) is not execution:
              # quoted literals and comments are stripped so only real
              # invocations count.
              #
              # An invocation is execution evidence only when its step can
              # actually execute and its result can reach the run. A step that
              # is conditionally skipped, soft-failure, or bounded by a step
              # timeout discards the harness result, so the run-summary claim
              # is compared against a nonzero executed denominator: an
              # invocable line whose step never executes satisfies that claim
              # for nothing. The shell must pass the harness result on too: a
              # `||`/`|` suppression or a detached `&` after the invocation,
              # and a bare `exit 0` as the statement right after it, all
              # replace a harness failure with success before anything can
              # observe it, so they are not terminal evidence either.
              lines = text.splitlines()
              invocations = _harness_invocations(lines)
              if not invocations:
                  return False
              claim_index = text.find(operator_execution_claim)
              if claim_index < 0:
                  # No execution claim: coverage needs a step that executes.
                  return any(_step_executes(scope, lines) for scope, _index in invocations)
              # A claim is only satisfied by an executing invocation that
              # precedes it: the evidence must be produced before the summary
              # line asserts the result.
              claim_line = text.count('\n', 0, claim_index) + 1
              return any(
                  scope < claim_line and _step_executes(scope, lines)
                  for scope, _index in invocations
              )

          workflow_dir = pathlib.Path('.github/workflows')
          workflows = sorted(workflow_dir.glob('*.yml'))
          if not workflows:
              fail('TRIGGER', 'no workflow files found')

          # Closed per-workflow trigger policy (accepted issue #3004):
          # workflow_dispatch-only default; ci.yml is the sole automatic
          # exception with main-scoped pull_request/push.
          trigger_policy = {
              'ci.yml': {'workflow_dispatch', 'pull_request', 'push'},
          }
          for path in workflows:
              text = path.read_text(encoding='utf-8')
              children = on_children(text)
              expected = trigger_policy.get(path.name, {'workflow_dispatch'})
              if children != expected:
                  fail('TRIGGER', f'{path.as_posix()} on-children={sorted(children)} expected={sorted(expected)}')

          ci = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          policy_text = pathlib.Path('.github/workflows/repository-policy.yml').read_text(encoding='utf-8')
          sc_text = pathlib.Path('.github/workflows/source-candidate.yml').read_text(encoding='utf-8')
          just = pathlib.Path('Justfile').read_text(encoding='utf-8')
          verify = pathlib.Path('scripts/verify.ps1').read_text(encoding='utf-8')

          # ci.yml exception scope: main-only automatic events, required PR
          # activity coverage, no wider trigger classes, no dispatch inputs.
          if ci.count('branches: [main]') != 2:
              fail('TRIGGER', 'ci.yml pull_request/push must each target branches [main]')
          for banned_trigger in ('pull_request_target', 'schedule:', 'release:', 'merge_group', 'workflow' + '_call', 'repository_dispatch'):
              if banned_trigger in ci:
                  fail('TRIGGER', f'ci.yml carries forbidden trigger {banned_trigger}')
          for required_type in ('opened', 'synchronize', 'reopened', 'ready_for_review'):
              if required_type not in ci:
                  fail('TRIGGER', f'ci.yml pull_request misses required type {required_type}')

          # Exact wiring: one MergeCompile invocation in ci.yml, closed
          # profiles only; Justfile keeps its Review aliases plus the
          # merge-compile alias.
          mergecompile_invocation = 'pwsh -NoProfile -File scripts/verify.ps1 -Profile MergeCompile'
          if ci.count(mergecompile_invocation) != 1:
              fail('WIRING', 'ci.yml must invoke the MergeCompile profile exactly once')
          verify_refs = [ln for ln in ci.splitlines() if 'verify.ps1' in ln]
          if len(verify_refs) != 5:
              fail('WIRING', 'ci.yml must reference verify.ps1 on exactly 5 lines (invocation, cache binding, receipt digest, owner mention, inputs digest)')
          for line in verify_refs:
              if 'run: pwsh -NoProfile -File scripts/verify.ps1 -Profile MergeCompile' in line:
                  continue
              if 'hashFiles' in line and 'scripts/verify.ps1' in line:
                  continue
              if 'Get-FileHash scripts/verify.ps1' in line:
                  continue
              if 'gate-definition owner scripts/verify.ps1' in line:
                  continue
              if 'verify.ps1=$profileHash' in line:
                  continue
              fail('WIRING', 'ci.yml has a verify.ps1 reference outside the closed roles')
          if '-Profile Review' in ci or '-Profile Quick' in ci:
              fail('WIRING', 'ci.yml must not select the Review/Quick profiles')
          for recipe, marker in (('verify', '-Profile Review'), ('verify-review', '-Profile Review'), ('verify-list', '-List'), ('merge-compile', '-Profile MergeCompile')):
              block = re.search(rf'(?m)^{recipe}:\s*\n((?:[ \t]+[^\n]*\n?)+)', just)
              if not block or marker not in block.group(1):
                  fail('WIRING', f'Justfile {recipe} must select {marker}')
          verify_body = re.search(r'(?m)^verify:\s*\n((?:[ \t]+[^\n]*\n?)+)', just)
          if verify_body and '-Profile Quick' in verify_body.group(1):
              fail('WIRING', 'Justfile verify must not select the Quick profile')

          # Retained bounded baseline: just quick keeps its pinned oracle deps
          # (mirrors scripts/docs_closure_audit.py DOC-GATE-JUST) and never
          # carries Review-only markers.
          quick_match = re.search(r'(?m)^quick:\s*(.+)$', just)
          if not quick_match:
              fail('WIRING', 'Justfile has no quick recipe line')
          else:
              quick_deps = quick_match.group(1)
              for target in ('doc-code-conformance-self-test', 'doc-code-conformance'):
                  if target not in quick_deps:
                      fail('WIRING', f'just quick lost retained baseline target {target}')
              for banned in ('cargo-clippy-workspace', 'cargo-test-workspace', 'cargo-deny', '-Profile Review'):
                  if banned in quick_deps:
                      fail('WIRING', f'just quick must not carry Review-only marker {banned}')

          # verify.ps1 owns the closed profiles; retired skips stay rejected.
          if "[ValidateSet('Quick', 'Review', 'MergeCompile')]" not in verify:
              fail('WIRING', 'verify.ps1 must own the closed Quick/Review/MergeCompile profiles')
          if 'SkipCargoCheck' not in verify or 'VERIFY_REJECTED' not in verify:
              fail('WIRING', 'verify.ps1 must explicitly reject the retired skip switch')
          if 'SkipCargoCheck' in just or 'SkipCargoCheck' in ci:
              fail('WIRING', 'retired skip switch must not be wired in Justfile/ci.yml')

          # Review cargo tail order inside the single gate-definition owner.
          tail = [
              'cargo metadata --locked --no-deps --format-version 1',
              'cargo fmt --check',
              'cargo check --locked --workspace --all-targets',
              'cargo clippy --locked --workspace --all-targets -- -D warnings',
              'cargo test --locked --workspace',
              'cargo deny check',
          ]
          positions = [verify.find(anchor) for anchor in tail]
          if any(pos < 0 for pos in positions):
              fail('WIRING', 'Review cargo tail has a missing gate definition')
          elif any(later <= earlier for earlier, later in zip(positions, positions[1:])):
              fail('WIRING', 'Review cargo tail is out of order')

          # MergeCompile tail order inside the single gate-definition owner:
          # denominator, no-run test compile, bounded changed-package clippy,
          # standalone compile, locked Operator restore/build. Zero execution
          # and no lint oracle anywhere in the compile-only class.
          merge_tail = [
              "Name = 'cargo-denominator'",
              'cargo test --locked --workspace --all-targets --no-run',
              "Name = 'cargo-clippy-changed'",
              '--mode compile',
              'dotnet restore',
              'dotnet build',
          ]
          merge_positions = [verify.find(anchor) for anchor in merge_tail]
          if any(pos < 0 for pos in merge_positions):
              fail('WIRING', 'MergeCompile tail has a missing gate definition')
          elif any(later <= earlier for earlier, later in zip(merge_positions, merge_positions[1:])):
              fail('WIRING', 'MergeCompile tail is out of order')
          for execution_marker in ('dotnet run', 'dotnet test'):
              if execution_marker in verify or execution_marker in ci:
                  fail('WIRING', f'compile-only class must not execute tests ({execution_marker})')
          if 'MERGE_COMPILE_SOURCE_ONLY' not in verify or 'MERGE_COMPILE_SOURCE_ONLY' not in ci:
              fail('WIRING', 'MergeCompile proof ceiling marker is missing')

          # Least privilege on owned workflows (checks run against file
          # content, so this step's own source must also stay clean).
          for name, text in (('ci.yml', ci), ('repository-policy.yml', policy_text), ('source-candidate.yml', sc_text)):
              if re.search(r':\s*write\b', text) or re.search(r':\s*admin\b', text):
                  fail('PRIVILEGE', f'{name} grants elevated capability')
              if 'persist-credentials: false' not in text:
                  fail('PRIVILEGE', f'{name} checkout must not persist credentials')
              if 'secret' + 's.' in text:
                  fail('PRIVILEGE', f'{name} references secret material')
              if 'id-' + 'token:' in text:
                  fail('PRIVILEGE', f'{name} requests OIDC authority')
              if 'continue-' + 'on-error' in text:
                  fail('WIRING', f'{name} must not soften gate failure')

          # Cache safety: key binds OS, toolchain, lockfile, profile, and
          # event class; fork PRs restore without saving; one ungated run.
          key_lines = [line for line in ci.splitlines() if 'hashFiles' in line and 'Cargo.lock' in line]
          if len(key_lines) != 1 or 'runner.os' not in key_lines[0] or 'mergecompile' not in key_lines[0].lower():
              fail('CACHE', 'ci cache key must bind OS, lockfile, and profile')
          if len(key_lines) == 1 and 'rust-toolchain.toml' not in key_lines[0]:
              fail('CACHE', 'ci cache key must bind the toolchain identity')
          if 'lookup-only' not in ci or 'fork' not in ci:
              fail('CACHE', 'ci must restore caches without saving for fork pull requests')

          # Event-specific cancellation and candidate binding: PR updates
          # cancel only their own PR line; main pushes and manual runs keep
          # terminal results; the exact candidate identity is recorded.
          cancel_match = re.search(r'(?m)^\s*cancel-in-progress:\s*(.+)$', ci)
          if not cancel_match or 'github.event_name' not in cancel_match.group(1):
              fail('CANCELLATION', 'ci cancel-in-progress must be event-specific (PR-only)')
          if 'github.event.pull_request.number' not in ci:
              fail('CANCELLATION', 'ci concurrency group must separate PR lines by number')
          if 'MERGE_COMPILE_BASE_SHA' not in ci or 'pull_request.base.sha' not in ci:
              fail('CANDIDATE', 'ci must bind the exact integration candidate identity')
          if 'HEAD^{tree}' not in ci:
              fail('CANDIDATE', 'ci must record the checked-out candidate tree')

          # Source-candidate identity by structure, not by frozen hash: the
          # candidate gate keeps its manual trigger, pinned actions, minimal
          # permissions, locked inputs, explicit harness execution, and
          # source-only proof ceiling without freezing its exact bytes, so a
          # reviewed lock or binding edit does not read as an identity break.
          # No fixed hash and no fixed issue set carries authority here.
          if on_children(sc_text) != {'workflow_dispatch'}:
              fail('CANDIDATE', 'source-candidate.yml trigger identity changed')
          # Action identity is read by the common verifier, so every `uses:`
          # spelling it judges is judged here too (same-line value, block
          # mapping, flow mapping) instead of only the same-line form.
          for line_no, ref in _owner.iter_action_references_in_text(sc_text):
              if ref.startswith('./'):
                  continue
              if '@' not in ref or not re.fullmatch(r'[0-9a-fA-F]{40}', ref.split('@', 1)[1]):
                  fail('CANDIDATE', f'source-candidate.yml line {line_no} action is not full-SHA pinned: {ref}')
          for line_no, line in enumerate(sc_text.splitlines(), start=1):
              # Quoted prose (e.g. failure-message literals) is not a gate
              # invocation; only unquoted cargo check/clippy/test/build/metadata
              # commands must carry --locked.
              code = re.sub(r'"[^"]*"', '', line)
              code = re.sub(r"'[^']*'", '', code)
              if re.search(r'cargo\s+(check|clippy|test|build|metadata)\b', code) and '--locked' not in code:
                  fail('CANDIDATE', f'source-candidate.yml line {line_no} cargo gate is not --locked')
          if 'contents: read' not in sc_text:
              fail('CANDIDATE', 'source-candidate.yml lost minimal contents: read permissions')
          for marker in ('persist-credentials: false', '--locked-mode', 'rustup show active-toolchain'):
              if marker not in sc_text:
                  fail('CANDIDATE', f'source-candidate.yml lost locked-input marker: {marker}')
          if 'apps/Eliot.Operator/Eliot.Operator.csproj' in sc_text and not operator_harness_executed(sc_text):
              fail('CANDIDATE', 'source-candidate.yml builds Eliot.Operator without executing the Operator harness')
          if 'SOURCE_CANDIDATE_ONLY' not in sc_text:
              fail('CANDIDATE', 'source-candidate.yml lost its source-only proof ceiling marker')
          if 'CONTRACT_CHALLENGE' not in sc_text:
              fail('CANDIDATE', 'source-candidate.yml lost its fail-closed live-scenario challenge')

          if failures:
              for item in failures:
                  print(item)
              raise SystemExit(1)
          print(f'REPOSITORY_POLICY_WIRING: PASS workflows={len(workflows)} candidate=structural')
          PY

      - name: Record repository-policy run manifest
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .github/workflows/repository-policy.yml | cut -d' ' -f1)"
          pair_sha="$(sha256sum docs/normative-pair.toml | cut -d' ' -f1)"
          active_sha="$(sha256sum workstreams/ACTIVE.toml | cut -d' ' -f1)"
          inventory_sha="$(sha256sum workstreams/core-daemons/inventory.json | cut -d' ' -f1)"
          python scripts/verify-github-workflows.py --root . --json-out "$RUNNER_TEMP/gwf-actions.json"
          actions_row="$(python - "$RUNNER_TEMP/gwf-actions.json" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('status') != 'pass':
              raise SystemExit('GITHUB_WORKFLOWS_MANIFEST_REJECTED: verifier payload status is not pass')
          seen = []
          for entry in payload.get('actions', []):
              if entry.get('workflow') == '.github/workflows/repository-policy.yml':
                  item = str(entry.get('action', '')) + '@' + str(entry.get('ref', ''))
                  if item not in seen:
                      seen.append(item)
          if not seen:
              raise SystemExit('GITHUB_WORKFLOWS_MANIFEST_REJECTED: derived record holds no action identities for repository-policy.yml')
          print(', '.join(seen))
          PY
          )"
          {
            echo '### Manual Repository Policy Run Manifest'
            echo "- Repository: $GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME ref=$GITHUB_REF run=$GITHUB_RUN_ID"
            echo "- Source SHA: $source_sha"
            echo "- Workflow: .github/workflows/repository-policy.yml sha256=$workflow_sha"
            echo "- Actions: $actions_row"
            echo "- Policy inputs: normative-pair=$pair_sha ACTIVE=$active_sha inventory=$inventory_sha"
            echo '- Ordered checks: branch identity, authority receipts, retired-surface rejection, normative identity, stale-link rejection, trigger/profile/privilege/cache/candidate wiring'
            echo '- Gate states: fail-fast job; this manifest runs only after every prior step passed'
            echo '- Cache: no cache block; nothing is restored or saved'
            echo '- Proof ceiling: source/repository policy evidence only; no runtime, Store, release, or Product-Pulse claim'
          } >> "$GITHUB_STEP_SUMMARY"
