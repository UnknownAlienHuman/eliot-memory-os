name: Manual Repository Policy Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-and-authority-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate branch identity, issue, and current-main ancestry
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pattern='^(work|fix|docs|chore|refactor|test)/([0-9]+)-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ "$HEAD_BRANCH" == 'main' ]]; then
            exit 0
          fi

          if [[ ! "$HEAD_BRANCH" =~ $pattern ]]; then
            echo "Branch '$HEAD_BRANCH' is not issue-numbered."
            echo "Use <work|fix|docs|chore|refactor|test>/<issue>-<slug>."
            exit 1
          fi

          issue_number="${BASH_REMATCH[2]}"
          issue_state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq '.state')"
          issue_is_pr="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --jq 'has("pull_request")')"
          if [[ "$issue_state" != 'open' || "$issue_is_pr" != 'false' ]]; then
            echo "Branch issue #${issue_number} is not an open issue."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Current origin/main is not an ancestor of this branch."
            echo "Refresh from main before additional mutation or integration."
            exit 1
          fi

      - name: Validate authority receipts and active work registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          pair = tomllib.loads(pathlib.Path('docs/normative-pair.toml').read_text(encoding='utf-8'))
          active = tomllib.loads(pathlib.Path('workstreams/ACTIVE.toml').read_text(encoding='utf-8'))
          inventory = json.loads(pathlib.Path('workstreams/core-daemons/inventory.json').read_text(encoding='utf-8'))

          assert pair['status'] == 'accepted'
          assert pair['repository_authority_branch'] == 'main'
          assert active['authority_branch'] == 'main'
          assert active['branch_policy']['standard_branch_requires_open_issue'] is True
          assert active['branch_policy']['requires_current_main_ancestor'] is True
          assert active['branch_policy']['one_issue_one_branch_one_pr'] is True
          assert active['branch_policy']['unlisted_branch_mutation_allowed'] is False
          assert active.get('exception_branch', []) == []
          assert all(w['status'] == 'active' for w in active['workstream'])
          assert all(w['branch_strategy'] == 'fresh_per_issue_from_current_main' for w in active['workstream'])
          core_daemons = next(w for w in active['workstream'] if w['id'] == 'core-daemons')
          defect_sets = {}
          for field in ['confirmed_open_defect_refs', 'merged_source_fix_refs', 'forbidden_active_defect_refs']:
              if field in core_daemons:
                  defect_sets[field] = core_daemons[field]
          for name, refs in defect_sets.items():
              assert refs == sorted(set(refs)), f'{name} must be sorted and duplicate-free'
          names = list(defect_sets)
          for index, name in enumerate(names):
              for other_name in names[index + 1:]:
                  assert set(defect_sets[name]).isdisjoint(defect_sets[other_name]), (
                      f'{name} overlaps {other_name}'
                  )
          assert inventory['authority']['branch'] == 'main'

          # Validate #13 capability cell registry
          registry_path = pathlib.Path('workstreams/core-daemons/capability-cell-registry.contract.toml')
          if registry_path.is_file():
              reg = tomllib.loads(registry_path.read_text(encoding='utf-8'))
              assert reg.get('schema') == 'eliot.capability-cell-registry-implementation.v1'
              assert reg.get('issue') == 13

          # Legacy eliot-app: check metadata only if package exists; retirement under #1189 does not fail policy
          legacy_app_path = pathlib.Path('crates/eliot-app/Cargo.toml')
          if legacy_app_path.is_file():
              legacy_app = tomllib.loads(legacy_app_path.read_text(encoding='utf-8'))
              assert 'legacy' in legacy_app['package']['description'].lower()
              assert 'migration' in legacy_app['package']['description'].lower()

          required = [
              '.github/README.md',
              '.github/workflows/ci.yml',
              '.github/workflows/repository-policy.yml',
              '.github/workflows/source-candidate.yml',
              'scripts/README.md',
          ]
          for item in required:
              assert pathlib.Path(item).is_file(), item

          # Validate cognitive maps only if present; retirement under #1117 does not fail policy
          for cog_map in [
              'crates/smart/cognitive-wave-01.toml',
              'crates/smart/cognitive-wave-02.toml',
              'crates/smart/cognitive-edge-map.toml',
              'crates/smart/cognitive-donor-map.toml',
              'crates/smart/cognitive-crate-decisions.toml',
          ]:
              p = pathlib.Path(cog_map)
              if p.is_file():
                  data = tomllib.loads(p.read_text(encoding='utf-8'))
                  assert isinstance(data, dict)
          PY

      - name: Reject retired authority and campaign surfaces
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            '.eliot'
            '.codebase-memory'
            'research'
            'reports'
            'swarm'
            'docs/tasks'
            'docs/normative'
            'docs/conformance.toml'
            'docs/UNIMPLEMENTED.md'
            'docs/architecture/ELIOT_ARCHITECTURE_ENGLISH_FINAL_2026-08-28.md'
            'docs/architecture/ELIOT_IMPLEMENTATION_ENGLISH_FINAL_2026-08-28.md'
            'docs/operations/BRANCH_INTEGRATION_CLEANUP_HANDOFF_2026-08-28.md'
            'docs/operations/M5_OPERATIONS_RUNBOOK.md'
            'docs/operations/PRODUCTION_CUTOVER_RUNBOOK.md'
            'docs/operations/RUNTIME_LIVE_V3_HANDOFF_2026-08-22.md'
            'COGNITIVE_COMPLETION_RECOVERY_PROGRESS.md'
            'UL_PROGRESS.md'
            'crates/smart/.audit-probe'
            '.github/workflows/runtime017-primary.yml'
            '.github/workflows/candidate-release.yml'
            'scripts/gen-composition-roots.ps1'
            'scripts/verify-composition-roots.ps1'
            'scripts/gen-conformance.ps1'
            'scripts/verify-conformance.ps1'
            'scripts/gen-contour-cut.ps1'
            'scripts/verify-contour-cut.ps1'
            'scripts/gen-module-manifests.ps1'
            'scripts/verify-module-manifests.ps1'
            'scripts/gen-unimplemented.ps1'
            'scripts/verify-unimplemented.ps1'
            'scripts/measure-stu.ps1'
            'scripts/run-cognitive-field-certification.ps1'
            'scripts/run-runtime017-primary.ps1'
            'scripts/run-ul-cross-agent-certification.ps1'
            'scripts/test-m5-isolated-operations.ps1'
            'scripts/plan-eliot-production-cutover.ps1'
          )

          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Retired authority/campaign surface is present: $path"
              exit 1
            fi
          done

      - name: Verify canonical normative identity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-normative.ps1

      - name: Reject stale links in current routing surfaces
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            AGENTS.md
            WORKFLOW.md
            .github/README.md
            docs/README.md
            docs/ARCHITECTURE_CONTRACT.md
            docs/PROJECT_MAP.md
            docs/architecture/README.md
            docs/architecture/INDEX.md
            docs/operations/README.md
            crates/eliot-app/AGENTS.md
            scripts/README.md
            workstreams/README.md
            workstreams/ACTIVE.toml
            workstreams/core-daemons/AGENTS.md
          )

          if grep -nE 'reports/audit/|docs/normative/|RECOVERY_PROGRAM_v1|ELIOT_(ARCHITECTURE|IMPLEMENTATION)_ENGLISH_FINAL_2026-08-28|PR #26 is the sole active|candidate-release\.yml' "${files[@]}"; then
            echo 'Stale authority/reference detected in a current routing surface.'
            exit 1
          fi

      - name: Verify manual-only policy, profile wiring, least privilege, cache safety, source-candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import re

          failures = []

          def fail(area, detail):
              failures.append(f'POLICY_{area}_FAILURE: {detail}')

          def on_children(text):
              # Top-level `on:` mapping children by indentation (stdlib only).
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if re.fullmatch(r'on:\s*(#.*)?', line):
                      base = len(line) - len(line.lstrip(' '))
                      children = []
                      for follow in lines[i + 1:]:
                          if not follow.strip() or follow.strip().startswith('#'):
                              continue
                          indent = len(follow) - len(follow.lstrip(' '))
                          if indent <= base:
                              break
                          if indent == base + 2:
                              key = follow.strip().split(':')[0].strip()
                              if key:
                                  children.append(key)
                      return children
              return []

          workflow_dir = pathlib.Path('.github/workflows')
          workflows = sorted(workflow_dir.glob('*.yml'))
          if not workflows:
              fail('TRIGGER', 'no workflow files found')

          # Manual-only policy: every repository workflow dispatches by hand.
          for path in workflows:
              text = path.read_text(encoding='utf-8')
              children = on_children(text)
              if children != ['workflow_dispatch']:
                  fail('TRIGGER', f'{path.as_posix()} on-children={children}')

          ci = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          policy_text = pathlib.Path('.github/workflows/repository-policy.yml').read_text(encoding='utf-8')
          just = pathlib.Path('Justfile').read_text(encoding='utf-8')
          verify = pathlib.Path('scripts/verify.ps1').read_text(encoding='utf-8')

          # Exact wiring: one identical Review invocation, closed profiles only.
          review_invocation = 'pwsh -NoProfile -File scripts/verify.ps1 -Profile Review'
          if ci.count(review_invocation) != 1:
              fail('WIRING', 'ci.yml must invoke the Review profile exactly once')
          for occurrence in re.finditer(r'scripts/verify\.ps1[^\n]*', ci):
              if '-Profile Review' not in occurrence.group(0):
                  fail('WIRING', 'ci.yml has a verify.ps1 reference outside -Profile Review')
          for recipe, marker in (('verify', '-Profile Review'), ('verify-review', '-Profile Review'), ('verify-list', '-List')):
              block = re.search(rf'(?m)^{recipe}:\s*\n((?:[ \t]+[^\n]*\n?)+)', just)
              if not block or marker not in block.group(1):
                  fail('WIRING', f'Justfile {recipe} must select {marker}')
          verify_body = re.search(r'(?m)^verify:\s*\n((?:[ \t]+[^\n]*\n?)+)', just)
          if verify_body and '-Profile Quick' in verify_body.group(1):
              fail('WIRING', 'Justfile verify must not select the Quick profile')

          # Retained bounded baseline: just quick keeps its pinned oracle deps
          # (mirrors scripts/docs_closure_audit.py DOC-GATE-JUST) and never
          # carries Review-only markers.
          quick_match = re.search(r'(?m)^quick:\s*(.+)$', just)
          if not quick_match:
              fail('WIRING', 'Justfile has no quick recipe line')
          else:
              quick_deps = quick_match.group(1)
              for target in ('doc-code-conformance-self-test', 'doc-code-conformance'):
                  if target not in quick_deps:
                      fail('WIRING', f'just quick lost retained baseline target {target}')
              for banned in ('cargo-clippy-workspace', 'cargo-test-workspace', 'cargo-deny', '-Profile Review'):
                  if banned in quick_deps:
                      fail('WIRING', f'just quick must not carry Review-only marker {banned}')

          # verify.ps1 owns the closed profiles; retired skips stay rejected.
          if "[ValidateSet('Quick', 'Review')]" not in verify:
              fail('WIRING', 'verify.ps1 must own the closed Quick/Review profiles')
          if 'SkipCargoCheck' not in verify or 'VERIFY_REJECTED' not in verify:
              fail('WIRING', 'verify.ps1 must explicitly reject the retired skip switch')
          if 'SkipCargoCheck' in just or 'SkipCargoCheck' in ci:
              fail('WIRING', 'retired skip switch must not be wired in Justfile/ci.yml')

          # Review cargo tail order inside the single gate-definition owner.
          tail = [
              'cargo metadata --locked --no-deps --format-version 1',
              'cargo fmt --all -- --check',
              'cargo check --locked --workspace --all-targets',
              'cargo clippy --locked --workspace --all-targets -- -D warnings',
              'cargo test --locked --workspace',
              'cargo deny check',
          ]
          positions = [verify.find(anchor) for anchor in tail]
          if any(pos < 0 for pos in positions):
              fail('WIRING', 'Review cargo tail has a missing gate definition')
          elif any(later <= earlier for earlier, later in zip(positions, positions[1:])):
              fail('WIRING', 'Review cargo tail is out of order')

          # Least privilege on both owned workflows (checks run against file
          # content, so this step's own source must also stay clean).
          for name, text in (('ci.yml', ci), ('repository-policy.yml', policy_text)):
              if re.search(r':\s*write\b', text) or re.search(r':\s*admin\b', text):
                  fail('PRIVILEGE', f'{name} grants elevated capability')
              if 'persist-credentials: false' not in text:
                  fail('PRIVILEGE', f'{name} checkout must not persist credentials')
              if 'secret' + 's.' in text:
                  fail('PRIVILEGE', f'{name} references secret material')
              if 'id-' + 'token:' in text:
                  fail('PRIVILEGE', f'{name} requests OIDC authority')
              if 'continue-' + 'on-error' in text:
                  fail('WIRING', f'{name} must not soften gate failure')

          # Cache safety: key binds OS, lockfile, and profile; one ungated run.
          key_lines = [line for line in ci.splitlines() if 'hashFiles' in line and 'Cargo.lock' in line]
          if len(key_lines) != 1 or 'runner.os' not in key_lines[0] or 'review' not in key_lines[0].lower():
              fail('CACHE', 'ci cache key must bind OS, lockfile, and profile')

          # Source-candidate identity: hash and trigger identity unchanged.
          sc_path = pathlib.Path('.github/workflows/source-candidate.yml')
          sc_hash = hashlib.sha256(sc_path.read_bytes()).hexdigest()
          if sc_hash != '6a8aeacb02551762321bf2ee498952f46bebeb8ba56fcbd0a166e47f282ca82c':
              fail('CANDIDATE', 'source-candidate.yml hash changed')
          if on_children(sc_path.read_text(encoding='utf-8')) != ['workflow_dispatch']:
              fail('CANDIDATE', 'source-candidate.yml trigger identity changed')

          if failures:
              for item in failures:
                  print(item)
              raise SystemExit(1)
          print(f'REPOSITORY_POLICY_WIRING: PASS workflows={len(workflows)} candidate={sc_hash[:12]}')
          PY
