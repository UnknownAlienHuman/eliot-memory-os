name: Work 265 Rust Proof

on:
  push:
    branches:
      - work/265-swarm-model-catalogue-control

permissions:
  contents: write

jobs:
  coordinator-model-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/265-swarm-model-catalogue-control

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-265-${{ hashFiles('Cargo.lock') }}

      - name: Verify canonical Rust formatting
        run: cargo fmt -p eliot-agent-coordinator -- --check

      - name: Reconcile exact lock delta and compile
        shell: pwsh
        run: |
          cargo check -p eliot-agent-coordinator --all-targets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -ne 'Cargo.lock' })
          if ($unexpected.Count -gt 0) {
            git diff --check
            git diff
            throw "UNEXPECTED_GENERATED_CHANGE: $($unexpected -join ', ')"
          }

          if (-not (git diff --quiet -- Cargo.lock)) {
            Write-Host 'CARGO_LOCK_DELTA_BEGIN'
            git diff -- Cargo.lock
            Write-Host 'CARGO_LOCK_DELTA_END'

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'chore(swarm): reconcile coordinator lock entry [proof-bot]'
            git push origin HEAD:work/265-swarm-model-catalogue-control
          }

          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check coordinator with frozen lock
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved tree
        shell: pwsh
        run: |
          cargo fmt -p eliot-agent-coordinator -- --check
          if (-not (git diff --quiet)) {
            git diff --check
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
