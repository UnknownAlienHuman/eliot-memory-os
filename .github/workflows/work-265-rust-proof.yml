name: Work 265 Rust Proof

on:
  push:
    branches:
      - work/265-swarm-model-catalogue-control

permissions:
  contents: write

concurrency:
  group: work-265-rust-proof
  cancel-in-progress: true

jobs:
  coordinator-model-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/265-swarm-model-catalogue-control

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-265-${{ hashFiles('Cargo.lock') }}

      - name: Apply canonical Rust formatting
        run: cargo fmt -p eliot-agent-coordinator

      - name: Check coordinator
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Commit canonical formatting
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- crates/agent/eliot-agent-coordinator)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/agent/eliot-agent-coordinator
            git commit -m 'style(swarm): apply canonical Rust formatting [proof-bot]'
            git push origin HEAD:work/265-swarm-model-catalogue-control
          }
