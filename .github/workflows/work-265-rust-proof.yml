name: Work 265 Rust Proof

on:
  push:
    branches:
      - work/265-swarm-model-catalogue-control

permissions:
  contents: write

jobs:
  coordinator-model-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/265-swarm-model-catalogue-control

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-265-${{ hashFiles('Cargo.lock') }}

      - name: Apply structural Clippy fixes
        shell: pwsh
        run: |
          $utf8 = [Text.Encoding]::UTF8
          $sourcePath = 'crates/agent/eliot-agent-coordinator/src/model_control.rs'
          $source = [IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")

          $newQuota = $utf8.GetString([Convert]::FromBase64String(''))
          $quotaPattern = '(?s)    if !entry\.quota\.is_current\(now_unix_ms\) \{.*?^    \}\n(?=    if entry\.context_window)'
          $source, $quotaCount = [Text.RegularExpressions.Regex]::Replace($source, $quotaPattern, $newQuota, [Text.RegularExpressions.RegexOptions]::Multiline), 0
          if (-not $source.Contains($newQuota.TrimEnd("`n"))) {
            throw 'SOURCE_PATCH_FAILED: quota branch'
          }

          $newHealth = $utf8.GetString([Convert]::FromBase64String(''))
          $healthPattern = '(?s)#\[derive\(Clone, Debug, Eq, PartialEq, Serialize, Deserialize\)\]\n#\[serde\(deny_unknown_fields\)\]\npub struct AttemptHealthProjection \{.*?^\}\n\n(?=#\[derive\(Clone, Debug, Eq, PartialEq, Serialize, Deserialize\)\]\n#\[serde\(rename_all = "SCREAMING_SNAKE_CASE", tag = "kind"\)\]\npub enum SwarmControlCommandDraft)'
          $updated = [Text.RegularExpressions.Regex]::Replace($source, $healthPattern, $newHealth, [Text.RegularExpressions.RegexOptions]::Multiline)
          if ($updated -eq $source) {
            throw 'SOURCE_PATCH_FAILED: health projection'
          }
          [IO.File]::WriteAllText($sourcePath, $updated, [Text.UTF8Encoding]::new($false))

          $testsPath = 'crates/agent/eliot-agent-coordinator/src/model_control_tests.rs'
          $tests = [IO.File]::ReadAllText($testsPath).Replace("`r`n", "`n")
          $newAssertions = $utf8.GetString([Convert]::FromBase64String(''))
          $assertPattern = '(?m)^    assert!\(!projection\.eligible_for_new_work\);\n    assert!\(projection\.candidate_terminal_reconciled\);\n    assert!\(!projection\.automatic_finish\);\n    assert!\(!projection\.automatic_redispatch\);\n'
          $updatedTests = [Text.RegularExpressions.Regex]::Replace($tests, $assertPattern, $newAssertions)
          if ($updatedTests -eq $tests) {
            throw 'TEST_PATCH_FAILED: terminal assertions'
          }
          [IO.File]::WriteAllText($testsPath, $updatedTests, [Text.UTF8Encoding]::new($false))

      - name: Format candidate
        run: cargo fmt -p eliot-agent-coordinator

      - name: Commit exact candidate before proof
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/agent/eliot-agent-coordinator
          if (git diff --cached --quiet) {
            throw 'NO_STRUCTURAL_FIX_COMMITTED'
          }
          git commit -m 'fix(swarm): make attempt health state explicit [proof-bot]'
          git push origin HEAD:work/265-swarm-model-catalogue-control
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check coordinator
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved tree
        shell: pwsh
        run: |
          cargo fmt -p eliot-agent-coordinator -- --check
          if (-not (git diff --quiet)) {
            git diff --check
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
