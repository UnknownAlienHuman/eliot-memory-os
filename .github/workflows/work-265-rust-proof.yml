name: Work 265 Rust Proof

on:
  push:
    branches:
      - work/265-swarm-model-catalogue-control

permissions:
  contents: write

jobs:
  coordinator-model-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/265-swarm-model-catalogue-control

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-265-${{ hashFiles('Cargo.lock') }}

      - name: Apply fail-closed unknown-state fixes
        shell: pwsh
        run: |
          $sourcePath = 'crates/agent/eliot-agent-coordinator/src/model_control.rs'
          $source = [IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")

          $old = @('    BillingEvidenceStale,') -join "`n"
          $new = @('    BillingEvidenceStale,', '    BillingUnknown,') -join "`n"
          if (-not $source.Contains($old)) { throw 'PATCH_PRECONDITION: billing enum' }
          $source = $source.Replace($old, $new)

          $old = @(
            '    if !entry.billing.is_current(now_unix_ms) {',
            '        blockers.insert(DispatchBlocker::BillingEvidenceStale);',
            '    }',
            '    if entry.quota.is_current(now_unix_ms) {'
          ) -join "`n"
          $new = @(
            '    if !entry.billing.is_current(now_unix_ms) {',
            '        blockers.insert(DispatchBlocker::BillingEvidenceStale);',
            '    }',
            '    if entry.billing.class == BillingClass::Unknown {',
            '        blockers.insert(DispatchBlocker::BillingUnknown);',
            '    }',
            '    if entry.quota.is_current(now_unix_ms) {'
          ) -join "`n"
          if (-not $source.Contains($old)) { throw 'PATCH_PRECONDITION: billing blocker' }
          $source = $source.Replace($old, $new)

          $old = @('    ProcessMissing,', '    UnknownEffect,') -join "`n"
          $new = @('    ProcessMissing,', '    ProcessUnknown,', '    UnknownEffect,') -join "`n"
          if (-not $source.Contains($old)) { throw 'PATCH_PRECONDITION: process status enum' }
          $source = $source.Replace($old, $new)

          $old = @(
            '    } else if input.process == ProcessObservation::Exited {',
            '        AttemptLivenessStatus::ProcessMissing',
            '    } else if input.state == CoordinatedAttemptState::CancellationRequested {'
          ) -join "`n"
          $new = @(
            '    } else if input.process == ProcessObservation::Exited {',
            '        AttemptLivenessStatus::ProcessMissing',
            '    } else if input.process == ProcessObservation::Unknown {',
            '        AttemptLivenessStatus::ProcessUnknown',
            '    } else if input.state == CoordinatedAttemptState::CancellationRequested {'
          ) -join "`n"
          if (-not $source.Contains($old)) { throw 'PATCH_PRECONDITION: process status derivation' }
          $source = $source.Replace($old, $new)
          [IO.File]::WriteAllText($sourcePath, $source, [Text.UTF8Encoding]::new($false))

          $testsPath = 'crates/agent/eliot-agent-coordinator/src/model_control_tests.rs'
          $tests = [IO.File]::ReadAllText($testsPath).Replace("`r`n", "`n")

          $marker = @('#[test]', 'fn denied_selector_overrides_preferred_selector() -> TestResult {') -join "`n"
          $insert = @(
            '#[test]',
            'fn unknown_billing_is_not_dispatchable() {',
            '    let catalogue = snapshot(vec![entry(',
            '        "unknown-billing",',
            '        "provider-a",',
            '        "model-a",',
            '        "family-a",',
            '        BillingClass::Unknown,',
            '        QuotaDisposition::Available,',
            '        0,',
            '    )]);',
            '    let human_policy = policy(',
            '        preference(',
            '            ModelRole::Worker,',
            '            Vec::new(),',
            '            Vec::new(),',
            '            BTreeSet::from([BillingClass::Unknown]),',
            '            true,',
            '        ),',
            '        "revision-1",',
            '    );',
            '    assert!(matches!(',
            '        compile_model_selection(',
            '            &catalogue,',
            '            &human_policy,',
            '            ModelRole::Worker,',
            '            "selection-1",',
            '            NOW',
            '        ),',
            '        Err(ModelControlError::NoDispatchableRoute(ModelRole::Worker))',
            '    ));',
            '}',
            '',
            '#[test]',
            'fn denied_selector_overrides_preferred_selector() -> TestResult {'
          ) -join "`n"
          if (-not $tests.Contains($marker)) { throw 'TEST_PRECONDITION: billing test marker' }
          $tests = $tests.Replace($marker, $insert)

          $marker = @('#[test]', 'fn terminal_attempt_is_not_reported_live() -> TestResult {') -join "`n"
          $insert = @(
            '#[test]',
            'fn unknown_process_is_not_eligible_for_work() -> TestResult {',
            '    let mut input = telemetry(CoordinatedAttemptState::Running)?;',
            '    input.process = ProcessObservation::Unknown;',
            '    let projection = project_attempt_health(&input, NOW)?;',
            '    assert_eq!(projection.status, AttemptLivenessStatus::ProcessUnknown);',
            '    assert_eq!(',
            '        projection.work_eligibility,',
            '        AttemptWorkEligibility::Ineligible',
            '    );',
            '    assert!(projection.alerts.contains(&AttemptAlertCode::ProcessUnknown));',
            '    Ok(())',
            '}',
            '',
            '#[test]',
            'fn terminal_attempt_is_not_reported_live() -> TestResult {'
          ) -join "`n"
          if (-not $tests.Contains($marker)) { throw 'TEST_PRECONDITION: process test marker' }
          $tests = $tests.Replace($marker, $insert)
          [IO.File]::WriteAllText($testsPath, $tests, [Text.UTF8Encoding]::new($false))

      - name: Format candidate
        run: cargo fmt -p eliot-agent-coordinator

      - name: Commit exact candidate before proof
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/agent/eliot-agent-coordinator
          if (git diff --cached --quiet) { throw 'NO_FAIL_CLOSED_FIX_COMMITTED' }
          git commit -m 'fix(swarm): fail closed on unknown billing and process [proof-bot]'
          git push origin HEAD:work/265-swarm-model-catalogue-control
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check coordinator
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify proved Rust tree
        shell: pwsh
        run: |
          cargo fmt -p eliot-agent-coordinator -- --check
          $dirty = @(git diff --name-only -- Cargo.lock crates/agent/eliot-agent-coordinator)
          if ($dirty.Count -gt 0) {
            git diff --check -- Cargo.lock crates/agent/eliot-agent-coordinator
            git diff -- Cargo.lock crates/agent/eliot-agent-coordinator
            throw "PROOF_RUST_TREE_DIRTY: $($dirty -join ', ')"
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
