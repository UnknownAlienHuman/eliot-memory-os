name: Work 265 Rust Proof

on:
  push:
    branches:
      - work/265-swarm-model-catalogue-control

permissions:
  contents: write

jobs:
  coordinator-model-control:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/265-swarm-model-catalogue-control

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-265-${{ hashFiles('Cargo.lock') }}

      - name: Remove redundant direct hash dependency
        shell: pwsh
        run: |
          $sourcePath = 'crates/agent/eliot-agent-coordinator/src/model_control.rs'
          $source = [IO.File]::ReadAllText($sourcePath)
          $source = [Text.RegularExpressions.Regex]::Replace(
            $source,
            '(?m)^use sha2::\{Digest, Sha256\};\r?\n',
            ''
          )
          $old = 'Ok(format!("sha256:{:x}", Sha256::digest(bytes)))'
          $new = 'Ok(format!("sha256:{}", eliot_receipts::sha256_hex(&bytes)))'
          if (-not $source.Contains($old)) {
            throw 'SOURCE_PATCH_PRECONDITION_FAILED: canonical digest expression not found'
          }
          $source = $source.Replace($old, $new)
          [IO.File]::WriteAllText($sourcePath, $source, [Text.UTF8Encoding]::new($false))

          $cargoPath = 'crates/agent/eliot-agent-coordinator/Cargo.toml'
          $cargo = [IO.File]::ReadAllText($cargoPath)
          $cargo = [Text.RegularExpressions.Regex]::Replace(
            $cargo,
            '(?m)^sha2\.workspace = true\r?\n',
            ''
          )
          [IO.File]::WriteAllText($cargoPath, $cargo, [Text.UTF8Encoding]::new($false))

      - name: Apply canonical Rust formatting
        run: cargo fmt -p eliot-agent-coordinator

      - name: Commit exact candidate before proof
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/agent/eliot-agent-coordinator
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(swarm): reuse foundation hash contract [proof-bot]'
            git push origin HEAD:work/265-swarm-model-catalogue-control
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check coordinator
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved tree
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git diff --check
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
