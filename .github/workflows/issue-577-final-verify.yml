name: Temporary issue 577 final verification

on:
  push:
    branches:
      - fix/577-finalize-run
    paths:
      - .github/temporary/issue-577-run.txt

permissions:
  contents: write

concurrency:
  group: issue-577-final-verification
  cancel-in-progress: false

env:
  DOCS_SOURCE_SHA: c87fc05982916a8dfe46bc1b0095df97ae330411
  HELPER_SOURCE_SHA: ccd00cd7d5b1ebf90d86024b3caa948838e5508e
  CANDIDATE_BRANCH: fix/577-final-verified
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  RUST_BACKTRACE: '1'

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: candidate
          persist-credentials: true

      - name: Checkout immutable documentation repair
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_SOURCE_SHA }}
          fetch-depth: 0
          path: docs-source
          persist-credentials: false

      - name: Checkout immutable traceability helper
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HELPER_SOURCE_SHA }}
          fetch-depth: 1
          path: helper-source
          persist-credentials: false

      - name: Bind exact source identities
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate fetch --no-tags origin main
          base_main="$(git -C candidate rev-parse origin/main)"
          test "$(git -C candidate rev-parse HEAD)" = "$base_main"
          test "$(git -C docs-source rev-parse HEAD)" = "$DOCS_SOURCE_SHA"
          test "$(git -C helper-source rev-parse HEAD)" = "$HELPER_SOURCE_SHA"
          merge_base="$(git -C docs-source merge-base "$DOCS_SOURCE_SHA" "$base_main")"
          test "$merge_base" = "$base_main"
          echo "BASE_MAIN=$base_main" >> "$GITHUB_ENV"
          {
            echo "base_main=$base_main"
            echo "docs_source=$DOCS_SOURCE_SHA"
            echo "helper_source=$HELPER_SOURCE_SHA"
          } | tee candidate/.issue-577-identities.txt

      - name: Apply bounded documentation repair delta
        shell: bash
        run: |
          set -euo pipefail
          git -C docs-source diff --binary --full-index "$BASE_MAIN...$DOCS_SOURCE_SHA" > "$RUNNER_TEMP/issue-577-docs.patch"
          test -s "$RUNNER_TEMP/issue-577-docs.patch"
          git -C candidate apply --whitespace=error-all "$RUNNER_TEMP/issue-577-docs.patch"
          git -C candidate diff --name-only "$BASE_MAIN" | sort | tee candidate/.issue-577-doc-paths.txt

      - name: Apply complete tracked-Rust comment cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp helper-source/scripts/doc_code_conformance_lib/rust_comments.py candidate/scripts/doc_code_conformance_lib/rust_comments.py
          mkdir -p candidate/.github/temporary candidate/.eliot
          cp helper-source/.github/temporary/finalize_traceability.py candidate/.github/temporary/finalize_traceability.py
          cd candidate
          python .github/temporary/finalize_traceability.py 2>&1 | tee .eliot/traceability-cleanup.log
          rm -f .github/temporary/finalize_traceability.py
          rmdir .github/temporary 2>/dev/null || true

      - name: Remove all execution-only repository surfaces
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/issue-530-rerun-finalizer.yml \
            .github/workflows/issue-577-final-verify.yml \
            .github/temporary/issue-577-run.txt \
            .issue-577-identities.txt \
            .issue-577-doc-paths.txt
          rmdir .github/temporary 2>/dev/null || true

      - name: Install verification dependencies
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt 2>&1 | tee .eliot/pip-install.log

      - name: Regenerate committed package indexes
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python scripts/code_navigation.py sync-index --root . 2>&1 | tee .eliot/index-sync.log

      - name: Verify documentation, routing, indexes, and source references
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          {
            python -m compileall -q scripts
            python scripts/verify-doc-code-conformance.py --self-test
            python scripts/verify-doc-code-conformance.py --root . --json-out .eliot/doc-code-conformance.json
            python scripts/docs_shards.py self-test
            python scripts/docs_shards.py verify --root .
            python scripts/docs_router.py self-test
            python scripts/docs_router.py check --root .
            python scripts/docs_read.py self-test
            python scripts/code_navigation.py self-test
            python scripts/code_navigation.py check --root .
          } 2>&1 | tee .eliot/documentation-verification.log

      - name: Prove deterministic generators
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          before="$(git hash-object docs/code-navigation/PACKAGE_DOCS_INDEX.md docs/code-navigation/PROTOTYPE_DOCS_INDEX.md docs/architecture/INDEX.md docs/architecture/ROUTES.md | sha256sum | cut -d' ' -f1)"
          python scripts/code_navigation.py sync-index --root . > .eliot/index-resync.log
          after="$(git hash-object docs/code-navigation/PACKAGE_DOCS_INDEX.md docs/code-navigation/PROTOTYPE_DOCS_INDEX.md docs/architecture/INDEX.md docs/architecture/ROUTES.md | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          echo "GENERATOR_DETERMINISM: PASS digest=$after" | tee .eliot/generator-determinism.log

      - name: Prove non-comment Rust identity
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee .eliot/rust-code-projection.log
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from doc_code_conformance_lib.rust_comments import code_projection

          base = os.environ['BASE_MAIN']
          before_paths = {
              item for item in subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', base], text=True
              ).splitlines() if item.endswith('.rs')
          }
          after_paths = {
              item for item in subprocess.check_output(
                  ['git', 'ls-files'], text=True
              ).splitlines() if item.endswith('.rs')
          }
          if before_paths != after_paths:
              raise SystemExit(
                  f'Rust path set changed: missing={sorted(before_paths-after_paths)} '
                  f'added={sorted(after_paths-before_paths)}'
              )
          changed = []
          for relative in sorted(before_paths):
              before = subprocess.check_output(
                  ['git', 'show', f'{base}:{relative}']
              ).decode('utf-8')
              after = Path(relative).read_text(encoding='utf-8')
              if code_projection(before) != code_projection(after):
                  raise SystemExit(f'non-comment Rust projection changed: {relative}')
              if before != after:
                  changed.append(relative)
          Path('.eliot/comment-only-rust.txt').write_text(
              '\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8'
          )
          print(f'RUST_CODE_PROJECTION: PASS checked={len(before_paths)} changed={len(changed)}')
          PY

      - name: Run supported repository verification
        shell: pwsh
        working-directory: candidate
        run: |
          pwsh -NoProfile -File scripts/verify.ps1 *>&1 | Tee-Object .eliot/repository-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full workspace proof
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee .eliot/cargo-fmt.log
          cargo check --locked --workspace --all-targets 2>&1 | tee .eliot/cargo-check.log
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee .eliot/cargo-clippy.log
          cargo test --locked --workspace 2>&1 | tee .eliot/cargo-test.log
          git diff --check "$BASE_MAIN" 2>&1 | tee .eliot/diff-check.log

      - name: Enforce clean final tree
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(ci.yml repository-policy.yml source-candidate.yml)
          test "${workflows[*]}" = "${expected[*]}"
          test ! -e .github/temporary
          test ! -e ARCHIVE_LINK.md
          test "$(grep -c '^# ELIOT canonical topic index$' docs/architecture/INDEX.md)" -eq 1
          git status --short | tee .eliot/final-status-before-commit.txt
          git diff --name-only "$BASE_MAIN" | sort | tee .eliot/final-paths.txt

      - name: Publish one-parent verified candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          remote_main="$(git rev-parse origin/main)"
          test "$remote_main" = "$BASE_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .eliot
          tree="$(git write-tree)"
          message_file="$RUNNER_TEMP/issue-577-message.txt"
          cat > "$message_file" <<'MSG'
fix(docs): complete documentation closure and traceability

Complete package/front-door documentation routing, authoritative indexes, shard-size enforcement, idempotent topic-index generation, and plain Rust-comment traceability cleanup. Remove all temporary automation while preserving every non-comment Rust projection.

Closes #577.
Closes #530.
MSG
          candidate="$(git commit-tree "$tree" -p "$remote_main" < "$message_file")"
          git push --force origin "$candidate:refs/heads/$CANDIDATE_BRANCH"
          {
            echo "candidate=$candidate"
            echo "tree=$tree"
            echo "parent=$remote_main"
            echo "docs_source=$DOCS_SOURCE_SHA"
            echo "helper_source=$HELPER_SOURCE_SHA"
          } | tee .eliot/publication.txt
          {
            echo "candidate=$candidate"
            echo "tree=$tree"
            echo "parent=$remote_main"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-577-final-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: candidate/.eliot/
