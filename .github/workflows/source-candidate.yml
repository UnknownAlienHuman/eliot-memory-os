name: Manual Source Candidate Gate

on:
  workflow_dispatch:
    inputs:
      operator_audit_diagnostic:
        description: Branch-only non-authoritative Windows build and test diagnostics
        required: false
        default: false
        type: boolean
      operator_linker_probe:
        description: Branch-only native toolchain and Operator UI diagnostics
        required: false
        default: false
        type: boolean
      operator_ui_diagnostic:
        description: Also run the separate locked Operator build and headless harness
        required: false
        default: false
        type: boolean
      require_live_windows_scenarios:
        description: Require the live Windows scenario harness
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.operator_linker_probe && '-linker-probe' || '' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  source-candidate-gate:
    if: ${{ !inputs.operator_audit_diagnostic && !inputs.operator_linker_probe && !inputs.operator_ui_diagnostic }}
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify normative identity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-normative.ps1

      - name: Verify source identity
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: checked out $sourceSha but expected $env:GITHUB_SHA"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "SOURCE_SHA=$sourceSha"

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP\eliot-source-candidate-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Issue #1923 (I18.44): the key separates the entry by every
          # dimension that changes whether reusing it is safe — runner
          # platform/arch, dependency lock, toolchain, source manifests, and
          # the run's trust class. The source dimension hashes every workspace
          # member root the root manifest declares, workspace/tools/**
          # included. scripts/verify-github-workflows.py rejects a key that
          # drops one (GWF-020) or whose manifest globs miss a member root
          # (GWF-021).
          # The profile dimension now hashes scripts/verify.ps1 as well as this
          # workflow: the gate list and the profile admission this lane runs
          # live in that owner, so a change to either is a change to what this
          # cached entry was produced by. Before #1914 W4 the key bound only
          # this file, which meant a change to the executed gate set left the
          # key identical.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml', 'scripts/verify.ps1', '.github/workflows/source-candidate.yml') }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'bins/**/Cargo.toml', 'workspace/**/Cargo.toml') }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}-${{ github.event.pull_request.head.repo.fork && 'untrusted-fork' || 'trusted' }}

      # Issue #1914 W4 (I18.21:11, "no CI-only hidden verifier command list").
      # This workflow used to carry its own cargo/dotnet command list: a
      # `workflow_dispatch` of it ran fmt, check, clippy, test-with-safeguard,
      # build, locked Operator restore/build and the executed Operator harness
      # from these `run:` lines, in an order and under a command set no
      # versioned profile revision covered, and it emitted no shared-schema
      # evidence at all. That is precisely the CI-only verifier command list
      # I18.21 forbids, and it is why a successful run here could not be
      # compared with a local run.
      #
      # It is now a thin invoker. This file names no verifier command, no stage,
      # no toolchain flag and no order: it selects one closed profile, exactly
      # as ci.yml and integration.yml already do, and the one ordered
      # gate-definition owner (scripts/verify.ps1) performs the minimal
      # verifier/runner bootstrap build (I18.21:14) and then resolves its
      # closed profile alias through the same shared resolver every other lane
      # reaches. `Review` is the profile selected here because it is the
      # repository's documented manual source/release profile and it is already
      # what integration.yml dispatches; the all-target test run under the
      # nonzero-execution safeguard, the all-target build, and the locked
      # Operator restore/build that this file used to run itself are Review
      # stages in that owner now, unchanged.
      #
      # The locked NuGet inputs this lane depends on are restored by the owner
      # with `--locked-mode` against apps/Eliot.Operator/Eliot.Operator.csproj
      # and tests/Eliot.Operator.Tests/Eliot.Operator.Tests.csproj
      # packages.lock.json files; this file asserts that binding rather than
      # restating the command, so a reviewer reads the guarantee in one place
      # (the owner) instead of in a second copy of the gate order.
      - name: Run the governed source-candidate verification profile
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Profile Review

      # RESIDUAL, NAMED NOT HIDDEN (issue #1914 W4). The Operator harness
      # execution below is the one source-candidate verifier command no profile
      # revision covers. It cannot move into the profile owner because
      # scripts/verify-github-workflows.py:982-990 (GWF-006) and
      # .github/workflows/repository-policy.yml:439-441 both forbid the
      # test-executing `dotnet` subcommands anywhere in scripts/verify.ps1's
      # bytes, and that file is also the compile-only MergeCompile owner; both
      # checkers are outside this issue's mutable path scope. It stays here,
      # named and visible, and this issue's coverage of the lane is PARTIAL
      # until a profile-scoped spelling of that prohibition or a governed
      # Operator-harness stage exists. Deleting it would have dropped real
      # coverage, and keeping it silent is exactly the failure mode I18.21:11
      # forbids.
      - name: Execute Eliot.Operator test harness
        shell: pwsh
        run: |
          dotnet run --project tests/Eliot.Operator.Tests/Eliot.Operator.Tests.csproj -c Release --no-restore

      # The dependency-policy artifacts this run binds by digest below are
      # generated by the profile above — its offline-source dependency-policy
      # gate writes them to the same `.eliot/dependency-policy-artifacts/`
      # paths the release builder and `just dependency-policy-artifacts` use.
      # This step therefore only REPORTS the artifact receipt the owner
      # produced; it invokes no verifier of its own. The verifier's exit already
      # failed the profile above if it failed, and a missing artifact is reported
      # as missing here and refused by the binding step below, never restated as
      # a pass.
      - name: Dependency policy evidence
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Dependency policy evidence'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- verifier: the governed Review profile above (scripts/verify.ps1 -Profile Review); offline-source dependency-policy gate wrote these artifacts'
          if (Test-Path .eliot/dependency-policy-artifacts/sbom.json) {
            $sbom = Get-Content .eliot/dependency-policy-artifacts/sbom.json -Raw | ConvertFrom-Json
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('- receipt status: ' + $sbom.status + '; ceiling: ' + $sbom.proof_ceiling + '; digest: ' + $sbom.receipt_digest)
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- receipt artifact missing: the profile did not produce the offline-source artifacts'
          }

      # Issue #1923 (I18.44), artifact-to-release-hash binding. The three
      # dependency-policy artifacts are generated by the owner above, but
      # nothing bound their bytes to this run: the digest printed in the
      # previous step is the generator's self-declared `receipt_digest`, not a
      # digest recomputed over the file about to be attested, so a non-empty
      # but unrelated artifact id proved nothing. The identity of each of the
      # four supply-chain artifacts is computed HERE, over the exact bytes on
      # disk, and recorded with the source commit it was produced from. The
      # generator is not asked to restate anything and its own digest is not
      # reused; a missing artifact is a hard failure, never a skipped row.
      - name: Bind supply-chain artifacts to this run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = [ordered]@{
            sbom       = '.eliot/dependency-policy-artifacts/sbom.json'
            licenses   = '.eliot/dependency-policy-artifacts/licenses.json'
            advisories = '.eliot/dependency-policy-artifacts/advisories.json'
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          $bound = [ordered]@{
            schema    = 'eliot-supply-chain-artifact-binding-v1'
            source    = $sourceSha
            artifacts = [ordered]@{}
          }
          foreach ($name in $artifacts.Keys) {
            $path = $artifacts[$name]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "SUPPLY_CHAIN_BINDING_REJECTED: $name artifact was not produced at $path; the run cannot attest an artifact that does not exist"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -eq 0) {
              throw "SUPPLY_CHAIN_BINDING_REJECTED: $name artifact at $path is empty"
            }
            $sha256 = ([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes) |
                ForEach-Object { $_.ToString('x2') }) -join ''
            $bound.artifacts[$name] = [ordered]@{
              path   = $path
              bytes  = $bytes.Length
              sha256 = $sha256
            }
          }
          # Provenance is the fourth artifact the contract names. It is not a
          # generated file, so its binding is the source commit itself plus
          # the lock and toolchain identities that fix what the build
          # resolved; all three are hashed, not quoted.
          foreach ($identity in @('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml')) {
            if (-not (Test-Path -LiteralPath $identity -PathType Leaf)) {
              throw "SUPPLY_CHAIN_BINDING_REJECTED: provenance input $identity is missing"
            }
            $bytes = [System.IO.File]::ReadAllBytes($identity)
            $bound.artifacts["provenance:$identity"] = [ordered]@{
              path   = $identity
              bytes  = $bytes.Length
              sha256 = ([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes) |
                  ForEach-Object { $_.ToString('x2') }) -join ''
            }
          }
          $boundPath = Join-Path $env:RUNNER_TEMP 'supply-chain-binding.json'
          # UTF-8 without a BOM: Windows PowerShell's `Set-Content -Encoding
          # utf8` prepends one, and a BOM ahead of the leading `{` is not
          # valid JSON for several readers, so the record is written through
          # the BCL, which emits exactly the bytes the manifest step reads.
          [System.IO.File]::WriteAllText(
            $boundPath,
            ($bound | ConvertTo-Json -Depth 6),
            [System.Text.UTF8Encoding]::new($false))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ELIOT_SUPPLY_CHAIN_BINDING=$boundPath"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Supply-chain artifact binding (I18.44)'
          foreach ($name in $bound.artifacts.Keys) {
            $entry = $bound.artifacts[$name]
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- " + $name + ": sha256=" + $entry.sha256 + " bytes=" + $entry.bytes + " path=" + $entry.path)
          }

      # Issue #1923 (I18.44), isolation fallback selection. A GitHub-hosted
      # windows-latest runner is a shared, mutable, single-tenant host: it
      # establishes no filesystem, network or ACL boundary for a build, and no
      # step in this workflow can make it establish one. This step therefore
      # does not assert local proof. It RECORDS which boundary was actually
      # reached, names the VM/lab fallback for the ones that were not, and
      # fails closed when the runner class is not the one the record admits —
      # so a later run on a genuinely isolated runner records proof, and a
      # run that silently lost its isolation records the fallback instead.
      - name: Select and record the build isolation disposition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Boundaries this contract names, and whether a shared GitHub-hosted
          # runner can establish any of them. Job Object process-lifetime
          # binding is explicitly NOT a filesystem or network sandbox.
          $unprovable = @(
            'filesystem_boundary'
            'network_boundary'
            'worktree_target_temp_acl_boundary'
          )
          $runnerImage = [string]$env:RUNNER_OS
          # GitHub publishes the runner's tenancy, not its OS, in
          # RUNNER_ENVIRONMENT ('github-hosted' for the shared images this
          # workflow's `runs-on:` selects, 'self-hosted' for a dedicated
          # image). The OS says nothing about isolation, so the decision reads
          # the tenancy variable and nothing else. Anything other than an
          # explicit 'self-hosted' is treated as shared and therefore
          # unprovable: an unset or unrecognised value is not evidence of
          # isolation, so the fallback is selected rather than skipped.
          $runnerEnvironment = [string]$env:RUNNER_ENVIRONMENT
          $hosted = $runnerEnvironment -ne 'self-hosted'
          $proved = @()
          if ($hosted) {
            $selected = 'github-hosted-shared-runner'
            $fallback = 'VM/lab isolated runner with exact-fingerprint cache and a dedicated worktree/target/temp root; rerun the build plane there to establish the filesystem, network and ACL boundaries'
            $status = 'UNPROVEN_FALLBACK_SELECTED'
          }
          else {
            $selected = 'self-hosted-isolated-runner'
            $fallback = ''
            $proved = $unprovable
            $status = 'ISOLATION_PROVEN'
          }
          $record = [ordered]@{
            schema          = 'eliot-build-isolation-disposition-v1'
            runner_class    = $selected
            runner_os       = $runnerImage
            runner_environment = $runnerEnvironment
            status          = $status
            proven_boundaries      = $proved
            unproven_boundaries    = @($unprovable | Where-Object { $proved -notcontains $_ })
            selected_fallback      = $fallback
            source          = (git rev-parse HEAD).Trim()
            note            = 'a Job Object binds process lifetime only; it is never filesystem or network isolation, so no entry here is satisfied by process containment'
          }
          $recordPath = Join-Path $env:RUNNER_TEMP 'build-isolation-disposition.json'
          [System.IO.File]::WriteAllText(
            $recordPath,
            ($record | ConvertTo-Json -Depth 6),
            [System.Text.UTF8Encoding]::new($false))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ELIOT_ISOLATION_DISPOSITION=$recordPath"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Build isolation disposition (I18.44)'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('- runner class: ' + $record.runner_class + ' (' + $record.runner_os + ')')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('- status: ' + $record.status)
          foreach ($boundary in $unprovable) {
            $held = $proved -contains $boundary
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- " + $boundary + ': ' + $(if ($held) { 'PROVEN' } else { 'UNPROVEN' }))
          }
          if (-not [string]::IsNullOrWhiteSpace($fallback)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('- selected fallback: ' + $fallback)
          }
          # Fail-closed: an unproven boundary is acceptable only because the
          # fallback is named. A disposition that leaves a boundary unproven
          # and names no fallback is not a disposition.
          if ($record.unproven_boundaries.Count -ne 0 -and [string]::IsNullOrWhiteSpace($fallback)) {
            throw 'ISOLATION_DISPOSITION_REJECTED: a boundary is unproven and no VM/lab fallback was selected; the run must not assert local proof it does not have'
          }

      - name: Record source-candidate ceiling and manifest
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Manual Source Candidate Run Manifest"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Source SHA: $sourceSha"
          $gwfJson = Join-Path $env:RUNNER_TEMP 'gwf-actions.json'
          python scripts/verify-github-workflows.py --root . --json-out $gwfJson
          if ($LASTEXITCODE -ne 0) { throw "GITHUB_WORKFLOWS_MANIFEST_REJECTED: common verifier failed; no action manifest is published" }
          $gwf = Get-Content -LiteralPath $gwfJson -Raw | ConvertFrom-Json
          if ($gwf.status -ne 'pass') { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: verifier payload status is not pass' }
          $derivedActions = @($gwf.actions | Where-Object { $_.workflow -eq '.github/workflows/source-candidate.yml' } | ForEach-Object { "$($_.action)@$($_.ref)" } | Select-Object -Unique)
          if ($derivedActions.Count -eq 0) { throw 'GITHUB_WORKFLOWS_MANIFEST_REJECTED: derived record holds no action identities for source-candidate.yml' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Actions: " + ($derivedActions -join ', '))
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Toolchain: pinned rust-toolchain.toml identity shown via rustup show active-toolchain (no latest installer)"
          # The gate list is no longer restated here. It is the one ordered
          # gate-definition owner's (scripts/verify.ps1 -Profile Review),
          # executed above, and this workflow selects that profile exactly as
          # ci.yml and integration.yml do. Recording the same stages here as
          # prose would be the second copy of an order the owner already fixes,
          # which is the thing issue #1914 W4 removed from this file.
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gate order: not restated in this file (issue #1914 W4); the single executed gate list and the single executed profile admission are the shared owner's, recorded in its VERIFY_GATE and VERIFY_PROFILE_* lines"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Profile: Review (sole gate-definition owner scripts/verify.ps1, closed Review profile); the versioned verification route is named only by its closed profile alias, resolved by the shared owner through eliot-profile-resolver, never as a command list"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Operator harness: executed by the step above; this workflow's remaining steps add no cargo or dotnet verifier command"
          # Issue #1923 (I18.44): the two records selected above are carried
          # into the release evidence itself, not left in the step log. A
          # per-artifact sha256 that is never restated next to the run manifest
          # is a note, not a binding; and an isolation disposition that names
          # a fallback nobody downstream can read is not a selection.
          $bindingPath = [string]$env:ELIOT_SUPPLY_CHAIN_BINDING
          if ([string]::IsNullOrWhiteSpace($bindingPath) -or -not (Test-Path -LiteralPath $bindingPath -PathType Leaf)) {
            throw 'RELEASE_EVIDENCE_REJECTED: the supply-chain artifact binding was not produced; no artifact identity reaches this manifest'
          }
          $binding = Get-Content -LiteralPath $bindingPath -Raw | ConvertFrom-Json
          if ($binding.source -ne $sourceSha) {
            throw "RELEASE_EVIDENCE_REJECTED: supply-chain binding names source $($binding.source) but this run built $sourceSha"
          }
          if ([int64]$binding.artifacts.sbom.bytes -le 0 -or
              [int64]$binding.artifacts.licenses.bytes -le 0 -or
              [int64]$binding.artifacts.advisories.bytes -le 0) {
            throw 'RELEASE_EVIDENCE_REJECTED: a bound supply-chain artifact carries a non-positive length, so its digest binds nothing'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Artifact-to-release-hash binding (I18.44)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- binding source: $($binding.source)"
          foreach ($name in @('sbom', 'licenses', 'advisories', 'provenance:Cargo.lock', 'provenance:rust-toolchain.toml', 'provenance:Cargo.toml')) {
            $entry = $binding.artifacts.$name
            if ($null -eq $entry) { throw "RELEASE_EVIDENCE_REJECTED: the release manifest has no binding for $name" }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- " + $name + " sha256=" + $entry.sha256 + " bytes=" + $entry.bytes)
          }
          $isolationPath = [string]$env:ELIOT_ISOLATION_DISPOSITION
          if ([string]::IsNullOrWhiteSpace($isolationPath) -or -not (Test-Path -LiteralPath $isolationPath -PathType Leaf)) {
            throw 'RELEASE_EVIDENCE_REJECTED: no build isolation disposition was recorded; the run must not assert local proof it does not have'
          }
          $isolation = Get-Content -LiteralPath $isolationPath -Raw | ConvertFrom-Json
          if ($isolation.source -ne $sourceSha) {
            throw "RELEASE_EVIDENCE_REJECTED: isolation disposition names source $($isolation.source) but this run built $sourceSha"
          }
          if (@($isolation.unproven_boundaries).Count -ne 0 -and [string]::IsNullOrWhiteSpace([string]$isolation.selected_fallback)) {
            throw 'RELEASE_EVIDENCE_REJECTED: an unproven isolation boundary reached this manifest with no fallback named'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Build isolation (I18.44)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- runner class: $($isolation.runner_class)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- status: $($isolation.status)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- unproven boundaries: " + (@($isolation.unproven_boundaries) -join ', '))
          if (-not [string]::IsNullOrWhiteSpace([string]$isolation.selected_fallback)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- selected VM/lab fallback: " + $isolation.selected_fallback)
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- isolation note: " + $isolation.note)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'SOURCE_CANDIDATE_ONLY'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No installed-runtime/store/Product-Pulse claim. No filesystem, network or ACL isolation is claimed on a GitHub-hosted runner; the VM/lab fallback above owns that boundary.'

      - name: Live Windows scenario contract challenge
        if: ${{ inputs.require_live_windows_scenarios }}
        shell: pwsh
        run: |
          Write-Error 'CONTRACT_CHALLENGE: the live Windows scenario harness is not integrated; no scenario success is claimed.'
          exit 1


  # Explicit user-authorized temporary audit mode. Never a Review, MergeCompile,
  # release, installed-runtime or Product acceptance receipt. Normal job unchanged.
  operator-audit-diagnostic:
    if: ${{ inputs.operator_audit_diagnostic && !inputs.operator_linker_probe && !inputs.operator_ui_diagnostic && !inputs.require_live_windows_scenarios && github.ref == 'refs/heads/Operator_tests' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Native Windows diagnostic build and tests (not governed acceptance)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'eliot-operator-audit-target'
          python scripts/operator-audit-diagnostic.py --output "$env:RUNNER_TEMP\eliot-operator-audit-evidence"
          exit $LASTEXITCODE
      - name: Preserve exact diagnostic commands, exits and logs
        if: always()
        # Official actions/upload-artifact v4.6.2 commit verified on upstream.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-audit-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eliot-operator-audit-evidence/
          if-no-files-found: error
          retention-days: 14

  operator-audit-ref-guard:
    if: ${{ ((inputs.operator_audit_diagnostic || inputs.operator_linker_probe || inputs.operator_ui_diagnostic) && (github.ref != 'refs/heads/Operator_tests' || inputs.require_live_windows_scenarios)) || (inputs.operator_audit_diagnostic && inputs.operator_linker_probe) || (inputs.operator_ui_diagnostic && !inputs.operator_linker_probe) }}
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Reject diagnostics outside the explicitly authorized branch
        shell: pwsh
        run: |
          Write-Error 'Operator diagnostics require Operator_tests, one diagnostic mode, and no live-scenario override.'
          exit 1


  operator-linker-probe:
    if: ${{ inputs.operator_linker_probe && !inputs.operator_audit_diagnostic && !inputs.require_live_windows_scenarios && github.ref == 'refs/heads/Operator_tests' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic native linker environment comparison (diagnostic only)
        shell: pwsh
        run: |
          python scripts/operator-linker-probe.py --output "$env:RUNNER_TEMP\operator-linker-probe-evidence"
          exit $LASTEXITCODE
      - name: Retain bounded diagnostic outcomes and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-linker-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-linker-probe-evidence/
          if-no-files-found: error
          retention-days: 14


  operator-ui-diagnostic:
    if: ${{ inputs.operator_linker_probe && inputs.operator_ui_diagnostic && !inputs.operator_audit_diagnostic && !inputs.require_live_windows_scenarios && github.ref == 'refs/heads/Operator_tests' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Locked Operator build and headless harness (diagnostic only)
        shell: pwsh
        run: |
          python scripts/operator-ui-diagnostic.py --output "$env:RUNNER_TEMP\operator-ui-diagnostic-evidence"
          exit $LASTEXITCODE
      - name: Retain bounded diagnostic outcomes and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-ui-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
