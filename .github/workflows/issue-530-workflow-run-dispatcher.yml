name: Temporary issue 530 workflow-run dispatcher

on:
  workflow_run:
    workflows:
      - One-shot documentation sharding
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: issue-530-workflow-run-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.workflow_run.id == 33308927062
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch documentation closure audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPO}/actions/workflows/docs-closure-audit.yml/dispatches" \
            -f ref=main \
            -f inputs[proof_base]=1fad3de311dc2add14c0f713c7c01ec55d4e4633 \
            -f inputs[source_sha]=46288765cb81905818c26272ab92d6f0c8fe5ab2 \
            -f inputs[candidate_branch]=fix/530-final-verified
