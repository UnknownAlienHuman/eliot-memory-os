name: Temporary clarification package proof

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-clarification-proof
  cancel-in-progress: true

jobs:
  clarification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read routed documentation
        run: |
          mkdir -p .eliot
          python scripts/docs_read.py read \
            --path crates/smart/eliot-dreamer-clarification \
            --topic "atomic clarification candidate and Human boundary" \
            --output .eliot/docs-read-bundle.md \
            --receipt-out .eliot/docs-read-receipt.json
          cat .eliot/docs-read-receipt.json
      - name: Verify clarification package
        run: |
          cargo fmt --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml -- --check
          cargo test --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets -- -D warnings
          cargo doc --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --no-deps
          git diff --check
