name: Temporary clarification proof

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-clarification-proof
  cancel-in-progress: true

jobs:
  package-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/630-dreamer-clarification
          fetch-depth: 1
      - name: Install pinned toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        shell: bash
        run: cargo fmt --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml -- --check
      - name: Test all targets
        shell: bash
        run: cargo test --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets
      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets -- -D warnings
      - name: Documentation
        shell: bash
        run: cargo doc --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --no-deps
      - name: Acceptance matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('crates/smart/eliot-dreamer-clarification/src')
          text = '\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*.rs'))
          cases = sorted({int(v) for v in re.findall(r'WORK_UNIT_CASE:\s*630/(\d+)', text)})
          assert cases == list(range(1, 40)), cases
          assert len(re.findall(r'#\[test\]', text)) >= 39
          assert 'fn valid_atomic_choice_question' in text
          assert 'fn crate_has_no_transport_provider_store_mutation_or_finish_path' in text
          PY
      - name: Diff whitespace
        shell: bash
        run: git diff --check
