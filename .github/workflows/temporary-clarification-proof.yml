name: Temporary clarification implementation proof

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-clarification-implementation-proof
  cancel-in-progress: true

jobs:
  package-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout clarification implementation
        uses: actions/checkout@v4
        with:
          ref: work/630-dreamer-clarification
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml -- --check
      - name: Test all targets
        run: cargo test --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --manifest-path crates/smart/eliot-dreamer-clarification/Cargo.toml --no-deps
      - name: Verify exact 39-case matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in Path('crates/smart/eliot-dreamer-clarification/src').rglob('*.rs')
          )
          cases = sorted({int(value) for value in re.findall(r'WORK_UNIT_CASE:\s*630/(\d+)', text)})
          tests = len(re.findall(r'#\[test\]', text))
          assert cases == list(range(1, 40)), cases
          assert tests == 39, tests
          PY
      - name: Diff whitespace
        run: git diff --check
