name: Temporary issue 530 exact rerun finalizer

on:
  workflow_run:
    workflows:
      - Repository Policy
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: issue-530-exact-rerun-finalizer
  cancel-in-progress: false

env:
  TRIGGER_RUN_ID: '33270584752'
  HELPER_SOURCE_SHA: ccd00cd7d5b1ebf90d86024b3caa948838e5508e
  CANDIDATE_BRANCH: fix/530-final-verified
  TEMP_WORKFLOW: .github/workflows/issue-530-rerun-finalizer.yml
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  finalize:
    if: >-
      github.event.workflow_run.id == 33270584752 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: candidate
          persist-credentials: true

      - name: Checkout immutable cleanup helper
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HELPER_SOURCE_SHA }}
          fetch-depth: 1
          path: helper-source
          persist-credentials: false

      - name: Bind trigger, helper, and current main
        shell: pwsh
        run: |
          if ('${{ github.event.workflow_run.id }}' -ne $env:TRIGGER_RUN_ID) {
            throw 'Unexpected workflow-run identity.'
          }
          $helper = (git -C helper-source rev-parse HEAD).Trim()
          if ($helper -ne $env:HELPER_SOURCE_SHA) {
            throw "Helper source identity mismatch: $helper"
          }
          git -C candidate fetch --no-tags origin main
          $main = (git -C candidate rev-parse origin/main).Trim()
          $head = (git -C candidate rev-parse HEAD).Trim()
          if ($head -ne $main) {
            throw "Candidate checkout is not exact current main: head=$head main=$main"
          }
          "BASE_MAIN=$main" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path candidate/.eliot | Out-Null
          "trigger_run=${{ github.event.workflow_run.id }}`nhelper=$helper`nbase=$main" | Out-File candidate/.eliot/identity.txt -Encoding utf8
          "trigger_run=${{ github.event.workflow_run.id }}" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "helper=$helper" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "base=$main" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Configure bounded build environment
        shell: pwsh
        run: |
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$temp\eliot-530-target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_INCREMENTAL=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install verification dependencies
        shell: pwsh
        working-directory: candidate
        run: |
          python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt *>&1 | Tee-Object .eliot/pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply complete tracked-Rust comment cleanup
        shell: pwsh
        run: |
          Copy-Item helper-source/scripts/doc_code_conformance_lib/rust_comments.py candidate/scripts/doc_code_conformance_lib/rust_comments.py -Force
          New-Item -ItemType Directory -Force -Path candidate/.github/temporary | Out-Null
          Copy-Item helper-source/.github/temporary/finalize_traceability.py candidate/.github/temporary/finalize_traceability.py -Force
          Push-Location candidate
          try {
            python .github/temporary/finalize_traceability.py *>&1 | Tee-Object .eliot/traceability-cleanup.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Remove execution-only surfaces before verification
        shell: pwsh
        run: |
          foreach ($path in @('candidate/.github/temporary/finalize_traceability.py', "candidate/$env:TEMP_WORKFLOW")) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }
          if ((Test-Path candidate/.github/temporary) -and -not (Get-ChildItem candidate/.github/temporary -Force)) {
            Remove-Item candidate/.github/temporary -Force
          }

      - name: Prove non-comment Rust identity
        shell: pwsh
        working-directory: candidate
        run: |
          @'
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from doc_code_conformance_lib.rust_comments import code_projection

          base = os.environ['BASE_MAIN']
          before_paths = {
              item
              for item in subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', base], text=True
              ).splitlines()
              if item.endswith('.rs')
          }
          after_paths = {
              item
              for item in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
              if item.endswith('.rs')
          }
          if before_paths != after_paths:
              raise SystemExit(
                  f'Rust path set changed: missing={sorted(before_paths-before_paths)} '
                  f'added={sorted(after_paths-before_paths)}'
              )
          changed = []
          for relative in sorted(before_paths):
              before = subprocess.check_output(['git', 'show', f'{base}:{relative}']).decode('utf-8')
              after = Path(relative).read_text(encoding='utf-8')
              if code_projection(before) != code_projection(after):
                  raise SystemExit(f'non-comment Rust projection changed: {relative}')
              if before != after:
                  changed.append(relative)
          Path('.eliot/comment-only-rust.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print(f'RUST_CODE_PROJECTION: PASS checked={len(before_paths)} changed={len(changed)}')
          '@ | python - *>&1 | Tee-Object .eliot/rust-code-projection.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce final mutable boundary
        shell: pwsh
        working-directory: candidate
        run: |
          $allowedNonRust = @(
            'config/doc-code-conformance.toml',
            'scripts/doc_code_conformance_lib/normative_references.py',
            'scripts/doc_code_conformance_lib/rust_comments.py',
            '.github/workflows/issue-530-rerun-finalizer.yml'
          )
          $paths = @(git diff --name-only $env:BASE_MAIN)
          $unexpected = @($paths | Where-Object { -not $_.EndsWith('.rs') -and $_ -notin $allowedNonRust })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected final paths: $($unexpected -join ', ')"
          }
          foreach ($required in $allowedNonRust[0..2]) {
            if ($required -notin $paths) {
              throw "Required final path absent: $required"
            }
          }
          if (Test-Path -LiteralPath $env:TEMP_WORKFLOW) {
            throw 'Temporary workflow leaked into candidate tree.'
          }
          $paths | Sort-Object | Out-File .eliot/final-paths.txt -Encoding utf8

      - name: Run documentation and repository gates
        shell: pwsh
        working-directory: candidate
        run: |
          python -m compileall -q scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-doc-code-conformance.py --self-test *>&1 | Tee-Object .eliot/documentation-gates.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-doc-code-conformance.py --root . --json-out .eliot/doc-code-conformance.json *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_shards.py self-test *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_shards.py verify --root . *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py self-test *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py check --root . *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_read.py self-test *>&1 | Tee-Object .eliot/documentation-gates.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/verify.ps1 *>&1 | Tee-Object .eliot/repository-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run workspace and diff proof
        shell: pwsh
        working-directory: candidate
        run: |
          cargo fmt --all -- --check *>&1 | Tee-Object .eliot/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --workspace --all-targets *>&1 | Tee-Object .eliot/cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p eliot-platform-windows --lib *>&1 | Tee-Object .eliot/platform-windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:BASE_MAIN *>&1 | Tee-Object .eliot/diff-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean one-parent candidate
        shell: pwsh
        working-directory: candidate
        run: |
          git fetch --no-tags origin main
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:BASE_MAIN) {
            throw "Main moved during verification: $remoteMain"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .eliot
          $tree = (git write-tree).Trim()
          $message = @(
            'fix(docs): retire invalid source traceability',
            '',
            'Clean the complete tracked Rust-comment denominator against current sharded documentation, validate plain Rust-comment handles, remove satisfied exact allowances, and preserve all non-comment Rust projections.',
            '',
            'Closes #530.',
            'Closes #766.'
          ) -join "`n"
          $candidate = ($message | git commit-tree $tree -p $remoteMain).Trim()
          git push --force origin "$candidate`:refs/heads/$($env:CANDIDATE_BRANCH)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "candidate=$candidate`nparent=$remoteMain`nhelper=$env:HELPER_SOURCE_SHA" | Out-File .eliot/publication.txt -Encoding utf8
          "candidate=$candidate" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload exact proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-530-exact-rerun-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: candidate/.eliot/
