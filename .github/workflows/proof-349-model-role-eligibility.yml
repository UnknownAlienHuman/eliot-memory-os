name: Proof 349 model role eligibility

on:
  push:
    branches:
      - fix/349-model-role-eligibility-current
    paths:
      - .github/workflows/proof-349-model-role-eligibility.yml

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/349-model-role-eligibility-current

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }
          git merge-base --is-ancestor 08b7690f0386b32f0623fd010808ce700f60cd87 HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'CURRENT_MAIN_NOT_ANCESTOR'
          }

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Apply fail-closed role membership guard
        shell: pwsh
        run: |
          $path = 'crates/agent/eliot-agent-coordinator/src/model_control.rs'
          $text = Get-Content -Raw -Path $path
          $old = '    if !entry.role_eligibility.is_empty() && !entry.role_eligibility.contains(&preference.role) {'
          $new = '    if !entry.role_eligibility.contains(&preference.role) {'
          if (($text.Split($old).Count - 1) -ne 1) {
            throw 'ROLE_ELIGIBILITY_ANCHOR_MISMATCH'
          }
          $text = $text.Replace($old, $new)
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($path, $text, $utf8)

          cargo fmt -p eliot-agent-coordinator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) {
            git status --short
            git diff --stat
            throw "UNEXPECTED_SOURCE_DELTA: $($changed -join ', ')"
          }
          if (Select-String -Path $path -SimpleMatch '!entry.role_eligibility.is_empty()') {
            throw 'EMPTY_ROLE_WILDCARD_REMAINS'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'fix(swarm): reject empty model role eligibility [skip ci]'
          git push origin HEAD:fix/349-model-role-eligibility-current
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check package formatting
        run: cargo fmt -p eliot-agent-coordinator -- --check

      - name: Check locked Rust graph
        run: cargo check --locked -p eliot-agent-coordinator --all-targets

      - name: Test coordinator
        run: cargo test --locked -p eliot-agent-coordinator --all-targets

      - name: Clippy coordinator
        run: cargo clippy --locked -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) {
            git status --short
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
