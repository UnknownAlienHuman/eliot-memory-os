name: Manual Source Candidate Gate

on:
  workflow_dispatch:
    inputs:
      require_live_windows_scenarios:
        description: Require the live Windows scenario harness
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: false
  RUST_BACKTRACE: 1

jobs:
  source-candidate-gate:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify normative identity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-normative.ps1

      - name: Verify source identity
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: checked out $sourceSha but expected $env:GITHUB_SHA"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "SOURCE_SHA=$sourceSha"

      - name: Configure Cargo environment
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP\eliot-source-candidate-target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_INCREMENTAL=0"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=4"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Workspace all-target check
        run: cargo check --workspace --all-targets --locked

      - name: Workspace all-target Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests with nonzero execution safeguard
        shell: pwsh
        run: |
          $testListOutput = @(& cargo test --workspace --all-targets --locked -- --list 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "TEST_LIST_FAILURE: cargo test -- --list exited $LASTEXITCODE"
          }

          $testOutput = @(& cargo test --workspace --all-targets --locked 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "TEST_EXECUTION_FAILURE: cargo test exited $LASTEXITCODE"
          }

          $listedTests = @(
            $testListOutput |
              ForEach-Object { "$_" } |
              Where-Object { $_ -match '^\s*.+:\s+test\s*$' }
          ).Count
          $executedTests = 0
          foreach ($line in $testOutput) {
            $text = "$line"
            if ($text -match 'test result: .*?(\d+) passed;\s+(\d+) failed;\s+(\d+) ignored;\s+(\d+) measured;') {
              $executedTests += [int]$Matches[1] + [int]$Matches[2]
            }
          }

          Write-Host "TEST_EVIDENCE: listed=$listedTests executed=$executedTests"
          if ($listedTests -eq 0 -or $executedTests -eq 0) {
            throw "TEST_CONTRACT_FAILURE: expected nonzero listed and executed tests"
          }

      - name: Workspace all-target build
        run: cargo build --workspace --all-targets --locked

      - name: Eliot.Operator Release build
        run: dotnet build apps/Eliot.Operator/Eliot.Operator.csproj -c Release

      - name: Record source-candidate ceiling
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'SOURCE_CANDIDATE_ONLY'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No installed-runtime/store/Product-Pulse claim.'

      - name: Live Windows scenario contract challenge
        if: ${{ inputs.require_live_windows_scenarios }}
        shell: pwsh
        run: |
          Write-Error 'CONTRACT_CHALLENGE: the live Windows scenario harness is not integrated; no scenario success is claimed.'
          exit 1
