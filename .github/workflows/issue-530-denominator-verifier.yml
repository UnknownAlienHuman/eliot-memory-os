name: Temporary issue 530 denominator verifier

on:
  push:
    branches:
      - fix/530-legacy-traceability-clean

permissions:
  contents: write
  actions: read

concurrency:
  group: issue-530-denominator-verifier
  cancel-in-progress: false

env:
  BASE_SHA: 4342a30672b800c47f24a99f17630da381b72824
  CANDIDATE_BRANCH: fix/530-final-verified
  RUNNER_WORKFLOW: .github/workflows/issue-530-denominator-verifier.yml
  HELPER: .github/temporary/finalize_traceability.py
  TRIGGER: .github/temporary/issue-530-run.txt
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[run-530-finalizer]')
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact base and source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:BASE_SHA) { throw "Branch parent differs from exact main base: $parent" }
          git fetch --no-tags origin main
          $main = (git rev-parse origin/main).Trim()
          if ($main -ne $env:BASE_SHA) { throw "Main moved before verification: $main" }
          "SOURCE_HEAD=$head" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path .eliot | Out-Null
          "source=$head`nbase=$main" | Out-File .eliot/identity.txt -Encoding utf8

      - name: Configure bounded build environment
        shell: pwsh
        run: |
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$temp\eliot-530-target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_INCREMENTAL=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install verification dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt *>&1 |
            Tee-Object .eliot/pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply denominator-driven comment cleanup
        shell: pwsh
        run: |
          python $env:HELPER *>&1 | Tee-Object .eliot/cleanup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove execution-only files before verification
        shell: pwsh
        run: |
          foreach ($path in @($env:HELPER, $env:TRIGGER, $env:RUNNER_WORKFLOW)) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          if ((Test-Path .github/temporary) -and -not (Get-ChildItem .github/temporary -Force)) {
            Remove-Item .github/temporary -Force
          }

      - name: Prove Rust executable projection identity
        shell: pwsh
        run: |
          @'
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from doc_code_conformance_lib.rust_comments import code_projection

          base = os.environ['BASE_SHA']
          before_paths = {
              p for p in subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', base], text=True
              ).splitlines() if p.endswith('.rs')
          }
          after_paths = {
              p for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
              if p.endswith('.rs')
          }
          if before_paths != after_paths:
              raise SystemExit(
                  f'Rust path set changed: missing={sorted(before_paths-after_paths)} '
                  f'added={sorted(after_paths-before_paths)}'
              )
          changed = []
          for relative in sorted(before_paths):
              before = subprocess.check_output(['git', 'show', f'{base}:{relative}']).decode('utf-8')
              after = Path(relative).read_text(encoding='utf-8')
              if code_projection(before) != code_projection(after):
                  raise SystemExit(f'non-comment Rust projection changed: {relative}')
              if before != after:
                  changed.append(relative)
          Path('.eliot/comment-only-rust.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print(f'RUST_CODE_PROJECTION: PASS checked={len(before_paths)} changed={len(changed)}')
          '@ | python - *>&1 | Tee-Object .eliot/rust-code-projection.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce issue 530 mutable boundary
        shell: pwsh
        run: |
          $allowedNonRust = @(
            'config/doc-code-conformance.toml',
            'scripts/doc_code_conformance_lib/normative_references.py',
            'scripts/doc_code_conformance_lib/rust_comments.py'
          )
          $paths = @(git diff --name-only $env:BASE_SHA)
          $unexpected = @($paths | Where-Object {
            -not $_.EndsWith('.rs') -and $_ -notin $allowedNonRust
          })
          if ($unexpected.Count -ne 0) { throw "Unexpected final paths: $($unexpected -join ', ')" }
          foreach ($required in $allowedNonRust) {
            if ($required -notin $paths) { throw "Required final path absent: $required" }
          }
          if ($paths | Where-Object { $_ -like '.github/*' -or $_ -like 'Cargo*' }) {
            throw 'Temporary or Cargo surface leaked into candidate'
          }
          $paths | Sort-Object | Out-File .eliot/final-paths.txt -Encoding utf8

      - name: Run documentation and repository gates
        shell: pwsh
        run: |
          python -m py_compile scripts/verify-doc-code-conformance.py scripts/doc_code_conformance_core.py scripts/doc_code_conformance_lib/*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commands = @(
            @('python', 'scripts/verify-doc-code-conformance.py', '--self-test'),
            @('python', 'scripts/verify-doc-code-conformance.py', '--root', '.', '--json-out', '.eliot/doc-code-conformance.json'),
            @('python', 'scripts/docs_shards.py', 'self-test'),
            @('python', 'scripts/docs_shards.py', 'verify', '--root', '.'),
            @('python', 'scripts/docs_router.py', 'self-test'),
            @('python', 'scripts/docs_router.py', 'check', '--root', '.'),
            @('python', 'scripts/docs_read.py', 'self-test')
          )
          foreach ($command in $commands) {
            & $command[0] $command[1..($command.Count - 1)] *>&1 |
              Tee-Object .eliot/documentation-gates.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pwsh -NoProfile -File scripts/verify.ps1 *>&1 | Tee-Object .eliot/repository-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run workspace proof and diff hygiene
        shell: pwsh
        run: |
          cargo fmt --all -- --check *>&1 | Tee-Object .eliot/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --workspace --all-targets *>&1 | Tee-Object .eliot/cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p eliot-platform-windows --lib *>&1 | Tee-Object .eliot/platform-windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:BASE_SHA *>&1 | Tee-Object .eliot/diff-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean one-parent candidate
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:BASE_SHA) { throw "Main moved during verification: $remoteMain" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .eliot
          $tree = (git write-tree).Trim()
          $message = @(
            'fix(docs): retire invalid source traceability',
            '',
            'Clean every tracked Rust comment against current sharded documentation, validate plain Rust-comment handles, remove satisfied exact allowances, and preserve all non-comment Rust projections.',
            '',
            'Closes #530.'
          ) -join "`n"
          $candidate = ($message | git commit-tree $tree -p $remoteMain).Trim()
          git push --force origin "$candidate`:refs/heads/$($env:CANDIDATE_BRANCH)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "candidate=$candidate`nparent=$remoteMain`nsource=$env:SOURCE_HEAD" | Out-File .eliot/publication.txt -Encoding utf8
          "candidate=$candidate" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-530-denominator-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: .eliot/
