name: Normalize final secret fixture formatting

on:
  push:
    branches:
      - fix/145-secret-scanning-fixtures
    paths:
      - .github/workflows/fix-145-indent.yml

permissions:
  contents: write

concurrency:
  group: fix-145-indent
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-secret-scanning-fixtures
          fetch-depth: 0

      - name: Normalize exact source block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              observed = text.count(old)
              if observed != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), observed {observed}: {old!r}"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          antigravity = "crates/eliot-engine/src/antigravity.rs"
          old_block = "\n".join([
              "        let jwt = [",
              "        [\"eyJhbGciOi\", \"JIUzI1NiJ9\"].concat(),",
              "        [\"eyJzdWIiOi\", \"JlbGlvdCJ9\"].concat(),",
              "        [\"signature\", \"bytes\"].concat(),",
              "    ]",
              "    .join(\".\");",
          ])
          new_block = "\n".join([
              "        let jwt = [",
              "            [\"eyJhbGciOi\", \"JIUzI1NiJ9\"].concat(),",
              "            [\"eyJzdWIiOi\", \"JlbGlvdCJ9\"].concat(),",
              "            [\"signature\", \"bytes\"].concat(),",
              "        ]",
              "        .join(\".\");",
          ])
          replace_exact(antigravity, old_block, new_block)

          for path in [
              "crates/eliot-app/src/host_runtime/tests.rs",
              antigravity,
          ]:
              replace_exact(path, "contains(&jwt)", "contains(jwt.as_str())")

          Path(".github/workflows/fix-145-indent.yml").unlink()
          PY

          git diff --check
          git add -A
          git commit -m "test(security): finalize fixture formatting"
          git push origin HEAD:fix/145-secret-scanning-fixtures
