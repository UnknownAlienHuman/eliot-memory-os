name: Temporary probe-plan documentation and package proof

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-probe-plan
  cancel-in-progress: true

jobs:
  probe-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: work/610-dreamer-probe-plan
          fetch-depth: 1
      - name: Read routed documentation
        run: |
          mkdir -p .eliot
          python scripts/docs_read.py read \
            --path crates/smart/eliot-dreamer-probe-plan \
            --path crates/smart/eliot-dreamer-contracts \
            --path crates/smart/eliot-dreamer-rival-model \
            --topic "bounded vector-preserving discriminative probe planning and owner-neutral rival projection" \
            --output .eliot/docs-read-bundle.md \
            --receipt-out .eliot/docs-read-receipt.json
          cat .eliot/docs-read-receipt.json
          cat .eliot/docs-read-bundle.md
      - name: Verify package
        run: |
          cargo fmt --manifest-path crates/smart/eliot-dreamer-probe-plan/Cargo.toml -- --check
          cargo test --manifest-path crates/smart/eliot-dreamer-probe-plan/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/smart/eliot-dreamer-probe-plan/Cargo.toml --all-targets -- -D warnings
          cargo doc --manifest-path crates/smart/eliot-dreamer-probe-plan/Cargo.toml --no-deps
          git diff --check
