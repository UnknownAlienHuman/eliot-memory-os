name: Temporary probe-plan documentation read

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: temporary-probe-plan-docs
  cancel-in-progress: true

jobs:
  docs-read:
    if: github.event.issue.number == 610 && github.event.comment.body == '/run-probe-plan-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: work/610-dreamer-probe-plan
          fetch-depth: 1
      - name: Read routed documentation
        run: |
          mkdir -p .eliot
          python scripts/docs_read.py read \
            --path crates/smart/eliot-dreamer-probe-plan \
            --topic "bounded vector-preserving discriminative probe planning without execution or authority" \
            --output .eliot/docs-read-bundle.md \
            --receipt-out .eliot/docs-read-receipt.json
          echo '=== RECEIPT ==='
          cat .eliot/docs-read-receipt.json
          echo '=== BUNDLE ==='
          cat .eliot/docs-read-bundle.md
