name: Documentation Closure Audit

on:
  push:
    branches:
      - docs/508-normative-index-binding
  issues:
    types: [opened]
  workflow_run:
    workflows:
      - Work 140 Codex stable wire proof
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: docs-closure-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-documentation-audit:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[docs-closure-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bounded verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt

      - name: Run independent and repository-owned documentation checks
        id: checks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p .eliot/docs-closure-audit/logs
          failures=0

          run_check() {
            name="$1"
            shift
            echo "::group::$name"
            "$@" >".eliot/docs-closure-audit/logs/${name}.log" 2>&1
            status=$?
            cat ".eliot/docs-closure-audit/logs/${name}.log"
            echo "::endgroup::"
            printf '%s\t%s\n' "$name" "$status" >> .eliot/docs-closure-audit/command-status.tsv
            if [[ "$status" -ne 0 ]]; then
              failures=1
            fi
          }

          run_check python-compile python -m py_compile \
            scripts/docs_closure_audit.py \
            scripts/docs_shards.py \
            scripts/docs_shards_core.py \
            scripts/docs_router.py \
            scripts/docs_router_core.py \
            scripts/docs_read.py \
            scripts/verify-doc-code-conformance.py \
            scripts/doc_code_conformance_core.py
          run_check git-fsck git fsck --full
          run_check closure-audit python scripts/docs_closure_audit.py \
            --root . \
            --report-dir .eliot/docs-closure-audit \
            --github-repository "$GITHUB_REPOSITORY"
          run_check docs-shards-self-test python scripts/docs_shards.py self-test
          run_check docs-shards python scripts/docs_shards.py verify --root .
          run_check docs-router-self-test python scripts/docs_router.py self-test
          run_check docs-router python scripts/docs_router.py check --root .
          run_check docs-read-self-test python scripts/docs_read.py self-test
          run_check doc-code-conformance-self-test python scripts/verify-doc-code-conformance.py --self-test
          run_check doc-code-conformance python scripts/verify-doc-code-conformance.py \
            --root . \
            --json-out .eliot/docs-closure-audit/doc-code-conformance.json
          run_check code-navigation-self-test python scripts/code_navigation.py self-test
          run_check code-navigation python scripts/code_navigation.py check \
            --root . \
            --json-out .eliot/docs-closure-audit/code-navigation.json
          run_check repository-policy python scripts/verify-repository-policy.py --root .
          run_check diff-check git diff --check
          run_check status-clean bash -lc 'test -z "$(git status --short --untracked-files=no)"'

          exit "$failures"

      - name: Upload documentation audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-closure-linux-${{ github.sha }}
          path: .eliot/docs-closure-audit/
          if-no-files-found: error
          retention-days: 14

  windows-repository-verification:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[docs-closure-audit]')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure bounded build environment
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'eliot-doc-closure-target'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$target"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_INCREMENTAL=0'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_BUILD_JOBS=4'

      - name: Install bounded verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt

      - name: Run supported Windows verification profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .eliot/docs-closure-audit | Out-Null
          & pwsh -NoProfile -File scripts/verify.ps1 *>&1 |
            Tee-Object -FilePath .eliot/docs-closure-audit/windows-verify.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build operator surface
        shell: pwsh
        run: |
          dotnet build apps/Eliot.Operator/Eliot.Operator.csproj --configuration Release *>&1 |
            Tee-Object -FilePath .eliot/docs-closure-audit/operator-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-closure-windows-${{ github.sha }}
          path: .eliot/docs-closure-audit/
          if-no-files-found: warn
          retention-days: 14
