name: Temporary issue 530 dispatcher

on:
  workflow_run:
    workflows:
      - Work 286 Current Rust Proof
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: issue-530-traceability-dispatch
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.workflow_run.id == 33328650908
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/530-normative-traceability
          fetch-depth: 0

      - name: Run bounded cleanup, verification, and publication
        shell: pwsh
        run: pwsh -NoProfile -File .github/temporary/run_traceability_cleanup.ps1

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-530-traceability-proof
          if-no-files-found: warn
          retention-days: 14
          path: |
            .eliot/normative-traceability-cleanup.json
            .eliot/doc-code-conformance.json
            .eliot/working-paths.txt
            .eliot/prepublish-paths.txt
            .eliot/final-paths.txt
            .eliot/publication.json
