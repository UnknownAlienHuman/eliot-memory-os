name: Temporary issue 530 dispatcher

on:
  workflow_run:
    workflows:
      - Work 140 Codex stable wire proof
    types: [completed]

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: issue-530-traceability-dispatch
  cancel-in-progress: false

env:
  ORIGINAL_BASE_SHA: 35a0c7de93c84489684adf7730dca236f8335162
  ORIGINAL_BASE_TREE: 9c79b86ea5dc050415b9b0e4079e8ffe410eb917
  BRANCH_NAME: fix/530-normative-traceability
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cleanup:
    if: github.event.workflow_run.id == 33330947385
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/530-normative-traceability
          fetch-depth: 0

      - name: Bind exact setup identity
        shell: pwsh
        run: |
          $setupHead = (git rev-parse HEAD).Trim()
          $base = (git merge-base HEAD $env:ORIGINAL_BASE_SHA).Trim()
          if ($base -ne $env:ORIGINAL_BASE_SHA) {
            throw "Branch does not descend from the declared base: $base"
          }
          "SETUP_HEAD=$setupHead" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "setup_head=$setupHead" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "original_base=$base" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Configure bounded build environment
        shell: pwsh
        run: |
          $testTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not [IO.Path]::IsPathFullyQualified($testTemp) -or -not (Test-Path -LiteralPath $testTemp -PathType Container)) {
            throw "Runner temp is not an existing absolute directory: $testTemp"
          }
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$testTemp\eliot-issue-530-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_INCREMENTAL=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install bounded verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-verification.txt

      - name: Apply comment-only cleanup and validator hardening
        shell: pwsh
        run: |
          python .github/temporary/traceability_cleanup.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --name-only | Out-File -FilePath .eliot/working-paths.txt -Encoding utf8

      - name: Remove branch-only execution files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .github/temporary/traceability_cleanup.py -Force
          Remove-Item -LiteralPath .github/workflows/issue-530-traceability-cleanup.yml -Force
          if ((Test-Path -LiteralPath .github/temporary) -and -not (Get-ChildItem -LiteralPath .github/temporary -Force)) {
            Remove-Item -LiteralPath .github/temporary -Force
          }

      - name: Enforce final mutable-path boundary
        shell: pwsh
        run: |
          $paths = @(git diff --name-only $env:ORIGINAL_BASE_SHA)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($paths.Count -lt 4) {
            throw "Expected a repository-wide comment cleanup; only $($paths.Count) paths changed"
          }
          foreach ($path in $paths) {
            $allowed = $path.EndsWith('.rs') -or $path -eq 'config/doc-code-conformance.toml' -or $path -eq 'scripts/doc_code_conformance_lib/normative_references.py' -or $path -eq 'scripts/doc_code_conformance_lib/rust_comments.py'
            if (-not $allowed) {
              throw "Unexpected final path: $path"
            }
          }
          if ($paths -contains '.github/temporary/traceability_cleanup.py' -or $paths -contains '.github/workflows/issue-530-traceability-cleanup.yml') {
            throw 'Temporary execution files remain in the final diff'
          }
          $paths | Sort-Object | Out-File -FilePath .eliot/final-paths.txt -Encoding utf8
          "final_paths=$($paths.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Compile Python verification code
        shell: pwsh
        run: python -m py_compile scripts/verify-doc-code-conformance.py scripts/doc_code_conformance_core.py scripts/doc_code_conformance_lib/*.py

      - name: Run documentation conformance self-test and audit
        shell: pwsh
        run: |
          python scripts/verify-doc-code-conformance.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-doc-code-conformance.py --root . --json-out .eliot/doc-code-conformance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify sharded documentation and routing
        shell: pwsh
        run: |
          python scripts/docs_shards.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_shards.py verify --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_router.py check --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/docs_read.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run supported repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1

      - name: Verify exact diff hygiene
        shell: pwsh
        run: |
          git diff --check $env:ORIGINAL_BASE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short | Out-File -FilePath .eliot/final-status.txt -Encoding utf8

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-530-traceability-proof
          if-no-files-found: warn
          retention-days: 14
          path: |
            .eliot/normative-traceability-cleanup.json
            .eliot/doc-code-conformance.json
            .eliot/working-paths.txt
            .eliot/final-paths.txt
            .eliot/final-status.txt

      - name: Publish one clean candidate commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) { throw 'No candidate changes are staged' }
          if ($staged -contains '.github/temporary/traceability_cleanup.py' -or $staged -contains '.github/workflows/issue-530-traceability-cleanup.yml') {
            throw 'Temporary files are staged for publication'
          }

          git fetch --no-tags origin main
          $remoteMain = (git rev-parse origin/main).Trim()
          $remoteTree = (git rev-parse "origin/main^{tree}").Trim()
          if ($remoteTree -ne $env:ORIGINAL_BASE_TREE) {
            throw "main content changed during verification: $remoteMain tree=$remoteTree"
          }

          git reset --soft $remoteMain
          git commit -m 'fix(docs): retire invalid normative traceability' -m 'Remove the nonexistent I2.2 and pre-sharding documentation identities from Rust comments, validate plain Rust comment handles against the canonical indexes, and remove only satisfied legacy allowances. Runtime tokens remain unchanged.' -m 'Closes #530.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = (git rev-parse HEAD).Trim()
          git push --force-with-lease="refs/heads/$($env:BRANCH_NAME):$($env:SETUP_HEAD)" origin "HEAD:refs/heads/$($env:BRANCH_NAME)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "candidate=$candidate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
