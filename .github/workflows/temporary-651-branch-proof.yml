name: Temporary 651 branch proof

on:
  push:
    branches:
      - work/651-implementation-brief

permissions:
  contents: read

concurrency:
  group: temporary-651-branch-proof
  cancel-in-progress: true

jobs:
  package-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Route documentation
        run: |
          mkdir -p .eliot
          python scripts/docs_read.py read \
            --path crates/smart/eliot-dreamer-implementation-brief \
            --topic "ArchitectureSelfQuery Implementation profile and evidence axes" \
            --output .eliot/docs-read-bundle.md \
            --receipt-out .eliot/docs-read-receipt.json
          cat .eliot/docs-read-receipt.json
      - name: Verify exact 39-case denominator
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('crates/smart/eliot-dreamer-implementation-brief/tests/implementation_brief.rs').read_text()
          cases = [int(value) for value in re.findall(r'WORK_UNIT_CASE:\s*651/(\d+)', text)]
          expected = list(range(1, 40))
          if sorted(cases) != expected or len(cases) != len(set(cases)):
              raise SystemExit(f'case denominator mismatch: {cases}')
          tests = re.findall(r'#\[test\]\s*fn\s+([a-z0-9_]+)', text)
          if len(tests) != 39:
              raise SystemExit(f'expected 39 substantive tests, found {len(tests)}')
          print('exact 39-case denominator:', ','.join(map(str, sorted(cases))))
          PY
      - name: Run package proof
        run: |
          cargo fmt --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml -- --check
          cargo test --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml --all-targets -- -D warnings
          cargo doc --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml --no-deps
          git diff --check
