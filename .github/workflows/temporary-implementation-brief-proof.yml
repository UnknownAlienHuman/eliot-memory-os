name: Temporary implementation brief proof

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-implementation-brief-proof
  cancel-in-progress: true

jobs:
  implementation-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/651-implementation-brief
          fetch-depth: 1
      - name: Read routed documentation
        run: |
          mkdir -p .eliot
          python scripts/docs_read.py read \
            --path crates/smart/eliot-dreamer-implementation-brief \
            --topic "evidence-bound ImplementationBrief self-query projection" \
            --output .eliot/docs-read-bundle.md \
            --receipt-out .eliot/docs-read-receipt.json
          cat .eliot/docs-read-receipt.json
      - name: Compile implementation brief
        run: |
          cargo fmt --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml -- --check
          cargo check --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/smart/eliot-dreamer-implementation-brief/Cargo.toml --all-targets -- -D warnings
          git diff --check
