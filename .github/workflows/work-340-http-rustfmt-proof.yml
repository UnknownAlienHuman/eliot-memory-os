name: Work 340 OpenCode HTTP rustfmt proof

on:
  push:
    branches:
      - fix/340-opencode-http-rustfmt
    paths:
      - .github/workflows/work-340-http-rustfmt-proof.yml
      - crates/agent/eliot-agent-opencode/src/http.rs

permissions:
  contents: write

jobs:
  opencode-http-rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/340-opencode-http-rustfmt

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Apply exact rustfmt correction and persist it
        shell: pwsh
        run: |
          $path = 'crates/agent/eliot-agent-opencode/src/http.rs'
          rustfmt --edition 2024 $path
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) {
            git status --short
            git diff
            throw "UNEXPECTED_FORMAT_DELTA: $($changed -join ', ')"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'style(opencode): apply pinned rustfmt to HTTP test [skip ci]'
          git push origin HEAD:fix/340-opencode-http-rustfmt
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check package formatting
        run: cargo fmt -p eliot-agent-opencode -p eliot-agent-coordinator -- --check

      - name: Check locked Rust graph
        run: cargo check --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Test package and direct consumer
        run: cargo test --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Clippy package and direct consumer
        run: cargo clippy --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) {
            git status --short
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
