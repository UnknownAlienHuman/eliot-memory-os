name: Temporary issue 577 finalizer dispatcher

on:
  workflow_run:
    workflows:
      - Repository Policy
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: issue-577-finalizer-dispatcher
  cancel-in-progress: false

env:
  TRIGGER_RUN_ID: '33270374597'
  FINALIZER: .github/workflows/issue-577-workflow-run-finalizer.yml
  DISPATCHER: .github/workflows/issue-577-workflow-run-dispatcher.yml

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.id == 33270374597 &&
      github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact trigger and current main
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.workflow_run.id }}' = "$TRIGGER_RUN_ID"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Convert finalizer to explicit manual dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/issue-577-workflow-run-finalizer.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "on:\n  workflow_run:\n    workflows:\n      - Repository Policy\n    types: [completed]\n",
                  "on:\n  workflow_dispatch:\n",
              ),
              (
                  "  TRIGGER_RUN_ID: '33270584752'\n",
                  "",
              ),
              (
                  "  finalize:\n    if: >-\n      github.event.workflow_run.id == 33270584752 &&\n      github.event.workflow_run.run_attempt >= 2 &&\n      github.event.workflow_run.conclusion == 'success'\n    runs-on: windows-latest\n",
                  "  finalize:\n    runs-on: windows-latest\n",
              ),
              (
                  "          if ('${{ github.event.workflow_run.id }}' -ne $env:TRIGGER_RUN_ID) {\n            throw 'Unexpected workflow-run identity.'\n          }\n",
                  "",
              ),
              (
                  "          \"trigger_run=${{ github.event.workflow_run.id }}\" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append\n          \"trigger_attempt=${{ github.event.workflow_run.run_attempt }}\" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append\n",
                  "          \"trigger=workflow_dispatch\" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append\n",
              ),
              (
                  "            'candidate/.github/workflows/issue-577-workflow-run-finalizer.yml',\n",
                  "            'candidate/.github/workflows/issue-577-workflow-run-finalizer.yml',\n            'candidate/.github/workflows/issue-577-workflow-run-dispatcher.yml',\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'finalizer patch point count={count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FINALIZER"
          git commit -m 'ci(docs): arm issue 577 manual finalizer'
          git push origin HEAD:main

      - name: Dispatch exact current-main finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/issue-577-workflow-run-finalizer.yml/dispatches" \
              -f ref=main; then
              echo "FINALIZER_DISPATCH: PASS attempt=${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo 'FINALIZER_DISPATCH: FAIL'
          exit 1
