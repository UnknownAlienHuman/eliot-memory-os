name: Work 286 Rebased Rust Proof

on:
  push:
    branches:
      - work/286-opencode-catalogue-current
    paths:
      - .github/workflows/work-286-rebased-proof.yml
      - Cargo.lock
      - crates/agent/eliot-agent-opencode/**
      - crates/agent/eliot-agent-coordinator/**

permissions:
  contents: read

jobs:
  opencode-model-catalogue:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/286-opencode-catalogue-current

      - name: Verify exact source identity and bounded diff
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

          $allowed = @(
            '.github/workflows/work-286-rebased-proof.yml',
            'Cargo.lock',
            'crates/agent/eliot-agent-opencode/Cargo.toml',
            'crates/agent/eliot-agent-opencode/src/catalogue.rs',
            'crates/agent/eliot-agent-opencode/src/lib.rs'
          )
          $changed = @(git diff --name-only origin/main...HEAD)
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            git diff --stat origin/main...HEAD
            throw "UNEXPECTED_PR_DELTA: $($unexpected -join ', ')"
          }
          Write-Host "PROOF_SOURCE_SHA=$actual"

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check package formatting
        run: cargo fmt -p eliot-agent-opencode -p eliot-agent-coordinator -- --check

      - name: Check locked Rust graph
        run: cargo check --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Test collector and direct consumer
        run: cargo test --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Clippy collector and direct consumer
        run: cargo clippy --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) {
            git status --short
            git diff
            throw 'PROOF_TREE_DIRTY'
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
