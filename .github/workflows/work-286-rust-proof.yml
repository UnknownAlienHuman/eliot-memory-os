name: Work 286 Rust Proof

on:
  push:
    branches:
      - work/286-opencode-model-catalogue

permissions:
  contents: write

jobs:
  opencode-model-catalogue:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/286-opencode-model-catalogue

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "SOURCE_IDENTITY_FAILURE: $actual != $env:GITHUB_SHA"
          }

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-work-286-${{ hashFiles('Cargo.lock') }}

      - name: Normalize catalogue source
        shell: pwsh
        run: |
          $path = 'crates/agent/eliot-agent-opencode/src/catalogue.rs'
          $source = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $source = $source.Replace("use std::path::Path;`n`n", '')
          $source = [Text.RegularExpressions.Regex]::Replace(
            $source,
            'fn evidence_refs\(\s*groups: impl IntoIterator<Item = impl IntoIterator<Item = String>>,\s*\)',
            'fn evidence_refs(groups: Vec<Vec<String>>)'
          )
          $source = $source.Replace('evidence_refs([', 'evidence_refs(vec![')
          $source = [Text.RegularExpressions.Regex]::Replace(
            $source,
            '(?m)^    #\[serde\(default\)\]\n    output: Option<u64>,\n',
            ''
          )
          $source = $source.Replace(
            'use std::path::PathBuf;',
            'use std::path::{Path, PathBuf};'
          )

          $metadataPattern = '(?s)    fn metadata\(value: Value\) -> UnknownFields \{.*?^    \}\n\n    fn model'
          $metadataReplacement = @'
    fn metadata(value: Value) -> UnknownFields {
        value
            .as_object()
            .cloned()
            .unwrap_or_default()
            .into_iter()
            .collect()
    }

    fn model
'@.Replace("`r`n", "`n")
          $updated = [Text.RegularExpressions.Regex]::Replace(
            $source,
            $metadataPattern,
            $metadataReplacement,
            [Text.RegularExpressions.RegexOptions]::Multiline
          )
          if ($updated -eq $source) {
            throw 'SOURCE_PATCH_FAILED: metadata fixture'
          }
          $source = $updated
          $source = $source.Replace(
            'model.id.clone().expect("model id")',
            'model.id.clone().unwrap_or_else(|| "missing-model-id".to_owned())'
          )
          $source = $source.Replace(
            'let is_connected = connected.contains(provider.id.as_str()) || provider.connected == Some(true);',
            'let is_connected = connected.contains(provider.id.as_str()) || provider.connected.is_some_and(|value| value);'
          )

          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))

      - name: Format candidate
        run: cargo fmt -p eliot-agent-opencode -p eliot-agent-coordinator

      - name: Reconcile exact lock delta and compile
        shell: pwsh
        run: |
          cargo check -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $changed = @(git diff --name-only)
          $allowed = @(
            'Cargo.lock',
            'crates/agent/eliot-agent-opencode/src/catalogue.rs'
          )
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            git diff --check
            git diff
            throw "UNEXPECTED_GENERATED_CHANGE: $($unexpected -join ', ')"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/agent/eliot-agent-opencode/src/catalogue.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(swarm): normalize OpenCode catalogue edge [proof-bot]'
            git push origin HEAD:work/286-opencode-model-catalogue
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"

      - name: Check frozen Rust graph
        run: cargo check --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Test catalogue and consumer
        run: cargo test --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets

      - name: Clippy catalogue and consumer
        run: cargo clippy --locked -p eliot-agent-opencode -p eliot-agent-coordinator --all-targets -- -D warnings

      - name: Verify clean proved Rust tree
        shell: pwsh
        run: |
          cargo fmt -p eliot-agent-opencode -p eliot-agent-coordinator -- --check
          $dirty = @(git diff --name-only -- Cargo.lock crates/agent/eliot-agent-opencode crates/agent/eliot-agent-coordinator)
          if ($dirty.Count -gt 0) {
            git diff --check -- Cargo.lock crates/agent/eliot-agent-opencode crates/agent/eliot-agent-coordinator
            git diff -- Cargo.lock crates/agent/eliot-agent-opencode crates/agent/eliot-agent-coordinator
            throw "PROOF_RUST_TREE_DIRTY: $($dirty -join ', ')"
          }
          Write-Host "PROOF_SOURCE_SHA=$((git rev-parse HEAD).Trim())"
