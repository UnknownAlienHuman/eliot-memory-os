name: Temporary issue 577 dispatcher

on:
  workflow_run:
    workflows:
      - Repository Policy
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: issue-577-final-dispatcher
  cancel-in-progress: false

jobs:
  arm-and-dispatch:
    if: >-
      github.event.workflow_run.id == 33290232541 &&
      github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact rerun and current main
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.workflow_run.id }}' = '33290232541'
          test '${{ github.event.workflow_run.run_attempt }}' -ge 2
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Arm finalizer and remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/issue-530-rerun-finalizer.yml')
          text = path.read_text(encoding='utf-8')
          upgrade_step = """      - name: Upgrade exact package-index generators
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python scripts/code_navigation_lib/_upgrade_index_projection_v2.py 2>&1 | tee .eliot/package-index-generator-upgrade.log
          rm -f scripts/code_navigation_lib/_upgrade_index_projection_v2.py

"""
          replacements = [
              (
                  "on:\n  issue_comment:\n    types: [created]\n",
                  "on:\n  workflow_dispatch:\n",
              ),
              ("  issues: read\n", ""),
              ("  RUN_MARKER: ELIOT_RUN_577_FINAL_20260903_0215\n", ""),
              (
                  "  DOCS_SOURCE_SHA: c87fc05982916a8dfe46bc1b0095df97ae330411\n",
                  "  DOCS_SOURCE_SHA: 318c345ddc3a4ec69cf453698a93bb5f7b0892e9\n",
              ),
              (
                  "  verify-and-publish:\n    if: >-\n      github.event.issue.number == 577 &&\n      github.event.comment.body == 'ELIOT_RUN_577_FINAL_20260903_0215'\n    runs-on: ubuntu-latest\n",
                  "  verify-and-publish:\n    runs-on: ubuntu-latest\n",
              ),
              (
                  "          test '${{ github.event.comment.body }}' = \"$RUN_MARKER\"\n",
                  "",
              ),
              (
                  "            echo \"issue=577\"\n            echo \"comment_id=${{ github.event.comment.id }}\"\n",
                  "            echo \"issue=577\"\n            echo \"trigger=workflow_dispatch\"\n",
              ),
              (
                  "      - name: Apply complete tracked-Rust comment cleanup\n",
                  upgrade_step + "      - name: Apply complete tracked-Rust comment cleanup\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'finalizer patch point count={count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')
          PY
          rm -f .github/workflows/issue-577-codeql-dispatcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(docs): arm final documentation closure'
          git push origin HEAD:main

      - name: Dispatch finalizer from exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/issue-530-rerun-finalizer.yml/dispatches" \
              -f ref=main; then
              echo "FINALIZER_DISPATCH: PASS attempt=${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo 'FINALIZER_DISPATCH: FAIL'
          exit 1
